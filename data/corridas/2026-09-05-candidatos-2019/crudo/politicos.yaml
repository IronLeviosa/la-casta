# esquema de politicos.ts exige mandatos.min(1) y, si estado_actual.situacion =
# fuera_de_cargo, exige salida (con un cargo del cual haber salido). No hay mandato
# real que documentar y no se inventa uno para que pase el esquema: ver
# notas.md, sección candidatos_giro/hipotesis (no aplica) y el cuerpo de la nota bajo
# "Novick: conflicto de esquema" para el detalle. Este registro queda deliberadamente
# incompleto para que el editor decida cómo tratarlo.
