    notas_internas: >-
      La declaración "después" tiene una sola fuente (grupo
      montevideo-comm) y la frase clave ("no le dieron la información
      correcta") está en estilo indirecto. Con segunda fuente de otro grupo
      del 30/09/2022 pasa a publicado. La evidencia de la explicación tiene
      dos grupos (montevideo-comm y werthein-hochbaum).
