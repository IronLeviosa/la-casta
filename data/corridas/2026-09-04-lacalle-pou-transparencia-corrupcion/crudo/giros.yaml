- politico: lacalle-pou
  tema: transparencia-corrupcion
  _slug: antecedentes-astesiano-2022
  _investigacion:
    agente: revisar
    modelo: claude-fable-5-1
  declaracion_antes: lacalle-pou/2022-09-26-astesiano-no-tiene-antecedentes-penales
  declaracion_despues: lacalle-pou/2022-09-30-yo-no-les-miento
  cambio: cambio_parcial
  explicacion: justificado_por_contexto
  analisis: >-
    El 26 de setiembre de 2022, en la conferencia de prensa posterior a la
    detención de su jefe de custodia, dijo que Astesiano "no tiene
    antecedentes penales". El 28 y 29 de setiembre, Montevideo Portal (con
    confirmación atribuida al Ministerio del Interior) y El Observador
    informaron que Astesiano había sido procesado por estafa en 2002 y en
    2013, la segunda vez con cuatro meses de prisión, con una condena
    emitida en setiembre de 2014. El 30 de setiembre, en Maldonado, sostuvo
    que no mentía ("Me puedo equivocar, pero no les voy a mentir") y,
    consultado por los antecedentes, respondió, según Montevideo Portal,
    que de lo que está seguro es que no le dieron "la información
    correcta", y que había pedido el legajo de toda la custodia
    presidencial. Es cambio parcial: no repitió la afirmación del 26 ni la
    desmintió con esas palabras, pero admitió que pudo equivocarse y
    atribuyó el error a la información que recibió. La explicación se
    califica como justificada por contexto y no como reconocimiento
    explícito: el hecho externo entre las dos fechas es la publicación de
    los antecedentes por dos grupos de medios, y lo que él adujo fue una
    circunstancia (la información que le dieron), no que hubiera cambiado
    de posición; la frase sobre la información está en estilo indirecto en
    una sola fuente. Ya el 26 de setiembre había dicho que "uno siempre
    está sujeto a equivocaciones". El crítico coincide en cambio_parcial y
    propuso reconocido_explicitamente. Queda abierto qué mostraban los
    informes de 2020 y 2021 sobre Astesiano y por qué (investigación
    administrativa del Ministerio del Interior); la afirmación del 26
    tiene su chequeo propio en el Veracímetro.
