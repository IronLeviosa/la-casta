- politico: lacalle-pou
  tema: transparencia-corrupcion
  texto: >-
    Queremos que los ciudadanos nos controlen. Para eso vamos a publicar
    toda la información generada por la actividad del Estado y por los
    particulares que reciben y administran fondos públicos, con las únicas
    limitaciones que establecen las normas vigentes. Y vamos a ir más lejos
    todavía: vamos a crear canales de comunicación para recibir denuncias
    sobre casos de uso indebido de recursos públicos, en condiciones que
    salvarán el anonimato cuando así se solicite y respetando las
    garantías del debido proceso en relación a los hechos denunciados.
  fecha_promesa: 2019-04-08
  origen:
    nivel: textual
    fuentes:
      - url: https://lacallepou.uy/programa/mejorar-la-calidad-del-gasto/
        medio: lacallepou-uy
        fecha: 2019-04-08
        tipo: documento_oficial
        titulo: Mejorar la calidad del gasto — Programa de Gobierno
        cita: >-
          Acceso a la información y participación ciudadana. Queremos que
          los ciudadanos nos controlen. Para eso vamos a publicar toda la
          información generada por la actividad del Estado y por los
          particulares que reciben y administran fondos públicos, con las
          únicas limitaciones que establecen las normas vigentes. Y vamos a
          ir más lejos todavía: vamos a crear canales de comunicación para
          recibir denuncias sobre casos de uso indebido de recursos
          públicos, en condiciones que salvarán el anonimato cuando así se
          solicite y respetando las garantías del debido proceso en
          relación a los hechos denunciados.
        retrieved_at: 2026-09-04
  evidencias_candidatas:
    - fecha: 2022-11-25
      tipo: accion_de_gobierno
      efecto: en_contra
      descripcion: >-
        El propio Lacalle Pou reconoció haber pedido que se convocara una
        reunión en Torre Ejecutiva "a los efectos de tener una línea única
        de trabajo y acción"; él la ubicó "a fines de octubre, me parece
        que el 25 de octubre" de 2022, mientras que Ache y una captura de
        chat de WhatsApp difundida por Búsqueda la ubican el 25 de
        noviembre de 2022 (discrepancia de fecha no resuelta por el lote).
        Según la declaración de la exvicecanciller
        Carolina Ache ante la Fiscalía, en esa reunión el asesor
        presidencial Roberto Lafluf le pidió a ella y al subsecretario
        Guillermo Maciel que borraran mensajes de WhatsApp sobre el caso
        Marset, y luego le pidió que consiguiera otro escribano para
        rehacer el protocolo notarial sin esos mensajes; Ache se negó a
        esto último por considerar que era "cometer un delito". Tras esa
        negativa, Lafluf le dijo que debía consultar con el presidente; de
        acuerdo con la declaración de Ache, horas después la volvió a
        llamar y le dijo "¡Presenta todo como está!", y los documentos se
        presentaron el lunes siguiente en el juzgado. Ninguna fuente
        sostiene que Lacalle Pou haya pedido borrar mensajes ni haya
        estado presente en la reunión; él afirma que solo "pasó a saludar"
        sin llegar a los dos minutos.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/chats-sobre-marset-la-version-de-lacalle-sobre-la-reunion-en-torre-ejecutiva-y-lo-que-habia-dicho-ache-2023115151110/amp
            medio: el-observador
            fecha: 2023-11-05
            tipo: nota
            titulo: 'Chats sobre Marset: la versión de Lacalle sobre la reunión en Torre Ejecutiva y lo que había dicho Ache'
            cita: >-
              En esa reunión donde estaba efectivamente el subsecretario
              Maciel y Roberto Lafluf nos piden que borremos los mensajes
              de WhatsApp.
            retrieved_at: 2026-09-04
          - url: https://www.montevideo.com.uy/Noticias/Lacalle-sobre-reunion-en-piso-11-paso-a-saludar-y-Ache-creia-que-debia-presentar-chat-uc870265
            medio: montevideo-portal
            fecha: 2023-11-05
            tipo: nota
            titulo: 'Lacalle sobre reunión en piso 11: pasó "a saludar" y Ache "creía" que debía presentar chat'
            cita: >-
              De acuerdo con la versión de Ache, en esa reunión se le pidió
              a Maciel y a ella que borraran el chat que habían mantenido
              ambos sobre Marset y que hiciera constar por escribano que la
              conversación nunca existió.
            retrieved_at: 2026-09-04
