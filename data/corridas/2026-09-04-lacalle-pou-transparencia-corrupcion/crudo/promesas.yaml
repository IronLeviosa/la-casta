- politico: lacalle-pou
  tema: transparencia-corrupcion
  texto: >-
    Entendemos como un atributo fundamental de la transparencia el dar
    debido trámite a las observaciones, requerimientos de información o
    pedidos de informes que provengan de autoridad competente. Bajo esta
    premisa, la Agencia de Monitoreo y Evaluación de Políticas Públicas, a
    través de su área de Transparencia e Información, hará un seguimiento
    de todas las observaciones del Tribunal de Cuentas de la República,
    pedidos de Informe parlamentarios y solicitudes formuladas al amparo de
    la Ley N° 18.381, de Acceso a la Información Pública, dando cuenta en
    forma permanente a la Presidencia de la República de las situaciones
    que se aparten de lo establecido en las normas vigentes.
  fecha_promesa: 2019-04-08
  origen:
    nivel: textual
    fuentes:
      - url: https://lacallepou.uy/programa/mejorar-la-calidad-del-gasto/
        medio: lacallepou-uy
        fecha: 2019-04-08
        tipo: documento_oficial
        titulo: Mejorar la calidad del gasto — Programa de Gobierno
        cita: >-
          Contralor. Entendemos como un atributo fundamental de la
          transparencia el dar debido trámite a las observaciones,
          requerimientos de información o pedidos de informes que
          provengan de autoridad competente. Bajo esta premisa, la Agencia
          de Monitoreo y Evaluación de Políticas Públicas, a través de su
          área de Transparencia e Información, hará un seguimiento de
          todas las observaciones del Tribunal de Cuentas de la República,
          pedidos de Informe parlamentarios y solicitudes formuladas al
          amparo de la Ley N° 18.381, de Acceso a la Información Pública,
          dando cuenta en forma permanente a la Presidencia de la República
          de las situaciones que se aparten de lo establecido en las
          normas vigentes.
        retrieved_at: 2026-09-04
  evidencias_candidatas:
    - fecha: 2026-06-08
      tipo: dato_oficial
      efecto: neutral
      descripcion: >-
        La Jutep aceptó una denuncia presentada por un convencional del
        Partido Colorado que pide evaluar la consistencia y trazabilidad
        de la evolución patrimonial declarada por Lacalle Pou desde 2000
        hasta el fin de su presidencia en 2025; el propio denunciante
        aclaró que no busca imputar conductas irregulares, y al momento de
        esta corrida el directorio de la Jutep aún no había comenzado a
        analizar el expediente.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://montevideo.com.uy/Noticias/Jutep-evaluara-denuncia-de-convencional-colorado-a-Lacalle-por-sus-declaraciones-juradas-uc964999
            medio: montevideo-portal
            fecha: 2026-06-12
            tipo: nota
            titulo: Jutep evaluará denuncia de convencional colorado a Lacalle por sus declaraciones juradas
            cita: >-
              La Junta de Transparencia y Ética Pública (Jutep) recibió el
              8 de junio una denuncia que señala presuntas inconsistencias
              por parte del expresidente de la República Luis Lacalle Pou
              en la presentación de las declaraciones juradas a lo largo de
              su carrera pública.
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
