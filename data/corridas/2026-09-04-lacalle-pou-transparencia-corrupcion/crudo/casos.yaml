            retrieved_at: 2026-09-04
    - fecha: 2022-12-26
      etapa: investigacion
      descripcion: >-
        El presidente Lacalle Pou declara como testigo, no como indagado,
        ante la fiscal Fossati en la residencia de Suárez y Reyes; el
        contenido de su declaración se mantuvo reservado seis meses y se
