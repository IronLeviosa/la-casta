- nombre: Caso Astesiano
  _slug: astesiano
  _investigacion:
    agente: revisar
    modelo: claude-fable-5-1
  tipo: corrupcion
  temas: [transparencia-corrupcion, seguridad]
  eventos: [caso-astesiano]
  involucrados:
    - politico: lacalle-pou
      rol: bajo_su_mando
  resumen: >-
    Alejandro Astesiano, jefe de la custodia del presidente Luis Lacalle
    Pou, fue detenido el 25 de setiembre de 2022 en el marco de una
    investigación de la Fiscalía de Flagrancia por una red que falsificaba
    partidas de nacimiento para obtener pasaportes uruguayos para
    ciudadanos rusos. Fue imputado el 27 de setiembre de 2022 y condenado
    el 15 de febrero de 2023, en proceso abreviado, a cuatro años y seis
    meses de prisión, multa e inhabilitación para cargos públicos por
    asociación para delinquir, tráfico de influencias, conjunción del
    interés público con el privado y revelación de secreto; la Fiscalía le
    retiró el cargo de suposición de estado civil (falsificación de
    documento). Lacalle Pou nunca fue imputado ni indagado en esta causa:
    su única intervención procesal fue declarar como testigo ante la fiscal
    Gabriela Fossati el 26 de diciembre de 2022, en la residencia
    presidencial. Su vínculo con el caso es de responsabilidad jerárquica
    (Astesiano era funcionario bajo su mando) y político: el 26 de
    setiembre de 2022 dijo que Astesiano "no tiene antecedentes penales",
    afirmación contradicha días después por la prensa (ver chequeo), y
    asumió la responsabilidad de la contratación.
  estado_judicial:
    - fecha: 2022-09-25
      etapa: investigacion
      descripcion: >-
        Astesiano es detenido por orden de la fiscal de Flagrancia Gabriela
        Fossati y declara ante ella en el marco de una investigación por
        falsificación de documentos para la emisión de pasaportes a
        ciudadanos rusos.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/en-vivo-lacalle-pou-habla-en-conferencia-de-prensa-tras-detencion-del-jefe-de-custodia-2022926143441
            medio: el-observador
            fecha: 2022-09-26
            tipo: nota
            titulo: >-
              Lacalle Pou sobre detención de Astesiano, su custodia: "Si
              hubiese indicios, no le entrego lo más preciado, que es mi familia"
            cita: >-
              El hombre fue detenido este domingo y declara ante la fiscal
              de Flagrancia, Gabriela Fossati en el marco de una
              investigación por falsificación de documentos para la
              emisión de pasaportes rusos.
            retrieved_at: 2026-09-04
          - url: https://www.subrayado.com.uy/estoy-tan-sorprendido-como-ustedes-dijo-lacalle-pou-detencion-su-jefe-seguridad-n879914
            medio: subrayado
            fecha: 2022-09-26
            tipo: nota
            titulo: '"Estoy tan sorprendido como ustedes", dijo Lacalle Pou sobre detención de su jefe de seguridad'
            cita: >-
              La investigación que derivó en la detención del jefe de
              seguridad presidencial está a cargo de la fiscal de
              Flagrancia Gabriela Fosatti.
            retrieved_at: 2026-09-04
    - fecha: 2022-09-27
      etapa: formalizacion
      descripcion: >-
        Astesiano es imputado por asociación para delinquir y tráfico de
        influencias (según El Observador, también por un delito continuado
        de suposición de estado civil, cargo que la Fiscalía retiró después)
        y enviado a prisión preventiva por 30 días.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/investigan-si-a-lacalle-pou-le-ocultaron-los-antecedentes-de-astesiano-fa-analiza-acciones-parlamentarias-202292821300
            medio: el-observador
            fecha: 2022-09-29
            tipo: nota
            titulo: Investigan si a Lacalle le ocultaron los antecedentes de Astesiano; FA analiza acciones parlamentarias
            cita: >-
              Este martes fue imputado por un delito continuado de
              suposición de estado civil en reiteración real con delito de
              asociación para delinquir y tráfico de influencias.
            retrieved_at: 2026-09-04
          - url: https://www.montevideo.com.uy/Noticias/Astesiano-estuvo-cuatro-meses-preso-en-2013-por-un-delito-continuado-de-estafa-uc833884
            medio: montevideo-portal
            fecha: 2022-09-28
            tipo: nota
            titulo: Astesiano estuvo cuatro meses preso en 2013 por un delito continuado de estafa
            cita: >-
              Astesiano fue imputado el pasado martes por un delito de
              asociación para delinquir y un delito de tráfico de
              influencias. El excustodio deberá estar 30 días en prisión
              preventiva, mientras la fiscal Gabriela Fossati continúa las
