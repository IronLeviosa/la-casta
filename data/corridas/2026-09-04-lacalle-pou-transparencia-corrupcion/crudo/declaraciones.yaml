- politico: lacalle-pou
  tema: transparencia-corrupcion
  fecha: 2022-09-26
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    Tan sorprendido como ustedes estoy yo.
  resumen: >-
    Dijo estar tan sorprendido como la ciudadanía por la detención de su
    jefe de custodia personal, Alejandro Astesiano, imputado por integrar
    una red de falsificación de pasaportes, y afirmó que si hubiera tenido
    el más mínimo indicio de irregularidades no le habría confiado el
    cuidado de su familia.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.elobservador.com.uy/nota/en-vivo-lacalle-pou-habla-en-conferencia-de-prensa-tras-detencion-del-jefe-de-custodia-2022926143441
        medio: el-observador
        fecha: 2022-09-26
        tipo: nota
        titulo: >-
          Lacalle Pou sobre detención de Astesiano, su custodia: "Si
          hubiese indicios, no le entrego lo más preciado, que es mi familia"
        cita: >-
          Lacalle, y agregó que el funcionario "está incomunicado". Ante
          una pregunta respondió: "Si hubiera un más mínimo indicio, yo no
          le entregaría lo más preciado que tengo, que es mi familia".
        retrieved_at: 2026-09-04
      - url: https://www.subrayado.com.uy/estoy-tan-sorprendido-como-ustedes-dijo-lacalle-pou-detencion-su-jefe-seguridad-n879914
        medio: subrayado
        fecha: 2022-09-26
        tipo: nota
        titulo: '"Estoy tan sorprendido como ustedes", dijo Lacalle Pou sobre detención de su jefe de seguridad'
        cita: >-
          Por otra parte indicó que conoció al jefe de seguridad en 1999
          en una campaña. "Después lo vi en 2004, después 2014 y en 2019
          me acompañó en toda la campaña. Yo no le entrego lo más preciado
          que es mi familia a una persona que puede tener indicio que
          actúa por fuera de la ley", aseguró.
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: transparencia-corrupcion
  fecha: 2022-09-26
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    Astesiano "no tiene antecedentes penales" y que "todo el mundo es
    inocente hasta que se demuestre lo contrario".
  resumen: >-
    En la misma conferencia de prensa sobre la detención de su jefe de
    custodia, afirmó que Alejandro Astesiano no tenía antecedentes
    penales; tres días después la prensa informó que Astesiano había sido
    procesado por estafa en 2002 y en 2013 (esta última vez con prisión),
    con una condena emitida en setiembre de 2014, cuando ya trabajaba para
    Lacalle Pou.
