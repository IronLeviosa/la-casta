- politico: lacalle-pou
  tema: transparencia-corrupcion
  fecha: 2022-09-30
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    Yo no les miento, yo les digo la verdad.
  resumen: >-
    Sostuvo que dijo la verdad en su primera explicación pública sobre el
    caso Astesiano y que un presidente puede equivocarse pero no mentir.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.montevideo.com.uy/Noticias/Lacalle-sobre-Astesiano--Un-presidente-que-se-equivoca-pueden-tener-pero-que-miente-no--uc834074
        medio: montevideo-portal
        fecha: 2022-09-30
        tipo: nota
        titulo: 'Lacalle sobre Astesiano: "Un presidente que se equivoca pueden tener, pero que miente, no"'
        cita: >-
          “Yo no les miento, yo les digo la verdad”, sostuvo. “Me puedo
          equivocar, pero no les voy a mentir”, agregó.En ese sentido,
          destacó que esa actitud es “importante para con el país”, y
          sostuvo: “Un presidente que se equivoca pueden tener, pero que
          miente, no”.
