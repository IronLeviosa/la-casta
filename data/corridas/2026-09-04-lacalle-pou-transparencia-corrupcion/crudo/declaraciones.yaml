- politico: lacalle-pou
  tema: transparencia-corrupcion
  fecha: 2022-12-26
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    Yo estoy en el piso 11 y él en el 4. Insisto, yo no lo veía. No lo
    veía entre semana; capaz que pasaba una semana y pico sin verlo.
  resumen: >-
    Declaró como testigo ante la fiscal del caso Astesiano que no veía
    habitualmente a su jefe de custodia durante la semana, porque
    trabajaban en pisos distintos de la Torre Ejecutiva y prefería
    trasladarse sin él salvo en viajes puntuales.
  evidencia:
