- politico: lacalle-pou
  tema: transparencia-corrupcion
  fecha: 2022-12-26
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    No, indicaciones concretas, no. Puedo asumir de que se entendía que si
    llamaba Astesiano era como si hubiera pedido yo la información.
  resumen: >-
    Declaró como testigo ante la fiscal del caso Astesiano que no le dio
    indicaciones concretas a los entonces ministros del Interior sobre qué
    información debían brindarle a su jefe de custodia, pero agregó que
    podía asumirse que si llamaba Astesiano era como si él mismo hubiera
    pedido la información; ese último comentario fue usado casi un año
    después por otra fiscal como evidencia para pedir el sobreseimiento de
    la causa de un exjerarca policial.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.infobae.com/america/america-latina/2023/12/20/divulgaron-el-audio-de-la-declaracion-de-luis-lacalle-pou-en-el-caso-de-su-ex-custodio-condenado-yo-no-lo-veia/
        medio: infobae
        fecha: 2023-12-20
        tipo: nota
        titulo: 'Divulgaron el audio de la declaración de Luis Lacalle Pou en el caso de su ex custodio condenado: "Yo no lo veía"'
        cita: >-
          Lacalle Pou: No, indicaciones concretas, no. Puedo asumir de que
          se entendía que si llamaba Astesiano era como si hubiera pedido
          yo la información.Ese comentario del presidente uruguayo fue
          utilizado por la fiscal Sabrina Flores, que tomó el caso tras la
          salida de Fossati, como evidencia para pedir el sobreseimiento
          de la causa de un ex jerarca policial, informó el programa
          radial.
        retrieved_at: 2026-09-04
    _faltante: segunda_fuente
