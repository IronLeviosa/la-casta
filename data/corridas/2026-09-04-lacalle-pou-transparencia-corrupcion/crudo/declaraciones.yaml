  fecha: 2023-11-04
  contexto: gobierno
  cargo_en_ese_momento: presidente de la República
  cita: >-
    Pasé a saludar, no llegué a los dos minutos. Es acá arriba en el piso
    11. No participé de la reunión. Sí, fui yo el que pedí que se convoque
    a los efectos de tener una línea única de trabajo y acción.
