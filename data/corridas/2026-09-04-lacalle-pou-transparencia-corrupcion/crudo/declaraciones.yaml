        medio: infobae
        fecha: 2023-12-20
        tipo: nota
        titulo: 'Divulgaron el audio de la declaración de Luis Lacalle Pou en el caso de su ex custodio condenado: "Yo no lo veía"'
        cita: >-
          El presidente dijo desconocer que su custodio mantenía reuniones
          en la casa de gobierno (la Torre Ejecutiva). “Yo estoy en el
          piso 11 y él en el 4. Insisto, yo no lo veía. No lo veía entre
          semana; capaz que pasaba una semana y pico sin verlo”, declaró.
        retrieved_at: 2026-09-04
