  contexto: campaña
  cargo_en_ese_momento: precandidato a la presidencia (Partido Nacional)
  cita: >-
    “Dijimos que Uruguay estaba haciendo cosas muy feas. Dijimos que
    unos pocos al amparo y al calor del poder estaban haciendo mucho
    dinero, negocios hechos porque el gobierno les dio la posibilidad de
    hacer los negocios con sus amigos, muy cercanos al expresidente Mujica
    y a Tabaré Vázquez”, expresó.
