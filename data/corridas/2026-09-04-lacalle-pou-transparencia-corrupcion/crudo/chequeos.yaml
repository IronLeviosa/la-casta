- politico: lacalle-pou
  tema: transparencia-corrupcion
  _slug: astesiano-antecedentes-penales
  _investigacion:
    agente: revisar
    modelo: claude-fable-5-1
  declaracion: lacalle-pou/2022-09-26-astesiano-no-tiene-antecedentes-penales
  fecha: 2022-09-26
  afirmacion: >-
    Alejandro Astesiano, jefe de la custodia presidencial, "no tiene
    antecedentes penales" (conferencia de prensa del 26 de setiembre de
    2022).
  calificacion: discutible
  dato_real:
    valor: >-
      Según El Observador (29/09/2022) y Montevideo Portal (28/09/2022, con
      confirmación del Ministerio del Interior), Astesiano había sido
      procesado por estafa en 2002 (sin prisión) y en 2013 (cuatro meses
      de prisión por un delito continuado de estafa), con una condena
      emitida en setiembre de 2014. No hay en el registro sentencia del
      Poder Judicial ni informe oficial que lo documente.
    fuentes:
      - url: https://www.elobservador.com.uy/nota/investigan-si-a-lacalle-pou-le-ocultaron-los-antecedentes-de-astesiano-fa-analiza-acciones-parlamentarias-202292821300
        medio: el-observador
        fecha: 2022-09-29
        tipo: nota
        titulo: Investigan si a Lacalle le ocultaron los antecedentes de Astesiano; FA analiza acciones parlamentarias
        cita: >-
          había sido procesado en dos ocasiones por estafa, algo que el
          mandatario aseguró desconocer. Una en 2002 y otra en 2013, esta
          última con prisión. Esa condena incluso fue emitida en setiembre
          de 2014, cuando ya trabajaba para Lacalle Pou.
        retrieved_at: 2026-09-04
      - url: https://www.montevideo.com.uy/Noticias/Astesiano-estuvo-cuatro-meses-preso-en-2013-por-un-delito-continuado-de-estafa-uc833884
        medio: montevideo-portal
        fecha: 2022-09-28
        tipo: nota
        titulo: Astesiano estuvo cuatro meses preso en 2013 por un delito continuado de estafa
        cita: >-
          estuvo preso en el 2013 por un delito continuado de estafa, según
          informó La Diaria y confirmó Montevideo Portal con el Ministerio
          del Interior. Según indicó la fuente, Astesiano estuvo cuatro
          meses tras las rejas luego de enfrentar un proceso judicial ese
          mismo año. En tanto, en 2002 también fue procesado por estafa,
          pero en esa ocasión sin prisión.
        retrieved_at: 2026-09-04
  analisis: >-
    La afirmación es un dato de hecho verificable. Dos medios de grupos
    distintos, uno de ellos con confirmación atribuida al Ministerio del
    Interior, informaron entre el 28 y el 29 de setiembre de 2022 que
    Astesiano tenía dos procesamientos por estafa (2002 y 2013) y una
    condena de setiembre de 2014, cuando ya trabajaba para Lacalle Pou. El
    propio presidente dijo el 30 de setiembre que no le habían dado "la
    información correcta" y pidió el legajo de la custodia. Con esa
    evidencia la afirmación no se sostiene; pero el Veracímetro exige un
    documento oficial (sentencia del Poder Judicial, informe del Ministerio
    del Interior o de la Fiscalía) para calificar "falso", y en el registro
    solo hay prensa. Por eso queda en "discutible" hasta que se incorpore
    ese documento. Contexto: en la misma conferencia dijo que "todo el
    mundo es inocente hasta que se demuestre lo contrario"; no se sabe si
    conocía los antecedentes al momento de hablar, y el registro no afirma
    que los conociera.
  evidencia:
    nivel: reportado
    fuentes:
