    tier: publicado
    notas_internas: >-
      Para pasar a "falso": sentencia del Poder Judicial de 2014 o
      resultado de la investigación administrativa de urgencia del
      Ministerio del Interior sobre por qué los antecedentes no figuraban
      en los informes de 2020 y 2021. Con prensa sola, discutible.
