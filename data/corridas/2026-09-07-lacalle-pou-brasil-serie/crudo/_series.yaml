# Serie anual 2002-2022 de precios de nafta y gasoil, Uruguay vs. Brasil, en USD por litro.
#
# MÉTODO (ver también notas.md ## metodo):
# - Cada valor anual es el promedio simple de los valores MENSUALES disponibles de ese año (12 meses
#   cuando hay, menos cuando falta algún mes; ver "nota" de cada ítem y n_meses_* más abajo).
# - Uruguay, precio en pesos corrientes: Gasolina Súper 95 (30S) y Gas Oil (50S desde que la URSEA lo
#   distingue de 10S; antes, "Gas oil" único). Fuente primaria 2002-01 a 2019-05: serie oficial URSEA
#   "Series PPI vs PE" (columna "Precios medios al consumidor final... Fuente MIEM/DNE"), mensual y
#   completa. 2019-06 a 2020-12: no se halló decreto de cambio de precio pese a buscarlo (ver
#   notas.md); se sostiene el último valor oficial conocido (mayo-2019) porque hay evidencia
#   consistente de que el precio estuvo congelado ese lapso (ver notas.md ## metodo). 2021: los
#   decretos de precio pasaron a mensuales recién desde julio 2021 (Ley 19.889 y decretos 201/021,
#   363/020); se reconstruyó el valor vigente cada mes a partir de 5 decretos localizados (PVP,
#   Artículo 2), sosteniendo cada uno hasta el siguiente. 2022: dataset oficial ANCAP/catalogodatos
#   "Precios de Combustibles - Poder Ejecutivo", que marca "S/C" (sin cambio) los meses sin nuevo
#   decreto; se completó sosteniendo el último valor informado (forward-fill), sembrado en enero con
#   el valor de diciembre-2021 (decreto 386/021).
# - Brasil, precio en reales corrientes: Gasolina C comum y Óleo Diesel (grado "S10" desde que la ANP
#   lo releva de forma continua, enero-2013 en adelante; antes, "Óleo Diesel" sin grado). Fuente:
#   ANP, "Série Histórica de Preços de Combustíveis", planillas mensuales nacionales (Brasil),
#   "PRECO MEDIO REVENDA". Setiembre de 2020 no tiene relevamiento (pandemia; nota de la propia ANP:
#   "Não houve pesquisa de preços entre 18/8/20 e 17/10/20"): el promedio 2020 de Brasil es de 11
#   meses, no 12.
# - Tipo de cambio: Uruguay, dólar interbancario VENDEDOR, Fondo BCU, promedio mensual (serie "dólar
#   promedio" del BCU, compilada y publicada por el MIEM/DNE); promedio anual = promedio simple de
#   los 12 promedios mensuales. Brasil, PTAX dólar VENTA, media de período MENSUAL, Banco Central do
#   Brasil (série SGS 3695); promedio anual = promedio simple de los 12 promedios mensuales. Es una
#   convención distinta a la del chequeo original (que usó el dólar BILLETE del BCU para el
#   27/03/2022, un día puntual); el propio chequeo original ya documentó que la brecha entre billete
#   e interbancario es de décimas y no cambia los resultados a nivel semanal, y a nivel de promedio
#   mensual/anual la diferencia es del mismo orden.
# - USD/litro = (precio en moneda local) / (tipo de cambio promedio del mismo período).
# - Ningún año quedó en null: para 2019, 2020 y 2021 hay meses reconstruidos o sostenidos en vez de
#   observados directamente; está marcado en cada "nota" y detallado en notas.md. "No estimes" se
#   interpretó como "no inventar un valor sin respaldo": estos meses sostienen el ÚLTIMO valor oficial
#   conocido (un decreto no derogado sigue vigente), no un valor inventado.

