  tema: economia/empleo
  fecha: 1997-12-17
  titulo: 'Exportaciones subieron 16%, 10% y 13%: la serie oficial del BCU es cercana, no exacta'
  afirmacion: Las empresas uruguayas habían incrementado sus exportaciones en cada uno de los tres
    años anteriores a diciembre de 1997, en un 16 %, un 10 % y un 13 %, mientras la desocupación
    seguía aumentando salvo una pequeña disminución en el último año.
  fragmento: en un 16%, 1O% y 13%
  calificacion: impreciso
  dato_real:
    valor: >-
      El Banco Central del Uruguay publicó, en la Revista de Economía usada como parte del
      prospecto para la colocación de Bonos Globales (1997), el cuadro oficial de Balanza de
      Pagos con exportaciones de bienes: US$1.645,3 millones (1993), US$1.913,4 millones (1994),
      US$2.147,6 millones (1995) y US$2.439,6 millones (1996, cifra preliminar).


      Esas cifras dan variaciones interanuales de +16,3 % (1994), +12,2 % (1995) y +13,6 % (1996):
      los tres años inmediatamente anteriores al discurso de diciembre de 1997. Barandiarán dijo
      16 %, 10 % y 13 %: el primer y el tercer número difieren en menos de un punto porcentual; el
      segundo, en 2,2 puntos.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-12-17%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0002).pdf
        medio: parlamento
        fecha: 1997-12-17
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-12-17, N.º 2
        cita: las empresas uruguayas han ido incrementando sus exportaciones en los últimos tres anos -en un
          16%, 1O% y 13%-, no obstante lo cual la desocupación ha venido aumentando en forma
          sostenida, salvo una pequeíia dismi- nución en el último alío.
        retrieved_at: 2026-09-09
      - url: https://bvrie.bcu.gub.uy/local/File/REVECO/1997/Informe.pdf
        medio: bcu
        fecha: 1997-01-01
        tipo: documento_oficial
        titulo: >-
          Revista de Economía - Segunda Época Vol. IV N.º 2 (Banco Central del Uruguay): "Informe
          sobre el Uruguay contenido en el Prospecto para la colocación de 300 millones de dólares
          en Bonos Globales", cuadro "Balanza de Pagos" (Fuente: Banco Central)
        cita: >-
          BALANZA DE PAGOS(1) (Millones de Dólares) 1 9 9 2  1 9 9 3  1 9 9 4  1 9 9 5  1 9 9 6 (2
          ) C u e n ta C o rrie n te : B a l. C o m . d e b ie n e s (2 3 4 .2 ) (4 7 3 .0 ) (6 8 6
          .2 ) (5 6 3 .0 ) (7 0 2 .9 ) E x p o rt. 1 7 0 2 .5  1 6 4 5 .3  1 9 1 3 .4  2 1 4 7 .6  2
          4 3 9 .6
        retrieved_at: 2026-09-09
  analisis: >-
    Dijo que las exportaciones uruguayas habían crecido 16 %, 10 % y 13 % en cada uno de los tres
    años anteriores a diciembre de 1997. La serie oficial de Balanza de Pagos del Banco Central
    del Uruguay da variaciones de +16,3 %, +12,2 % y +13,6 % para 1994, 1995 y 1996: dos de los
    tres números difieren en menos de un punto porcentual; el del medio (10 % dicho contra 12,2 %
    oficial) difiere en 2,2 puntos.


    Los tres años muestran, según la serie oficial, crecimiento de dos dígitos y ningún año de
    caída, que es el sentido general de lo que dijo; la imprecisión está concentrada en la
    magnitud del año del medio, no en la dirección del fenómeno.


    Esta serie reemplaza a la que había usado la corrida anterior (Comtrade/Banco Mundial, WITS),
    una serie "espejo" con otra metodología que no se pudo cotejar contra el documento del Banco
    Central por no haber podido descargarlo en ese momento.
