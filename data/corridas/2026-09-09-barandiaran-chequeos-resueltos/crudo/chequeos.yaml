  tema: transparencia-corrupcion
  fecha: 1996-08-13
  titulo: 'Comisión del 4% a un intermediario de FOCOEX: la Comisión Investigadora no pudo verificarla'
  afirmacion: Un intermediario, el señor Estellano, cobró una comisión del 4% del crédito con FOCOEX,
    unos US$5.000.000.
  fragmento: cobra el 4% de comisión, es decir, US$ 5:000.000
  calificacion: discutible
  dato_real:
    valor: >-
      El Informe en Minoría de la Comisión Investigadora Parlamentaria sobre FOCOEX —el mismo
      documento ya citado para el chequeo del crédito de US$137.000.000— dice que la Comisión no
      pudo acceder al contrato de Estellano con FOCOEX ni a la documentación de comisiones
      pagadas ni de órdenes de pago emitidas: no confirma ni descarta el 4% (US$5.000.000) que
      mencionó Barandiarán.


      El mismo informe agrega que, según lo declarado por los propios jerarcas de FOCOEX ante la
      Comisión, las comisiones no habrían podido superar el 5% en las operaciones con
      financiación concesional: un techo distinto (más alto) que el 4% que Barandiarán citó en
      Sala, y tampoco una cifra puntual verificada.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: el senor Estellano, que cobra el 4% de comisión, es decir, US$ 5:000.000 -¡US$ 5:000.0001-,
          también es intermediario.
        retrieved_at: 2026-09-09
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: >-
          Informe en Minoría de la Comisión Investigadora sobre los Convenios realizados por la
          Administración Pública uruguaya con FOCOEX S.A., publicado dentro del Diario de
          Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: >-
          No pudimos acceder a la copia del contrato del seflor Estellano con FOCOEX, tampoco la
          documentación vinculada al pago de comisiones y de órdenes de pago emitidas en la
          ejecución de los contratos ni el monto de las comisiones pagadas por los negocios
          realizados con el Uruguay.
        retrieved_at: 2026-09-09
  analisis: >-
    Dijo que un intermediario, el señor Estellano, cobró una comisión del 4% (unos US$5.000.000)
    en el crédito con FOCOEX. El Informe en Minoría de la Comisión Investigadora —el mismo
    documento del chequeo del crédito— dice que la Comisión no pudo acceder al contrato de
    Estellano ni a la documentación de comisiones pagadas: el propio expediente no confirma la
    cifra.


    El informe sí recoge que, según lo declarado por los jerarcas de FOCOEX, las comisiones no
    habrían podido superar el 5%, un techo distinto del 4% que mencionó Barandiarán. Ninguna de
    las dos cifras está documentada con precisión.


    Queda discutible con documento oficial en mano: no hay contradicción entre el 4% dicho y el
    techo del 5% declarado por FOCOEX —son compatibles entre sí—, pero tampoco hay una fuente que
    fije el monto exacto de la comisión de Estellano.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: el senor Estellano, que cobra el 4% de comisión, es decir, US$ 5:000.000 -¡US$ 5:000.0001-,
          también es intermediario.
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
    notas_internas: >-
      El resolvedor atribuyó el techo del 5% al "testimonio del contador Testoni"; verificado con
      pnpm fuente, ese pasaje del informe lo atribuye a "lo declarado por los jerarcas de FOCOEX",
      no a Testoni (que es un Diputado nombrado en otra parte del mismo documento, autor de la
      denuncia original ante la Comisión Preinvestigadora). Se corrige la atribución acá.

- politico: barandiaran
  _slug: 1997-mayor-parte-paquete-accionario-pluna
  _investigacion: { agente: editor, modelo: claude-sonnet-5 }
  declaracion: barandiaran/1997-11-18-pluna-propiedad-brasilena-1997
  tema: empresas-publicas
  fecha: 1997-11-18
  titulo: 'Mayoría accionaria de PLUNA en manos de VARIG: confirmado por la resolución de adjudicación'
  afirmacion: En 1997, la mayor parte del paquete accionario de PLUNA estaba en poder de una compañía
    de aviación brasileña (VARIG).
  fragmento: su mayor participación accionaría está en poder de una compaf'lía de aviación brasilelia
  calificacion: verdadero
  dato_real:
    valor: >-
      El Pliego de Condiciones de la licitación de PLUNA (Resolución N.º 373/993, IMPO), con el
      Estatuto de la nueva sociedad como Anexo I, fija que el capital se dividiría en Acciones
      Serie A (49%, en poder de PLUNA) y Serie B (51%, en poder del "Adjudicatario" de la
      licitación): la estructura que hace mayoritario al socio privado está en un documento
      oficial.


      La Resolución del Poder Ejecutivo N.º 629/995 (31/05/1995), que autorizó a PLUNA a firmar
      el contrato de adjudicación, identifica al Pluriconsorcio de Aeronavegación —único oferente
      de la Licitación Pública Internacional N.º 1/93 y adjudicatario de esas acciones Serie B
      desde el 21 de junio de 1994— como una entidad cuyo operador es VARIG.


      La identificación de VARIG deja de depender solo de una nota de opinión de La República
      (28/08/2000, que además calificaba la operación de "irregular", una imputación del medio
      que no está en el documento oficial) y queda respaldada por la resolución de adjudicación.
    fuentes:
      - url: https://www.impo.com.uy/bases/resoluciones-originales/373-1993/3
        medio: impo
        fecha: 1993-01-01
        tipo: documento_oficial
        titulo: Resolución N.º 373/993 (Pliego de Condiciones, licitación de PLUNA)
        cita: el capital que se integre, Acciones de la Serie A y B de tal forma que la Serie A represente
          el 49% (cuarenta y nueve por ciento) del capital integrado y la Serie B represente el 51%
          (cincuenta y uno por ciento) de ese capital. Todas las Acciones de la Serie A pertenecerán a
          PLUNA
        retrieved_at: 2026-09-09
      - url: https://www.impo.com.uy/bases/resoluciones/629-1995/1
        medio: impo
        fecha: 1995-05-31
        tipo: documento_oficial
        titulo: >-
          Resolución del Poder Ejecutivo N.º 629/995 (31/05/1995): "Autorización a PLUNA para otorgar
          contrato de adjudicación con Pluriconsorcio de Aeronavegación y otros"
        cita: >-
          A esta convocatoria, retiraron pliego cinco interesados, Berch Rupenian, AEROLINEAS
          ARGENTINAS, LAPA, IBERIA Y VARIG, formulando oferta exclusivamente PLURICONSORCIO DE
          AERONAVEGACION, cuyo operador es VARIG. IV) Que la licitación Nº 1/93 fue adjudicada a
          dicho único oferente, PLURICONSORCIO DE AERONAVEGACION, en decisión adoptada por
          unanimidad del Directorio de PLUNA de fecha 21 de junio de 1994
        retrieved_at: 2026-09-09
      - url: https://www.lr21.com.uy/editorial/20400-triste-final-para-una-empresa-del-estado
        medio: la-republica
        fecha: 2000-08-28
        tipo: nota
        titulo: Triste final para una empresa del Estado
        cita: Y casi de inmediato, la empresa brasileña pasó a ser accionista mayoritario de manera
          irregular.
        retrieved_at: 2026-09-09
  analisis: >-
    Dijo que en 1997 la mayor parte del paquete accionario de PLUNA estaba en poder de una
    aerolínea brasileña. La Resolución del Poder Ejecutivo N.º 629/995 confirma la estructura
    —51% del capital para el adjudicatario privado— y nombra a VARIG como operador del
    Pluriconsorcio de Aeronavegación, el único oferente y adjudicatario de esa licitación.


    La resolución identifica a VARIG como operador del consorcio adjudicatario, no como titular
    directo de las acciones a su nombre; esa distinción no cambia el sentido de lo dicho: la
    aerolínea brasileña, a través del consorcio que operaba, controlaba la porción mayoritaria
    del capital de PLUNA.


    La nota de opinión de La República, que antes era la única fuente de la identificación de
    VARIG y que además calificaba la operación de irregular, deja de ser necesaria para sostener
    el dato de la propiedad; la imputación de irregularidad sigue siendo del medio, no un hecho
    documentado en esta corrida.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-11-18%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0084).pdf
        medio: parlamento
        fecha: 1997-11-18
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-11-18, N.º 84
        cita: la realidad de esta empresa en 1997 indica que su mayor participación accionaría está en poder
          de una compaf'lía de aviación brasilelia
        retrieved_at: 2026-09-09
  revision:
    tier: publicado

