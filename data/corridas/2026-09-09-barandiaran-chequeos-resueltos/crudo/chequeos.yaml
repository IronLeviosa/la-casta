  analisis: >-
    Dijo, atribuyéndolo al Instituto Nacional de Estadística, que los precios de la educación
    privada habían subido más que el resto de la canasta familiar hacia setiembre de 1998. La
    serie oficial del INE lo confirma: el rubro Enseñanza subió 15,45 % interanual contra 9,98 %
    del índice general.


    La comparación es exactamente la que citó: la calcula el propio INE por rubro, no el sitio.
