- politico: barandiaran
  _slug: segun-instituto-nacional-estadistica-precios-educacion
  _investigacion: { agente: editor, modelo: claude-sonnet-5 }
  declaracion: barandiaran/1998-09-01-costos-educacion-privada
  tema: educacion
  fecha: 1998-09-01
  titulo: 'Precios de la educación privada por encima de la canasta: el IPC del INE lo confirma'
  afirmacion: Según el Instituto Nacional de Estadística, los precios de la educación privada habían
    experimentado, hacia septiembre de 1998, un incremento mayor que el del resto de los bienes de
    la canasta familiar.
  fragmento: los precios de la educación privada han experimentando un incremento mayor que el del
    resto de los bienes de la canasta familiar
  calificacion: verdadero
  dato_real:
    valor: >-
      El Índice de Precios del Consumo por Grandes Rubros del INE (Base Marzo 1997=100, serie
      "IPC 2 gral rub M.xls") registra, para el rubro Enseñanza, 107,68 en setiembre de 1997 y
      124,31 en setiembre de 1998: una suba de 15,45 %. El índice general pasó de 107,17 a 117,87
      en el mismo período: una suba de 9,98 %.


      El rubro Enseñanza subió más que el índice general en ese año, que es lo que Barandiarán
      atribuyó al INE.
