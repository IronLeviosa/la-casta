# Tono por nota. Corrida 2026-09-09-caso-penades.
#
# Criterio aplicado, el mismo para todas las notas y para todos los partidos: `neutral` es el valor
# por defecto; `desfavorable` o `favorable` solo cuando el medio, EN SU PROPIA VOZ (no en una cita
# atribuida a una parte, y no solo en el titular o la volanta), caracteriza a la persona o su
# conducta más allá del hecho procesal. Una nota que reproduce lo que argumentó la Fiscalía o la
# defensa en una audiencia, con verbo de atribución, es procesal y queda `neutral` aunque el
# contenido sea duro. El tono es sobre cómo trata la nota al político, no sobre si la noticia le
# conviene.
#
# No se emite registro de grupo-r-multimedio (notas del 2026-08-07 y del 2026-08-21): `pnpm fuente`
# devuelve el menú y los teasers, no el cuerpo, así que no hay texto sobre el cual juzgar el tono.
# El registro de caras-y-caretas no corresponde a una fuente del lote: la nota apareció al buscar la
# segunda fuente que le falta al hito del 2026-08-22 y se leyó completa, así que se le asigna tono
# como a las demás.

- medio: el-observador
  url: https://www.elobservador.com.uy/nota/fiscalia-actuara-de-oficio-por-la-acusacion-de-romina-celeste-contra-penades-202332915498
  titulo: Fiscalía actuará de oficio por la acusación de Romina Celeste contra Penadés
  fecha: 2023-03-29
  evento: caso-penades
  politico: penades
  tono: neutral
  justificacion: >-
    Reproduce el comunicado de Fiscalía y a continuación la respuesta del acusado, sin voz propia
    sobre la persona: «En su declaración, Penadés negó las acusaciones de Romina Celeste».
  revision:
    tier: publicado

