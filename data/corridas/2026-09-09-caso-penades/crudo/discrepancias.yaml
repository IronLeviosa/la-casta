# Discrepancias detectadas al releer las fuentes del lote contra el registro primario.
#
# Umbral aplicado, el mismo para todos los medios: solo se registra cuando existe un documento
# primario (documento_oficial, diario_de_sesiones o video) que decide. Tres diferencias más
# aparecieron en este mismo lote y NO se registran, por no tener ese documento; quedan dichas acá
# para que la lista sea auditable y no parezca una selección:
#
#   1. ambito, 2023-10-10: dice «22 delitos» y a continuación enumera seis categorías que suman 21
#      (omite el delito de desacato que sí enumeran busqueda y subrayado). Es una inconsistencia
#      interna de la nota, no una diferencia contra un documento; no hay auto de formalización
#      público que decida.
#   2. infobae, 2025-10-09: «el Senado y la Cámara de Diputados de Uruguay decidieron expulsarlo de
#      su representación». El diario de sesiones del 11/10/2023 registra la remoción en el Senado;
#      no hay documento que diga qué hizo o no hizo la Cámara de Representantes ese día, y la
#      ausencia de un documento no es un documento.
#   3. el-observador, 2025-02-05: «Penadés y Mauvezín están recluidos en centros carcelarios desde
#      2024». Cuatro notas de tres grupos ubican la prisión preventiva en octubre de 2023, pero eso
#      es un desacuerdo entre medios; no se ubicó la resolución judicial que decide.
#
# Ninguna de las tres, ni la que sí se registra, se acompaña de un verbo de intención: no se sabe
# por qué difieren.

