  cobertura:
    texto: >-
      Se revisó el caso judicial por explotación sexual de menores que terminó con la prisión
      preventiva de Penadés, con los diarios de sesiones del Senado del 7 de junio y el 11 de
      octubre de 2023, la biografía oficial y la ficha de legislaturas de parlamento.gub.uy, y
      prensa de diez medios entre marzo de 2023 y agosto de 2026, sin que ninguno concentre la
      cobertura. No hay todavía declaraciones, promesas de campaña, votaciones ni chequeos cargados
      de este político; sus intervenciones en sala entre 1995 y 2004 están en la Hemeroteca del
      Parlamento y no se leyeron.
    fecha: 2026-09-09
  revision:
    tier: publicado
    notas_internas: >-
      mandatos[2] (Diputado 2000-2004) se separó de la Legislatura XLIV porque su única fuente es el
      CV oficial con precisión de año, no la ficha de legislaturas (esa fila, XLV, es anómala: un
      solo día, sin rótulo de cargo). mandatos[0] y mandatos[2] llevan fecha con precisión de año por
      la misma razón (aviso del validador, no error). No se agregó "Presidente de la Cámara de
      Representantes (2001/02)" como mandato: es un cargo interno de conducción de la cámara, no un
      período electivo con desde/hasta propio, y mandatos[] representa cargos electivos (aviso P8 de
      la crítica, no aceptado con este motivo).
