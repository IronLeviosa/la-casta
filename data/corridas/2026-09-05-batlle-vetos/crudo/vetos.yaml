- politico: batlle
  tema: economia
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Ley de Presupuesto Nacional 2000-2004
  numero_ley: "17.296"
  fecha: 2001-01-10
  alcance: parcial
  articulos_observados:
    - "24"
    - "65"
    - "70"
    - "71"
    - "72"
    - "90"
    - "114"
    - "118"
    - "185"
    - "198"
    - "199"
    - "225"
    - "319"
    - "329"
    - "331"
    - "468"
    - "470"
    - "549"
    - "557"
  fundamento: >-
    El Poder Ejecutivo fundó las observaciones al Presupuesto Nacional 2000-2004 tanto en razones de
    constitucionalidad como de mérito, en ejercicio de las facultades de los artículos 137 y 168 numeral
    6 de la Constitución, para observar total o parcialmente una veintena de artículos por motivos que
    variaban artículo por artículo (falta de iniciativa privativa del Poder Ejecutivo, incompatibilidad
    con políticas fijadas por el gobierno, distorsiones presupuestales, entre otros).
  resultado:
    estado: veto_levantado
    fecha: 2001-02-14
    detalle: >-
      La Asamblea General, reunida el 14-02-2001, resolvió por moción de varios legisladores levantar
      (rechazar) las observaciones del Poder Ejecutivo específicamente a los artículos 329, 331, 468, 470,
      549 y 557 del proyecto de Presupuesto, que quedaron con el texto que había sancionado el
      Parlamento; la ley se promulgó el 21-02-2001 como Ley 17.296. El diario de sesiones consultado no
      reproduce una votación nominal separada para cada uno de los restantes artículos observados (24,
      65, 70, 71, 72, 90, 114, 118, 185, 198, 199, 225, 319), por lo que su desenlace individual no quedó
      documentado en esta investigación.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6524934.PDF
        medio: parlamento
        fecha: 2001-02-14
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 14, Tomo 78 (14 de febrero de 2001)
        cita: >-
          Por moción de varios señores Legisladores la Asamblea General resuelve levantar los vetos
          interpuestos por el Poder Ejecutivo a los artículos números 329, 331, 468, 470, 549 y 557 del
          Presupuesto Nacional.
        retrieved_at: 2026-09-05
        verificacion: manual
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/14851/ficha_completa
        medio: parlamento
        fecha: 2001-02-21
        tipo: documento_oficial
        titulo: Ficha Asunto 14851 - Presupuesto Nacional 2000-2004. Aprobación.
        cita: "14-02-2001 A.G. 24/2001 Asamblea General levanta veto. 21-02-2001 Poder Ejecutivo promulga."
        archived_url: https://web.archive.org/web/20241113005846/https://parlamento.gub.uy/documentosyleyes/ficha-asunto/14851/ficha_completa
        retrieved_at: 2026-09-05
  analisis: >-
    El Poder Ejecutivo observó parcialmente el proyecto de Presupuesto Nacional 2000-2004, el primero de
    su gestión, alcanzando alrededor de una veintena de artículos por razones de constitucionalidad y de
    mérito. La Asamblea General, en su primera sesión de considerarlas, votó expresamente rechazar las
    observaciones a seis de esos artículos (329, 331, 468, 470, 549 y 557), que quedaron con el texto
    sancionado por el Parlamento; la ley se promulgó ocho días después. No se encontró en esta
    investigación una declaración pública de Batlle sobre este veto específico más allá del propio
    mensaje de observaciones, firmado por él como Presidente.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6524934.PDF
        medio: parlamento
        fecha: 2001-02-14
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 14, Tomo 78 (14 de febrero de 2001)
        cita: >-
          El Presente mensaje se funda tanto en razones de constitucionalidad como de mérito que llevan a
          este Poder del Estado a ejercer las facultades que les asignan los artículos 137 y 168 numeral
          6) de la Constitución de la República.
        retrieved_at: 2026-09-05
        verificacion: manual

- politico: batlle
  tema: economia/empleo
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Grado inmediato superior a Oficiales Generales y Superiores en retiro (Capítulo II de la Ley 15.848)
  numero_ley: "17.358"
  fecha: 2001-05-16
  alcance: total
  fundamento: >-
    El Poder Ejecutivo se opuso a la promulgación del proyecto por objeciones de naturaleza
    constitucional y legal, instrumental y de conveniencia y oportunidad institucional, sin detallar en
    el extracto disponible un único motivo central más allá de esa fórmula general.
  resultado:
    estado: veto_levantado
    fecha: 2001-06-13
    detalle: >-
      La Asamblea General, en votación nominal el 13-06-2001, resolvió levantar las observaciones: el
      Senado obtuvo 11 votos afirmativos (por respaldar al Poder Ejecutivo) y 20 negativos en 31
      sufragantes, superando los 19 votos (tres quintos) requeridos; Diputados registró 32 afirmativos y
      63 negativos en 95 sufragantes, superando los 57 requeridos. Quedaron levantadas las observaciones
      y la ley se promulgó el 22-06-2001 como Ley 17.358.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6618078.PDF
        medio: parlamento
        fecha: 2001-06-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 18, Tomo 80 (13 de junio de 2001)
        cita: >-
          Se obtuvieron 31 votos en quórum máximo. De los 31 votos, 11 sufragaron por la afirmativa y 20
          lo hicieron por la negativa. En consecuencia, se obtuvieron los tres quintos del total de 31, al
          superarse los 19 votos requeridos.
        retrieved_at: 2026-09-05
  analisis: >-
    El Poder Ejecutivo vetó en su totalidad un proyecto que otorgaba el ascenso al grado inmediato
    superior, en situación de retiro, a los oficiales generales y superiores comprendidos en el capítulo
    II de la Ley de Caducidad (Ley 15.848), por objeciones de orden constitucional y de conveniencia
    institucional. La Asamblea General reunió los tres quintos en ambas cámaras para rechazar las
    observaciones y la ley se promulgó pocos días después. No se encontró declaración pública de Batlle
    sobre este veto puntual más allá del mensaje de observaciones que firmó.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6618078.PDF
        medio: parlamento
        fecha: 2001-06-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 18, Tomo 80 (13 de junio de 2001)
        cita: >-
          Dicha oposición o veto se funda en objeciones de naturaleza constitucional y legal, instrumental
          y aun conveniencia y oportunidad institucional, que se pasan a detallar.
        retrieved_at: 2026-09-05

- politico: batlle
  tema: economia/empleo
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Derechos jubilatorios ante el BPS de docentes de ANEP reincorporados por la Ley 15.783
  numero_ley: "17.620"
  fecha: 2002-12-29
  alcance: total
  fundamento: >-
    El Poder Ejecutivo observó el proyecto por razones de inconstitucionalidad: entendió que no era una
    norma meramente interpretativa del artículo 1 de la Ley 16.824 sino una modificación de beneficios
    jubilatorios que carecía de la iniciativa privativa del Poder Ejecutivo exigida por el artículo 86
    inciso 2 de la Constitución, y que generaba una desigualdad frente a otros destituidos.
  resultado:
    estado: veto_levantado
    fecha: 2003-02-12
    detalle: >-
      La Asamblea General, en votación nominal el 12-02-2003, resolvió levantar las observaciones: el
      Senado registró 17 votos afirmativos (por el levantamiento) en 28 sufragantes, y Diputados 51
      afirmativos en 77 presentes, alcanzando en ambos casos los tres quintos requeridos. La ley se
      promulgó ese mismo mes como Ley 17.620.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/2370801.PDF
        medio: parlamento
        fecha: 2003-02-12
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 43, Tomo 81 (12 de febrero de 2003)
        cita: >-
          La votación en el Senado obtuvo 17 votos afirmativos por el levantamiento de las observaciones
          del Poder Ejecutivo, en 28 señores Senadores sufragantes. En la Cámara de Representantes votaron
          afirmativamente 51 señores Representantes en 77 presentes.
        retrieved_at: 2026-09-05
  analisis: >-
    El Poder Ejecutivo vetó en su totalidad un proyecto que declaraba que los docentes de ANEP
    reincorporados tras la dictadura por la Ley 15.783 podían ejercer ante el BPS su derecho a
    pasividad o a modificar su cédula jubilatoria, por entender que excedía la iniciativa legislativa
    permitida y generaba una desigualdad frente a otros destituidos. La Asamblea General reunió los tres
    quintos en ambas cámaras para rechazar las observaciones y la ley se promulgó. No se encontró
    declaración pública de Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/2370801.PDF
        medio: parlamento
        fecha: 2003-02-12
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 43, Tomo 81 (12 de febrero de 2003)
        cita: >-
          Por lo expuesto el Poder Ejecutivo observa por razones de inconstitucionalidad el proyecto de
          ley remitido.
        retrieved_at: 2026-09-05

- politico: batlle
  tema: economia/empleo
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Exclusión de cajeros automáticos para el cobro de pasividades en locales propios del BPS
  numero_ley: "17.710"
  fecha: 2003-09-25
  alcance: total
  fundamento: >-
    El Poder Ejecutivo observó el proyecto por razones de constitucionalidad y de conveniencia: entendió
    que regular el sistema de pago de las prestaciones del Banco de Previsión Social es materia
    administrativa privativa del propio ente (principio de "especialización del Ente"), y que la norma
    impedía el uso de un adelanto tecnológico sin razón suficiente.
  resultado:
    estado: veto_levantado
    fecha: 2003-11-11
    detalle: >-
      La Asamblea General, en votación nominal el 11-11-2003, resolvió levantar las observaciones:
      Diputados registró 55 votos afirmativos y 27 negativos en 82 sufragantes (se requerían 50), y el
      Senado 17 afirmativos y 10 negativos en 27 sufragantes (se requerían exactamente 17). Quedó
      sancionado el proyecto y se promulgó el 13-11-2003 como Ley 17.710.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/4321760.PDF
        medio: parlamento
        fecha: 2003-11-11
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 54, Tomo 82 (11 de noviembre de 2003)
        cita: >-
          Han votado ochenta y dos señores Representantes: cincuenta y cinco lo han hecho por la
          afirmativa y veintisiete por la negativa. Los tres quintos de ochenta y dos son cincuenta. Han
          votado veintisiete señoras y señores Senadores: diecisiete lo han hecho por la afirmativa y diez
          por la negativa.
        retrieved_at: 2026-09-05
  analisis: >-
    El Poder Ejecutivo vetó en su totalidad un proyecto que excluía la instalación de cajeros
    automáticos para el pago de pasividades en los locales propios del Banco de Previsión Social, por
    entender que esa regulación invadía la autonomía administrativa del ente y limitaba sin razón
    suficiente el uso de un adelanto tecnológico. La Asamblea General reunió los tres quintos en ambas
    cámaras para rechazar las observaciones y la ley se promulgó. No se encontró declaración pública de
    Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/4321760.PDF
        medio: parlamento
        fecha: 2003-11-11
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 54, Tomo 82 (11 de noviembre de 2003)
        cita: >-
          Por lo expuesto el Poder Ejecutivo observa por razones de constitucionalidad y de conveniencia
          el Proyecto de Ley remitido.
        retrieved_at: 2026-09-05

- politico: batlle
  tema: economia
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Sustitución del artículo 154 de la Ley 17.556 sobre licitaciones de obras portuarias con dragas y grúas de bandera extranjera
  numero_ley: "17.742"
  fecha: 2003-12-26
  alcance: parcial
  articulos_observados:
    - "154"
  fundamento: >-
    El Poder Ejecutivo observó la sustitución del artículo 154 por entender que revertía el objetivo de
    la norma original (evitar monopolios de hecho en el uso de dragas de bandera uruguaya) y que exigir
    el embanderamiento nacional a equipos especializados de uso poco frecuente (grúas flotantes,
    plataformas) encarecería y demoraría las obras.
  resultado:
    estado: veto_levantado
    fecha: 2004-02-17
    detalle: >-
      La Asamblea General, en votación nominal el 17-02-2004, resolvió levantar las observaciones:
      Diputados registró 53 votos afirmativos y 16 negativos en 69 sufragantes, y el Senado 18 afirmativos
      y 9 negativos en 27 sufragantes, alcanzando en ambos casos la mayoría constitucional. La ley se
      promulgó el 09-03-2004 como Ley 17.742.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/1921179.PDF
        medio: parlamento
        fecha: 2004-02-17
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 62, Tomo 82 (17 de febrero de 2004)
        cita: >-
          Han votado sesenta y nueve señores Representantes: cincuenta y tres lo hicieron por la
          afirmativa y dieciséis por la negativa; y han votado veintisiete señores Senadores: dieciocho lo
          hicieron por la afirmativa y nueve por la negativa.
        retrieved_at: 2026-09-05
        verificacion: manual
  analisis: >-
    El Poder Ejecutivo vetó parcialmente (un solo artículo) un proyecto que modificaba las reglas de
    licitación para obras portuarias que requieren dragas, grúas flotantes o plataformas, por entender
    que la sustitución podía recrear monopolios de hecho y encarecer las obras. La Asamblea General
    reunió la mayoría constitucional para rechazar la observación y la ley se promulgó. No se encontró
    declaración pública de Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/1921179.PDF
        medio: parlamento
        fecha: 2004-02-17
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 62, Tomo 82 (17 de febrero de 2004)
        cita: >-
          Por lo tanto se tendrían que embanderar en Uruguay para prestar el servicio (probablemente un
          trabajo de corta duración de días o semanas) lo que consagra un encarecimiento y demoras
          perjudiciales para el mejor fin de las obras.
        retrieved_at: 2026-09-05
        verificacion: manual

- politico: batlle
  tema: economia/empleo
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Modificación del régimen de jubilaciones y pensiones de la Caja de Profesionales Universitarios (artículo 43)
  numero_ley: "17.738"
  fecha: 2003-11-17
  alcance: parcial
  articulos_observados:
    - "43"
  fundamento: >-
    El Poder Ejecutivo observó únicamente el artículo 43 por razones de constitucionalidad, al entender
    que definía el ámbito de afiliación y la actividad profesional amparada por la Caja -y por tanto el
    acceso al beneficio jubilatorio- careciendo de la iniciativa privativa que exige la Constitución para
    materia previsional.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2004-01-20
    detalle: >-
      La Asamblea General, reunida el 20-01-2004, dejó constancia de que había transcurrido el plazo del
      artículo 139 de la Constitución sin que se pronunciara sobre la observación al artículo 43, por lo
      que la observación quedó tácitamente aceptada; la Presidencia de la Asamblea comunicó el texto
      definitivo incluyendo el artículo 43 con la redacción propuesta por el Poder Ejecutivo, y la ley se
      promulgó (Ley 17.738, de 7 de enero de 2004, según la fecha de sanción del texto definitivo).
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6230056.PDF
        medio: parlamento
        fecha: 2004-01-20
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 60, Tomo 82 (20 de enero de 2004)
        cita: >-
          artículo 139 de la Constitución sin que la Asamblea General se pronunciara sobre las
          observaciones interpuestas por el Poder Ejecutivo al proyecto de ley que modifica el régimen de
          jubilaciones y pensiones de la Caja de Jubilaciones y Pensiones de Profesionales Universitarios.
        retrieved_at: 2026-09-05
        verificacion: manual
  analisis: >-
    El Poder Ejecutivo vetó parcialmente (un solo artículo) un proyecto que modificaba el régimen
    previsional de la Caja de Profesionales Universitarios, por entender que excedía la iniciativa
    legislativa permitida en materia de beneficios jubilatorios. A diferencia de otros vetos de este
    período, ninguna de las cámaras rechazó expresamente la observación dentro del plazo, por lo que
    quedó tácitamente aceptada por aplicación directa del artículo 139 de la Constitución, mecanismo que
    la propia Asamblea General dejó consignado en su sesión. No se encontró declaración pública de
    Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/6230056.PDF
        medio: parlamento
        fecha: 2004-01-20
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Asamblea General N.o 60, Tomo 82 (20 de enero de 2004)
        cita: >-
          En el Mensaje del Poder Ejecutivo de fecha 17 de noviembre de 2003 se observó sólo el artículo
          43 de dicho proyecto por razones de constitucionalidad.
        retrieved_at: 2026-09-05
        verificacion: manual

