        cita: >-
          Ha ingresado a la Asamblea General, ha sido Repartido y está en conocimiento de todos los
          Legisladores un Mensaje con un texto complementario a la Ley de Cooperativas de Empleo o
          Trabajo Asociado que, según se indica, ha sido acordado entre el Poder Ejecutivo y las entidades
