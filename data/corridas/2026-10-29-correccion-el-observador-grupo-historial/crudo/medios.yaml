  propiedad:
    descripcion: "Fundado el 22 de octubre de 1991 como El Observador Económico por Ricardo Peirano, a cuya idea se sumaron otros siete empresarios (Roberto Acle, Julio Blanco, Horacio Fernández Ameglio, Roberto Fossati, Lionel Hudson, Alfredo Iraola y Alfonso Pablo Varela); las fuentes consultadas no dicen qué participación tenía cada uno ni si hubo cambios de socios entre 1991 y 2022. Hasta el 4 de mayo de 2022 figura bajo el grupo peirano porque el propio Peirano, fundador y director, cuenta que vendió la empresa en 2022. No se encontró un registro societario ni una fuente que documente quién tenía la mayoría accionaria en cada año de ese período. Desde el 5 de mayo de 2022 el control accionario pertenece a un grupo de inversores argentinos encabezado por Gerardo Werthein y Gabriel Hochbaum; Pablo Tarantino preside el grupo y Peirano quedó como director periodístico."
