- politico: lacalle-pou
  tema: economia/combustibles
  texto: >-
    La liberalización de la importación de combustible estará en la Ley de Urgente consideración, y esta estaría
    aprobada en 90 días. El Poder Ejecutivo determinará una reglamentación paulatina para que Ancap se prepare
    para la competencia.
  fecha_promesa: 2019-09-04
  origen:
    nivel: reportado
    fuentes:
      - url: https://enperspectiva.uy/en-perspectiva-programa/entrevistas/lacalle-pou-llega-al-gobierno-libre-importacion-combustibles-se-aprobara-90-dias-reglamentada-forma-paulatina-ancap-se-prepare-la-competencia/
        medio: en-perspectiva
        fecha: 2019-09-04
        tipo: nota
        titulo: 'Si Lacalle Pou llega al Gobierno, libre importación de combustibles se aprobará en 90 días, reglamentada en forma paulatina «para que Ancap se prepare para la competencia»'
        cita: >-
          La liberalización de la importación de combustible estará en la Ley de Urgente consideración, y esta
          estaría aprobada en 90 días. El Poder Ejecutivo determinará una reglamentación paulatina para que
          Ancap se prepare para la competencia.
        retrieved_at: 2026-09-04
    _faltante: segunda_fuente
  evidencias_candidatas:
    - fecha: 2020-01-22
      tipo: accion_de_gobierno
      efecto: a_favor
      descripcion: >-
        El proyecto de Ley de Urgente Consideración presentado por el presidente electo propuso derogar el
        monopolio de ANCAP en la importación, exportación y refinación de petróleo crudo y derivados.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://subrayado.com.uy/ancap-perdera-el-monopolio-importacion-exportacion-y-refinado-combustibles-n591905
            medio: subrayado
            fecha: 2020-01-22
            tipo: nota
            titulo: Ancap perderá el monopolio de importación, exportación y refinado de combustibles
            cita: >-
              propone derogar el monopolio que tiene Ancap para la importación, exportación y refinación de
              petróleo crudo y derivados
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
    - fecha: 2020-05-22
      tipo: ley
      efecto: en_contra
      descripcion: >-
        El artículo del proyecto de LUC que derogaba el monopolio de ANCAP para importar, exportar y refinar
        petróleo crudo y derivados fue retirado antes de su votación en el Senado, por falta de acuerdo dentro de
        la coalición de gobierno: Cabildo Abierto y sectores del Partido Colorado se opusieron a la
        desmonopolización. En su lugar, la LUC finalmente promulgada (ley 19.889, 9 de julio de 2020) no derogó
        el monopolio; aprobó los artículos 235 a 237, que instauraron un mecanismo por el cual el Poder Ejecutivo
        fija el precio de los combustibles con informe preceptivo de URSEA y ANCAP, sobre la base del precio de
        paridad de importación (PPI), sin liberalizar la importación.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/19889-2020
            medio: impo
            fecha: 2020-07-09
            tipo: documento_oficial
            titulo: Ley N° 19.889
            cita: >-
              Artículo 235 (Aprobación de los precios de los combustibles).- El Poder Ejecutivo aprobará el
              precio de venta de los diferentes combustibles producidos por la Administración Nacional de
              Combustibles, Alcohol y Portland (ANCAP), con entrega en cada una de sus plantas de distribución,
              previo informe preceptivo de la Unidad Reguladora de Servicios de Energía y Agua (URSEA) y de la
              Administración Nacional de Combustibles, Alcohol y Portland (ANCAP). El informe de la URSEA deberá
              explicitar, para cada uno de los productos referidos en el inciso anterior, el precio de paridad
              resultante de importar el producto terminado y hacerlo disponible en las plantas de distribución
              de ANCAP incluyendo las tasas e impuestos correspondientes a este tramo de la cadena.
            retrieved_at: 2026-09-04
          - url: https://www.subrayado.com.uy/la-coalicion-sacara-la-luc-la-desmonopolizacion-ancap-falta-acuerdo-interno-n631084
            medio: subrayado
            fecha: 2020-05-22
            tipo: nota
            titulo: La coalición sacará de la LUC la desmonopolización de ANCAP tras falta de acuerdo interno
            cita: >-
              "Estos artículos apuntan a bajar los precios para que ANCAP en breve venda todos los productos a
              precio de paridad. Es decir, a precio de competencia para el sector productivo con la región",
              explicó Gandini. "Esto llevará a que los otros precios de ANCAP se fijen en relación al precio de
              paridad internacional", agregó. El Partido Colorado y Cabildo Abierto fueron los socios de la
              coalición que plantearon reparos a la caída del monopolio de ANCAP. Finalmente no se llegó a un
              acuerdo y se quitará el cuestionado artículo, también rechazado por el Frente Amplio.
            retrieved_at: 2026-09-04
          - url: https://www.montevideo.com.uy/Noticias/La-ley-de-urgente-consideracion-ya-no-incluye-la-desmonopolizacion-de-Ancap-uc753560
            medio: montevideo-portal
            fecha: 2020-05-22
            tipo: nota
            titulo: La ley de urgente consideración ya no incluye la desmonopolización de Ancap
            cita: >-
              La desmonopolización de Ancap, una iniciativa del Poder Ejecutivo para intentar bajar el precio de
              los combustibles que era apoyada por el Partido Nacional pero no así por otros integrantes de la
              coalición como Cabildo Abierto y parte del Partido Colorado, finalmente fue quitado de la ley de
              urgente consideración (LUC).
            retrieved_at: 2026-09-04
    - fecha: 2020-10-09
      tipo: ley
      efecto: en_contra
      descripcion: >-
        La liberalización de la importación de combustible para buques en los puertos fue aprobada en octubre de
        2020 en la comisión de Presupuesto integrada con Hacienda -tres meses después de promulgada la LUC-, y no
        en el trámite parlamentario de la LUC como se había prometido. Según la fuente, dentro de la coalición el
        sector Batllistas del Partido Colorado se había opuesto a la desmonopolización general de ANCAP cuando se
        propuso en la LUC; la ampliación de esta liberalización portuaria a los aeropuertos, debatida en el
        Presupuesto, tampoco tuvo el respaldo de Batllistas, Cabildo Abierto ni el Partido Independiente.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://elobservador.com.uy/nota/que-argumenta-el-gobierno-para-habilitar-la-libre-importacion-de-combustibles-para-barcos-202010819440
            medio: el-observador
            fecha: 2020-10-09
            tipo: nota
            titulo: Qué argumenta el gobierno para habilitar la importación de combustibles en puertos
            cita: >-
              El apoyo de Batllistas Cuando en el proyecto de ley de Urgente Consideración se propuso la
              derogación del monopolio de Ancap para importar, exportar y refinar petróleo crudo y derivados, el
              sector Batllistas del Partido Colorado se opuso a habilitar la desmonopolización de Ancap. Sin
              embargo, el miércoles esta agrupación resolvió acompañar la modificación introducida por el
              oficialismo para el negocio de los combustibles vinculado a los barcos.
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
