  fecha: 2021-07-20
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    Ayer cuando estaba viendo el informativo mandé dos mensajes. Uno a mi amigo (Omar) Paganini y otro a Azucena
    Arbeleche. ´Bajó el petróleo´ fue mi mensaje.
  resumen: >-
    Dijo, en conferencia de prensa, que había avisado a los ministros de Industria y de Economía que el precio
    internacional del petróleo había bajado, sin adelantar si eso se traduciría en una baja del precio de los
    combustibles, y sostuvo que la voluntad del gobierno es tener combustibles más baratos y transparentar el
    sistema de fijación de precios.
