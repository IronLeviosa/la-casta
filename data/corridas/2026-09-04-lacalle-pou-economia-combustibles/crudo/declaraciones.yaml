        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2022-01-25
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    De manera transparente, desde que está la Ley de Urgente Consideración, dijimos que este es el precio que
    tomamos, en este caso el del Golfo de México. Esto es lo que dice la URSEA y vamos, nos damos vuelta, y a la
    empresa ANCAP, si tiene la espalda suficiente, como la ha tenido, por otro tipo de situaciones, no aumentamos
    los combustibles. Si el día de mañana el precio de los combustibles o el precio de referencia aumenta
    exageradamente y ANCAP no tiene espalda los vamos a tener que aumentar. Ojalá sea a la inversa.
  resumen: >-
    Defendió el mecanismo de fijación de precios de la Ley de Urgente Consideración como una forma transparente
    de tomar el precio de referencia internacional (Golfo de México) informado por URSEA, y dijo que el gobierno
    no aumenta los combustibles cuando ANCAP tiene "espalda" financiera suficiente, aunque advirtió que podría
    tener que hacerlo si el precio de referencia sube demasiado.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.carasycaretas.com.uy/lacalle-pou-el-gobierno-tiene-el-compromiso-de-tener-los-combustibles-lo-mas-baratos-posible/
        medio: caras-y-caretas
        fecha: 2022-01-25
        tipo: nota
        titulo: 'Lacalle Pou: «El gobierno tiene el compromiso de tener los combustibles lo más baratos posible»'
        cita: >-
          De manera transparente, desde que está la Ley de Urgente Consideración, dijimos que este es el precio
          que tomamos, en este caso el del Golfo de México. Esto es lo que dice la URSEA y vamos, nos damos
          vuelta, y a la empresa ANCAP, si tiene la espalda suficiente, como la ha tenido, por otro tipo de
          situaciones, no aumentamos los combustibles. Si el día de mañana el precio de los combustibles o el
          precio de referencia aumenta exageradamente y ANCAP no tiene espalda los vamos a tener que aumentar.
          Ojalá sea a la inversa.
        retrieved_at: 2026-09-04
      - url: https://www.elobservador.com.uy/nota/lacalle-dijo-que-hay-espalda-para-mantener-precio-de-los-combustibles-y-dijo-que-le-preocupa-la-inflacion-2022125124932
        medio: el-observador
        fecha: 2022-01-25
        tipo: nota
        titulo: Lacalle dijo que hay "espalda" para mantener precio de los combustibles y aseguró que le preocupa la inflación
        cita: >-
          Lacalle sostuvo que el país aún tiene "espalda" para evitarlo e insistió en que su gobierno buscó
          asumir "el compromiso" de tener los precios más baratos posibles.
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2022-03-03
  contexto: entrevista
  cargo_en_ese_momento: presidente
  cita: >-
    Si yo antes del 1° de marzo podría prever que el 13 de marzo iba a explotar el coronavirus y que el mundo
    iba a cambiar como cambió, y el ataque injustificado de Rusia a Ucrania y que el petróleo pase a duplicarse
    o más que duplicarse en su precio, obviamente no hubiera hecho ese compromiso.
  resumen: >-
    En una entrevista en Telemundo, reconoció que no había podido cumplir su promesa de campaña de no subir el
    precio de los combustibles y atribuyó el incumplimiento a hechos imprevisibles -la pandemia de covid-19 y la
    invasión rusa a Ucrania-; sobre el mecanismo de ajuste mensual del precio por el PPI, dijo que "da una
    referencia técnica de la cual" parte el gobierno.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.elobservador.com.uy/nota/promesa-incumplida-el-argumento-de-lacalle-y-una-similitud-con-lo-que-criticaba-a-vazquez-y-astori-20223420470
        medio: el-observador
        fecha: 2022-03-05
        tipo: nota
        titulo: 'Promesa incumplida: el argumento de Lacalle y una similitud con lo que criticaba a Vázquez y Astori'
        cita: >-
          Si yo antes del 1° de marzo podría prever que el 13 de marzo iba a explotar el coronavirus y que el
          mundo iba a cambiar como cambió, y el ataque injustificado de Rusia a Ucrania y que el petróleo pase a
          duplicarse o más que duplicarse en su precio, obviamente no hubiera hecho ese compromiso.
        retrieved_at: 2026-09-04
      - url: https://www.teledoce.com/telemundo/nacionales/en-vivo-segui-la-entrevista-del-presidente-lacalle-pou-en-telemundo/
        medio: teledoce
        fecha: 2022-03-03
        tipo: nota
        titulo: Lacalle dijo que "seguramente" será él quien hable en la cadena de radio y TV por el "No"
        cita: >-
          "Nos da una referencia técnica de la cual partimos", defendió. "Si yo antes del 1° de marzo podía
          prever" que "el mundo iba a cambiar como cambió" por la pandemia y la invasión de Rusia a Ucrania, "no
          hubiera hecho ese compromiso", dijo Lacalle Pou ante la pregunta de si incumplió su promesa de campaña
          de no subir el precio de los combustibles.
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2022-03-27
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    Estamos convencidos de que es una medida de transparencia y que el uruguayo no paga sobrecosto
  resumen: >-
    Tras el triunfo del "No" en el referéndum contra la LUC, dijo en conferencia de prensa que no se iba a cambiar
    el mecanismo de fijación de precios de los combustibles, sostuvo que es "una medida de transparencia" bajo la
    cual "el uruguayo no paga sobrecosto", afirmó que en el quinquenio anterior se habían pagado más de USD 1.700
    millones de sobrecostos, y dijo que por primera vez los combustibles eran más baratos que en Brasil.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.subrayado.com.uy/una-etapa-superada-una-ley-que-queda-firme-dijo-lacalle-pou-referendum-la-luc-n852859
        medio: subrayado
        fecha: 2022-03-27
        tipo: nota
        titulo: '"Una etapa superada, una ley que queda firme", dijo Lacalle Pou tras referéndum por la LUC'
        cita: >-
          Otro tema del que habló en conferencia fue el de los combustibles y afirmó que no se va a cambiar el
          mecanismo. "Estamos convencidos de que es una medida de transparencia y que el uruguayo no paga
          sobrecosto", sostuvo y dijo que se pagaron más de USD 1.700 millones de sobrecostos en el quinquenio
          anterior. "Hoy por primera vez tenemos combustibles más baratos que Brasil", señaló y explicó que se
          debe a que "no se trasladaron los costos a todos los uruguayos".
        retrieved_at: 2026-09-04
    _faltante: segunda_fuente

- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2021-11-16
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    Y ANCAP, que dio ganancias extraordinarias, porque está pudiendo tener un negocio, el famoso X, que el X era
    siempre para ver cuánto aumentamos, en este caso tenemos, digámosle, un X virtuoso, y deberíamos de haber
    aumentado, pero como ANCAP dio ganancia y no somos un gobierno que va a cobrarle a la gente para tapar
    agujeros porque administramos mal, dijimos vamos a no cobrarle a la gente más caro el combustible y
    mantengamos el precio con la ganancia que tuvo el Estado.
  resumen: >-
    Dijo que, según el criterio que venían aplicando, la suba del precio internacional del petróleo hubiera
    justificado un aumento del combustible, pero que el gobierno optó por no trasladarlo a la gente porque ANCAP
    tuvo ganancias extraordinarias, y defendió esa decisión atribuyéndola a las ganancias de la empresa y no a
    un cambio de criterio.
