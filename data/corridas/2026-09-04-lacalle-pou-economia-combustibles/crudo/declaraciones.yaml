- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2019-09-04
  contexto: campaña
  cargo_en_ese_momento: candidato a presidente
  cita: >-
    Estamos dispuestos a liberar la importación de incombustibles. Esto obviamente trae aparejada una incomodidad
    para Ancap. La liberalización de la importación de combustible estará en la Ley de Urgente consideración, y
    esta estaría aprobada en 90 días. El Poder Ejecutivo determinará una reglamentación paulatina para que Ancap
    se prepare para la competencia.
  resumen: Anunció que impulsaría la liberalización de la importación de combustibles dentro de la Ley de Urgente Consideración, aprobada en 90 días de gobierno.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://enperspectiva.uy/en-perspectiva-programa/entrevistas/lacalle-pou-llega-al-gobierno-libre-importacion-combustibles-se-aprobara-90-dias-reglamentada-forma-paulatina-ancap-se-prepare-la-competencia/
        medio: en-perspectiva
        fecha: 2019-09-04
        tipo: nota
        titulo: 'Si Lacalle Pou llega al Gobierno, libre importación de combustibles se aprobará en 90 días, reglamentada en forma paulatina «para que Ancap se prepare para la competencia»'
        cita: >-
          Estamos dispuestos a liberar la importación de incombustibles. Esto obviamente trae aparejada una
          incomodidad para Ancap. La liberalización de la importación de combustible estará en la Ley de
          Urgente consideración, y esta estaría aprobada en 90 días. El Poder Ejecutivo determinará una
          reglamentación paulatina para que Ancap se prepare para la competencia.
        retrieved_at: 2026-09-04
  _faltante: segunda_fuente

- politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2020-03-11
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    en estos días, con la baja muy grande en los precios del petróleo, nuestro equipo económico trabajó
    fuertemente para conseguir buen combustible a buen precio para el segundo semestre del año. Ancap ya había
    comprado petróleo para el primer semestre al precio anterior a la caída. El trabajo de estos días en la
    compra del mercado futuro que nos permitió comprar para los próximos seis meses puede llegar a resultar en
    que la adecuación en el precio sea bastante menor a la que planificábamos. Somos optimistas en generar
    buena compra. Preferimos no adelantar cuál va a ser la adecuación en el precio de los combustibles.
  resumen: >-
    En el anuncio del primer ajuste de tarifas públicas de su gobierno, dijo que los combustibles no subirían por
    ahora gracias a la caída del precio internacional del petróleo y a compras adelantadas en el mercado de
    futuros, mientras sí subían las tarifas de UTE, OSE y Antel; aclaró que esa compra podía derivar en una futura
    "adecuación" del precio de los combustibles menor a la planificada, pero se negó a adelantar de cuánto sería.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://montevideo.com.uy/Noticias/Aumento-de-tarifas-UTE-10-5--OSE-10-7--y-Antel-9-78--No-suben-los-combustibles-uc746676
        medio: montevideo-portal
        fecha: 2020-03-11
        tipo: nota
        titulo: 'Aumento de tarifas: UTE 10,5 %, OSE 10,7 % y Antel 9,78 %. No suben los combustibles'
        cita: >-
          en estos días, con la baja muy grande en los precios del petróleo, nuestro equipo económico trabajó
          fuertemente para conseguir buen combustible a buen precio para el segundo semestre del año. [...] Ancap
          ya había comprado petróleo para el primer semestre al precio anterior a la caída. El trabajo de estos
          días en la compra del mercado futuro que nos permitió comprar para los próximos seis meses puede
          llegar a resultar en que la adecuación en el precio sea bastante menor a la que planificábamos. [...]
          Somos optimistas en generar buena compra. Preferimos no adelantar cuál va a ser la adecuación en el
          precio de los combustibles.
        retrieved_at: 2026-09-04
    _faltante: segunda_fuente

- politico: lacalle-pou
