        cita: >-
          Ayer cuando estaba viendo el informativo mandé dos mensajes. Uno a mi amigo (Omar) Paganini y otro a
          Azucena Arbeleche. ´Bajó el petróleo´ fue mi mensaje.
        retrieved_at: 2026-09-04
      - url: https://www.teledoce.com/telemundo/nacionales/los-mensajes-que-envio-lacalle-a-arbeleche-y-paganini-tras-la-caida-del-precio-del-petroleo-y-que-dijo-sobre-los-combustibles/
        medio: teledoce
        fecha: 2021-07-20
        tipo: nota
        titulo: Los mensajes que envió Lacalle a Arbeleche y Paganini tras la caída del precio del petróleo y qué dijo sobre los combustibles
        cita: >-
          La voluntad del gobierno es tener combustibles más baratos, la voluntad del gobierno es transparentar
