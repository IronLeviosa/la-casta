  titulo: La suba del IRPF del 15% al 18% en una franja salarial
  afirmacion: El IRPF sube del 15% al 18% para los salarios nominales entre $33.401 y $50.100.
  fragmento: ese aumento era del 15% al 18%
  calificacion: discutible
  dato_real:
    valor: >-
      Once días después de esta declaración, Astori confirmó en conferencia de prensa tras el
      Consejo de Ministros -según lo publicó la propia Presidencia- que ese aumento puntual fue
      retirado del proyecto de Rendición de Cuentas por acuerdo entre el Gobierno y los
      parlamentarios del Frente Amplio: la franja de $33.400 a $50.100 se mantuvo en 15%, sin la
      suba a 18% que la propuesta original y esta declaración contemplaban.


      El ajuste finalmente propuesto trasladó el aumento a las franjas superiores (la de $50.100 a
      $100.200 pasó de 20% a 24%, y de ahí hacia arriba hasta 36% para salarios de más de $384.000)
      y elevó el tope de deducciones de la franja de $33.400-$50.100 de 8% a 10%.


      La Ley 19.438 (Rendición de Cuentas 2015, promulgada 14/10/2016) expresa la escala de franjas
      en unidades BPC y remite la conversión a pesos a la reglamentación posterior; no se pudo
      establecer con su texto los montos exactos en pesos para esta franja. El anuncio de
      Presidencia y la cobertura de esa misma conferencia coinciden en que la suba de esta franja no
      llegó a aplicarse.
