        cita: El ministro de Economía y Finanzas, Danilo Astori, sostuvo que no existe la posibilidad de
          eliminar el incremento de 15% a 18% en la tasa del Impuesto a la Renta de las Personas
          Físicas (IRPF) para los salarios nominales entre $ 33.401 y $ 50.100
        retrieved_at: 2026-09-15
  analisis: >-
    Según consignó El País, el gobierno proponía subir el IRPF del 15% al 18% para los salarios
    nominales entre $33.401 y $50.100; esos números no están entre las palabras textuales de Astori
    citadas en la nota, que solo explican por qué no se puede eliminar una franja del impuesto sin
    afectar la liquidación de todas las demás.


    Once días después, un comunicado oficial de Presidencia confirmó que esa suba puntual fue
    retirada del proyecto por acuerdo con legisladores del Frente Amplio y que la franja siguió
    pagando 15%, lo que respalda que el aumento a esa franja estuvo efectivamente en danza aunque no
    llegó a aplicarse. No se localizó el texto de la Ley 19.438 (Rendición de Cuentas 2015) con las
    franjas exactas en pesos para confirmar de forma independiente el número "18%".
  revision:
    tier: probable
    notas_internas: "Documento previsible parcialmente resuelto: el comunicado de Presidencia del
      6/6/2016 confirma la marcha atras y que la franja siguio en 15%, pero no se encontro el texto
      de la Ley 19.438 para confirmar el numero 18% de forma independiente de El Pais."
