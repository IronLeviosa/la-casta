- politico: lacalle-pou
  tema: economia/impuestos
  fecha: 2020-03-11
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: >-
    ¿Por qué se toma? Se toma porque el déficit es grande. Debería ser una
    pregunta para los que estaban acá hace seis meses
  resumen: >-
    Consultado por la reducción de la exoneración de IVA en tarjetas de
    débito y crédito, a once días de asumir, atribuyó la necesidad de la
    medida al déficit heredado del gobierno anterior; en la misma
    conferencia calificó la suba de tarifas públicas como una "adecuación"
    por debajo de los costos, no como un aumento para recaudar. La tesis
    de que con estas medidas el compromiso electoral "se súper cumplió" es
    de Isaac Alfie (director de OPP), no una frase suya.
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.elobservador.com.uy/nota/promesas-de-lacalle-lo-que-decia-y-como-argumenta-que-no-las-incumple-202031120430
        medio: el-observador
        fecha: 2020-03-12
        tipo: nota
        titulo: 'Promesas de campaña: lo que decía Lacalle y cómo argumenta que no las incumple'
        cita: >-
          ¿Por qué se toma? Se toma porque el déficit es grande. Debería
          ser una pregunta para los que estaban acá hace seis meses
        retrieved_at: 2026-09-04
      - url: https://ladiaria.com.uy/politica/articulo/2020/3/gobierno-aumenta-el-iva-a-las-tarjetas-de-debito-sube-tarifas-de-ose-ute-y-antel-en-el-entorno-del-10-y-posterga-ajuste-de-combustibles/
        medio: la-diaria
        fecha: 2020-03-11
        tipo: nota
        titulo: Gobierno aumenta el IVA a las tarjetas de débito, sube tarifas de OSE, UTE y Antel en el entorno del 10% y posterga ajuste de combustibles
        cita: >-
          hay varios elementos que preceden al anuncio, como "compromisos
          electorales" hechos en la campaña, "la inacción u omisión" del
          gobierno anterior de "adecuar las tarifas en virtud de los
          costos de los servicios"
        retrieved_at: 2026-09-04

