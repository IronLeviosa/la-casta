- politico: lacalle-pou
  tema: economia/impuestos
  fecha: 2019-12-04
  contexto: entrevista
  cargo_en_ese_momento: presidente electo
  cita: >-
    En realidad lo que debería de haber pasado ahora no es un aumento de
    los precios de las tarifas. Básicamente es acompañar los costos de las
    tarifas. Eso es lo que se está pidiendo y lo lógico. Si aumentan los
    costos de las empresas públicas, si aumentan los costos por distintas
    situaciones, acompañar los costos no es un aumento de tarifas para
    recaudar. Eso es lo que nosotros históricamente sostuvimos, que es un
    aumento por encima de los costos, que de alguna manera lo que hace es
    tapar el agujero de que la administración iba generando.
  resumen: >-
    En la misma entrevista en la que acusó al gobierno saliente de subir
    tarifas e impuestos, y meses antes de asumir, distinguió entre
    "acompañar los costos" de las tarifas públicas y un aumento de tarifas
    para recaudar, fijando el criterio con el que su gobierno calificaría
    después los ajustes tarifarios.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://www.youtube.com/watch?v=tHYNE5IGMyE
        medio: youtube
        fecha: 2019-12-04
        tipo: video
        titulo: 'Lacalle Pou: "El gobierno entrega la casa desordenada"'
        marca_tiempo: 63
        cita: >-
          En realidad lo que debería de haber pasado ahora no es un
          aumento de los precios de las tarifas. Básicamente es acompañar
          los costos de las tarifas. Eso es lo que se está pidiendo y lo
          lógico. Si aumentan los costos de las empresas públicas, si
          aumentan los costos por distintas situaciones, acompañar los
          costos no es un aumento de tarifas para recaudar. Eso es lo que
          nosotros históricamente sostuvimos, que es un aumento por
          encima de los costos, que de alguna manera lo que hace es tapar
          el agujero de que la administración iba generando.
        retrieved_at: 2026-09-04

