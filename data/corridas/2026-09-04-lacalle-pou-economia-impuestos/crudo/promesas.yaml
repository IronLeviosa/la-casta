- politico: lacalle-pou
  tema: economia/impuestos
  texto: >-
    No aumentar impuestos, tarifas públicas ni combustibles si es electo
    presidente ("Si gana el Partido Nacional se terminó el aumento de
    impuestos, las tarifas y los combustibles").
  fecha_promesa: 2019-03-30
  origen:
    nivel: reportado
    fuentes:
      - url: https://www.subrayado.com.uy/si-ganamos-se-termino-la-suba-impuestos-tarifas-y-combustibles-n530131
        medio: subrayado
        fecha: 2019-03-30
        tipo: nota
        titulo: '"Si ganamos se terminó la suba de impuestos, tarifas y combustibles"'
        cita: >-
          Si gana el Partido Nacional se terminó el aumento de impuestos,
          las tarifas y los combustibles. Se terminó
        retrieved_at: 2026-09-04
      - url: https://www.elobservador.com.uy/nota/promesas-de-lacalle-lo-que-decia-y-como-argumenta-que-no-las-incumple-202031120430
        medio: el-observador
        fecha: 2020-03-12
        tipo: nota
        titulo: 'Promesas de campaña: lo que decía Lacalle y cómo argumenta que no las incumple'
        cita: >-
          Si gana el Partido Nacional se terminó el aumento de tarifas,
          impuestos y combustibles
        retrieved_at: 2026-09-04
  evidencias_candidatas:
    - fecha: 2020-03-11
      tipo: accion_de_gobierno
      efecto: en_contra
      descripcion: >-
        A once días de asumir, el gobierno anunció un ajuste de tarifas
        públicas (UTE, OSE, Antel, en torno al 10%) y redujo a la mitad la
        exoneración de IVA en compras con tarjeta de débito y crédito, lo
        que en los hechos aumenta la carga tributaria en esas operaciones.
        La oposición lo calificó de incumplimiento ("tarifazo"); el propio
        Lacalle Pou y su equipo económico lo describieron como una
        "adecuación" por costos heredados del gobierno anterior, no como
        un aumento para recaudar.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/promesas-de-lacalle-lo-que-decia-y-como-argumenta-que-no-las-incumple-202031120430
            medio: el-observador
            fecha: 2020-03-12
            tipo: nota
            titulo: 'Promesas de campaña: lo que decía Lacalle y cómo argumenta que no las incumple'
            cita: >-
              debió pedirle a la ciudadanía "parte del esfuerzo" al
              anunciar un ajuste de tarifas en UTE, Antel y OSE que ronda
              el 10% y una rebaja a la mitad en la exoneración del IVA a
              las tarjetas que, en los hechos, aumenta la carga
              tributaria
            retrieved_at: 2026-09-04
          - url: https://ladiaria.com.uy/politica/articulo/2020/3/gobierno-aumenta-el-iva-a-las-tarjetas-de-debito-sube-tarifas-de-ose-ute-y-antel-en-el-entorno-del-10-y-posterga-ajuste-de-combustibles/
            medio: la-diaria
            fecha: 2020-03-11
            tipo: nota
            titulo: Gobierno aumenta el IVA a las tarjetas de débito, sube tarifas de OSE, UTE y Antel en el entorno del 10% y posterga ajuste de combustibles
            cita: >-
              En la oposición calificaron los anuncios como un "tarifazo"
              y aseguraron que Lacalle Pou está incumpliendo su promesa
              electoral de no subir impuestos
            retrieved_at: 2026-09-04
    - fecha: 2020-04-08
      tipo: ley
      efecto: en_contra
      descripcion: >-
        La Ley 19.874 creó el Fondo Solidario COVID-19 y, dentro de él, el
        "Impuesto Emergencia Sanitaria COVID-19", que gravó las
        remuneraciones y prestaciones nominales del personal del Estado
        (incluidos cargos políticos) superiores a $120.000, aplicado a los
        ingresos de abril y mayo de 2020. Es un tributo nuevo, creado
        durante su gobierno, cuyo nombre legal incluye la palabra
        "impuesto".
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.montevideo.com.uy/Noticias/Lacalle-confirmo-que-deja-de-cobrarse-el-impuesto-coronavirus-a-funcionarios-publicos-uc755946
            medio: montevideo-portal
            fecha: 2020-06-17
            tipo: nota
            titulo: Lacalle confirmó que deja de cobrarse el "impuesto coronavirus" a funcionarios públicos
            cita: >-
              La ley 19.874, promulgada en abril, creó el "Fondo
              Solidario COVID-19", cuyos recursos son destinados al
              tratamiento de la emergencia sanitaria. Por esta ley se
              creó el denominado "Impuesto Emergencia Sanitaria
              COVID-19", que grava las remuneraciones y prestaciones
              nominales del personal del Estado mayores a 120.000 pesos.
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
    - fecha: 2020-06-17
      tipo: accion_de_gobierno
      efecto: a_favor
      descripcion: >-
        El gobierno, a través de la ministra de Economía y Finanzas,
        Azucena Arbeleche, confirmó que no extendería la aplicación del
        "Impuesto Emergencia Sanitaria COVID-19" a los sueldos y
        jubilaciones más altas del sector público más allá de junio de
        2020, pese a que la ley habilitaba prorrogarlo hasta dos meses
        más. Por separado, Montevideo Portal reportó -citando en modo
        condicional al dirigente sindical de Cofe, Joselo López- que
        Lacalle Pou le había confirmado la decisión por mensaje privado;
        esa segunda versión no es una declaración pública del político y
        no se registra como tal (ver declaraciones.yaml, nota de
        correcciones).
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://ladiaria.com.uy/coronavirus/articulo/2020/6/gobierno-deja-de-cobrar-el-tributo-covid-19-a-los-funcionarios-publicos-y-cargos-politicos-con-sueldos-mas-altos/
            medio: la-diaria
            fecha: 2020-06-18
            tipo: nota
            titulo: 'Gobierno deja de cobrar el "tributo covid-19" a los funcionarios públicos y cargos políticos con sueldos más altos'
            cita: >-
              La ministra de Economía y Finanzas, Azucena Arbeleche,
              anunció este miércoles, tras reunirse con el presidente
              Luis Lacalle Pou, que no se extenderá la aplicación del
              impuesto a los sueldos y jubilaciones más altas del sector
              público y a los cargos políticos, que sirvió para financiar
              el Fondo Coronavirus. Junio será el último mes en que se
              recaude el denominado "tributo covid-19".
            retrieved_at: 2026-09-04
          - url: https://www.montevideo.com.uy/Noticias/Lacalle-confirmo-que-deja-de-cobrarse-el-impuesto-coronavirus-a-funcionarios-publicos-uc755946
            medio: montevideo-portal
            fecha: 2020-06-17
            tipo: nota
            titulo: Lacalle confirmó que deja de cobrarse el "impuesto coronavirus" a funcionarios públicos
            cita: >-
              Así lo habría confirmado el presidente de la República,
              Luis Lacalle Pou, al secretario general de la
              Confederación de Organizaciones de Funcionarios del Estado
              (Cofe), Joselo López.
            retrieved_at: 2026-09-04
    - fecha: 2021-07-29
      tipo: declaracion
      efecto: a_favor
      descripcion: >-
        Reivindicó en una entrevista que el gobierno ahorró más de
        US$600 millones durante la pandemia sin crear ni aumentar
        impuestos.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://ladiaria.com.uy/politica/articulo/2021/7/lacalle-pou-enfatizo-que-durante-la-pandemia-se-ahorro-600-millones-de-dolares-sin-poner-impuestos/
            medio: la-diaria
            fecha: 2021-07-29
            tipo: nota
            titulo: Lacalle Pou enfatizó que durante la pandemia se ahorró "600 millones de dólares sin poner impuestos"
            cita: >-
              nosotros tercamente y obstinadamente decíamos que no vamos
              a poner impuestos
            retrieved_at: 2026-09-04
          - url: https://www.elobservador.com.uy/nota/lacalle-pou-sobre-gestion-en-pandemia-ahorramos-mas-de-us-600-millones-sin-poner-impuestos--2021728205316
            medio: el-observador
            fecha: 2021-07-28
            tipo: nota
            titulo: 'Lacalle Pou sobre gestión en pandemia: "Ahorramos más de US$ 600 millones, sin poner impuestos"'
            cita: >-
              Tercamente decíamos: no vamos a poner impuestos. Primero,
              porque no es necesario. Pasamos la pandemia, hicimos un
              gasto importante en 2020 y ahora tenemos un gasto mayor
              previsto por la pandemia en 2021. Y ahorramos más de US$
              600 millones. Sin poner impuestos
            retrieved_at: 2026-09-04
    - fecha: 2023-03-02
      tipo: ley
      efecto: a_favor
      descripcion: >-
        Anunció ante la Asamblea General, y envió al Parlamento, un
        proyecto de rebaja del IRPF (aumento de las deducciones para los
        contribuyentes de menores ingresos, de 10% a 14%) y del IASS, que
        según el gobierno alcanzó al 75% de los contribuyentes de IRPF (63
        mil dejarían de pagarlo) y a 20 mil pasivos que dejarían de pagar
        IASS, con una renuncia fiscal estimada de US$150 millones.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.gub.uy/presidencia/comunicacion/noticias/lacalle-pou-80000-uruguayos-dejaran-pagar-irpf-iass
            medio: presidencia
            fecha: 2023-03-02
            tipo: documento_oficial
            titulo: 'Lacalle Pou: Unos 80.000 uruguayos dejarán de pagar IRPF e IASS'
            cita: >-
              Estamos en condiciones de proceder a una baja de impuestos
              para quienes hacen los mayores esfuerzos
            retrieved_at: 2026-09-04
    - fecha: 2023-03-02
      tipo: decreto
      efecto: a_favor
      descripcion: >-
        El Poder Ejecutivo firmó el Decreto 65/023, que modificó el
        régimen de estimación ficta del IRAE (aplicable a pequeñas
        empresas que combinan capital y trabajo) introduciendo una escala
        progresional de tasas -12% para el primer tramo de ingresos, en
        lugar de una tasa única más alta- "a los efectos de dotarlo de
        mayor progresionalidad", para ejercicios iniciados a partir del 1°
        de enero de 2023. Es el acto de gobierno concreto detrás de los
        "beneficios para micro y pequeñas empresas" anunciados el mismo
        día y de la baja de impuestos a pymes que Lacalle Pou reivindicó
        en junio de 2024 (ver declaraciones.yaml, 2024-06-21). El Decreto
        71/023 (8/3/2023) introdujo un ajuste adicional a la misma escala.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.impo.com.uy/bases/decretos-originales/65-2023
            medio: impo
            fecha: 2023-03-02
            tipo: documento_oficial
            titulo: 'Decreto N° 65/023 - Modifícanse los Decretos 150/007 y 419/022 (régimen de estimación ficta del IRAE)'
            cita: >-
              CONSIDERANDO: I) que es conveniente realizar ajustes en el
              régimen de estimación ficta en el IRAE, correspondiente a
              las rentas obtenidas por combinación de capital y trabajo,
              a los efectos de dotarlo de mayor progresionalidad
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
    - fecha: 2023-03-24
      tipo: ley
      efecto: a_favor
      descripcion: >-
        El Poder Ejecutivo promulgó la Ley 20.124, que sustituyó el
        artículo 38 del Título 7 (deducciones del IRPF) y el artículo 8°
        de la Ley 18.314 (tasas del IASS), estableciendo una escala
        progresional para el IASS que exonera del tributo los ingresos
        anuales por jubilaciones y pensiones de hasta 108 BPC. Es la
        norma legal, ya sancionada y con firma de Lacalle Pou, que dio
        forma jurídica al anuncio del 2 de marzo de 2023 (ver
        evidencia_candidata anterior, que documenta solo el anuncio, no
        la ley aprobada).
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes-originales/20124-2023
            medio: impo
            fecha: 2023-03-24
            tipo: documento_oficial
            titulo: 'Ley N° 20.124 - Modifícanse el Impuesto a la Renta de las Personas Físicas y el Impuesto de Asistencia a la Seguridad Social'
            cita: >-
              ARTÍCULO 8°. (Tasas progresionales).- Las alícuotas del
              tributo se aplicarán de forma progresional. A tal fin el
              total de ingresos gravados se incluirá en la escala a que
              refiere este artículo, aplicándose a la porción de ingreso
              en cada tramo la tasa que corresponda
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
    - fecha: 2025-02-13
      tipo: dato_oficial
      efecto: a_favor
      descripcion: >-
        Al cierre del gobierno, la ministra de Economía, Azucena
        Arbeleche, presentó un balance en el que sostuvo que las demandas
        sociales del quinquenio se atendieron "sin aumentar la carga
        tributaria" y que, tal como se dejaba la administración, no sería
        necesario un ajuste fiscal ni una suba de impuestos para el
        gobierno entrante.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.infobae.com/america/america-latina/2025/02/13/gobierno-de-lacalle-pou-presento-los-numeros-que-heredara-orsi-no-es-necesario-hacer-un-ajuste-fiscal/
            medio: infobae
            fecha: 2025-02-13
            tipo: nota
            titulo: 'Gobierno de Lacalle Pou presentó los números que heredará Orsi: "No es necesario hacer un ajuste fiscal"'
            cita: >-
              Tal como se está dejando la administración, no es
              necesario hacer un ajuste fiscal. No es necesario ni subir
              impuestos ni bajar los gastos
            retrieved_at: 2026-09-04
        _faltante: segunda_fuente
