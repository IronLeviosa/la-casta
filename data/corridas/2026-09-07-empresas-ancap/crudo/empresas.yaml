# Ficha de empresa pública/ente autónomo. Primera de la colección `empresas`.
# Investigador: ver _investigacion en el registro. No se asigna tier, procedencia ni id.
# Esquema real usado: src/schemas/empresa.ts (leído y validado con `pnpm validar --inbox` en esta
# sesión; difiere en algunos nombres de campo del ejemplo del brief — ver notas.md).
- _slug: ancap
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  nombre: ANCAP
  nombre_completo: Administración Nacional de Combustibles, Alcohol y Pórtland
  tipo: ente_autonomo   # así se autodefine ANCAP en sus propios estados financieros: "organizada bajo la forma de ente autónomo"
  alias: [ANCAP, Ancap, la petrolera estatal, la refinería de La Teja]
  creacion:
    fecha: 1931-10-15
    norma: Ley 8.764
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/8764-1931
        medio: impo
        fecha: 1931-10-23
        tipo: documento_oficial
        titulo: Ley N° 8764 - ANCAP. Creación
        cita: >-
          Créase un Ente Industrial del Estado, que se denominará "Administración Nacional de
          combustible alcohol y portland", con el cometido de explotar y administrar el monopolio del
          alcohol y carburante nacional y de importar, rectificar y vender petróleo y sus derivados y de
          fabricar portland.
        retrieved_at: 2026-09-07
      - url: https://www.ancap.com.uy/20615/1/eecc-individuales-2024.html
        medio: ancap
        fecha: 2024-12-31
        tipo: documento_oficial
        titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2024
        cita: >-
          La Administración Nacional de Combustibles, Alcohol y Pórtland (en adelante “ANCAP” o “la
          Compañía”) es una persona jurídica de derecho público del dominio comercial e industrial del
          Estado, organizada bajo la forma de ente autónomo, que se rige por su Ley de creación Nº
          8.764, del 15 de octubre de 1931 y sus posteriores modificaciones.
        retrieved_at: 2026-09-07
  que_hace: >-
    ANCAP administra y explota el monopolio de la importación y refinación de petróleo, y de la
    importación y exportación de combustibles líquidos, semilíquidos y gaseosos, con excepción de la
    importación de gas natural. Sus principales actividades son la importación y refinación de
    petróleo y derivados en la refinería de La Teja, la comercialización y distribución de
    combustibles, la importación y elaboración de lubricantes, la fabricación y comercialización de
    cemento pórtland, la preparación de agrocombustibles (mezcla de biodiésel con gasoil y de alcohol
    carburante con nafta) y, desde 2022, la producción de hidrógeno verde y derivados en régimen de
    libre competencia. Opera además, a través de subsidiarias y participadas, en distribución de
    combustibles (DUCSA), producción de alcoholes y agrocombustibles (ALUR), gas por cañería
    (Gasoducto Cruz del Sur, Conecta) y cemento (Cementos del Plata).
  que_hace_fuentes:
    - url: https://www.ancap.com.uy/20615/1/eecc-individuales-2024.html
      medio: ancap
      fecha: 2024-12-31
      tipo: documento_oficial
      titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2024
      cita: >-
        ANCAP administra y explota el monopolio de: • de la importación y refinación de petróleo; • de
        la importación y exportación de combustibles líquidos, semilíquidos y gaseosos cualquiera fuera
        su estado, con excepción de la importación de gas natural. Asimismo tiene como cometido la
        producción y exportación de alcohol carburante y biodiesel (ley 18.195, art.2) De acuerdo a lo
        dispuesto en la Ley 19.924 se extiende lo dispuesto para el alcohol carburante y biodiesel a
        todos el de los combustibles líquidos renovables obtenibles ya sea a partir de materias primas
        de origen agropecuario o a partir del procesamiento de residuos industriales, agroindustriales o
        sólidos urbanos incluyendo la producción, comercialización interna y exportación de combustibles
        líquidos renovables con materias primas nacionales o importadas. Las siguientes son las
        principales actividades de ANCAP: • Importación y refinación de petróleo y sus derivados. •
        Comercialización y distribución de combustibles líquidos, semilíquidos y gaseosos. • Importación,
        elaboración y comercialización de lubricantes. • Fabricación y comercialización de cemento
        pórtland y materiales afines. • Preparación de agrocombustibles líquidos a partir de la mezcla de
        biodiesel con gasoil y de alcohol carburante con nafta (gasolina), para su comercialización. •
        Producción, distribución, comercialización, importación y exportación de hidrógeno verde y
        derivados producidos a partir de este (combustibles sintéticos, metanol, amoníaco, líquidos
        orgánicos portadores de hidrógeno, entre otros), en régimen de libre competencia.
      retrieved_at: 2026-09-07
    - url: https://www.ancap.com.uy/20615/1/eecc-individuales-2024.html
      medio: ancap
      fecha: 2024-12-31
      tipo: documento_oficial
      titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2024
      cita: >-
        1.2 Participaciones en otras compañías al 31 de diciembre de 2024 ANCAP posee los siguientes
        porcentajes de participación en las siguientes compañías: ANCAP Alcoholes del Uruguay S. A.
        (ALUR) Distribuidora Uruguaya de Combustibles S.A. (DUCSA) Petrouruguay S.A. (PUSA) Gasoducto
        Cruz del Sur Gas Uruguay S.A. Conecta S.A. Cementos del Plata S.A. (CDP)
      retrieved_at: 2026-09-07

  monopolio:
    tiene: true
    alcance: >-
      El monopolio original (Ley 8.764, 1931) reserva al Estado, a través de ANCAP: la importación y
      refinación de petróleo crudo; la importación y exportación de combustibles líquidos, semilíquidos
      y gaseosos; y la fabricación, importación y venta de alcohol carburante nacional. La Ley 17.448
      (4 de enero de 2002), impulsada por el gobierno de Jorge Batlle, derogaba el monopolio de
      importación, exportación y refinación de petróleo crudo y el de exportación de derivados, y
      habilitaba una asociación de ANCAP con un socio privado; esa ley fue revertida por el referéndum
      del 7 de diciembre de 2003 (62,1% de los votos válidos por el Sí a la derogación) y nunca llegó a
      aplicarse, por lo que el monopolio original de 1931 sigue vigente en esa materia. La Ley 19.924
      (Presupuesto, 18/12/2020) modificó el literal F) del artículo 1 de la Ley 8.764 sobre la fijación
      de precios de los productos no monopolizados. La Ley 19.889 (LUC, 2020), artículos 235 a 237,
      estableció el mecanismo vigente de fijación de precios de combustibles (informes preceptivos de
      URSEA y ANCAP, actualización cada 60 días como máximo) sin derogar el monopolio de
      importación/refinación: un artículo que sí lo desmonopolizaba (el 230 del anteproyecto) fue
      retirado de la LUC en mayo de 2020 por falta de acuerdo dentro de la coalición de gobierno. Según
      cobertura de prensa, desde 2020 el monopolio no rige para la venta de combustible a buques en el
      puerto de Montevideo ni en otros puertos operados por la Administración Nacional de Puertos, y
      desde 2023 tampoco en los aeropuertos. La Ley 20.075 (20/10/2022) agregó a los cometidos de ANCAP
      la producción y comercialización de hidrógeno verde y derivados "en régimen de libre
      competencia", es decir, expresamente fuera del monopolio.
    normas:
      - norma: Ley 8.764 (15/10/1931), artículo 1 - creación del monopolio de importación/refinación de
          petróleo y combustibles y del alcohol carburante
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/8764-1931
            medio: impo
            fecha: 1931-10-23
            tipo: documento_oficial
            titulo: Ley N° 8764
            cita: >-
              A tal fin se declara de utilidad pública el derecho exclusivo a favor del Estado: A) A la
              importación y exportación de alcoholes, su fabricación, rectificación, desnaturalización y
              venta, así como la de carburantes nacionales en todo el territorio de la República. B) A
              la importación y refinación de petróleo crudo y sus derivados en todo el territorio de la
              República. C) A la importación y exportación de carburantes líquidos, semilíquidos y
              gaseosos, cualesquiera sea su estado y su composición, cuando las refinerías del Estado
              produzcan por lo menos, el 50 % de la nafta que consuma el país.
            retrieved_at: 2026-09-07
      - norma: Ley 17.448 (04/01/2002) - desmonopolización y asociación con privados; derogada por el
          referéndum del 07/12/2003, sin efecto
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/17448-2002
            medio: impo
            fecha: 2002-01-14
            tipo: documento_oficial
            titulo: Ley N° 17448
            cita: >-
              LEY DE ANCAP - LEY DE DESMONOPOLIZACION Promulgación: 04/01/2002 Publicación: 14/01/2002
              ... Quedó sin efecto por: Referéndum de fecha 7 de diciembre de 2003.
            retrieved_at: 2026-09-07
          - url: https://uruguay.justia.com/nacionales/leyes/ley-17448-jan-4-2002/gdoc
            medio: justia
            fecha: 2002-01-14
            tipo: nota
            titulo: 'Ley 17448 - ANCAP: derógase el monopolio de la importación, exportación y refinación de petróleo crudo'
            cita: >-
              Artículo 1º.- Derógase el monopolio de la importación, exportación y refinación de
              petróleo crudo y el de exportación de derivados de petróleo, establecidos a favor del
              Estado y administrados por la Administración Nacional de Combustibles, Alcohol y Portland
              (ANCAP) de acuerdo con la Ley Nº 8.764, de 15 de octubre de 1931.
            retrieved_at: 2026-09-07
          - url: https://es.wikipedia.org/wiki/Refer%C3%A9ndum_sobre_la_Ley_de_ANCAP
            medio: wikipedia
            fecha: 2021-12-06
            tipo: nota
            titulo: Referéndum sobre la Ley de ANCAP
            cita: >-
              La opción a favor de la derogación alcanzó el 62.1% de los votos válidos, por lo que la
              ley quedó sin efecto.
            retrieved_at: 2026-09-07
      - norma: Ley 19.924 (Presupuesto, 18/12/2020), artículo 317 - modifica el literal F) del artículo
          1 de la Ley 8.764 sobre fijación de precios de productos no monopolizados
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/8764-1931
            medio: impo
            fecha: 1931-10-23
            tipo: documento_oficial
            titulo: Ley N° 8764
            cita: >-
              Literal F) redacción dada por: Ley Nº 19.924 de 18/12/2020 artículo 317. Literal F) ver
              vigencia: Ley Nº 19.924 de 18/12/2020 artículo 3.
            retrieved_at: 2026-09-07
      - norma: Ley 19.889 (LUC, 09/07/2020), artículos 235 a 237 - mecanismo de fijación de precios de
          combustibles (no deroga el monopolio de importación/refinación)
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/19889-2020/235
            medio: impo
            fecha: 2020-07-14
            tipo: documento_oficial
            titulo: Ley N° 19889, artículo 235
            cita: >-
              Artículo 235 (Aprobación de los precios de los combustibles).- El Poder Ejecutivo aprobará
              el precio de venta de los diferentes combustibles producidos por la Administración
              Nacional de Combustibles, Alcohol y Portland (ANCAP), con entrega en cada una de sus
              plantas de distribución, previo informe preceptivo de la Unidad Reguladora de Servicios de
              Energía y Agua (URSEA) y de la Administración Nacional de Combustibles, Alcohol y Portland
              (ANCAP).
            retrieved_at: 2026-09-07
          - url: https://www.subrayado.com.uy/la-coalicion-sacara-la-luc-la-desmonopolizacion-ancap-falta-acuerdo-interno-n631084
            medio: subrayado
            fecha: 2020-05-22
            tipo: nota
            titulo: La coalición sacará de la LUC la desmonopolización de ANCAP tras falta de acuerdo interno
            cita: >-
              La bancada de legisladores de la coalición de gobierno no llegó a un acuerdo y resolvió
              quitar de la ley de urgente consideración (LUC) el artículo 230 que proponía la
              desmonopolización de ANCAP y establecía la libre importación de combustibles.
            retrieved_at: 2026-09-07
      - norma: Ley 20.075 (20/10/2022) - agrega el hidrógeno verde y derivados a los cometidos de ANCAP,
          en régimen de libre competencia (fuera del monopolio)
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/8764-1931
            medio: impo
            fecha: 1931-10-23
            tipo: documento_oficial
            titulo: Ley N° 8764
            cita: >-
              Inciso final ver vigencia: Ley Nº 20.075 de 20/10/2022 artículo 5. Inciso final agregado/s
              por: Ley Nº 20.075 de 20/10/2022 artículo 234.
            retrieved_at: 2026-09-07
      - norma: Excepción portuaria (desde 2020) y aeroportuaria (desde 2023) a la venta de combustible
          por ANCAP, según cobertura de prensa
        fuentes:
          - url: https://www.elobservador.com.uy/nota/que-argumenta-el-gobierno-para-habilitar-la-libre-importacion-de-combustibles-para-barcos-202010819440
            medio: el-observador
            fecha: 2020-10-09
            tipo: nota
            titulo: Qué argumenta el gobierno para habilitar la importación de combustibles en puertos
            cita: >-
              La norma establece que el monopolio de Ancap "no regirá en el puerto de Montevideo ni en
              cualquier otro puerto propiedad u operado por la Administración Nacional de Puertos”.
            retrieved_at: 2026-09-07
    argumentos_a_favor:
      - texto: >-
          Refinar petróleo crea valor cuando producir los derivados para la canasta de energéticos que
          demanda el país es menos costoso que importarlos, más allá del precio que se decida fijar en
          base a otras consideraciones; mantener la refinería propia da al país una capacidad industrial
          que no depende de terceros.
        quien: ANCAP
        fuentes:
          - url: https://www.ancap.com.uy/2147/6/composicion-de-precio-y-comparacion-ursea.html
            medio: ancap
            fecha: 2026-09-07
            tipo: documento_oficial
            titulo: Composición de Precio y Comparación URSEA
            cita: >-
              Refinar petróleo crea valor, cuando producir los derivados de petróleo para la canasta de
              energéticos que demanda el país es menos costoso que importarlos, más allá del precio que
              se decida fijar en base a otras consideraciones.
            retrieved_at: 2026-09-07
      - texto: >-
          Al poseer la refinería y el monopolio de importación de combustibles, Uruguay gana en
          soberanía y reduce su dependencia del exterior.
        quien: quienes defienden el rol de la empresa estatal en la economía (formulación de la diaria,
          sin atribución individual)
        fuentes:
          - url: https://ladiaria.com.uy/luc/articulo/2021/11/luc-numeros-y-argumentos-detras-del-debate-sobre-el-precio-de-los-combustibles/
            medio: la-diaria
            fecha: 2021-11-24
            tipo: nota
            titulo: 'LUC: números y argumentos detrás del debate sobre el precio de los combustibles'
            cita: >-
              al poseer ese activo Uruguay gana en soberanía y reduce su dependencia del exterior,
              plantean quienes defienden el rol de la empresa estatal dentro de la economía
            retrieved_at: 2026-09-07
      - texto: >-
          La ciudadanía votó, por amplia mayoría, mantener el monopolio de ANCAP sobre la importación,
          exportación y refinación de petróleo crudo, rechazando la ley que lo habría derogado.
        quien: ciudadanía uruguaya, referéndum del 7 de diciembre de 2003
        fuentes:
          - url: https://es.wikipedia.org/wiki/Refer%C3%A9ndum_sobre_la_Ley_de_ANCAP
            medio: wikipedia
            fecha: 2021-12-06
            tipo: nota
            titulo: Referéndum sobre la Ley de ANCAP
            cita: >-
              El referéndum sobre la Ley de ANCAP fue una elección realizada en Uruguay el 7 de
              diciembre de 2003 que buscaba la derogación de la ley 17 448 (conocida como «Ley de
              ANCAP»). La norma, promulgada por el Parlamento nacional en enero de 2002, derogaba el
              monopolio de la importación, exportación y refinación de petróleo y el de la exportación
              de derivados del petróleo, hasta entonces en manos de la empresa estatal.
            retrieved_at: 2026-09-07
      - texto: >-
          Dentro de la coalición de gobierno, hubo sectores que se opusieron a terminar con el
          monopolio de ANCAP cuando se discutió incluirlo en la LUC.
        quien: sectores del Partido Colorado y Cabildo Abierto, según Subrayado
        fuentes:
          - url: https://www.subrayado.com.uy/la-coalicion-sacara-la-luc-la-desmonopolizacion-ancap-falta-acuerdo-interno-n631084
            medio: subrayado
            fecha: 2020-05-22
            tipo: nota
            titulo: La coalición sacará de la LUC la desmonopolización de ANCAP tras falta de acuerdo interno
            cita: >-
              El Partido Colorado y Cabildo Abierto fueron los socios de la coalición que plantearon
              reparos a la caída del monopolio de ANCAP.
            retrieved_at: 2026-09-07
    argumentos_en_contra:
      - texto: >-
          No hay que temerle a terminar con el monopolio; la libre importación de combustibles es la
          medida más liberal que impulsó y no logró aplicar por falta de apoyo político, y cree que el
          país va a terminar adoptándola.
        quien: Luis Lacalle Pou, presidente
        fuentes:
          - url: https://www.montevideo.com.uy/Noticias/-Jugamos-como-nunca-perdimos-como-siempre--Lacalle-por-libre-importacion-de-combustibles-uc881969
            medio: montevideo-portal
            fecha: 2024-03-08
            tipo: nota
            titulo: '"Jugamos como nunca, perdimos como siempre": Lacalle por libre importación de combustibles'
            cita: >-
              No, no hay monopolio en nada. Porque si cada uno protege la suya, somos una multiplicación
              de monopolios. Por eso, en el tema de los combustibles hay que entender cómo se conforma
              una decisión política, y también hay que seguir con estos temas, que creo más temprano que
              tarde vamos a terminar en eso
            retrieved_at: 2026-09-07
      - texto: >-
          Al ser el sector público el responsable de generar un insumo clave para la producción, como
          los combustibles, hay ineficiencias que se trasladan a toda la población.
        quien: otros (formulación de la diaria, contrapuesta a la defensa de la empresa estatal, sin
          atribución individual)
        fuentes:
          - url: https://ladiaria.com.uy/luc/articulo/2021/11/luc-numeros-y-argumentos-detras-del-debate-sobre-el-precio-de-los-combustibles/
            medio: la-diaria
            fecha: 2021-11-24
            tipo: nota
            titulo: 'LUC: números y argumentos detrás del debate sobre el precio de los combustibles'
            cita: >-
              otros apuntan a que al ser responsable el sector público de generar un insumo clave para
              la producción, hay ineficiencias que se trasladan a toda la población
            retrieved_at: 2026-09-07
      - texto: >-
          El gobierno de Jorge Batlle promovió, con una "ley de consenso" acordada entre varios
          partidos (sin el Frente Amplio), derogar el monopolio de importación, exportación y
          refinación de petróleo crudo y habilitar la asociación de ANCAP con un socio privado que
          podría gestionar el negocio, aunque ANCAP retendría la mayoría accionaria y el control de las
          decisiones estratégicas.
        quien: gobierno de Jorge Batlle (Ley 17.448, 2001-2002)
        fuentes:
          - url: https://uruguay.justia.com/nacionales/leyes/ley-17448-jan-4-2002/gdoc
            medio: justia
            fecha: 2002-01-14
            tipo: nota
            titulo: 'Ley 17448 - ANCAP: derógase el monopolio de la importación, exportación y refinación de petróleo crudo'
            cita: >-
              Artículo 3º.- A los efectos de la constitución de la asociación, la Administración
              Nacional de Combustibles, Alcohol y Portland (ANCAP) deberá aprobar un plan básico de
              negocios y tendrá la mayoría accionaria de la sociedad así creada, sin perjuicio que podrá
              encomendar la gestión al socio en los términos y condiciones que se establezcan en la
              presente ley, pliego del llamado y contrato respectivo.
            retrieved_at: 2026-09-07
          - url: https://www.subrayado.com.uy/ancap-empresas-publicas-y-caducidad-la-historia-los-referendums-uruguay-n852564
            medio: subrayado
            fecha: 2022-03-26
            tipo: nota
            titulo: 'ANCAP, empresas públicas y Caducidad: la historia de los referéndums en Uruguay'
            cita: >-
              En 2001, el gobierno del entonces presidente Jorge Batlle buscaba impulsar la reforma de
              ANCAP. Para que eso fuera exitoso se definió que lo mejor era que el proyecto no surgiera a
              iniciativa del Poder Ejecutivo. Así, fue que el gobierno creó un llamado proyecto de “ley
              de consenso” con aportes de todos los partidos políticos. El Frente Amplio no votó la
              iniciativa.
            retrieved_at: 2026-09-07

