          tipo: nota
          titulo: Uruguay tiene la nafta más cara de Latinoamérica y el tercer gasoil más costoso
          cita: >-
            el escenario es más positivo para Uruguay que, de todas formas, logra integrar el podio
            regional, con un precio de 1,256 dólares por litro. El primer puesto, en este caso, lo ocupa
            México, con un valor de 1,459 dólares; y lo sigue Bolivia, con 1,417 dólares. En este
            energético, además, la posición uruguaya es más pareja con sus vecinos sudamericanos: en
            Argentina (5°), el litro de gasoil se consigue a 1,2 dólares por litro; en Brasil (9°), a
            1,109 dólares; y, en Paraguay (13°), a 0,963 dólares.
