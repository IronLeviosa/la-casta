  precios_vs_paridad:
    descripcion: >-
      El Precio de Paridad de Importación (PPI) es el cálculo que hace URSEA, producto por producto, de
      lo que costaría abastecer el mercado importando el producto terminado y llevándolo a planta de
      distribución de ANCAP, incluyendo tasas e impuestos de ese tramo de la cadena. Desde julio de 2021
      (Ley 19.889, arts. 235-237), el Poder Ejecutivo fija el precio en planta ANCAP (PEP) con informes
      preceptivos de URSEA y de ANCAP, actualizando el precio con una periodicidad no mayor a 60 días;
      antes de esa fecha las tarifas eran propuestas por ANCAP y fijadas por el Poder Ejecutivo sin ese
      mecanismo. La diferencia entre el precio de venta fijado y el PPI (a favor o en contra del
      consumidor) se conoce como "brecha" o, cuando el consumidor paga de más, "sobreprecio". No
      conseguí, para ningún año suelto del período 2015-2024, un desglose oficial nafta/gasoil en
      dólares que calzara con el campo `series` de este esquema (que pide un año puntual): lo que hay
      publicado, y se documenta en `comparaciones`, son dos períodos plurianuales (2010-2014 y
      2015-2019, con desglose nafta/gasoil, cálculo del CED) y cifras agregadas para 2020-2021 y 2024
      (sin desglose por producto). Ver notas.md.
