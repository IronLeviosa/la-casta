          medio: ambito
          fecha: 2026-01-10
          tipo: nota
          titulo: Uruguay tiene la nafta más cara de Latinoamérica y el tercer gasoil más costoso
          cita: >-
            al inicio de 2026, el país quedó en primer lugar en la comparación del valor de la nafta con
            los demás mercados de la región: en el territorio nacional, el litro se consigue a 1,998
            dólares, muy por encima del segundo puesto mexicano, con un precio de 1,427 dólares por
            litro. La disparidad es todavía más evidente si se compara con los demás países del
            Mercosur: Argentina (10°) tiene un precio de 1,159 dólares; Brasil (11°), de 1,148 dólares; y
            Paraguay (18°), de 0,88 dólares.
          retrieved_at: 2026-09-07
