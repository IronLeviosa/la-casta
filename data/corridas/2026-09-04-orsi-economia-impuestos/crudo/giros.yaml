  declaracion_despues: orsi/2026-05-19-ya-dije-tenia-decir
  cambio: sin_cambio
  explicacion: sin_explicacion
  analisis: >-
    El 17 de noviembre de 2024 Orsi prometió, en el debate presidencial, no aumentar los
    impuestos. El 19 de mayo de 2026, año y medio después de asumir, ante la difusión de que el
    Ministerio de Economía estudiaba cambios en IVA, IRPF e IRAE, reiteró la misma posición: "Yo
    ya dije lo que tenía para decir: acá no va a haber aumento". No hay contradicción entre ambas
    declaraciones. Se registra como sin_cambio para no sesgar el registro del período solo hacia
    las declaraciones que muestran tensión con la promesa original.
  revision:
    tier: probable
    notas_internas: >-
      declaracion_despues (2026-05-19) tiene una sola fuente (Subrayado, grupo fontaina-de-feo);
      falta segunda fuente para subir a publicado.
