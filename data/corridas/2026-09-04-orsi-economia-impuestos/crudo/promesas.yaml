  estado: en_proceso_demorada
  fundamentacion: >-
    La promesa se formuló el 17 de noviembre de 2024 sin condicionamiento explícito en su propio
    texto ("no vamos a aumentar los impuestos... no voy a subir los impuestos"), aunque en el mismo
    debate Orsi matizó que esa planificación regía "en términos de normalidad" y podía cambiar si
    "el contexto lo imponía" (ver declaraciones[7] y el giro asociado en giros.yaml). El mandato no
    terminó (asumió el 1/3/2025; el período corre hasta 2030), por lo que corresponde un estado
    en_proceso, no cumplida/incumplida. La evidencia disponible es mixta y se pesó por su solidez,
    no por cuál titular pesa más. A favor: Orsi reafirmó la promesa sin variantes en mayo de 2026,
    pero es autoevaluación del propio promitente, no un hecho de gobierno independiente, y pesa poco
    como evidencia. En contra, con solidez desigual: (1) en agosto de 2025 el gobierno extendió el
    IVA a las compras minoristas por internet en plataformas extranjeras, antes exoneradas bajo el
    régimen de franquicias hasta US$ 800 anuales — un hecho de gobierno verificado con dos fuentes
    de distinto grupo, que el propio Orsi defendió invocando "equidad" frente al comercio local, no
    la contingencia de contexto internacional que había planteado como condición en noviembre de
    2024; es una ampliación de la base imponible de un impuesto ya existente sobre una categoría
    antes exenta, no una suba de la tasa general de IVA ni de otros tributos de aplicación amplia.
    Son sostenibles dos lecturas: que sí es un aumento de impuestos, porque una transacción antes
    exonerada pasa a pagar la tasa general del 22%; o que no lo es, porque la tasa general no cambia
    y lo que se modifica es el alcance de una exención puntual, para nivelar la competencia con el
    comercio local. Orsi había calificado un caso distinto —el recargo de IVA a compras con tarjeta
    del gobierno de Lacalle Pou— como "una muestra clara de aumento de tributos" (declaraciones[9],
    18/11/2024), sin formular en este lote un criterio general que distinga ese caso del suyo propio.
    (2) La Ley de Presupuesto (Ley 20.446, enero 2026) creó el Impuesto Mínimo Complementario
    Doméstico, que alcanza únicamente a multinacionales con facturación superior a US$ 750 millones
    bajo el marco del Pilar Dos de la OCDE; es sostenible tanto la lectura de que crea, con ese
    nombre, un impuesto nuevo, como la de que no constituye una carga nueva sobre contribuyentes
    uruguayos porque capta, vía ese marco internacional, una recaudación que esas multinacionales ya
    pagan en otra jurisdicción. No hay en este lote una declaración de Orsi sobre esta medida
    específica. (3) El ajuste de las franjas de IRPF e IASS por la actualización de la BPC (enero de
    2026) responde, según la propia fuente citada, a un mecanismo de indexación por IPC preexistente,
    no a una decisión discrecional de este gobierno; se pondera con efecto neutral y bajo peso. (4)
    Las acusaciones del Partido Nacional (documento "Construir sin Destruir", marzo de 2026) de
    incrementos adicionales en IRAE, IRNR y zonas francas no están corroboradas en este lote con
    ninguna fuente independiente del propio documento opositor, y se ponderan con bajo peso. (5) La
    declaración de Andrés Ojeda (setiembre de 2025) es un juicio político de un dirigente opositor
    identificable, no un hecho de gobierno verificable, y se pondera igual que (4). Con ese balance
    —dos medidas de gobierno verificadas que amplían qué se grava, de alcance acotado y con una
    justificación oficial distinta de la contingencia que el propio Orsi había planteado como
    condición para apartarse de la promesa, frente a una reafirmación pública sin variantes de la
    promesa original y sin que se hayan modificado las tasas generales de IRPF, IRAE o IVA— se
    clasifica como en_proceso_demorada: hay indicios verificados de apartamiento parcial de la
    promesa leída literalmente, sin que equivalga, con el período aún en curso, a un incumplimiento
    general de la promesa.
  revision:
    tier: publicado
    notas_internas: >-
      El origen de la promesa tiene dos fuentes de grupos distintos (El Observador/werthein-hochbaum,
      Infobae/grupo-infobae). El campo `texto` se corrigió para marcar el salto de diez minutos entre
      las dos frases del debate (ver razones.md). De las evidencias, cuatro de seis son de fuente
      única (`_faltante: segunda_fuente`); se ponderaron con menor peso en la fundamentación en vez
      de excluirlas, salvo la de enero de 2026 (Ley 20.446), que tiene nivel textual con documento
      oficial. El video del debate del 17/11/2024, si se consigue en una futura revisión, permitiría
      subir el origen de la promesa a nivel textual.
