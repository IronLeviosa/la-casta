- _slug: comparacion-deficit-fiscal-2003-2013
  politico: batlle
  declaracion: batlle/2013-02-05-deficit-fiscal-2013-igual-peor-momento-crisis-2002
  tema: economia/impuestos
  fecha: 2013-02-05
  titulo: Déficit fiscal de 2003 y de cierre de 2012, dato disponible en febrero de 2013, ambos 2,8%
    del PIB
  afirmacion: El déficit fiscal del último dato disponible en febrero de 2013, correspondiente al
    cierre de 2012 (2,8% del producto), fue igual al del peor momento de la crisis, en 2003.
  fragmento: Nosotros en el peor momento de la crisis, en 2003, tuvimos como déficit fiscal sobre el
    producto 2,8%. Este gobierno después de dos años de bonanza, con precios exorbitantes en los
    productos, con intereses de la deuda en valor cero, con un flujo de capitales para cualquier
    cosa, tiene un déficit fiscal de 2,8%
  calificacion: discutible
  dato_real:
    valor: >-
      El resultado fiscal del sector público como porcentaje del PIB para 2003 figura en la Memoria
      Anual del BCU de ese año, un PDF escaneado cuyo contenido no está disponible todavía como
      texto legible.


      La página de Resultados del sector público del Ministerio de Economía y Finanzas no tiene en
      su paginación visible los comunicados de 2012-2013, y la Base de Datos Económicos de la Unidad
      de Gestión de Deuda solo cubre aproximadamente los últimos diez años, sin llegar a 2012.


      No hay, con las fuentes revisadas, un documento que confirme que el déficit de 2003 y el de
      fines de 2012 hayan sido ambos 2,8% del PIB, ni el perímetro (sector público global,
      consolidado o gobierno central-BPS) con el que se calcula cada cifra, algo que Batlle tampoco
      precisó.
    fuentes:
      - url: https://elobservador.com.uy/nota/batlle-el-deficit-fiscal-actual-es-igual-al-del-peor-momento-de-la-crisis-de-2002--20132513490
