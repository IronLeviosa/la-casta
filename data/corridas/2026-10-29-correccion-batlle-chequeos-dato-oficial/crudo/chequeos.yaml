      periódicos de deuda. Los documentos disponibles de 2013 en el sitio del BCU son pliegos y
      resultados de compras y contrataciones administrativas del banco; no incluyen licitaciones de
      deuda pública.


      Los documentos disponibles de 2013 en el sitio de la Unidad de Gestión de Deuda incluyen los
      informes mensuales de enero y julio y comunicados de calificadoras de riesgo, pero ninguno
      cubre específicamente la licitación semanal de la ventana del 15 de junio al 1 de julio de
      2013 que menciona Batlle.


      No hay, con las fuentes revisadas, un documento oficial que confirme o descarte la cifra de
      USD 11 millones ni la suba de tasas de la semana siguiente.
