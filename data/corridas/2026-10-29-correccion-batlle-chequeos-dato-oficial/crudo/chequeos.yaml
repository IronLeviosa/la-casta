        fecha: 2013-07-01
        tipo: nota
        titulo: 'Batlle: "Gobierno está absolutamente empantanado en su política económica"'
        cita: cuando el gobierno salió a pedir colocar unos pocos pesos, más o menos 11 millones de dólares,
          nadie le tomó la oferta
        retrieved_at: 2026-09-16
  analisis: >-
    Batlle dijo que en las dos semanas anteriores el gobierno no consiguió ofertas en una licitación
    de deuda de unos US$ 11 millones y que la semana siguiente tuvo que convalidar tasas más altas.
    Ni el sitio del BCU ni los informes de la Unidad de Gestión de Deuda del MEF disponibles cubren
    esa licitación puntual de junio de 2013, así que no hay documento oficial que confirme o
