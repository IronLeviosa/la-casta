  titulo: Rebaja de impuestos para las 50 empresas más importantes del país
  afirmacion: La rebaja del impuesto a la renta empresarial representaría unos USD 40 millones anuales
    menos de impuestos para las 50 empresas más importantes de Uruguay.
  fragmento: una rebaja de unos USD 40 millones para las 50 empresas más importantes del país
  calificacion: discutible
  dato_real:
    valor: >-
      Según la serie de recaudación anual de la DGI, el IRIC recaudó 10.515.773.662 pesos corrientes
      en 2005. Al tipo de cambio promedio de ese año (24,4786 pesos por dólar, según el Banco
      Mundial), equivale a unos USD 429,6 millones.


      La baja de la tasa de 30% a 25% que menciona Batlle representa una sexta parte de lo
      recaudado: unos USD 71,6 millones si se aplicara a toda la base del IRIC en un año. La cifra
      de USD 40 millones que Batlle atribuye a las 50 empresas más grandes queda por debajo de ese
      techo, pero exigiría que esas 50 empresas concentraran más de la mitad de toda la recaudación
      del IRIC del país.


      La exposición de motivos del proyecto de reforma tributaria no está publicada con un desglose
      específico para las 50 mayores empresas.
