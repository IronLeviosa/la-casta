  titulo: $2.500 millones por no ajustar franjas menores de IRPF/IASS, para cubrir US$ 140 millones
  afirmacion: El gobierno no modificó los cobros del IRPF y el IASS en los grados menores, lo que
    significó cobrar $2.500 millones adicionales a los contribuyentes de menores ingresos para
    financiar un aumento de gasto de US$ 140 millones aprobado en la última rendición de cuentas.
  fragmento: no podían modificar los cobros del IRPF y del IASS en los grados menores. Al no
    modificarlo - por el aumento que han tenido los sueldos en el pasado - le están cobrando al que
    está por encima de la primera franja, $ 2.500 millones para poder pagar el aumento de gasto de
    la última rendición de cuentas de U$S 140 millones
  calificacion: discutible
  dato_real:
    valor: >-
      La ley a la que se refiere el gobierno en febrero de 2013 como última rendición de cuentas es
      la Ley 18.996, de 22 de noviembre de 2012, que aprobó la Rendición de Cuentas y Balance de
      Ejecución Presupuestal correspondiente al ejercicio 2011, no al ejercicio 2012: en febrero de
      2013 la rendición de cuentas del ejercicio 2012 todavía no existía como ley.


      El artículo 1 de la Ley 18.996 fija un resultado deficitario de 11.526.071.000 pesos por
      ejecución presupuestaria y 12.801.992.000 pesos por lo devengado.


      No hay, con las fuentes revisadas, el decreto que fijó el valor de la Base de Prestaciones y
      Contribuciones para 2013 ni las franjas del IRPF y el IASS en BPC, ni un documento que
      confirme los montos de 2.500 millones de pesos o USD 140 millones que menciona Batlle, ni la
      declaración específica que atribuye a un funcionario de la Asesoría Macroeconómica y
      Financiera del MEF.
