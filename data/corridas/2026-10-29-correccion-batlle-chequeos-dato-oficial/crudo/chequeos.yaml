        medio: el-pais
        fecha: 2005-11-28
        tipo: nota
        titulo: "Batlle: reforma tributaria afectará más a la clase media"
        cita: las 50 empresas más importantes del Uruguay van a tener una rebaja de 40 millones de dólares
          de impuestos al año
        retrieved_at: 2026-09-16
  analisis: >-
    Batlle dijo que la rebaja de impuestos para las 50 empresas más importantes del país sería de
    unos USD 40 millones al año. No hay un documento que desglose esa cifra empresa por empresa: el
    IRIC recaudó unos USD 429,6 millones en 2005, y la baja de tasa que describió (de 30% a 25%)
    equivale a una sexta parte de esa recaudación, unos USD 71,6 millones si se aplicara a toda la
    base.


    Los USD 40 millones que atribuye a 50 empresas quedan por debajo de ese techo, pero exigirían
    que esas 50 empresas concentraran más de la mitad de toda la recaudación del IRIC del país, algo
    plausible en una economía con alta concentración empresarial, pero que no se puede confirmar
    porque la exposición de motivos del proyecto no está publicada con ese desglose.
