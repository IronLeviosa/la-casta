        fecha: 2013-02-05
        tipo: nota
        titulo: Batlle el déficit fiscal actual es igual al del "peor momento de la crisis" de 2002
        cita: Nosotros en el peor momento de la crisis, en 2003, tuvimos como déficit fiscal sobre el
          producto 2,8%
        retrieved_at: 2026-09-16
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://elobservador.com.uy/nota/batlle-el-deficit-fiscal-actual-es-igual-al-del-peor-momento-de-la-crisis-de-2002--20132513490
        medio: el-observador
        fecha: 2013-02-05
        tipo: nota
        titulo: Batlle el déficit fiscal actual es igual al del "peor momento de la crisis" de 2002
        cita: Nosotros en el peor momento de la crisis, en 2003, tuvimos como déficit fiscal sobre el
          producto 2,8%. Este gobierno después de dos años de bonanza, con precios exorbitantes en
          los productos, con intereses de la deuda en valor cero, con un flujo de capitales para
          cualquier cosa, tiene un déficit fiscal de 2,8%
        retrieved_at: 2026-09-16
  analisis: >-
    Batlle comparó el déficit fiscal del último dato disponible en febrero de 2013 -el cierre de
    2012- con el de 2003, y dijo que ambos fueron 2,8% del producto. La Memoria Anual del BCU de
    2003 está en un PDF escaneado sin texto legible, y las series del MEF y de la Unidad de Gestión
    de Deuda disponibles no llegan hasta 2012, así que no hay documento oficial que confirme ambas
    cifras.


    Tampoco precisó qué perímetro usaba (sector público global, consolidado o gobierno central-BPS),
    y el resultado cambia según cuál se elija. Queda discutible por falta de ese documento y de esa
    precisión, no porque las cifras sean inverosímiles.
