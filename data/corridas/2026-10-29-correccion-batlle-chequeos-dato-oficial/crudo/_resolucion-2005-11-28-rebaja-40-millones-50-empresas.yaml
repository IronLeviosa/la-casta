registro: content/chequeos/batlle/2005-11-28-rebaja-40-millones-50-empresas.yaml
motivo_original: Falta documento oficial
resuelto: parcial
# Se encontró el documento oficial que respalda la premisa del registro (baja de la tasa de 30% a 25%), no el
# que desglosa los USD 40 millones para las 50 empresas más grandes. Resolución simétrica con el registro
# gemelo (rebaja-15-millones-bancos): mismas puertas, mismo resultado.
