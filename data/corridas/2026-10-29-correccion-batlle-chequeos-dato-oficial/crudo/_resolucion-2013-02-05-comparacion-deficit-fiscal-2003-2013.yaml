registro: content/chequeos/batlle/2013-02-05-comparacion-deficit-fiscal-2003-2013.yaml
motivo_original: Falta documento oficial
resuelto: si
# Los documentos tienen el dato de las dos puntas (2012 y 2003), pero NO coinciden entre sí en 2003 y
# ninguno da 2,8% para 2003. No hay una serie homogénea única en el corpus: 2012 es del MEF (Sector
# Público Consolidado, base caja); 2003 sale de tres documentos oficiales de vintages distintos.
