    perimetro: Resultado global del sector público, % del PIB, columnas 2000, 2001, 2002, 2003, 2004, 2005... (encabezado de columnas en la línea "En % del PIB 2000 2001 2002 2003 2004 2005 2006 2007 2008 2009 2005-2009" del mismo cuadro). Por la posición, 2003 = -3,1%.
que_dice_sobre_el_dato: >-
  Para el cierre de 2012 el MEF da exactamente -2,8% del PIB (Sector Público Consolidado), pero el mismo
  comunicado dice que sin factores extraordinarios fue -1,9%. Para 2003 los tres documentos oficiales
  disponibles dan 3,0% (BCU, Sector Público Global), 3,2% (Rendición de Cuentas 2003) y 3,1% (cuadro del
  Presupuesto 2005-2009), y ninguno da 2,8%; los mismos documentos ponen el pico en 2002 (-4,1%), no en
  2003.
como_la_encontre: >-
  El corpus ya tenía la Memoria Anual 2003 del BCU con texto legible (el registro la daba por escaneada sin
  texto), la Exposición de motivos de la Rendición de Cuentas 2013 y los diarios de sesiones de 2004 y 2005;
  el comunicado del MEF de diciembre de 2012 salió de una búsqueda web y se abrió con pnpm fuente. El
  perímetro lo dice cada documento (Consolidado en MEF, Global en BCU). No encontré un documento que dé 2,8%
  para 2003 ni una serie única homogénea 2003-2012 (el comunicado de enero de 2013 solo compara 2011 y 2012).
  Un cuadro posterior del MEF con PIB rebasado podría dar otro 2003, pero no apareció en corpus ni en web.
busque:
  - "corpus: 'resultado fiscal sector público 2012 porcentaje del PIB déficit' (2013-01/2013-04) sin resultados; 'déficit fiscal 2003 2,8% del PIB sector público' devolvió Memoria BCU 2003, Rendición de Cuentas 2013, diarios de sesiones 2004 y 2005"
  - "corpus: 'Rendición de Cuentas 2012 resultado global sector público consolidado 2,8%' --medio mef sin la exposición de motivos del ejercicio 2012; sí la del ejercicio 2013"
  - "web: comunicado MEF diciembre 2012 (gub.uy, 2019-06/diciembre 2012.pdf), abierto"
  - "web: serie histórica MEF anual en %PIB 1999-2012 no apareció (solo espejo Alphacast en pesos corrientes, no oficial); gub.uy node/1539 resultó ser la exposición del presupuesto 2020, irrelevante"
  - "web: '2,8% 2003 Uruguay déficit' devolvió CEPAL (3,1% en 2003) y IMF, no oficiales del perímetro pedido; no se abrieron ni se citan"
