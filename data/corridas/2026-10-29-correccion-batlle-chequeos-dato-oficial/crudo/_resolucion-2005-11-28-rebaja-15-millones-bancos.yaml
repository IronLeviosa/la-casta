registro: content/chequeos/batlle/2005-11-28-rebaja-15-millones-bancos.yaml
motivo_original: Falta documento oficial
resuelto: parcial
# Se encontró el documento oficial que respalda la premisa del registro (la reforma eliminaba el IMABA y el
# ICOSIFI y bajaba la tasa), no el que dice cuánto costaba la rebaja a los bancos ni qué componía los
# USD 15 millones. Resolución simétrica con el registro gemelo (rebaja-40-millones-50-empresas).
