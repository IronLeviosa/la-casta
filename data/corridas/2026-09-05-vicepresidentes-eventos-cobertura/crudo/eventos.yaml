- revision:
    tier: publicado
  _slug: intento-designacion-bustillo-embajador-peru-2025
  nombre: Intento de designar a Francisco Bustillo embajador en Perú en sustitución de Hierro López (enero 2025)
  alias: [Bustillo embajador en Perú, retiro de la venia de Bustillo, sucesión de Hierro López en Lima]
  desde: 2025-01-17
  hasta: 2025-01-24
  temas: [relaciones-exteriores]
  politicos: [hierro-lopez, lacalle-pou]
  casos: []
  resumen: >-
    En los últimos días de su gobierno, el presidente Luis Lacalle Pou propuso designar al
    excanciller Francisco Bustillo como embajador de Uruguay en Perú, en sustitución del
    exvicepresidente Luis Hierro López, embajador en Lima desde diciembre de 2020. La falta de
    apoyo del Frente Amplio y de legisladores del propio Partido Colorado en la Comisión Permanente
    llevó a Lacalle Pou a retirar el pedido de venia el 24 de enero de 2025.
  fuentes:
    - url: https://www.montevideo.com.uy/Noticias/Designaran-al-excanciller-Bustillo-como-embajador-en-Peru-en-lugar-de-Hierro-Lopez-uc912433
      medio: montevideo-portal
      fecha: 2025-01-17
      tipo: nota
      titulo: Propondrán designar al excanciller Bustillo como embajador en Perú en lugar de Hierro
      cita: >-
        El gobierno propondrá que el exministro de Relaciones Exteriores Francisco Bustillo, que
        es funcionario de carrera de Cancillería, sea designado en las próximas horas como nuevo
        embajador de Perú para ocupar el cargo que actualmente desempeña el exvicepresidente Luis
        Hierro López, informó Eduardo Preve y confirmó Montevideo Portal.
      retrieved_at: 2026-09-05
    - url: https://www.montevideo.com.uy/Noticias/Tras-falta-de-apoyo-Lacalle-Pou-decidio-retirar-venia-para-nombrar-embajador-a-Bustillo-uc913088
      medio: montevideo-portal
      fecha: 2025-01-24
      tipo: nota
      titulo: Tras falta de apoyo, Lacalle Pou decidió retirar venia para nombrar embajador a Bustillo
      cita: >-
        El presidente de la República, Luis Lacalle Pou, decidió retirar el pedio de venia para
        designar al excanciller Francisco Bustillo como embajador de Perú.
      retrieved_at: 2026-09-05

