- revision:
    tier: publicado
  _slug: crisis-politica-peru-2022
  nombre: Crisis política en Perú de 2022 (autogolpe y destitución de Castillo)
  alias: [crisis política de Perú 2022, autogolpe de Pedro Castillo, destitución de Pedro Castillo, asunción de Dina Boluarte]
  desde: 2022-12-07
  hasta: 2022-12-07
  temas: [relaciones-exteriores, derechos-humanos]
  politicos: [hierro-lopez]
  casos: []
  resumen: >-
    El 7 de diciembre de 2022 el presidente peruano Pedro Castillo intentó disolver el Congreso,
    en lo que el arco político, juristas y organizaciones civiles calificaron de autogolpe de
    Estado; horas después el Parlamento aprobó su destitución y tomó juramento a la vicepresidenta
    Dina Boluarte, que asumió la primera magistratura. El embajador uruguayo en Lima, el
    exvicepresidente Luis Hierro López, calificó el desenlace como algo previsible y descartó
    cualquier respaldo de Uruguay a un golpe de Estado.
  fuentes:
    - url: https://www.elobservador.com.uy/nota/hierro-lopez-embajador-uruguayo-en-peru-sobre-destitucion-de-castillo-esto-se-veia-venir--2022127204735
      medio: el-observador
      fecha: 2022-12-07
      tipo: nota
      titulo: 'Hierro López, embajador uruguayo en Perú, sobre destitución de Castillo: "Esto se veía venir"'
      cita: >-
        La postura de Castillo, considerada por todo el arco político, juristas y organizaciones
        civiles como un "auto golpe de Estado", abrió el camino para que en una sesión especial el
        Parlamento aprobara la destitución del mandatario y tomara juramento a Boluarte.
      retrieved_at: 2026-09-05
    - url: https://www.elobservador.com.uy/nota/hierro-lopez-embajador-uruguayo-en-peru-sobre-destitucion-de-castillo-esto-se-veia-venir--2022127204735
      medio: el-observador
      fecha: 2022-12-07
      tipo: nota
      titulo: 'Hierro López, embajador uruguayo en Perú, sobre destitución de Castillo: "Esto se veía venir"'
      cita: >-
        El exvicepresidente de la República y actual embajador uruguayo en Perú, Luis Hierro
        López, aseguró que la destitución del presidente peruano Pedro Castillo era algo que "se
        veía venir"
      retrieved_at: 2026-09-05

- revision:
    tier: publicado
  _slug: incidente-diplomatico-hierro-lopez-2023
  nombre: Observación a Hierro López por comentarios sobre las elecciones argentinas (2023)
  alias: [observación a Hierro López, comentarios de Hierro López sobre Milei y Macri, sanción diplomática a Hierro López]
  desde: 2023-10-24
  hasta: 2023-10-25
  temas: [relaciones-exteriores]
  politicos: [hierro-lopez]
  casos: []
  resumen: >-
    El embajador uruguayo en Perú, Luis Hierro López, escribió el 24 de octubre de 2023 en su
    cuenta de X que Sergio Massa había hecho una buena campaña pero que Javier Milei y Mauricio
    Macri tenían una oportunidad para un "gran acuerdo", tras la primera vuelta electoral en
    Argentina. El canciller Francisco Bustillo le envió una observación por esos comentarios y la
    senadora frenteamplista Liliam Kechichian los cuestionó públicamente.
  fuentes:
    - url: https://www.subrayado.com.uy/bustillo-observo-al-embajador-hierro-lopez-sus-comentarios-elecciones-argentinas-n929393
      medio: subrayado
      fecha: 2023-10-25
      tipo: nota
      titulo: Bustillo observó al embajador Hierro López por sus comentarios sobre elecciones argentinas
      cita: >-
        El ministro de Relaciones Exteriores, Francisco Bustillo, envió una observación al
        embajador de Uruguay en Perú, Luis Hierro López, por sus comentarios sobre las elecciones
        en Argentina, dijeron fuentes de la cancillería a Subrayado.
      retrieved_at: 2026-09-05
    - url: https://www.subrayado.com.uy/bustillo-observo-al-embajador-hierro-lopez-sus-comentarios-elecciones-argentinas-n929393
      medio: subrayado
      fecha: 2023-10-25
      tipo: nota
      titulo: Bustillo observó al embajador Hierro López por sus comentarios sobre elecciones argentinas
      cita: >-
        "Aunque Massa hizo una muy buena campaña electoral, me parece que Milei y Macri tienen una
        notable oportunidad de abrir un gran acuerdo y un tiempo nuevo", había escrito Hierro este
        martes en su cuenta de X (ex Twitter).
      retrieved_at: 2026-09-05

