  desde: 2023-11-10
  hasta: 2023-11-10
  temas: [economia]
  politicos: [astori]
  casos: []
  resumen: >-
    Danilo Astori, dos veces vicepresidente (2010-2015) y dos veces ministro de Economía y
    Finanzas (2005-2008 y 2015-2020), murió el 10 de noviembre de 2023 a los 83 años, mientras
    cursaba licencia por motivos de salud en su banca de senador. Su fallecimiento generó mensajes
    de reconocimiento de dirigentes de distintos partidos, incluido el Partido Nacional.
  fuentes:
