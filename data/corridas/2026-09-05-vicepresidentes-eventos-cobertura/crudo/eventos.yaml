  alias: [designaciones de embajadores 2025, embajadores del gobierno de Orsi, Nin Novoa embajador en Brasil, Argimón embajadora ante la Unesco]
  desde: 2025-02-28
  hasta: 2025-10-14
  temas: [relaciones-exteriores]
  politicos: [nin-novoa, argimon]
  casos: []
  resumen: >-
    El gobierno de Yamandú Orsi, que asumió el 1° de marzo de 2025, designó como embajadores a dos
    figuras identificadas con partidos de oposición. El exvicepresidente y excanciller Rodolfo Nin
    Novoa fue anunciado como embajador en Brasil el 28 de febrero de 2025. La exvicepresidenta
    Beatriz Argimón (Partido Nacional) fue elegida el 30 de mayo de 2025 como representante de
    Uruguay ante la Unesco y la OCDE, designación que generó objeciones dentro de su propio
    partido; el Senado aprobó su venia el 14 de octubre de 2025.
