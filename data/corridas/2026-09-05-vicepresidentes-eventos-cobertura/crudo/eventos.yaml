      medio: el-observador
      fecha: 2023-11-10
      tipo: nota
      titulo: Murió Danilo Astori, exvicepresidente y ministro de Economía
      cita: >-
        Murió Danilo Astori El exministro de Economía Danilo Astori murió este viernes a los 83
        años de edad.
      retrieved_at: 2026-09-05
    - url: https://www.elobservador.com.uy/nota/murio-danilo-astori-exvicepresidente-y-ministro-de-economia-2023111012342
      medio: el-observador
      fecha: 2023-11-10
      tipo: nota
      titulo: Murió Danilo Astori, exvicepresidente y ministro de Economía
      cita: >-
        "Todo Nacional lamenta profundamente el fallecimiento de Danilo Astori, quien desarrolló
        una extensa carrera política en la que llegó a ser vice presidente de la República",
        señalaron en su cuenta de Twitter.
      retrieved_at: 2026-09-05

