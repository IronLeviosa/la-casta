  politico: lacalle-pou
  tema: economia/combustibles
  fecha: 2020-07-24
  contexto: gobierno
  cargo_en_ese_momento: presidente
  cita: Nosotros estamos para dar una mano en lo que sea. Estamos para ayudar a que sigan las fuentes
    de trabajo, pero sabemos que hay ineficiencias, sabemos que hace 20 años que se pierde ...
  resumen: Durante una recorrida oficial en el puerto de Paysandú, tras ser abordado por sindicalistas
    de Fancap que reclamaban por el futuro de la planta de cemento de Ancap en esa ciudad, dijo que
    el gobierno quiere ayudar a sostener las fuentes de trabajo pero que hay "ineficiencias" y que
    "hace 20 años que se pierde" en esa actividad, y se comprometió a recibirlos en su despacho la
    semana siguiente ("Los espero el miércoles que viene a las dos de la tarde").
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.elpais.com.uy/informacion/politica/sindicato-de-ancap-se-manifesto-lacalle-se-acerco-y-dijo-los-espero-el-miercoles-que-viene
        medio: el-pais
        fecha: 2020-07-24
        tipo: nota
        titulo: 'Sindicato de Ancap se manifestó, Lacalle se acercó y dijo: "Los espero el miércoles que
          viene"'
        cita: Nosotros estamos para dar una mano en lo que sea. Estamos para ayudar a que sigan las fuentes
          de trabajo, pero sabemos que hay ineficiencias, sabemos que hace 20 años que se pierde ...
        retrieved_at: 2026-09-06
  revision:
    tier: probable
    notas_internas: Cita original ("Los espero el miércoles...") era de agenda y no tocaba combustibles
      ni Ancap (objeción corregir de critica.md); se reemplazó por el pasaje sobre
      "ineficiencias"/"hace 20 años que se pierde", que sí es sobre la gestión de Ancap, y la frase
      de la reunión pasó al resumen. Sigue con una sola fuente (El País); la nota dice que el
      diálogo lo registró Subrayado, no lo encontré en esta sesión.
