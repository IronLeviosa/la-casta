  cargo_en_ese_momento: candidato a presidente
  cita: nosotros estamos dispuestos a liberalizar la importación de combustible, esto obviamente trae
    aparejado una incomodidad para ANCAP
  resumen: En el coloquio Presidenciables 2019 de Deloitte y En Perspectiva, junto a sus asesores,
    dijo que estaba dispuesto a liberalizar la importación de combustible aunque eso incomodara a
    ANCAP, y comparó el caso con la apertura del Banco de Seguros. Consultado por el plazo, su
    equipo precisó que la liberalización iba en la Ley de Urgente Consideración y que estaría
    implementada a los 100 días de gobierno. En el mismo bloque, Azucena Arbeleche dijo que
    buscarían que las tarifas públicas reflejaran los costos de producción de las empresas.
  evidencia:
