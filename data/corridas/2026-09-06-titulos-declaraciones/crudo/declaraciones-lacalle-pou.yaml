          aparejado una incomodidad para ANCAP
        contexto: que todo el Uruguay haya tenido que pagar los berretines de empresarios, de dirigentes
          políticos, con empresas públicas, con plata de la gente. Nosotros estamos dispuestos a
          liberalizar la importación de combustible, esto obviamente trae aparejado una incomodidad
          para ANCAP, lo trajo para el Banco de Seguros en su momento. Yo creo que la vida, hay
          veces que hay que incomodar para que uno mejore, porque si se queda quieto se apoltrona.
