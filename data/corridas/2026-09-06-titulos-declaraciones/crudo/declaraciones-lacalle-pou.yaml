          trabajó fuertemente para conseguir buen combustible a buen precio para el segundo semestre
          del año. [...] Ancap ya había comprado petróleo para el primer semestre al precio anterior
          a la caída. El trabajo de estos días en la compra del mercado futuro que nos permitió
          comprar para los próximos seis meses puede llegar a resultar en que la adecuación en el
          precio sea bastante menor a la que planificábamos. [...] Somos optimistas en generar buena
          compra. Preferimos no adelantar cuál va a ser la adecuación en el precio de los
          combustibles.
        retrieved_at: 2026-09-04
