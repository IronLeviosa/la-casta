    anterior; en la misma conferencia calificó la suba de tarifas públicas como una "adecuación" por
    debajo de los costos, no como un aumento para recaudar. La tesis de que con estas medidas el
    compromiso electoral "se súper cumplió" es de Isaac Alfie (director de OPP), no una frase suya.
