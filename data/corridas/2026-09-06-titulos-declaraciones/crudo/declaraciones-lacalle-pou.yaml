      básicamente se terminó" en tres oraciones cortas, en vez de la construcción de una sola
      oración de El Observador/Montevideo Portal), pero sigue siendo un solo origen (misma rueda de
      prensa tras la inauguración del buque en Juan Lacaze). Fecha: El País escribe "afirmó ayer"
      con sello de publicación del 28/05/2022, pero la fuente primaria (Presidencia, gub.uy) fija el
      acto en "este sábado 28"; se mantiene `fecha: 2022-05-28` por la primaria, sin registrar
      discrepancia porque no se puede establecer que El País haya afirmado una fecha distinta del
      acto en sí (podría ser una pieza redactada para una edición del domingo 29). Además, El País
      da una brecha de precio de paridad de importación distinta a la de El Observador para la nafta
      súper sobre el mismo informe de Ursea del 25/05/2022 ($4,80/6,82% contra $6,41 citado arriba):
      no se concilian esas dos cifras y no se modificó el `resumen`, que sigue atribuido solo a El
      Observador. Pendiente: audio de Presidencia o de radio Universal con la cita de Ancap para
      subir a `textual`; decreto de precios de junio de 2022 (IMPO) para cuantificar el traslado.'
