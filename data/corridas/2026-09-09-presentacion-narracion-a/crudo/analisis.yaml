  titulo: Sobrecosto de mezclar biocombustibles de ALUR frente a importarlos, 2012-2014, según el Cr.
    Álvaro Rossa (anexo al informe del Senado sobre ANCAP)
  empresa: alur
  tema: economia/combustibles
  autor: Cr. Álvaro Rossa
  autor_es: 'El informe de la Comisión Investigadora del Senado sobre la situación económica y
    financiera de ANCAP (2000-2015) presenta el dictamen del Cr. Álvaro Rossa como un anexo técnico,
    con esta descripción: "elaborado por el Cr. Alvaro Rossa quien con sobriedad y profundidad
    analiza los números de la empresa y llega a conclusiones certeras". El cuerpo principal del
    informe no describe la actividad profesional de Rossa fuera de este dictamen ni su vínculo (si
    lo hay) con algún partido, gobierno o consultora; no hay una fuente independiente que documente
    esos datos. La comisión fue presidida e informada por el senador Pedro Bordaberry (Partido
    Colorado).'
  fecha: 2016-02-01
  publicado:
    url: https://www.enperspectiva.net/wp-content/uploads/2016/02/InformeFinalAncap.pdf
    medio: en-perspectiva
    fecha: 2016-02-01
    tipo: documento_oficial
    titulo: Informe de la Comisión Investigadora del Senado sobre la situación financiera y económica de
      ANCAP entre los años 2000 y 2015
    cita: elaborado por el Cr. Alvaro Rossa quien con sobriedad y profundidad analiza los números de la
      empresa y llega a conclusiones certeras.
    retrieved_at: 2026-09-09
  resumen: "En el capítulo sobre ALUR del informe de la Comisión Investigadora del Senado sobre ANCAP
    (2000-2015), el dictamen del Cr. Álvaro Rossa cuantifica el sobrecosto que significó para ANCAP
    mezclar los biocombustibles producidos por ALUR en vez de importarlos: U$S 48.500.000 en 2012,
    U$S 58.700.000 en 2013 y U$S 92.300.000 en 2014, una cifra creciente año a año. El mismo
    capítulo documenta, en el párrafo inmediatamente anterior, que ANCAP modificó de forma
    retroactiva los porcentajes que le abonaba a ALUR por estos rubros, en un caso del 5 % al 35 %,
    en otro del 5 % al 15 % y en otro duplicándolos a un 10 %, según reconocieron ante la comisión
    el Ing. Leonardo De León y el gerente de ALUR, Manuel González."
  metodo: El informe no describe, en el pasaje consultado en esta corrida, la metodología con la que
    Rossa llegó a los tres montos (no dice qué precio de importación de referencia usó, ni si
    incluye flete e impuestos de forma explícita para estos tres años en particular, aunque sí lo
    hace para otra comparación del mismo informe referida a los porcentajes 130 %/67 % citados por
    el entonces Ministro Astori). El dictamen completo de Rossa es un anexo del informe (Anexo 9)
    que esta corrida no leyó por separado del cuerpo principal.
  afirmaciones:
    - afirmacion: Según el Cr. Álvaro Rossa, en 2012 mezclar combustible producido por ALUR en vez de
        importarlo le significó a ANCAP un sobrecosto de U$S 48.500.000.
      fragmento: cuantificado en U$ 48.500.000 en el año 2012
      calificacion: discutible
      dato_real:
        valor: El informe del Senado, en el capítulo sobre ALUR, atribuye este monto al dictamen del Cr.
          Rossa sin reproducir su metodología de cálculo. Los Estados Contables Individuales de ALUR
          al 31/12/2012 (documento oficial, ya cargados en esta ficha) muestran un resultado del
          ejercicio positivo de $33.037.291 y una capitalización de ANCAP de $348.234.185 ese mismo
          año; ninguno de los dos datos permite confirmar o refutar, por sí solo, el monto de U$S
          48.500.000 de sobrecosto que calcula Rossa, porque miden el resultado contable total de
          ALUR y un aporte de capital, no la diferencia entre el precio pagado por ANCAP y el costo
          de importar. No hay un documento oficial de ANCAP o de un regulador (URSEA, MIEM) que
          publique el precio de importación de referencia para etanol o biodiésel en 2012 con el que
          se podría reconstruir el cálculo de forma independiente.
