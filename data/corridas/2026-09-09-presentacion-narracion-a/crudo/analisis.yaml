      publicación posterior a esa fecha; no se encontró un colofón ni una portada con fecha exacta
      en esta corrida. Tres de las cinco afirmaciones (resultado en dólares, posición en moneda
      extranjera de BROU, depósitos con participación de mercado por moneda) usan unidades o
      desgloses por entidad que este documento no publica (dólares en vez de pesos; porcentaje del
