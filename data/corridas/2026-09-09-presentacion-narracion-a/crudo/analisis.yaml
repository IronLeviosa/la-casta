      analisis: "La planilla de URSEA confirma que la brecha del gasoil se amplió, de 19,2% en 2010-2014 a
        33,0% en 2015-2019, la mayor de las cuatro brechas que compara el CED; el monto de USD 1.337
        millones no tiene un documento oficial que lo agregue en dólares. El propio CED ofrece,
        sobre esta cifra (la más grande del análisis), dos lecturas menos lineales: que el resultado
        de ANCAP en 2016-2017 respondió a mantener precios fijos mientras el petróleo bajaba, y que
        parte del sobreprecio del quinquenio compensó una pérdida previa de USD 665 millones que
        motivó una capitalización estatal en 2016. Sin documento oficial que mida el monto en
        dólares, la calificación es discutible."
    - afirmacion: El Observador calculó, a partir de las dos cifras que el CED da para 2020-2021 (USD 14
        millones de sobreprecio en nafta y USD 67 millones en gasoil), un promedio de USD 40,5
        millones anuales, y lo contrastó con el promedio de USD 288 millones anuales que calculó
        para la década 2010-2019.
      fragmento: entre 2020 y 2021 ese número disminuyó a US$ 40,5 millones anuales
      calificacion: discutible
      dato_real:
        valor: >-
          El CED no escribe "USD 40,5 millones anuales" en su boletín. En el cuerpo del texto da,
          para 2020-2021, dos cifras separadas por combustible, en este orden: "Finalmente, en lo
          que va de la actual administración (2020-2021), se registraron sobreprecios en la nafta
          por USD 14 millones y el gas oil por USD 67 millones." El CED aclara, en la misma oración,
          que "los resultados son sustancialmente distintos entre 2020 (cuando ambos combustibles
          pagaron sobreprecios) y 2021 (donde se vendieron por debajo del PPI)": el bienio combina
          un año con sobreprecio en los dos productos y un año con precios por debajo de la paridad.

          El promedio de USD 40,5 millones anuales que publica El Observador es una cifra que
          calcula el propio medio, no el CED: (14 + 67) / 2 = 40,5, "según se deduce de los números
          publicados por el think tank". La aritmética es correcta, pero promedia dos años de signo
          distinto en un bienio de solo dos datos, mientras que el promedio de USD 288 millones
          anuales de la década 2010-2019 (calculado también por El Observador; ver la afirmación
          siguiente de este mismo registro) surge de sumar cuatro cifras que, dentro de cada
          quinquenio, mantienen mayormente el mismo signo (sobreprecio), salvo el subsidio de la
          nafta en 2010-2014. Comparar los dos promedios sin esa aclaración puede sugerir una caída
          sostenida del sobreprecio en 2020-2021 que el propio CED no describe así.

          No hay una serie oficial de precio de venta y PPI para 2020-2021 en la misma base que la
          planilla "Series PPI vs PE" de URSEA (que termina en 2019-05). El dataset
          "ursea-ppi_vs_pe_v2" de catalogodatos.gub.uy anuncia cubrir ese tramo ("El primer modelo
          es el PPI al consumidor final y corresponde al período 2002-01 - 2020-09"), pero el
          recurso descargable bajo ese dataset (ppi_pe.csv) no contiene esa serie: para 2020-10 en
          adelante trae una fórmula distinta, de construcción del precio "ex planta de distribución"
          (desde el valor FOB internacional hasta el precio con impuestos en planta), un concepto de
          precio distinto del precio de venta al público que usa el resto de este registro. Por eso
          no se pudo verificar de forma independiente el signo ni la magnitud de los USD 14 millones
          y USD 67 millones de origen.
