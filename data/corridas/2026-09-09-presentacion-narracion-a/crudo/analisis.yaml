    - afirmacion: El CED calculó que, por no ajustar los combustibles según el PPI durante 2021, ANCAP
        resignó una recaudación de aproximadamente USD 46 millones en nafta Súper, USD 59 millones
        en gas oil y USD 93 millones en supergás, casi USD 200 millones en conjunto (o USD 105
        millones contando solo nafta y gas oil).
      fragmento: de USD 46 millones para el caso de la nafta Súper, USD 59 millones para el caso del gas
        oil y USD 93 millones para el caso del supergás; en suma, casi USD 200 millones de dólares
      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en el cuerpo del boletín, escribe: "La renuncia del ente estatal por no ajustar
          los combustibles en función del PPI habría sido de USD 46 millones para el caso de la
          nafta Súper, USD 59 millones para el caso del gas oil y USD 93 millones para el caso del
          supergás; en suma, casi USD 200 millones de dólares." El resumen de portada del mismo
          documento da, para nafta y gas oil solamente, la cifra consistente de USD 105 millones (46
          + 59 = 105): "renuncia de ANCAP... por no ajustar los precios de la nafta y gas oil en
          función del PPI... fue de USD 105 millones."

          El boletín no explica, en ninguna parte, el método para llegar a estos tres montos (no
          dice qué volúmenes ni qué tipo de cambio usó), así que no se pueden reconstruir de forma
          independiente con series oficiales.

          Los Estados Financieros Individuales de ANCAP al 31 de diciembre de 2021 (documento
          oficial) muestran un resultado del ejercicio positivo de $ 3.936.375.660 (equivalente a
          unos USD 88,1 millones al tipo de cambio de cierre de ese balance, $44,695/USD, que el
          propio balance de ANCAP para 2022 declara como cotización de cierre de 2021). Es una cifra
          distinta y no directamente comparable con la "renuncia" que calcula el CED: el resultado
          del ejercicio es el resultado contable total del año (incluye partidas financieras y no
          operativas de todo el negocio de ANCAP, no solo combustibles), mientras que la renuncia
          que estima el CED es cuánto más habría ganado la empresa solo en combustibles si hubiera
          trasladado a precios la totalidad del PPI durante 2021.

          ANCAP publicó, en abril de 2022, un comunicado propio de resultados del ejercicio 2021 con
          una cifra de concepto más cercano al que usa el CED: "El resultado negativo del mercado
          monopólico es consecuencia de ventas por debajo de la paridad de importación en gran parte
          del año. En 2021, la sociedad pagó cerca de USD 159 mill. menos con respecto a la paridad
          de importación para todos los productos vendidos en el mercado interno." Esta cifra de
          ANCAP (USD 159 millones, para todos los productos del mercado interno, no solo nafta, gas
          oil y supergás) es del mismo orden de magnitud que los "casi USD 200 millones" que calcula
          el CED para esos tres productos, pero ninguno de los dos documentos explica el detalle
          metodológico que permitiría conciliar ambas cifras.
