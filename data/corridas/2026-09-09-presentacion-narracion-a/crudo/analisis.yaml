      fragmento: la cobertura de agua potable a través de redes alcanza al 95,2 % de la población total
        del país
      calificacion: verdadero
      dato_real:
        valor: 'La síntesis oficial del Informe Nacional Voluntario de ODS Uruguay 2018 (Presidencia de la
          República y OPP) confirma literalmente las dos cifras: "el 99,4% de la población tiene
          acceso al agua y el 95,2% tiene acceso a agua segura", dato referido a 2016 (footnote del
          propio BID: "Dato al 2016"). El BID reetiqueta el 95,2% como "cobertura de agua potable a
          través de redes", pero el documento de origen lo llama "agua segura", y el propio BID
          define ese término en otro pasaje como "conexión de agua no contaminada de la red pública
          dentro de la vivienda en todo momento": una definición más estricta que "cobertura por
          redes" sin más (incluye continuidad y ausencia de contaminación), lo que jugaría a favor
          de OSE si la cobertura simple por redes fuera mayor a 95,2%. La Encuesta Continua de
          Hogares del INE (Anexo 2 del propio documento del BID) da, para el origen "Red general"
          del agua de la vivienda, valores de 94,83% (2013), 95,18% (2014), 94,92% (2015), 95,11%
          (2016) y 94,24% (2017): una serie estable, en línea con el 95,2% que cita el BID para
          2016.'
