  resumen: >-
    El informe compara indicadores de gestión de 117 operadores de agua potable y saneamiento de
    once países de América Latina, con datos del ejercicio 2022 reportados a cada regulador
    nacional, clasificados en cinco tamaños según su número de conexiones. Clasifica a OSE como "Muy
    Grande" (junto con Aguas Andinas, AySA, las públicas de Bogotá y Medellín, y Sedapal), con una
    ficha propia de 11 indicadores. Una sección aparte, sobre tarifas a 15 m3, usa una muestra
    distinta de 11 operadores (uno por país, entre ellos OSE), nombrados uno por uno.

    En el grupo "Muy Grande", OSE queda última de cuatro con dato en pérdidas de agua (45,30 %,
    Δ2021 -10 %) y última de seis en cobertura de alcantarillado (50,50 %, Δ2021 +4 %); tiene el
    menor endeudamiento de su clase (41,18 %, Δ2021 -10 %) y, en tratamiento de aguas residuales,
    queda tercera de cuatro (88,94 %). En tarifas, OSE tiene la segunda tarifa doméstica de agua más
    alta (USD 1,27/m3) y la más alta en tarifa comercial de agua (USD 3,99/m3), en saneamiento
    doméstico y comercial (USD 1,01 y USD 4,14/m3), y en cargo fijo promedio (USD 9,20, casi el
    doble del segundo).
  metodo: El informe clasifica a los operadores por tamaño (Muy Grande, Grande 1, Grande 2, Mediano,
    Pequeño) según su número de conexiones de agua potable, y para cada uno de 11 indicadores
    principales (de 64 calculados en total) ordena a los 117 operadores dentro de su grupo de
    tamaño, de mayor a menor valor, con la variación porcentual respecto de 2021 (Δ2021) y una
    tendencia 2018-2022. Los datos de cada país los reporta el regulador o el operador miembro de
    ADERASA de ese país (para Uruguay, URSEA); SUNASS los compila, calcula los indicadores y elabora
    el informe. La sección de tarifas (11 operadores) usa una muestra y un método aparte, descrito
    en la sección 4 del informe.
  afirmaciones:
    - afirmacion: Según ADERASA, en 2022 OSE tenía, entre 11 operadores de la región, la segunda tarifa
        promedio de agua potable doméstica más alta (USD 1,27/m3, detrás de EPMAPS de Ecuador con
        USD 1,66/m3) y la más alta en tarifa comercial de agua (USD 3,99/m3); en saneamiento, la
        segunda tarifa doméstica (USD 1,01/m3, detrás de BWSL de Belice con USD 1,15/m3) y la más
        alta en tarifa comercial (USD 4,14/m3); y el cargo fijo promedio más alto de los 11
        operadores (USD 9,20, casi el doble del segundo, BWSL con USD 5,23).
      fragmento: OSE (Uruguay) son los operadores que registran las mayores tarifas promedio, 1.66 y 1.27 U$S
      calificacion: discutible
      dato_real:
        valor: 'El informe nombra los 11 operadores de esta sección (uno por país): AySA (Argentina), BWSL
          (Belice), EPSAS (Bolivia), Aguas Andinas (Chile), EAAB (Colombia), AyA (Costa Rica),
          EPMAPS (Ecuador), ANDA (El Salvador), APC (Honduras), SEDAPAL (Perú) y OSE (Uruguay). El
          informe aclara una salvedad relevante para leer estos rankings: "para el rango de 15 m3 no
          hay distinción en el valor de las tarifas promedio doméstico y comercial para BWSL
          (Belice), AyA (Costa Rica) y Aguas Andinas (Chile)", es decir que esos tres operadores no
          diferencian tarifa doméstica de comercial, lo que puede desplazar sus posiciones relativas
          en el ranking. No hay un documento oficial de OSE o de URSEA que publique una tarifa
          promedio en USD/m3 para 15 m3 referida al ejercicio 2022 con la misma definición que usa
          ADERASA; el anexo de tarifas del decreto vigente en 2022 (Decreto N° 466/021) está en una
          imagen no extraíble como texto.'
