      dato_real:
        valor: >-
          El propio Anexo 1 del documento del BID ("Benchmarking OSE – Indicadores de desempeño")
          publica la serie completa de OSE para Agua No Facturada/Agua Disponible (Total País):
          52,60% (2013), 52,54% (2014), 51,90% (2015), 53,10% (2016), 53,20% (2017) y 53,40% (2018),
          con el desagregado Región Metro (55,59% a 57,10% en el período) e Interior (49,45% a
          49,80%). El párrafo completo del cuerpo del documento (p. 9) agrega la composición: "en el
          área metropolitana, este asciende a 57 %, mientras que en el interior del país se
          encuentra en 50 % aproximadamente. Dentro del total de agua no facturada, entre el 50 y 60
          % aproximadamente corresponde a pérdidas físicas mientras que el restante corresponde a
          pérdidas aparentes (comerciales) asociadas a conexiones clandestinas, subsidios o
          situaciones irregulares".

          El presidente de OSE, Milton Machado, dio en 2017 un desglose similar en una nota de
          Presidencia: "las pérdidas físicas alternan entre el 25 % y el 30 %", y el otro tipo de
          pérdidas "suma aproximadamente otro 20 %, (10 % por fraude y otro tanto por subsidios o
          situaciones irregulares)". El Observatorio de datos abiertos de OSE (catalogodatos.gub.uy)
          publica una serie mensual de "Agua No Contabilizada" por departamento desde 2010, con una
          definición algo distinta (Agua Elevada Distribuida menos Consumos Autorizados, sobre Agua
          Disponible, no Agua Facturada): sumando los 19 departamentos, esa serie da, para diciembre
          de cada año, 48,08% (2013), 49,80% (2018), 48,31% (2022) y 47,49% (2024): un nivel algo
          menor que el de "agua no facturada" del BID (por la distinta definición del denominador),
          pero igual de estable en el tiempo, sin la mejora sostenida que describiría un programa de
          reducción exitoso entre 2013 y 2018.
