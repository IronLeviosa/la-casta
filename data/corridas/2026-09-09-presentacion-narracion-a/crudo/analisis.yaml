      fragmento: la cobertura de saneamiento seguro4 alcanza al 43 %
      calificacion: verdadero
      dato_real:
        valor: 'El Plan Nacional de Saneamiento (Ministerio de Ambiente, ex MVOTMA, documento que el BID
          cita como "MVOTMA, SNAACC, & Presidencia, 2019") trae, en su Cuadro 3 ("Cobertura de
          saneamiento Uruguay, diciembre de 2018"), la población total del país (3.506.000
          habitantes) desagregada por tipo de solución: redes sin tratamiento (642.500), redes con
          tratamiento (1.524.500), depósito de efluentes (1.312.500) y sin saneamiento básico
          (26.500). El propio documento afirma textualmente que "la cobertura de saneamiento
          adecuado en el año 2018 es al menos de 1.524.500 habitantes... lo que representa el 43 %
          de la población total del país": coincide de forma exacta con el 43% que cita el BID para
          "saneamiento seguro", cuya fecha correcta es 2018 (dos notas al pie del propio BID así lo
          dicen, no 2019 como escribe el resumen de este registro). Sumando las categorías con algún
          tipo de solución (redes sin tratamiento + redes con tratamiento + depósito de efluentes =
          3.479.500 de 3.506.000) se obtiene 99,24% de la población con "saneamiento básico" en
          algún grado, un valor prácticamente idéntico al 99,2% que cita el BID. El propio BID
          desagrega el 43% nacional entre Montevideo (65% en 2018, con obras que lo llevarían a 92%
          hacia 2020) y el interior del país (39%), que es la parte del territorio donde OSE presta
          el servicio de saneamiento: el 43% nacional le atribuye a OSE, sin decirlo, la cobertura
          de Montevideo, que gestiona la Intendencia.'
