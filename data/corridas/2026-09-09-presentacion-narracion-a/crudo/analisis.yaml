  veredicto: 'De las doce afirmaciones, ocho quedaron verdadero, una falso y tres discutible. Las ocho
    verdaderas —tarifa de USD 2,06/m3, gasto con tarifa social, acceso al agua y al saneamiento
    básico, agua no facturada, infraestructura y cobertura por redes— coinciden con el documento que
    el BID cita. La única falsa atribuye a "los operadores analizados" un promedio de USD 1,22/m3
    (mínimo 0,39, máximo 2,06): en Lentini (2015) esos son los promedios por país, no los de los 57
    operadores individuales (promedio USD 1,40, mínimo USD 0,17, máximo USD 2,35, en Colombia). El
    USD 2,06/m3 en sí es correcto, pero es un indicador de OSE —el único operador uruguayo de la
    muestra—, no de "Uruguay" con más de un prestador, y excluye el saneamiento que cobra
