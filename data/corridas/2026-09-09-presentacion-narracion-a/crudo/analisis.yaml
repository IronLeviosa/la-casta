          primario corriente" de -USD 44 millones que calcula el CED y es del mismo orden de
          magnitud, pero ANCAP no aclara si su "mercado monopólico" excluye las mismas partidas que
          el CED excluye de su "resultado primario corriente", así que tampoco permite confirmar o
          refutar el monto exacto del CED con la misma definición.
