  revision:
    tier: publicado
    notas_internas: 'Las diez afirmaciones quedan `discutible` porque ningún documento oficial mide, con
      la definición y la unidad del CED, lo que el CED afirma; eso no es un defecto del registro
      sino la calificación correcta según la regla del Veracímetro (amarillo: "dos lecturas
      posibles, o sin documento oficial"), aplicada con el mismo umbral que ya usa el chequeo
      publicado sobre el mismo boletín
      (`content/chequeos/lacalle-pou/2022-03-27-sobrecostos-combustibles-1700-millones.yaml`,
      también `discutible` y también `tier: publicado`). El registro documenta, para las seis
      afirmaciones en dólares, el documento oficial que confirma dirección y orden de magnitud
      (URSEA y MIEM para 2010-2019; estados financieros y comunicado de ANCAP para 2021) y explica
      con precisión qué falta para llegar al monto exacto, así que `discutible` no equivale a "sin
      evidencia": es el techo que permite la evidencia disponible. Ninguna fuente citada lleva
      `verificacion: manual`; las dos páginas de ancap.com.uy que no se pudieron leer con `pnpm
      fuente` (`datos-ancap.html`, `informacion-historica.html`) no se usaron como fuente de ningún
      dato, así que no exigen esa marca. No hay objeciones `bloquea` de `critica.md` sin resolver:
      el resumen ya no contradice al análisis, `publicado` apunta al PDF del propio CED, `autor_es`
      es simétrico y fechado, `metodo` no remite a `notas.md`, las cuatro cifras de 2010-2019 usan
      la cobertura real de la planilla de URSEA (60/53 meses, no 29/28), y las afirmaciones 6 a 9
      cierran la asimetría que señalaba el crítico. Quedan, para un resolvedor y no como bloqueo de
      esta publicación: (a) reconstruir el monto en dólares de las afirmaciones 0 a 3 con los
      volúmenes del MIEM ya citados, lo que en el mejor caso movería la calificación a `impreciso` o
      la dejaría en `discutible`, nunca directamente en `verdadero`, porque sería una inferencia con
      supuestos que el CED no publica; (b) buscar, en URSEA o en los decretos de precios del Poder
      Ejecutivo, una serie de precio de venta y PPI para 2019-06 a 2021 en la misma base que la
      planilla 2002-2019, hoy inexistente en los documentos revisados. Las tres correcciones al
      chequeo publicado que señalan `critica.md` y `notas.md` no se aplican desde este registro:
      quedan redactadas como propuesta en `razones.md` de esta corrida, para que se tramiten con
      `pnpm promover --correccion`.'
- _slug: leon-renta-monopolica-2012
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  titulo: La "renta monopólica" de ANTEL en telefonía fija, según el benchmarking de Omar de León (2012)
  empresa: antel
  autor: Omar de León
  autor_es: Experto en comunicaciones citado por El Observador en 2012; la nota no detalla su
    afiliación institucional ni el estudio completo de benchmarking que dice haber aplicado.
  fecha: 2012-05-19
  publicado:
    url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
    medio: el-observador
    fecha: 2012-05-19
    tipo: nota
    titulo: Servicios monopólicos de ANTEL son más caros que los de la región
    cita: En las últimas horas el presidente José Mujica anunció que tiene planeado enviar al Parlamento
      una ley que fija el monopolio estatal en el tendido de la fibra óptica para llevar internet a
      los hogares.
    retrieved_at: 2026-09-08
  resumen: >-
    De León sostiene que, si Uruguay fijara las tarifas de telefonía fija según los costos
    (metodología de "benchmarking"), esas tarifas deberían ubicarse en el promedio del continente,
    un 58% por debajo de las vigentes en 2012. Sobre la base de los ingresos por telefonía fija que
    ANTEL declaró para 2011 ($ 6.229.619.000, unos USD 312 millones), calcula que la diferencia
    entre lo cobrado y lo que resultaría de aplicar costos —la "renta monopólica"— asciende a unos
    USD 181 millones anuales.

    La misma nota da dos datos favorables a ANTEL que no forman parte de la estimación de De León:
    según el estudio regional que cita, Uruguay es uno de los países más baratos del continente en
    costo del minuto de celular (servicio en competencia entre ANTEL, Movistar y Claro) y el segundo
    más barato en costos de internet, después de Brasil y Venezuela. El Observador consigna que
    intentó, sin éxito, conseguir la versión de ANTEL sobre el estudio de De León, y que la empresa
    se limitó a enviar una gráfica comparativa sobre cómo había bajado el precio de la telefonía
    fija.
  metodo: El autor menciona una "metodología de análisis para estimar precios denominada benchmarking
    (una herramienta que busca comportamientos competitivos en mercados monopolísticos)", sin
    detallar la fuente de los precios regionales de comparación ni el cálculo completo.
  afirmaciones:
    - afirmacion: Los ingresos de ANTEL por telefonía fija en 2011 ascendieron a $ 6.229.619.000,
        aproximadamente USD 312 millones.
      fragmento: Según los Estados Contables de ANTEL de 2011, los ingresos por telefonía fija ascienden
        a$ 6.229.619.000, aproximadamente US$ 312 millones
      calificacion: impreciso
      dato_real:
        valor: Los Estados Contables Individuales de ANTEL de 2012 (con columna comparativa 2011) informan,
          para la categoría "Telefonía" —que la propia nota al pie del cuadro aclara que "incluye
          Telefonía Fija, Pública y Telegrafía", no solo telefonía fija—, ingresos operativos de $
          6.232.799 miles en el ejercicio 2011. Esa cifra es 0,05% más alta que los $ 6.229.619.000
          que cita de León, y corresponde a una categoría algo más amplia que "telefonía fija" sola
          (incluye también telefonía pública y telegrafía). No se pudo leer el balance de 2011 en sí
          (es un PDF escaneado sin capa de texto legible) para comprobar si esa versión desagrega
          "telefonía fija" por separado de "pública" y "telegrafía".
        fuentes:
