          contable total del año (incluye ingresos y gastos financieros y partidas no operativas de
          todo el negocio de ANCAP), mientras que un "resultado primario corriente" excluye
          típicamente esas partidas para medir solo el desempeño operativo corriente del negocio de
          combustibles. Los estados financieros de ANCAP no traen una línea con ese nombre para
          2021, así que no se pudo confirmar ni refutar el monto de -44 millones con un documento
          oficial que use la misma definición que el CED.

