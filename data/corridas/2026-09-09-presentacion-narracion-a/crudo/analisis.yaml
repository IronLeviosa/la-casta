      los "boletines mensuales del sistema bancario" que la propia nota de CPA Ferrere cita como
      fuente (un documento distinto de este reporte trimestral) sí las traigan, pero no se
      localizaron ni se abrieron en esta corrida. Mantengo el tier en publicado porque las cinco
      afirmaciones ya tienen su calificación con la regla dura del Veracímetro aplicada (impreciso
      solo con documento oficial) y ninguna quedó con el marcador `_faltante` sin resolver; lo que
      falta es una fuente más granular para ajustar tres "discutible" a una calificación más fina,
