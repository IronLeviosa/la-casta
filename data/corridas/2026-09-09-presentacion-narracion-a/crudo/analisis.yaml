  veredicto: >-
    Las diez afirmaciones quedaron discutible: para ninguna hay un documento oficial que mida
    exactamente lo que afirma el CED con su misma definición y unidad. En las seis afirmaciones con
    cifra en dólares (0 a 3, 6 y 7), un documento oficial —la planilla de URSEA y los volúmenes del
    MIEM para 2010-2019; los estados financieros y el comunicado de resultados de ANCAP para 2021—
    confirma la dirección y, en cuatro casos, el orden de magnitud relativo de la brecha, pero no el
    monto en dólares: falta la metodología exacta del CED para combinar precio, volumen y tipo de
    cambio. En las dos afirmaciones sobre los promedios de El Observador (4 y 5) la aritmética es
    correcta a partir de las cifras del CED, pero el CED es fuente de prensa, no documento oficial.
    Las dos restantes (8 y 9, sobre la LUC y la competitividad) son conclusiones interpretativas sin
    magnitud medible.

    De las seis cifras en dólares, cuatro corresponden a los quinquenios de gobiernos del Frente
    Amplio (2010-2019: USD 78M de subsidio en nafta, USD 1.181M y USD 1.337M de sobreprecio en
    gasoil, USD 443M de sobreprecio en nafta) y dos al gobierno de la coalición (2021: ~USD 200M de
    renuncia de recaudación y −USD 44M de resultado primario corriente), a las que se suman las dos
    conclusiones interpretativas (8 y 9) referidas al gobierno en ejercicio. Sobre la cifra más
    grande del análisis (gasoil 2015-2019, USD 1.337 millones), el propio CED ofrece dos lecturas
    menos lineales que el registro recoge en la afirmación 3: que el resultado de ANCAP de 2016-2017
    respondió a mantener precios fijos mientras bajaba el petróleo, y que el sobreprecio del
    quinquenio compensó, en parte, una pérdida previa de USD 665 millones capitalizada por el Estado
    en 2016. Para el bienio 2020-2021 no existe, en ningún documento oficial revisado, una serie de
    precio de venta y PPI en la misma base que la planilla de URSEA 2002-2019, lo que impide
    extender a ese tramo el mismo cotejo directo que sí es posible para 2010-2019.
