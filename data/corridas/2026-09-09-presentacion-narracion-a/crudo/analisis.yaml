    tipo: documento_oficial
    titulo: Informe Anual 2024 - Datos (2022), Grupo Regional de Trabajo de Benchmarking de ADERASA
    cita: INFORME N°00037-2024-SUNASS-DF Superintendencia Nacional de Servicios de Saneamiento - Sunass
      Av. Bernardo Monteagudo 210 - 216 Magdalena del Mar. Lima 17 - Perú
