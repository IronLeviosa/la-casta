  veredicto: "Las tres afirmaciones de Rossa (U$S 48,5 M en 2012, U$S 58,7 M en 2013 y U$S 92,3 M en
    2014, un total de U$S 199,5 M en el trienio) quedan discutibles: no hay, para ninguno de los
    tres años, un documento oficial (precio de importación de referencia publicado por ANCAP, URSEA
    o MIEM) que permita reconstruir el cálculo de forma independiente, ni se leyó el dictamen
    completo de Rossa (Anexo 9 del informe), que podría traer la metodología. Los estados contables
    de ALUR para los tres años, ya cargados en esta ficha, confirman un contexto consistente con la
    dirección del reclamo (resultados positivos y crecientes de ALUR, capitalización de ANCAP en
    2012, entrada en operación de la planta más cara del grupo en 2014) pero miden magnitudes
    distintas de la que calcula Rossa (el resultado contable total de ALUR, no el sobrecosto de
    mezclar frente a importar) y no alcanzan para confirmar ni refutar los montos exactos. El mismo
    capítulo del informe documenta, en el párrafo inmediatamente anterior a estas cifras, que ANCAP
    le subió a ALUR de forma retroactiva los porcentajes que le abonaba por estos rubros durante el
    período que Rossa analiza, un dato que da contexto a la tendencia creciente del sobrecosto sin,
    por sí solo, confirmar su magnitud."
