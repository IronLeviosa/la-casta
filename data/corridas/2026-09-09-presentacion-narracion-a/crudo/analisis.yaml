- _slug: bid-sector-agua-saneamiento-uruguay
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  titulo: La tarifa de agua y saneamiento más cara de la región y 53 % de agua no facturada, según el
    BID (2020)
  empresa: ose
  tema: economia/tarifas-publicas
  autor: Banco Interamericano de Desarrollo (BID), División de Agua y Saneamiento
  autor_es: >-
    El documento es la Nota Técnica IDB-TN-1945 del BID, firmada por Cecilia Maroñas, Nicolas
    Rezzano, Marcello Basani y Santiago Sorhuet, de la División de Agua y Saneamiento del Banco,
    publicada en junio de 2020. El propio documento aclara: "Las opiniones expresadas en esta
    publicación son de los autores y no necesariamente reflejan el punto de vista del Banco
    Interamericano de Desarrollo, de su Directorio Ejecutivo ni de los países que representa." El
    BID es un organismo financiero multilateral con 26 países miembros prestatarios de América
    Latina y el Caribe; no integra el Estado uruguayo, pero Uruguay es uno de sus países
    prestatarios. Los estados financieros de OSE registran una partida patrimonial de "Aportes
    contrato BID" por $ 3.680.975 (unos USD 83.500 al tipo de cambio de cierre de 2024), una cifra
    pequeña frente al patrimonio de la empresa (unos $ 55.000 millones en 2024).

    El "Proyecto OSE Sostenible y Eficiente", que este documento cita como el programa vigente de
    reducción de agua no facturada, no lo financia el BID: se financia con el préstamo BIRF N° 8183
    del Banco Internacional de Reconstrucción y Fomento (Grupo Banco Mundial), por USD 42.000.000,
    aprobado el 16 de noviembre de 2012, según el dictamen del Tribunal de Cuentas de la República
    sobre los estados financieros de ese proyecto.
  fecha: 2020-06-01
  publicado:
    url: https://publications.iadb.org/publications/spanish/document/El-estado-del-sector-agua-saneamiento-y-residuos-solidos-en-Uruguay-Diagnostico-y-perspectivas.pdf
    medio: bid
    fecha: 2020-06-01
    tipo: documento_oficial
    titulo: "El estado del Sector Agua, Saneamiento y Residuos Sólidos en Uruguay: Diagnóstico y
      perspectivas (BID, Nota Técnica IDB-TN-1945)"
    cita: El estado del Sector Agua, Saneamiento y Residuos Sólidos en Uruguay Diagnóstico y
      perspectivas Cecilia Maroñas Nicolas Rezzano Marcello Basani Santiago Sorhuet IDB-TN-01945
      División de Agua y Saneamiento NOTA TÉCNICA Nº Junio 2020
    retrieved_at: 2026-09-08
  resumen: >-
    La nota técnica describe el estado del sector de agua potable y saneamiento de Uruguay hacia
    2018-2019, con foco en OSE (agua en todo el país, saneamiento fuera de Montevideo) y la
    Intendencia de Montevideo (saneamiento en la capital), comparando tarifas, cobertura y agua no
    facturada con otros países de la región.

    Sostiene que, según Lentini (2015), OSE tiene la tarifa media de agua y saneamiento más alta
    entre los once promedios por país de una muestra de 66 operadores de América Latina y el Caribe
    (USD 2,06/m3); que Uruguay mantiene una cobertura de agua potable por redes de 95,2 % y de
    saneamiento básico de 99,2 %; que el agua no facturada llegó a 53,4 % a diciembre de 2018, sin
    mejora entre 2013 y 2018 según la propia serie de OSE que trae el documento; y que la cobertura
    de saneamiento con tratamiento (seguro) alcanza solo al 43 % de la población, con una brecha
    entre Montevideo (65 %) y el interior (39 %), la zona que sirve OSE.
  metodo: 'Para la comparación tarifaria, el documento remite al método del estudio "Desafíos de los
    operadores de áreas urbanas de más de 300.000 habitantes" (Lentini, 2015): para cada operador de
    la muestra, divide la facturación anual por todo servicio (agua y saneamiento) entre el total de
    metros cúbicos facturados o comercializados, para obtener una tarifa media en USD/m3. Para los
    indicadores de cobertura, acceso y agua no facturada, el documento remite a fuentes de terceros
    (OSE, MVOTMA/SNAACC/Presidencia, ADERASA, Presidencia/OPP) sin describir un método de cálculo
    propio.'
  afirmaciones:
    - afirmacion: Según el BID, citando el estudio Lentini (2015), Uruguay tenía la tarifa media de agua y
        saneamiento más cara de la región, USD 2,06 por m3, frente a USD 0,39/m3 en Argentina, USD
        1,85/m3 en Brasil y USD 1,73/m3 en Chile.
      fragmento: Uruguay presenta la tarifa más cara de la región con un valor promedio de 2,06 USD/m3
      calificacion: verdadero
      dato_real:
        valor: >-
          El Cuadro 4 de Lentini (2015) —el estudio del propio BID, con CAF y ADERASA, del que sale
          este dato— da, para el conjunto de 57 operadores con dato de tarifa (de una muestra total
          de 66 operadores de 11 países), un promedio de USD 1,40/m3, un mínimo de USD 0,17/m3 y un
          máximo de USD 2,35/m3 (en Colombia, con 16 operadores): un máximo mayor al de Uruguay.


          El Cuadro A1 del mismo estudio identifica a la muestra de Uruguay con un único operador,
          de alcance nacional: "66 Uruguay Obras Sanitarias del Estado OSE 3.286.314 3.017.806"
          (población residente y servida). El USD 2,06/m3 que cita el BID es entonces el promedio de
          facturación de OSE (agua y saneamiento) sobre sus propios metros cúbicos facturados, no un
          promedio del país construido a partir de más de un operador, y por eso no incluye la
          facturación de saneamiento que cobra la Intendencia de Montevideo, un servicio que OSE no
          presta: OSE "es el organismo estatal responsable del abastecimiento de agua potable en
          toda la República Oriental del Uruguay, y del servicio de saneamiento en el interior del
          país" (catalogodatos.gub.uy). Con los mismos números que usa este mismo registro en la
          afirmación sobre el gasto mensual (agua $ 539,36 + saneamiento $ 422,75 = $ 962,11 por 15
          m3, al tipo de cambio de $ 36,642 que cita el propio BID), el costo por m3 para un hogar
          residencial de OSE a 15 m3 es de USD 1,75/m3, un 15 % menor al 2,06 que reporta el BID (no
          el 52 % que resultaba de compararlo solo contra el bloque de agua sin saneamiento).
        fuentes:
          - url: https://publications.iadb.org/publications/spanish/document/El-futuro-de-los-servicios-de-agua-y-saneamiento-en-Am%C3%A9rica-Latina-Desaf%C3%ADos-de-los-operadores-de-%C3%A1reas-urbanas-de-m%C3%A1s-de-300000-habitantes.pdf
