  autor: Grupo Regional de Trabajo de Benchmarking de ADERASA, documento elaborado por la
    Superintendencia Nacional de Servicios de Saneamiento del Perú (SUNASS)
  autor_es: >-
    ADERASA (Asociación de Entes Reguladores de Agua Potable y Saneamiento de las Américas) es una
    asociación de organismos reguladores públicos del sector, formada en 2001 y constituida como
    persona jurídica en 2013 con 17 miembros. El informe analizado ("Informe N°
    00037-2024-SUNASS-DF") lo elaboró la Dirección de Fiscalización de la Superintendencia Nacional
    de Servicios de Saneamiento de Perú (SUNASS), que coordinó el Grupo Regional de Trabajo de
    Benchmarking de ADERASA para esta edición (Lima, noviembre de 2024), y lo aprobó su Director,
    José Miguel Kobashikawa Maekawa.

    Los datos de Uruguay que contiene el informe (OSE) no los calculó SUNASS de forma independiente:
    el propio informe agradece, en su sección de reconocimientos, a "Sandra Rodríguez y Paula Suarez
    de la Unidad Reguladora de Servicios de Energía y Agua (URSEA), Uruguay" por su colaboración, lo
    que indica que el regulador uruguayo remitió o validó los datos de OSE usados en este
    benchmarking.
  fecha: 2024-11-01
