# medios NO está en ARCHIVOS_INBOX (scripts/lib/inbox.ts): pnpm validar --inbox y pnpm promover no
# leen este archivo como lote (por eso el guion bajo: leerArchivosInbox lo salta y lo trata como
# material auxiliar, igual que un _series.yaml). content/medios/ es una colección de referencia que
# CLAUDE.md autoriza al editor a escribir directamente en content/, pero esta corrida tiene la
# instrucción explícita de no escribir en content/, así que estos 6 registros completos (mismo
# formato que el resto del lote, listos para pegar) quedan acá para que /revisar los aplique por el
# camino que corresponda: escribirlos directo en content/medios/<slug>.yaml (el camino que ya prevé
# CLAUDE.md para esta colección) o agregar 'medios' a ARCHIVOS_INBOX y AGENTE_POR_COLECCION en
# scripts/lib/inbox.ts para que pnpm promover --correccion los procese como el resto. Los ids que
# afecta esta corrección (medios/180-com-uy, medios/aebu, medios/ced, medios/eltelegrafo,
# medios/grupo-r-multimedio, medios/portalmaritimo-com-uy) están igual en `afecta` de
# _correccion.yaml.
