    establecido si esa cifra surge de otro documento, por ejemplo de comparar la
    declaración jurada de 2024 con la de 2025, que no se leyó. El texto citado aparece palabra por
    palabra en la nota de Caras y Caretas del día siguiente, que se registra aparte.'
