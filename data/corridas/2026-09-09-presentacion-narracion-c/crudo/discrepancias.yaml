    2025 es $ 3.396.570,00 en la columna de valor actual, y no figura en el documento ninguna cifra
    en dólares ni la palabra descuento. Dos observaciones adicionales: (a) el texto publicado dice
    "$ 3.396.500" donde el documento escaneado dice
