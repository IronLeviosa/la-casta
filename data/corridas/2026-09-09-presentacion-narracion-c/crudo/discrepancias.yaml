    "que no era el jefe de seguridad de la presidencia" en el diario de sesiones—. El segundo cambio
    recae sobre el punto en disputa en ese tramo de la sesión, que es si Astesiano era o no jefe de
    la seguridad presidencial: "jefe de Presidencia" no es el cargo que se discutía. La nota marca
    con puntos suspensivos que la cita está recortada, de modo que lo que se registra no es el
    recorte sino las dos palabras que difieren dentro de lo entrecomillado. No se evalúa acá si la
