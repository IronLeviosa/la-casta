  analisis: >-
    La nota publica, el 2 de abril de 2025, que Ancap "dejó atrás tres años consecutivos de
    ganancias (en 2020 había perdido US$ 12 millones)". Los Estados Financieros Individuales de
    Ancap al 31 de diciembre de 2021, publicados por la propia empresa, reformularon el ejercicio
    2020 en aplicación de la NIC 8 y presentan la cifra de 2020 en tres columnas: "Original
    (510.662.282)", "Ajustes 895.776.155" y "Estado de Resultados Modificado 385.113.873". Es decir:
    en el último estado auditado que trata ese ejercicio, 2020 cierra con ganancia, no con pérdida,
    y la serie de ejercicios positivos previa a 2024 es de cuatro años (2020 a 2023) y no de tres.

    La cifra que publica la nota coincide con los Estados Financieros Individuales de Ancap al 31 de
    diciembre de 2020 tal como se emitieron en su momento, que sí registran "Resultado del ejercicio
    (510.662.282)"; la reformulación es posterior y está en los estados del ejercicio siguiente. No
    se registra acá por qué difieren: se registra que hay dos versiones del mismo ejercicio emitidas
    por el mismo emisor y que lo publicado corresponde a la primera.

    El ajuste es íntegramente del cargo por impuesto a la renta: el mismo cuadro muestra "Resultado
    antes de impuesto a la renta (277.690.029)" sin cambios en las tres columnas.

    Nota de simetría: la misma cifra superada está usada en el chequeo sobre la declaración de Orsi
    del 25 de abril de 2025 en la que dice que Ancap volvió a números negativos "después de 10
    años", que se corrige con el mismo criterio.
