          Aportes Gobierno Central - Subsidios                                   607.576.539                             -              607.576.539
        retrieved_at: 2026-09-09
  analisis: >-
    La nota dice que con los últimos estados financieros el Correo completó seis años consecutivos
    de déficit, entre 2020 y 2025. "Completó seis años consecutivos de déficit" es, en el uso
    corriente, una afirmación sobre la duración de la racha, no sobre una ventana de análisis
    arbitraria, y los balances no la sostienen: la empresa también tuvo pérdida en 2019, 2018, 2017,
    2016, 2015, 2014 y 2013. Un lector que lea "seis años" se lleva la idea de una racha más corta
    que la real.

    Los estados financieros auditados muestran resultado negativo en 2019 ($ 1.227.135.000) y en
    2018 ($ 1.097.351.549), y lo mismo en 2017, 2016, 2015, 2014 y 2013 según cada balance propio. El
    informe de auditoría de 2019, del mismo estudio que la nota cita para 2025, ya usaba la fórmula
    "pérdidas operativas recurrentes que podrian generar incertidumbre". Las seis cifras que la nota
    enumera coinciden con los balances; lo que los documentos no respaldan es que la racha empiece en
    2020.

    Queda dicho sin suponer por qué: una lectura posible es que el conteo arranque en el quinquenio
    2020-2024 (la nota anterior del mismo medio, del 2025-04-22, hablaba de "cinco años" y comparaba
    "con el comienzo del quinquenio (2020)"), y en ese caso el número describiría el período revisado
    y no la racha.
