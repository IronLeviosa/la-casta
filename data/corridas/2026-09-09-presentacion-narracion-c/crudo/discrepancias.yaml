        retrieved_at: 2026-09-07
  analisis: 'Mismo texto que publicó Montevideo Portal el día anterior, palabra por palabra, y se
    registra por separado porque las dos publicaciones existen. Lo publicado atribuye a la
    declaración jurada un precio de compra de US$ 54.000. El formulario no tiene columna de precio
    de compra para vehículos —Tipo, Marca, Año, Matrícula, Padrón, porcentaje y "Valor actual
    (estimado)"— y la única cifra que consigna para la camioneta Hyundai 2025 es $ 3.396.570,00 de
    valor actual, sin ninguna cifra en dólares. Valen las mismas dos observaciones del registro de
    Montevideo Portal: la diferencia de 70 pesos entre "$ 3.396.500" publicado y 3.396.570,00 del
    documento escaneado no sostendría nada por sí sola, y $ 3.396.570 es exactamente US$ 78.990 por
    43 pesos por dólar. Esta nota agrega, en el mismo texto, dos datos que la de Montevideo Portal
    no trae y que sí están atribuidos a Presidencia: que el pago se hizo con la entrega de un
    Hyundai 2020 más una transferencia bancaria, y que ese Hyundai 2020 había sido declarado en 2024
    por unos US$ 29.000. Esos dos datos no se cotejaron contra la declaración jurada de 2024, que no
    está incorporada a este análisis.'
