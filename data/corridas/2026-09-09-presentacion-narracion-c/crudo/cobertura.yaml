- _id: la-republica/2022-10-12-heber-custodios-antecedentes-ferres-niega-jefe-seguridad
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: la-republica
  url: https://www.lr21.com.uy/politica/1464915-luis-alberto-heber-parlamento-rodrigo-caso-astesiano-interpelacion-comparecencia
  titulo: Heber asegura que otros custodios tenían antecedentes. Ferrés niega que Astesiano fuera jefe
    de seguridad presidencial
  fecha: 2022-10-12
  evento: caso-astesiano
  politico: lacalle-pou
  tono: desfavorable
  justificacion: 'El medio no se limita a informar la comparecencia: le atribuye una intención al
    ministro y la refuta en voz propia. "Así, Heber largó frente a la Cámara Alta un glosario de
    nombres que traía entre sus apuntes, con el fin de deslizar que el caso de Astesiano es uno más.
    Sin embargo, lo que diferencia toda la trama del excustodio de Lacalle Pou es que estuvo
    operando su organización criminal en la mismísima sede del gobierno nacional." La URL es de
    lr21.com.uy, un dominio de La República. Esta misma nota tiene, además, una
    discrepancia de cita registrada contra la fuente primaria.'
  revision:
    tier: publicado
- _id: montevideo-portal/2022-10-08-oficio-justicia-interior-no-posee-antecedentes
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: montevideo-portal
  url: https://www.montevideo.com.uy/Noticias/El-oficio-de-la-Justicia-con-el-que-Interior-argumenta-que-Astesiano-no-posee-antecedentes-uc834675
  titulo: El oficio de la Justicia con el que Interior argumenta que Astesiano no posee antecedentes
  fecha: 2022-10-08
  evento: caso-astesiano
  politico: lacalle-pou
  tono: neutral
  justificacion: Es la nota que mejor explica el argumento del Gobierno ("La respuesta se encuentra en
    un oficio que libró el Juzgado Letrado de Primera Instancia en 2015") y a la vez marca la
    contradicción interna del Ministerio ("Heber ha dejado entrever en más de una ocasión que el
    excustodio posee antecedentes, algo que dentro del ministerio no comparten"); la frase más
    benigna para el presidente ("Esta explicación, junto con la confianza que el mandatario tenía en
    Astesiano, lo impulsó a no sospechar") está atribuida a fuentes de Presidencia, no puesta en voz
    del medio. Esta misma nota tiene, además, una discrepancia registrada contra la fuente primaria.
  revision:
    tier: publicado
- _id: subrayado/2022-03-27-etapa-superada-ley-queda-firme
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: subrayado
  url: https://www.subrayado.com.uy/una-etapa-superada-una-ley-que-queda-firme-dijo-lacalle-pou-referendum-la-luc-n852859
  titulo: '"Una etapa superada, una ley que queda firme", dijo Lacalle Pou tras referéndum por la LUC'
  fecha: 2022-03-27
  evento: referendum-luc
  politico: lacalle-pou
  tono: neutral
  justificacion: 'Crónica de la conferencia sin evaluación propia: encadena lo que dijo con verbos de
    atribución ("sostuvo", "señaló", "explicó") y no agrega juicio ni contraste, incluso en el
    pasaje donde reproduce cifras suyas sin verificar ("dijo que se pagaron más de USD 1.700
    millones de sobrecostos en el quinquenio anterior"). Reproducir una cifra sin chequearla no es
    tono favorable; es crónica. La cita alterada está registrada como discrepancia (recorta la
    reserva "creo que del 2001 2002") y tampoco mueve el tono: recorta a favor de la contundencia de
    la frase, no a favor ni en contra del político.'
  revision:
    tier: publicado
