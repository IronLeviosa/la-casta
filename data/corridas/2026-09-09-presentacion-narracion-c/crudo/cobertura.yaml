- _id: el-pais/2021-12-14-no-hay-motivos-aparentes-generar-paro
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: el-pais
  url: https://www.elpais.com.uy/informacion/politica/no-hay-motivos-aparentes-para-generar-un-paro-de-esa-dimension-dijo-lacalle-pou-sobre-ancap
  titulo: '"No hay motivos aparentes para generar un paro de esa dimensión", dijo Lacalle Pou sobre Ancap'
  fecha: 2021-12-14
  evento: asociacion-portland-ancap
  politico: lacalle-pou
  tono: neutral
  justificacion: "El cuerpo reporta la crítica del presidente al paro con su matiz completo y sin
    adherir a ella: \"hay 'algunas huelgas que, aun teniendo un motivo', no tienen razones
    'aparentes para generar un paro de esa dimensión'\". El titular es más duro que el cuerpo, pero
