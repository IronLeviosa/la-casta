- _id: el-observador/2014-04-19-partidos-pequenos
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: el-observador
  url: https://elobservador.com.uy/nota/los-partidos-pequenos-201441921260
  titulo: Los partidos pequeños
  fecha: 2014-04-19
  evento: elecciones-2014
  politico: abella
  tono: desfavorable
  justificacion: 'La nota lo caracteriza por asociación con figuras controvertidas y por un llamado a
    encarcelar a un rival político: "Abella quiere restaurar las viejas banderas de la izquierda.
    Admira a Fidel Castro y a Hugo Chávez" y "Esa gente tendría que estar presa (…). Pido cárcel
    para ellos". La misma nota trata con un tono equivalente de curiosidad/burla al candidato de un
    partido marginal de derecha (Unión Para el Cambio, admirador de Perón), que no tiene ficha propia
    por no haber ocupado una banca: el tratamiento no es específico de la izquierda, es parejo hacia
    los partidos chicos de distinto signo que cubre esa nota.'
  revision:
    tier: publicado
- _id: el-observador/2022-03-07-precios-combustibles-lacalle-pou
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  medio: el-observador
  url: https://www.elobservador.com.uy/nota/el-precio-de-la-nafta-y-el-gasoil-que-muestran-los-numeros-de-este-gobierno-y-el-fa--20223316150
  titulo: "El debate por el precio de la nafta y el gasoil: qué muestran los números de este gobierno
    y el FA"
  fecha: 2022-03-07
  evento: mecanismo-precios-combustibles-luc
  politico: lacalle-pou
  tono: neutral
  justificacion: 'Segunda ficha de la misma nota porque trata a dos gobiernos: reproduce su
    justificación textual ("la Ursea sugirió determinados aumentos y nosotros (por el gobierno)
    decidimos aumentar la mitad de lo sugerido") y también, citando un informe del CED, la crítica a
    su gestión tarifaria ("desde el pasado mes de noviembre (esto es, apenas cuatro meses después de
    comenzar a regir la normativa), el Poder Ejecutivo decidió apartarse de la recomendación técnica
    de la Ursea").'
  revision:
    tier: publicado
