evidencias_candidatas:
  - fecha: 2002-02-28
    tipo: ley
    efecto: en_contra
    descripcion: El Poder Ejecutivo promulgó la Ley 17.453, que creó el adicional del Impuesto a las
      Retribuciones y Prestaciones (IRP) que la promesa comprometía reducir hasta suprimir.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/17453-2002
          medio: impo
          fecha: 2002-02-28
          tipo: documento_oficial
          titulo: Ley N° 17.453
          cita: Créase un impuesto adicional al Impuesto a las Retribuciones y Prestaciones a que
            refiere el artículo 25 del Decreto-Ley Nº 15.294, de 23 de junio de 1982, en la
            redacción dada por el artículo 22 de la Ley Nº 16.697, de 25 de abril de 1995
          retrieved_at: 2026-09-16
  - fecha: 2002-05-29
    tipo: ley
    efecto: en_contra
    descripcion: La Ley 17.502 (Ley de Estabilidad Financiera) derogó el adicional creado por la Ley
      17.453, pero lo sustituyó por una escala de tasas para el mismo Impuesto a las Retribuciones y
      Prestaciones Personales, en vez de reducirlo hasta suprimirlo.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/17502-2002
          medio: impo
          fecha: 2002-05-29
          tipo: documento_oficial
          titulo: Ley N° 17.502
          cita: A partir de la entrada en vigencia de las modificaciones al Impuesto a las
            Retribuciones Personales, quedarán derogados el impuesto creado por el artículo 587 de
            la Ley Nº 17.296, de 21 de febrero de 2001 y el adicional creado por el artículo 1º de
            la Ley Nº 17.453, de 28 de febrero de 2002
          retrieved_at: 2026-09-16
  - fecha: 2004-04-22
    tipo: accion_de_gobierno
    efecto: a_favor
    descripcion: El Poder Ejecutivo anunció, a partir de mayo de 2004, la eliminación total del
      adicional del IRP para ingresos de hasta 15 salarios mínimos nacionales y una rebaja de tres
      puntos porcentuales por encima de ese nivel.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://archivo.presidencia.gub.uy/noticias/archivo/2004/abril/2004042201.htm
          medio: presidencia
          fecha: 2004-04-22
          tipo: documento_oficial
          titulo: "Reducción del IRP: un imperativo moral"
          cita: "reducir los adicionales del IRP de la siguiente manera: hasta quince salarios
            mínimos nacionales, unos dieciocho mil pesos, se elimina totalmente el adicional de IRP"
