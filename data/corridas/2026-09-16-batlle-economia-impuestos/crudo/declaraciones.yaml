  titulo: Dijo que Vázquez no tuvo que subir impuestos en sus primeros cinco años, pero sí después
  cita: Por una razón muy sencilla, en esos primeros cinco años no tuvo que hacer ajuste fiscal, no
    tuvo que subir impuestos o devaluar. Al contrario. Y con eso pudo mejorar la situación deprimida
    de los salarios. Eso determinó que votaran a Mujica. Y cuando votaron a Mujica, empezó a
    repartir dinero y generarle al país un déficit que cuando llega el doctor Vázquez, como en su
    momento lo dije, "le va a colgar una granada al mismo tiempo que la banda, le va a sacar la
    espoleta y se va a sentar en la plaza a escuchar la explosión". Y la explosión la está viviendo
    el pobre presidente de la República, que no puede bajar el gasto, porque el partido que generó
    el gasto, no le deja bajar el gasto
  resumen: En su última entrevista con El Observador, dijo que el primer gobierno de Vázquez
    (2005-2010) no tuvo que subir impuestos ni devaluar, lo que sostuvo que explicó el triunfo
    posterior de Mujica, y que el gasto generado en el gobierno de Mujica le dejó a Vázquez, en su
    segundo mandato, un déficit fiscal que comparó con una granada sin espoleta.
