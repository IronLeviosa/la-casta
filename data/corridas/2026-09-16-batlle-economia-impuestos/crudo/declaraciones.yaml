  titulo: Dijo que 2017 sería peor porque los impuestos se empezarían a cobrar desde enero
  cita: No, el año que viene es peor porque los impuestos los van a empezar a cobrar desde enero. El
    tipo de cambio estará más o menos en lo mismo. Si usted vende un litro de leche le van a pagar
    en pesos, pero no le van a bajar impuestos ni combustibles, porque aunque ANCAP mienta
    tranquilamente y Astori diga que es una maravilla, le están cobrando el combustible por encima
    de lo que vale. Los costos para producir no le van a bajar, y la plata que va a recibir va a ser
    menos que la que recibió hasta ahora
  resumen: En su última entrevista con El Observador, dijo que 2017 iba a ser un año económicamente
    peor porque nuevos cobros de impuestos empezarían a aplicarse desde enero, y acusó a ANCAP de
    cobrar el combustible por encima de su valor real.
