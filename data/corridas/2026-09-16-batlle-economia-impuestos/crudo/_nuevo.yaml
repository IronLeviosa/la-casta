titulo: Precio del combustible frente a la paridad de importación (setiembre de 2016)
afirmacion: >-
  Dijo que le estaban cobrando el combustible a la gente por encima de lo que valía, en referencia
  a la paridad de importación calculada por URSEA.
fragmento: >-
