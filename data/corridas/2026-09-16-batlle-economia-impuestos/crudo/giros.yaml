  declaracion_despues: batlle/2002-02-07-anuncia-cuatro-impuestos-106-millones-febrero-2002
  cambio: cambio_total
  explicacion: justificado_por_contexto
  analisis: >-
    Cambio total, justificado por un hecho externo. El 25 de agosto de 2000, antes de enviar el
    Presupuesto quinquenal al Parlamento, Batlle dijo que "el País no está en condiciones ni de
    subir impuestos, ni de aumentar gastos".


    El 7 de febrero de 2002 anunció el envío al Parlamento de cuatro impuestos nuevos por 106
    millones de dólares: un sustituto del impuesto monopólico de ANTEL, un tributo a las
    retribuciones personales de los funcionarios públicos con mayores ingresos, un impuesto a los
    juegos de azar (menos la quiniela) y el IVA a frutas y verduras importadas.


    En la misma conferencia atribuyó el anuncio a "los acontecimientos vividos en la República
    Argentina" y a la necesidad de sostener el equilibrio fiscal y el grado de inversión del país,
    lo que lo había llevado a negociar el paquete con el Partido Nacional. Es un hecho externo
    documentado -la crisis regional que se agravó desde fines de 2001-, no un reconocimiento de
    haber cambiado de posición.
