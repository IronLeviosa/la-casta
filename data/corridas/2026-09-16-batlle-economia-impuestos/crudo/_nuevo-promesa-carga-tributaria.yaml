evidencias_candidatas:
  - fecha: 2002-02-28
    tipo: ley
    efecto: en_contra
    descripcion: El Poder Ejecutivo promulgó la Ley 17.453, que creó un impuesto adicional al
      Impuesto a las Retribuciones y Prestaciones (IRP), un aumento de la carga tributaria y no un
      alivio.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/17453-2002
          medio: impo
          fecha: 2002-02-28
          tipo: documento_oficial
          titulo: Ley N° 17.453
          cita: Créase un impuesto adicional al Impuesto a las Retribuciones y Prestaciones a que
            refiere el artículo 25 del Decreto-Ley Nº 15.294, de 23 de junio de 1982, en la
            redacción dada por el artículo 22 de la Ley Nº 16.697, de 25 de abril de 1995
          retrieved_at: 2026-09-16
  - fecha: 2002-05-29
    tipo: ley
    efecto: en_contra
    descripcion: El Poder Ejecutivo promulgó la Ley 17.502 (Ley de Estabilidad Financiera), el segundo
      ajuste fiscal de 2002, que subió el IVA a honorarios de salud, llevó a 35% las tasas del
      Impuesto a las Rentas de la Industria y Comercio y del Impuesto a las Rentas Agropecuarias, a
      10,5% el Impuesto a las Comisiones y fijó una nueva escala para el Impuesto a las
      Retribuciones y Prestaciones Personales.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/17502-2002
          medio: impo
          fecha: 2002-05-29
          tipo: documento_oficial
          titulo: Ley N° 17.502
          cita: Fíjase en el 35% (treinta y cinco por ciento) las tasas de los impuestos a las
            Rentas de la Industria y Comercio y a las Rentas Agropecuarias, para los hechos
            generadores acaecidos a partir de la entrada en vigencia de la presente ley
          retrieved_at: 2026-09-16
  - fecha: 2004-04-22
    tipo: accion_de_gobierno
    efecto: a_favor
    descripcion: El Poder Ejecutivo anunció la reducción de los adicionales del Impuesto a las
      Retribuciones Personales (IRP) a partir de mayo de 2004, devolviendo parte de la recaudación
      de los ajustes fiscales de 2002.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://archivo.presidencia.gub.uy/noticias/archivo/2004/abril/2004042201.htm
          medio: presidencia
          fecha: 2004-04-22
          tipo: documento_oficial
          titulo: "Reducción del IRP: un imperativo moral"
          cita: "reducir los adicionales del IRP de la siguiente manera: hasta quince salarios
            mínimos nacionales, unos dieciocho mil pesos, se elimina totalmente el adicional de IRP"
          retrieved_at: 2026-09-16
  - fecha: 2006-12-27
    tipo: omision
    efecto: a_favor
    descripcion: Durante el gobierno de Batlle (2000-2005) no se creó el Impuesto a la Renta de las
      Personas Físicas (IRPF); lo creó el gobierno siguiente mediante la Ley 18.083, promulgada el
      27 de diciembre de 2006.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/18083-2006
          medio: impo
          fecha: 2006-12-27
          tipo: documento_oficial
          titulo: Ley N° 18.083
          cita: Créase un impuesto anual de carácter personal y directo, que gravará las rentas de
            fuente uruguaya obtenidas por las personas físicas y que se denominará Impuesto a la
