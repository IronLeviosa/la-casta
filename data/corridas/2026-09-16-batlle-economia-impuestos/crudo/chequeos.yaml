        medio: ose
        fecha: 2009-12-31
        tipo: documento_oficial
        titulo: OSE - Información económica, auditoría al 31/12/2009
        cita: Al entrar en vigencia la liquidación por IRAE (en sustitución del IRIC), la tasa de dicho
          tributo pasó del 30% al 25%.
        retrieved_at: 2026-09-16
      - url: https://www.impo.com.uy/bases/todgi-2023/4-2024?verOriginal=1
