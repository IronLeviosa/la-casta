        fecha: 2007-01-18
        tipo: documento_oficial
        titulo: Texto Ordenado - Título 4, Impuesto a las Rentas de las Actividades Económicas (IRAE)
        cita: La tasa del impuesto será del 25% (veinticinco por ciento) sobre la renta neta fiscal.
        retrieved_at: 2026-09-16
