  calificacion: discutible
  dato_real:
    valor: La Ley 18.083 (27/12/2006, vigente desde el 1/7/2007) sustituyó el IRIC por el IRAE y fijó su
      tasa general en 25%. Los estados contables auditados de OSE confirman que la tasa "pasó del
      30% al 25%" con ese cambio. La dirección y magnitud coinciden con lo que dijo Batlle, un año
      antes de que el Parlamento sancionara la ley.
