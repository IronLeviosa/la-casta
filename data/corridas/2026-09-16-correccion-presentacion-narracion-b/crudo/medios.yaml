  propiedad:
    descripcion: Publicación digital especializada en energía solar fotovoltaica y renovables, edición
      para América Latina de pv magazine, que además publica revistas mensuales y trimestrales en
      inglés y alemán y opera canales de noticias diarios por mercado. La página lleva aviso de
      copyright propio, lo que indica redacción propia y no un agregador. No se encontró fuente que
      identifique a la empresa editora ni su estructura societaria.
    fuentes:
      - url: https://www.pv-magazine-latam.com/
        medio: pv-magazine-latam
        fecha: 2025-02-28
        tipo: nota
        titulo: Noticias solares para América Latina | pv magazine América Latina
        cita: pv magazine publica revistas mensuales y trimestrales en inglés y alemán, y opera canales
          diarios de noticias de la industria enfocados en mercados específicos. Con un periodismo
          independiente y centrado en la tecnología, pv magazine se enfoca en los últimos
          desarrollos de los mercados de energía solar fotovoltaica, almacenamiento energético e
          industrias locales.
        retrieved_at: 2026-09-08
  alineamiento:
