  que_hace: ANCAP administra y explota el monopolio de la importación y refinación de petróleo, y de la importación y exportación de combustibles líquidos, semilíquidos y gaseosos, con excepción de la importación de gas natural. Sus principales actividades son la importación y refinación de petróleo y derivados en la refinería de La Teja, la comercialización y distribución de combustibles, la importación y elaboración de lubricantes, la fabricación y comercialización de cemento pórtland, la preparación de agrocombustibles (mezcla de biodiésel con gasoil y de alcohol carburante con nafta) y, desde 2022, la producción de hidrógeno verde y derivados en régimen de libre competencia. Opera además, a través de subsidiarias y participadas, en distribución de combustibles (DUCSA), producción de alcoholes y agrocombustibles (ALUR), gas por cañería (Gasoducto Cruz del Sur, Conecta) y cemento (Cementos del Plata).
  que_hace_fuentes:
    - url: https://www.ancap.com.uy/20615/1/eecc-individuales-2024.html
      medio: ancap
      fecha: 2024-12-31
      tipo: documento_oficial
      titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2024
      cita: "ANCAP administra y explota el monopolio de: • de la importación y refinación de petróleo; • de la importación y exportación de combustibles líquidos, semilíquidos y gaseosos cualquiera fuera su estado, con excepción de la importación de gas natural. Asimismo tiene como cometido la producción y exportación de alcohol carburante y biodiesel (ley 18.195, art.2) De acuerdo a lo dispuesto en la Ley 19.924 se extiende lo dispuesto para el alcohol carburante y biodiesel a todos el de los combustibles líquidos renovables obtenibles ya sea a partir de materias primas de origen agropecuario o a partir del procesamiento de residuos industriales, agroindustriales o sólidos urbanos incluyendo la producción, comercialización interna y exportación de combustibles líquidos renovables con materias primas nacionales o importadas. Las siguientes son las principales actividades de ANCAP: • Importación y refinación de petróleo y sus derivados. • Comercialización y distribución de combustibles líquidos, semilíquidos y gaseosos. • Importación, elaboración y comercialización de lubricantes. • Fabricación y comercialización de cemento pórtland y materiales afines. • Preparación de agrocombustibles líquidos a partir de la mezcla de biodiesel con gasoil y de alcohol carburante con nafta (gasolina), para su comercialización. • Producción, distribución, comercialización, importación y exportación de hidrógeno verde y derivados producidos a partir de este (combustibles sintéticos, metanol, amoníaco, líquidos orgánicos portadores de hidrógeno, entre otros), en régimen de libre competencia."
      retrieved_at: 2026-09-07
