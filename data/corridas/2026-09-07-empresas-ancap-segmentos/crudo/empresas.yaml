          fecha: 2026-01-10
          tipo: nota
          titulo: Uruguay tiene la nafta más cara de Latinoamérica y el tercer gasoil más costoso
          cita: Globalmente, el precio promedio de la nafta es de 1,28 dólares por litro, pero las diferencias entre países ricos y pobres son evidentes, así como la influencia de los subsidios y las políticas locales, que inciden directamente en el costo final que pagan los consumidores.
