  precios_vs_paridad:
    descripcion: 'El Precio de Paridad de Importación (PPI) es el cálculo que hace URSEA, mes a mes y por producto, de lo que costaría abastecer el mercado importando ese combustible ya terminado hasta la planta de distribución de ANCAP, en vez de refinarlo. La diferencia entre el precio que fija el Poder Ejecutivo para la venta al público y el PPI mide si, en ese período, el consumidor pagó por encima de esa referencia (sobreprecio, con signo positivo en esta ficha) o por debajo (subsidio, con signo negativo). El cálculo del PPI recibió críticas técnicas desde diversos ámbitos, incluida la propia ANCAP, que sostiene que subestima costos. Desde agosto de 2021 el gobierno agregó al PPI un ajuste adicional, el "factor X" (2,97 pesos por litro en gasolinas y gasoil, según ANCAP), que surge del trabajo de un comité de asesores para reconocer sobrecostos de ANCAP en supergás, biocombustibles, pórtland y otros costos estructurales.'
