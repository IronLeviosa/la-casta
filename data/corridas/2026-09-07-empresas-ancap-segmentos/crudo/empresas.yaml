          cita: "El PEP sin impuestos es el ingreso neto que percibe ANCAP por sus ventas. Sobre el PEP la URSEA determina los costos de la cadena comercial y fletes: márgenes de comercialización de las Distribuidoras, envasado de GLP, fletes, y bonificaciones de las estaciones de servicio."
