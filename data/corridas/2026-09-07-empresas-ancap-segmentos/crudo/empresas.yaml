  resumen: >-
    ANCAP es un ente autónomo del Estado, creado en 1931, que tiene reservadas por ley la importación y refinación de petróleo crudo, la fabricación, importación y venta de alcohol carburante nacional, y la importación y exportación de combustibles líquidos, semilíquidos y gaseosos cuando la refinería estatal cubre al menos el 50% del consumo nacional de nafta. Vende combustibles, cemento pórtland y agrocombustibles, y desde 2022 produce hidrógeno verde y derivados en régimen de libre competencia, fuera del monopolio.

    En los diez años de 2015 a 2024, el resultado del ejercicio de ANCAP fue negativo en dos: 2015 (pérdida de USD 198,5 millones) y 2024 (pérdida de USD 118,4 millones). También fue negativo en 2014 (pérdida de USD 323,2 millones), el año anterior al período de esta ficha. Entre 2016 y 2023 el resultado fue positivo todos los años, con un máximo de USD 162,9 millones en 2022. El resultado de 2020, publicado originalmente como una pérdida de USD 12,1 millones, fue reformulado por ANCAP en sus propios estados financieros de 2021 (aplicando la Norma Internacional de Contabilidad N.° 8) a una ganancia de USD 9,1 millones, al corregirse un error en el cálculo del impuesto a la renta de los ejercicios 2018 a 2020; el resultado antes de impuesto a la renta de 2020 fue negativo en las dos versiones.

    ANCAP paga y recauda impuestos por un monto superior a lo que transfiere directamente a Rentas Generales. El total de impuestos pagados y retenidos (IMESI, IVA, Tribunal de Cuentas, FUDAEE y retenciones de terceros, sin contar el impuesto a la renta propio de ANCAP) estuvo entre USD 599,8 millones (2015) y USD 1.021,0 millones (2022) por año. Las transferencias directas a Rentas Generales (versión de resultados acumulados) solo constan en tres de los diez años: USD 23,6 millones en 2020, USD 11,8 millones en 2023 y USD 24,8 millones en 2024; en 2015, 2016, 2017, 2018 y 2019 los propios estados financieros de ANCAP dicen que no hubo transferencias de este tipo.

    En 2016, el Estado, a través del Ministerio de Economía y Finanzas, canceló una deuda de ANCAP y su subsidiaria DUCSA por UI 5.840.159.519 ($ 18.856,7 millones), capitalizada como aporte de capital; la operación fue autorizada por la Ley 19.368 y el contrato se firmó el 2 de febrero de 2016. Esa cancelación explica la mayor parte de la baja de la deuda financiera de ANCAP entre 2015 ($ 37.135,7 millones) y 2016 ($ 14.058,5 millones). La cobertura de prensa de la época cifró el aporte del Ministerio de Economía y Finanzas en USD 622 millones, además de un préstamo de USD 250 millones del Banco de Desarrollo de América Latina (CAF) que integró el mismo paquete.

    ANCAP tiene un monopolio legal sobre la importación y refinación de petróleo crudo desde 1931; un intento de terminarlo y asociar a ANCAP con un socio privado (Ley 17.448, 2002) fue derogado por un referéndum en 2003. Leyes y decretos posteriores establecieron que el monopolio no rige para la venta de combustible a buques en los puertos administrados por la Administración Nacional de Puertos (desde 2020) ni, desde fines de 2020, para el abastecimiento de aeronaves comerciales con destino al exterior (excepción ampliada por decreto en 2023 a aeronaves de cualquier bandera). Sobre si ese monopolio debe mantenerse hay posiciones documentadas de los dos lados: a favor, entre otros, la propia ANCAP (que sostiene que refinar crea valor cuando es más barato que importar), la Federación Ancap y el entonces candidato presidencial Daniel Martínez; en contra, entre otros, el entonces presidente Lacalle Pou (que impulsó la libre importación de combustibles) y el gobierno de Jorge Batlle en 2001-2002.

    Entre 2016 y 2024, el segmento Pórtland tuvo resultado operativo negativo los nueve años con datos (no hay desglose por segmento para 2015); en 2016 y 2022 ese resultado negativo incluyó además deterioros contables de $ 3.621 millones y USD 1,4 millones, respectivamente. El segmento Combustibles sostuvo el resultado operativo positivo del conjunto en ocho de esos nueve años, y fue el que llevó a la empresa a pérdida operativa en 2024 (USD -95 millones), coincidiendo con la parada de la Refinería de La Teja. Lubricantes y Gas Natural son los segmentos más chicos: juntos no superaron el 6% del resultado operativo total de ANCAP en ningún año del período.

    En los años con precio de venta y precio de paridad de importación (PPI) comparables mes a mes —2015 a mayo de 2019, para nafta Súper 95 y gasoil—, el precio de venta estuvo por encima del PPI los cinco años, en los dos combustibles. La brecha del gasoil se redujo de forma marcada entre 2017 y 2018 (de $ 12,11 a $ 4,91 por litro); en diciembre de 2017 URSEA cambió la metodología de cálculo del PPI para incluir el margen de comercialización, que hasta entonces no formaba parte del cálculo, así que parte de esa reducción responde al cambio de metodología y no solo a un cambio de precios. La serie oficial con la que cuenta esta ficha no continúa más allá de mayo de 2019, dentro del segundo gobierno de Vázquez; no se encontró en esta corrida un documento oficial que la extienda, en la misma unidad, a los gobiernos siguientes.

    El cálculo del PPI está discutido, incluida la propia ANCAP, que sostiene que subestima costos; desde agosto de 2021 el gobierno le sumó el "factor X" ($ 2,97 por litro en gasolinas y gasoil), un ajuste para reconocer sobrecostos de la empresa. Según cálculos del CED (no una fuente oficial), el sobreprecio combinado de nafta y gasoil promedió USD 288 millones anuales durante la década 2010-2019 y bajó a USD 40,5 millones anuales entre 2020 y 2021, ya con el mecanismo de la LUC vigente; para 2024, ANCAP declaró que el precio de venta estuvo por debajo del PPI en USD 55 millones para los combustibles fósiles, más USD 24 millones de subsidio focalizado de supergás.
