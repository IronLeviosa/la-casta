      retrieved_at: 2026-09-07
  monopolio:
    tiene: true
    alcance: 'El monopolio original (Ley 8.764, 1931) reserva al Estado, a través de ANCAP: la importación y refinación de petróleo crudo; la fabricación, importación y venta de alcohol carburante nacional; y la importación y exportación de combustibles líquidos, semilíquidos y gaseosos cuando las refinerías del Estado produzcan al menos el 50% de la nafta que consume el país. La Ley 17.448 (4 de enero de 2002), impulsada por el gobierno de Jorge Batlle, derogaba el monopolio de importación, exportación y refinación de petróleo crudo y el de exportación de derivados, y habilitaba una asociación de ANCAP con un socio privado; esa ley fue derogada por el referéndum del 7 de diciembre de 2003 (62,2% de los votos válidos por el Sí a la derogación), por lo que el monopolio original de 1931 sobre esta materia siguió vigente. La Ley 19.924 (Presupuesto, 18/12/2020) modificó el literal F) del artículo 3 de la Ley 8.764 sobre la fijación de precios de los productos no monopolizados. La Ley 19.889 (LUC, 2020), artículos 235 a 237, estableció el mecanismo vigente de fijación de precios de combustibles (informes preceptivos de URSEA y ANCAP, actualización cada 60 días como máximo) sin derogar el monopolio de importación/refinación: un artículo que sí lo desmonopolizaba (el 230 del anteproyecto) fue retirado de la LUC en mayo de 2020 por falta de acuerdo dentro de la coalición de gobierno. Según cobertura de prensa, desde 2020 el monopolio no rige para la venta de combustible a buques en el puerto de Montevideo ni en otros puertos operados por la Administración Nacional de Puertos. Una ley de fines de 2020 estableció además que el monopolio no rige en los aeropuertos internacionales para la provisión de combustible a aeronaves con fines comerciales y destino a aeropuertos fuera del país; un decreto del 25 de julio de 2023 extendió esa excepción a aeronaves de cualquier bandera. La Ley 20.075 (20/10/2022) agregó a los cometidos de ANCAP la producción y comercialización de hidrógeno verde y derivados "en régimen de libre competencia", es decir, expresamente fuera del monopolio.'
    normas:
      - norma: Ley 8.764 (15/10/1931), artículo 1 - creación del monopolio de importación/refinación de petróleo y combustibles y del alcohol carburante
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/8764-1931
            medio: impo
            fecha: 1931-10-23
            tipo: documento_oficial
            titulo: Ley N° 8764
            cita: "A tal fin se declara de utilidad pública el derecho exclusivo a favor del Estado: A) A la importación y exportación de alcoholes, su fabricación, rectificación, desnaturalización y venta, así como la de carburantes nacionales en todo el territorio de la República. Esta disposición alcanza total o parcialmente a las bebidas alcohólicas destiladas, cuando el Ente Industrial lo crea oportuno. B) A la importación y refinación de petróleo crudo y sus derivados en todo el territorio de la República. C) A la importación y exportación de carburantes líquidos, semilíquidos y gaseosos, cualesquiera sea su estado y su composición, cuando las refinerías del Estado produzcan por lo menos, el 50 % de la nafta que consuma el país."
