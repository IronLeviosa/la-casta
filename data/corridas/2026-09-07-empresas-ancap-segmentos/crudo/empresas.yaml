            cita: Con fecha 4 de enero de 2016, mediante la ley N° 19.368, se autorizó al Poder Ejecutivo a capitalizar hasta en U.I. 5.712.381.810 a ANCAP, a través de la condonación de la deuda vigente del Ente con el Ministerio de Economía y Finanzas, contraída al amparo de las Leyes N° 18.965 del 30 de Agosto de 2012 y N° 19.339 del 26 de agosto de 2015. Con fecha 2 de febrero de 2016, el Estado por intermedio del Ministerio de Economía y Finanzas, ANCAP y DUCSA, firmaron el contrato de cancelación total de préstamo y prenda por un monto de U.I. 5.840.159.519 (equivalentes a $ 18.856.707.058) que incluye el capital por U.I. 5.712.381.810 más los intereses devengados impagos, mediante el cual el Estado declara extinguida la totalidad de la deuda de ANCAP relacionada anteriormente y cancelados los gravámenes de derecho real de prenda constituidos como garantía de la misma.
