  fecha: 2004-05-12
  contexto: parlamento
  cargo_en_ese_momento: Representante Nacional (Diputado) por Montevideo, suplente
  titulo: Cuestionó que el artículo 11 de corretaje inmobiliario obligue a pagar a quien no firmó la
    mediación
  cita: >-
    Señor Presidente: quisiera hacer algunas preguntas, principalmente a algún miembro de la
    Comisión. En cuanto al primer inciso del artículo 11, quisiera saber por qué razón se generan
    derechos ante el comprador si, por ejemplo, no intervino directamente en el contrato de
    mediación. Siendo este entre el corredor y el comitente, ¿por qué razón obliga a una tercera
    persona que en este caso, por ejemplo, podría ser el comprador?
  resumen: En el debate del proyecto de ley sobre corretaje inmobiliario, cuestionó en sala por qué el
    artículo 11 generaba obligaciones de pago de comisión a una parte (el comprador) que no había
    firmado el contrato de mediación con el corredor.
  evidencia:
    nivel: textual
