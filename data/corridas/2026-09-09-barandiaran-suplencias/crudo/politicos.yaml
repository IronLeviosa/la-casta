  cobertura:
    texto: >-
      Tercera vuelta de investigación (2026-09-08/09), enfocada en fechar los días de suplencia que
      el Parlamento agrupa como "suplencias menores a cinco días" en la Legislatura 45 (2000-2005)
      sin desglosar. El buscador de Diarios de Sesión del Parlamento se usó para ubicar las 97
      sesiones candidatas que mencionan a Barandiarán en esa legislatura; los documentos en sí se
      leyeron y se citan por la Hemeroteca de la Biblioteca del Poder Legislativo
      (`biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/`), que da una URL estable por
      diario. Las 45 fuentes que en una vuelta anterior de esta corrida apuntaban a
      `infolegislativa.parlamento.gub.uy/temporales/` —enlaces de sesión generados al vuelo, que
      caducan— se reemplazaron todas por su equivalente de la Hemeroteca, con la cita recopiada del
      texto del nuevo PDF. De 97 diarios candidatos, 82 se abrieron y se leyeron en esta vuelta: 19
      dieron un período de mandato nuevo, 3 sumaron una fuente adicional a un mandato ya conocido, y
      el resto no aportó dato nuevo. Quedan 89 de los 110 días de suplencia de la Legislatura 45
      documentados con fecha y cita (46 databan de la vuelta anterior); 21 días siguen sin fechar,
      no por imposibilidad sino por presupuesto de esta corrida: quince diarios candidatos del mismo
      listado no llegaron a abrirse.


      Dos ambigüedades de fecha encontradas en esta vuelta y su resolución, con la fuente que decide
      cada una: (1) la licencia de Iván Posada de julio de 2000 dice, en el listado narrativo de un
      diario, "20010" para el año; la resolución votada ese mismo día, en el mismo documento, dice
      "2000" sin ambigüedad, y es la que se usa. (2) Dos resoluciones de diciembre de 2002 convocan a
      Barandiarán por períodos distintos (9-13 y 11-13 de diciembre); la lista de asistencia del 10
      de diciembre lo muestra en funciones ese día con una nota al pie que dice que cesó a las 17:35
      "con motivo del reintegro del titular", y la segunda resolución, leída esa misma tarde, lo
      reconvoca para el 11-13: son dos licencias sucesivas del mismo titular, no una corrección de la
      primera, y el mandato de 9 a 13 de diciembre queda documentado por las dos. La fusión de los
      mandatos de suplencia consecutivos del 11 al 13 de diciembre de 2001 corresponde a tres
      resoluciones de licencia distintas, una por día, del mismo titular (Iván Posada), no a una
      resolución compartida.


      Dos suplencias de 2004 (16-20 de marzo y 19-23 de abril) tienen dos documentos oficiales que no
      coinciden: el registro compilado "Parlamentarios Uruguayos" del Parlamento da un día más de
      cierre en los dos casos (21 de marzo y 24 de abril) que la resolución de licencia votada en
      sala para esos mismos períodos (20 de marzo y 23 de abril); se usa la fecha de la resolución
      votada, que es el acto que otorga la licencia. No se pudo verificar si el mismo desfasaje de un
      día afecta a otras dos suplencias que solo están documentadas por "Parlamentarios Uruguayos"
      (6-12 de noviembre de 2000 y 9-20 de octubre de 2002): no se encontró, dentro del presupuesto
      de esta vuelta, una resolución de licencia independiente para cruzarlas.


      Dos hallazgos adicionales: una intervención hablada sustantiva (12 de mayo de 2004, preguntas
      sobre un proyecto de comisiones inmobiliarias) y una exposición escrita sustantiva (7 de
      noviembre de 2003, sobre un llamado a pasantías que discriminaba por universidad de origen),
      que se registran en `declaraciones.yaml`. También se documentaron dos convocatorias que
      Barandiarán rechazó (22 de mayo de 2002 y 15 de mayo de 2001): son datos reales sobre su
      disponibilidad en esos momentos, no períodos de ejercicio, y no se cargan como mandato.


      Un diario (15 de junio de 2000) no pudo verificarse: la página del buscador del Parlamento
      devolvió, dos veces, un archivo con contenido de una sesión muy posterior (menciona el
      referéndum contra la LUC de 2022), lo que indica un problema del lado del sitio del Parlamento
      con ese identificador interno específico, no un límite de esta investigación.


      Se buscó también, sin éxito, cobertura de prensa 1999-2004 vía el índice CDX de Wayback
      Machine sobre lr21.com.uy, larepublica.com.uy, elobservador.com.uy, montevideo.com.uy y
      radioelespectador.com filtrando por "barandiaran" en la URL: ningún resultado nuevo
      (radioelespectador.com y lr21.com.uy dieron cero coincidencias reales; larepublica.com.uy,
      elobservador.com.uy y elpais.com.uy no devolvieron resultado por timeout del servidor de
      Wayback al aplicar el filtro sobre dominios grandes, y no se pudo confirmar si hay o no
      cobertura). En espectador.com sí aparece archivada una fotografía de prensa de Barandiarán (2
      de julio de 2002, sección "fotos en perspectiva"), pero es una foto de un medio de prensa sin
      licencia libre declarada, así que no se usa: se sigue sin fotografía para la ficha.


      Los Diarios de Sesiones de la Cámara de Representantes están disponibles en línea desde el 11
      de febrero de 2000; antes de esa fecha no hay registro digitalizado de sus intervenciones como
      titular (1995-2000). La Asamblea General y la Comisión Permanente están digitalizadas desde
      1985; se revisaron para ese mismo período sin encontrar ninguna intervención suya. Su
      actuación en sala como titular en la Legislatura 44 (1995-1999) sí está en la Hemeroteca de la
      Biblioteca del Poder Legislativo y se recorrió completa por una corrida aparte
      (`2026-09-09-barandiaran-intervenciones`, 107 declaraciones); esa misma corrida deja
      constancia de que, para 1995-1999, el sitio todavía no tiene cargados a los legisladores de los
      demás lemas de esa legislatura, y que se van a cargar con el mismo barrido.


      Lo que hay: una intervención en el debate de la ley de trasplantes de órganos y tejidos (7 de
      noviembre de 2000, ya publicada), la exposición y la intervención sustantivas de esta vuelta ya
      mencionadas, su firma como uno de los primeros firmantes del proyecto que se convirtió en la
      Ley 17.189 sobre relaciones de consumo (promulgada el 20 de setiembre de 1999), y 89 de los 110
      días de suplencia que el Parlamento registra para la Legislatura 45 (2000-2005), documentados
      con fecha y cita cada uno.


      Lo que no hay en la web: ninguna cita de prensa suya salvo una nota de LR21 (La República) del
      29 de setiembre de 2000 sobre un proyecto de protección de datos personales; los 21 días de
      suplencia todavía sin fechar de la Legislatura 45; actividad pública documentada después del 14
      de febrero de 2005 (fin de esa Legislatura); y ninguna fotografía con licencia libre.
