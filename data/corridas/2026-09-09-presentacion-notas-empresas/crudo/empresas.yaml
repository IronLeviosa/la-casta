              Finanzas, ANCAP y DUCSA, firmaron el contrato de cancelación total de préstamo y
              prenda por un monto de U.I. 5.840.159.519 (equivalentes a $ 18.856.707.058) que
              incluye el capital por U.I. 5.712.381.810 más los intereses devengados impagos,
              mediante el cual el Estado declara extinguida la totalidad de la deuda de ANCAP
              relacionada anteriormente y cancelados los gravámenes de derecho real de prenda
              constituidos como garantía de la misma.
