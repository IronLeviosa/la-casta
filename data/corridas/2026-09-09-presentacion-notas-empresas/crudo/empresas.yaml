              alcohólicas destiladas, cuando el Ente Industrial lo crea oportuno. B) A la
              importación y refinación de petróleo crudo y sus derivados en todo el territorio de la
              República. C) A la importación y exportación de carburantes líquidos, semilíquidos y
              gaseosos, cualesquiera sea su estado y su composición, cuando las refinerías del
              Estado produzcan por lo menos, el 50 % de la nafta que consuma el país."
