    argumentos_a_favor:
      - texto: "A diferencia de la generación, que es llevada a cabo por numerosos agentes públicos y
          privados, las actividades de trasmisión y distribución de energía eléctrica constituyen un
          monopolio natural: el arreglo más eficiente es que exista, en un área geográfica
          determinada, un solo actor prestando estos servicios, porque las redes eléctricas se
          benefician de fuertes economías de escala y tener múltiples empresas construyendo redes
          paralelas de trasmisión y distribución sería económicamente ineficiente. Aclara, sin
          embargo, que la calificación de monopolio natural no implica necesariamente que la
          propiedad o la gestión de esas redes deban ser estatales: en el mundo hay numerosos
          ejemplos de redes de trasmisión y distribución de propiedad privada con monopolio natural
          en su área de servicio; en Uruguay las tiene a cargo UTE, con libre acceso regulado para
          productores y consumidores y precios fijados regulatoriamente."
        quien: Exante, en el informe "Transmisión y Distribución de Energía Eléctrica en Uruguay" encargado
          por la Asociación Uruguaya de Generadores Privados de Energía Eléctrica (Augpee)
        fuentes:
          - url: https://augpee.org.uy/wp-content/uploads/2024/10/Informe-Transmisi%C3%B3n-y-Distribuci%C3%B3n-de-Energ%C3%ADa-El%C3%A9ctrica-en-Uruguay.pdf
            medio: augpee
            fecha: 2024-10-01
            tipo: documento_oficial
            titulo: Trasmisión y Distribución de Energía Eléctrica en Uruguay
            cita: A diferencia de la actividad de generación, que es llevada a cabo por numerosos agentes
              públicos y privados, las actividades de trasmisión y distribución constituyen un
              monopolio natural. Eso significa que el arreglo más eficiente es que exista, en un
              área geográfica determinada, un solo actor prestando estos servicios. Si bien algunos
              desarrollos tecnológicos recientes desafían esta definición, la literatura económica
              en relación con las redes eléctricas en general destaca que la construcción de la
              infraestructura de trasmisión y distribución requiere de inversiones significativas. A
              su vez, las redes eléctricas se benefician de fuertes economías de escala, en el
              sentido de que el costo promedio por unidad de electricidad transmitida y distribuida
              disminuye a medida que aumenta la cantidad de electricidad que fluye por la red. Por
              tanto, tener múltiples empresas construyendo redes paralelas de trasmisión y
              distribución sería económicamente ineficiente, al tiempo que podría generar
              distorsiones en el funcionamiento del mercado debido a una mayor complejidad de
              gestión técnica del sistema. Es importante notar que la calificación de monopolio
              natural no necesariamente implica que la propiedad y/o la gestión de las redes debe
              ser estatal. De hecho, la estructura del mercado y la propiedad de los activos son dos
              dimensiones distintas, existiendo en el mundo numerosos ejemplos en los cuales las
              redes de trasmisión y distribución son de propiedad de empresas privadas que tienen
              monopolios naturales en sus respectivas áreas de servicio. En Uruguay, sin embargo,
              las redes de trasmisión y distribución están a cargo de UTE. En cualquier caso y como
              ocurre en otras partes del mundo, la regulación establece el libre acceso a dichas
              redes para productores y consumidores y también prevé que los precios de los servicios
              asociados a estas actividades monopólicas se fijen regulatoriamente.
            retrieved_at: 2026-09-08
      - texto: Defiende que UTE siga siendo una empresa del Estado, para el Estado y para la gente, con una
          función social y estratégica para el desarrollo nacional y no pensada solo desde la lógica
          comercial; en la nota no se pronuncia sobre si la trasmisión y la distribución deben
          seguir reservadas por ley.
        quien: Roberto Bentancor, vicepresidente de UTE y exdirigente de AUTE
        fuentes:
          - url: https://elpueblodigital.uy/roberto-bentancor-ute-tiene-que-seguir-siendo-una-empresa-del-estado-al-servicio-de-la-gente/
            medio: elpueblodigital
            fecha: 2026-06-05
            tipo: nota
            titulo: Roberto Bentancor defendió el rol social de UTE
            cita: UTE tiene que seguir siendo una empresa del Estado para el Estado y para la gente.
            retrieved_at: 2026-09-07
    argumentos_en_contra:
      - texto: 'El monopolio de la compra de generación eléctrica por parte de UTE es absurdo y hay que
          combatirlo: un generador privado que ya hizo la inversión en Uruguay no puede seguir
          generando si UTE decide que su energía es cara, porque el único cliente al que le puede
          vender es UTE. Lo planteó a raíz de que el Directorio de UTE, con los votos del Frente
          Amplio, no renovó el contrato de compraventa de energía con la empresa Fenirol S.A. de
          Tacuarembó (biomasa), que proveía a UTE desde 2007 y cuya renovación por 12 años había
          sido aprobada en febrero de 2025 por el gobierno de Lacalle Pou; el nuevo Directorio
          revirtió esa decisión luego de una observación del Tribunal de Cuentas "por falta de
          disponibilidad presupuestal".'
        quien: Alejandro Stipanicic, expresidente de ANCAP designado en 2020 a pedido del entonces ministro
          de Industria, Energía y Minería, Omar Paganini, en el gobierno de Lacalle Pou (Partido
          Colorado, sector Ciudadanos), en su columna del programa Sin Vueltas (Campo TV)
        fuentes:
          - url: https://www.elobservador.com.uy/economia-y-empresas/stipanicic-el-monopolio-la-compra-generacion-electrica-ute-es-absurdo-y-hay-que-combatirlo-n6008574
            medio: el-observador
            fecha: 2025-07-15
            tipo: nota
            titulo: 'Stipanicic: "El monopolio de la compra de generación eléctrica de UTE es absurdo y hay que
              combatirlo"'
            cita: El Directorio de UTE resolvió la semana pasada con los votos del oficialismo no renovar el
              contrato de compraventa de energía con la empresa Fenirol S.A (Energías Renovables
              Tacuarembó). Esta empresa se dedica a generar energía renovable a partir de biomasa
              –quema de chips y aserrín de la industria forestal– y le comercializaba producción al
              ente desde el 2007. El semanario Búsqueda había informado la semana pasada que en
              febrero de 2025 el gobierno de Luis Lacalle Pou adoptó una resolución en la que por
              tercera vez se renovaba el contrato con este proveedor, por un lapso de 12 años y un
              monto aproximado de US$ 97,9 millones. Pero el nuevo Directorio revirtió la decisión
              dando lugar a una observación efectuada por el Tribunal de Cuentas "por falta de
              disponibilidad presupuestal" y resolvió no reiterar el gasto. Esta semana el ex
              presidente de Ancap, Alejandro Stipanicic, criticó la decisión adoptada por los
              representantes del Frente Amplio en el Directorio de UTE.
            retrieved_at: 2026-09-08
          - url: https://www.elobservador.com.uy/nota/alejandro-stipanicic-sera-el-nuevo-presidente-de-ancap-202036202135
            medio: el-observador
            fecha: 2020-03-07
            tipo: nota
            titulo: Alejandro Stipanicic será el nuevo presidente de Ancap
            cita: El ingeniero industrial Alejandro Stipanicic será el nuevo presidente de Ancap, confirmó El
              Observador con fuentes políticas y del gobierno. Stipanicic se desempeña actualmente
              como gerente de control de gestión en la empresa e integra el sector Ciudadanos del
              Partido Colorado, que lidera el canciller Ernesto Talvi. Además de ser un técnico con
              conocimiento de la empresa, Stipanicic será designado a pedido expreso del ministro de
              Industria, Energía y Minería, Omar Paganini, quien a principios de año le transmitió
              que lo quería como mínimo en el directorio.
            retrieved_at: 2026-09-08
      - texto: UTE cobra peajes abusivos a los generadores privados de energía, lo que afecta a los
          inversores en generación y desestimula nuevas inversiones; como la distribución es
          monopolio de UTE, el ente impone peajes elevados para que los privados no puedan hacer
          negocios entre ellos.
        quien: Miguel Fraschini, director gerente de Azucarlito e integrante de la Asociación Uruguaya de
          Generadores Privados de Energía Eléctrica (Augpee)
        fuentes:
          - url: https://www.eltelegrafo.com/2024/10/generadores-privados-consideran-abusivo-el-precio-que-cobra-ute-por-redes-de-transmision/
            medio: eltelegrafo
            fecha: 2024-10-22
            tipo: nota
            titulo: Generadores privados consideran "abusivo" el precio que cobra UTE por redes de transmisión
            cita: Es absolutamente cierto que UTE cobra peajes abusivos a los generadores privados de energía
            retrieved_at: 2026-09-07
      - texto: Las tarifas de peajes que UTE cobra por el uso de sus redes de trasmisión y distribución se
          derivan de remuneraciones regulatorias que exceden largamente los costos efectivos de UTE,
          y resultan en cargos superiores a los que enfrentan los actores que contratan la energía a
          través de UTE, salvo en trasmisión; ese resultado parece contrario al espíritu de la
          regulación y seguramente opera como inhibidor del desarrollo del mercado mayorista de
          energía eléctrica.
        quien: Exante, en el mismo informe "Transmisión y Distribución de Energía Eléctrica en Uruguay"
          encargado por Augpee
        fuentes:
          - url: https://augpee.org.uy/wp-content/uploads/2024/10/Informe-Transmisi%C3%B3n-y-Distribuci%C3%B3n-de-Energ%C3%ADa-El%C3%A9ctrica-en-Uruguay.pdf
            medio: augpee
            fecha: 2024-10-01
            tipo: documento_oficial
            titulo: Trasmisión y Distribución de Energía Eléctrica en Uruguay - Comentarios finales
            cita: Del trabajo realizado se desprende que las tarifas de peajes se derivan de remuneraciones
              regulatorias que exceden largamente los costos efectivos de UTE y resultan en cargos
              por el uso de las redes para los participantes del mercado mayorista superiores a los
              que enfrentan los actores que contratan la energía a través de UTE, salvo para los
              niveles de tensión correspondientes a trasmisión. Este resultado parece contrario al
              espíritu de la regulación y, dada la magnitud de las diferencias, seguramente opera
              como inhibidor para el desarrollo del mercado mayorista de energía eléctrica.
            retrieved_at: 2026-09-08
