    - fecha: 2002-12-30
      titulo: ANTEL paga un anticipo de resultados a Rentas Generales con títulos públicos, no en efectivo
      detalle: La OPP le exigió a ANTEL un anticipo de resultados de 2003 por US$ 5,5 millones; el
        Directorio (Resolución 1946/02) lo pagó con títulos públicos por valor nominal de US$ 5,4
        millones más US$ 73.600 en efectivo. Como los títulos estaban contabilizados a valor de
        mercado de US$ 3,55 millones, la diferencia (US$ 1,87 millones) se registró como ganancia en
        "Otros Resultados".
      fuentes:
        - url: https://web.archive.org/web/20031011212136id_/http://www.antel.com.uy:80/la_empresa/estados_contables/estados_2002_y_2001/est_notas.pdf
          medio: antel
          fecha: 2002-12-31
          tipo: documento_oficial
          titulo: Notas a los Estados Contables de ANTEL al 31/12/2002 y 2001, Nota 17.2 (Otros resultados)
          cita: En cumplimiento de las facultades establecidas en la Ley 16.170 y en el Decreto 436/02 el
            Poder Ejecutivo a través de la Oficina de Planeamiento y Presupuesto informó a ANTEL la
            obligación de pagar (pasivo para ANTEL) el valor de US$ 5,500,000 como anticipos de
            resultados por el año 2003. El Directorio por medio de Resolución 1946/02 del 30 de
            diciembre de 2002 aprobó el pago de dichos dividendos mediante la entrega de títulos
            públicos emitidos por el gobierno uruguayo con un valor nominal de US$ 5.426.400 y la
            entrega de US$ 73.600 en efectivo. Los títulos públicos se encontraban contabilizados en
            los registros contables de ANTEL por su valor estimado de mercado de US$ 3.554.592. La
            diferencia que resulta de cancelar un pasivo por un valor de US$ 5,500,000 con activos
            contabilizados por US$ 3.544.592, que ascendió a US$ 1.871.807 ($ 50.857 miles) fue
            reconocida como resultado del ejercicio y se presenta en la línea de Otros Resultados.
          retrieved_at: 2026-09-08
