        titulo: Estados Financieros de UTE al 31 de diciembre de 2020 - Notas a los Estados Financieros
          Separados, Nota 1
        cita: "La Ley Nº 4.273 promulgada el 21 de octubre de 1912 creó la UTE, ente autónomo al cual se le
          concedió personería jurídica para cumplir su cometido específico, abarcando éste las
          etapas de: generación, trasmisión, distribución y comercialización de la energía
          eléctrica. Se le confirió el monopolio estatal del suministro eléctrico para todo el
          territorio nacional y se la amparó reconociéndole derechos y privilegios legales para
          facilitar su gestión y respaldar su autoridad. Por Leyes N° 14.694 del 01/09/77, N° 15.031
          del 04/07/80 y N° 16.211 del 01/10/91, el Ente deja de cumplir sus funciones específicas
          en régimen de monopolio y se le amplían sus posibilidades de actuación al campo de
          prestación de Servicios de Asesoramiento y Asistencia Técnica en las áreas de su
          especialidad y anexas, tanto en el territorio de la República como en el exterior. Por el
          art. 265 de la Ley Nº 16.462 del 11 de enero de 1994 se amplía su giro, facultándose su
          participación fuera de fronteras en las diversas etapas de la generación, transformación,
          trasmisión, distribución y comercialización de la energía eléctrica, directamente o
          asociada con empresas públicas o privadas, nacionales o extranjeras. Dicha participación
          estará supeditada a la previa autorización del Poder Ejecutivo. Con fecha 17 de junio de
          1997 el Poder Ejecutivo promulgó la Ley Nº 16.832 que sustituye el artículo 2° del Decreto
          - Ley Nº 14.694, estableciendo a su vez un nuevo Marco Regulatorio Legal para el Sistema
          Eléctrico Nacional. La misma establece un reordenamiento del mercado eléctrico fijando
          condiciones y creando organismos reguladores."
