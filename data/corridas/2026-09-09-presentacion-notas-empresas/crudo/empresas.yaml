  resumen: >-
    UTE es un ente autónomo del Estado uruguayo, creado en 1912 con el monopolio del suministro
    eléctrico -generación, trasmisión, distribución y comercialización- en todo el territorio
    nacional. Ese monopolio dejó de ser exclusivo primero en 1977 (Decreto-Ley 14.694), que amplió
    el giro de UTE a servicios de asesoramiento fuera del monopolio, y de forma más profunda en 1997
    (Ley 16.832, Marco Regulatorio Eléctrico), que abrió la generación a la competencia de privados
    y creó un mercado mayorista de energía. Desde entonces UTE compite con generadores privados en
    la producción de energía, pero mantiene en forma exclusiva la trasmisión y la distribución como
    servicio público; la ley y el Decreto 276/002 (2002) prevén que esas dos actividades puedan
    cumplirse en concesión si el Poder Ejecutivo lo resuelve, algo que no ha ocurrido.

    No hay estados contables propios de UTE digitalizados para los ejercicios anteriores a 2003. La
    Memoria Anual del Poder Ejecutivo trae, para 1999 y 2000, indicadores de ingresos, patrimonio y
    endeudamiento en dólares, pero con una definición de "endeudamiento" que no se corresponde con
    la de deuda financiera que usa el resto de esta ficha, así que no se cargaron; la Memoria anual
    de UTE de 1996 está digitalizada con su propio Estado de Situación Patrimonial y Estado de
    Resultados, pero el texto extraído tiene ruido de OCR -números y palabras con espacios
    insertados- que no permitió atribuir con confianza cada cifra a su año y columna, así que
    tampoco se cargó. El ejercicio 2003 se reconstruyó, parcialmente, desde la columna comparativa
    del balance de 2004.

    Entre 2003 y 2025, con datos disponibles para 22 de los 23 ejercicios, el resultado del
    ejercicio de UTE fue negativo en tres años -2006 (USD -46,7 millones), 2008 (USD -339,3
    millones, la mayor pérdida de la serie) y 2012 (USD -176,3 millones)- y positivo en los
    diecinueve restantes, entre USD 69,5 millones (2004) y USD 430,5 millones (2014); el resultado
    de 2025, ya publicado por UTE, fue de USD 338,3 millones. El año 2017 no tiene cifra en esta
    ficha porque los estados financieros de ese ejercicio y sus columnas comparativas (2016 y 2018)
    están publicados por UTE solo como escaneos sin capa de texto extraíble. Ninguno de los tres
    balances con pérdida explicita su causa: el de 2008 sí permite comparar que el gasto de
    explotación en Generación fue de $ 14.656.224.813 ese año, frente a $ 2.367.278.912 en 2004,
    pero no dice por qué esa pérdida fue la mayor de la serie. Las cifras de 2003 a 2011 están
    expresadas en la moneda de cierre de cada balance, por el ajuste integral por inflación que UTE
    aplicó hasta ese ejercicio (Índice de Precios al Productor hasta 2008, Índice de Precios al
    Consumo desde 2009 por el Decreto 99/009); desde 2012 los balances se presentan en pesos
    corrientes, sin ese ajuste, así que las cifras de un lado y otro de ese corte metodológico no
    están en la misma unidad de medida.

    UTE paga y recauda tributos por un monto muy superior al impuesto a la renta (IRAE) que tributa
    por su propia actividad. El total de tributos abonados en el ejercicio -según el Literal D o el
    Literal E de sus estados financieros, la letra cambia según el año- incluye IVA, IRAE, impuesto
    al patrimonio, retenciones y tasas, y estuvo entre USD 152,4 millones (2021) y USD 333,6
    millones (2025) en toda la serie 2004-2025; en el tramo 2004-2014 se movió, dentro de ese mismo
    rango, entre USD 172,9 millones (2009) y USD 282,3 millones (2011). El IRAE propio pagado en
    efectivo, cuando consta por separado en el estado de flujos de efectivo, es una fracción menor
    de ese total: por ejemplo, USD 6,3 millones de los USD 152,4 millones de tributos totales de
    2021. No hay cifra de tributos totales para 2003 (no se localizó un documento propio de ese
    ejercicio), para 2017 (balance sin capa de texto) ni para 2018 (el balance de 2019, que sí tiene
    capa de texto, no trae el detalle comparativo de ese renglón para 2018).

    Además de los tributos, UTE transfiere a Rentas Generales una "versión de resultados", que esta
    ficha registra según el criterio de caja -lo efectivamente vertido en el ejercicio, no lo
    devengado contablemente- para que la serie sea comparable año a año: entre cero (2009, sin
    adelanto ese año) y USD 323,2 millones (2018); en el tramo 2003-2014 estuvo entre cero y USD
    71,7 millones (2007). El adelanto de 2007 ($ 1.541.428.784) fue, según la Nota 4.2 del balance
    de 2008, reclasificado en su totalidad por dos decretos de 2008 y aplicado al pago de impuestos:
    $ 700.000.000 como Impuesto a la Renta de Industria y Comercio del propio 2007 y $ 841.428.784
    como IVA e Impuesto al Patrimonio de 2008. Esta ficha mantiene las dos cifras -la versión de
    2007 y el total de impuestos pagados de 2008- porque cada una es la que declara el balance del
    año que corresponde, pero ese mismo dinero puede por eso contarse dos veces si se suman los dos
    campos de esos dos años. En 2008, además, el balance da dos cifras de versión de resultados: $
    24.595.000 en su Literal E y $ 124.595.000 (USD 5,1 millones), ajustados por inflación, en su
    Nota 4.2; esta ficha usa la segunda, que es la que también consta en el estado de evolución del
    patrimonio. El pago de 2021 (USD 67,2 millones) fue menor al cargo patrimonial devengado ese año
    (equivalente a unos USD 173 millones), porque una parte de ese cargo se terminó de pagar en
    2022; el pago de 2022 (USD 124,8 millones) corresponde, según el propio balance, al saldo del
    aporte adicional del ejercicio 2021, y no a la ausencia de una transferencia en 2022.

    El Estado también le puso plata a UTE, no solo la recibió. Hay capitalizaciones documentadas en
    al menos siete de los once ejercicios 2004-2014: aportes de DIPRODE a obras de electrificación
    del norte del país en 2007 y 2008 (USD 1,5 y 12,1 millones; esta última cifra incluye además un
    aporte del Ministerio de Economía y Finanzas de USD 10,8 millones por la cuota parte de los
    aerogeneradores de la Sierra de los Caracoles, dentro de un programa de conversión de deuda
    externa con España), una capitalización de obras DIPRODE en 2009 (USD 2,2 millones), y aportes
    de OPP a capitalizar en 2011, 2013 y 2014 (entre USD 0,9 y 6,2 millones cada año). No hay
    capitalizaciones de este tipo registradas en esta ficha para 2003, 2004, 2005, 2006 y 2010, lo
    que puede reflejar que no hubo o que el balance de esos años no las declara con el mismo
    detalle. Aparte de esas capitalizaciones, UTE y el Estado intercambiaron dinero por el Fondo de
    Estabilización Energética (FEE), creado por la Ley 18.719 (artículo 773) a fines de 2010 para
    amortiguar el impacto de los déficit hídricos sobre las finanzas de UTE y las públicas: UTE
    aportó USD 150 millones a su constitución en 2010, cobró USD 175,4 millones del fondo en 2012
    -el mayor movimiento de la serie, en el único año de pérdida del período 2009-2014, y casi el
    triple del cobro de 2020- y volvió a aportar USD 152,1 millones en 2013 y USD 150,0 millones en
    2014. En 2020, ya dentro de la serie publicada de esta ficha, UTE cobró USD 61,8 millones
    (equivalentes a $ 2.622,8 millones) del mismo fondo; según su propio balance, en 2019 no hubo
    uso de ese fondo. No se encontraron otras capitalizaciones directas del Estado a UTE en el
    período 2015-2025.

    La deuda financiera de UTE -neta de intereses a vencer en casi toda la serie- pasó de USD 397,6
    millones en 2003 a USD 986,1 millones en 2015 y a USD 1.262,0 millones en 2025, con oscilaciones
    dentro de esos rangos en los años intermedios; desde 2015 la cifra sale de los estados
    financieros separados, que excluyen los fideicomisos de trasmisión (PAMPA, ARIAS, Línea Cierre
    del Anillo) y otras sociedades vinculadas, cuya inclusión da una cifra consolidada mayor. La
    única excepción a la presentación neta es 2008: su balance (Nota 5) da la deuda bruta, sin
    descontar los intereses a vencer, por lo que el salto entre 2007 y 2008 que muestra esta ficha
    (de USD 279,9 a USD 652,7 millones) es mayor al que da el propio balance de 2008 cuando compara
    sus dos columnas en la misma base bruta (de $ 7.372.690.510 a $ 15.902.122.756, un aumento del
    116% y no del 133% que resulta de mezclar las dos presentaciones); esta ficha no homogeneizó la
    serie completa y mantiene, para cada año, la cifra que declara su propio balance.

    Los estados financieros de UTE informan segmentos de negocio (generación, trasmisión,
    distribución, comercialización) en todo el período 2003-2025, pero declaran expresamente que no
    es posible atribuir el resultado a cada segmento por separado porque la actividad está integrada
    verticalmente: todo el ingreso por venta de energía se expone dentro de un único segmento,
    "Comercial". Por esa razón esta ficha, a diferencia de la de ANCAP, no tiene un desglose de
    resultado por línea de negocio; sí existe, en el Literal C de cada balance (el D es el de
    impuestos pagados), un desglose de costos -no de resultados- por generación, trasmisión,
    distribución y despacho.

    Según un relevamiento de pv magazine América Latina de junio de 2026, el precio de la
    electricidad industrial en Uruguay (147 USD/MWh, cuenta tipo de 400 MWh mensuales) fue menor que
    en Chile (182 USD/MWh) y mayor que en Brasil (128), Argentina (123) y Paraguay (47). En el
    segmento residencial (cuenta tipo ponderada de cuatro tarifas), Uruguay tuvo el precio más caro
    de la región (277 USD/MWh), por encima de Chile (273), Brasil (227), Argentina (149) y Paraguay
    (82).

    Sobre si la trasmisión y la distribución deben seguir siendo monopolio legal de UTE hay
    posiciones documentadas de los dos lados. A favor, un informe de la consultora Exante
    -contratado por la asociación de generadores privados Augpee- sostiene que son un monopolio
    natural, por las economías de escala de las redes, aunque aclara que esa calificación técnica no
    implica necesariamente que la propiedad deba ser estatal; el vicepresidente de UTE, Roberto
    Bentancor, defiende que la empresa siga siendo estatal por su función social, sin pronunciarse
    en la nota citada sobre la reserva legal de trasmisión y distribución en particular. En contra,
    el expresidente de ANCAP Alejandro Stipanicic -designado en 2020 por el gobierno de Lacalle Pou-
    calificó de "absurdo" el monopolio de UTE como comprador de la generación privada, a raíz de la
    no renovación de un contrato con la generadora Fenirol en 2025; y el mismo informe de Exante
    concluye que los peajes que UTE cobra a los generadores privados por el uso de sus redes
    "exceden largamente los costos efectivos de UTE".

    Cómo leer la tabla: resultado_ejercicio es el resultado neto del ejercicio, deuda_financiera es
    la deuda financiera corriente más no corriente y transferencias_al_estado es la versión de
    resultados (el adelanto a cuenta de utilidades) vertida a Rentas Generales, según criterio de
    caja; impuestos_pagados es el total de tributos abonados (IVA, IRAE, impuesto al patrimonio,
    retenciones y tasas) según el Literal D o E de cada balance, la letra cambia según el año. Cada
    cifra está en la moneda de cierre que declara su propio balance (con ajuste integral por
    inflación hasta el ejercicio 2011, sin él desde 2012; ver resumen), y se cita el balance del
    propio ejercicio salvo que la nota del año diga que proviene de una columna comparativa de otro
    balance.
