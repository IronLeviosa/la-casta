            cita: Artículo Unico Deróganse los artículos 612 y 613 de la Ley Nº 17.296, de 21 de febrero de
              2001.
            retrieved_at: 2026-09-08
          - url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
            medio: caras-y-caretas
            fecha: 2022-06-26
            tipo: nota
            titulo: El monopolio de Antel en la transmisión de datos es ley
            cita: Cuando la Corte Electoral anunció al Poder Ejecutivo que las firmas ya se habían alcanzado, el
              presidente Batlle se adelantó y presentó un proyecto para derogar los dos artículos
              cuestionados, lo que se aprobó en agosto de 2002.
            retrieved_at: 2026-09-08
      - norma: Ley 18.046 (24/10/2006), artículo 115 - crea una tasa a cargo de la Unidad Reguladora de
          Servicios de Comunicaciones y describe la telefonía fija de ANTEL como prestada "en
          condiciones de exclusividad"
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes-originales/18046-2006
            medio: impo
            fecha: 2006-10-24
            tipo: documento_oficial
            titulo: Ley N° 18.046, artículo 115 (texto original)
            cita: La Administración Nacional de Telecomunicaciones abonará dicha Tasa por todos los servicios
              que presta, incluyendo la telefonía fija y conmutada, sin distinción de la tecnología
              empleada, que presta en condiciones de exclusividad, con excepción de aquellos
              servicios de carácter social, de acuerdo a lo establecido en el artículo 24 de la Ley
              Nº 17.598, de 13 de diciembre de 2002.
            retrieved_at: 2026-09-08
      - norma: Ley 19.307 (29/12/2014), artículo 56 (redacción original) - prohíbe a los titulares de
          servicios de comunicación audiovisual (cable) prestar servicios de telefonía o transmisión
          de datos, con una salvedad para acuerdos comerciales; protegía así el negocio de
          datos/fibra de ANTEL, hasta que la Suprema Corte de Justicia lo declaró inconstitucional
          en 2016 según cobertura de prensa
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes-originales/19307-2014
            medio: impo
            fecha: 2014-12-29
            tipo: documento_oficial
            titulo: Ley N° 19.307, artículo 56 (texto original)
            cita: Artículo 56 (Incompatibilidades para la prestación de servicios de comunicación audiovisual).
              Las personas físicas o jurídicas que presten servicios de comunicación audiovisual
              regulados por la presente ley no podrán, a su vez, prestar servicios de
              telecomunicaciones de telefonía o de transmisión de datos. Esta incompatibilidad
              alcanza a las personas, físicas o jurídicas, integrantes de las personas jurídicas
              involucradas.
            retrieved_at: 2026-09-08
      - norma: El Poder Ejecutivo otorga, el 14/06/2022, licencias "Clase B" de transmisión de datos a cinco
          cableoperadores privados (TCC, Montecable, Nuevo Siglo, Korfield, Praimar)
        fuentes:
          - url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
            medio: el-observador
            fecha: 2022-06-16
            tipo: nota
            titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
            cita: El Poder Ejecutivo habilitó a cinco cableoperadores de Canelones, Colonia y Montevideo a
              prestar servicios de internet en sus áreas de cobertura. Las cinco resoluciones,
              firmadas por el presidente de la República, Luis Lacalle Pou, con fecha 14 de junio,
              le otorgan a estas empresas una Licencia de Telecomunicaciones Clase B "para brindar a
              terceros, servicios de transmisión de datos".
            retrieved_at: 2026-09-08
          - url: https://www.montevideo.com.uy/Noticias/Gobierno-habilito-a-operadores-de-cable-de-Montevideo-a-brindar-servicio-de-internet-uc824905
            medio: montevideo-portal
            fecha: 2022-06-16
            tipo: nota
            titulo: Gobierno habilitó a operadores de cable de Montevideo a brindar servicio de internet
            cita: Tres diferentes decretos firmados por el presidente de la República, Luis Lacalle Pou, y el
              ministro de Industria, Energía y Minería, Omar Paganini, autorizaron cambios en la
              legislación para que los operadores de cable privado en Montevideo puedan brindar
              servicios de internet fijo, informó el periodista Eduardo Preve y confirmó Montevideo
              Portal.
            retrieved_at: 2026-09-08
      - norma: Ley 20.075 (20/10/2022), artículo 240 - sustituye el artículo 56 de la Ley 19.307 por uno de
          sentido opuesto, que permite a los cableoperadores de televisión por abonados solicitar
          licencias de banda ancha e internet
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes-originales/20075-2022
            medio: impo
            fecha: 2022-10-20
            tipo: documento_oficial
            titulo: Ley N° 20.075, artículo 240 (texto original)
            cita: >-
              Artículo 240 Sustitúyese el artículo 56 de la Ley N° 19.307, de 29 de diciembre de
              2014, por el siguiente:

              "ARTÍCULO 56.- Los titulares de servicios de comunicación audiovisual de televisión
              para abonados que operan mediante cable tendrán derecho a solicitar licencias para
              prestar servicios de banda ancha y acceso a internet, a través del empleo de sus redes
              propias, desarrollos futuros o de recursos que contraten con terceros, en igual área
              de cobertura a la de su respectiva licencia.
            retrieved_at: 2026-09-08
      - norma: Resolución del directorio de ANTEL (2024) que habilitaba a cableoperadores a revender
          servicios de datos usando la red mayorista de fibra de ANTEL; revocada por el nuevo
          directorio en junio de 2025
        fuentes:
          - url: https://ambito.com/uruguay/el-directorio-antel-revoco-el-permiso-ofrecer-red-fibra-optica-privados-n6154677
            medio: ambito
            fecha: 2025-06-09
            tipo: nota
            titulo: El directorio de Antel revocó el permiso de ofrecer red de fibra óptica a privados
            cita: Es por eso que desde el directorio decidieron revocar una resolución del año 2024 que
              habilitaba a los cable operadores a ofrecer servicios de datos a través de la red de
              Antel. "Lo que se hizo ahora fue revocar esa resolución para analizar el
              funcionamiento de esos servicios y esos planes que fundamentalmente tienen que ver con
              servicios a mayoristas", explicó Álvarez. Sin embargo aseguró que, hasta el momento,
              no había cableoperadores haciendo uso del mecanismo.
            retrieved_at: 2026-09-08
    argumentos_a_favor:
      - texto: El presidente José Mujica dudó en abrir a la competencia el tendido de fibra óptica para
          llevar internet a los hogares porque entendía que, si se permite la competencia, el
          mercado termina concentrado en dos o tres empresas transnacionales; según El Observador,
          decidió mantener el monopolio de ANTEL sobre esa infraestructura y enviar al Parlamento un
          proyecto de ley en ese sentido.
        quien: José Mujica, presidente de la República (según cobertura de El Observador, 2012)
        fuentes:
          - url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
            medio: el-observador
            fecha: 2012-05-19
            tipo: nota
            titulo: Servicios monopólicos de ANTEL son más caros que los de la región
            cita: el presidente Mujica se había mostrado dubitativo porque entendía que si se da competencia el
              mercado "termina en dos o tres empresas transnacionales", pero de lo contrario se le
              crea "un problema jurídico al país". Finalmente decidió laudar a favor de ANTEL y
              enviará un proyecto de ley con el monopolio para la telefónica.
            retrieved_at: 2026-09-08
      - texto: ANTEL es un "monopolio natural" y en términos económicos es más barato brindar el servicio
          con una sola empresa; las empresas privadas no aportarían nada en términos de cobertura, y
          la apertura deteriora una herramienta de política que dio acceso a internet a
          "relativamente todo el pueblo uruguayo" en calidad, precio y cobertura pocas veces vistos
          a nivel mundial.
        quien: Daniel Larrosa, director representante del Frente Amplio en el directorio de ANTEL (2022)
        fuentes:
          - url: https://www.montevideo.com.uy/En-Perspectiva/Decreto-que-quita-monopolio-a-Antel-puede-ser-perjudicial-para-el-pueblo-dijo-Larrosa-uc825347
            medio: montevideo-portal
            fecha: 2022-06-17
            tipo: nota
            titulo: Decreto que quita monopolio a Antel puede ser "perjudicial" para el pueblo, dijo Larrosa
            cita: Larrosa insistió en que las empresas privadas "no aportarían nada en términos de cobertura".
              Larrosa dijo que, al tomar esta medida, "deterioran una herramienta de política
              fundamental que ha permitido el acceso a internet de relativamente todo el pueblo
              uruguayo a calidades, precios y cobertura en general pocas veces visto a nivel
              mundial".
            retrieved_at: 2026-09-08
          - url: https://www.montevideo.com.uy/En-Perspectiva/Decreto-que-quita-monopolio-a-Antel-puede-ser-perjudicial-para-el-pueblo-dijo-Larrosa-uc825347
            medio: montevideo-portal
            fecha: 2022-06-17
            tipo: nota
            titulo: Decreto que quita monopolio a Antel puede ser "perjudicial" para el pueblo, dijo Larrosa (2)
            cita: Larrosa explicó que Antel es un "monopolio natural" y que en términos económicos "es más
              barato brindarlo con una sola empresa".
            retrieved_at: 2026-09-08
      - texto: El monopolio de ANTEL tiene sustento histórico, marco legal y el respaldo de la ciudadanía
          expresado en una consulta (en referencia al referéndum de 1992 contra la privatización de
          empresas públicas).
        quien: Alberto Grille, director de Caras y Caretas (columna de opinión, 2022)
        fuentes:
          - url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
            medio: caras-y-caretas
            fecha: 2022-06-26
            tipo: nota
            titulo: El monopolio de Antel en la transmisión de datos es ley
            cita: El monopolio de Antel tiene un sustento histórico, un marco legal y el respaldo de la
              ciudadanía en una consulta histórica.
            retrieved_at: 2026-09-08
    argumentos_en_contra:
      - texto: Los monopolios establecidos por ley son excepción en el mundo y se dan solo cuando es
          imprescindible; son escasos incluso en telefonía fija tradicional en América Latina. ANTEL
          no puede ser responsabilizada de la situación porque procede como cualquier otra empresa,
          pero conviene observar cómo el monopolio por ley afecta a los ciudadanos.
        quien: Omar de León, experto en comunicaciones (según cobertura de El Observador, 2012)
        fuentes:
          - url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
            medio: el-observador
            fecha: 2012-05-19
            tipo: nota
            titulo: Servicios monopólicos de ANTEL son más caros que los de la región
            cita: '"Los monopolios establecidos por ley son excepción en el mundo y se dan solo cuando es
              imprescindible. Los monopolios, aun en telefonía fija tradicional, son muy escasos
              incluso en América Latina. Si bien ANTEL no puede ser responsabilizada de la situación
              ya que procede como cualquier otra empresa, y es como debe ser, es conveniente
              observar cómo afecta a los ciudadanos uruguayos el establecimiento de un monopolio por
              ley", dijo a El Observador el experto en comunicaciones Omar de León.'
            retrieved_at: 2026-09-08
      - texto: El monopolio de ANTEL sobre la fibra óptica implementa "prácticas abusivas" en el servicio de
          internet fija al hogar.
        quien: Claro (según nota de El Observador del 8 de mayo de 2020, resumida por En Perspectiva)
        fuentes:
          - url: https://enperspectiva.uy/en-perspectiva-programa/titulares/noticias-del-viernes-8-mayo-2020/
            medio: en-perspectiva
            fecha: 2020-05-08
            tipo: nota
            titulo: Noticias del viernes 8 de mayo de 2020
            cita: Claro, en tanto, hizo foco en el actual monopolio de Antel a la que acusó de implementar
              "prácticas abusivas" en el servicio de internet fija al hogar.
            retrieved_at: 2026-09-08
      - texto: Movistar, junto con Claro, calificó como contraria a la "sana competencia" la decisión de
          excluir a las telefónicas móviles del negocio de internet a los hogares, reservado a las
          empresas con licencia de televisión por cable. Movistar agregó que limitar el acceso a la
          infraestructura de fibra óptica dificultaría el despliegue de tecnologías como el 5G, y
          que dejar operadores afuera del proyecto haría perder la oportunidad de impulsar uno de
          los sectores más dinamizadores de la economía.
        quien: Movistar (según nota de El Observador del 8 de mayo de 2020, resumida por En Perspectiva; la
          nota original de El Observador no se pudo ubicar y abrir en esta sesión)
        fuentes:
          - url: https://enperspectiva.uy/en-perspectiva-programa/titulares/noticias-del-viernes-8-mayo-2020/
            medio: en-perspectiva
            fecha: 2020-05-08
            tipo: nota
            titulo: Noticias del viernes 8 de mayo de 2020
            cita: Las dos empresas de telefonía móvil opinaron, en nota con El Observador, que no abrir el
              mercado a todos los operadores va en contra de la “sana competencia”. Afirmaron que es
              “fundamental” que todos los actores de la industria de las telecomunicaciones puedan
              brindar una mayor cantidad de servicios ya que eso redundará en “más beneficios para
              los consumidores”. Movistar expresó en su respuesta por escrito que “limitar el acceso
              a esa infraestructura (fibra óptica) -o solo permitírsela a algunas empresas-
              dificultará la posibilidad de que en nuestro país contemos en los próximos años con
              nuevas tecnologías -como la 5G- que otros países ya han comenzado a desplegar”. Para
              Movistar, en caso de que el proyecto se apruebe tal como fue presentado y deje afuera
              algunos operadores, se perdería la “oportunidad de impulsar el desarrollo de uno de
              los sectores más dinamizadores de la economía”
            retrieved_at: 2026-09-08
      - texto: El artículo 56 de la ley de medios establecía un monopolio de hecho a favor de ANTEL sin
          cumplir con las previsiones constitucionales, limitando la competencia en un mercado que
          debería ser libre, sin ningún beneficio para el interés general.
        quien: Cristina Olaso, abogada de tres de las empresas cableoperadoras beneficiadas (según El
          Observador, 2022)
        fuentes:
          - url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
            medio: el-observador
            fecha: 2022-06-16
            tipo: nota
            titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
            cita: '"Basados en que se estaría estableciendo un monopolio de hecho a favor de Antel. Sin cumplir
              con las previsiones legales que establece la Constitución, se estaría limitando la
              competencia de un mercado en libre competencia y en definitiva no habría ningún
              beneficio para el interés general el limitar que el proveedor de acceso Internet fuera
              uno solo", explicó a El Observador Cristina Olaso, abogada de tres de las empresas
              beneficiadas.'
            retrieved_at: 2026-09-08
