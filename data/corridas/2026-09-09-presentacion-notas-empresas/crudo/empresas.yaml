  monopolio:
    tiene: true
    alcance: 'La Ley 4.273 (21/10/1912) creó UTE con el monopolio estatal del suministro eléctrico
      -generación, trasmisión, distribución y comercialización- en todo el territorio nacional. El
      Decreto-Ley 14.694 (1/9/1977, Ley Nacional de Electricidad) y sus modificaciones de 1980 (Ley
      15.031) y 1991 (Ley 16.211) hicieron que UTE dejara de cumplir sus funciones específicas en
      régimen de monopolio exclusivo y ampliaron su giro a servicios de asesoramiento y asistencia
      técnica dentro y fuera del país, según lo describe la propia empresa en sus estados
      financieros. La Ley 16.462 (11/1/1994, artículo 265) habilitó a UTE a operar fuera de
      fronteras. La Ley 16.832 (Marco Regulatorio Eléctrico, 17/6/1997) sustituyó el artículo 2° del
      Decreto-Ley 14.694 y creó un mercado mayorista de energía eléctrica con "régimen de libre
      acceso y de competencia" para la generación, aplicable también a UTE "por ser también
      generador y distribuidor de energía eléctrica" (artículo 11): desde entonces generadores
      privados compiten con UTE en la producción de energía. La trasmisión y la distribución
      siguieron calificadas como servicio público a cargo de UTE -la "zona de servicio de
      distribución" es el área geográfica en que UTE "actúa como distribuidor" (artículo 19)-, y la
      ley exige a las empresas que realizan más de una actividad de la industria eléctrica presentar
      resultados económicos de gestión separados por generación, trasmisión y distribución (artículo
      15). El Decreto 276/002 (28/6/2002), que aprobó el Reglamento General del Marco Regulatorio
      del Sistema Eléctrico, prevé que la trasmisión y la distribución, en tanto servicio público,
      puedan ser cumplidas por UTE o, si media resolución expresa del Poder Ejecutivo y previa
      opinión de UTE, en régimen de concesión a otra empresa eléctrica.'
    normas:
      - norma: Ley 4.273 (21/10/1912), creación de UTE y del monopolio estatal del suministro eléctrico
        fuentes:
