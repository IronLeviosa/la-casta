      - norma: Ley 16.832 (17/6/1997), Marco Regulatorio Eléctrico, artículo 11 - crea el mercado mayorista
          de energía eléctrica y la libre competencia en generación, aplicable a UTE
        fuentes:
          - url: https://www.impo.com.uy/bases/leyes/16832-1997
            medio: impo
            fecha: 1997-06-17
            tipo: documento_oficial
            titulo: Ley N° 16832, artículo 11
            cita: Créase un mercado mayorista de energía eléctrica que funcionará en las etapas de generación y
              de consumo, con uso compartido del sistema de trasmisión y régimen de libre acceso y
              de competencia para el suministro a los distribuidores y grandes consumidores. Serán
              agentes del mercado mayorista de energía eléctrica los generadores, trasmisores,
              distribuidores y grandes consumidores. La reglamentación establecerá los requisitos de
              potencia, energía y demás parámetros técnicos que debe cumplir un cliente final para
              ser considerado gran consumidor. Los generadores podrán celebrar contratos de
              suministro directamente con distribuidores y grandes consumidores. Dichos contratos
              serán libremente negociados entre las partes. Estas disposiciones son de aplicación
              para la Administración Nacional de Usinas y Trasmisiones Eléctricas, por ser también
              generador y distribuidor de energía eléctrica.
