  que_hace: UTE genera, trasmite, distribuye y comercializa energía eléctrica en todo el territorio
    uruguayo, y presta servicios de asesoramiento y asistencia técnica en su área de especialidad,
    dentro y fuera del país. Desde la reforma de 1997, compite con generadores privados en la
    producción de energía, mientras mantiene en forma exclusiva la trasmisión y la distribución.
    Opera un parque generador propio hidrotérmico y eólico, dispone de potencia instalada en la
    Central de Salto Grande y de capacidad de interconexión con Brasil en las estaciones
    convertidoras de frecuencia de Rivera y Melo.
