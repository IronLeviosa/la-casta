  resumen: >-
    ANCAP es un ente autónomo del Estado, creado en 1931, que tiene reservadas por ley la
    importación y refinación de petróleo crudo, la fabricación, importación y venta de alcohol
    carburante nacional, y la importación y exportación de combustibles líquidos, semilíquidos y
    gaseosos cuando la refinería estatal cubre al menos el 50% del consumo nacional de nafta. Vende
    combustibles, cemento pórtland y agrocombustibles, y desde 2022 produce hidrógeno verde y
    derivados en régimen de libre competencia, fuera del monopolio.

    Esta ficha reúne el resultado del ejercicio desde 2000, con dos huecos: no se encontró un
    balance de 2001 archivado en ningún sitio consultado (se publicó, pero el PDF nunca quedó
    capturado por Wayback Machine), y para 2004 no hay balance propio, solo la cifra comparativa que
    trae el balance de 2005, con una base mixta (pesos reexpresados a poder adquisitivo de fines de
    2005, convertidos al dólar de cierre de 2004). No se encontraron balances públicos anteriores a
    2000. Con esos huecos: en el gobierno de Jorge Batlle (2000-2004), los tres años con dato propio
    fueron positivos —2000 (USD 30,4 millones), 2002 (USD 13,6 millones) y 2003 (USD 19,8
    millones)—, en el tramo que incluye la crisis económica de 2002. En el primer gobierno de Tabaré
    Vázquez (2005-2009) el resultado fue positivo en 2005, 2007 y 2009, y negativo en 2006 y 2008.
    En el gobierno de José Mujica (2010-2014) fue positivo solo en 2010 y negativo los otros cuatro
    años, con una pérdida creciente hasta USD 168,1 millones en 2013 según el balance propio de ese
    año; el balance de 2014, el primero preparado bajo Normas Internacionales de Información
    Financiera (NIIF), reexpone ese mismo resultado de 2013 con una diferencia de $ 209,6 millones
    de pesos por el cambio de base contable (no por inflación, que ya no se ajustaba desde 2011); el
    resultado propio de 2014 fue una pérdida de USD 323,2 millones, la mayor de toda la serie. En el
    segundo gobierno de Vázquez (2015-2019) hubo pérdida solo en 2015 (USD 198,5 millones) y
    ganancia los cuatro años siguientes. En el gobierno de Lacalle Pou (2020-2024) el resultado fue
    positivo cuatro años y negativo en 2024 (USD 118,4 millones), por la parada de la Refinería de
    La Teja para mantenimiento. El resultado de 2020, publicado originalmente como una pérdida de
    USD 12,1 millones, fue reformulado por ANCAP en sus propios estados financieros de 2021
    (aplicando la Norma Internacional de Contabilidad N.° 8) a una ganancia de USD 9,1 millones, al
    corregirse un error en el cálculo del impuesto a la renta de los ejercicios 2018 a 2020; el
    resultado antes de impuesto a la renta de 2020 fue negativo en las dos versiones.

    ANCAP paga y recauda impuestos por un monto muy superior a lo que transfiere directamente a
    Rentas Generales. Los balances informan esta cifra desde el ejercicio 2002 (el formato de la
    nota se introdujo con la Ordenanza N.° 81 del Tribunal de Cuentas; no hay dato para 2000 ni
    2001). El total de impuestos pagados y retenidos —que incluye el Impuesto al Patrimonio y el
    impuesto a la renta propio de Ancap (IRIC hasta 2006, IRAE desde 2007), además de IMESI, IVA y
    otras retenciones de terceros— pasó de USD 170,1 millones en 2002 a USD 867,8 millones en 2024,
    con un máximo de USD 1.021,0 millones en 2022. Los balances de 2011 y 2012 informan cifras
    distintas para el mismo ejercicio 2011 ($ 14.849,9 millones según el balance propio, $ 10.979,9
    millones según la cifra comparativa que trae el balance de 2012, un 26% menos); esta ficha usa
    siempre la cifra del balance del propio ejercicio.

    Las transferencias directas a Rentas Generales (versión de resultados acumulados) existieron en
    2002 (USD 5,7 millones) y 2003 (USD 5,1 millones), y luego fueron cero durante dieciséis años
    seguidos, de 2004 a 2019 inclusive: los propios estados financieros de esos años dicen
    explícitamente que no hubo transferencias de este tipo, así que el cero es un cambio de práctica
    y no una constante de la empresa. La serie se reanudó en 2020 (USD 23,6 millones) y volvió a
    aparecer en 2023 (USD 11,8 millones) y 2024 (USD 24,8 millones); 2000 y 2001 no tienen un dato
    de transferencias en esta ficha, porque la nota que las informa recién se incorpora desde el
    ejercicio 2002.

    La deuda financiera de ANCAP saltó de USD 271,6 millones en 2011 a USD 985,2 millones en 2012 y
    USD 1.141,2 millones en 2013. El origen está documentado en los propios balances: el 26 de
    diciembre de 2012 el Directorio de Ancap aceptó comprar, con descuento sobre el valor nominal,
    la deuda que la empresa mantenía con PDVSA Petróleo S.A. (nominal USD 828,4 millones, adquirida
    en USD 517,3 millones), y el 2 de enero de 2013 el Estado, a través del Ministerio de Economía y
    Finanzas (MEF), le prestó a Ancap esos mismos USD 517,3 millones para pagar esa operación; al
    cierre de 2013 Ancap tenía con el MEF una deuda de $ 11.021,9 millones, cerca del 45% de su
    deuda financiera total de ese año. Esa es la misma deuda que el Estado condonó en 2016 (ver el
    párrafo siguiente): el préstamo de 2013 es el origen de la capitalización de 2016.

    En 2016, el Estado, a través del Ministerio de Economía y Finanzas, canceló la deuda de ANCAP y
    su subsidiaria DUCSA con el MEF por UI 5.840.159.519 ($ 18.856,7 millones), capitalizada como
    aporte de capital; la operación fue autorizada por la Ley 19.368 y el contrato se firmó el 2 de
    febrero de 2016. Esa cancelación explica la mayor parte de la baja de la deuda financiera de
    ANCAP entre 2015 ($ 37.135,7 millones) y 2016 ($ 14.058,5 millones). La cobertura de prensa de
    la época cifró el aporte del Ministerio de Economía y Finanzas en USD 622 millones, además de un
    préstamo de USD 250 millones del Banco de Desarrollo de América Latina (CAF) que integró el
    mismo paquete.

    ANCAP tiene un monopolio legal sobre la importación y refinación de petróleo crudo desde 1931;
    un intento de terminarlo y asociar a ANCAP con un socio privado (Ley 17.448, 2002) fue derogado
    por un referéndum en 2003. Leyes y decretos posteriores establecieron que el monopolio no rige
    para la venta de combustible a buques en los puertos administrados por la Administración
    Nacional de Puertos (desde 2020) ni, desde fines de 2020, para el abastecimiento de aeronaves
    comerciales con destino al exterior (excepción ampliada por decreto en 2023 a aeronaves de
    cualquier bandera). Sobre si ese monopolio debe mantenerse hay posiciones documentadas de los
    dos lados: a favor, entre otros, la propia ANCAP (que sostiene que refinar crea valor cuando es
    más barato que importar), la Federación Ancap y el entonces candidato presidencial Daniel
    Martínez; en contra, entre otros, el entonces presidente Lacalle Pou (que impulsó la libre
    importación de combustibles) y el gobierno de Jorge Batlle en 2001-2002.

    ANCAP desagrega el resultado por división en casi todos los balances desde 2002 (no en 2000,
    2001 ni 2004): hasta 2002 en tres divisiones —Energía, Alcoholes y Portland—, desde 2003, cuando
    Ancap trasladó las actividades de Alcoholes a la esfera privada, en dos —Energía y Portland—, y
    desde la presentación del balance de 2016 en cuatro líneas de negocio en dólares —Combustibles,
    Lubricantes, Gas Natural y Portland—; son dos desgloses distintos (divisiones contables en pesos
    hasta 2014, líneas de negocio en dólares desde 2016), y cada año lo señala en su `nota`. Con los
    datos disponibles (21 de los 25 años que cubre esta ficha), el segmento Portland tuvo resultado
    operativo negativo todos y cada uno de esos 21 años, incluidos años de ganancia para el conjunto
    de la empresa; en 2016 y en 2022 esa pérdida incluyó además deterioros contables de $ 3.621
    millones y USD 1,4 millones, respectivamente. El segmento Energía (2002-2014) y luego
    Combustibles (2016-2024) sostuvo el resultado positivo del conjunto la mayoría de los años, con
    la excepción de 2008, 2011, 2013 y 2014 para Energía y de 2024 para Combustibles, este último
    coincidiendo con la parada de la Refinería de La Teja. Lubricantes y Gas Natural, los segmentos
    más chicos desde 2016, no superaron juntos el 6% del resultado operativo total de ANCAP en
    ningún año del período.

    En los años con precio de venta y precio de paridad de importación (PPI) comparables mes a mes
    —2015 a mayo de 2019, para nafta Súper 95 y gasoil—, el precio de venta estuvo por encima del
    PPI los cinco años, en los dos combustibles. La brecha del gasoil se redujo de forma marcada
    entre 2017 y 2018 (de $ 12,11 a $ 4,91 por litro); en diciembre de 2017 URSEA cambió la
    metodología de cálculo del PPI para incluir el margen de comercialización, que hasta entonces no
    formaba parte del cálculo, así que parte de esa reducción responde al cambio de metodología y no
    solo a un cambio de precios. La serie oficial con la que cuenta esta ficha no continúa más allá
    de mayo de 2019, dentro del segundo gobierno de Vázquez, ni retrocede antes de 2015; no se
    encontró en esta corrida un documento oficial que la extienda, en la misma unidad, a los demás
    gobiernos del período.

    El cálculo del PPI está discutido, incluida la propia ANCAP, que sostiene que subestima costos;
    desde agosto de 2021 el gobierno le sumó el "factor X" ($ 2,97 por litro en gasolinas y gasoil),
    un ajuste para reconocer sobrecostos de la empresa. Según cálculos del CED (no una fuente
    oficial), el sobreprecio combinado de nafta y gasoil promedió USD 288 millones anuales durante
    la década 2010-2019 y bajó a USD 40,5 millones anuales entre 2020 y 2021, ya con el mecanismo de
    la LUC vigente; para 2024, ANCAP declaró que el precio de venta estuvo por debajo del PPI en USD
    55 millones para los combustibles fósiles, más USD 24 millones de subsidio focalizado de
    supergás.

    Cómo leer la tabla: salvo que la nota del año diga lo contrario, cada monto se convierte a
    dólares al tipo de cambio de cierre que declara el balance del propio ejercicio;
    resultado_ejercicio es el resultado neto del ejercicio, deuda_financiera es el total de deudas
    financieras (pasivo corriente más no corriente), impuestos_pagados es el total pagado y retenido
    por Ancap (Impuesto al Patrimonio, impuesto a la renta propio —IRIC hasta 2006, IRAE desde 2007—
    e IMESI, IVA y otras retenciones de terceros; desde 2015 la nota agrega también el Impuesto para
    el Tribunal de Cuentas y el FUDAEE), sin la versión a Rentas Generales, y
    transferencias_al_estado es esa versión a Rentas Generales, sin impuestos. Los balances de 2000
    y 2001 no traen las notas de impuestos pagados, transferencias ni desagregación por división,
    que se incorporan recién desde el balance de 2002 (Ordenanza N.° 81 del Tribunal de Cuentas); en
    2002 y 2003 el balance tampoco trae una fila «Resultado» explícita por división, así que el
    resultado de cada segmento se calculó restando el Total de Costos del Total de Ingresos de la
    Nota 22. La reexpresión por inflación de los balances de Ancap se aplicó por IPPN hasta 2008 y
    por IPC hasta 2011, y no rige desde 2012. Desde 2020, en la desagregación entre Lubricantes y
    Gas Natural el documento no rotula cada valor junto a la barra del gráfico: se resolvió contra
    el total operativo declarado y el orden de las tablas literales de 2016 a 2019, donde
    Lubricantes siempre superó a Gas Natural.
