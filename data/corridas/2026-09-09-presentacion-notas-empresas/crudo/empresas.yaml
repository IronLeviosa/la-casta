    notas_internas: "Editor, 2026-09-08 (corrida 2026-09-08-empresas-ancap-serie-historica): resueltos
      los dos bloqueantes de critica.md (concepto de impuestos_pagados corregido también en los diez
      años ya publicados, 2015-2024, que tenían el mismo error que los años nuevos;
      cobertura_del_periodo de notas.md ya trae 2000, 2002 y 2003 cargados y 2001 documentado como
      publicado-pero-no-archivado) y los once 'corregir' (segmentos por división 2002-2014,
      cotizaciones con encabezado, transferencias con concepto, base mixta de 2004, impuestos de
      2011 sin causa inventada, nota de reexpresión de 2013, reexpresión NIIF 2013/2014, préstamo
      del MEF, balance 2014 cargado). Agregué a `hitos[]` los seis candidatos de `para_el_editor`
      con fuente propia verificada en esta sesión (Alcoholes del Uruguay S.A. 1999, capitalización
      de ANCAP a DUCSA 2008, venta de Petrolera del Conosur 2011, compra con descuento de la deuda
      con PDVSA 2012, préstamo del MEF 2013, adopción de NIIF 2014); no agregué AMBD S.A. (bebidas,
      1999) por no estar en la lista pedida y no ser central a la historia del monopolio. Sobre
      ALUR: la sociedad de 1999 queda documentada con la salvedad explícita de que no se verificó si
      es la misma que la ALUR actual. Sobre DUCSA: solo verifiqué un aporte de capital en efectivo
      de $ 652,6 millones en el flujo de fondos de 2008; no encontré en esta sesión el texto con las
      fechas de resolución de directorio (17/5/2007) y de asamblea de Ducsa (28/3/2008) que traía
      notas.md, así que el hito queda fechado en el año 2008 y no en esas fechas puntuales.
      Reescribí el `resumen` para 2000-2024 con el mismo detalle por gobierno (Batlle, Vázquez I,
      Mujica, Vázquez II, Lacalle Pou) y recorté las `nota` de 2002, 2003, 2011, 2012 y 2013 para no
      repetir en cada año lo que ahora está una sola vez en el resumen. Pendientes menores, no
      bloqueantes, heredados de una revisión anterior de esta misma ficha: (1) el decreto de julio
      de 2023 que amplió la excepción aeroportuaria no se identificó por número (hay dos candidatos
      en IMPO, 134/023 y 267/023, sin confirmar); (2) comparaciones[9] (gasoil
      Uruguay-Argentina-Brasil, CEPP) no tiene un precio absoluto para Uruguay fuera de la zona de
      frontera, solo el diferencial fronterizo; (3) `tipo: ente_autonomo` se mantiene por ser la
      autodefinición de ANCAP en sus propios estados financieros (fuente ya citada en el registro),
      aunque el `describe()` de `TipoEmpresa` en el esquema pone a ANCAP como ejemplo de
      `empresa_publica`; (4) no se agregó 'Resultado Monopólico' como segmento de 2021-2023 porque
      la extracción de texto de esos PDF mezcla dos láminas distintas del documento sin preservar a
      qué gráfico pertenece cada número, y no se quiso publicar una cifra que no se podía verificar
      con confianza; (5) la serie de precio-vs-PPI de URSEA sigue terminando en mayo de 2019 y no
      llega a 2000-2014: el dataset que prometía la serie histórica 2002-2020 (ursea-ppi_vs_pe_v2)
      en realidad contiene otro desglose desde octubre de 2020; es un límite real de la fuente
      pública, no una búsqueda incompleta, y queda dicho en el resumen. Mantengo el tier en
      publicado: todas las objeciones bloqueantes de esta corrida quedaron resueltas con documento
      oficial, y bajar a probable por los pendientes menores (4) y (5), que ya eran pendientes de la
      ficha ya publicada, ocultaría del índice todo el contenido ya verificado."
