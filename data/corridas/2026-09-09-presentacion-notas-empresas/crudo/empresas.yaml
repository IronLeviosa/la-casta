  revision:
    tier: publicado
    notas_internas: >-
      Corrida 2026-09-08-empresas-ute-serie-historica: extiende finanzas[] a 2003-2014 y resuelve la
      crítica de esa corrida (9 bloquea, 17 corregir, 7 aviso; detalle en
      data/corridas/2026-09-08-empresas-ute-serie-historica/razones.md). Las nueve objeciones
      `bloquea` quedan resueltas: el doble conteo 2007/2008 se documenta de forma cruzada en la nota
      de ambos años y en el resumen (se mantienen las dos cifras, no se resta una de la otra);
      transferencias_al_estado de 2008 usa el criterio de caja ($124.595.000, Nota 4.2) con el dato
      del Literal E ($24.595.000) documentado aparte; capitalizaciones_del_estado se cargó en los
      siete años donde el balance la declara (2007-2009, 2011-2014); 2010 excluye el aporte al Fondo
      de Estabilización Energética de transferencias_al_estado y 2012 incorpora el cobro del mismo
      fondo, con el mismo criterio que ya usa la ficha para 2020; la tabla de cobertura de notas.md
      ya no dice "sin documento" sino que documenta la búsqueda (Presidencia, Tribunal de Cuentas,
      MEF, OPP, Biblioteca del Parlamento, AIN) y lo que sí existe sin poder cargarse (Memoria UTE
      1996, con ruido de OCR; Memoria del Poder Ejecutivo 1999-2000, con una definición de
      endeudamiento no comparable); la nota metodológica corrige que el ajuste por inflación se
      corta en 2012, no en 2011.

      Quedan documentados y sin resolver, con el mismo criterio que la ficha ya aplicaba a
      2015-2025: (1) la deuda financiera no se homogeneizó en los tres cambios de convención
      (2004-2007 y 2009-2012 neta de intereses a vencer, 2008 bruta, 2013-2014 NIIF) porque revisar
      los once balances para reconstruir una base común excede esta corrida; cada año mantiene la
      cifra de su propio balance, con la brecha declarada en la nota de 2008 y en el resumen; (2) no
      hay capitalizaciones_del_estado registradas para 2003, 2004, 2005, 2006 y 2010: no se localizó
      la nota de "Capitalizaciones del ejercicio" en esos balances, lo que puede ser ausencia real o
      falta de esa nota en el documento, y se dice así en el resumen, no como un cero; (3) el PDF
      publicado de 2005 y 2006 no incluye un informe de auditoría independiente (verificado por
      búsqueda de texto), a diferencia de 2004, 2007, 2008 y 2014, que sí lo traen firmado o con
      dictamen; (4) no se re-auditaron uno por uno los 44 `concepto` de la serie 2003-2014 contra la
      regla de una oración: se corrigieron los que la crítica señaló (2010) y los que aparecieron al
      revisar 2003 y 2008, pero puede haber alguno más largo de lo ideal; (5) se agregó una única
      fuente nueva fuera de UTE (IMPO, Ley 18.719 art. 773, para fechar la creación del Fondo de
      Estabilización Energética); el resto de la serie 2003-2014 depende enteramente de estados
      contables que publica la propia UTE, igual que ya ocurre con 2015-2025 (L8 de la crítica, sin
      objeción porque la regla de dos grupos es para `reportado`, no para documento oficial).

      Se corrigió además, dentro del alcance que permite este lote por ser copia completa de la
      ficha, la cita truncada de impuestos_pagados de 2015 (empezaba en "Tasa Tribunal de Cuentas"
      en vez del encabezado con IVA) y "Literal D" por "Literal C" como fuente del desglose de
      costos por actividad en el resumen; ambos cambios tocan contenido ya publicado y van en la
      corrección pública que acompaña esta corrida (ver razones.md), no como edición silenciosa.

      Pendientes heredados de la corrida 2026-09-07-empresas-ute (2015-2025), sin cambios en esta
      corrida: la asimetría de fuentes del monopolio (tres de cuatro argumentos vienen del eje
      Augpee/Exante), la falta del comparativo regional propio de UTE en `comparaciones`, la mezcla
      de notas individual/consolidado en la deuda de 2015-2016, la ausencia de impuestos_pagados de
      2018 y de cualquier dato de 2017 (balances sin capa de texto), y la ausencia de `imagenes[]`
      por no haber encontrado, hasta ahora, una fuente con licencia libre verificable.
