  monopolio:
    tiene: true
    alcance: >-
      En telefonía fija ANTEL opera en exclusividad: ningún otro operador tiene licencia para
      prestarla. El texto legal vigente que describe esa exclusividad es el artículo 115 de la Ley
      18.046 (2006), dictado en un contexto tributario (crea una tasa que ANTEL abona), que dice que
      la Administración "abonará dicha Tasa por todos los servicios que presta, incluyendo la
      telefonía fija y conmutada, sin distinción de la tecnología empleada, que presta en
      condiciones de exclusividad". El artículo no otorga el monopolio: lo describe, de paso, como
      un hecho ya existente al legislar sobre otra cosa.

      El origen legal de esa exclusividad tuvo un recorrido accidentado. El artículo 3 original de
      la Ley 14.235 (1974) fijaba el monopolio de ANTEL en telecomunicaciones; fue derogado por la
      Ley 16.211 de 1991, que abrió la telefonía celular a la competencia. La Ley 17.296 de 2001
      (artículo 613) sustituyó los artículos 3 a 10 y 12 de la Ley 14.235 y dispuso que "la
      prestación del servicio público de telefonía básica será realizada, en exclusividad, por la
      Administración Nacional de Telecomunicaciones (ANTEL)", entendida como la telefonía "fija,
      conmutada y referida al tráfico nacional". Un año después, la Ley 17.524 (2002) derogó los
      artículos 612 y 613 de esa misma Ley 17.296, luego de que la Corte Electoral confirmara que
      una recolección de firmas para un referéndum contra la apertura de la telefonía internacional
      había alcanzado el mínimo requerido; el gobierno de Jorge Batlle presentó el proyecto de
      derogación antes de que el referéndum se concretara. Desde entonces no se relevó, para esta
      ficha, un artículo vigente que declare expresamente el monopolio de la telefonía fija: lo
      único vigente que se encontró es la descripción de 2006 citada arriba.

      En transmisión de datos por fibra óptica al hogar el resguardo fue más tardío y más claramente
      normativo, pero ya no está vigente. El artículo 56 de la Ley 19.307 (Ley de Medios, 2014)
      prohibía a los titulares de servicios de comunicación audiovisual por cable prestar, a la vez,
      servicios de telefonía o transmisión de datos —con una salvedad para "los acuerdos de
      comercialización que se puedan celebrar, ofrecidos en igualdad de condiciones a todos los
      interesados"—, lo que en los hechos impedía a los cableoperadores competir con la fibra de
      ANTEL. Los cableoperadores impugnaron ese artículo como inconstitucional; la Suprema Corte de
      Justicia falló primero a favor de su constitucionalidad y luego, en un cambio que un medio
      calificó de "sorprendente", declaró su inconstitucionalidad en 2016 (según cobertura de
      prensa; no se accedió al texto del fallo). El 14 de junio de 2022 el Poder Ejecutivo, con la
      firma de Luis Lacalle Pou y el ministro de Industria Omar Paganini, otorgó cinco licencias
      "Clase B" a cableoperadores privados (TCC, Montecable, Nuevo Siglo en Montevideo; Korfield en
      Colonia; Praimar en Pando) para prestar transmisión de datos. El 20 de octubre de 2022 la Ley
      20.075 (artículo 240) sustituyó el artículo 56 de la Ley 19.307 por uno de sentido opuesto:
      hoy dice que "los titulares de servicios de comunicación audiovisual de televisión para
      abonados que operan mediante cable tendrán derecho a solicitar licencias para prestar
      servicios de banda ancha y acceso a internet", con redes propias o contratando terceros. La
      fibra al hogar, por lo tanto, ya no está reservada por ley a ANTEL.

      En 2024 el directorio de ANTEL (bajo la gestión anterior) adoptó además una resolución que
      habilitaba a cableoperadores a revender servicios de datos usando la red mayorista de fibra de
      ANTEL; en junio de 2025, con el nuevo directorio designado por el gobierno de Yamandú Orsi,
      ese cuerpo la revocó "para analizar el funcionamiento de esos servicios", aclarando que a esa
      fecha ningún cableoperador la había usado. En telefonía móvil y en la mayoría de los servicios
      de datos, ANTEL compite con Movistar y Claro desde hace más de una década.
