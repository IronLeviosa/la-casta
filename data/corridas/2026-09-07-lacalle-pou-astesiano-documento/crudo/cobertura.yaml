- medio: la-diaria
  url: https://ladiaria.com.uy/justicia/articulo/2022/9/ministerio-del-interior-plantea-que-sorpresivamente-en-la-ficha-de-astesiano-consta-un-antecedente-penal-de-2013/
  titulo: Ministerio del Interior plantea que "sorpresivamente" en la ficha de Astesiano consta un
    antecedente penal de 2013
  fecha: 2022-09-28
  evento: caso-astesiano
  politico: lacalle-pou
  tono: neutral
  _slug: sorpresivamente-antecedente-penal-2013
  justificacion: >-
    Solo se pudo leer la bajada y el arranque (el resto está tras registro), y lo legible atribuye
    todo al Ministerio sin calificar al presidente: Luis Alberto Heber dispuso una investigación de
    urgencia para establecer "quién o quiénes alteraron la información"; en la ficha no figura como
    antecedente penal que fue procesado sin prisión en 2002.

