# Cobertura de prensa del caso Astesiano (antecedentes penales), revisada por el editor sobre el
# borrador que dejó el crítico en data/corridas/2026-09-07-lacalle-pou-astesiano-documento/critica.md
# (sección ## Cobertura). Las nueve citas se releyeron con `pnpm fuente` en esta sesión y coinciden
# carácter por carácter con lo publicado; se sostienen las nueve clasificaciones de tono tal como las
# dejó el crítico, con el mismo umbral para los nueve medios.

- medio: subrayado
  url: https://www.subrayado.com.uy/estoy-tan-sorprendido-como-ustedes-dijo-lacalle-pou-detencion-su-jefe-seguridad-n879914
  titulo: '"Estoy tan sorprendido como ustedes", dijo Lacalle Pou sobre detención de su jefe de
    seguridad'
  fecha: 2022-09-26
  evento: caso-astesiano
  politico: lacalle-pou
  tono: neutral
  _slug: sorprendido-como-ustedes-detencion-custodia
  justificacion: >-
    La nota es casi íntegramente reproducción de lo que dijo el presidente, sin adjetivación propia:
    Además, explicó que Astesiano "no tiene antecedentes penales" y que "todo el mundo es inocente
    hasta que se demuestre lo contrario".

