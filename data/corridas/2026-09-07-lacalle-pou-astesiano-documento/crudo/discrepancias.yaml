        tipo: diario_de_sesiones
        titulo: >-
          32.ª Sesión Extraordinaria del Senado del 12 de octubre de 2022 — intervención del
          subsecretario del Interior, doctor Maciel
        cita: >-
          Astesiano ya había cumplido la privación de libertad durante el procesamiento, pero esa
          privación de libertad no es pena, es medida cautelar.
        archived_url: https://web.archive.org/web/20260907142347/https://infolegislativa.parlamento.gub.uy/temporales/20221012s0032ea321c7f-3f23-4f7c-a4ab-fc5df420cd88.html
        retrieved_at: 2026-09-07
      - url: https://infolegislativa.parlamento.gub.uy/temporales/20221012s0032ea321c7f-3f23-4f7c-a4ab-fc5df420cd88.html
        medio: parlamento
        fecha: 2022-10-12
        tipo: diario_de_sesiones
        titulo: >-
          32.ª Sesión Extraordinaria del Senado del 12 de octubre de 2022 — intervención del senador
          Alejandro Sánchez
        cita: >-
          En setiembre de 2014 fue condenado por estafa –setiembre de 2014– a dieciocho meses, pero
          no los cumplió en prisión porque ya había tenido la preventiva en 2013.
        archived_url: https://web.archive.org/web/20260907142347/https://infolegislativa.parlamento.gub.uy/temporales/20221012s0032ea321c7f-3f23-4f7c-a4ab-fc5df420cd88.html
        retrieved_at: 2026-09-07
  analisis: >-
    Lo publicado sitúa la condena en 2013 y la describe como cumplida ese año ("la condena que
    cumplió en 2013 en la cárcel de Las Rosas"). La versión taquigráfica de la sesión del Senado del
    12 de octubre de 2022 registra otra secuencia, y la registran de forma concordante las dos partes
    del debate: el subsecretario del Interior dice que el procesamiento fue el 17 de marzo de 2013 y
    la condena el 5 de setiembre de 2014, y que la privación de libertad de 2013 "no es pena, es
    medida cautelar"; el senador de la oposición que convocó la sesión dice que la condena es de
    setiembre de 2014 y que no la cumplió en prisión. La diferencia no es de matiz en este asunto: la
    distinción entre procesamiento con prisión preventiva y condena es la que define si una persona
    tiene o no un antecedente penal, que es el hecho en discusión en toda la nota. No se evalúa acá
    si la nota usa "condena" en el sentido corriente de "estuvo preso por una causa penal", ni si la
    frase reproduce el modo en que la fuente ministerial se lo explicó al medio; la nota se publicó
    cuatro días antes de la sesión y se registra la distancia contra el documento, no lo que el medio
    podía saber ese día.
