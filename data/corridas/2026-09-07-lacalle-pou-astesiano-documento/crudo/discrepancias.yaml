- medio: montevideo-portal
  fecha: 2022-10-08
  tipo: dato_erroneo
  tema: transparencia-corrupcion
  politico: lacalle-pou
  _slug: condena-atribuida-al-procesamiento-de-2013
  publicado:
    url: https://www.montevideo.com.uy/Noticias/El-oficio-de-la-Justicia-con-el-que-Interior-argumenta-que-Astesiano-no-posee-antecedentes-uc834675
    titulo: El oficio de la Justicia con el que Interior argumenta que Astesiano no posee antecedentes
    cita: >-
      Según explicaron desde el Ministerio del Interior a Montevideo Portal, la investigación interna
      hasta ahora ha podido arrojar que en 2015 “alguien” entró al SGSP y dejó solamente las
      indagaciones, quitando la condena que cumplió en 2013 en la cárcel de Las Rosas (Maldonado).
    retrieved_at: 2026-09-07
  fuente_primaria:
    cita: >-
      Astesiano fue procesado el 17 de marzo de 2013 y recibió un fallo de condena el 5 de setiembre
      de 2014, en el que se le imputó un delito continuado de estafa en calidad de primario absoluto
      a la pena de dieciocho meses de prisión con descuento de la medida preventiva sufrida.
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/20221012s0032ea321c7f-3f23-4f7c-a4ab-fc5df420cd88.html
