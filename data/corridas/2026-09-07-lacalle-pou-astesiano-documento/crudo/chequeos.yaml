  dato_real:
    valor: Según El Observador (29/09/2022) y Montevideo Portal (28/09/2022, con confirmación del
      Ministerio del Interior), Astesiano había sido procesado por estafa en 2002 (sin prisión) y en
      2013 (cuatro meses de prisión por un delito continuado de estafa), con una condena emitida en
      setiembre de 2014. No hay en el registro sentencia del Poder Judicial ni informe oficial que lo
      documente.
