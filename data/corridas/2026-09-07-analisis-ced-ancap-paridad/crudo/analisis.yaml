      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en el cuerpo del boletín, escribe: "ANCAP culminó con un resultado primario
          corriente negativo en USD 44 millones explicado en gran parte por la mantención de los
          precios de los combustibles en los meses de marzo-abril-mayo, así como en el último
          bimestre del año." El boletín no define qué entiende por "resultado primario corriente" ni
          cita un documento de ANCAP para esa cifra específica.

          Los Estados Financieros Individuales de ANCAP al 31 de diciembre de 2021 (documento
          oficial) muestran, para el ejercicio 2021, un resultado del ejercicio positivo de $
          3.936.375.660 (unos USD 88,1 millones al tipo de cambio de cierre de ese balance). No es la
          misma magnitud que menciona el CED: el "resultado del ejercicio" es el resultado contable
          total del año (incluye ingresos y gastos financieros y partidas no operativas de todo el
          negocio de ANCAP), mientras que un "resultado primario corriente" excluye típicamente esas
          partidas para medir solo el desempeño operativo corriente del negocio de combustibles. Los
          estados financieros de ANCAP consultados en esta corrida no traen una línea con ese nombre
          para 2021, así que no se pudo confirmar ni refutar el monto de -44 millones con un
          documento oficial que use la misma definición que el CED.

          ANCAP publicó, en abril de 2022, un comunicado propio de resultados del ejercicio 2021 con
          una desagregación por mercado: "El conjunto de los negocios de ANCAP cierra el ejercicio con
          una ganancia de USD 88 mill., pero ANCAP presentó una pérdida de USD 32 mill. en el mercado
          monopólico que se revierte con resultados en mercados en competencia, cobertura de tipo de
          cambio y el aporte de las sociedades controladas." La pérdida de USD 32 millones que declara
          ANCAP para el "mercado monopólico" tiene el mismo signo que el "resultado primario corriente"
          de -USD 44 millones que calcula el CED y es del mismo orden de magnitud, pero ANCAP no
          aclara si su "mercado monopólico" excluye las mismas partidas que el CED excluye de su
          "resultado primario corriente", así que tampoco permite confirmar o refutar el monto exacto
          del CED con la misma definición.
