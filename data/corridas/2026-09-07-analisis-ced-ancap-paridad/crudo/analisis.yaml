      _faltante: no hay documento oficial que agregue la brecha en dólares (mismo caso que la afirmación
        anterior)
      analisis: >-
        La planilla de URSEA confirma la dirección y el orden de magnitud: el gasoil se vendió,
        en promedio, 19,2% por encima de la paridad en 2010-2014, la brecha más amplia de las
        que compara el CED en ese quinquenio. El monto de USD 1.181 millones depende de
        volúmenes y de un tipo de cambio mensual que el CED no publica, así que sin un documento
        oficial que los agregue de la misma forma, la calificación es discutible.
    - afirmacion: >-
        Según el CED, entre 2015 y 2019 la nafta tuvo en Uruguay un sobreprecio de USD 443 millones
        respecto de la paridad de importación (PPI) que calcula URSEA.
      fragmento: la nafta presentó un sobreprecio de USD 443 millones
      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en el mismo boletín, escribe: "En el periodo 2015-2019, la nafta presentó un
          sobreprecio de USD 443 millones, mientras que los consumidores uruguayos de gas oil
          pagaron aprox. USD 1.337 millones más que la referencia de PPI." Este dato marca, según
          el propio CED, un cambio de signo respecto del quinquenio anterior: la nafta pasa de
          subsidiada a sobreprecio.

          La planilla oficial de URSEA tiene, comprobado fila por fila, 53 de los 60 meses posibles
          de este quinquenio (faltan solo junio a diciembre de 2019, porque ahí termina el archivo
          oficial disponible en esta corrida; una lectura anterior había contado apenas 28 meses,
          por descartar filas con fecha en texto como "2016-Nov(5)(6)" o "2018-may (10)", que están
          en el archivo con sus datos completos). Con los 53 meses, el precio de venta promedio de
          la Gasolina Super 95 SP fue de $46,55/litro contra una PPI promedio de $42,88/litro: la
          venta quedó 8,6% por encima de la paridad, confirmando el cambio de signo (de subsidio a
          sobreprecio) que describe el CED para la nafta.

          Sumando la serie mensual oficial del MIEM/DNE para 2015-2019, la venta total de gasolinas
          (todas las variantes) fue de 4.119.862 m³. Como en el quinquenio anterior, el boletín no
          dice qué corte de nafta ni qué tipo de cambio usó mes a mes, así que esta serie oficial de
          volúmenes no permite reconstruir de forma independiente el monto de USD 443 millones.
