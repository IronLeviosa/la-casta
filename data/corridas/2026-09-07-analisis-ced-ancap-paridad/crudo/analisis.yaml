      analisis: >-
        La planilla de URSEA confirma el cambio de signo que describe el CED: la nafta pasó de
        venderse por debajo de la paridad en 2010-2014 a venderse 8,6% por encima en 2015-2019.
        El monto de USD 443 millones no tiene un documento oficial que lo agregue en dólares con
        la misma metodología, así que la calificación queda discutible.
    - afirmacion: >-
        Según el CED, entre 2015 y 2019 el gasoil tuvo en Uruguay un sobreprecio de aproximadamente
        USD 1.337 millones respecto de la paridad de importación (PPI) que calcula URSEA.
      fragmento: los consumidores uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la
        referencia de PPI
      calificacion: discutible
      dato_real:
        valor: >-
          El CED atribuye este monto al gasoil del quinquenio 2015-2019 en el cuerpo de su boletín
          ("los consumidores uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la
          referencia de PPI"). El mismo PDF, sin embargo, repite esta cifra en el resumen ejecutivo
          de la primera página con otros dígitos: ahí aparece impresa como "USD 1137 millones" (sin
          punto separador de miles), mientras que en el cuerpo del texto es "USD 1.337 millones"
          (con punto, como el resto de las cifras del documento); se verificó en esta corrida que la
          doble cifra está en la copia del propio CED (ced.uy), no solo en la copia republicada por
          todoelcampo.com.uy, así que no es un artefacto de quien la republicó. Se usa 1.337 porque
          es la lectura contigua de una oración completa del cuerpo del texto, porque es la que
          reprodujo El Observador citando el mismo informe, y porque solo 1.337 hace cerrar la suma
          de El Observador para la década (-78 + 1.181 + 443 + 1.337 = 2.883; con 1.137 daría 2.683);
          el CED no explica en ningún lugar del documento la diferencia entre las dos cifras.

          La planilla oficial de URSEA tiene, comprobado fila por fila, 53 de los 60 meses posibles
          de este quinquenio (ver la afirmación anterior sobre la nafta del mismo período para el
          detalle de qué meses faltan y por qué). Con los 53 meses, el precio de venta promedio del
          Gas oil fue de $39,48/litro contra una PPI promedio de $29,68/litro: la venta quedó 33,0%
          por encima de la paridad, más que la brecha del quinquenio 2010-2014 (19,2%), en la misma
          dirección y sentido de agravamiento que describe el CED (una lectura anterior de esta
          planilla, con solo 28 meses, había dado 26,5% contra 15,8%: la dirección del hallazgo no
          cambia, la magnitud sí).

          Sumando la serie mensual oficial del MIEM/DNE para 2015-2019, la venta total de gasoil
          (especial 10S + UTE + otros) fue de 4.951.009 m³. Como en las afirmaciones anteriores, el
          boletín no explica qué corte de gasoil ni qué tipo de cambio usó mes a mes, así que esta
          serie oficial no permite reconstruir de forma independiente el monto de USD 1.337 millones.
