        El CED no explica el método para llegar a los USD 46, 59 y 93 millones que suma en casi
        USD 200 millones (USD 105 millones solo nafta y gasoil), y ningún documento oficial de
        ANCAP desagrega una renuncia por combustible para 2021. El comunicado de resultados de
        ANCAP da una cifra de concepto cercano —USD 159 millones "menos con respecto a la
        paridad de importación" para todos los productos del mercado interno—, del mismo orden
        de magnitud pero para un universo de productos más amplio que el que suma el CED, así
        que no permite confirmar ni refutar el monto exacto: discutible.
    - afirmacion: >-
        Según el CED, ANCAP cerró 2021 con un resultado primario corriente negativo de USD 44
        millones, explicado en gran parte por mantener fijos los precios de los combustibles en
        marzo-abril-mayo y en el último bimestre del año.
