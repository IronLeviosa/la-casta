        Es una conclusión interpretativa del propio CED sobre el mecanismo de fijación de
        precios que introdujo la LUC en julio de 2021, no un dato medible: ningún organismo
        público mide "cambio relevante en la política de fijación de precios" como magnitud. Sin
        una fuente oficial que la confirme o la refute, la calificación es discutible, la misma
        que corresponde a cualquier conclusión interpretativa sin dato medible.
    - afirmacion: >-
        El CED sostiene, en el resumen de portada del boletín, bajo el título "COMPETITIVIDAD", que el
        nivel de precios de los combustibles en Uruguay es estructuralmente más caro que la región y
        la mayor parte del mundo.
      fragmento: más caro que la región y la mayor parte del mundo
      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en el resumen de portada del boletín, escribe (tal como lo extrae la lectura del
          PDF, con las cajas de la infografía en un orden distinto al visual): "Uruguay tiene un
          [tabulador] de los combustibles estructuralmente [tabulador] nivel de precios [salto de
          línea] más caro que la región y la mayor parte del mundo." bajo el título "COMPETITIVIDAD".
          Leído en el orden de las cajas de la infografía (título corto primero, texto explicativo
          después), la afirmación es que el nivel de precios de los combustibles en Uruguay es
          "estructuralmente más caro que la región y la mayor parte del mundo".

          El boletín no cita, en esta página ni en el resto del documento, ningún organismo, base de
          datos ni tabla de precios de otros países que respalde la comparación: es una afirmación
          cualitativa sin la fuente primaria (un organismo internacional o regional que publique
          precios de combustibles por país) que permitiría calificarla como verdadera o falsa.
