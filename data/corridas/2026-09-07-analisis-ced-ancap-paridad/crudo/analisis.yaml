      dato_real:
        valor: >-
          Esta cifra no aparece en el boletín del CED: es una suma que hace El Observador, el medio
          que publicó el análisis, combinando las cuatro cifras que el CED sí publica para
          2010-2014 y 2015-2019 (ver las cuatro primeras afirmaciones de este mismo registro). La
          cuenta cierra de forma exacta con esos cuatro números, tratando el subsidio de la nafta
          como un valor negativo (porque reduce, en vez de aumentar, lo que pagó el consumidor
          frente a la paridad): -78 + 1.181 + 443 + 1.337 = 2.883. Y 2.883 dividido diez años da
          288,3, que es el "promedio de US$ 288 millones por año durante una década" que también
          publica la nota. La aritmética es correcta dado el criterio de El Observador (neteo del
          subsidio, sin ponderar por el peso relativo de cada combustible en el consumo total); no
          hay, en ninguna de las dos fuentes usadas para este registro, un documento oficial que
          mida un "sobreprecio total" agregado de esta manera.
