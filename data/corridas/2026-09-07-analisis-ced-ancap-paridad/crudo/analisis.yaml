      _faltante: no hay documento oficial que agregue la brecha en dólares (la serie de volúmenes del
        MIEM existe, pero combinarla con el precio exige supuestos de tipo de cambio y ponderación
        que el CED no publica)
      analisis: >-
        La dirección que describe el CED está confirmada por un documento oficial: la planilla
        de URSEA muestra que la nafta se vendió, en promedio, 2,0% por debajo de la paridad de
        importación en 2010-2014. Ningún documento oficial agrega esa brecha en dólares con
        volúmenes y tipo de cambio mes a mes, así que el monto de USD 78 millones no se puede
        confirmar ni refutar y la calificación queda discutible.
    - afirmacion: >-
        Según el CED, entre 2010 y 2014 el gasoil tuvo en Uruguay un sobreprecio de aproximadamente
        USD 1.181 millones respecto de la paridad de importación (PPI) que calcula URSEA.
      fragmento: el gas oil evidenció un sobreprecio pagado por los uruguayos de aprox. USD 1.181 millones
      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en el mismo Boletín Macroeconómico N°27, atribuye este monto al gasoil del
          quinquenio 2010-2014, con el mismo método (series de precios de URSEA combinadas con
          volúmenes de venta que el boletín no publica), así que tampoco es reproducible de forma
          independiente solo con la fuente oficial.

          La planilla oficial de URSEA tiene, comprobado fila por fila, cobertura completa para
          2010-2014: 60 de 60 meses (una lectura anterior había contado solo 29, por el mismo error
          de descartar filas con fecha en texto). Con los 60 meses, el precio de venta promedio del
          Gas oil fue de $34,33/litro contra una PPI promedio de $28,81/litro: la venta quedó 19,2%
          por encima de la paridad, en la misma dirección que el "sobreprecio" que describe el CED.

          Sumando la serie mensual oficial del MIEM/DNE ("Venta de derivados de petróleo al mercado
          interno y zona franca", fuente ANCAP) para 2010-2014, la venta total de gasoil (sumando las
          columnas "gas oil especial 10S", "gas oil UTE" y "gas oil otros") fue de 6.070.917 m³. Como
          con la nafta, el boletín del CED no explica qué corte de gasoil ni qué tipo de cambio usó
          mes a mes, así que esta serie oficial de volúmenes no permite reconstruir de forma
          independiente el monto de USD 1.181 millones: falta un documento oficial que agregue la
          brecha en dólares, no el documento del CED, que ya está citado.
