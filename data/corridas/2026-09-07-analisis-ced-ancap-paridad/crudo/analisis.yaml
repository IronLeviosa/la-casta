  revision:
    tier: publicado
    notas_internas: >-
      Las diez afirmaciones quedan `discutible` porque ningún documento oficial mide, con la
      definición y la unidad del CED, lo que el CED afirma; eso no es un defecto del registro sino la
      calificación correcta según la regla del Veracímetro (amarillo: "dos lecturas posibles, o sin
      documento oficial"), aplicada con el mismo umbral que ya usa el chequeo publicado sobre el mismo
      boletín (`content/chequeos/lacalle-pou/2022-03-27-sobrecostos-combustibles-1700-millones.yaml`,
      también `discutible` y también `tier: publicado`). El registro documenta, para las seis
      afirmaciones en dólares, el documento oficial que confirma dirección y orden de magnitud (URSEA
      y MIEM para 2010-2019; estados financieros y comunicado de ANCAP para 2021) y explica con
      precisión qué falta para llegar al monto exacto, así que `discutible` no equivale a "sin
      evidencia": es el techo que permite la evidencia disponible. Ninguna fuente citada lleva
      `verificacion: manual`; las dos páginas de ancap.com.uy que no se pudieron leer con `pnpm fuente`
      (`datos-ancap.html`, `informacion-historica.html`) no se usaron como fuente de ningún dato, así
      que no exigen esa marca. No hay objeciones `bloquea` de `critica.md` sin resolver: el resumen ya
      no contradice al análisis, `publicado` apunta al PDF del propio CED, `autor_es` es simétrico y
      fechado, `metodo` no remite a `notas.md`, las cuatro cifras de 2010-2019 usan la cobertura real
      de la planilla de URSEA (60/53 meses, no 29/28), y las afirmaciones 6 a 9 cierran la asimetría
      que señalaba el crítico. Quedan, para un resolvedor y no como bloqueo de esta publicación: (a)
      reconstruir el monto en dólares de las afirmaciones 0 a 3 con los volúmenes del MIEM ya citados,
      lo que en el mejor caso movería la calificación a `impreciso` o la dejaría en `discutible`, nunca
      directamente en `verdadero`, porque sería una inferencia con supuestos que el CED no publica; (b)
      buscar, en URSEA o en los decretos de precios del Poder Ejecutivo, una serie de precio de venta y
      PPI para 2019-06 a 2021 en la misma base que la planilla 2002-2019, hoy inexistente en los
      documentos revisados. Las tres correcciones al chequeo publicado que señalan `critica.md` y
      `notas.md` no se aplican desde este registro: quedan redactadas como propuesta en `razones.md`
      de esta corrida, para que se tramiten con `pnpm promover --correccion`.
