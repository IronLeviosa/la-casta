  titulo: "Sobreprecio de los combustibles frente a la paridad de importación (PPI), 2010-2021, según
    el CED"
  empresa: ancap
  tema: economia/combustibles
  autor: Centro de Estudios para el Desarrollo (CED)
  autor_es: >-
    El CED se define a sí mismo como "una organización sin fines de lucro que investiga y analiza
    temas políticos y económicos de Uruguay para contribuir al debate informado y a la adopción de
    mejores políticas públicas", con seis pilares declarados: "Libertad, Sociedad abierta, Estado de
    derecho, Políticas basadas en experiencias, Descentralización, Sustentabilidad". Su director es
    Agustín Iturralde, identificado como tal por El Observador (el mismo medio que cubrió este
    análisis) al citar sus críticas a un informe previo de economistas del Frente Amplio.

    La propia página institucional del CED documenta vínculos con Luis Lacalle Pou anteriores a este
    boletín (03/03/2022): "2 ediciones del Programa Alta Dirección para la Gestión Pública liderado
    por Luis Lacalle Pou, con más de 3000 postulaciones" (sin fecha propia en la página) y una cena
    anual con el discurso del entonces presidente en 2021. La misma página documenta, además,
    vínculos posteriores a este boletín que no pudieron haber influido en él: el discurso de Lacalle
    Pou en la cena de 2023, "las exposiciones de los candidatos a la presidencia de la República en
    2024" (sin nombrar partidos) y "la participación de Marcos Galperin en 2025". La página describe
    también sus eventos, en general, como un espacio con "+370 expositores con los más destacados
    referentes políticos de la región, políticos de todos nuestros partidos, intelectuales de
    prestigio internacional y los más reconocidos analistas de nuestro medio", y dice haber sido
    reconocida en 2017 como "el mejor Centro de Estudios nuevo de América Latina" por el Think Tanks
    And Civil Societies Program de la Universidad de Pennsylvania. No se encontró, en las fuentes
    consultadas, una lista pública de quién financia al CED.
  fecha: 2022-03-03
  publicado:
    url: https://ced.uy/public/archivos/boletines/doc_13.pdf
    medio: ced
    fecha: 2022-03-03
    tipo: nota
    titulo: "Boletín Macroeconómico N°27: ¿Qué pasa con los combustibles en el mundo y en Uruguay?"
    cita: "n las últimas semanas se ha observado un fuerte incremento del precio del\npetróleo. En consecuencia, los precios de los combustibles se han disparado a\nnivel global añadiendo presión sobre la oleada inflacionaria que está azotando a\nla mayoría de los países."
    retrieved_at: 2026-09-08
  resumen: >-
    El CED calculó, a partir de series oficiales de precio de venta al público y de precio de
    paridad de importación (PPI) de URSEA y de datos de ventas de combustibles en litros, el
    sobreprecio o subsidio implícito que pagaron los consumidores uruguayos de nafta y gasoil frente
    al PPI en distintos períodos de gobierno. El boletín responde, en parte, a un informe previo de
    los economistas Martín Vallcorba y Braulio Zelko (asesores de la bancada del Frente Amplio)
    publicado el 9 de febrero de 2022, que el director del CED había criticado por tener, a su
    juicio, "sentido político partidario".

    Entre 2010 y 2014 el CED encontró un subsidio de USD 78 millones en nafta (venta por debajo de
    la paridad) y un sobreprecio de USD 1.181 millones en gasoil (venta por encima de la paridad).
    Entre 2015 y 2019 encontró sobreprecio en los dos productos: USD 443 millones en nafta y USD
    1.337 millones en gasoil. Para 2020-2021 da, por separado, USD 14 millones de sobreprecio en
    nafta y USD 67 millones en gasoil, aclarando que los dos años tienen signo distinto: sobreprecio
    en ambos combustibles en 2020, venta por debajo del PPI en 2021.

    El CED sostiene, como conclusión transversal a todo el período: "Desde el 2010 en adelante, es
    claro como los precios de venta al público no reflejaron (en ningún sentido) los costos asumidos
    por ANCAP para producir y distribuir los combustibles." Sobre el mecanismo de fijación de precios
    que introdujo la LUC en julio de 2021, concluye que "no parece haber generado ningún cambio
    relevante en la política de fijación de precios" y que su espíritu "está siendo dejado atrás por
    el gobierno". También afirma, sin aportar en este boletín una comparación numérica país por país,
    que "Uruguay tiene un nivel de precios de los combustibles estructuralmente más caro que la
    región y la mayor parte del mundo". Y calcula que, solo en 2021, la decisión de no ajustar los
    combustibles según el PPI le costó a ANCAP una renuncia de recaudación de casi USD 200 millones
    (USD 105 millones si se cuentan solo nafta y gasoil), en un año que cerró con un "resultado
    primario corriente negativo en USD 44 millones", según el propio CED.

    El Observador, que publicó el cálculo, sumó las cuatro cifras de la década 2010-2019 (neteando el
    subsidio de la nafta del primer período) en un total de USD 2.883 millones, equivalente a un
    promedio de USD 288 millones anuales, y lo contrastó con un promedio de USD 40,5 millones anuales
    para 2020-2021 (surgido de dividir la suma de los USD 14 millones y los USD 67 millones de ese
    bienio entre los dos años); el propio CED aclara, sin embargo, que esos dos años tienen signos
    opuestos, algo que ese contraste no recoge.
  metodo: >-
    El CED describe así su método, en el mismo boletín: "Según estimaciones propias basadas en datos
    de ventas de combustibles (en litros) y series históricas de precios de venta al público y de
    PPI, se obtuvo el sobreprecio en millones de dólares pagado por los consumidores uruguayos o
    asumidos como pérdida por ANCAP (subsidio) en los casos respectivos." El CED no publica, en este
    boletín, ni los volúmenes de venta ni el tipo de cambio que usó mes a mes.
  afirmaciones:
    - afirmacion: >-
        Según el CED, entre 2010 y 2014 la nafta tuvo en Uruguay un precio subsidiado por USD 78
        millones respecto de la paridad de importación (PPI) que calcula URSEA.
      fragmento: la nafta habría tenido un precio subsidiado por USD 78 millones de dólares
      calificacion: discutible
      dato_real:
        valor: >-
          El CED, en su Boletín Macroeconómico N°27 (03/03/2022), escribe textualmente: "En el
          periodo 2010-2014, la nafta habría tenido un precio subsidiado por USD 78 millones de
          dólares, mientras que, en caso contrario, el gas oil evidenció un sobreprecio pagado por
          los uruguayos de aprox. USD 1.181 millones." El CED no publica los volúmenes de venta que
          usó para llegar a ese monto en dólares, así que el monto no se puede reconstruir de forma
          independiente solo con series de precios.

          La planilla oficial "Series PPI vs PE" de URSEA tiene, comprobado fila por fila en esta
          corrida, cobertura completa y sin huecos para 2010-2014: 60 de 60 meses (una lectura
          anterior de esta misma planilla había contado solo 29 meses, porque descartó las filas
          cuya fecha viene escrita como texto —por ejemplo "2013-Ene" o "2014-Ago (4)"—; esas filas
          están en el archivo, con sus datos completos, y se incluyeron acá). Con los 60 meses, el
          precio de venta promedio de la Gasolina Super 95 SP fue de $35,80/litro contra una PPI
          promedio de $36,52/litro: la venta quedó 2,0% por debajo de la paridad, en la misma
          dirección que el "precio subsidiado" que describe el CED.

          El MIEM/DNE publica, en la misma página del sitio del ministerio donde está la planilla de
          URSEA, la serie mensual oficial "Venta de derivados de petróleo al mercado interno y zona
          franca" (fuente: ANCAP, columnas por producto en m³: año, mes, supergas, propano
          industrial, propano redes, supergas granel, gasolina 85 especial, gasolina especial 87 SP,
          gasolina 95 supra, gasolina super 95 SP, gasolina 95 ecosupra, gasolina premium 97 SP, gas
          oil especial 10S, gas oil UTE, gas oil otros, queroseno, diesel oil, fuel oil calefacción,
          fuel oil especial, fuel oil pesado UTE, fuel oil pesado otros, gasolina aviación, nafta
          liviana, solventes, asfaltos, lubricantes, TOTAL). Sumando mes a mes todas las variantes de
          gasolina (vigentes y discontinuadas) para 2010-2014, la venta total fue de 3.094.365 m³. El
          boletín del CED no dice qué corte de nafta usó, qué tipo de cambio aplicó mes a mes ni cómo
          ponderó los volúmenes, así que esta serie oficial no alcanza para reproducir de forma
          independiente el monto de USD 78 millones: lo que falta no es el documento del CED, que ya
          está citado, sino un documento oficial que agregue la brecha en dólares con la misma
          metodología.
