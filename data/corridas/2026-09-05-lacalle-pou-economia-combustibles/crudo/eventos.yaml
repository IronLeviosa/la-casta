- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  _slug: mecanismo-precios-combustibles-luc
  nombre: Mecanismo de fijación de precios de los combustibles (LUC)
  alias:
    - mecanismo de fijación de precios de los combustibles
    - precio de paridad de importación
    - PPI
    - fórmula de los combustibles
    - artículos 235 y 236 de la LUC
  desde: 2020-07-09
  temas: [economia/combustibles, empresas-publicas]
  politicos: [lacalle-pou]
  casos: []
  resumen: >-
    La Ley de Urgente Consideración (ley 19.889), promulgada el 9 de julio de 2020, estableció en
    sus artículos 235 y 236 un nuevo mecanismo para fijar el precio de venta de los combustibles de
    ANCAP: el Poder Ejecutivo aprueba el precio con un informe preceptivo de URSEA que debe
    explicitar el precio de paridad de importación (PPI), y debe actualizarlo con una periodicidad
    no mayor a sesenta días salvo razón válida y debidamente fundada. La reglamentación de esos
    artículos, contenida en el decreto 241/020 y sus modificaciones posteriores, exige a ANCAP y a
    URSEA enviar mensualmente al Poder Ejecutivo informes que incluyan el PPI, antes del día 28 de
    cada mes. El propio Lacalle Pou defendió públicamente el mecanismo en octubre de 2021,
    argumentando que permitía a la ciudadanía conocer cuánto del precio corresponde al costo del
    petróleo, a impuestos, al subsidio de Ancap y a las ganancias de la empresa.
  fuentes:
    - url: https://www.impo.com.uy/bases/leyes/19889-2020/235
      medio: impo
      fecha: 2020-07-09
      tipo: documento_oficial
      titulo: 'Ley N° 19.889 — artículo 235 (Aprobación de los precios de los combustibles)'
      cita: >-
        El Poder Ejecutivo aprobará el precio de venta de los diferentes combustibles producidos por
        la Administración Nacional de Combustibles, Alcohol y Portland (ANCAP), con entrega en cada
        una de sus plantas de distribución, previo informe preceptivo de la Unidad Reguladora de
        Servicios de Energía y Agua (URSEA) y de la Administración Nacional de Combustibles, Alcohol
        y Portland (ANCAP).
      retrieved_at: 2026-09-06
    - url: https://www.impo.com.uy/bases/leyes/19889-2020/235
      medio: impo
      fecha: 2020-07-09
      tipo: documento_oficial
      titulo: 'Ley N° 19.889 — artículo 235 (Aprobación de los precios de los combustibles)'
      cita: >-
        El Poder Ejecutivo actualizará con una periodicidad no mayor a sesenta días, los precios
        definidos en el inciso primero de este artículo y el precio máximo de venta al público, en
        las mismas condiciones que en él se definen y de manera independiente de los eventuales
        volúmenes de los diferentes combustibles almacenados, salvo razón válida y debidamente
        fundada.
      retrieved_at: 2026-09-06
    - url: https://www.impo.com.uy/bases/decretos/241-2020
      medio: impo
      fecha: 2020-08-26
      tipo: documento_oficial
      titulo: 'Decreto N° 241/020 — artículo 4 (informes preceptivos mensuales de ANCAP y URSEA)'
      cita: >-
        La Administración Nacional de Combustibles, Alcohol y Portland (ANCAP) y la Unidad
        Reguladora de Servicios de Energía y Agua (URSEA), deberán enviar al Poder Ejecutivo los
        informes preceptivos a los que hace referencia el artículo 235 de la Ley N° 19.889, de 9 de
        julio de 2020, antes del día 28 de cada mes. El informe de la Unidad Reguladora de Servicios
        de Energía y Agua (URSEA) deberá incluir el PPI correspondiente del mes móvil cerrado al día
        25 del cada mes.
      retrieved_at: 2026-09-06
    - url: https://www.elpais.com.uy/informacion/politica/lacalle-defendio-nueva-forma-de-fijacion-del-precio-de-los-combustibles-hoy-es-clara
      medio: el-pais
      fecha: 2021-10-11
      tipo: nota
      titulo: 'Lacalle defendió nueva forma de fijación del precio de los combustibles: "Hoy es clara"'
      cita: >-
        Lacalle Pou aseguró que ahora las personas pueden saber de ese precio cuánto corresponde al
        costo del petróleo, cuánto a impuestos, cuánto al subsidio del ente y cuánto a las ganancias
        de la empresa.
      retrieved_at: 2026-09-06
  revision:
    tier: publicado

- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  _slug: asociacion-portland-ancap
  nombre: Asociación de Ancap con privados en el negocio del pórtland
  alias:
    - asociación con privados del pórtland
    - socio privado para el pórtland
    - privatización del pórtland de Ancap
    - licitación del pórtland
    - conflicto de Fancap por el pórtland
  desde: 2021-10-10
  temas: [economia/combustibles, empresas-publicas, economia/empleo]
  politicos: [lacalle-pou]
  casos: []
  resumen: >-
    En setiembre de 2021 el Directorio de Ancap resolvió, por cuatro votos contra el rechazo del
    director del Frente Amplio Vicente Iglesias, avanzar en un plan para incorporar un socio privado
    al negocio del pórtland, deficitario desde hacía dos décadas; el presidente Lacalle Pou confirmó
    la decisión el 10 de octubre de ese año en un discurso en la Expo Rural de San José. En setiembre
    de 2022 Ancap aprobó las bases de un llamado competitivo para concretar esa asociación industrial
    y comercial en cemento y cal. La Federación Ancap (Fancap) respondió con paros y ocupaciones
    —entre ellas la de la refinería de La Teja el 26 de julio de 2023, la quinta en dos meses desde
    que el sindicato se declaró en conflicto en mayo— exigiendo que la empresa revea la decisión de
    privatizar la industria cementera. La licitación internacional quedó desierta el 12 de setiembre
    de 2023 al no presentarse ofertas de privados.
  fuentes:
    - url: https://www.gub.uy/presidencia/comunicacion/noticias/lacalle-pou-tengo-desvelo-productores-vendan-libremente-mundo-hacia-alli-va
      medio: presidencia
      fecha: 2021-10-10
      tipo: documento_oficial
      titulo: 'Lacalle Pou: Tengo como desvelo que los productores vendan libremente en el mundo, hacia allí va Uruguay'
      cita: >-
        Acerca de los precios de los combustibles, Lacalle Pou resaltó el compromiso de las
        autoridades para reducir los sobrecostos de Ancap. Adelantó que la dependencia dedicada a la
        producción de cemento pórtland será asociada con privados.
      retrieved_at: 2026-09-06
    - url: https://www.elpais.com.uy/informacion/politica/lacalle-defendio-nueva-forma-de-fijacion-del-precio-de-los-combustibles-hoy-es-clara
      medio: el-pais
      fecha: 2021-10-11
      tipo: nota
      titulo: 'Lacalle defendió nueva forma de fijación del precio de los combustibles: "Hoy es clara"'
      cita: >-
        En setiembre, el Directorio de Ancap decidió por cuatro votos contra uno (solo se opuso el
        representante del Frente Amplio, Vicente Iglesias) la propuesta de avanzar en un plan para la
        incorporación de un socio privado.
      retrieved_at: 2026-09-06
    - url: https://www.elobservador.com.uy/nota/ancap-da-otro-paso-para-incorporar-un-socio-privado-al-negocio-del-portland-202299204218
      medio: el-observador
      fecha: 2022-09-09
      tipo: nota
      titulo: Ancap da otro paso para incorporar un socio privado al negocio del pórtland
      cita: >-
        El Directorio de Ancap aprobó las bases para realizar un llamado competitivo que busca
        concretar una asociación industrial y comercial en el negocio de cementos y cal, informó el
        ente.
      retrieved_at: 2026-09-06
    - url: https://www.elpais.com.uy/informacion/sindicales/fancap-levanto-ocupacion-en-refineria-de-la-teja-pero-sigue-de-paro-y-espera-convocatoria-del-gobierno
      medio: el-pais
      fecha: 2023-07-26
      tipo: nota
      titulo: Fancap levantó ocupación en refinería de La Teja, pero sigue de paro y espera convocatoria del gobierno
      cita: >-
        La Federación Ancap ocupó la refinería de La Teja hasta este mediodía y se mantiene de paro
        hasta el final de la jornada de este miércoles. Se trata de la quinta ocupación en un lapso
        de dos meses, desde que el sindicato se declaró en conflicto en mayo. El objetivo de las
        medidas es "que Ancap revea su decisión de privatizar la industria cementera", según dijo a
        El País el secretario general de la Federación, Manuel Colina.
      retrieved_at: 2026-09-06
    - url: https://www.montevideo.com.uy/Noticias/Ancap-sin-ofertas-de-privados-licitacion-para-asociarse-en-el-portland-quedo-desierta-uc865323
      medio: montevideo-portal
      fecha: 2023-09-12
      tipo: nota
      titulo: 'Ancap: sin ofertas de privados, licitación para asociarse en el portland quedó desierta'
      cita: >-
        Ancap realizó este martes el acto de apertura de sobres de ofertas para la licitación
        internacional para la elección de un socio para el negocio del portland. Pese a la iniciativa
        de incluir a un privado en el negocio, la licitación quedó desierta ya que no hubo oferta de
        privados.
      retrieved_at: 2026-09-06
  revision:
    tier: publicado
    notas_internas: >-
      El Directorio de Ancap resolvió avanzar con la asociación en setiembre de 2021; ninguna de las
      fuentes citadas da el día exacto de esa resolución. Se usó `desde: 2021-10-10` (día en que
      Lacalle Pou confirmó la decisión en la Expo Rural de San José) por ser la fecha mejor
      documentada: fuente oficial de Presidencia más nota de El País del día siguiente. El resumen
      deja explícito que la resolución del Directorio fue en setiembre.
