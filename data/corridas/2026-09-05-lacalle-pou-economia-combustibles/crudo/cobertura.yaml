#
# Criterio aplicado, igual para todos los medios: `neutral` es el valor por defecto; `favorable` o
# `desfavorable` solo cuando el medio evalúa **en voz propia** (no en boca de una fuente citada) y
# se puede copiar la oración del cuerpo que lo muestra. Que una nota reproduzca la acusación de un
# tercero contra el político no la hace desfavorable, y que reproduzca su defensa no la hace
