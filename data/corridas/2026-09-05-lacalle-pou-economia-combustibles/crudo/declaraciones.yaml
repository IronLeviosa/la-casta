          estoy de acuerdo con ellos. Simplemente que en virtud de la pandemia y la situación
          económica dijimos 'vamos a aguantar'".
        retrieved_at: 2026-09-06
      - url: https://www.montevideo.com.uy/Noticias/Lacalle-reunira-el-lunes-al-equipo-economico-para-evaluar-suba-del-precio-de-combustibles-uc788500
        medio: montevideo-portal
        fecha: 2021-06-04
        tipo: nota
        titulo: Lacalle reunirá el lunes al equipo económico para evaluar suba del precio de combustibles
        cita: >-
          El presidente dijo en Subrayado que "increíblemente los miembros de la oposición dentro de
          Ancap dijeron tenemos que aumentar" los precios de los combustibles. "Y yo estoy de
          acuerdo con ellos. Simplemente que en virtud de la pandemia, en virtud de la situación
          económica, dijimos vamos a aguantar, pero sí, vamos a tener que aumentar", agregó Lacalle.
        retrieved_at: 2026-09-06
  revision:
    tier: publicado
    notas_internas: >-
      Bloqueante de critica.md resuelto: el registro difundía que directores del FA en Ancap
      pidieron aumentar, y las dos fuentes originales estaban construidas alrededor del desmentido
      de Walter Sosa sin incluirlo. Se agregó el desmentido al resumen (con nombre y fecha) y se
      amplió la cita de montevideo-portal para que cubra la afirmación completa, no solo la mitad.
      Pendiente para subir a textual: el tuit de Sosa ubica el pasaje en el minuto 29:40 de la
      entrevista de Blanca Rodríguez (Subrayado); no localizamos el video en esta sesión. La
      afirmación es además chequeable contra las actas del Directorio de Ancap de abril-mayo de
      2021, que el propio desmentido de Sosa invoca; no armamos un chequeo en este lote porque no
      hay `chequeos.yaml` en esta carpeta.

