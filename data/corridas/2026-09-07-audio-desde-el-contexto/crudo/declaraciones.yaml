  titulo: No cambiará el mecanismo de precios de los combustibles tras el referéndum de la LUC
  cita: Estamos convencidos de que es una medida de transparencia que el uruguayo no paga sobrecostos
  resumen: Tras el triunfo del "No" en el referéndum contra la LUC, un periodista le señaló en
    conferencia de prensa que no se había cumplido la promesa de campaña de bajar los combustibles y
    le preguntó si el gobierno iba a modificar el mecanismo de fijación de precios. Lacalle Pou
    contestó que no se iba a cambiar el mecanismo, sostuvo que es "una medida de transparencia" bajo
    la cual "el uruguayo no paga sobrecosto", afirmó que en el quinquenio anterior se pagaron más de
    USD 1.700 millones de sobrecostos por encima del precio de paridad de importación, y dijo que
    por primera vez —según creía, desde 2001 o 2002— tenía combustibles más baratos que Brasil.
  evidencia:
    nivel: textual
