    notas_internas: 'Corrección de tipo cotejo_con_primaria: apareció el audio oficial completo de la
      conferencia (Wayback, ver abajo) y sube el nivel de reportado a textual. La cita de cabecera
      pasa a ser la del audio (sin "y", plural "sobrecostos") en vez de la de Subrayado. No se
      concluye que Subrayado se haya equivocado en el conector "y": la transcripción es de Whisper,
      sin puntuación, y el segmento "que el uruguayo" dura 2,12 s contra 0,62-1,30 s de sus vecinos,
      compatible con una pausa además de con una palabra corta no transcripta. El plural
      "sobrecostos" sí es robusto (sílaba completa) y coincide con El País de forma independiente.
      El resumen se reescribió siguiendo el audio: se agregó "por encima del precio de paridad de
      importación" (se había perdido el patrón de comparación), se sacó el artículo definido de "los
      combustibles" (el audio no lo tiene y sin él la frase admite lectura existencial, cierta para
      el gasoil) y se agregó la reserva "según creía, desde 2001 o 2002" (el audio dice "creo que
      del 2001 2002"). También se agregó que la frase responde a una pregunta sobre la promesa de
      campaña de bajar los combustibles, que el periodista daba por incumplida. La primaria vive
      solo en Wayback (el original en medios.presidencia.gub.uy da 404); si esa copia cae, el
      registro se queda sin primaria — correr pnpm archivar para una segunda captura. La cita
      primaria sale de una transcripción automática (Whisper large-v3-turbo), sin puntuación, lo que
      limita qué diferencias de puntuación o conectores se le pueden adjudicar a la prensa. La
      gacetilla en url_nota no resume la ronda de preguntas: el pasaje de combustibles existe solo
      en el audio. La cita alterada de Subrayado sobre "por primera vez" (omite "creo que del 2001
      2002" sin marcarlo) queda registrada aparte en
      content/discrepancias/subrayado/2022-03-27-omite-reserva-primera-vez-brasil.yaml. Pendiente
      para una corrida completa del tema, no de este lote: el pasaje 620-644 s y 698-702 s del audio
      es evidencia primaria no usada todavía en
      content/promesas/lacalle-pou/no-aumentar-combustibles.yaml; además el periodista atribuye una
      promesa de "bajar" los combustibles, distinta de la de "no aumentarlos" que hoy documenta esa
      promesa, y no se estableció si la de "bajar" existe como promesa registrada.'
