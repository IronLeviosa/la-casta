  evidencias_candidatas:
    - fecha: 2025-12-16
      tipo: ley
      efecto: a_favor
      descripcion: >-
        La Ley n.° 20.451, promulgada el 16/12/2025 y publicada en el Diario Oficial el 23/12/2025, limita el ingreso de funcionarios públicos a las intendencias por designación directa a un 4% del total de cargos presupuestales, y prohíbe designaciones en los últimos 12 meses de mandato. Los cargos políticos de confianza quedan fuera del porcentaje.
