            fecha: 2025-12-16
            tipo: documento_oficial
            titulo: Promulgación de la Ley n.° 20.451
            cita: >-
              16/12/2025 Promulgación de la Ley n.° 20.451.
            retrieved_at: 2026-09-04
          - url: https://www.busqueda.com.uy/informacion/tras-la-ley-que-limita-designaciones-directas-intendenciaspersisten-tensiones-algunos-departamentos-esa-herramienta-n5414125
            medio: busqueda
            fecha: 2026-06-11
            tipo: nota
            titulo: Tras la ley que limita designaciones directas en intendencias, persisten tensiones en algunos departamentos por esa herramienta
            cita: >-
              La Ley 20.451, aprobada en diciembre, limita el ingreso de funcionarios públicos a las intendencias por designación directa a un 4% del total de cargos presupuestales. Los cargos políticos de confianza no entran en ese porcentaje. Además la norma prohíbe hacer designaciones de funcionarios —presupuestados o contratados— en los últimos 12 meses del mandato.
            retrieved_at: 2026-09-04
    - fecha: 2026-06-11
      tipo: dato_oficial
      efecto: neutral
      descripcion: >-
        Según el informe "Vínculos laborales con el Estado, altas y bajas" de la ONSC citado por Búsqueda, en 2024 el 38,8% de los ingresos de funcionarios a las intendencias fue por designación directa (muy por encima del resto del Estado). A seis meses de la entrada en vigencia de la ley, todavía no había reportes sobre su cumplimiento, y en Soriano ediles frenteamplistas denunciaron más de 60 designaciones directas entre julio y diciembre de 2025 y 149 entre diciembre de 2025 y abril de 2026 (la intendencia responde que están dentro del límite legal del 4%).
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.busqueda.com.uy/informacion/tras-la-ley-que-limita-designaciones-directas-intendenciaspersisten-tensiones-algunos-departamentos-esa-herramienta-n5414125
            medio: busqueda
            fecha: 2026-06-11
            tipo: nota
            titulo: Tras la ley que limita designaciones directas en intendencias, persisten tensiones en algunos departamentos por esa herramienta
            cita: >-
              En 2024 el 38,8% de los ingresos de funcionarios a cargos públicos en las intendencias fueron por designaciones directas, según el informe “Vínculos laborales con el Estado, altas y bajas” de 2025.
            retrieved_at: 2026-09-04
      _faltante: segunda_fuente
