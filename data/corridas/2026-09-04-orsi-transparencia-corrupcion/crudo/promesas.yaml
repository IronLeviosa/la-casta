# Promesas de campaña de Yamandú Orsi sobre transparencia y corrupción.
# Corrida 2026-09-04-orsi-transparencia-corrupcion.
# Las tres promesas de este archivo fueron presentadas juntas, como parte del
# cierre del eje de "transparencia del Estado" dentro de las "Prioridades" de
# campaña presentadas el 16-17/9/2024 en la Plaza de Toros de Colonia.

- politico: orsi
  tema: transparencia-corrupcion
  texto: >-
    Fortalecer la JUTEP como organismo de contralor de la transparencia y lucha contra la corrupción.
  fecha_promesa: 2024-09-17
  origen:
    nivel: reportado
    fuentes:
      - url: https://mpp.org.uy/yamandu-orsi-presento-48-prioridades-para-un-pais-con-mas-y-mejores-oportunidades/
        medio: mpp
        fecha: 2024-09-17
        tipo: nota
        titulo: Yamandú Orsi presentó 48 prioridades para un país con más y mejores oportunidades
        cita: >-
          Fortalecer la JUTEP como organismo de contralor de la transparencia y lucha contra la corrupción.
        retrieved_at: 2026-09-04
      - url: https://www.subrayado.com.uy/frente-amplio-presento-los-principales-lineamientos-su-programa-foco-ejes-economico-social-y-seguridad-n957347
        medio: subrayado
        fecha: 2024-09-16
        tipo: nota
        titulo: Frente Amplio presentó los principales lineamientos de su programa con foco en ejes económico, social y seguridad
        cita: >-
          Orsi finalizó refiriéndose a la transparencia del Estado, respecto a lo que señaló que se fortalecerá la JUTEP, se regularán donaciones anónimas y aportes de privados a partidos políticos y se limitarán las designaciones directas.
        retrieved_at: 2026-09-04
  evidencias_candidatas:
    - fecha: 2026-04-09
      tipo: dato_oficial
      efecto: en_contra
      descripcion: >-
        La propia Jutep reconoció, a propósito de un error detectado en la declaración jurada del propio Orsi, que "hasta ahora la Jutep no tiene forma reglamentaria ni personal especializado para evaluar la consistencia de todas las declaraciones presentadas para su publicación" y que ese control recién se automatiza si la declaración se presenta en formato digital.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.busqueda.com.uy/politica/un-error-la-declaracion-jurada-orsi-detectado-estudiantes-contabilidad-expuso-ausencia-controles-la-jutep-n5411964
            medio: busqueda
            fecha: 2026-04-09
            tipo: nota
            titulo: Un error en la declaración jurada de Orsi detectado por estudiantes de Contabilidad expuso ausencia de controles en la Jutep
            cita: >-
              Como segundo punto, Ferraris explicó que "hasta ahora la Jutep no tiene forma reglamentaria ni personal especializado para evaluar la consistencia de todas las declaraciones presentadas para su publicación". Y agregó: "Si la misma hubiese sido presentada en formato digital, el error hubiese sido detectado automáticamente, pero fue presentada, como la norma lo habilita, en formato papel".
            retrieved_at: 2026-09-04
      _faltante: segunda_fuente
    - fecha: 2025-12-16
      tipo: ley
      efecto: a_favor
      descripcion: >-
        El artículo 566 de la Ley n.° 20.446, de 16 de diciembre de 2025, y la Resolución n.° 405/2025 del Directorio de la Jutep establecieron que, desde el 1° de enero de 2026, la recepción de las declaraciones juradas de bienes e ingresos se realiza exclusivamente en formato electrónico, cerrando la vía en papel que había impedido el control automático de un error en la propia declaración de Orsi.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.gub.uy/tramites/declaracion-jurada-bienes-ingresos
            medio: jutep
            fecha: 2025-12-16
            tipo: documento_oficial
            titulo: Declaración jurada de bienes e ingresos
            cita: >-
              De acuerdo con lo establecido en el Artículo 566 de la Ley nº 20.446, de 16 de diciembre de 2025, y en la Resolución nº 405/2025 del Directorio de la JUTEP, a partir del 1º de enero de 2026 la recepción de las declaraciones juradas de bienes e ingresos se realizará exclusivamente en formato electrónico.
            retrieved_at: 2026-09-04

