        medio: en-perspectiva
        fecha: 2026-06-01
        tipo: nota
        titulo: El presidente Yamandú Orsi dijo que no se equivocó al recibir un descuento en la compra de su camioneta
        cita: >-
          Me equivoco todos los días, desde que me levanto. - Periodista: ¿Pero en el caso de la camioneta?. – Orsi: No. – Periodista: ¿No se equivocó al recibir ese descuento?. – Orsi: Lo dictaminarán los organismos de contralor. Normalmente, por lo general, cuando hay descuentos yo me tiro de cabeza.
        retrieved_at: 2026-09-04
