  motivo: >-
    Danilo Astori calificó como "un aumento oculto de impuestos" la rebaja de los descuentos de IVA en
    compras con tarjeta de débito y en consumos gastronómicos que aplicó el nuevo gobierno de Lacalle
    Pou. La declaración y el chequeo que nace de ella quedaron fechados el 13 de marzo de 2020, el día
    en que el sitio del Frente Amplio publicó la nota que los cita. Una nota de El Observador del 12 de
    marzo de 2020, sobre el mismo paquete de medidas y con las mismas cifras, dice que Astori "se
    refirió este jueves" a los anuncios del gobierno: el 12 de marzo de 2020 fue jueves, y el 13 de
    marzo, viernes. La declaración es entonces del jueves 12 de marzo de 2020, un día antes de que el
    Frente Amplio la publicara en su sitio, y la fecha se corrige en los dos registros. La fecha de
    publicación de la nota del Frente Amplio, 13 de marzo de 2020, se mantiene sin cambios como fecha
    de esa fuente.
