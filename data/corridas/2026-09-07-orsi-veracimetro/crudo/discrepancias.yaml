  analisis: >-
    La nota publica bajo la etiqueta "resultado operativo" una serie de cifras en dólares para los
    ejercicios 2015 a 2019 de Ancap. Los estados financieros individuales auditados de 2019
    reportan dos líneas distintas para ese ejercicio: "Resultado operativo 4.043.681.908" y
    "Resultado del ejercicio 1.464.281.136", en pesos uruguayos. El mismo documento publica los
    tipos de cambio del dólar que la empresa usa: promedio 2019 = 35,15; cierre 2019 = 37,31;
    promedio 2018 = 30,67; cierre 2018 = 32,41. Con el tipo de cambio de cierre de 2019, el
    resultado del ejercicio equivale a 39,2 millones de dólares y el resultado operativo a 108,4
    millones (115,0 millones al promedio del año). La cifra de 2018 que publica la nota, 88
    millones, coincide con el resultado del ejercicio de ese año al cierre (2.854.322.969 / 32,41
    = 88,1) y no con el resultado operativo (5.294.854.562 / 32,41 = 163,4). Es decir: las cifras
    publicadas corresponden al resultado del ejercicio convertido al tipo de cambio de cierre, y
    están rotuladas como resultado operativo. No se consultaron los estados financieros de 2015,
    2016 y 2017, por lo que este registro no dice nada sobre esos tres años ni sobre la afirmación
    de "cinco años consecutivos de superávit" del titular.
