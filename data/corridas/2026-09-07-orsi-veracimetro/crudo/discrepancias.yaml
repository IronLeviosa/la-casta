# ---------------------------------------------------------------------------
# Composición de este archivo, para que se pueda auditar la Regla 0
# ---------------------------------------------------------------------------
# Tres registros: uno contra la comunicación oficial de un gobierno del Frente Amplio (Presidencia,
# 2020), en una nota cuyo encuadre favorece a la gestión de Ancap de ese gobierno; y dos contra
# notas de prensa desfavorables a un presidente del Frente Amplio, una de un medio de alineamiento
# `sin_datos` (Montevideo Portal) y otra de un medio de alineamiento `progresista`
# (Caras y Caretas), es decir afín al político al que la nota perjudica. No queda un solo lado.
#
# Candidatos que se revisaron y NO se registran, con el motivo:
# - El Observador (26/04/2025) dice que Ancap resignó US$ 55 millones por vender por debajo del
#   PPI; El País (02/04/2025) dice US$ 40 millones "estimados hasta fin de setiembre". Son
#   períodos y perímetros distintos y no hay documento que decida cuál mide qué: es un desacuerdo
#   entre medios, no una discrepancia. Va a la crítica.
# - Gacetilla del MIEM (25/04/2025): dice que el déficit de 118 millones "surge del balance
#   operativo y financiero, y de endeudamiento". En el video, la ministra separa las dos cosas
#   ("el otro tanto tiene que ver con endeudamiento"), pero la frase es ambigua y los costos
#   financieros de 2024 sí crecieron 2.360 millones de pesos según el balance. No alcanza.
# - Subrayado (25/04/2025), El País (02/04/2025 y 28/05/2026), Ámbito (08/03/2023) y Montevideo
#   Portal (18/11/2024): se cotejaron sus cifras contra los documentos primarios y coinciden. Se
#   deja constancia porque el hallazgo negativo también se audita.
