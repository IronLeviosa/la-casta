- politico: orsi
  declaracion: orsi/2024-11-18-orsi-sostuvo-recargo-iva-2-aplicado
  tema: economia/impuestos
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 2024-11-18
  afirmacion: >-
    Orsi afirmó que el gobierno saliente de Lacalle Pou había aumentado en 2 puntos porcentuales
    el IVA aplicado a las compras con tarjeta, sin devolverlo antes de dejar el gobierno.
  fragmento: >-
    ese 2% que aumentaron de IVA
  dato_real:
    valor: >-
      El descuento de IVA para compras con tarjeta de débito y otros medios electrónicos,
      habilitado por la Ley de Inclusión Financiera N.º 19.210, fue de 4 puntos porcentuales
      entre 2017 y abril de 2020 (2 puntos fijados por la propia ley más 2 puntos adicionales que
      el Poder Ejecutivo había dispuesto por decreto). El Decreto N.º 97/020, promulgado el
      11/03/2020 y vigente desde el 1.º de mayo de 2020, firmado por el presidente Lacalle Pou y
      la entonces ministra de Economía Azucena Arbeleche, derogó esa rebaja adicional "con el fin
      de abatir el déficit fiscal", dejando el descuento en los 2 puntos porcentuales que siguen
      vigentes hoy. Es la medida a la que se refiere Orsi como "el 2% que aumentaron [de IVA]". Un
      documento de la Asesoría Tributaria del MEF, citado por Ámbito en 2023 cuando Lacalle Pou
      volvió a defender esa reducción, caracterizó la misma medida como "el fin de un subsidio" y
      no como un aumento de impuestos, y afirmó que el beneficio eliminado se concentraba en los
      hogares de mayores ingresos, según datos de la Encuesta Financiera de Hogares del BCU (el
      quintil de menores ingresos usaba tarjeta de débito para compras de alimentación y limpieza
      en apenas un 3,81%-4% de los casos).
    fuentes:
      - url: https://www.impo.com.uy/bases/decretos/97-2020
        medio: impo
        fecha: 2020-03-11
        tipo: documento_oficial
        titulo: Decreto N° 97/020
        cita: >-
          APROBACION DE MEDIDAS CON EL FIN DE ABATIR EL DEFICIT FISCAL EFECTUANDO UNA
          DISMINUCION EN LA REDUCCION DEL IVA EN LA FORMA QUE SE DETERMINA.
        retrieved_at: 2026-09-07
      - url: https://ambito.com/uruguay/los-numeros-detras-la-reduccion-del-descuento-iva-tarjetas-debito-n5668404
        medio: ambito
        fecha: 2023-03-08
        tipo: nota
        titulo: Los números detrás de la reducción del descuento de IVA en tarjetas de débito
        cita: >-
          El más reciente fue en marzo del 2020, apenas iniciada la gestión de Lacalle Pou —y en
          puertas de la pandemia de Covid-19—, cuando la compleja situación fiscal del país llevó
          a un aumento del IVA para las tarjetas de débito, haciendo que el descuento pasara del
          4% al 2%.
        retrieved_at: 2026-09-07
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.montevideo.com.uy/Noticias/-El-presidente-voy-a-ser-yo-eso-queria-que-quedara-claro--Orsi-sobre-no-subir-impuestos-uc906902
        medio: montevideo-portal
        fecha: 2024-11-18
        tipo: nota
        titulo: >-
          "El presidente voy a ser yo; eso quería que quedara claro": Orsi sobre no subir
          impuestos
        cita: >-
          "Y mi pregunta fue, y ahí no tuve respuesta, si antes de irse van a devolver ese 2% que
          aumentaron de IVA. Porque ahí sí hay una muestra clara de aumento de tributos. No
          escuché nada", completó.
        retrieved_at: 2026-09-07
  _faltante: segunda_fuente

- politico: orsi
  declaracion: orsi/2026-05-26-consultado-prensa-sobre-descuento-usd-25
  tema: transparencia-corrupcion
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 2026-05-26
  afirmacion: >-
    La prensa consultó a Orsi sobre un descuento de USD 25.000 respecto del precio de lista en
    la compra de la camioneta Hyundai Santa Fe que usa como presidente, adquirida días antes de
    asumir el cargo el 1.º de marzo de 2025.
  fragmento: >-
    el descuento de USD 25.000 en la compra de su camioneta
  dato_real:
    valor: >-
      En la declaración jurada de bienes e ingresos que Orsi presentó ante la Jutep tras asumir
      la Presidencia (publicada el 05/06/2025), declaró ser propietario del 100% de una
      "CAMIONETA HYUNDAI" año 2025 con un valor actual de $ 3.396.570 (unos USD 87.000 al tipo de
      cambio de cierre de 2025 de $39 usado por Radio Carve para su cálculo). Según la
      investigación del programa "Así Nos Va" (Radio Carve) —que, de acuerdo con El País, partió
      de un informe previo de la propia sección Qué Pasa de El País sobre declaraciones juradas de
      la clase política—, el valor de lista de ese modelo (versión más completa) era de USD
      78.990 y Orsi lo adquirió, a través de la concesionaria oficial Oliva Automotores, por USD
      54.000: una diferencia de USD 25.000 que desde la Presidencia se calificó de "gentileza" de
      la empresa. El pago se completó con la entrega de un Hyundai 2020 de su propiedad más una
      transferencia bancaria. No se encontró la factura ni una lista de precios del importador
      como documento público independiente: la cifra de USD 25.000 proviene de la cadena de citas
      de prensa (Radio Carve, replicada por Montevideo Portal, Caras y Caretas y El País), no de
      un documento oficial que la contenga de forma literal. Consultado por El País, el
      prosecretario de Presidencia Jorge Díaz sostuvo que la operación "está ajustada al código de
      ética pública" (Ley 19.823, art. 9, que prohíbe a los funcionarios públicos recibir
      obsequios por actos de su función), porque, al momento de la compra, Orsi "no era
      funcionario" público todavía.
    fuentes:
      - url: https://www.gub.uy/junta-transparencia-etica-publica/sites/junta-transparencia-etica-publica/files/documentos/publicaciones/2025%20Presidente%20Orsi.pdf
        medio: jutep
        fecha: 2025-06-05
        tipo: documento_oficial
        titulo: >-
          Declaración Jurada de Bienes e Ingresos del Presidente de la República, Prof. Yamandú
          Orsi Martínez - 2025
        cita: >-
          CAMIONETA |HYUNDAI 2025 100 3,396,570.00
        retrieved_at: 2026-09-07
      - url: https://elpais.com.uy/informacion/politica/descuento-de-us-25-000-a-camioneta-de-orsi-compra-esta-ajustada-al-codigo-de-etica-publica-dice-jorge-diaz
        medio: el-pais
        fecha: 2026-05-28
        tipo: nota
        titulo: >-
          Descuento de US$ 25.000 a camioneta de Orsi: compra "está ajustada al código de ética
          pública", dice Jorge Díaz
        cita: >-
          Consultado por si haber recibido esa bonificación —como se desprende de una
          investigación del programa Así nos va (Radio Carve) a raíz del informe de Qué Pasa de
          El País sobre las declaraciones juradas de los actores políticos— no viola el artículo
          citado, Díaz dijo que "cuando Yamandú Orsi hizo esa compra no era funcionario".
        retrieved_at: 2026-09-07
      - url: https://www.carasycaretas.com.uy/sociedad/la-camioneta-la-polemica-orsi-mostro-factura-y-entrego-vehiculo-como-forma-pago-n95840
        medio: caras-y-caretas
        fecha: 2026-05-27
        tipo: nota
        titulo: >-
          La camioneta de la polémica: Orsi mostró factura y entregó vehículo como
          forma de pago
        cita: >-
          El valor de lista para la Santa Fe, el último modelo y más completo, es de US$ 78.990,
          pero Orsi —según su declaración jurada— la compró en US$ 54.000, de acuerdo con el
          informe divulgado esta semana por Así nos va (Radio Carve).
        retrieved_at: 2026-09-07
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://www.montevideo.com.uy/Noticias/-Cuando-usted-vea--Orsi-hablo-sobre-la-camioneta-que-compro-con-US-25-000-de-descuento-uc963282
        medio: montevideo-portal
        fecha: 2026-05-26
        tipo: nota
        titulo: >-
          "Cuando usted vea": Orsi habló sobre la camioneta que compró con US$ 25.000 de
          descuento
        cita: >-
          El presidente fue consultado este martes sobre el tema y se limitó a responder que
          enviará la factura al programa radial con el fin de aclarar la situación. "Cuando usted
          vea la factura, ahí va a decir qué precio es", indicó en rueda de prensa.
        retrieved_at: 2026-09-07
      - url: https://www.carasycaretas.com.uy/sociedad/la-camioneta-la-polemica-orsi-mostro-factura-y-entrego-vehiculo-como-forma-pago-n95840
