    modelo: claude-sonnet-5
  fecha: 2025-04-25
  afirmacion: >-
    Orsi afirmó que en 2019 Ancap tuvo una ganancia de 41 millones de dólares y que en el
    ejercicio 2024 tuvo un resultado de pérdida de 118 millones de dólares.
  fragmento: >-
    en el año 19 ANCAP daba 41 millones de dólares de ganancia, y en el año 24 el resultado es
    un resultado de pérdida de 118 millones
  dato_real:
    valor: >-
      Los Estados Financieros Individuales de Ancap al 31 de diciembre de 2024 (auditados por
      Grant Thornton, según cita El País) registran un resultado del ejercicio de $ 5.217.605.497
      de pérdida, que la propia empresa convierte a USD 118 millones al tipo de cambio de cierre
      de $44,066/USD en su presentación oficial "Resultados Ancap - Ejercicio 2024" del
      01/04/2025 (El País lo redondea a USD 118,4 millones citando el mismo balance auditado).
      Para el ejercicio 2019, el resultado del ejercicio individual (atribuible a la matriz) que
      figura en los Estados Financieros Individuales 2019 es de $ 1.464.281.136, y el resultado
      consolidado del grupo Ancap con sus subsidiarias (antes de interés minoritario) es de
      $ 1.513.044.719. En dólares, las dos cifras oficiales publicadas para ese mismo ejercicio no
      coinciden entre sí: un comunicado de Presidencia del 27/02/2020 citó a la entonces
      presidenta de Ancap, Marta Jara, diciendo que el "resultado operativo" de 2019 fue de USD 39
      millones, mientras que la gacetilla del MIEM/Presidencia del 25/04/2025 reprodujo, sin
      verificación adicional, la cifra que dio el propio Orsi de "41.000.000 de dólares de
      ganancia" para el mismo año. No se encontró, entre las fuentes oficiales revisadas, una que
      concilie explícitamente por qué el mismo ejercicio 2019 se informó en dos ocasiones
      oficiales distintas como USD 39 millones y USD 41 millones (entre las explicaciones no
      verificadas: resultado individual vs. consolidado, o tipo de cambio de cierre vs. promedio
      anual).
