        cita: >-
          TOTAL 7.316.594.888 1.873.047.776 1.042.554.545 10.232.197.209
        retrieved_at: 2026-09-07
      - url: https://www.elobservador.com.uy/economia-y-empresas/lo-que-el-gobierno-no-dijo-ancap-que-muestran-los-numeros-del-balance-la-empresa-n5995973
        medio: el-observador
        fecha: 2025-04-26
        tipo: nota
        titulo: >-
          Lo que el gobierno no dijo sobre Ancap: qué muestran los números del balance de
          la empresa
        cita: >-
          En noviembre del año pasado, el Ministerio de Economía y Finanzas (MEF) autorizó a
          Ancap a pedir un préstamo por hasta US$ 200 millones. Según informó ayer Orsi, de ese
          total, la empresa estatal tomó US$ 160 millones del total habilitado.
        retrieved_at: 2026-09-07
      - url: https://www.gub.uy/ministerio-industria-energia-mineria/comunicacion/noticias/presidente-orsi-balance-ancap-revelo-saldo-negativo-118000000-dolares-obliga
