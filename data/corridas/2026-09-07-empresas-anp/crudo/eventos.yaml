    - dragado público y país soberano
  desde: 2026-05-25
  temas:
    - empresas-publicas
  politicos: []
  casos: []
  resumen: En mayo de 2026 el Sindicato Único Portuario y Ramas Afines (Supra) se enfrentó a la
    conducción de la Administración Nacional de Puertos por el funcionamiento del dragado nacional
    en el puerto de Montevideo, después de que el organismo acordara con el consorcio chino CHEC
    Dredging tareas de limpieza en los muelles 1, 2 y C y contratara a la empresa Servicios Marítimos
    para trabajos puntuales. El sindicato difundió un video contra el gerente y el subgerente del
    Área de Dragado; el organismo lo leyó como antesala de la negociación salarial del área. La fecha
    de inicio es la de la nota que lo documenta, no la del primer episodio.
  fuentes:
