      titulo: Decreto N° 114/021, Resultando XV
      cita: XV) que como consecuencia del acuerdo referido se solucionó el diferendo y se evitó el arbitraje internacional por un monto de US$ 1.500.000.000 (dólares americanos mil quinientos millones), pactándose, además, la realización de nuevas inversiones por un monto estimado en US$ 455.000.000 (dólares americanos cuatrocientos cincuenta y cinco millones), una sustancial rebaja tarifaria, la ratificación y el cumplimiento de la normativa bajo la cual se otorgó la concesión, así como la adecuación del régimen de gestión a la realidad actual;
      retrieved_at: 2026-09-09
