  texto: No aumentar el precio de los combustibles si es electo presidente. Es el componente de combustibles de la promesa compuesta del 30 de marzo de 2019 ("Si gana el Partido Nacional se terminó el aumento de impuestos, las tarifas y los combustibles"); los componentes de impuestos y de tarifas públicas se califican por separado (promesas no-aumentar-impuestos y no-aumentar-tarifas-publicas).
