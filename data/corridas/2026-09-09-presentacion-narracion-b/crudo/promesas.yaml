  fundamentacion: "La promesa se formuló el 17/9/2024. El mandato no terminó, por lo que corresponde un estado en_proceso. A diferencia de las otras dos promesas del mismo bloque de campaña, no se encontró ninguna evidencia de seguimiento, ni a favor ni en contra: ningún proyecto de ley, anuncio de gobierno, declaración de Orsi o dato oficial sobre esta promesa específica desde que asumió (1/3/2025) hasta ahora. La ausencia de evidencia no es evidencia de ausencia de acción, y esta clasificación es provisional: no se afirma aquí que no se haya presentado ningún proyecto, sino que no se relevó ninguno. Dado que han pasado dieciocho meses de un mandato de cinco años sin un paso público hacia una promesa que, a diferencia de las otras dos, no requiere una ley compleja (alcanza con un proyecto sobre financiamiento político), se clasifica como en_proceso_demorada a la espera de una revisión posterior dedicada a financiamiento de partidos políticos que confirme o corrija esta lectura."
  revision:
    tier: probable
    notas_internas: 'Mismo problema de independencia del origen que las otras dos promesas del bloque (mpp + subrayado; ver notas de la primera). Además, a diferencia de esa y de la de designaciones directas, esta promesa no tiene ninguna evidencia de seguimiento, pese a que consultas.jsonl registra una búsqueda específica que dio resultado: "Orsi ley financiamiento partidos políticos donaciones anónimas 2025 2026 proyecto -> 8 resultados". El crítico señaló esto como severidad corregir. No se revisaron esos 8 resultados en esta edición porque hacerlo es investigación (buscar y abrir fuentes nuevas), no edición, y está fuera de lo que corresponde a este rol; queda como pendiente explícito para una corrida de investigación dedicada a financiamiento de partidos políticos, con la observación de que la asimetría es interna al lote (no hay motivo para tratar esta promesa distinto de las otras dos, solo que la búsqueda que la habría cubierto no llegó a producir una evidencia citable).'
