  estado: incumplida
  fundamentacion: 'El mandato terminó el 1 de marzo de 2025. La promesa fue absoluta ("se terminó el aumento de... los combustibles") y el propio Lacalle Pou reconoció el 3 de marzo de 2022 que "es cierto" que no se pudo cumplir, atribuyéndolo a la pandemia y a la guerra en Ucrania; el 28 de mayo de 2022 anunció que "la espalda de Ancap se terminó" y que habría que aumentar lo que se debía aumentar. Hubo aumentos reales y documentados con montos: 12% en junio de 2021 (nafta +$7,10, gasoil +$4,90 por litro, el primero del mandato, tras dos postergaciones consecutivas pedidas por él mismo), un segundo aumento consecutivo a fin de ese mismo mes, 7,6%/11% en julio de 2021 (nafta a $70,81, gasoil a $50,70 por litro), $3 en la nafta y $5 en el gasoil en marzo de 2022 (por debajo de los $7,5/$15 que recomendaba Ursea, según cuantificó el propio Lacalle Pou en rueda de prensa), $1 por litro en nafta y gasoil más $4 por kilo en el supergás en marzo de 2024, y $1 en el gasoil en febrero de 2025. Del lado del cumplimiento: en marzo de 2020 los combustibles no subieron cuando sí subieron las demás tarifas, y en abril y mayo de 2021 el ajuste se postergó dos meses seguidos a pedido expreso de Lacalle Pou pese a una suba de 30-36% del petróleo Brent; en noviembre de 2021 el precio se mantuvo pese a la duplicación del refinado, absorbido con ganancias de ANCAP; en mayo de 2022 los precios estaban por debajo de la paridad de importación (las dos notas que documentan esa brecha para la nafta súper dan cifras distintas entre sí, $6,41 y $4,80 por litro, no conciliadas); en febrero de 2023 se mantuvo el precio pese a la recomendación de suba de URSEA, en junio de 2023 se aplicó una rebaja, en octubre de 2024 otra, y en diciembre de 2024 y marzo de 2025 -última decisión de precios del mandato- los valores se mantuvieron sin cambios. El balance es que hubo aumentos reales y reiterados, reconocidos por el propio promitente, y también contención, postergaciones y rebajas: la promesa de que no habría aumentos no se cumplió, aunque el traslado de la referencia internacional fue parcial. Lo que falta, y por eso el registro queda en tier probable, es la serie oficial completa de precios de venta al público (ANCAP, URSEA, decretos en IMPO) para cuantificar con una sola fuente metodológica, mes a mes, cuánto subió cada producto; el estado no depende de ese dato, la magnitud exacta sí. Las declaraciones de voluntad del propio gobierno ("compromiso de tener los combustibles lo más baratos posible") se registran como neutrales.'
