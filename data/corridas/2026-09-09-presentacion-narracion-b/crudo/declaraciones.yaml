  titulo: Anuncia una rebaja del IRPF y el IASS para quienes más se esfuerzan
  cita: sobre todo aquellas personas que hacen grandes esfuerzos por sostener económicamente y que generalmente no tienen apoyo integral del Estado por no estar en una situación vulnerable
  resumen: Ante la Asamblea General, en la rendición de cuentas de sus tres años de gobierno, anunció una rebaja del IRPF y del IASS que dijo alcanzaría al 75% de los contribuyentes de IRPF y significaría una renuncia fiscal de US$150 millones.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://medios.presidencia.gub.uy/tav_portal/2023/noticias/AK_502/AK_502.mp3
        medio: presidencia
        fecha: 2023-03-02
        tipo: video
        titulo: Mensaje del presidente de la República ante la Asamblea General
        marca_tiempo: 57:40
        contexto: estamos en condiciones de proceder a una baja de impuestos impuestos sobre todo aquellas personas que hacen grandes esfuerzos por sostener económicamente y que generalmente no tienen apoyo integral del Estado por no estar en una situación vulnerable para ser claro abundan los ejemplos una empleada doméstica que tiene que trabajar en más de un lugar un albañil una maestra un policía un sanitario de esa es la gente que estamos hablando todos sabemos el esfuerzo que realizan estos uruguayos para mantenerse a sí mismos y a su familia de hecho el impacto mayor del ajuste fiscal del 2017 fue disminuir las deducciones que puede hacer una persona al pagar el IRPF por eso el primer paso es aumentar las deducciones con el foco principal en los trabajadores contribuyentes del IRPF de menores ingresos y con los trabajadores que tengan hijos a cargo después tendrán el documento porque hay decretos firmados y hay proyectos presentados ya en el Parlamento pero a modo de adelanto se va a aumentar la deducción del 10% a 14% a aquellas personas con ingresos menores se va a aumentar la deducción por hijo de 13 BPC a 20 BPC manteniendo la duplicación en caso de hijos con discapacidad se va a aumentar el tope del costo de la vivienda para poder acceder a la deducción del crédito hipotecario se va a aumentar el crédito por arrendamiento de 6 a 8% para que se hagan una idea de estos cambios en la deducción del IRPF beneficiar el 75% de los contribuyentes mientras el 14% cerca de 63.000 uruguayos aquellos de menores ingresos van a dejar de pagar el IRPF con respecto al IAS como comprometimos en campaña electoral empezamos a desandar ese tributo estos días específicamente me fijé en el compromiso por el país cuál había sido el término utilizado y por eso para desandar este tributo en esta primera etapa vamos a aumentar la jubilación mínima a partir de la cual se paga el IAS se propone aumentar el mínimo no imponible de 8 a 9 BPC al mismo tiempo aumentar el crédito por arrendamiento del 8% con estas medidas cerca de 20.000 personas dejan de pagar también este tributo también también estamos proponiendo un conjunto de medidas que profundizan los beneficios que hemos otorgado a las micro y pequeñas empresas reclamo de algunos de los miembros de la coalición estas empresas que constituyen el corazón del motor económico de nuestro país toda la renuncia fiscal entre personas y empresas significan 150 millones de dólares
        cita: sobre todo aquellas personas que hacen grandes esfuerzos por sostener económicamente y que generalmente no tienen apoyo integral del Estado por no estar en una situación vulnerable
        url_nota: https://www.gub.uy/presidencia/comunicacion/audios/completos/mensaje-del-presidente-republica-ante-asamblea-general-0
