    notas_internas: 'Corrección de tipo cotejo_con_primaria sobre lacalle-pou/2023-03-02-baja-impuestos-irpf-iass (objeción 1 de "Objeciones al lote" en critica.md). El audio oficial (AK_502.mp3, 57:40) reemplaza la cita publicada, que fusionaba dos oraciones separadas por aplausos en la gacetilla de Presidencia y cambiaba "grandes esfuerzos" por "los mayores esfuerzos". La nueva cita es un tramo contiguo del audio, ya verificado con --red. titulo se conserva sin cambios (ya había sido revisado en la corrección 2026-09-06-titulos-declaraciones); resumen no se modifica porque el audio no obliga a hacerlo: los datos que resume (75%, US$150 millones) quedan confirmados por el mismo audio en los chequeos de este lote, y los fragmento de chequeos[1] y chequeos[2] siguen apareciendo en el resumen sin cambios. La gacetilla queda como segunda fuente con literalidad: difiere y su diferencia documentada sin verbos de intención. nivel se mantiene textual: ahora hay dos fuentes que lo sostienen (audio tipo video y gacetilla tipo documento_oficial), no solo la gacetilla como antes.'
