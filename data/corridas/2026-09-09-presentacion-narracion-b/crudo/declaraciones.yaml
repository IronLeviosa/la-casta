  resumen: Tras el "No" en el referéndum contra la LUC, le preguntaron en conferencia de prensa si cambiaría el mecanismo de fijación de precios de los combustibles, ante la promesa de campaña incumplida de bajarlos. Contestó que no, dijo que es "una medida de transparencia" bajo la cual "el uruguayo no paga sobrecosto", afirmó que en el quinquenio anterior se pagaron más de USD 1.700 millones de sobrecostos por encima del precio de paridad de importación, y dijo que por primera vez —según creía, desde 2001 o 2002— tenía combustibles más baratos que Brasil.
