- politico: lacalle-pou
  _slug: rendicion-cuentas-balance-ejecucion-presupuestal-2022
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  tema: transparencia-corrupcion
  titulo: Rendición de Cuentas y Balance de Ejecución Presupuestal 2022 (inhibición a fiscales, artículo sobre medios y carnicerías)
  numero_ley: "20.212"
  fecha: 2023-10-24
  alcance: parcial
  articulos_observados:
    - "636"
    - "664"
    - "665"
    - "666"
    - "578"
  fundamento: "El Poder Ejecutivo observó cinco artículos de la Rendición de Cuentas, sobre tres asuntos. Del artículo 636 —inhibición de tres años para ejercer la abogacía del Fiscal de Corte y el Fiscal Adjunto tras el cese, y de un año para los fiscales con competencia penal, con un subsidio del 85% de sus haberes en ese período— observó solo los incisos 2° a 4°: avaló la inhibición de los fiscales jerárquicos (inciso 1°, no observado), pero no encontró razones de interés general para restringir el derecho al trabajo (artículos 7 y 36 de la Constitución) de los fiscales con competencia penal, y objetó que el subsidio no indicara su financiamiento (artículo 86). El artículo 578, sobre exoneraciones tributarias a empresas periodísticas, se observó en su totalidad porque la redacción podía no beneficiar por igual a todas esas empresas. Los artículos 664 a 666, que devolvían a los Gobiernos Departamentales del interior la habilitación de carnicerías —competencia que desde 2020 tiene el Instituto Nacional de Carnes—, se observaron por razones de conveniencia."
  resultado:
    estado: observaciones_aceptadas
    fecha: 2023-11-01
    detalle: 'La Asamblea General votó el 01-11-2023: el artículo 636 se aprobó con 27 votos a favor y 3 en contra en el Senado, y 77 a favor y 6 en contra en Diputados; los artículos 664, 665, 666 y 578 se aprobaron por unanimidad. El trámite quedó registrado como "Asamblea General no levanta veto" y la ley se promulgó el 06-11-2023 sin los incisos segundo, tercero y cuarto del artículo 636 (queda vigente la inhibición del Fiscal de Corte y el Fiscal Adjunto de Corte, inciso primero, que el Poder Ejecutivo no observó) ni los artículos 664, 665, 666 y 578, los cinco tramos observados.'
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/159716/ficha_completa
        medio: parlamento
        fecha: 2023-11-01
        tipo: documento_oficial
        titulo: Ficha Asunto 159716 - Rendición de Cuentas y Balance de Ejecución Presupuestal. Ejercicio 2022. Aprobación.
        cita: Asamblea General no levanta veto.
        retrieved_at: 2026-09-04
  analisis: El Poder Ejecutivo observó parcialmente la Rendición de Cuentas 2022 en cinco artículos que tocaban tres asuntos distintos. Del artículo 636 —impulsado por Cabildo Abierto a instancias de la Asociación de Abogados Penalistas—, el mensaje de observaciones distingue entre el Fiscal de Corte y el Fiscal Adjunto de Corte, cuya inhibición de tres años no observó por sus funciones jerárquicas, y los fiscales con competencia penal, cuya inhibición de un año observó por no encontrar razones de interés general que justificaran restringir su derecho al trabajo (artículos 7 y 36 de la Constitución); también observó el subsidio asociado a esa inhibición por no indicar su financiamiento (artículo 86). El artículo 578, sobre exoneraciones tributarias a empresas periodísticas, y los artículos 664 a 666, sobre la habilitación de carnicerías en el interior, se observaron por razones de conveniencia. La Asamblea General no levantó el veto y la ley se promulgó sin esos tramos. No se encontraron declaraciones públicas de Lacalle Pou sobre este veto en particular, más allá del texto de las observaciones.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://infolegislativa.parlamento.gub.uy/temporales/96b56006-59f0-4f73-ba92-d981dffb9c67.pdf?embedded=true
        medio: parlamento
        fecha: 2023-10-24
        tipo: documento_oficial
        titulo: Repartido N.° 24/0 - Asamblea General, Carpeta 111/2023 - Rendición de Cuentas y Balance de Ejecución Presupuestal correspondiente al Ejercicio 2022. Observación en forma parcial.
        cita: En el caso de los Fiscales con competencia en materia penal, y teniendo en cuenta el alcance y naturaleza de su función, no se visualizan cuáles serían las razones de interés general que justifiquen una limitación a un derecho constitucionalmente protegido, como lo es el derecho al trabajo (artículos 7 y 36 de la Constitución de la República); más concretamente, cual es el interés general en relación con la libertad de ejercicio de la profesión.
        verificacion: manual
        retrieved_at: 2026-09-05
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/159716/ficha_completa
        medio: parlamento
        fecha: 2023-10-24
        tipo: documento_oficial
        titulo: Ficha Asunto 159716 - Rendición de Cuentas y Balance de Ejecución Presupuestal. Ejercicio 2022. Aprobación.
        cita: Poder Ejecutivo veto parcial.
        retrieved_at: 2026-09-04
      - url: https://www.elobservador.com.uy/nota/lacalle-pou-veto-tres-articulos-de-la-rendicion-de-cuentas-y-cae-inhibicion-a-fiscales-20231024191249
        medio: el-observador
        fecha: 2023-10-24
        tipo: nota
        titulo: Lacalle Pou vetó tres artículos de la Rendición de Cuentas y cae inhibición a fiscales
        cita: el veto incluye un artículo referido a medios de comunicación –que quedó mal redactado– y otro vinculado a la fiscalización de las carnicerías en el interior del país que le devolvía potestades a las intendencias
        retrieved_at: 2026-09-04
  revision:
    tier: probable
    notas_internas: "Nivel subido de reportado a textual: se incorporó el Repartido 24/0 (mensaje de observaciones del Poder Ejecutivo, resuelto en inbox/resoluciones/2026-09-05), leído y verificado en esta sesión. Su texto obliga a corregir la corrección anterior: no es que el Poder Ejecutivo no haya invocado el artículo 36 (objeción `corregir` de critica.md, vetos[1]) —lo invoca, junto con el artículo 7, respecto del derecho al trabajo de los fiscales con competencia penal—, sino que la única fuente disponible en su momento (El Observador) no lo mostraba porque atribuía ese argumento a dos constitucionalistas consultados por la prensa; con el documento primario a la vista, `fundamento` y `analisis` se reescribieron para reflejar lo que el Poder Ejecutivo argumentó, con más precisión que antes (distingue Fiscal de Corte de fiscales penales, y solo observa los incisos 2° a 4° del artículo 636). Tier se mantiene en `probable`, ya no por falta de segunda fuente sino por la fuente nueva: la URL pública de este repartido (parlamento.gub.uy/documentosyleyes/documentos/repartido/asambleageneral/49/24/0/PDF) redirige a un PDF temporal con identificador que caduca (confirmado por el resolvedor: dos pedidos sucesivos devuelven UUID distintos) y el intento de archivarlo en Wayback falló (HTTP 523, sin wayback de respaldo). Se marca `verificacion: manual` en esa fuente porque no hay forma mecánica de garantizar que una re-verificación futura recupere el mismo documento desde la misma URL ni desde un archivo; necesita aprobación humana si en el futuro se quisiera subir a `publicado`."
