  fundamento: El Poder Ejecutivo observó los Capítulos II, III y IV del proyecto, artículos 7 a 20, que regulaban la interrupción voluntaria del embarazo, por entender que afectaban el orden constitucional (artículos 7, 8, 36, 40, 41, 42, 44, 72 y 332 de la Constitución) y compromisos asumidos por Uruguay en el Pacto de San José de Costa Rica y la Convención sobre los Derechos del Niño, y porque consideraba que la vida humana comienza en la concepción.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2008-11-20
    detalle: 'La Asamblea General recibió las observaciones el 14-11-2008, pasó el asunto a la Comisión de Asuntos Laborales y Seguridad Social y, en su sesión extraordinaria n.° 13 del 20-11-2008 (Diario 54), "proclamó que no se ha levantado el veto y se mantienen las observaciones realizadas". No se encontró en las fuentes consultadas el detalle del recuento de votos de esa sesión. El Poder Ejecutivo promulgó la ley el 01-12-2008 como Ley N.° 18.426, sin los artículos observados: el texto que quedó vigente regula la política nacional de salud sexual y reproductiva pero no despenaliza el aborto.'
