cambios:
  - registro: chequeos/barandiaran/1995-06-14-1993-mas-30-jovenes-entre-15
    campo: titulo, analisis y dato_real.valor (patrón repetido en 18 chequeos de Barandiarán, 5 de
      Lacalle Pou y 3 de Orsi)
    de: >-
      Las declaraciones con chequeos marcados dentro de la cita o del resumen (`MarcaChequeo`)
      arrastran, dentro del mismo párrafo visible, el título, el primer párrafo del análisis y el
      primer párrafo del dato_real de cada chequeo marcado, más una etiqueta de fuentes con el
      nombre completo de cada medio del dato_real. Con un párrafo de origen ya largo (una cita
      parlamentaria de cientos de caracteres) y uno o dos chequeos marcados, ese párrafo pasaba
      largamente los 1.500 caracteres (hasta 2.849 en lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto,
      hasta 3.048 en orsi/2025-04-25-orsi-informo-ancap-volvio-tener-resultados). Además, ocho
      chequeos de Barandiarán sobre ANTEL tenían en su dato_real.valor la ruta de archivo
      `content/empresas/antel.yaml` o frases como «no se ubicó en esta corrida»/«no se pudo abrir
      por esta vía en esta corrida», y dos chequeos de Lacalle Pou (2022-03-27-combustibles-mas-baratos-brasil,
      2023-03-02-75-ciento-contribuyentes-irpf) tenían «detalle mensual en el crudo de la corrida
      2026-09-07-lacalle-pou-brasil-serie» dentro de la etiqueta `fuente` de una serie del gráfico
      (no dentro de `metodo`, que sí está plegado) y «en esta corrida» dentro de dato_real.valor.
    a: >-
      Los títulos, se acortaron a lo esencial (qué se chequea y el veredicto) sin sacar ninguna
      cifra. Los primeros párrafos de `analisis` y `dato_real.valor` se redujeron a una oración de
      veredicto, moviendo el detalle metodológico (desglose año por año, fuentes secundarias,
      salvedades) a un segundo o tercer párrafo, que no cuenta para el globo porque solo se muestra
      el primero (`src/components/MarcaChequeo.astro`, `parrafos(...)[0]`). Las referencias a rutas
      de archivo y a «esta corrida» se reemplazaron por «este sitio» o se sacaron sin cambiar el
      hecho que describían (por ejemplo, «la ficha de ANTEL en este sitio no tiene documentación
      pública de resultados anteriores a 1997» en vez de citar el nombre del archivo). Las
      referencias a la corrida dentro de `fuente` de una serie del gráfico se sacaron; el nombre del
      publicador de cada serie (URSEA/MIEM, decretos, ANCAP/catalogodatos, ANP) queda igual. Dos
      registros (lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto con sus dos
      chequeos, y orsi/2025-04-25-orsi-informo-ancap-volvio-tener-resultados con sus tres) siguen
      por encima de 1.500 caracteres después de este recorte -bajaron de 2.849 a 2.518 y de 3.048 a
      2.795- porque el resto del párrafo son las citas de los chequeos (sin tocar) y las etiquetas de
      fuente de dato_real, que en esos dos casos citan entre tres y siete organismos distintos
      (IMPO, ANP, BCU, BCB, URSEA, AGESIC, MIEM en un caso; ANCAP, El Observador, Presidencia, MIEM,
      El País en el otro): el mínimo posible sin sacar ninguna fuente ya supera el límite. Quedan
      señalados en el informe para una corrección de código (por ejemplo, que `MarcaChequeo` no
      repita el `<script>` una vez por marca, o que el globo abrevie «y N fuentes más»), no de
      contenido.
  - registro: declaraciones/lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto
    campo: resumen (barandiaran×1, lacalle-pou×3)
    de: >-
      Resúmenes más largos de lo necesario para lo que aportan, que además empujaban el mismo
      párrafo (cita o resumen más los chequeos marcados) por encima de 1.500 caracteres.
    a: >-
      Resúmenes condensados sacando frases accesorias (aclaraciones ya dichas en otra parte, la
      atribución de una nota en particular cuando ya está en las fuentes) y manteniendo intacto,
      carácter por carácter, el tramo que cada `fragmento` de chequeo necesita encontrar dentro del
      resumen; no hizo falta tocar ningún `fragmento`. Ninguna cifra ni cita entre comillas se sacó.
  - registro: giros/lacalle-pou/no-subir-combustibles-2022
    campo: analisis (lacalle-pou×5, orsi×2)
    de: >-
      `analisis` se muestra en un único `<p>` sin plegar (`GiroCard.astro`, con y sin `completo`), a
      diferencia de los chequeos: acá no hay un segundo párrafo invisible al que mover el detalle.
      Cuatro registros pasaban los 1.500 caracteres (hasta 1.889 en
      promesa-no-aumentar-impuestos-iva-compras-exterior de Orsi al sumar el análisis de dos giros
      relacionados) y seis tenían frases como «El crítico coincide en cambio_parcial y propuso
      reconocido_explicitamente», «El crítico señala que...», «documentada en notas.md» o «el que
      faltaba en el lote».
    a: >-
      Se sacó la atribución al crítico y el análisis quedó con la objeción misma, sin decir quién la
      hizo («Pesa en contra de esa lectura que los aumentos se contuvieron...» en vez de «El crítico
      propuso cambio_parcial porque...»). Los tres análisis largos se recortaron moviendo detalle
      secundario (cifras exactas ya presentes en la declaración citada, método de verificación) a
      `notas_internas`, que no se publica; ninguna fecha, cita ni calificación de cambio/explicación
      cambió.
  - registro: promesas/orsi/no-vamos-aumentar-impuestos-diez-minutos
    campo: evidencias[].descripcion y fundamentacion (lacalle-pou×2, mujica×1, orsi×2)
    de: >-
      Referencias a `notas.md`, `razones.md`, `vetos.yaml`, `giros.yaml`, `declaraciones.yaml` y a
      un id de hipótesis con ruta de archivo (`hipotesis/orsi/aumentos-irae-irnr-zonas-francas-documento-pn-2026.yaml`)
      dentro de texto que el lector ve en la ficha de la promesa y en la ficha del político.
    a: >-
      Las mismas oraciones sin la ruta de archivo ni el nombre de la colección interna («queda como
      hipótesis abierta, pendiente de una segunda fuente» en vez de citar el archivo; «El registro no
      incluye la reafirmación de Orsi en mayo de 2026...» en vez de «se retiraron antes de publicar,
      ver razones.md»). Ninguna evidencia, fecha ni estado de la promesa cambió. El bloque de 4.697
      caracteres que la lista original marcaba en esta misma promesa ya no aparece: el componente
      (`PromesaCard.astro`) pliega la fundamentación completa bajo `<details>` cuando pasa los 1.500
      caracteres, y el `<p>` abierto muestra solo la primera oración (137 caracteres); es un hallazgo
      de una versión anterior del sitio construido, no de este lote.
  - registro: vetos/vazquez/2008-11-14-ley-defensa-derecho-salud-sexual-reproductiva
    campo: fundamento y analisis (batlle×2, lacalle-pou×1, vazquez×10)
    de: >-
      `fundamento` y `analisis` se muestran en un único `<p>` sin plegar (`VetoCard.astro`). Trece
      registros tenían la frase «no se ubicó/ubicaron en esta corrida» o «no se pudo abrir por esta
      vía en esta corrida» en `fundamento` o `que_falta` (el mensaje de observaciones no se
      encontró públicamente, y eso no cambia); dos tenían «ver notas.md, hipótesis» en `analisis`; y
      dos superaban los 1.500 caracteres en `fundamento` o `analisis` (1.516 y 1.563).
    a: >-
      «No se ubicó/ubicaron públicamente» en vez de nombrar la corrida; se sacó la referencia a
      notas.md manteniendo la misma constancia («es un hueco documentado en el trámite
      parlamentario, no una omisión de esta investigación»). Los dos párrafos largos se condensaron
      quitando frases redundantes (repeticiones de «que» y aclaraciones ya dichas en otro tramo del
      mismo párrafo), sin sacar ningún artículo, fecha, cifra de votación ni cita.
motivo: >-
  `pnpm revisar:paginas` sobre el sitio construido señaló, en las páginas de `content/chequeos`,
  `content/declaraciones`, `content/giros`, `content/promesas` y `content/vetos`, narración de
  proceso (ids de corridas, «en esta corrida», rutas de archivo `.yaml`, «el crítico», «el
  investigador», «el editor») y párrafos de más de 1.500 caracteres sin plegar. Este lote
  (narracion-b) cubre esas cinco colecciones; `narracion-a`, corrido en paralelo el mismo día, cubre
  `analisis`, `casos`, `empresas` y `medios`.

  De los 94 hallazgos de la lista que se entregó para este lote, 12 ya no aparecían en una lectura
  fresca de `pnpm revisar:paginas --estricto` contra el `dist/` actual: ocho eran el texto genérico
  de "criterio editorial" que arma `src/lib/probable.ts` cuando un registro `probable` no tiene
  `que_falta` propio (no es contenido de un registro, así que no había nada para editar), uno era el
  bloque de 4.697 caracteres de `no-vamos-aumentar-impuestos-diez-minutos` que el componente ya
  pliega bajo `<details>` (documentado arriba), y el aviso de `lista-repetida` de
  `/politicos/nin-novoa/` (siete mandatos en renglones sueltos) tampoco se reprodujo: la ficha ya
  usa la banda a escala con la lista plegada. Los 82 hallazgos restantes se resolvieron editando 55
  registros en las cinco colecciones, detallados por colección en `cambios[]`. Dos registros
  (lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto y
  orsi/2025-04-25-orsi-informo-ancap-volvio-tener-resultados) bajaron de tamaño pero siguen por
  encima de 1.500 caracteres por una razón estructural explicada en el primer `cambios[]`: quedan
  señalados en el informe, no se puede resolver solo con edición de contenido.

  Ningún dato cambió: ninguna cifra, cita, fuente, calificación de chequeo o de giro, tier, fecha ni
  `fragmento` se tocó; los dos resúmenes que se acortaron (detallado en el segundo `cambios[]`)
  conservaron intacto el tramo que sus chequeos ya marcaban. `pnpm validar --inbox
  inbox/reparaciones/narracion-b-2026-09-09 --red --solo citas` da el mismo resultado que antes de
  esta corrección porque ninguna cita cambió.
