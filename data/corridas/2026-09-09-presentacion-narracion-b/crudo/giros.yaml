        titulo: Investigan si a Lacalle le ocultaron los antecedentes de Astesiano; FA analiza acciones parlamentarias
        cita: había sido procesado en dos ocasiones por estafa, algo que el mandatario aseguró desconocer. Una en 2002 y otra en 2013, esta última con prisión. Esa condena incluso fue emitida en setiembre de 2014, cuando ya trabajaba para Lacalle Pou.
        retrieved_at: 2026-09-04
      - url: https://www.montevideo.com.uy/Noticias/Lacalle-sobre-Astesiano--Un-presidente-que-se-equivoca-pueden-tener-pero-que-miente-no--uc834074
        medio: montevideo-portal
        fecha: 2022-09-30
        tipo: nota
        titulo: 'Lacalle sobre Astesiano: "Un presidente que se equivoca pueden tener, pero que miente, no"'
