        cita: Lacalle fue consultado este jueves por aquella promesa electoral y en particular respecto al impacto en los precios de la nafta y el gasoil, y reconoció que "es cierto" que no se pudo cumplir el anuncio.
        retrieved_at: 2026-09-04
      - url: https://www.teledoce.com/telemundo/nacionales/en-vivo-segui-la-entrevista-del-presidente-lacalle-pou-en-telemundo/
        medio: teledoce
