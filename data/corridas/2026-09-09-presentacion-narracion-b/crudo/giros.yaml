        medio: montevideo-portal
        fecha: 2022-09-28
        tipo: nota
        titulo: Astesiano estuvo cuatro meses preso en 2013 por un delito continuado de estafa
        cita: estuvo preso en el 2013 por un delito continuado de estafa, según informó La Diaria y confirmó Montevideo Portal con el Ministerio del Interior. Según indicó la fuente, Astesiano estuvo cuatro meses tras las rejas luego de enfrentar un proceso judicial ese mismo año. En tanto, en 2002 también fue procesado por estafa, pero en esa ocasión sin prisión.
        retrieved_at: 2026-09-04
