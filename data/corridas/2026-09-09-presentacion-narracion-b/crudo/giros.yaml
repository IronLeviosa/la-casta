- politico: orsi
  _slug: ambiguedad-2023-promesa-sin-matices-2024
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  tema: economia/impuestos
  declaracion_antes: orsi/2023-12-14-ni-descarto-ni-afirmo
  declaracion_despues: orsi/2024-11-17-no-vamos-aumentar-impuestos
  cambio: cambio_parcial
  explicacion: sin_explicacion
  analisis: |-
    El 14 de diciembre de 2023, consultado en Telemundo sobre si podía garantizar que no subiría los impuestos, Orsi respondió: "Ni descarto ni la afirmo. Pero es lo que no deseo. Tiene que ser la última de las medidas" — una posición que dejaba abierta la posibilidad como recurso final. El 17 de noviembre de 2024, en el debate presidencial de balotaje, dijo: "No vamos a aumentar los impuestos", y lo repitió sin el matiz anterior: "Repito nuevamente porque no se entendió: no voy a subir los impuestos".

    El 7 de marzo de 2024, en un comité de base en Trouville, había calificado de "liviandad" y "frivolidad" las promesas formuladas como "no voy a aumentar impuestos, no voy a subir la edad de jubilación", dijo que se hacían "para conseguir votos" y llamó a "cobrar" esas actitudes; la nota que registra esa frase aclara que apuntaba al candidato Álvaro Delgado, no a una tesis general sobre cualquier promitente.

    No hay una declaración de Orsi que conecte el paso de la ambigüedad de diciembre de 2023 a la promesa sin matices de noviembre de 2024, ni que conecte esa promesa con su crítica de marzo a la misma formulación en boca de un rival. Las declaraciones de diciembre de 2023 y marzo de 2024 provienen de la misma fuente única, El Observador, en notas retrospectivas publicadas casi un año después de los hechos; no se encontró segunda fuente de otro grupo mediático.
  revision:
    tier: probable
    notas_internas: declaracion_antes (2023-12-14) y las declaraciones de marzo de 2024 citadas como contexto tienen una sola fuente (El Observador, grupo werthein-hochbaum); falta segunda fuente o el video de la entrevista en Telemundo para subir a publicado.
- politico: orsi
  _slug: promesa-no-aumentar-impuestos-iva-compras-exterior
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  tema: economia/impuestos
  declaracion_antes: orsi/2024-11-17-no-vamos-aumentar-impuestos
  declaracion_despues: orsi/2025-08-21-iva-compras-exterior-equidad
  cambio: cambio_parcial
  explicacion: sin_explicacion
  analisis: |-
    El 17 de noviembre de 2024, en el debate presidencial, Orsi prometió no aumentar los impuestos, pero matizó: "Si el contexto me lo impone, andá a saber qué puede pasar"; aclaró que regía "en términos de normalidad". El 21 de noviembre repitió que el contexto internacional podía forzar cambios.

    El 21 de agosto de 2025, como presidente, defendió con "equidad" el nuevo IVA a las compras minoristas por internet en plataformas extranjeras antes exoneradas: una justificación distinta de la contingencia internacional que había planteado como condición en 2024.

    La medida amplía la base del IVA sobre una categoría antes exonerada, sin tocar la tasa general. Son sostenibles dos lecturas: que es un aumento, o que no lo es porque la tasa no cambia. Orsi había calificado un caso distinto —el recargo de IVA a compras con tarjeta del gobierno de Lacalle Pou— como "aumento de tributos", sin un criterio que distinga ambos casos.

    En enero de 2026, la Ley de Presupuesto creó el Impuesto Mínimo Complementario Doméstico (Pilar Dos de la OCDE, sobre grandes multinacionales); sin una declaración de Orsi que la aborde, queda como evidencia de la promesa asociada, no como un giro propio.
  revision:
    tier: publicado
    notas_internas: Las dos declaraciones que sostienen este giro tienen dos fuentes de grupos distintos cada una. El Impuesto Mínimo Complementario Doméstico (Ley 20.446, enero de 2026) no se incorporó como un giro separado por no haber una declaración de Orsi que lo aborde directamente; alcanza a multinacionales con facturación superior a US$ 750 millones. La cita completa del debate del 17/11/2024 es 'No podemos hacer futurología, yo no sé si va a haber una tercera guerra mundial'; la del 21/8/2025, 'La (solución) que se nos ocurre es gravar como cualquier otro producto, o sea que acá se apunta a la equidad'. Orsi calificó el recargo de IVA de Lacalle Pou como 'una muestra clara de aumento de tributos' el 18 de noviembre de 2024.
