  analisis: 'El 30 de marzo de 2019 prometió que con un gobierno del Partido Nacional "se terminó el aumento de impuestos". El 26 de agosto de 2020, al presentar el Presupuesto quinquenal a los legisladores de la coalición, repitió: "aquí una vez más un cumplimiento de un compromiso electoral: no vamos a aumentar los impuestos". Entre las dos fechas ocurrieron el recorte de la exoneración de IVA en tarjetas (marzo de 2020) y la creación por ley 19.874 del "Impuesto Emergencia Sanitaria COVID-19", transitorio y sobre remuneraciones públicas altas (abril de 2020); ninguna de las dos cosas fue mencionada en la reiteración. La posición enunciada es la misma en ambas fechas; el campo explicacion no aplica porque no hay cambio que explicar. Este registro muestra a la vez que sostuvo el compromiso y que lo sostuvo después de los dos hechos que la promesa no-aumentar-impuestos computa en contra.'
