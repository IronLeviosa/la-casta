  revision:
    tier: probable
    notas_internas: La declaración "después" tiene una sola fuente (grupo montevideo-comm) y la frase clave ("no le dieron la información correcta") está en estilo indirecto. Con segunda fuente de otro grupo del 30/09/2022 pasa a publicado. La evidencia de la explicación tiene dos grupos (montevideo-comm y werthein-hochbaum). El 26 de setiembre ya había dicho, sobre otro punto, que "uno siempre está sujeto a equivocaciones"; queda como antecedente, no como parte del análisis publicado por espacio. Sobre la calificación, se evaluó reconocido_explicitamente (propuesta alternativa) y se descartó porque la frase sobre la información recibida está en estilo indirecto en una sola fuente, no es una admisión directa y textual de haber cambiado de posición.
- politico: lacalle-pou
  _slug: criterio-espalda-ancap-2021-2022
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  tema: economia/combustibles
  declaracion_antes: lacalle-pou/2021-11-16-deberiamos-haber-aumentado-ganancia-ancap
  declaracion_despues: lacalle-pou/2022-05-28-espalda-ancap-termino
  cambio: sin_cambio
  explicacion: sin_explicacion
  analisis: 'El 16 de noviembre de 2021 dijo que, con el precio del refinado duplicado, "deberíamos de haber aumentado, pero como ANCAP dio ganancia... dijimos vamos a no cobrarle a la gente más caro el combustible y mantengamos el precio con la ganancia que tuvo el Estado". El 28 de mayo de 2022 dijo que "cada vez que no aumentamos lo que debemos aumentar... eso es sacrificio de Ancap. La espalda básicamente se terminó", anticipando un ajuste al alza. Las dos frases aplican el mismo criterio: el precio se sostiene con las ganancias de ANCAP mientras las haya y se ajusta cuando la empresa no puede absorber la diferencia con la referencia internacional. En el medio, el 25 de enero de 2022, lo había enunciado como regla ("si tiene la espalda suficiente... no aumentamos los combustibles. Si... ANCAP no tiene espalda los vamos a tener que aumentar"). Que "la espalda se terminó" fue una decisión discrecional del Poder Ejecutivo, no un dato externo; en enero de 2023 él mismo dijo que "a veces el gobierno ha subido, a veces no", lo que no altera la consistencia del criterio enunciado. No hay cambio que explicar.'
  revision:
    tier: probable
    notas_internas: La declaración "antes" (2021-11-16) tiene fuente única; el giro hereda ese tier hasta que se consiga segunda fuente o registro de Presidencia del acto de Dolores.
