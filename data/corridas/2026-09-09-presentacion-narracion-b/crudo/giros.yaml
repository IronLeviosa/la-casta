  declaracion_despues: lacalle-pou/2022-03-03-no-hubiera-hecho-ese-compromiso
  cambio: cambio_total
  explicacion: reconocido_explicitamente
  analisis: 'El 30 de marzo de 2019 dijo que si ganaba el Partido Nacional "se terminó el aumento de... los combustibles". El 3 de marzo de 2022, preguntado en Telemundo si había incumplido esa promesa, respondió que "es cierto" que no se pudo cumplir y que, de haber podido prever la pandemia y la guerra en Ucrania con el petróleo duplicado, "obviamente no hubiera hecho ese compromiso". Entre las dos fechas, la ley 19.889 (julio de 2020) fijó que el Poder Ejecutivo aprueba los precios con informe preceptivo de URSEA sobre el precio de paridad de importación; en noviembre de 2021 dijo que "deberíamos de haber aumentado" y que no lo hicieron por las ganancias de ANCAP; en mayo de 2022 dijo que no aumentar es "sacrificio" de ANCAP y que "la espalda básicamente se terminó". La posición pasó de "no habrá aumentos" a "aumentamos según la referencia internacional cuando ANCAP no puede absorber la diferencia": es una contradicción directa de la promesa, no un matiz, y por eso cambio_total. Pesa en contra de esa lectura que los aumentos se contuvieron por debajo del precio de paridad en 2022 y que hubo rebajas en 2023, pero eso no cambia que la posición se invirtió. Reconoció el cambio explícitamente y lo atribuyó a hechos externos documentados (emergencia sanitaria del 13 de marzo de 2020; invasión de Rusia a Ucrania en febrero de 2022). El giro es respecto de la frase de campaña; respecto de la política que el gobierno explicó desde 2021, no hay cambio.'
