        tipo: nota
        titulo: Lacalle dijo que "seguramente" será él quien hable en la cadena de radio y TV por el "No"
        cita: '"Si yo antes del 1° de marzo podía prever" que "el mundo iba a cambiar como cambió" por la pandemia y la invasión de Rusia a Ucrania, "no hubiera hecho ese compromiso", dijo Lacalle Pou ante la pregunta de si incumplió su promesa de campaña de no subir el precio de los combustibles.'
