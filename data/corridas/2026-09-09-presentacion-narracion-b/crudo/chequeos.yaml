  declaracion: barandiaran/1997-11-18-pluna-propiedad-brasilena-1997
  tema: empresas-publicas
  fecha: 1997-11-18
  titulo: "PLUNA: mayoría en manos de VARIG"
  afirmacion: En 1997, la mayor parte del paquete accionario de PLUNA estaba en poder de una compañía de aviación brasileña (VARIG).
  fragmento: su mayor participación accionaría está en poder de una compaf'lía de aviación brasilelia
  calificacion: verdadero
  dato_real:
    valor: |-
      El Pliego de Condiciones de PLUNA fija 51% del capital para el "Adjudicatario": mayoría privada documentada oficialmente.

      La Resolución del Poder Ejecutivo N.º 629/995 (31/05/1995), que autorizó a PLUNA a firmar el contrato de adjudicación, identifica al Pluriconsorcio de Aeronavegación —único oferente de la Licitación Pública Internacional N.º 1/93 y adjudicatario de esas acciones Serie B desde el 21 de junio de 1994— como una entidad cuyo operador es VARIG.

      La identificación de VARIG deja de depender solo de una nota de opinión de La República (28/08/2000, que además calificaba la operación de "irregular", una imputación del medio que no está en el documento oficial) y queda respaldada por la resolución de adjudicación.
    fuentes:
      - url: https://www.impo.com.uy/bases/resoluciones-originales/373-1993/3
        medio: impo
        fecha: 1993-01-01
        tipo: documento_oficial
        titulo: Resolución N.º 373/993 (Pliego de Condiciones, licitación de PLUNA)
        cita: el capital que se integre, Acciones de la Serie A y B de tal forma que la Serie A represente el 49% (cuarenta y nueve por ciento) del capital integrado y la Serie B represente el 51% (cincuenta y uno por ciento) de ese capital. Todas las Acciones de la Serie A pertenecerán a PLUNA
        retrieved_at: 2026-09-09
      - url: https://www.impo.com.uy/bases/resoluciones/629-1995/1
        medio: impo
        fecha: 1995-05-31
        tipo: documento_oficial
        titulo: 'Resolución del Poder Ejecutivo N.º 629/995 (31/05/1995): "Autorización a PLUNA para otorgar contrato de adjudicación con Pluriconsorcio de Aeronavegación y otros"'
        cita: A esta convocatoria, retiraron pliego cinco interesados, Berch Rupenian, AEROLINEAS ARGENTINAS, LAPA, IBERIA Y VARIG, formulando oferta exclusivamente PLURICONSORCIO DE AERONAVEGACION, cuyo operador es VARIG. IV) Que la licitación Nº 1/93 fue adjudicada a dicho único oferente, PLURICONSORCIO DE AERONAVEGACION, en decisión adoptada por unanimidad del Directorio de PLUNA de fecha 21 de junio de 1994
        retrieved_at: 2026-09-09
      - url: https://www.lr21.com.uy/editorial/20400-triste-final-para-una-empresa-del-estado
        medio: la-republica
        fecha: 2000-08-28
        tipo: nota
        titulo: Triste final para una empresa del Estado
        cita: Y casi de inmediato, la empresa brasileña pasó a ser accionista mayoritario de manera irregular.
        retrieved_at: 2026-09-09
  analisis: |-
    Dijo que en 1997 PLUNA estaba en manos de una aerolínea brasileña; lo confirma la Resolución 629/995.

    La resolución identifica a VARIG como operador del consorcio adjudicatario, no como titular directo de las acciones a su nombre; esa distinción no cambia el sentido de lo dicho: la aerolínea brasileña, a través del consorcio que operaba, controlaba la porción mayoritaria del capital de PLUNA.

    La nota de opinión de La República, que antes era la única fuente de la identificación de VARIG y que además calificaba la operación de irregular, deja de ser necesaria para sostener el dato de la propiedad; la imputación de irregularidad sigue siendo del medio, no un hecho respaldado por un documento oficial.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-11-18%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0084).pdf
        medio: parlamento
        fecha: 1997-11-18
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-11-18, N.º 84
        cita: la realidad de esta empresa en 1997 indica que su mayor participación accionaría está en poder de una compaf'lía de aviación brasilelia
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
