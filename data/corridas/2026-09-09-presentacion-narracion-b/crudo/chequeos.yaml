    Dijo que ANTEL tenía 800.000 suscriptores en 1998 y calculó que una consulta al Clearing de Informes por cada uno, a US$1,5 cada una, le transferiría US$1.200.000 a esa empresa privada (la cuenta, 800.000 por US$1,5, da exactamente esa cifra). El resumen financiero oficial de ANTEL para esos años no incluye la cantidad de suscriptores, solo un ratio de empleados por terminal.

