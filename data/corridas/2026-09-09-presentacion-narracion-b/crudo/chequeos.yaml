  declaracion: barandiaran/1996-08-13-caso-focoex-intermediarios-1996
  tema: transparencia-corrupcion
  fecha: 1996-08-13
  titulo: "Crédito de US$137 millones con FOCOEX: cifra confirmada"
  afirmacion: Hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que "absolutamente nadie controló".
  fragmento: aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló
  calificacion: verdadero
  dato_real:
    valor: |-
      El Informe en Minoría de la Comisión Investigadora sobre los convenios con FOCOEX S.A. fija en US$137.053.000 el monto de los negocios en los que FOCOEX intermedió: la cifra citada ("US$137:000.000") coincide, redondeada.

      Barandiarán integró esa Comisión como informante y leyó el informe en la misma sesión: confirma el monto, pero no es una fuente externa a su propia declaración.

      El Diario de Sesiones del Congreso de los Diputados de España (comparecencia de Roberto Cuñat Arias, presidente de FOCOEX, 1995-03-01) confirma por separado que la empresa operaba con créditos cuestionados por el Tribunal de Cuentas español, pero no incluye esta cifra puntual.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: Además, si algo quedó claro es que aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló.
        retrieved_at: 2026-09-09
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Informe en Minoría de la Comisión Investigadora sobre los Convenios realizados por la Administración Pública uruguaya con FOCOEX S.A., publicado dentro del Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: Esta ~mpresa realiza la intermediación en la gran mayoría de los negocios analizados por esta Comisión que alcanzaron a un monto de US$ 137.053.000.
        retrieved_at: 2026-09-09
      - url: https://www.congreso.es/web/guest/busqueda-de-publicaciones?p_p_id=publicaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&_publicaciones_mode=mostrarTextoIntegro&_publicaciones_legislatura=V&_publicaciones_id_texto=(CDC199503010438.CODI.)
        medio: congreso-espana
        fecha: 1995-03-01
        tipo: diario_de_sesiones
        titulo: DS. Congreso de los Diputados, Comisiones, núm. 438, de 01/03/1995
        cita: COMPARECENCIA DEL SEÑOR PRESIDENTE DE LA SOCIEDAD ESTATAL «FOMENTO DELCOMERCIO EXTERIOR, S. A.» (FOCOEX), PARA INFORMAR SOBRE LASIRREGULARIDADES APRECIADAS EN LA CITADA EMPRESA POR EL TRIBUNAL DECUENTAS EN EL INFORME DE FISCALIZACION REMITIDO AL CONGRESO DE LOSDIPUTADOS EL 29-11-94. A SOLICITUD DEL GRUPO PARLAMENTARIO POPULAR.
        retrieved_at: 2026-09-09
  analisis: |-
    Dijo que hubo un crédito de US$137.000.000 con FOCOEX; el Informe en Minoría fija ese monto en US$137.053.000, cifra correcta.

    Ese informe es el mismo documento parlamentario del que Barandiarán fue coautor, como informante en minoría: confirma el monto, pero la afirmación de que "nadie controló" la operación es la conclusión del propio informe, no un hallazgo de una fuente ajena a su posición en la investigación.

    El Diario de Sesiones del Congreso de los Diputados de España, con la comparecencia del entonces presidente de FOCOEX ante irregularidades detectadas por el Tribunal de Cuentas español, corrobora que la empresa tenía créditos cuestionados, aunque no menciona esta cifra en particular.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: Además, si algo quedó claro es que aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló.
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
    notas_internas: "La cifra queda confirmada por el propio Informe en Minoría del que Barandiarán fue coautor como informante; no hay documento independiente (Tribunal de Cuentas uruguayo) que la corrobore desde afuera, pero cumple la regla dura: es diario de sesiones / documento oficial, y el monto coincide casi exacto."
