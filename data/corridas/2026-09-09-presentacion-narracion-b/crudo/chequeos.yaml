  revision:
    tier: probable
    que_falta: Ocho de las veinticuatro fuentes de dato_real son archivos que no se pueden leer como texto plano (planillas de URSEA y la ANP, un csv de ANCAP, un zip del MIEM, y dos consultas a APIs del Banco Central de Uruguay y de Brasil), así que quedan marcadas como verificación manual. Ese tipo de fuente exige la firma del mantenedor antes de publicarse.
    notas_internas: |-
      Calificación cambiada de discutible a falso. La razón anterior de discutible ya no aplica: decía que "por primera vez" no se había reconstruido, y el gráfico de esta misma corrida es esa reconstrucción; la otra razón que daba (que el documento oficial debía enunciar la conclusión, no solo dar los insumos) no es una regla del sitio -ya la había corregido el commit 0f913e9-. El fundamento nuevo es que "por primera vez", el elemento distintivo de la frase, es falso bajo cualquier combustible o convención de cálculo probada; el mismo criterio debería aplicarse a un "por primera vez" de cualquier otro presidente con evidencia documentada de que ya había pasado antes.
      Dos objeciones de la crítica quedan documentadas pero no resueltas en esta pasada, ninguna bloqueante: el congelamiento del precio uruguayo entre junio de 2019 y diciembre de 2020 sigue apoyado en parte en el índice de UNVENU (asociación privada de estacioneros) en vez de la página "Decretos Precios" de ANCAP que la crítica propuso como reemplazo parcial (esa página tampoco es un índice completo: le faltan 171/021 y 205/021 en su pestaña de 2021); y el año 2001 de la afirmación original ("2001 o 2002") no pudo probarse por falta de serie oficial uruguaya de ese año -ya está dicho en grafico.nota, no solo acá-.
