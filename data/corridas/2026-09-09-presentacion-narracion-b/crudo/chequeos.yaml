        titulo: Diario de Sesiones de la Cámara de Representantes, 1998-05-12, N.º 17
        cita: ANTEL tiene 800.000 suscriptores; una sola consulta a la base de datos por cada usuario, a US$ 1,5 cada una -que es lo que cobra- significaría una transfe- rencia de US$ 1 :200.000 al Clearing de Informes.
