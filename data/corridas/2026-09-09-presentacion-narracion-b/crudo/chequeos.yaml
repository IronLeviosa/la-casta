  declaracion: barandiaran/1996-08-13-focoex-comision-estellano-1996
  tema: transparencia-corrupcion
  fecha: 1996-08-13
  titulo: "Comisión del 4% a Estellano en FOCOEX: no verificada"
  afirmacion: Un intermediario, el señor Estellano, cobró una comisión del 4% del crédito con FOCOEX, unos US$5.000.000.
  fragmento: cobra el 4% de comisión, es decir, US$ 5:000.000
  calificacion: discutible
  dato_real:
    valor: |-
      El Informe en Minoría sobre FOCOEX dice que la Comisión no accedió al contrato de Estellano ni a la documentación de comisiones: no confirma el 4% (US$5.000.000).

      Es el mismo documento ya citado para el chequeo del crédito de US$137.000.000. Agrega que, según lo declarado por los propios jerarcas de FOCOEX ante la Comisión, las comisiones no habrían podido superar el 5% en las operaciones con financiación concesional: un techo distinto (más alto) que el 4% que Barandiarán citó en Sala, y tampoco una cifra puntual verificada.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: el senor Estellano, que cobra el 4% de comisión, es decir, US$ 5:000.000 -¡US$ 5:000.0001-, también es intermediario.
        retrieved_at: 2026-09-09
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Informe en Minoría de la Comisión Investigadora sobre los Convenios realizados por la Administración Pública uruguaya con FOCOEX S.A., publicado dentro del Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: No pudimos acceder a la copia del contrato del seflor Estellano con FOCOEX, tampoco la documentación vinculada al pago de comisiones y de órdenes de pago emitidas en la ejecución de los contratos ni el monto de las comisiones pagadas por los negocios realizados con el Uruguay.
        retrieved_at: 2026-09-09
  analisis: |-
    Dijo que Estellano cobró 4% (US$5.000.000) en el crédito con FOCOEX. El Informe en Minoría no confirma la cifra.

    El informe sí recoge que, según lo declarado por los jerarcas de FOCOEX, las comisiones no habrían podido superar el 5%, un techo distinto del 4% que mencionó Barandiarán. Ninguna de las dos cifras está documentada con precisión.

    Queda discutible con documento oficial en mano: no hay contradicción entre el 4% dicho y el techo del 5% declarado por FOCOEX —son compatibles entre sí—, pero tampoco hay una fuente que fije el monto exacto de la comisión de Estellano.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: el senor Estellano, que cobra el 4% de comisión, es decir, US$ 5:000.000 -¡US$ 5:000.0001-, también es intermediario.
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
    notas_internas: El resolvedor atribuyó el techo del 5% al "testimonio del contador Testoni"; verificado con pnpm fuente, ese pasaje del informe lo atribuye a "lo declarado por los jerarcas de FOCOEX", no a Testoni (que es un Diputado nombrado en otra parte del mismo documento, autor de la denuncia original ante la Comisión Preinvestigadora). Se corrige la atribución acá.
