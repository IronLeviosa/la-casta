    valor: |-
      El BCU: US$1.645,3, 1.913,4, 2.147,6 y 2.439,6 millones (1993-1996).

      Esas cifras dan variaciones interanuales de +16,3 % (1994), +12,2 % (1995) y +13,6 % (1996), los tres años inmediatamente anteriores al discurso de diciembre de 1997, publicadas en la Revista de Economía usada en el prospecto de colocación de Bonos Globales (1997). Barandiarán dijo 16 %, 10 % y 13 %: el primer y el tercer número difieren en menos de un punto porcentual; el segundo, en 2,2 puntos.
    fuentes:
