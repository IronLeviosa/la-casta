  analisis: |-
    Dijo "después de 10 años"; con la cifra de 2020 vigente hoy, el último ejercicio negativo antes de 2024 fue 2015, nueve años antes: un año de diferencia, dentro del margen de imprecisión.
    Los estados financieros emitidos en su momento mostraban una pérdida de USD 12,1 millones en 2020; en 2021 Ancap corrigió un error de cálculo del impuesto a la renta de 2018 a 2020 y reexpresó ese resultado como una ganancia de USD 9,1 millones, la cifra vigente desde entonces. Con la cifra original, el último ejercicio negativo habría sido 2020, cuatro años antes de 2024, una distancia que no sostiene "10 años"; pero esa cifra ya estaba superada desde 2021, antes de la conferencia.
    2014 también fue un ejercicio negativo (pérdida de USD 323,2 millones), aunque queda fuera de la década que menciona Orsi. El ejercicio 2023, inmediatamente anterior a la pérdida de 2024, fue positivo (USD 85,3 millones), de modo que tampoco hubo una racha ininterrumpida de diez años en positivo antes de 2024.
    El expresidente de Ancap del gobierno anterior, consultado por El Observador, no desmintió el dato: remitió a los mismos estados contables y señaló que aun con el mecanismo de precios que beneficiaba a Ancap hasta 2019, "aún así" había sido necesaria una capitalización en 2015, consistente con un resultado negativo ese año. Ningún medio de los que cubrieron la conferencia cotejó la afirmación contra el balance de 2020 vigente en ese momento.
