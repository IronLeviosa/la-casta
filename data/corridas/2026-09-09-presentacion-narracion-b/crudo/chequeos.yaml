  tema: economia
  fecha: 1997-12-11
  titulo: "Uruguay: más gasto en defensa que Chile y Brasil"
  afirmacion: Uruguay tenía un presupuesto militar per cápita más alto que países como Chile o Brasil.
  fragmento: Uruguay tiene un presupues- to militar per cápita más alto que el de países como Chile o Brasil
  calificacion: verdadero
  dato_real:
    valor: |-
      Según SIPRI (1997): US$178,92 per cápita en Uruguay, US$142,95 en Chile, US$84,23 en Brasil.

