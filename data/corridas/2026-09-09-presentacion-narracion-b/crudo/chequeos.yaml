  declaracion: barandiaran/1997-06-25-genocidio-armenio-reconocimiento-1997
  tema: derechos-humanos
  fecha: 1997-06-25
  titulo: 'Uruguay, "primer país del mundo" en reconocer el genocidio armenio: la ley de 1965 no lo dice'
  afirmacion: Uruguay fue, en 1965, el primer país del mundo en reconocer oficialmente el genocidio armenio.
  fragmento: En 1965, fue el primer país en el mundo que reconoció oficialmente el genocidio armenio
  calificacion: discutible
  dato_real:
    valor: |-
      La Ley N.º 13.326, promulgada el 22/04/1965, declaró el 24 de abril "Día de recordación de los mártires armenios" en homenaje a los armenios asesinados en 1915, autorizó a los descendientes de armenios en la función pública a faltar ese día y pidió a las emisoras oficiales dedicarle parte de su programación.

      El texto de la ley no dice en ningún pasaje que Uruguay haya sido "el primer país del mundo" en reconocer el genocidio armenio; esa caracterización circula en la prensa uruguaya y en organizaciones de la comunidad armenia, pero no se cotejó contra un registro internacional comparativo de reconocimientos de genocidio.
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/13326-1965
        medio: impo
        fecha: 1965-04-22
        tipo: documento_oficial
        titulo: "Ley N.º 13.326: Declaración Día de Recordación de los Mártires Armenios. Denominación de Escuela Pública N.º 156"
        cita: Declárase el 24 de abril próximo "Día de recordación de los mártires armenios", en homenaje a los integrantes de esa nacionalidad asesinados en 1915.
        retrieved_at: 2026-09-09
  analisis: |-
    Dijo que Uruguay fue, en 1965, el primer país del mundo en reconocer oficialmente el genocidio armenio. La ley que efectivamente se aprobó ese año crea un día de recordación y no contiene esa frase ni compara a Uruguay con otros países.

    Que la ley no lo diga no prueba que el dato sea falso: la afirmación de que Uruguay fue pionero circula en fuentes secundarias y podría surgir de otro documento que no se relevó. Sin ese cotejo, la afirmación queda sin poder confirmarse ni descartarse.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-06-25%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0040).pdf
        medio: parlamento
        fecha: 1997-06-25
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-06-25, N.º 40
        cita: En 1965, fue el primer país en el mundo que reconoció oficialmente el genocidio armenio
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
