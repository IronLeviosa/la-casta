      Segunda pasada del investigador resolvió los 6 puntos bloqueantes de critica.md (0.a-0.f): medio mef creado, afirmacion reescrita sin período impuesto, desglose 670/940/640 y promesa de campaña de US$900M incorporados al dato_real, Telenoche corregido a entrevista aparte (dos días después, no la misma ronda de prensa), Mef 12-07-21.pdf reatribuido de medio: parlamento a medio: mef, _faltante: dato_oficial declarado. Calificación discutible por regla, no por ausencia de documento: el documento oficial (660, 2020) sostiene la magnitud pero mide gasto estructural ex-COVID, no un resultado fiscal neto del período que evoca la declaración. Tier bajado de publicado a probable en esta calibración: pnpm validar --red marca Mef 12-07-21.pdf (dato_real.fuentes) sin respuesta HTTP y sin copia en Wayback; el texto ya está en el corpus propio (75.736 caracteres, bajado 2026-09-07, cita confirmada) pero diputados.gub.uy no resuelve la conexión en vivo en este momento. Se marcó verificacion: manual en esa fuente puntual, lo que exige aprobación humana y tope de tier en probable hasta que /revisar corra pnpm archivar y, si corresponde, se apruebe. Que_falta, además: actualización oficial del ahorro para el tramo de 2021 transcurrido a la fecha de la declaración, y video íntegro de la entrevista en LN+ (no localizado en esta corrida).
      Presentación (2026-09-07): dato_real.valor se condensó a cifra, unidad, período y fuente; la nota de El Observador del 09/02/2021 (consulta sobre la promesa de campaña de US$900M) también fija el resultado de 2020 en 'ahorros por US$660 millones', corroborando la cifra del MEF de forma independiente.
- politico: lacalle-pou
  _slug: combustibles-mas-baratos-brasil
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  declaracion: lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto
  tema: economia/combustibles
  fecha: 2022-03-27
  titulo: "Más baratos que Brasil «por primera vez desde 2001»: no lo fue"
  afirmacion: En marzo de 2022, Lacalle Pou dijo que, por primera vez desde 2001 o 2002 según su propio cálculo, tenía combustibles más baratos en Uruguay que en Brasil.
  fragmento: por primera vez —según creía, desde 2001 o 2002— tenía combustibles más baratos que Brasil
  calificacion: falso
  exhaustivo: false
  dato_real:
    valor: |-
      La nafta uruguaya ya fue más barata que la brasileña en 28 meses (2007-2011); el gasoil, en 13 meses desde 2002.
      Precios oficiales de la semana del 27/03/2022: la nafta (Gasolina Súper 95) costaba USD 1,81 por litro en Uruguay (Decreto 64/022) y USD 1,51 en Brasil (ANP, Gasolina C comum), 19,6% más cara en Uruguay. Conversión al tipo de cambio de referencia del BCU y el BCB del 25/03/2022.
      El gasoil uruguayo (Gas Oil 50S) costaba USD 1,30 por litro contra USD 1,40 del Diesel S10 brasileño, 6,8% más barato; emparejado por especificación de azufre (Gas Oil 10S uruguayo, USD 1,62), resulta 16,2% más caro que el mismo S10. Ningún documento oficial fija cuál emparejamiento corresponde.
      Tres semanas antes, el CED medía la nafta uruguaya 38% más cara que en Brasil y el gasoil 17% más caro (03/03/2022); en esas cuatro semanas la ANP registró en Brasil una suba de 18,10% en el diésel y 9,91% en la nafta, mientras los precios uruguayos, fijados por decreto, no cambiaron.
      En la serie mensual oficial 2002-2022 (URSEA y decretos del Poder Ejecutivo para Uruguay; ANP para Brasil), la nafta uruguaya fue más barata que la brasileña en 28 de los 252 meses de la serie, todos entre mayo de 2007 y mayo de 2011; en los doce meses de 2022 estuvo por encima, entre 19,8% (marzo) y 101,1% (diciembre).
      El gasoil (50S, o su antecesor sin grado, contra el diesel brasileño de cada época) fue más barato en 13 meses: agosto y diciembre de 2002; enero, febrero, abril y mayo de 2003; enero a abril de 2006; abril y mayo de 2009; y marzo de 2022. Los dos combustibles fueron más baratos el mismo mes solo en abril y mayo de 2009 (nafta 15,3% y gasoil 3,4% más baratos en mayo).
