    modelo: claude-sonnet-5
  declaracion: lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto
  tema: economia/combustibles
  fecha: 2022-03-27
  titulo: "Sobrecostos de USD 1.700 millones: sin dato oficial"
  afirmacion: En el quinquenio anterior (2015-2019 según el cálculo disponible) los consumidores uruguayos pagaron más de USD 1.700 millones por encima del precio de paridad de importación de nafta y gasoil.
  fragmento: más de USD 1.700 millones de sobrecostos
  calificacion: discutible
  exhaustivo: false
  dato_real:
    valor: |-
      El único cálculo público (CED, privado) da USD 443 millones en nafta y USD 1.337 millones en gasoil (2015-2019), USD 1.780 millones en total.
      El CED es un centro de estudios privado, no un organismo oficial, con vínculo institucional documentado con Lacalle Pou. El mismo informe muestra sobreprecios de magnitud comparable en 2010-2014 (USD 1.181 millones en gasoil) y consigna que, al inicio de su gobierno, este reconoció un sobreprecio de hasta $2,97 por litro (el "factor x"), con el objetivo de eliminarlo en tres años.
    fuentes:
      - url: https://todoelcampo.com.uy/wp-content/uploads/2022/03/CED-Combustibles.-Boletin-Macroeconomico-N%C2%B027.pdf
        medio: ced
        fecha: 2022-03-03
        tipo: nota
        cita: En el periodo 2015-2019, la nafta presentó un sobreprecio de USD 443 millones, mientras que los consumidores uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la referencia de PPI.
        retrieved_at: 2026-09-07
      - url: https://catalogodatos.gub.uy/dataset/ursea-ppi_vs_pe_v2
        medio: catalogodatos-gub-uy
        fecha: 2020-04-01
        tipo: documento_oficial
        cita: Se presentan las series mensuales con los Precios de Paridad de Importación (PPI) de los combustibles líquidos calculados por la URSEA.
        retrieved_at: 2026-09-07
      - url: https://www.elobservador.com.uy/nota/el-precio-de-la-nafta-y-el-gasoil-que-muestran-los-numeros-de-este-gobierno-y-el-fa--20223316150
        medio: el-observador
        fecha: 2022-03-07
        tipo: nota
        titulo: "El debate por el precio de la nafta y el gasoil: qué muestran los números de este gobierno y el FA"
        cita: durante los años 2015 a 2019 "la nafta presentó un sobreprecio de US$ 443 millones, mientras que los consumidores uruguayos de gasoil pagaron aproximadamente US$ 1.337 millones más que la referencia de PPI", observó el documento
        retrieved_at: 2026-09-07
      - url: https://www.elobservador.com.uy/nota/el-precio-de-la-nafta-y-el-gasoil-que-muestran-los-numeros-de-este-gobierno-y-el-fa--20223316150
        medio: el-observador
        fecha: 2022-03-07
        tipo: nota
        titulo: "El debate por el precio de la nafta y el gasoil: qué muestran los números de este gobierno y el FA"
        cita: En el punto de partida, el gobierno reconoció un sobreprecio de hasta $ 2,97 por litro (llamado factor x) en la tarifa del gasoil y las gasolinas por la incidencia del subsidio que tiene el supergás, el sobrecosto por la mezcla con biocombustibles, las pérdidas de Ancap en el pórtland y otras ineficiencias del ente. En la hoja de ruta del gobierno, el objetivo era que ese sobreprecio se suprimiera en un plazo de tres años.
        retrieved_at: 2026-09-07
  analisis: |-
    Sin dato oficial; la única estimación (CED, privada) da un monto similar.
    La cifra depende de un cálculo que combina una serie oficial (el PPI de URSEA) con datos de volúmenes que el CED no publica, así que no se puede reproducir con la fuente oficial sola; el propio documento además trae el dato de gasoil con dos valores distintos (1137 y 1.337) sin explicar la diferencia, y la cifra de Lacalle Pou solo cierra con la lectura de 1.337.
    El mismo cálculo del CED muestra sobreprecios de magnitud comparable en el quinquenio anterior (2010-2014, USD 1.181 millones en gasoil) y un componente —el "factor x" que el propio gobierno de Lacalle Pou reconoció— que antecede a la gestión a la que le atribuye el sobrecosto.
    El CED, además, tiene un vínculo institucional documentado con Lacalle Pou (discursos suyos en sus cenas anuales, liderazgo de uno de sus programas). Sin documento oficial que sostenga el monto, la calificación queda en discutible.
