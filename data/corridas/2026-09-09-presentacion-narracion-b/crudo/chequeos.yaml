  titulo: "Ancap: US$41 millones de ganancia en 2019, US$118 millones de pérdida en 2024"
  afirmacion: Orsi afirmó que en 2019 Ancap tuvo una ganancia de 41 millones de dólares y que en el ejercicio 2024 tuvo un resultado de pérdida de 118 millones de dólares.
  fragmento: en el año 19 ANCAP daba 41 millones de dólares de ganancia, y en el año 24 el resultado es un resultado de pérdida de 118 millones
  dato_real:
    valor: |-
      Los balances auditados de Ancap confirman ambas cifras: pérdida de USD 118,4 millones en 2024 y ganancia de USD 39,2 a 41,7 millones en 2019 (según se convierta al cierre o al promedio del tipo de cambio de cada año).
      El resultado de 2019 fue una ganancia de $ 1.464.281.136; el de 2024, una pérdida de $ 5.217.605.497. Presidencia difundió "39 millones" en 2020 (cierre) y Orsi dio "41" en 2025 (promedio): es el mismo resultado auditado bajo dos convenciones distintas, no dos cifras que se contradigan.
      La pérdida de 2024 se explica por la parada de 297 días de la refinería de La Teja (agosto 2023-junio 2024), USD 55 millones resignados por vender combustible bajo el precio de paridad de importación y USD 24 millones de subsidio al supergás (El Observador, con datos de Ancap).
