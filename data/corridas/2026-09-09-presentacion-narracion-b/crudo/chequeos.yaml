  analisis: |-
    No fue la primera vez, según la serie oficial 2002-2022.
    El gasoil se da vuelta según el emparejamiento: contra el Diesel S10 brasileño por posición de mercado (Gas Oil 50S, el de mayor volumen), Uruguay fue 6,8% más barato esa semana y 3,7% en el promedio de marzo; contra el mismo S10 por especificación de azufre (Gas Oil 10S), fue 16,2% más caro esa semana y estuvo por encima de Brasil los 24 meses de 2021 y 2022 sin excepción. Ningún documento oficial fija cuál de los dos emparejamientos corresponde.
    El cruce de esa semana coincide con una suba de precios del lado brasileño de 18,10% (diésel) y 9,91% (nafta) en las cuatro semanas previas, mientras los precios uruguayos, fijados por decreto, no cambiaron en ese lapso.
    En la serie completa, el cruce más robusto es mayo de 2009: la nafta uruguaya costó 15,3% menos y el gasoil 3,4% menos que la brasileña ese mes, con los dos países en cobertura directa y sin ningún valor reconstruido. Los cruces de nafta de 2007 y 2011 son más frágiles (diferencias de 0,3% a 3,8%); los de 2009-2010 llegan a 15,3% y no dependen de la convención cambiaria.
    Ningún cruce cambia de signo entre las dos convenciones de cálculo probadas (promedio de las razones mensuales o razón de los promedios anuales) ni entre el dólar billete y el interbancario.
    La calificación es falsa porque el elemento distintivo de la frase -que fuera la primera vez en veinte años- queda refutado por la serie oficial bajo cualquier lectura, más allá de que la comparación puntual de esa semana haya sido mixta.
