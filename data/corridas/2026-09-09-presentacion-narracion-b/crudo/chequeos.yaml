  titulo: "Exportaciones: 16%, 10% y 13%, según el BCU"
  afirmacion: Las empresas uruguayas habían incrementado sus exportaciones en cada uno de los tres años anteriores a diciembre de 1997, en un 16 %, un 10 % y un 13 %, mientras la desocupación seguía aumentando salvo una pequeña disminución en el último año.
