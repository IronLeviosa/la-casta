- politico: batlle
  declaracion: batlle/2005-11-28-rebaja-impuestos-empresas-sociedades-anonimas
  tema: economia/impuestos
  fecha: 2005-11-28
  titulo: Rebaja de impuestos para los bancos
  afirmacion: Las rebajas de impuestos para los bancos previstas en la reforma tributaria alcanzarían
    unos USD 15 millones.
  fragmento: de unos USD 15 millones para los bancos
  calificacion: discutible
  dato_real:
    valor: >-
      Además de bajar la tasa del IRIC al 25% para los bancos, como para el resto de las empresas,
      el proyecto de reforma tributaria eliminó dos tributos específicos del sector financiero: el
      Impuesto a los Activos de las Empresas Bancarias (IMABA) y el Impuesto de Control del Sistema
      Financiero (ICOSIFI).


      Según la serie de recaudación anual de la DGI, esos dos impuestos recaudaron en 2005
      1.151.522.983 pesos (IMABA) y 196.324.310 pesos (ICOSIFI): unos USD 47,0 millones y USD 8,0
      millones respectivamente al tipo de cambio promedio de ese año (24,4786 pesos por dólar, según
      el Banco Mundial), en conjunto unos USD 55 millones, más de tres veces los USD 15 millones que
      menciona Batlle.


      Esto sugiere que la cifra de Batlle no incluía la eliminación de esos dos tributos
      específicos, sino solo una parte de la rebaja prevista para el sector. No hay un documento
      publicado que desglose qué componía exactamente esos USD 15 millones.
