  titulo: El primer gobierno de Vázquez (2005-2010) creó el IRPF con la Ley 18.083
  afirmacion: Dijo que en los primeros cinco años de gobierno de Tabaré Vázquez (2005-2010) no tuvo
    que subir impuestos.
  fragmento: en esos primeros cinco años no tuvo que hacer ajuste fiscal, no tuvo que subir impuestos
    o devaluar
  calificacion: falso
  dato_real:
    valor: El primer gobierno de Vázquez promulgó la Ley 18.083 (Reforma Tributaria) el 27/12/2006, que
      creó el Impuesto a la Renta de las Personas Físicas (IRPF) —un tributo que no existía antes—
      junto con el Impuesto a las Rentas de las Actividades Económicas (IRAE) y el Impuesto de
      Asistencia a la Seguridad Social (IASS), y derogó o modificó otros gravámenes. El IRPF entró
      en vigencia el 1/07/2007, dentro del primer quinquenio de Vázquez (2005-2010), reglamentado
      por los Decretos 148/007 y 208/007.
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/18083-2006
        medio: impo
        fecha: 2006-12-27
        tipo: documento_oficial
        titulo: Ley N° 18.083, Reforma Tributaria
        cita: IMPUESTO A LA RENTA DE LAS PERSONAS FISICAS Artículo 8
        retrieved_at: 2026-09-16
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://elobservador.com.uy/nota/la-ultima-entrevista-de-batlle-con-el-observador-20161025500
        medio: el-observador
        fecha: 2016-10-25
        tipo: nota
        titulo: La última entrevista de Batlle con El Observador
        cita: Por una razón muy sencilla, en esos primeros cinco años no tuvo que hacer ajuste fiscal, no
          tuvo que subir impuestos o devaluar.
        retrieved_at: 2026-09-16
  analisis: >-
    Batlle dijo que en los primeros cinco años de gobierno de Tabaré Vázquez (2005-2010) no tuvo que
    subir impuestos. La Ley 18.083, promulgada el 27/12/2006 por ese mismo gobierno, creó el
    Impuesto a la Renta de las Personas Físicas (IRPF) -un tributo que no existía antes- junto con
    el IRAE y el IASS, y entró en vigencia el 1/07/2007, dentro de ese primer quinquenio.


    La afirmación es falsa: el primer gobierno de Vázquez sí creó un impuesto nuevo durante ese
    período, el más importante de la reforma tributaria uruguaya de las últimas décadas, y lo hizo
    entrar en vigencia antes de terminar el mandato.
