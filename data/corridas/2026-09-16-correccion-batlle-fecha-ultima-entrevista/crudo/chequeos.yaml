  analisis: >-
    Batlle dijo, en lo que se publicó como su última entrevista, que "los impuestos los van a
    empezar a cobrar desde enero" de 2017. La Ley 19.438 de Rendición de Cuentas del ejercicio 2015,
    promulgada el 14 de octubre de 2016 y publicada el 26 de octubre, fija en su artículo 2 que rige
    desde el 1° de enero de 2017: la fecha que dio es exacta.


    Cuando habló, el 21 de setiembre de 2016, la ley todavía no tenía sanción definitiva: el Senado
    la había modificado el 14 de setiembre, la Cámara de Representantes recién la sancionó el 5 de
    octubre y el Poder Ejecutivo la promulgó el 14 de octubre, todo después de la entrevista. Su
    previsión se cumplió tal como terminó votándose.
