        titulo: Rendición de Cuentas - Ejercicio 2013, Ministerio de Economía y Finanzas
        cita: En 2013 el Sector Público Consolidado registró un déficit de 2,4% del PIB10, con una mejora de
          0,4% del PIB en relación al año anterior.
        retrieved_at: 2026-09-16
  evidencia:
    nivel: reportado
    fuentes:
      - url: https://elobservador.com.uy/nota/la-ultima-entrevista-de-batlle-con-el-observador-20161025500
        medio: el-observador
        fecha: 2016-10-25
        tipo: nota
        titulo: La última entrevista de Batlle con El Observador
        cita: empezó a repartir dinero y generarle al país un déficit que cuando llega el doctor Vázquez,
