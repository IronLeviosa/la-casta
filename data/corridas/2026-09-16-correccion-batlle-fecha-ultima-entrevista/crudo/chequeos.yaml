  calificacion: verdadero
  dato_real:
    valor: La Ley N.º 19.438 (Rendición de Cuentas, ejercicio 2015), que modificó tramos y tasas del
      IRPF, establece en su artículo 2 que "la presente ley regirá a partir del 1° de enero de 2017,
      excepto en aquellas disposiciones que en forma expresa establezcan otra fecha de vigencia". Se
      publicó el 26 de octubre de 2016, dos días después de la muerte de Batlle.
