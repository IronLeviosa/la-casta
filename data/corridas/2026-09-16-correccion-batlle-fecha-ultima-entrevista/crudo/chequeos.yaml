  titulo: Evolución del déficit fiscal durante el gobierno de Mujica (2010-2015)
  afirmacion: Dijo que Mujica, tras ser electo, "empezó a repartir dinero" y le generó al país un
    déficit que quedó pendiente para el gobierno siguiente.
  fragmento: empezó a repartir dinero y generarle al país un déficit que cuando llega el doctor Vázquez
  calificacion: discutible
  dato_real:
    valor: >-
      Según el Ministerio de Economía y Finanzas, el déficit del Sector Público Consolidado llegó a
      2,8% del PIB en 2012 y bajó a 2,4% del PIB en 2013, dentro del segundo mandato de Mujica
      (2010-2015).


      No se pudo completar el dato del cierre de 2014, último año completo del gobierno de Mujica y
      el año inmediato anterior al traspaso a Vázquez. El informe "Rendición de Cuentas - Ejercicio
      2014" del Ministerio de Economía y Finanzas es un PDF escaneado sin texto legible todavía.
    fuentes:
