  motivo: >-
    Diez registros sobre la última entrevista de Jorge Batlle a El Observador -dos declaraciones,
    cuatro menciones a otros políticos y cuatro chequeos que nacen de esas declaraciones- llevaban
    como fecha el 24 de octubre de 2016, el día de la muerte de Batlle, con la explicación de que la
    fuente no decía cuándo se había hecho la entrevista. Una relectura de la nota completa, no solo
    del fragmento con las citas, mostró que sí lo dice: al principio, antes de las preguntas y
    respuestas, la nota presenta el texto como "un resumen de la entrevista con Leandro Gómez,
    realizada el 21 de setiembre de 2016". El resumen recortado que se había leído antes empezaba a
    mitad de la entrevista y no traía ese párrafo.

    Se corrige la fecha a 21 de setiembre de 2016 en los diez registros y se reescriben los dos
    resúmenes que decían que la fecha no estaba documentada, agregando que la entrevista fue hecha
    por el periodista Leandro Gómez y publicada el 25 de octubre, un día después de la muerte de
    Batlle. El chequeo sobre la vigencia de la Ley de Rendición de Cuentas 2015 ya explicaba, con la
    fecha real, que la ley todavía no tenía sanción definitiva del Parlamento cuando Batlle habló -el
    Senado la había modificado el 14 de setiembre y la Cámara de Representantes recién la sancionó
    el 5 de octubre, con promulgación el 14 de octubre-, lo que se confirmó contra la ficha pública
    del trámite parlamentario. Ninguna calificación de los cuatro chequeos cambia.
