        cita: >-
          Por supuesto que decimos lo que pensamos y lo que vamos a hacer.
          Prometer es fácil. El tema es cumplir, ser coherentes, ser
          honestos. ¿Se olvidaron de sus promesas de no tocar la edad
          jubilatoria ni los combustibles?
        retrieved_at: 2026-09-04
      - url: https://ladiaria.com.uy/elecciones/articulo/2024/9/yamandu-orsi-respondio-a-lacalle-pou-el-tema-es-cumplir-se-olvidaron-de-sus-promesas-de-no-tocar-la-edad-jubilatoria-ni-los-combustibles
