          combustibles?"
        cita: >-
          se preguntó si este gobierno se olvidó "de sus promesas de no
          tocar la edad jubilatoria ni los combustibles"
        retrieved_at: 2026-09-04
      - url: https://montevideo.com.uy/Noticias/Delgado-salio-al-cruce-de-Orsi-por-promesa-incumplida-sobre-precios-de-los-combustibles-uc900214
        medio: montevideo-portal
        fecha: 2024-09-14
        tipo: nota
        titulo: >-
