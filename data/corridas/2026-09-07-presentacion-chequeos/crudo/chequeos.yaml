  calificacion: verdadero
  analisis: "Orsi dijo que Ancap ganó 41 millones de dólares en 2019 y perdió 118 millones en 2024;
    los estados financieros auditados de Ancap confirman ambas cifras bajo las dos convenciones de
    tipo de cambio (promedio y cierre) que la propia empresa publica en el mismo documento: el
    resultado de 2019 ($ 1.464.281.136) equivale a USD 41,7 millones al promedio y USD 39,2 millones
    al cierre, y el de 2024 ($ 5.217.605.497 de pérdida) equivale a USD 118,4 millones al cierre. No
    son dos comunicados oficiales que se contradigan, sino el mismo resultado auditado convertido
    con dos convenciones distintas que Ancap usa en distintos comunicados; bajo cualquiera de las
    dos aplicada a ambos años por igual, el signo y el orden de magnitud de la comparación de Orsi
    se sostienen (+39,2 contra -118,4 al cierre; +41,7 contra -129,7 al promedio). La pérdida de
    2024 se explica, según Ancap y El Observador, por la parada de 297 días de la refinería de La
    Teja, la venta de combustible por debajo del precio de paridad de importación (USD 55 millones
    resignados) y el subsidio al supergás (USD 24 millones)."
  revision:
    tier: publicado
