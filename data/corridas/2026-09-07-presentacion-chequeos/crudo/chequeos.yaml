- _id: lacalle-pou/2022-03-27-combustibles-mas-baratos-brasil
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  politico: lacalle-pou
  declaracion: lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto
  tema: economia/combustibles
  fecha: 2022-03-27
  afirmacion: En marzo de 2022, Lacalle Pou dijo que, por primera vez desde 2001 o 2002 según su
    propio cálculo, tenía combustibles más baratos en Uruguay que en Brasil.
  fragmento: por primera vez —según creía, desde 2001 o 2002— tenía combustibles más baratos que Brasil
  calificacion: discutible
  exhaustivo: false
  dato_real:
    valor: 'Comparando precios oficiales al público en dólares para la semana del 27 de marzo de 2022.
      NAFTA: en Uruguay la Gasolina Súper 95 costaba $ 74,88 por litro (Decreto N° 64/022, PVP
      vigente desde el 1° de marzo de 2022); convertida al tipo de cambio del BCU del 25/03/2022
      ("DLS. USA BILLETE", compra=venta $ 41,478) da USD 1,81 por litro. En Brasil la Gasolina C
      comum promedió R$ 7,210 por litro esa semana (ANP, Síntese Semanal, Edição n° 12/2022, semana
      20/03/2022 a 26/03/2022); convertida a la cotización PTAX de venta del Banco Central do Brasil
      del 25/03/2022 (R$ 4,7782 por USD) da USD 1,51 por litro. La nafta en Uruguay costaba más (USD
      1,81 vs. USD 1,51 por litro; Uruguay 19,6% más cara), no menos. GASOIL: acá el resultado
      depende de qué grado se empareja con el Diesel B S10 brasileño (10 ppm de azufre), y el
      Decreto N° 64/022 fija dos grados distintos en el mismo artículo: Gas Oil 50S a $ 53,99 y Gas
      Oil 10S a $ 67,30. Emparejando por posición de mercado (el grado de mayor volumen de cada
      país, 50S en Uruguay), Uruguay sale más barato: USD 1,30 contra USD 1,40 por litro del S10
      brasileño, 6,8% menos. Emparejando por especificación de azufre (10 ppm contra 10 ppm, el
      criterio técnico), el Gas Oil 10S uruguayo da USD 1,62 por litro, 16,2% más que el S10
      brasileño. La Síntese de la ANP de esa semana releva únicamente Diesel S10 (no hay S500 en el
      documento), así que del lado brasileño no hay alternativa: comparar por especificación exige
      comparar contra el 10S uruguayo. Ningún documento oficial establece cuál de los dos criterios
      de emparejamiento corresponde usar; los dos son defendibles y dan signos opuestos. Con el tipo
      de cambio del lunes 28/03/2022 (BCU $ 41,365; BCB R$ 4,7905) ninguna comparación cambia de
      signo. Nota de método: se usó el "DLS. USA BILLETE" del BCU (cotización de referencia para
      efectivo) contra la PTAX interbancaria del Banco Central do Brasil, que son conceptos
      distintos; la brecha entre el dólar billete y el interbancario en Uruguay es de décimas y no
      altera ninguno de los resultados de arriba, pero la comparación simétrica sería interbancario
      contra interbancario. Uruguay tiene precio único regulado; Brasil tiene precios libres con
      dispersión regional, y el promedio nacional de la ANP usado arriba no es la única lectura
      posible: con la región Sul (la más próxima a Uruguay) tampoco cambia el signo de ninguna
      comparación —nafta Sul USD 1,47 por litro (Uruguay 22,4% más cara) y gasoil Sul (S10) USD 1,37
      por litro (Uruguay 50S 5,0% más barato)—. Contexto temporal: tres semanas antes de la
      declaración, el propio CED medía a Uruguay con la nafta "30% más cara que en Chile, 38% más
      costosa que en Brasil, 47% más que en Paraguay" y el gasoil "17% más caro que en Chile y
      Brasil" (Boletín Macroeconómico N°27, 2022-03-03, promedios nacionales, sin especificar
      grado). En esas mismas cuatro semanas la ANP registró en Brasil una suba de 18,10% en el
      diesel S10 y de 9,91% en la gasolina común (Síntese n°12/2022, columna "Variação 4 semanas");
      los precios uruguayos del Decreto 64/022 no cambiaron en ese lapso (el decreto rige desde el
      1° de marzo). El cruce observado el 27 de marzo es consistente con una suba de precios del
      lado brasileño en esas semanas, no con una baja del lado uruguayo. Comparabilidad: la Súper 95
      uruguaya y la Gasolina C comum brasileña no son el mismo producto (distinto octanaje, y la
      gasolina C brasileña lleva mezcla de etanol E27, con menor contenido energético por litro);
      ajustar por contenido energético acerca los precios en unos pocos puntos porcentuales, no lo
      suficiente para revertir una brecha de 19,6% (22,4% contra la región Sul). Sobre "por primera
      vez": el propio Lacalle Pou lo dijo con reserva ("creo que del 2001 2002"). No se reconstruyó
      en esta corrida una serie pareada Uruguay-Brasil mes a mes en dólares para confirmarlo o
      descartarlo, pero no es un dato inverificable: la ANP publica una Série Histórica de Preços de
      Combustíveis semanal desde julio de 2001; URSEA publica el PPI y los precios máximos fijados
      por el Poder Ejecutivo desde 2002-01 (completable con los decretos de IMPO desde 2020-10); BCU
      y BCB tienen series diarias de tipo de cambio. Es trabajo de reconstrucción no hecho, no un
      límite de las fuentes. Cobertura de prensa de momentos posteriores (fines de 2022, 2024)
      muestra a Uruguay entre los combustibles más caros de la región de forma sistemática, lo que
      es compatible con que el cruce de marzo de 2022 haya sido una situación puntual ligada al
      shock de precios del petróleo de esas semanas y no un cambio estructural; esto es una lectura
      de cobertura posterior, no una serie propia.'
