  afirmacion: Orsi afirmó que, en noviembre de 2024, el gobierno anterior había autorizado a Ancap a
    endeudarse por hasta 200 millones de dólares, de los cuales la empresa tomó 160 millones, y que
    eso llevaba la deuda total de Ancap a 255 millones de dólares.
  fragmento: en el mes de noviembre el anterior gobierno autorizó un crédito y se pidió un préstamo
    por 160 millones de dólares, lo que hace que la deuda total de Ancap hoy sea de 255 millones
  dato_real:
    valor: 'Los Estados Financieros Individuales de Ancap al 31 de diciembre de 2024 (Nota 21, "Deudas
      financieras") registran un saldo total de deudas financieras de $ 10.232.197.209 a esa fecha
      (unos USD 232 millones al tipo de cambio de cierre de $44,066/USD que la propia empresa usa en
      su presentación de resultados), compuesto mayormente por préstamos bancarios de $
      6.031.730.000 con vencimiento a menos de un año más préstamos de partes relacionadas. Ese
      saldo es menor al de diciembre de 2023 ($ 13.585.788.835): el stock de deuda financiera bajó
      durante 2024. Orsi habla de "deuda total", pero esa cifra remite a las deudas financieras
      (préstamos), no al pasivo total del balance -que suma además deudas comerciales, provisiones y
      beneficios a empleados- y que a esa misma fecha era mayor: $ 30.664.848.327 (unos USD 696
      millones al cierre). El préstamo de USD 160 millones que cita Orsi corresponde, según El
      Observador, a una autorización del MEF a Ancap en noviembre de 2024 para endeudarse hasta por
      USD 200 millones (de los cuales Ancap tomó USD 160 millones) para cubrir necesidades de caja
      durante la extensión de la parada de la refinería de La Teja; no se encontró la resolución o
      el decreto del MEF que formaliza esa autorización como documento público independiente, solo
      referencias de prensa a ella. Sobre el carácter de "novedad" que Orsi atribuye al préstamo, El
      Observador documentó que la operación fue pública en su momento y que Ancap había recurrido a
      préstamos similares en tres oportunidades recientes, entre ellas una autorización de hasta USD
      300 millones en agosto de 2023 para el mismo fin. La cifra de USD 255 millones de deuda total
      es la que da Orsi "hoy", en la fecha de la conferencia (25/04/2025), posterior al cierre
      auditado de 2024; no hay, entre las fuentes oficiales revisadas, un estado financiero o
      informe con corte a esa fecha que permita verificar ese monto de forma independiente de la
      propia declaración de Orsi, que la gacetilla oficial del MIEM/Presidencia del mismo día
      reproduce sin agregar verificación adicional.'
