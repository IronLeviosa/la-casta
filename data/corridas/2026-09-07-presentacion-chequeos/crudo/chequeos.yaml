- _id: lacalle-pou/2022-03-27-sobrecostos-combustibles-1700-millones
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  politico: lacalle-pou
  declaracion: lacalle-pou/2022-03-27-mecanismo-transparencia-no-paga-sobrecosto
  tema: economia/combustibles
  fecha: 2022-03-27
  afirmacion: En el quinquenio anterior (2015-2019 según el cálculo disponible) los consumidores
    uruguayos pagaron más de USD 1.700 millones por encima del precio de paridad de importación de
    nafta y gasoil.
  fragmento: más de USD 1.700 millones de sobrecostos
  calificacion: discutible
  exhaustivo: false
  dato_real:
    valor: 'Ningún organismo oficial publica un monto agregado de "sobrecosto" para el período que citó
      Lacalle Pou. La serie oficial disponible es el Precio de Paridad de Importación (PPI) que
      calcula URSEA mes a mes (dataset "ursea-ppi_vs_pe_v2" en catalogodatos.gub.uy, con el precio
      de venta al público y el PPI de referencia desde 2002-01). La cuantificación agregada más
      citada surge de un cálculo privado: el Centro de Estudios para el Desarrollo (CED), comparando
      el precio pagado por los consumidores contra el PPI de URSEA mes a mes, estimó que "en el
      periodo 2015-2019, la nafta presentó un sobreprecio de USD 443 millones, mientras que los
      consumidores uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la referencia de
      PPI" (Boletín Macroeconómico N°27, 03/03/2022). Sumados, nafta + gasoil dan aproximadamente
      USD 1.780 millones para 2015-2019, cifra consistente con el "mil setecientos y pico millones"
      que dijo Lacalle Pou. El bloque resumen de la primera página del mismo documento trae la cifra
      de gasoil con un dígito distinto (USD 1137 millones en vez de 1.337); no se establece a qué se
      debe la diferencia entre las dos cifras del mismo documento. El párrafo del cuerpo (carácter
      7862 del PDF) es el que da la cifra limpia y contigua, y es la que coincide con la nota de El
      Observador que resume el mismo informe (corroboración no independiente: lee el mismo PDF).
      "Quinquenio anterior" (marzo de 2015 a marzo de 2020, según lo dijo Lacalle Pou) y "2015-2019"
      (años calendario, que es lo que mide el CED) tampoco son exactamente el mismo período:
      difieren en enero-febrero de 2020 (dentro del quinquenio, fuera del cálculo del CED) y
      enero-febrero de 2015 (fuera del quinquenio, dentro del cálculo); no se recalculó el efecto de
      ese desfase de dos meses. La brecha que mide el CED contra el PPI tampoco es exclusiva de ese
      quinquenio: el mismo informe da USD 1.181 millones de sobreprecio en gasoil para 2010-2014
      (con USD 78 millones de subsidio en nafta ese período), y USD 14 millones y USD 67 millones
      respectivamente para 2020-2021. El Observador agrega, atribuyéndolo al propio gobierno de
      Lacalle Pou: "En el punto de partida, el gobierno reconoció un sobreprecio de hasta $ 2,97 por
      litro (llamado factor x) en la tarifa del gasoil y las gasolinas por la incidencia del
      subsidio que tiene el supergás, el sobrecosto por la mezcla con biocombustibles, las pérdidas
      de Ancap en el pórtland y otras ineficiencias del ente. En la hoja de ruta del gobierno, el
      objetivo era que ese sobreprecio se suprimiera en un plazo de tres años." Es decir, una parte
      de lo que el cálculo del CED mide como brecha contra el PPI tiene un origen anterior al
      quinquenio que Lacalle Pou responsabiliza, y su propio gobierno lo reconoció como pendiente de
      eliminar de forma gradual. Sobre la fuente del cálculo: el CED es un centro de estudios
      privado, no un organismo oficial. Su propio sitio institucional consigna que Lacalle Pou dio
      el discurso en sus cenas anuales de 2021 y 2023 y lideró dos ediciones de su Programa Alta
      Dirección para la Gestión Pública — un vínculo institucional documentado con el mandatario
      cuya declaración se chequea acá con datos de esa misma organización (ver
      content/medios/ced.yaml). Eso no invalida el cálculo, pero lo ubica como una cifra de una de
      las partes de un debate público, no un dato neutro. Para cerrar el chequeo con un documento
      oficial falta la serie de ventas mensuales de nafta y gasoil en litros (ANCAP, Dirección
      Nacional de Energía del MIEM, o el Balance Energético Nacional): sin volúmenes, el diferencial
      de precio por litro que da el PPI de URSEA no se traduce en millones de dólares con una fuente
      oficial sola.'
    fuentes:
