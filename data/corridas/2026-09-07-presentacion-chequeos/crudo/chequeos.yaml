- _id: orsi/2024-11-18-iva-2-ciento-tarjetas-debito-2024
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  politico: orsi
  declaracion: orsi/2024-11-18-orsi-sostuvo-recargo-iva-2-aplicado
  tema: economia/impuestos
  fecha: 2024-11-18
  afirmacion: Orsi preguntó, en rueda de prensa tras el debate presidencial, si el gobierno saliente
    de Lacalle Pou iba a devolver, antes de dejar el gobierno, el 2 % de IVA que a su juicio había
    aumentado en los pagos con tarjeta, y dijo no haber obtenido respuesta.
  fragmento: ese 2% que aumentaron de IVA
  dato_real:
    valor: 'El descuento de IVA para compras con tarjeta de débito y otros medios electrónicos,
      habilitado por la Ley de Inclusión Financiera N.º 19.210, estuvo en 4 puntos porcentuales
      entre enero de 2017 y abril de 2020 -había bajado a 3 puntos en 2015 y a 2 en 2016, antes de
      volver a 4 en enero de 2017, según Ámbito-. El Decreto N.º 97/020, promulgado el 11/03/2020 y
      vigente desde el 1.º de mayo de 2020, firmado por el presidente Lacalle Pou y la entonces
      ministra de Economía Azucena Arbeleche, redujo esa rebaja en 2 puntos porcentuales "con el fin
      de abatir el déficit fiscal", invocando como antecedente el Decreto N.º 203/014 de 2014 que
      había dispuesto la rebaja adicional que ahora se recortaba; la tasa general del IVA (22%) no
      cambió, es un descuento adicional para pagos electrónicos el que se redujo. Es la medida a la
      que se refiere Orsi como "el 2% que aumentaron [de IVA]". Un documento de la Asesoría
      Tributaria del MEF, citado por Ámbito en 2023 cuando Lacalle Pou volvió a defender esa
      reducción, caracterizó la misma medida como "el fin de un subsidio" y no como un aumento de
      impuestos, y afirmó -con datos de la Encuesta Financiera de Hogares del BCU- que el beneficio
      se concentraba en los quintiles de mayores ingresos: el primer quintil usaba tarjeta de débito
      para compras de alimentación y limpieza en un 4,81% de los hogares, frente a 9,41% en el
      segundo quintil y 36,76% en el más alto. En una entrevista con Subrayado sobre el mismo tema,
      Lacalle Pou había citado una cifra distinta y más baja para ese primer quintil ("Un 3,81%, o
      un 4%"), que no es la que consigna el documento del MEF. La propia Ámbito, en voz propia y no
      de una fuente citada, describe la misma medida como "un aumento del IVA para las tarjetas de
      débito, haciendo que el descuento pasara del 4% al 2%".'
    fuentes:
