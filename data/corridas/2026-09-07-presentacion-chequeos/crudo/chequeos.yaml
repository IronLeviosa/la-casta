  dato_real:
    valor: 'El audio oficial del discurso (transcripción propia, Whisper large-v3-turbo, marca 1:01:29)
      registra al presidente diciendo, de forma contigua: "toda la renuncia fiscal entre personas y
      empresas significan 150 millones de dólares". Es la suma de los tres componentes del paquete
      anunciado ese día. El anexo técnico de Presidencia ("Documento a tres años de gestión")
      desglosa cada componente por separado: "La renuncia fiscal de la propuesta anteriormente
      descrita es de aproximadamente USD 80 millones anuales" (IRPF), "El costo total de las medidas
      para los pasivos se estima en unos USD 30 millones anuales" (IASS; "los pasivos" son los
      aproximadamente 20.000 beneficiarios del IASS que menciona el mismo documento, cifra que el
      audio confirma: "con estas medidas cerca de 20.000 personas dejan de pagar también este
      tributo") y "El costo total de las medidas de apoyo a las micro y pequeñas empresas se estima
      en alrededor USD 40 millones anuales" (mipymes). 80 + 30 + 40 = 150, consistente con la cifra
      agregada que dio el presidente; la composición correcta incluye los tres rubros, no solo IRPF
      e IASS. La versión taquigráfica de la Comisión de Hacienda de la Cámara de Representantes del
      15/03/2023 confirma el mismo total desde la exposición de motivos del proyecto de ley: el
      subsecretario de Economía y Finanzas, Alejandro Irastorza, sumó "a estas sumas que les
      mencioné recién hay que adicionarle estos US$ 150.000.000" al aumento de gasto ya previsto en
      la Rendición de Cuentas. Según esa misma versión taquigráfica, el proyecto —remitido por el
      Poder Ejecutivo y luego modificado por el Senado— fue votado en la Comisión de Hacienda y en
      el plenario del Senado el 14/03/2023, y llegó a la Comisión de Hacienda de Diputados el
      15/03/2023; no se localizó en esta corrida una fuente citable que fije la fecha exacta en que
      el Poder Ejecutivo lo remitió originalmente al Parlamento (la gacetilla de Presidencia del
      propio 2 de marzo habla en futuro: "el proyecto de ley que el Gobierno enviará").'
