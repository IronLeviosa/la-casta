  analisis: 'Dijo que su gobierno «ahorró más de US$600 millones» durante la pandemia sin poner
    impuestos, sin precisar el período; el único documento oficial disponible mide un ahorro de USD
    660 millones, pero exclusivamente para 2020 y como reducción de gasto estructural excluido el
    gasto COVID, no como resultado fiscal neto del período más amplio que evoca «la pandemia» (2020
    y lo transcurrido de 2021). La cifra oficial de 2020 (660) supera la cifra dicha (600) y
    sostiene la frase en su literalidad, pero no hay una actualización oficial para 2021: la
    presentación del MEF más próxima a la fecha de la declaración (12/07/2021) repite que se
    cumplieron las previsiones fiscales sin aumentar impuestos, sin repetir ni actualizar la cifra
    de ahorro. Dos días después de presentar el 660, la ministra Arbeleche aclaró en Telenoche que
    esa cifra "no incluye el gasto en la pandemia": mide gasto estructural, no un balance neto. En
    la misma entrevista de LN+ que registra la declaración, Lacalle Pou dio además otro desglose
    (gasto de US$670 millones en 2020, US$940 millones previstos para 2021, ahorro de US$640
    millones) que no coincide con el 660 oficial ni se sabe si mide lo mismo. El compromiso de
    campaña había sido ahorrar US$900 millones; consultada al respecto, Arbeleche respondió que "no
    se trata de agarrar el cartel de los US$900 millones" y encuadró el objetivo como una mejora
    estructural continua, no como una meta de magnitud cerrada.'
