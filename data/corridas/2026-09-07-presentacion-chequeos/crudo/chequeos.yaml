  afirmacion: En una entrevista con el canal argentino LN+, Lacalle Pou dijo que su gobierno ahorró
    más de US$600 millones sin poner impuestos, sin precisar el período.
  fragmento: logró ahorrar más de US$600 millones
  calificacion: discutible
  exhaustivo: false
  dato_real:
    valor: 'El MEF presentó, el 08/02/2021 (ronda de prensa "Balance y Perspectivas Macroeconómicas"),
      un cálculo de "ahorro total" de USD 660 millones para el ejercicio 2020 exclusivamente: USD
      380 millones de ahorro en Gobierno Central-BPS "a valores de 2019, excl. gasto COVID", más USD
      280 millones en el resto del sector público no monetario. El comunicado oficial del MEF de ese
      mismo día agrega que, aparte, se destinaron USD 1.217 millones (2,3% del PBI) a atender la
      pandemia, y que se cumplieron todas las estimaciones fiscales sin aumentar impuestos. Dos días
      después, el 10/02/2021, en una entrevista televisiva distinta (Telenoche, con Daniel Castro;
      no la misma ronda de prensa del día 8), la ministra Arbeleche aclaró que esa cifra "no incluye
      el gasto en la pandemia": mide gasto estructural y permanente, no un resultado fiscal neto que
      reste el gasto covid. En la misma entrevista de LN+ que registra la declaración de este
      chequeo, según la crónica de El Observador, Lacalle Pou dio además su propio desglose, con
      otro par de cifras: "en 2020 el Poder Ejecutivo gastó US$ 670 millones y gastará US$ 940 este
      año, al tiempo ahorrará US$ 640 millones" (verbo en futuro; no queda claro si ese "640" es un
      cálculo distinto del "660" oficial o una cifra proyectada para 2021). La comparación con la
      promesa de campaña también está documentada: consultada por El Observador el 09/02/2021 sobre
      la promesa de campaña de ahorrar US$900 millones, Arbeleche respondió "Acá no se trata de
      agarrar el cartel de los US$ 900 millones y morir con el cartel. Aquí el compromiso claro es
      de continuar con la mejora estructural", y la misma nota fija el resultado de 2020 en "ahorros
      por US$ 660 millones". No se localizó una actualización oficial de la cifra de ahorro para el
      tramo de 2021 transcurrido hasta el 28/07/2021 (fecha de la declaración): la presentación del
      MEF más próxima a esa fecha (12/07/2021, ante la Comisión de Presupuestos por la Rendición de
      Cuentas 2020) repite que "se cumplieron todas las previsiones fiscales (sin aumento de
      impuestos)" pero no repite ni actualiza la cifra de ahorro. El antecedente oficial más próximo
      en cifra y en fuente directa a lo dicho por Lacalle Pou ("más de US$600 millones") sigue
      siendo el de USD 660 millones para 2020 exclusivamente: compatible en magnitud con la
      declaración, pero sin que exista un documento oficial que mida "durante la pandemia" (2020 y
      2021) como un período único, ni que lo trate como resultado fiscal neto en vez de ahorro de
      gasto estructural.'
