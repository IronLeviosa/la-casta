  calificacion: discutible
  analisis: 'Orsi preguntó si el gobierno saliente iba a devolver, antes de dejar el cargo, un 2 % de
    IVA que según él había aumentado en los pagos con tarjeta; se refiere al Decreto 97/020 de marzo
    de 2020, que redujo de 4 a 2 puntos porcentuales un descuento de IVA para pagos electrónicos (no
    la tasa general del 22 %, que no cambió). El MEF, en un documento citado por Ámbito, calificó la
    misma medida como el fin de un subsidio concentrado en los hogares de mayores ingresos (usaban
    tarjeta de débito para consumo básico en un 4,81 % de los casos en el quintil más bajo, frente a
    36,76 % en el más alto) y no como un aumento de impuestos; Ámbito, en cambio, en voz propia, la
    describió como "un aumento del IVA para las tarjetas de débito". El propio Lacalle Pou, en una
    entrevista, había dado para ese primer quintil una cifra más baja y distinta a la del documento
    del MEF ("un 3,81%, o un 4%"). El decreto no fija una devolución pendiente: es un descuento que
    se redujo, no un tributo nuevo prometido en reversa. La afirmación de Orsi agrega la
    especificación "compras con tarjeta", que no está en esta cita puntual pero sí la dijo de forma
    completa un día antes, en el debate del 17/11/2024 ("¿devolverán el 2% que recargaron de IVA por
    la compra por tarjetas?"), video que no se usa para completar este registro porque es un momento
    y un contexto distintos.'
