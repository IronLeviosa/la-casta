  cargo_en_ese_momento: Representante Nacional (Diputado) por Montevideo (suplente)
  cita: >-
    Señora Presidenta: he votado afirmativamente en general este proyecto, pero quiero remarcar
    la salvedad hecha por el señor Diputado Scavarelli con relación a que este marco normativo se
    refiere a dos objetivos. Uno -que es compartible- es la extracción de órganos o tejidos con
    fines terapéuticos, y el otro tiene que ver con usos de interés científico. Creo que esta
    última finalidad, que en general se desarrolla con un interés subjetivo y con normas éticas
    que no han sido suficientemente debatidas, tal vez pueda llevar a excesos. Por ejemplo, me
    preocupa a quién pertenecen los ovarios de una mujer fallecida y que puedan ser utilizados
    para engendrar, mediante una combinación mecánica. De acuerdo con este proyecto de ley, esto
    podría ocurrir siempre que el interés científico se oriente en tal sentido. Tampoco se limita
    el interés científico para que vaya en el sentido de hacer posible la donación de órganos y
    tejidos. Por último, entiendo que la investigación científica no ha sido suficientemente
    debatida en nuestro país como para tener la tranquilidad de que la medicina respetará los
    aspectos básicos que buena parte de los ciudadanos consideran imprescindibles. Estos tres
    puntos no pesan en el motivo fundamental: frente a una finalidad social y humana, tenemos que
    buscar un marco normativo que haga posible o facilite el fomento de este tipo de cosas.
  titulo: Votó a favor de la ley de trasplantes y advirtió sobre el uso científico de material humano
  resumen: >-
    En el debate en la Cámara de Representantes sobre el proyecto de regulación de la extracción,
    conservación y trasplante de órganos y tejidos humanos, fundamentó su voto afirmativo en
    general señalando tres reparos sobre el uso de material humano con fines de interés científico
    (falta de debate suficiente sobre el tema, a quién pertenecen restos como los ovarios de una
    persona fallecida, y la ausencia de garantías éticas suficientemente debatidas), pero concluyó
    que esos reparos no pesaban frente a la finalidad social y humana de la norma, y que
    correspondía un marco normativo que facilitara ese tipo de investigación.
