      detalle: >-
        Primer suplente de Rafael Michelini —cabeza de la Hoja de votación 99000 del Nuevo Espacio
        en Montevideo y candidato del Nuevo Espacio a la Presidencia de la República en la misma
        elección— en el sistema respectivo de esa hoja. Michelini no asumió la banca de diputado;
        Barandiarán, su primer suplente, ejerció como titular desde el inicio de la Legislatura
        XLIV, el 15 de febrero de 1995, según el documento oficial del Parlamento.
