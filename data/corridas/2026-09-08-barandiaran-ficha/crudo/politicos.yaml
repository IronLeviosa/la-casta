  cobertura:
    texto: >-
      Se revisaron el documento oficial «Parlamentarios Uruguayos (1830-2005)» del Parlamento, la
      Enciclopedia Electoral Uruguaya 1900-2010 (Instituto Factum, publicada por el Parlamento), el
      buscador de diarios de sesión de la Cámara de Representantes, la Asamblea General y la
      Comisión Permanente, y trece medios de prensa (El País, la diaria, Montevideo Portal, El
      Observador, Búsqueda, Subrayado, Brecha, La República/LR21, Telemundo, Telenoche, radios,
      Presidencia y Partido Colorado), para el período 1995-2026.


      Los Diarios de Sesiones de la Cámara de Representantes están disponibles en línea desde el 11
      de febrero de 2000; antes de esa fecha no hay registro digitalizado de sus intervenciones
      como titular (1995-2000). La Asamblea General y la Comisión Permanente están digitalizadas
      desde 1985, y se revisaron para ese mismo período sin encontrar ninguna intervención suya.


      Lo que hay: una intervención en el debate de la ley de trasplantes de órganos y tejidos (7 de
      noviembre de 2000), su firma como uno de los primeros firmantes del proyecto que se convirtió
      en la Ley 17.189 sobre relaciones de consumo (promulgada el 20 de setiembre de 1999), y 46 de
      los 110 días de suplencia que el Parlamento registra para la Legislatura 45 (2000-2005),
      documentados con fecha y resolución de licencia cada uno. Quedan 64 días de esa legislatura
      sin fecha exacta; el Parlamento los agrupa como "suplencias menores a cinco días" sin
      desglosarlos.


      Lo que no hay en la web: el texto taquigráfico de sus intervenciones anteriores a 2000;
      ninguna cita de prensa suya salvo una nota de LR21 (La República) del 29 de setiembre de 2000
      sobre un proyecto de protección de datos personales; actividad pública documentada después
      del 15 de diciembre de 2004; y ninguna fotografía con licencia libre.
    fecha: 2026-09-08
  revision:
    tier: publicado
