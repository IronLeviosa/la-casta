          titulo: Parlamentarios Uruguayos (1830-2005) — fecha institucional de cierre de la Legislatura 45,
            el período en el que Barandiarán fue suplente
          cita: LEGISLATURA No. 45 - Del 15 de febrero de 2000 al 14 de febrero de 2005
          retrieved_at: 2026-09-09
  cobertura:
    texto: "Gabriel Barandiarán fue diputado titular por Montevideo de 1995 a 2000 y suplente entre 2000
      y 2004. Sus intervenciones en sala de 1995 a 1999 salen de los diarios de sesiones de la
      Hemeroteca del Parlamento: 109 declaraciones con posición, sobre 480 diarios leídos. De los
      110 días de suplencia que el Parlamento le atribuye en 2000-2004, 81 tienen fecha y cita; los
      29 restantes no aparecen en ninguno de los 552 diarios de Representantes y de la Comisión
      Permanente de ese período, así que no se pueden fechar con esa fuente. No hay fotografía con
      licencia libre. En 1995-1999 el sitio todavía no tiene cargados a diputados de los otros lemas
      de esa legislatura; se van a cargar con el mismo barrido."
    fecha: 2026-09-09
