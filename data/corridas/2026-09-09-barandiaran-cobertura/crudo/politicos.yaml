    - cargo: Representante Nacional (Diputado) por Montevideo
      fecha: 1999-10-31
      lema: Nuevo Espacio
      resultado: no_electo
      detalle: 'Primer suplente de Iván Posada en la Hoja de votación 1999 ("Tercera Vía"), la lista que
        Posada y Barandiarán formaron dentro del Nuevo Espacio en Montevideo para esta elección. Esa
        hoja eligió un solo titular, el propio Posada; Barandiarán no resultó electo como titular,
        pero ejerció la banca como suplente convocado en varios períodos entre junio de 2000 y
        diciembre de 2004, dentro de la Legislatura XLV (2000-2005): al menos 81 días documentados
        con fecha, sobre 110 días de suplencia que registra el Parlamento para esa legislatura.'
