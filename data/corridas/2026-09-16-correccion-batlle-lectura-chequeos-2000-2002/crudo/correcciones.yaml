  motivo: >-
    Una relectura de la ficha de Batlle, hecha como la ve un lector, encontró que la página de
    Presidencia que agrupa la conferencia de prensa del 3 de junio de 2002 y dos entrevistas del 30
    de mayo tenía cargada la fecha de publicación equivocada en la declaración y en un chequeo, y
    que dos chequeos databan la sanción de las leyes que mencionó Batlle contra la fecha de esa
    conferencia en vez de contra la fecha real del dicho, con cuentas de días que no cerraban. Se
    corrigen esas fechas y se reescriben los análisis con la comparación correcta: las dos leyes se
    sancionaron el día antes del dicho, en la misma semana del calendario, y se explican como
    lecturas posibles, no como hechos, las dos razones por las que Batlle pudo decir "la semana
    pasada".

    En dos chequeos la calificación sube de discutible o impreciso a verdadero: uno confundía una
    exoneración del impuesto con una tercera tasa, cuando la propia fuente muestra que Batlle
    hablaba de sectores exonerados, y el otro calificaba de impreciso un rótulo de vocabulario que
    no es un error de dato. En un quinto registro se agregan las citas de los artículos de la ley
    que faltaban y se corrige el rango de artículos del capítulo agropecuario, sin sostener una
    rebaja en la industria que el texto de la ley no permite medir.

    No se acepta que un título tuviera un espaciado duplicado ni que un dato real solo diera una
    fecha sin más contenido: las dos premisas describían mal el registro publicado. Se saca además,
    de dos de los cinco registros, un texto que hablaba del propio proceso de revisión en vez de
    decir el límite de la evidencia disponible.
