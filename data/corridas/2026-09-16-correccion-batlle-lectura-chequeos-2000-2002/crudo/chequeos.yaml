  fecha: 2000-11-21
  titulo: "Ley de Urgencia 17.243: rebajas de aportes y contribución rural al agro en 2000"
  afirmacion: Dijo que en la primera Ley de Urgencia de su gobierno bajaron algunos recursos, sobre
    todo al sector agropecuario.
  fragmento: en la primera Ley de Urgencia bajamos algunos recursos, sobre todo al sector agropecuario
  calificacion: verdadero
  dato_real:
    valor: >-
      La Ley 17.243, "Ley de Urgencia" del primer año de gobierno de Batlle, se publicó el
      6/07/2000, cuatro meses después de que asumiera la presidencia.


      El Capítulo I (artículos 1 y 2) fija en 6,5 puntos la tasa de aportes patronales jubilatorios
      de la industria manufacturera y deroga el artículo 25 de la Ley 16.697 (1995), que facultaba
      al Poder Ejecutivo a reducirla hasta en seis puntos por decreto: la ley no permite establecer
      si 6,5 puntos fue una baja o una suba respecto de la tasa vigente en ese momento.


      El Capítulo II, "AGROPECUARIA" (artículos 3 a 10), rebaja en 0,387 o/oo la tasa de aportación
      patronal rural para el año 2000 (artículo 3), exonera de aportación patronal sobre
      dependientes -con un máximo de dos, además del titular y su cónyuge- a los productores con
      predios de menos de 100 hectáreas índice CONEAT durante 2000 (artículo 4), y rebaja un 25% la
      Contribución Inmobiliaria Rural de 2000, compensando a las Intendencias con USD 15.000.000
      (artículo 10).
