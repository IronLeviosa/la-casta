  dato_real:
    valor: >-
      La Ley 17.502 (Ley de Estabilidad Financiera) fue sancionada por la Cámara de Representantes y
      promulgada el 29 de mayo de 2002, y publicada el 31 de mayo de 2002.


      Fijó en 35% las tasas del Impuesto a las Rentas de la Industria y Comercio y del Impuesto a
      las Rentas Agropecuarias, en 10,50% el Impuesto a las Comisiones, y estableció nuevas escalas
      del Impuesto a las Retribuciones y Prestaciones Personales para sueldos, jubilaciones y
      pensiones.
