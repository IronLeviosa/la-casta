    nivel: textual
    fuentes:
      - url: https://archivo.presidencia.gub.uy/noticias/archivo/2002/junio/2002060302.htm
        medio: presidencia
        fecha: 2002-06-03
        tipo: documento_oficial
        titulo: Conferencia de prensa del Presidente Jorge Batlle en el Edificio Libertad el 3 de junio de
          2002
        cita: una tercera referente a la aplicación del IVA a frutas y verduras
        retrieved_at: 2026-09-16
  analisis: >-
    Batlle dijo, el 30 de mayo de 2002, que la mayoría de gobierno había votado "la semana pasada"
    una ley que aplicaba el IVA a "frutas y verduras". La Ley 17.503 fue sancionada por el Senado el
    29 de mayo y promulgada el 30, el mismo día de la entrevista: la sanción fue un día antes, en la
    misma semana calendario, no en la anterior.


    Las mismas dos lecturas que en el chequeo de la Ley 17.502, la ley fiscal —una traducción de una
    expresión como "last week", o un voto anterior de la cámara de origen— hacen compatible la frase
    con esa fecha.


    La ley suspendió, hasta el 1º de julio de 2005, la exoneración de IVA que regía para la venta de
    frutas, flores y hortalizas, para financiar el Fondo de Reconstrucción y Fomento de la Granja:
    extendió el IVA a ese sector, no "al agro" en general.


    "Hortalizas" es más amplio que "verduras" en el uso técnico de la ley, y "flores" no está en lo
    que dijo Batlle, pero en el uso rioplatense corriente "verduras" y "hortalizas" nombran lo
    mismo: no es un error de dato, sino de vocabulario, y no cambia el sentido de lo que afirmó.
  revision:
    tier: publicado
  _slug: ley-iva-frutas-verduras-junio-2002
- politico: batlle
  declaracion: batlle/2000-11-21-iva-existe-0-14-y-23
  tema: economia/impuestos
  fecha: 2000-11-21
  titulo: Tasas de IVA vigentes en noviembre de 2000
  afirmacion: En noviembre de 2000 dijo que el IVA vigente en Uruguay tenía dos tasas y un régimen de
    exoneración, que describió como 'el de 0, el de 14 y el de 23'.
  fragmento: el de 0, el de 14 y el de 23
  calificacion: verdadero
  dato_real:
    valor: >-
      Según el artículo 9 de la Ley 16.697 (sancionada el 21 de abril de 1995, publicada el 2 de
      mayo de 1995), que sustituyó el artículo 14 del Título 10 del Texto Ordenado 1991, el IVA
      tenía desde 1995 una tasa básica de 23% y una tasa mínima de 14%. Esas dos tasas rigieron
      hasta el 1 de julio de 2007, cuando el artículo 25 de la Ley 18.083 las redujo a 22% y 10%.


      El tercer valor que menciona Batlle, "el de 0", no es una tasa fijada por el artículo 14: el
      artículo 19 del Título 10 del mismo Texto Ordenado, titulado "Exoneraciones", regula qué
      operaciones no pagan IVA, un régimen distinto del de las tasas.
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes-originales/16697-1995
        medio: impo
        fecha: 1995-05-02
        tipo: documento_oficial
        titulo: Ley N° 16.697
        cita: "Fíjanse las siguientes tasas: A) Básica del 23% (veintitrés por ciento). B) Mínima del 14%
          (catorce por ciento)"
        retrieved_at: 2026-09-16
      - url: https://www.impo.com.uy/bases/leyes-originales/18083-2006
        medio: impo
        fecha: 2007-01-18
        tipo: documento_oficial
        titulo: Ley N° 18.083
        cita: "Fíjanse las siguientes tasas: A) Básica del 22% (veintidós por ciento). B) Mínima del 10%
          (diez por ciento)"
        retrieved_at: 2026-09-16
      - url: https://www.impo.com.uy/bases/todgi/10-1996/
        medio: impo
        fecha: 1996-08-28
        tipo: documento_oficial
        retrieved_at: 2026-09-16
        titulo: T.O. 1996 (Dec. 338/996) Título N° 10, artículo 19 (Exoneraciones)
        cita: "Artículo 19°.- Exoneraciones.- Exonéranse: 1) Las enajenaciones de: A) Moneda extranjera,
          metales preciosos, amonedados o en lingotes, títulos y cédulas, públicos y privados y
          valores mobiliarios de análoga naturaleza."
  evidencia:
    nivel: textual
    fuentes:
      - url: http://archivo.presidencia.gub.uy:80/noticias/archivo/2000/noviembre/2000112201.htm
        medio: presidencia
        fecha: 2000-11-21
        tipo: documento_oficial
        titulo: Declaraciones del Presidente Batlle en el programa "El Reloj" (Canal 10)
        cita: El IVA en este país existe, el de 0, el de 14 y el de 23
        retrieved_at: 2026-09-16
  analisis: >-
    En noviembre de 2000 Batlle describió el IVA vigente con tres valores: 0%, 14% y 23%. La Ley
    16.697 de 1995 fijó la tasa básica en 23% y la mínima en 14%, vigentes hasta que la Ley 18.083
    las bajó a 22% y 10% en julio de 2007: las dos cifras que dio son exactas para esa fecha.


    El "0" no es una tercera tasa sino, como el propio Batlle explicó en la misma respuesta ("algún
    sector que estuviera, digamos, exonerado de pagar esa tasa"), una exoneración: el artículo 19
    del Título 10 del Texto Ordenado 1996 regula, bajo ese nombre, qué operaciones no pagan IVA, un
    régimen distinto del de las tasas del artículo 14.


    Llamarla "0" en vez de "exonerada" es una simplificación de vocabulario, no un error de dato,
    con el mismo criterio que "frutas y verduras" en el chequeo de la Ley 17.503.
  revision:
    tier: publicado
  _slug: iva-tasas-0-14-23-noviembre-2000
