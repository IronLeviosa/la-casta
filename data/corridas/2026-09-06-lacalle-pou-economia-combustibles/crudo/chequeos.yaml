  afirmacion: En el quinquenio 2015-2019 se pagaron más de USD 1.700 millones de sobrecostos en combustibles.
  fragmento: más de USD 1.700 millones de sobrecostos
  dato_real:
    valor: >-
      Ningún organismo oficial publica un monto agregado de "sobrecosto" para 2015-2019: lo que existe
      es la serie oficial de Precios de Paridad de Importación (PPI) que calcula URSEA mes a mes
      (dataset "ursea-ppi_vs_pe_v2" en catalogodatos.gub.uy, con el precio de venta al público y el
      precio en planta ANCAP junto al PPI de referencia desde 2002-01). La cuantificación agregada más
      citada surge de un cálculo privado: el Centro de Estudios para el Desarrollo (CED), comparando el
      precio pagado por los consumidores contra el PPI de URSEA mes a mes, estimó que "en el periodo
      2015-2019, la nafta presentó un sobreprecio de USD 443 millones, mientras que los consumidores
      uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la referencia de PPI" (Boletín
      Macroeconómico N°27, 03/03/2022). Sumados, nafta + gasoil dan aproximadamente USD 1.780 millones
      para 2015-2019, cifra consistente con el "mil setecientos y pico millones" que Lacalle Pou dijo en
      la conferencia (marca_tiempo 670 de la fuente primaria). El mismo informe da otras cifras para
      2010-2014 (USD 78 millones de nafta subsidiada y USD 1.181 millones de sobreprecio en gasoil) y
      2020-2021 (USD 14 millones en nafta y USD 67 millones en gasoil), que sirven de contexto pero no
      fueron mencionadas por Lacalle Pou en esta cita. El bloque resumen de la primera página del mismo
      PDF repite las cifras de 2015-2019 con un dígito distinto en el gasoil (USD 1137 millones en vez de
      1.337), aparentemente por un error de extracción del texto de una infografía con columnas; el
      párrafo narrativo del cuerpo del documento (carácter 7862) es el que da la cifra limpia y
      contigua, y es la que coincide con la nota de El Observador que resume el mismo informe.
    fuentes:
      - url: https://todoelcampo.com.uy/wp-content/uploads/2022/03/CED-Combustibles.-Boletin-Macroeconomico-N%C2%B027.pdf
        medio: ced
