        tipo: nota
        cita: >-
          En el periodo 2015-2019, la nafta presentó un sobreprecio de USD 443 millones, mientras que
          los consumidores uruguayos de gas oil pagaron aprox. USD 1.337 millones más que la referencia
          de PPI.
        retrieved_at: 2026-09-07
