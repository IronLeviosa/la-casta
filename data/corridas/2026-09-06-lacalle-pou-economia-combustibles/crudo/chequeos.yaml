  afirmacion: En marzo de 2022, por primera vez, los combustibles eran más baratos en Uruguay que en Brasil.
  fragmento: por primera vez los combustibles eran más baratos que en Brasil
  dato_real:
    valor: >-
      Comparando precios oficiales al público en dólares para la semana del 27 de marzo de 2022, el
      resultado difiere según el combustible. NAFTA: en Uruguay la Gasolina Súper 95 costaba $ 74,88 por
      litro (Decreto N° 64/022, PVP vigente desde el 1° de marzo de 2022); convertido al tipo de cambio
      oficial del BCU del 25/03/2022 (cotización billete DLS. USA, compra=venta $ 41,478) da USD 1,81 por
      litro. En Brasil la Gasolina Comum promedió R$ 7,210 por litro esa semana (ANP, Síntese Semanal del
      Comportamiento dos Preços dos Combustíveis, Edição n° 12/2022, semana 20/03/2022 a 26/03/2022);
      convertido a la cotización PTAX de venta del Banco Central do Brasil del 25/03/2022 (R$ 4,7782 por
      USD) da USD 1,51 por litro. Es decir, la nafta en Uruguay costaba más (USD 1,81 vs. USD 1,51 por
      litro), no menos. GASOIL: en Uruguay el Gas Oil 50S costaba $ 53,99 por litro (mismo decreto), USD
      1,30 por litro al mismo tipo de cambio. En Brasil el Óleo Diesel B S10 promedió R$ 6,674 por litro
      esa semana (misma fuente ANP), USD 1,40 por litro a la misma cotización PTAX. Ahí sí el gasoil en
      Uruguay era más barato (USD 1,30 vs. USD 1,40 por litro), una diferencia de aproximadamente 7%. Con
      el tipo de cambio del lunes 28/03/2022 (BCU $ 41,365; BCB R$ 4,7905) la comparación no cambia de
      signo en ninguno de los dos combustibles. En síntesis: la comparación agregada "combustibles más
      baratos que Brasil" es cierta para el gasoil y falsa para la nafta en la fecha de la declaración,
      al menos usando Súper 95 / Gasolina Comum y Gas Oil 50S / Diesel S10 como pares comparables (que
      no son exactamente el mismo producto: Uruguay no vende una nafta de menor octanaje que la Súper
      95, mientras que la Gasolina Comum brasileña es la nafta de base, con mezcla de etanol distinta).
      Sobre "por primera vez": no se encontró una serie histórica oficial pareada Uruguay-Brasil que
      permita fechar hace cuánto tiempo no ocurría; el propio Lacalle Pou lo dice con reserva ("creo que
      del 2001 2002"). Cobertura de prensa de otros años (2022 tardío, 2024) muestra a Uruguay
      sistemáticamente entre los combustibles más caros de la región, lo que sugiere que, si el cruce
      ocurrió, fue una situación puntual y breve ligada al shock de precios del petróleo de
      febrero-marzo de 2022 y no un cambio estructural.
