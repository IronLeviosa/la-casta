# Discrepancias entre prensa y fuente primaria, detectadas al releer las fuentes del lote
# inbox/lacalle-pou/economia/combustibles/2026-09-06/ durante la crítica de la corrida
# 2026-09-06-lacalle-pou-economia-combustibles.
#
# Regla aplicada: solo se registra lo que se puede confrontar contra un documento_oficial,
# diario_de_sesiones o video. Sin verbos de intención: se dice qué publicó el medio y qué dice el
# original, no por qué difieren. Mismo umbral para cualquier medio, sin importar si la diferencia
# favorece o perjudica al político cubierto.
#
# Se cotejaron contra el mismo audio oficial las DOS notas de prensa del lote, con el mismo test
# (¿el texto entre comillas coincide con el registro primario?):
#   - Subrayado: una cita entre comillas difiere del audio. Va abajo.
#   - El País: su única cita entre comillas ("Estamos convencidos de que es una medida de
#     transparencia, que el uruguayo no paga sobrecostos") coincide palabra por palabra con el
#     audio (657,48 s - 666,34 s), salvo una coma que la transcripción automática no puede
#     adjudicar porque no produce puntuación. No hay nada que registrar. Que este archivo tenga un
#     solo medio es el resultado del test, no del recorte del lote.
#
# Descartado a propósito, para dejar el umbral por escrito:
#   - Subrayado escribe «"Estamos convencidos de que es una medida de transparencia y que el
#     uruguayo no paga sobrecosto"» donde el audio transcripto dice "...de transparencia que el
#     uruguayo no paga sobrecostos": un conector monosilábico y un plural. No se registra. El
#     conector no es adjudicable con una transcripción automática (el segmento "que el uruguayo"
#     dura 2,12 s contra 0,62-1,30 s de sus vecinos, compatible con una pausa o con una palabra
#     corta no transcripta) y ni el conector ni el número cambian lo afirmado. Es el mismo umbral
#     que ya fijó la crítica de la corrida 2026-09-05 ("no rompen la literalidad: puntuación,
#     singular/plural, conectores").
#   - Subrayado escribe «"no se trasladaron los costos a todos los uruguayos"» donde el audio dice
#     "no trasladó los costos a todos los uruguayos". Cambia la voz y borra el sujeto (ANCAP), pero
#     no cambia lo afirmado, y el sujeto está en la oración de la propia nota. No se registra.
#   - El País resume la pregunta del periodista como "Consultado sobre si se considera la
#     posibilidad de modificar el método de fijación de precios de los combustibles", sin la
#     premisa que sí traía la pregunta ("usted en la campaña había prometido bajar los
#     combustibles [...] no se cumplió con esa promesa"). Es compresión de una pregunta fuera de
#     comillas, no una cita alterada; se anota en critica.md como contexto omitido y no acá. El
#     mismo criterio deja fuera a Subrayado, que tampoco recoge la premisa.

