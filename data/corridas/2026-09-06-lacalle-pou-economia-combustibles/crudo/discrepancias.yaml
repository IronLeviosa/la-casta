  analisis: >-
    Las dos frases entre comillas de la nota se pueden cotejar contra el audio oficial completo de
    esa misma conferencia, publicado por Presidencia y enlazado desde su propia gacetilla del hecho
    (la carpeta de activos AJ_170 es la misma).

    La primera. La nota publica entre comillas «Hoy por primera vez tenemos combustibles más
    baratos que Brasil». En el audio, entre "por primera vez" y "tenemos combustibles" hay cuatro
    palabras más: "creo que del 2001 2002" (segmentos 707,7 s a 710,7 s). La nota no señala el
    recorte con puntos suspensivos ni con corchetes. Lo que la frase entrecomillada afirma cambia:
    en el audio es una comparación acotada y con reserva explícita del hablante ("creo que"),
    referida a un momento anterior que él mismo data alrededor de 2001-2002; en la nota es una
    afirmación categórica sin reserva y sin referencia temporal, es decir "primera vez" en sentido
    absoluto. Los dos chequeos de esta corrida muestran que la diferencia es operativa: verificar
    "por primera vez desde 2001-2002" y verificar "por primera vez" exigen evidencia distinta.

    La segunda. La nota publica entre comillas «no se trasladaron los costos a todos los
    uruguayos»; el audio dice "no trasladó los costos a todos los uruguayos", con ANCAP y el Poder
    Ejecutivo como sujetos explícitos en la oración previa ("porque la petrolera ANCAP con la
    decisión del Ministerio de Industria de OPP y de Economía y del Presidente de la República con
    la espalda que todavía conservaba ANCAP no trasladó los costos a todos los uruguayos"). Se deja
    constancia pero no motiva por sí sola este registro: el cambio de voz no altera lo afirmado y
    el sujeto aparece en la propia narración de la nota.

    No se afirma nada sobre por qué difieren los textos. Se registra qué publicó el medio y qué
    dice el registro primario.
