    medio: el-observador
    fecha: 2025-04-22
    tipo: nota
    titulo: El Correo completó cinco años de déficit con "pérdidas recurrentes que podrían generar
      incertidumbre"
    cita: La Administración Nacional de Correos acumuló un quinquenio de resultados deficitarios.
      Anualmente recibe aportes del Ministerio de Economía y Finanzas (MEF) que no logran revertir
      el déficit y las auditorías advierten desde hace algunos años sobre las pérdidas constantes.
    retrieved_at: 2026-09-09
  resumen: "La nota reconstruye, a partir de los estados financieros auditados de la ANC y del informe
    de mercado de servicios postales de Ursec del primer semestre de 2024, un quinquenio (2020-2024)
    de resultados negativos, con el aporte anual del MEF cerca de compensar la pérdida cada año, una
    plantilla que bajó de 1.752 a 1.538 funcionarios entre 2020 y 2024, y una posición de mercado
    dispar según el segmento: dominante en cartas (donde la ANC tiene la obligación del Servicio
    Postal Universal) y minoritaria en encomiendas, nacionales e internacionales, donde compite con
    privados en igualdad de condiciones."
