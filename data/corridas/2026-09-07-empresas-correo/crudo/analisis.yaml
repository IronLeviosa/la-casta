  revision:
    tier: publicado
    notas_internas: >-
      Las tres cifras de participación de mercado y la comparación de plantilla con 2020 quedan en
      discutible por falta de documento verificable como texto (Ursec publica sus cuadros de
      mercado como imagen; la fila de personal de 2020 en el balance 2024 está distorsionada por el
      OCR), no porque se haya encontrado un error. Si en una corrida futura se consigue el dato de
      Ursec en formato de datos (xlsx, csv) o se relee la fila de personal del balance 2020 propio,
      esas cuatro afirmaciones pueden recalificarse.
