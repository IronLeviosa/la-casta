  veredicto: >-
    De las nueve afirmaciones, cinco quedaron en verdadero (el resultado del ejercicio, los dos
    aportes del MEF, los ingresos operativos y las retribuciones y cargas sociales): coinciden
    exactamente con los estados financieros auditados. El costo de los servicios prestados quedó en
    impreciso: el monto coincide, pero el porcentaje de aumento que da la nota (5,8%) difiere en 0,4
    puntos porcentuales del que surge del balance (5,4%), dentro del margen que no cambia el sentido
    de lo dicho. Las otras tres quedaron en discutible: la comparación de plantilla con 2020 porque
    la fila de ese año en la tabla del balance 2024 está distorsionada por el OCR del escaneo, y las
    tres cifras de participación de mercado (cartas, encomiendas nacionales y encomiendas
    internacionales) porque el informe de Ursec que la nota cita expone esos datos en gráficos de
    imagen, no en texto extraíble. En conjunto, la nota es una reconstrucción fiel de los estados
    financieros de la ANC; sus cifras de mercado dependen de un documento que hoy no se puede
    verificar como texto, no de un error identificado en la nota.
