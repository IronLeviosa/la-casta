# partir de los registros YA PUBLICADOS (content/politicos/vazquez.yaml, lacalle-pou.yaml,
# mieres.yaml), no de ningún inbox: cuando este lote se investigó el de 2019 todavía no
# estaba promovido y se usó como base un inbox hermano, pero ese trabajo ya se promovió (ver
# razones.md). Cada registro agrega solo lo que aporta este lote — la candidatura de 2014 y,
# para Vázquez, el mandato de Intendente de Montevideo — sobre la base publicada, sin perder
# ninguna candidatura previa. _slug indica el archivo existente que este registro debe
# actualizar; no es un campo del esquema. No lleva procedencia: la escribe pnpm promover /
# pnpm promover --correccion, no el editor.

