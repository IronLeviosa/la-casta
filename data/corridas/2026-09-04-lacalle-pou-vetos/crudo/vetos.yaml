# Los cuatro vetos que Lacalle Pou firmó como presidente (2020-03-01 a 2025-03-01).
# Confirmado como lista completa por teledoce (2024-08-09, "los cuatro vetos de Lacalle Pou"),
# fichas de trámite del Parlamento y verificación propia de que no hay vetos posteriores
# reportados hasta el fin del mandato (ver notas.md, cobertura_del_periodo).

- politico: lacalle-pou
  tema: medioambiente
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Ley de suelos de prioridad forestal (impulsada por Cabildo Abierto)
  numero_ley:
  fecha: 2021-12-16
  alcance: total
  fundamento: >-
    El Poder Ejecutivo observó el proyecto en su totalidad por entender que vulneraba los derechos
    de propiedad, libertad y trabajo de los artículos 32, 36, 50 inciso 1° y 53 de la Constitución,
    al limitar el destino productivo de los suelos sin que surgieran razones de interés general que
    lo justificaran, y por considerar que afectaba la cadena productiva forestal y la seguridad
    jurídica para las inversiones del sector.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2021-12-29
    detalle: >-
      La Asamblea General votó el 29-12-2021: en el Senado 15 votos a favor de rechazar las
      observaciones y 16 en contra (de 31 presentes), y en Diputados 44 a favor y 53 en contra (de
      97 presentes). No se alcanzó la mayoría de tres quintos que exige el artículo 138 de la
      Constitución (se hubieran necesitado 19 votos en el Senado y 59 en Diputados) y el veto quedó
      vigente; el proyecto no se convirtió en ley.
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/148848/ficha_completa
        medio: parlamento
        fecha: 2021-12-29
        tipo: documento_oficial
        titulo: Ficha Asunto 148848 - Suelos prioridad forestal. Plantación bosques. Régimen. Modificación.
        cita: >-
          no se alcanzó la mayoría calificada requerida por el citado artículo.
        retrieved_at: 2026-09-04
  analisis: >-
    El Poder Ejecutivo vetó en su totalidad el proyecto de suelos de prioridad forestal, impulsado
    por Cabildo Abierto con votos del Frente Amplio, por entender que vulneraba derechos de
    propiedad, libertad y trabajo reconocidos en la Constitución. La Asamblea General no reunió los
    tres quintos necesarios para levantar el veto y el proyecto no se convirtió en ley. Meses
    después, en una entrevista, Lacalle Pou usó el episodio como ejemplo de que la coalición de
    gobierno funciona pese a sus diferencias internas: "si uno aprieta, asfixia".
  evidencia:
    nivel: textual
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/148848/ficha_completa
        medio: parlamento
        fecha: 2021-12-16
        tipo: documento_oficial
        titulo: Ficha Asunto 148848 - Suelos prioridad forestal. Plantación bosques. Régimen. Modificación.
        cita: >-
          Poder Ejecutivo veto total.
        retrieved_at: 2026-09-04
      - url: https://www.montevideo.com.uy/Noticias/Lacalle-veto-la-ley-forestal-porque-la-norma-vulnera-derechos-e-impacta-en-la-economia-uc807480
        medio: montevideo-portal
        fecha: 2021-12-16
        tipo: nota
        titulo: Lacalle vetó la ley forestal, porque la norma "vulnera derechos" e impacta en la economía
        cita: >-
          vulnera los derechos de propiedad, libertad y de trabajo
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: transparencia-corrupcion
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Rendición de Cuentas y Balance de Ejecución Presupuestal 2022 (inhibición a fiscales, ley de medios y carnicerías)
  numero_ley: "20.212"
  fecha: 2023-10-24
  alcance: parcial
  articulos_observados:
    - "636"
    - "664"
    - "665"
    - "666"
    - "578"
  fundamento: >-
    El Poder Ejecutivo observó cinco artículos de la Rendición de Cuentas: la inhibición de tres
    años para que el fiscal de Corte y los fiscales penales ejercieran la abogacía tras dejar el
    cargo, por entender que afectaba el derecho al trabajo del artículo 36 de la Constitución; un
    artículo sobre medios de comunicación que consideró mal redactado; y un artículo que devolvía a
    las intendencias la fiscalización de carnicerías fuera de Montevideo.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2023-11-01
    detalle: >-
      La Asamblea General votó el 01-11-2023: el artículo 636 se aprobó con 27 votos a favor y 3 en
      contra en el Senado, y 77 a favor y 6 en contra en Diputados; los artículos 664, 665, 666 y
      578 se aprobaron por unanimidad. El trámite quedó registrado como "Asamblea General no levanta
      veto" y la ley se promulgó el 06-11-2023 sin los cinco artículos observados.
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/159716/ficha_completa
        medio: parlamento
        fecha: 2023-11-01
        tipo: documento_oficial
        titulo: Ficha Asunto 159716 - Rendición de Cuentas y Balance de Ejecución Presupuestal. Ejercicio 2022. Aprobación.
        cita: >-
          Asamblea General no levanta veto.
        retrieved_at: 2026-09-04
  analisis: >-
    El Poder Ejecutivo observó parcialmente la Rendición de Cuentas 2022 en cinco artículos que
    tocaban tres asuntos distintos: la inhibición a fiscales para ejercer la abogacía tras dejar el
    cargo, un artículo sobre medios con un error de redacción y otro sobre fiscalización de
    carnicerías. La Asamblea General no levantó el veto y la ley se promulgó sin esos artículos. No
    se encontraron declaraciones públicas de Lacalle Pou sobre este veto en particular, más allá del
    texto de las observaciones.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/159716/ficha_completa
        medio: parlamento
        fecha: 2023-10-24
        tipo: documento_oficial
        titulo: Ficha Asunto 159716 - Rendición de Cuentas y Balance de Ejecución Presupuestal. Ejercicio 2022. Aprobación.
        cita: >-
          Poder Ejecutivo veto parcial.
        retrieved_at: 2026-09-04
      - url: https://www.elobservador.com.uy/nota/lacalle-pou-veto-tres-articulos-de-la-rendicion-de-cuentas-y-cae-inhibicion-a-fiscales-20231024191249
        medio: el-observador
        fecha: 2023-10-24
        tipo: nota
        titulo: Lacalle Pou vetó tres artículos de la Rendición de Cuentas y cae inhibición a fiscales
        cita: >-
          el veto incluye un artículo referido a medios de comunicación –que quedó mal redactado– y otro vinculado a la fiscalización de las carnicerías en el interior del país que le devolvía potestades a las intendencias
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: salud
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Fondo de Insolvencia Casa de Galicia (créditos laborales de extrabajadores)
  numero_ley: "20.226"
  fecha: 2023-11-17
  alcance: parcial
  articulos_observados:
    - "1"
    - "2"
    - "3"
  fundamento: >-
    El Poder Ejecutivo observó los primeros tres artículos de la ley, que garantizaban los créditos
    laborales de los extrabajadores de Casa de Galicia hasta 105.000 UI por trabajador en un único
    pago, por entender que violaban el principio de igualdad del artículo 8 de la Constitución al
    dar a ese grupo una cobertura más amplia que al resto de los trabajadores privados, y que
    violaban el artículo 86 al fijar plazos de pago que afectaban la planificación financiera del
    Estado. Propuso en cambio un fondo con un tope de 30.000 UI por trabajador.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2023-12-06
    detalle: >-
      La Asamblea General votó el 06-12-2023: en el Senado 17 senadores votaron contra el veto (a
      favor de levantarlo) y 12 a favor de mantenerlo, de 29 presentes, cuando se necesitaban 18
      votos (tres quintos) para levantarlo; en Diputados 56 votaron contra el veto y 41 a favor, de
      97 presentes, cuando se necesitaban 59. El veto quedó firme y la ley se promulgó el 13-12-2023
      con el fondo de hasta 30.000 UI por trabajador que había propuesto el Poder Ejecutivo.
    fuentes:
      - url: https://parlamento.gub.uy/index.php/documentosyleyes/ficha-asunto/160955/ficha_completa
        medio: parlamento
        fecha: 2023-12-06
        tipo: documento_oficial
        titulo: Ficha Asunto 160955 - Casa de Galicia. Trabajadores. Créditos laborales. Usuarios. Garantías. Derechos.
        cita: >-
          Asamblea General no levanta veto.
        retrieved_at: 2026-09-04
  analisis: >-
    El Poder Ejecutivo observó parcialmente la ley que creaba un fondo para pagar créditos laborales
    a extrabajadores de Casa de Galicia, por entender que el texto aprobado por el Parlamento violaba
    el principio de igualdad y afectaba la planificación financiera del Estado, y propuso un fondo
    más acotado. La Asamblea General no alcanzó los tres quintos para levantarlo, por escaso margen
    en el Senado, y la ley se promulgó con la versión reducida. En conferencia de prensa en Dolores,
    Lacalle Pou dijo que "nos tiraron el fardo" y que el veto respondía a razones constitucionales,
    económicas y de justicia.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://parlamento.gub.uy/index.php/documentosyleyes/ficha-asunto/160955/ficha_completa
        medio: parlamento
        fecha: 2023-11-17
        tipo: documento_oficial
        titulo: Ficha Asunto 160955 - Casa de Galicia. Trabajadores. Créditos laborales. Usuarios. Garantías. Derechos.
        cita: >-
          Poder Ejecutivo veto parcial.
        retrieved_at: 2026-09-04
      - url: https://www.subrayado.com.uy/lacalle-pou-argumenta-razones-constitucionalidad-y-conveniencia-veto-parcial-ley-casa-galicia-n931332
        medio: subrayado
        fecha: 2023-11-17
        tipo: nota
        titulo: Lacalle Pou argumenta "razones de constitucionalidad y conveniencia" para veto parcial a ley de Casa de Galicia
        cita: >-
          esos artículos violan el principio de igualdad consagrado en el artículo 8 de la Constitución
        retrieved_at: 2026-09-04

- politico: lacalle-pou
  tema: derechos-humanos
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  titulo: Ley de Servicios de Comunicación Audiovisual (Ley de Medios), artículo 72 sobre imparcialidad política
  numero_ley: "20.383"
  fecha: 2024-08-08
  alcance: parcial
  articulos_observados:
    - "72"
  fundamento: >-
    El Poder Ejecutivo observó el artículo 72, incorporado por Cabildo Abierto, que obligaba a los
    servicios de difusión de contenido audiovisual a informar de forma "completa, imparcial, seria,
    rigurosa, plural y equilibrada" sobre actores políticos. Argumentó que la norma establecía una
    obligación incompatible con la libertad de expresión, que implicaba una forma de censura previa
    y que violaba los artículos 29 y 36 de la Constitución además de tratados internacionales de
    derechos humanos.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2024-10-07
    detalle: >-
      El plazo constitucional para que la Asamblea General se pronunciara vencía el 04-10-2024; no
      hubo sesión ni votación (no se llegó a fijar fecha para tratar el veto) y el 07-10-2024 quedó
      registrado que el veto fue "aceptado tácitamente por vencimiento de plazo constitucional",
      conforme al artículo 139 de la Constitución. La ley se promulgó el 16-10-2024 sin el artículo 72.
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/145888/ficha_completa
        medio: parlamento
        fecha: 2024-10-07
        tipo: documento_oficial
        titulo: Ficha Asunto 145888 - Ley Medios. Modificación.
        cita: >-
          Veto aceptado tácitamente por vencimiento de plazo constitucional.
        retrieved_at: 2026-09-04
  analisis: >-
    El Poder Ejecutivo observó el artículo 72 de la nueva Ley de Medios, que había incorporado
    Cabildo Abierto y exigía a los servicios de difusión audiovisual informar con imparcialidad
    sobre actores políticos, por considerarlo incompatible con la libertad de expresión y una forma
    de censura previa. A diferencia de los otros tres vetos del período, la Asamblea General no
    llegó a votar dentro del plazo constitucional de treinta días y el veto quedó aceptado
    tácitamente por vencimiento de ese plazo. No se encontraron declaraciones públicas de Lacalle
    Pou explicando este veto más allá del texto del propio decreto, difundido por la prensa.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/145888/ficha_completa
        medio: parlamento
        fecha: 2024-08-08
        tipo: documento_oficial
        titulo: Ficha Asunto 145888 - Ley Medios. Modificación.
        cita: >-
          Poder Ejecutivo veto parcial.
        retrieved_at: 2026-09-04
      - url: https://www.ambito.com/uruguay/que-dice-el-veto-luis-lacalle-pou-al-articulo-72-la-ley-medios-n6046304
        medio: ambito
        fecha: 2024-08-09
        tipo: nota
        titulo: ¿Qué dice el veto de Luis Lacalle Pou al artículo 72 de la ley de medios?
        cita: >-
          establece una obligación incompatible con la libertad de expresión
        retrieved_at: 2026-09-04
