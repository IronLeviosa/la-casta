- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  nombre: Juicio político a la intendenta Carolina Cosse (2022-2023)
  tipo: otro
  temas:
    - transparencia-corrupcion
    - sistema-politico
  involucrados:
    - politico: cosse
      rol: mencionado
  resumen: La Junta Departamental de Montevideo, mediante su resolución N° 14.247, comunicada al
    Senado por nota N° 04278 del 26 de octubre de 2022, solicitó el juicio político a la intendenta
    Carolina Cosse (artículos 93, 102, 103 y 296 de la Constitución), a partir del planteo de un
    grupo minoritario de ediles de que la intendenta habría violado la Constitución al no responder
    sistemáticamente pedidos de informes de la oposición. La Cámara de Senadores, actuando como
    corresponde en un juicio político, trató el asunto en sesión del 11 de julio de 2023. El único
    informe jurídico incorporado al expediente, del doctor Álvaro Richino, concluyó que no hubo
    inconstitucionalidad en la actuación de Cosse. El Senado resolvió, por 22 votos en 23, declarar
    que no se había encontrado mérito para separarla del cargo.
  estado_judicial:
    - fecha: 2022-10-26
      etapa: denuncia
      descripcion: La Junta Departamental de Montevideo comunica al Senado, por nota N° 04278, su
        resolución N° 14.247 por la que solicita el juicio político a la intendenta de Montevideo,
        Carolina Cosse, de conformidad con los artículos 93, 102, 103 y 296 de la Constitución.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescss/2023-07-11%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20SENADORES%20(0023).pdf
