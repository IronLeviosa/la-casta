    modelo: claude-sonnet-5
  nombre: Denuncias por el audio filtrado entre Beatriz Argimón y Fernando Cristino (2020)
  tipo: otro
  temas:
    - transparencia-corrupcion
  involucrados:
    - politico: argimon
      rol: mencionado
  resumen: A mediados de junio de 2020 se difundió el audio de una conversación privada entre la
    vicepresidenta Beatriz Argimón y el relacionista público Fernando Cristino, en la que se
    mencionan escuchas telefónicas y un pedido de dinero. El 22 de junio Cristino ratificó ante la
    Fiscalía de Flagrancia de 15º turno una denuncia por amenazas que, según información de
    Subrayado, incluye a Argimón. El 24 de junio la bancada de senadores del Frente Amplio presentó
    una denuncia separada en la Fiscalía General de la Nación, sosteniendo que de la conversación
    podrían desprenderse "diferentes delitos" que involucrarían a la vicepresidenta, y pidió el
    inicio de una investigación; el mismo día, según la diaria, el abogado Gustavo Salle presentó
    otra denuncia penal por el mismo episodio. Argimón respondió públicamente que no quiso decir que
    hubiera "escuchas oficiales". No se halló registro público de que la Fiscalía haya imputado,
    indagado o formalizado a Argimón por este episodio, ni de que las denuncias hayan sido
    resueltas.
  estado_judicial:
    - fecha: 2020-06-22
      etapa: denuncia
      descripcion: Fernando Cristino ratifica ante la Fiscalía de Flagrancia de 15º turno (fiscal Silvia
        Porteiro) una denuncia por amenazas que, según información en poder de Subrayado, incluye a
        la vicepresidenta Beatriz Argimón.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.subrayado.com.uy/fernando-cristino-incluyo-beatriz-argimon-su-denuncia-amenazas-n640446
            medio: subrayado
            fecha: 2020-06-23
            tipo: nota
            titulo: Fernando Cristino incluyó a Beatriz Argimón en su denuncia por amenazas
            cita: Según información en poder de Subrayado, entre otras personas, la denuncia por amenazas está
              referida a la vicepresidenta Beatriz Argimón.
            retrieved_at: 2026-09-09
      _faltante: segunda_fuente
