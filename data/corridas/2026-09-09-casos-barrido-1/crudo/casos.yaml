- nombre: Denuncia por posible violación del artículo 124 de la Constitución (Andrés Ojeda, ejercicio
    de la abogacía como senador)
  tipo: otro
  temas:
    - transparencia-corrupcion
  involucrados:
    - politico: ojeda
      rol: mencionado
  resumen: 'El 20 de noviembre de 2025, en una audiencia judicial, la fiscal de Flagrancia de 15º
    turno Sylvia Lovesio planteó que el senador colorado Andrés Ojeda podría haber violado el
    artículo 124 de la Constitución al presentar, en su rol de abogado penalista, un escrito de más
    de 70 páginas ante la Fiscalía para solicitar el reexamen de una causa penal archivada en 2022.
    El artículo 124 prohíbe a los legisladores tramitar asuntos de terceros ante servicios
    descentralizados (la Fiscalía lo es desde 2015) y sanciona su incumplimiento con la pérdida
    inmediata de la banca. El convencional colorado Juan Esequiel Ibarra presentó además una
    denuncia formal ante la Secretaría General y el Comité de Ética del Partido Colorado por el
    mismo hecho. A pedido de Ojeda, un informe de la División Jurídica del Poder Legislativo
    (11/12/2025) concluyó que su actuación "no encuadraría" en las prohibiciones del artículo 124 y
    que no correspondería su cese inmediato. El Frente Amplio mantuvo el tema abierto en la Comisión
    de Constitución y Legislación del Senado. El 12 de marzo de 2026 la fiscal Lovesio formalizó su
    decisión: dio por "no presentado" el escrito de Ojeda, archivó el expediente de la causa penal
    en la que había intervenido, y concluyó que la actuación del senador contravino el artículo 124
    de la Constitución. Tras esa resolución, la bancada del Frente Amplio en el Senado retomó el
    planteo: en la sesión del 17 de marzo de 2026 la Comisión de Constitución y Legislación rechazó,
    por 5 votos en 9, una moción colorada para archivar el caso, y resolvió convocar a los
    constitucionalistas Martín Risso, José Korzeniak y Daniel Ochs. No se inició juicio político y
    no se halló una resolución final posterior de la comisión ni del plenario del Senado.'
