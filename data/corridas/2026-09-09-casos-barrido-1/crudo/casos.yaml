  resumen: En una entrevista para el libro "Los indomables", del periodista Pablo Cohen, publicada en
    diciembre de 2024, la exvicepresidenta Lucía Topolansky afirmó que hubo testigos que mintieron
    en juicios contra militares acusados de crímenes de lesa humanidad durante la dictadura
    (1973-1985) para lograr sus condenas, sin identificar a personas ni hechos concretos ("nosotros
    sabemos quiénes son los que mintieron dentro de la izquierda, pero no lo vamos a decir"). Las
    declaraciones generaron rechazo de la asociación Madres y Familiares de Uruguayos Detenidos
    Desaparecidos, del Frente Amplio y del PIT-CNT. El fiscal especializado en Crímenes de Lesa
    Humanidad, Ricardo Perciballe, pidió citarla para que aclarara sus dichos; la jueza penal
    Verónica Pena rechazó el pedido por falta de sustento jurídico y dispuso que, al tratarse de un
    hecho con apariencia delictiva, debía remitirse a una fiscalía de Flagrancia bajo el nuevo
    Código del Proceso Penal, que resolvería si citaba a Topolansky como indagada o como testigo; el
    caso se asignó por sorteo a la fiscal Eliana Travers el 26 de diciembre de 2024. El 6 de marzo
    de 2025 el Tribunal de Apelaciones en lo Penal de 4.º turno revocó la decisión de la jueza Pena
    y habilitó a Perciballe a tomarle testimonio directamente, como testigo, en su causa original.
    El 27 de marzo de 2025 Topolansky declaró durante dos horas ante la Fiscalía; según informó la
    propia Fiscalía General de la Nación, "no aportó ningún nombre concreto ni ningún dato útil para
    la investigación". No fue citada en ningún momento como indagada.
