- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  nombre: Investigación penal por la construcción del Antel Arena
  tipo: corrupcion
  temas:
    - transparencia-corrupcion
    - empresas-publicas
  involucrados:
    - politico: cosse
      rol: imputado
  resumen: El directorio de ANTEL presidido por Gabriel Gurméndez presentó en 2021 una denuncia penal
    por presuntas irregularidades administrativas en la construcción del complejo Antel Arena, a
    partir de una auditoría externa de la consultora Ecovis que cuestionó el uso sistemático de
    compra directa por excepción y el costo final de la obra, muy superior al presupuesto original
    difundido (entre USD 40 y 45 millones) por la entonces presidenta de ANTEL, Carolina Cosse,
    luego intendenta de Montevideo. Cosse declaró como indagada ante la Fiscalía de Delitos
    Económicos en julio de 2022. En febrero de 2024 el fiscal Alejandro Machado archivó la causa por
    falta de ilicitud penal, aunque constató "desprolijidades" y un "manejo dispendioso de los
    recursos públicos". A pedido del directorio de ANTEL, un juez habilitó el reexamen del caso en
    abril de 2024, que pasó al fiscal Enrique Rodríguez. El 13 de febrero de 2025 Rodríguez confirmó
    el archivo definitivo, al concluir que no hubo desviación penalmente sancionable ni actos de
    corrupción en el proceso de construcción. Cosse, ya vicepresidenta electa, calificó el proceso
    como una "operación política".
  estado_judicial:
    - fecha: 2021-06-02
      etapa: denuncia
      descripcion: El vicepresidente de ANTEL, Robert Bouvier, anuncia que el ente presentará una denuncia
        penal por presuntas irregularidades en la construcción del Antel Arena, a partir de una
        auditoría externa de la consultora Ecovis que detectó apartamientos a las normas de
        contratación administrativa durante la gestión de la presidenta Carolina Cosse.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/antel-realizara-una-denuncia-penal-tras-auditoria-por-antel-arena--202162181634
            medio: el-observador
            fecha: 2021-06-02
            tipo: nota
            titulo: Antel realizará una denuncia penal tras auditoría del Antel Arena
            cita: El vicepresidente de Antel, Robert Bouvier, anunció este miércoles en conferencia de prensa
              que el ente realizará "la denuncia penal correspondiente" a raíz de los resultados de
              la auditoría externa del complejo multifuncional Antel Arena, llevada a cabo por la
              firma Ecovis.
            retrieved_at: 2026-09-09
