  resumen: 'En 2008, cuando Rodolfo Nin Novoa era vicepresidente de la República, el correligionario
    frenteamplista y exsenador Julio Lara lo denunció por no haber declarado, en su declaración
    jurada patrimonial de 2007, su participación en una sociedad rural que gestionaba junto a dos de
    sus hermanos para explotar un campo en Cerro Largo. La jueza Fanny Canessa pidió en noviembre de
    2010 el desafuero de Nin Novoa, ya senador del Frente Amplio, para procesarlo por "falsificación
    ideológica" cometida por funcionario público. El 2 de agosto de 2011 el Senado rechazó el pedido
    por 19 votos en 28, con apoyo de su propio partido y también de senadores colorados, al entender
    que no había mérito: según explicó el senador Rafael Michelini, la fiscalía no encontró
    ocultamiento de bienes ni incremento patrimonial, sino una declaración con incongruencias
    menores. Nin Novoa nunca fue formalizado ni imputado formalmente y la causa quedó archivada tras
    el rechazo del desafuero.'
