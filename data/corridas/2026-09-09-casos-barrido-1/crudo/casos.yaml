- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  nombre: Comisión Investigadora sobre el sistema financiero y la capitalización del Banco Comercial
    (crisis de 2002)
  tipo: otro
  eventos:
    - crisis-2002
  temas:
    - transparencia-corrupcion
    - economia
  involucrados:
    - politico: batlle
      rol: mencionado
  resumen: En octubre de 2002, en plena crisis bancaria, la Cámara de Representantes integró una
    Comisión Investigadora sobre el sistema financiero para analizar la actuación del Banco Central,
    el Ministerio de Economía y las responsabilidades derivadas del contrato de "capitalización del
    Banco Comercial" firmado en nombre del Estado uruguayo. Al informarse los resultados en el
    pleno, el 1° de abril de 2004, la diputada Silvana Charlone (Encuentro Progresista-Frente
    Amplio) sostuvo que el contrato, autorizado por el presidente Jorge Batlle el 26 de febrero de
    2002 sin aprobación parlamentaria, constituyó una "violación grave de la Constitución" y que a
    Batlle le cabía responsabilidad directa; su moción proponía remitir lo actuado a la Justicia
    Penal con esa imputación. La moción fue rechazada (38 en 82). La Cámara aprobó en cambio, por 56
    en 84, una resolución de alcance general que remite a la Justicia los antecedentes de la
    Comisión Investigadora para determinar si hubo hechos delictivos, sin individualizar
    responsables, e insta al Banco Central y al Poder Ejecutivo a determinar responsabilidades
    técnico-administrativas. No se halló registro público de que Batlle haya sido indagado,
    formalizado o imputado en sede penal por este episodio.
  estado_judicial:
    - fecha: 2002-10-08
      etapa: investigacion
      descripcion: La Cámara de Representantes integra la Comisión Investigadora sobre el Sistema
        Financiero (asunto 2450/2002), encargada de analizar la actuación del BCU y el MEF y las
        responsabilidades derivadas del contrato de capitalización del Banco Comercial suscrito en
        nombre del Estado.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/20426/ficha_completa?GA=
            medio: parlamento
            fecha: 2002-10-08
            tipo: documento_oficial
            titulo: Ficha Asunto 20426 - Investigadora Sistema Financiero
            cita: "Integración. Tomo:0 Página:35 Diario:3071 INVESTIGADORA SISTEMA FINANCIERO : Mieres Gómez,
              Pablo; Amorín Batlle, José; Berois Quinteros, Ricardo Carlos; Charlone Martínez,
              Silvana Mabel; Fernández Chaves Tizze, Alejo; Sendic Rodríguez, Raúl Fernando; Pais
              Rivanera, Gabriel Raúl; Argenzio Santos, Raúl Nicolás; Pérez Stewart, Pedro César"
            retrieved_at: 2026-09-09
    - fecha: 2004-04-01
      etapa: denuncia
      descripcion: En el pleno de la Cámara de Representantes, la diputada Silvana Charlone (Encuentro
        Progresista-Frente Amplio) plantea la responsabilidad directa del presidente Jorge Batlle
        por la firma, sin aprobación parlamentaria, del contrato de capitalización del Banco
        Comercial, y pide que la Cámara declare que actuó en violación grave de la Constitución.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/2004-04-01%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0012).pdf
            medio: parlamento
            fecha: 2004-04-01
            tipo: diario_de_sesiones
            titulo: Diario de sesiones de la Cámara de Representantes, 1° de abril de 2004
            cita: Quiero subrayar -me parece indispensable- que estamos planteando la responsabilidad directa
              que cabe al doctor Jorge Batlle en todo lo actuado.
            retrieved_at: 2026-09-09
    - fecha: 2004-04-01
      etapa: archivo
      descripcion: El pleno rechaza, 38 en 82, la moción que atribuía responsabilidad directa a Batlle y
        proponía remitirla a la Justicia Penal; aprueba en cambio, 56 en 84, una resolución de
        alcance general que remite a la Justicia los antecedentes de la Comisión Investigadora sin
        individualizar responsables. Ninguna fuente posterior registra que Batlle haya sido indagado
