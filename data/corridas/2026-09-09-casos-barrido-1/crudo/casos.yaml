- nombre: Denuncia falsa por agresión contra Yamandú Orsi (2024)
  tipo: otro
  temas:
    - transparencia-corrupcion
  involucrados:
    - politico: orsi
      rol: mencionado
  resumen: 'El 13 de marzo de 2024, en plena campaña interna del Frente Amplio, una mujer trans de 42
    años, trabajadora sexual, denunció ante la Seccional 10ª de Montevideo que el entonces
    precandidato presidencial Yamandú Orsi la había agredido físicamente en 2014. La denuncia,
    asignada a la fiscal de Ciudad de la Costa de 2º turno Sandra Fleitas, surgió a partir de un
    video previo de la militante nacionalista Romina Celeste Papasso en redes sociales. Orsi negó
    los hechos y calificó la denuncia de maniobra política. El 3 y el 5 de mayo de 2024 la propia
    denunciante, Paula Díaz, reconoció en una entrevista televisiva que la denuncia era falsa y
    había sido ideada junto con Papasso; el 6 de mayo Orsi presentó una denuncia penal por
    "simulación de delito y difamación", ambas mujeres fueron detenidas, y la Justicia condenó a
    Díaz (proceso abreviado, 20 meses de libertad a prueba) y en agosto a Papasso (2 años y 1 mes de
    penitenciaría) por asociación para delinquir, calumnia, difamación y otros delitos conexos. El
    24 de septiembre de 2024 la fiscal Fleitas archivó la investigación abierta para determinar si
    habían actuado terceros o hubo un móvil político, concluyendo que no pudo acreditarse la
    participación de terceras personas ni otra motivación que la económica de las dos condenadas.
    Orsi no fue imputado en ningún momento: fue el denunciado, luego querellante contra sus
    denunciantes, y finalmente la Fiscalía cerró el caso sin encontrar responsables además de las
    dos mujeres ya condenadas.'
