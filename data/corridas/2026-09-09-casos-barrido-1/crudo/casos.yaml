  involucrados:
    - politico: manini-rios
      rol: imputado
  resumen: "Guido Manini Ríos, entonces comandante en jefe del Ejército, recibió en 2018 el expediente
    del Tribunal de Honor Militar en el que el represor José Nino Gavazzo confesó haber arrojado al
    río Negro, en 1973, el cuerpo del militante tupamaro Roberto Gomensoro. Según su propia versión,
    Manini Ríos informó verbalmente de esa confesión al entonces ministro de Defensa Jorge Menéndez
    (fallecido en 2019), pero no presentó la denuncia penal correspondiente ante la Justicia. La
    Fiscalía recibió una denuncia por ese hecho el 1 de abril de 2019 y, tras archivar la
    investigación contra el resto de los generales involucrados en el Tribunal de Honor, entendió
    que Manini Ríos sí era responsable del delito de omisión de denuncia y pidió su desafuero para
    formalizarlo. El Senado, ya con Manini Ríos como senador electo por Cabildo Abierto, rechazó el
    desafuero el 30 de setiembre de 2020 por 16 votos en contra y 15 a favor (se necesitaban 21).
    Tras perder la banca en febrero de 2025, la Fiscalía reabrió la evaluación del caso sin
    necesidad de autorización parlamentaria, pero en agosto de 2025 lo archivó por prescripción: el
    delito de omisión prescribe a los cuatro años y el plazo se había cumplido en 2023. Manini Ríos
    nunca fue formalizado ni imputado formalmente; sostuvo en todo momento que había cumplido con
    informar a su superior jerárquico."
