- _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  nombre: Denuncia ante la JUTEP por el pase en comisión de la hermana de Beatriz Argimón
  tipo: otro
  temas:
    - transparencia-corrupcion
  involucrados:
    - politico: argimon
      rol: mencionado
  resumen: La vicepresidenta Beatriz Argimón designó a su hermana Estela Argimón, funcionaria de
    carrera del Banco República, como asesora de su despacho en el Senado mediante un pase en
    comisión. Antes de agosto de 2020 la Junta de Transparencia y Ética Pública (Jutep) recibió una
    denuncia por esa designación, que planteaba una posible contradicción con el artículo 35 del
    decreto 30/003 (que prohíbe la actuación, en la misma oficina, de un funcionario vinculado por
    parentesco de segundo grado con su jerarca). El 10 de agosto de 2020 la Jutep, con la firma de
    sus tres integrantes, archivó la denuncia al concluir que la contratación no contraviene el
    artículo 36 de la ley 19.823 y que se ajusta al artículo 32 de la ley 15.851, que autoriza a la
    vicepresidenta a solicitar pases en comisión. El expresidente de la Jutep, Ricardo Gil Iribarne,
    expresó después "dudas" sobre ese archivo.
  estado_judicial:
    - fecha: 2020-08-03
      etapa: investigacion
      descripcion: El nuevo directorio de la Jutep (Susana Signorino, Guillermo Ortiz y Jorge Castro)
        tiene pendiente de resolución, entre unas quince denuncias, la situación de la
        vicepresidenta Beatriz Argimón por la designación de su hermana como asesora en su despacho
        del Senado.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/polemica-en-la-ursec-inac-y-la-hermana-de-argimon-algunos-temas-pendientes-que-debera-tratar-la-jutep-20207301990
            medio: el-observador
            fecha: 2020-08-03
            tipo: nota
            titulo: La hermana de Argimón y otros temas pendientes en la Jutep
            cita: También deberá decidir si se actuará de oficio en situaciones como la de la vicepresidenta de
              la República, Beatriz Argimón, quien designó a su hermana como asesora en su despacho
              del Senado, lo que contradice al artículo 35 del decreto 30/003
            retrieved_at: 2026-09-09
      _faltante: segunda_fuente
    - fecha: 2020-08-10
      etapa: archivo
      descripcion: La Jutep archiva la denuncia contra Argimón por tener a su hermana en un pase en
        comisión, al concluir que la contratación no contraviene el artículo 36 de la ley 19.823 y
        se ajusta al artículo 32 de la ley 15.851.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.elobservador.com.uy/nota/jutep-archiva-la-denuncia-por-la-contratacion-de-la-hermana-de-la-vicepresidenta-beatriz-argimon-202081014411
            medio: el-observador
