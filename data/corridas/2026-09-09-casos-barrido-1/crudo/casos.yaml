- nombre: Caso Ancap - Raúl Sendic (abuso de funciones y peculado)
  tipo: corrupcion
  temas:
    - transparencia-corrupcion
    - empresas-publicas
  involucrados:
    - politico: sendic
      rol: imputado
  resumen: El 19 de abril de 2016 los cuatro partidos de oposición (Partido Nacional, Partido
    Colorado, Partido Independiente y Unidad Popular) presentaron denuncias penales ante el juzgado
    especializado en Crimen Organizado para que se investigara la gestión de ANCAP entre 2011 y
    2014, período en que la empresa estatal registró pérdidas por USD 602 millones y en el que Raúl
    Sendic presidió el ente (cargo que dejó en octubre de 2013 para asumir como vicepresidente de la
    República). Las denuncias abarcaban contratos de publicidad, licitaciones de transporte de cal,
    un contrato con la Armada, el acuerdo con la financiera Exor para cancelar una deuda con la
    petrolera venezolana Pdvsa, importaciones regularizadas tardíamente y la intermediación con
    Trafigura y Petroecuador. A raíz de una investigación de Búsqueda sobre el uso de tarjetas
    corporativas de ANCAP por parte de Sendic, se sumó una denuncia adicional por ese hecho; en
    setiembre de 2017 la Junta de Transparencia y Ética Pública (Jutep) concluyó que Sendic incurrió
    en "violaciones" a las normas de administración de fondos públicos, y Sendic renunció a la
    vicepresidencia el 13 de setiembre de 2017. El fiscal de Crimen Organizado Luis Pacheco pidió el
    procesamiento de nueve jerarcas de ANCAP y ALUR; el 24 de mayo de 2018 la jueza Beatriz Larrieu
    procesó sin prisión solamente a Sendic, por abuso de funciones (el contrato con Exor) y peculado
    (uso de las tarjetas corporativas), y absolvió a los otros ocho investigados. El procesamiento
    fue apelado y confirmado por el Tribunal de Apelaciones y, tras un recurso de casación, por la
    Suprema Corte de Justicia; quedó firme en febrero de 2020. El 9 de diciembre de 2020 el fiscal
    Pacheco pidió una condena de 18 meses de prisión, 4 años de inhabilitación para cargos públicos
    y una multa de 500 UR. El 20 de mayo de 2021 la jueza María Helena Mainard condenó a Sendic por
    abuso de funciones y peculado a esa misma pena, pero por ser primario le concedió la suspensión
    condicional (si no cometía un nuevo delito en un año, la condena y los antecedentes se
    extinguían). La defensa anunció que apelaría la sentencia condenatoria; no se encontró
    información pública sobre el resultado de esa apelación.
