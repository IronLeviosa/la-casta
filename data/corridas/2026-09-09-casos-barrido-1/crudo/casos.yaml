            tipo: nota
            titulo: Jutep archiva la denuncia por pase en comisión de la hermana de la vicepresidenta Beatriz
              Argimón
            cita: El informe de la Jutep, al que accedió El Observador, señala que la contratación no
              contraviene el artículo 36 de la ley 19.823 del nuevo código de ética de la función
              pública.
            retrieved_at: 2026-09-09
          - url: https://ladiaria.com.uy/politica/articulo/2020/11/ex-presidente-de-la-jutep-cuestiona-al-actual-directorio-del-organismo-no-ha-tenido-una-actitud-proactiva/
            medio: la-diaria
            fecha: 2020-11-23
            tipo: nota
            titulo: 'Ex presidente de la Jutep cuestiona al actual directorio del organismo: "no ha tenido una
              actitud proactiva"'
            cita: Gil Iribarne dijo tener "dudas" acerca del archivo de la denuncia contra Argimón por tener a
