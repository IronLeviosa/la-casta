            cita: Ante la resolución N° 14.247 de la Junta Departamental de Montevideo, comunicada a través de
              la nota N° 04278, de fecha 26 de octubre de 2022, la Cámara de Senadores
            retrieved_at: 2026-09-09
    - fecha: 2023-07-11
      etapa: absolucion
      descripcion: La Cámara de Senadores resuelve, por 22 votos en 23, declarar que no se ha encontrado
        mérito para proceder a la separación del cargo de la intendenta de Montevideo, Carolina
        Cosse.
