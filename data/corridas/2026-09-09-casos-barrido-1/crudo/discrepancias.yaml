    cita: >-
      Manini Ríos fue quien recibió el expediente completo como comandante del Ejército. Según su
      versión, informó verbalmente al entonces ministro de Defensa, José Bayardi, pero no presentó
      la denuncia ante la Justicia, lo que derivó en una posible infracción penal.
