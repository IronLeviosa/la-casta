# Discrepancias detectadas al releer las fuentes del lote — corrida 2026-09-09-casos-barrido-1
# Crítico: Opus 5 (claude-opus-5[1m]). No escribo en content/: esto lo evalúa el editor.
#
# Umbral aplicado, escrito antes de las entradas para que la simetría se pueda auditar: registro
# solo lo que un documento primario que leí en esta sesión contradice. Apliqué el mismo test a
# todas las notas del lote que releí, y estos son los casos que consideré y NO registré, con el
# motivo, para que se vea que el test no se aflojó con nadie:
#
#   - El Observador (2024-02-22) escribe que el fiscal Machado "no encontró delitos"; El Observador
#     (2025-02-13) escribe que "sí constató 'desprolijidades' y un 'manejo dispendioso de los
#     recursos públicos'". Es el mismo medio contra sí mismo, y el documento que decide es el
#     dictamen de archivo del fiscal, que no abrí. No se registra.
#   - El Observador (2024-02-22): "Cosse no pudo explicar ante el fiscal Rodríguez […] cómo fue que
#     la obra pasó de tener un costo de US$ 40 a US$ 120 millones". El propio El Observador
#     (2025-02-13) publica que el fiscal tomó como cifra oficial la del Tribunal de Cuentas
#     (US$ 85.995.517). El documento que decide es el informe del Tribunal de Cuentas al Parlamento
#     de 2019, que no abrí. No se registra: es un documento previsible y va a la crítica.
#   - El Observador (2021-06-02) dice "US$ 118 millones"; Subrayado (2022-02-15) y Montevideo Portal
#     (2022-07-28) dicen "120 millones". El documento que decide es la auditoría de Ecovis, que no
#     abrí. No se registra.
#   - Caras y Caretas (2025-07-22): "la solicitud fue bloqueada por los votos de su propio partido y
#     del Partido Nacional". El diario de sesiones del 30/9/2020 registra el voto nominal por
#     nombre, no por partido, así que por sí solo no decide qué bancada votó qué. Lo digo
#     expresamente porque habría sido una segunda entrada contra el mismo medio y no la registro
#     por falta de documento: el que decidiría es la integración del Senado por partido (Corte
#     Electoral / Parlamento). Va a la crítica como desacuerdo.
#   - El Observador (2025-08-29): "El ilícito tiene penas que van desde los tres meses hasta los dos
#     años de prisión"; Caras y Caretas (2025-07-22) y Montevideo Portal (2025-07-21): "pena máxima
#     […] de 18 meses". El documento que decide es el artículo 177 del Código Penal (IMPO), que no
#     abrí. No se registra.
#   - Portal 180 (2020-07-03): "la denuncia que presentó Lust ayer en fiscalía"; Montevideo Portal
#     (2020-07-14) fecha la presentación el 14 de julio. Dos medios sin documento primario (la
#     denuncia o la carpeta de Fiscalía). No se registra.
#   - Búsqueda (2025-12-11) escribe que la Fiscalía General de la Nación es servicio descentralizado
#     "desde 2017"; el registro del lote escribe "desde 2015". Acá el que difiere del medio es el
#     registro, no el medio: va a la crítica como objeción al registro, no acá.
#
# Las dos entradas que quedan son de notas sobre Guido Manini Ríos, una de un medio con
# `alineamiento: progresista` (Caras y Caretas) y otra de uno con `alineamiento: sin_datos`
# (Montevideo Portal). Lo digo porque el sesgo cómodo sería registrar solo errores de medios de un
# lado: el mismo test se corrió sobre El Observador, Búsqueda, Subrayado, la diaria, Ámbito y
# Portal 180, y en todos los casos el documento que decidía era uno que no abrí, así que no se
# registró nada contra ellos. Ninguna de las dos entradas depende de un medio nuevo.

