    titulo: "Sin fueros: Fiscalía decide si pide imputación de Manini Ríos, tal como lo hiciera en 2020"
    cita: >-
      En marzo de 2020, el fiscal Ricardo Morosoli solicitó su desafuero, pero el cuerpo legislativo
      no lo votó.
    retrieved_at: 2026-09-09
  fuente_primaria:
    cita: >-
      Han sufragado treinta y un integrantes del Cuerpo: quince lo han hecho por la afirmativa y
      dieciséis por la negativa. SEÑORA PRESIDENTA.- La votación ha resultado: Negativa.
    fuentes:
