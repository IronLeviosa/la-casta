# Vetos de Tabaré Vázquez como presidente, primer mandato (2005-03-01 a 2010-03-01) y
# segundo mandato (2015-03-01 a 2020-03-01).
#
# Se identificó un solo veto en los dos mandatos: el del 14-11-2008, a los capítulos II, III y IV
# (artículos 7 a 20) del proyecto de ley de Defensa del Derecho a la Salud Sexual y Reproductiva,
# que regulaban la interrupción voluntaria del embarazo. No se encontró ningún veto en el resto del
# primer mandato ni en el segundo (2015-2020); ver notas.md, cobertura_del_periodo, para el detalle
# de las búsquedas que sostienen esa ausencia.

