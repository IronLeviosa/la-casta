  fundamento: >-
    El Poder Ejecutivo observó los Capítulos II, III y IV del proyecto, artículos 7 a 20, que
    regulaban la interrupción voluntaria del embarazo, por entender que afectaban el orden
    constitucional (artículos 7, 8, 36, 40, 41, 42, 44, 72 y 332 de la Constitución) y compromisos
    asumidos por Uruguay en el Pacto de San José de Costa Rica y la Convención sobre los Derechos
    del Niño, y porque consideraba que la vida humana comienza en la concepción.
  resultado:
    estado: observaciones_aceptadas
    fecha: 2008-11-20
    detalle: >-
      La Asamblea General recibió las observaciones el 14-11-2008, pasó el asunto a la Comisión de
      Asuntos Laborales y Seguridad Social y, en su sesión extraordinaria n.º 13 del 20-11-2008
      (Diario n.º 54), no levantó el veto. No se encontró en las fuentes consultadas el detalle del
      recuento de votos de esa sesión (ver notas.md, hipotesis). El Poder Ejecutivo promulgó la ley
      el 01-12-2008 como Ley N.º 18.426, sin los artículos observados: el texto que quedó vigente
      regula la política nacional de salud sexual y reproductiva pero no despenaliza el aborto.
    fuentes:
      - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/29685/ficha_completa
        medio: parlamento
        fecha: 2008-11-20
        tipo: documento_oficial
        titulo: Ficha Asunto 29685 - Salud Sexual y Reproductiva. Código Penal. Modificación.
        cita: >-
          20-11-2008 A.G. 219/2008 Asamblea General no levanta veto.
        retrieved_at: 2026-09-05
  analisis: >-
    El Poder Ejecutivo observó en su totalidad los capítulos del proyecto de salud sexual y
    reproductiva que habilitaban la interrupción voluntaria del embarazo, aprobado por una
    iniciativa impulsada por la propia bancada oficialista del Frente Amplio. La Asamblea General no
    levantó el veto y la ley se promulgó sin esos artículos, de forma que Uruguay no despenalizó el
    aborto en este período; el proyecto volvió a aprobarse, ya sin observaciones del entonces
    presidente José Mujica, en 2012. La decisión generó un conflicto dentro del propio gabinete: la
    resolución del veto se firmó solo con la rúbrica de la ministra de Salud Pública, María Julia
    Muñoz, después de que otros ministros se negaran a firmarla, y el Partido Socialista, del que
    Vázquez era afiliado, cuestionó públicamente el veto tras conocerse la resolución.
