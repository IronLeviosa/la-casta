- _id: ancap-raul-sendic-abuso-funciones-peculado
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  nombre: Caso Ancap - Raúl Sendic (abuso de funciones y peculado)
  tipo: corrupcion
  temas:
    - transparencia-corrupcion
    - empresas-publicas
  involucrados:
    - politico: sendic
      rol: imputado
  resumen: >-
    Los cuatro partidos de oposición presentaron denuncias penales contra la gestión de Raúl Sendic
    al frente de ANCAP, que entre 2011 y 2014 registró pérdidas por USD 602 millones; las denuncias
    abarcaban contratos de publicidad, licitaciones de transporte de cal, un contrato con la Armada,
    el acuerdo con la financiera Exor para cancelar una deuda con la petrolera venezolana Pdvsa,
    importaciones regularizadas tardíamente y la intermediación con Trafigura y Petroecuador.


    A raíz de una investigación periodística sobre el uso de tarjetas corporativas de ANCAP por
    parte de Sendic se sumó una denuncia adicional por ese hecho, que la Junta de Transparencia y
    Ética Pública confirmó en un informe propio; Sendic renunció a la vicepresidencia de la
    República después de que el Tribunal de Conducta Política del Frente Amplio cuestionara ese
    mismo uso.


    El fiscal de Crimen Organizado Luis Pacheco pidió el procesamiento de nueve jerarcas de ANCAP y
    ALUR, de más de una decena de jerarcas investigados originalmente; la Justicia procesó sin
    prisión solamente a Sendic, por abuso de funciones (el contrato con Exor) y peculado (uso de las
    tarjetas corporativas), y absolvió a los otros ocho. El procesamiento fue apelado; no se
    encontró información pública sobre el resultado. La Justicia condenó después a Sendic por los
    mismos delitos y, por ser primario, le concedió la suspensión condicional de la pena (si no
    cometía un nuevo delito en un año, la condena y los antecedentes se extinguían).


    La defensa anunció que apelaría esa condena; tampoco se encontró información pública sobre el
    resultado de esa apelación ni sobre si se cumplió la condición de la suspensión.
