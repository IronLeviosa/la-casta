- _id: denuncia-penal-contrato-upm-ii-contra
  _investigacion:
    agente: editor
    modelo: claude-sonnet-5
  nombre: Denuncia penal por el contrato UPM II contra Tabaré Vázquez y su gabinete
  tipo: otro
  temas:
    - transparencia-corrupcion
    - medioambiente
  involucrados:
    - politico: vazquez
      rol: denunciado
  resumen: >-
    El 14 de julio de 2020 el diputado de Cabildo Abierto Eduardo Lust presentó una denuncia penal
    ante la Fiscalía General de la Nación contra el expresidente Tabaré Vázquez, el exsecretario de
    la Presidencia Miguel Ángel Toma, el ex prosecretario Juan Andrés Roballo y el exdirector de la
    OPP Álvaro García, por presuntas irregularidades en la firma del contrato entre Uruguay y UPM
    para la segunda planta de celulosa.


    Lust sostuvo que una enmienda de 2018 al contrato original de noviembre de 2017 cambió el canon
    que UPM debía pagar por el uso de la vía férrea de Paso de los Toros a Montevideo de US$ 0,5 a
    US$ 0,05 por tonelada bruta por kilómetro, lo que habría generado una pérdida de USD 400
    millones para el Estado, y que los delegados de Presidencia no tenían competencia para acordar
    ese cambio; imputó los delitos de fraude, conjunción del interés personal y público, y abuso de
    funciones (artículos 160 a 162 del Código Penal). Vázquez murió el 6 de diciembre de 2020, antes
    de que la causa se resolviera.


    El 5 de enero de 2021 el fiscal especializado en Delitos Económicos de 1.º turno, Enrique
    Rodríguez, archivó la denuncia: concluyó que la diferencia entre las versiones del contrato se
    debía a "un error tipográfico" detectado casi de inmediato tras la firma, y que los
    representantes de UPM confirmaron que la empresa nunca manejó otra cifra que la del contrato en
    inglés, por lo que "no se verifica una desviación o irregularidad en la conducta de los
    investigados, pasible de ser sancionada penalmente".
  estado_judicial:
    - fecha: 2020-07-14
      etapa: denuncia
      descripcion: El diputado de Cabildo Abierto Eduardo Lust presenta una denuncia penal ante la
        Fiscalía General de la Nación contra el expresidente Tabaré Vázquez y su gabinete (Miguel
        Ángel Toma, Juan Andrés Roballo, Álvaro García) por presuntas irregularidades —fraude,
        conjunción de interés personal y público, y abuso de funciones— en una enmienda al contrato
        con UPM para la segunda planta de celulosa. Portal 180 había informado el 3 de julio que
        Lust presentaría la denuncia; no consta si hubo una presentación previa a la del 14 de
        julio.
      evidencia:
        nivel: reportado
        fuentes:
          - url: https://www.montevideo.com.uy/Noticias/Diputado-Lust-presento-denuncia-penal-en-Fiscalia-contra-Tabare-Vazquez-por-UPM-II-uc758508
            medio: montevideo-portal
            fecha: 2020-07-14
            tipo: nota
            titulo: Diputado Lust presentó denuncia penal en Fiscalía contra Tabaré Vázquez por UPM II
