- politico: astori
  declaracion: astori/2005-11-07-reforma-tributaria-iva-veinte-por-ciento
  tema: economia/impuestos
  _slug: iva-tasa-basica-veinte-por-ciento
  _investigacion: { agente: investigador }
  fecha: 2005-11-07
  titulo: La promesa de bajar el IVA al 20%
  afirmacion: El gobierno se proponía reducir la tasa básica del IVA al 20%.
  fragmento: reducir la tasa básica del IVA al 20% apenas podamos
  calificacion: discutible
  dato_real:
    valor: >-
      La Ley 18.083 (27/12/2006) fijó la tasa básica del IVA en 22% y previó que el Poder
      Ejecutivo la redujera gradualmente al 20% cuando los resultados de la reforma aseguraran el
      cumplimiento de los compromisos presupuestales. Dos décadas después, el Texto Ordenado
      vigente (Título 10, artículo 16) sigue fijando la tasa básica en 22%: la reducción
      condicionada nunca se aplicó.
    fuentes:
      - url: https://www.bcu.gub.uy/Acerca-de-BCU/Normativa/Documents/Servicios-Financieros/Seguros/Leyes-y-Decretos/Leyes-y-Decretos-relativos-al-regimen-de-triubutacion-de-las-entidades-aseguradoras/Impuesto-al-valor-agregado(IVA)/titulo10dgi.pdf
        medio: bcu
        fecha: 2026-09-15
        tipo: documento_oficial
        titulo: "Texto Ordenado 1996, Título 10 (IVA), artículo 16 - Tasas"
        cita: >-
          Fíjanse las siguientes tasas: A) Básica del 22% (veintidós por ciento).
        retrieved_at: 2026-09-15
      - url: https://www.bcu.gub.uy/Acerca-de-BCU/Normativa/Documents/Servicios-Financieros/Seguros/Leyes-y-Decretos/Leyes-y-Decretos-relativos-al-regimen-de-triubutacion-de-las-entidades-aseguradoras/Impuesto-al-valor-agregado(IVA)/titulo10dgi.pdf
        medio: bcu
        fecha: 2026-09-15
        tipo: documento_oficial
        titulo: "Texto Ordenado 1996, Título 10 (IVA), artículo 16 - Tasas (mecanismo de reducción)"
        cita: >-
          El Poder Ejecutivo reducirá gradualmente la tasa básica del tributo hasta alcanzar el
          20% (veinte por ciento) cuando los resultados de la aplicación de la presente ley
          aseguren el cumplimiento de los compromisos presupuestales asumidos en relación al
          resultado fiscal.
        retrieved_at: 2026-09-15
  evidencia:
    nivel: textual
    fuentes:
      - url: http://archivo.presidencia.gub.uy/_web/noticias/2005/11/2005110709.htm
        medio: presidencia
        fecha: 2005-11-07
        tipo: documento_oficial
        titulo: "Reforma tributaria: un rasgo diferenciador de este gobierno"
        cita: >-
          también nos proponemos reducir la tasa básica del IVA al 20% apenas podamos, con lo cual
          la tasa básica va a estar reducida no en cinco, sino en seis puntos, dada la incidencia
          del COFIS que estamos eliminando
        retrieved_at: 2026-09-15

