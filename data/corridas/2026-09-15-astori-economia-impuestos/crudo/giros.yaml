  declaracion_despues: astori/2016-06-06-elimina-suba-irpf-franja-33400-50100-2016
  cambio: cambio_parcial
  explicacion: justificado_por_contexto
  analisis: >-
    El 26 de mayo de 2016, en radio Carve, defendió como necesaria la suba del IRPF -del 15% al 18%,
    según consignó El País- para la franja de salarios entre $33.401 y $50.100, explicando que
    eliminarla afectaría la liquidación de todo el impuesto para todos los contribuyentes.


    Once días después, el 6 de junio, un comunicado de Presidencia confirmó que esa suba específica
    fue retirada del proyecto de Rendición de Cuentas por acuerdo entre el gobierno y los
    legisladores del Frente Amplio, y que esa franja siguió pagando 15%.


    El resto del ajuste de 2016 (la suba de IRPF e IASS para las franjas de ingresos superiores) se
    mantuvo: el cambio de posición es acotado a este tramo salarial específico, no a todo el
    paquete. La explicación que da el propio comunicado oficial es una negociación política con
    legisladores del mismo partido de gobierno, no un cambio en el diagnóstico fiscal que había
    llevado a proponer la suba días antes.
