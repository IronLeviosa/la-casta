  cambio: cambio_total
  explicacion: reconocido_explicitamente
  analisis: >-
    El 26 de junio de 2015, ante el Foro Económico de ACDE, dijo que el gobierno no incluía en su
    menú de opciones un incremento de la carga fiscal sobre la producción y la sociedad en su
    conjunto, y lo volvió a afirmar expresamente ese mismo día. Antes, en mayo de 2014 y en dos
    oportunidades de 2015, había dicho algo similar sobre la carga tributaria a la producción y
    sobre la carga tributaria media en general.


    El 4 de agosto de 2016, interpelado en el Senado por la Rendición de Cuentas de ese año -que
    subió el IRPF y el IASS para los tramos de ingresos más altos-, reconoció con sus propias
    palabras: "hay que reconocer que el anuncio no se cumplió".


    Las promesas de 2015 hablaban de la carga sobre "la producción" y "la sociedad en su conjunto",
    mientras que la suba de 2016 recayó sobre las rentas personales (IRPF) y las pasividades (IASS),
    no directamente sobre la producción; alguien que defienda esa distinción podría decir que no se
    trata del mismo objeto.


    Pero el propio Astori no la usó: al reconocer el incumplimiento habló en general de "el anuncio"
    de no poner más impuestos, sin acotarlo a la producción, y en la misma interpelación llamó
    "corrección fiscal" y "ajuste" al paquete completo.


    Explicó el cambio por una recesión simultánea en Brasil y en Argentina que, dijo, nunca se había
    dado al mismo tiempo en la historia contemporánea del país.
