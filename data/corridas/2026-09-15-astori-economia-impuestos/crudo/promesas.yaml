        impuestos, hecho junto con Vázquez, no se cumplió.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescss/2016-08-04%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20SENADORES%20(0026).pdf
            medio: parlamento
            fecha: 2016-08-04
            tipo: diario_de_sesiones
            titulo: Diario de Sesiones de la Cámara de Senadores, 26.ª Sesión Extraordinaria, 4 de agosto de 2016
            cita: >-
              Cuando dijimos «no vamos a poner más impuestos», era porque no queríamos hacerlo.
              Esa era nuestra voluntad política, pero la realidad cambia y nos obliga a nosotros a
              cambiar. Hay que reconocer que el anuncio no se cumplió, como lo estoy haciendo en
              este momento
            retrieved_at: 2026-09-15

- politico: astori
  tema: economia/impuestos
  _slug: reducir-iva-veinte-por-ciento
  _investigacion: { agente: investigador }
  texto: >-
    Reducir la tasa básica del IVA al 20% en cuanto los resultados fiscales de la reforma
    tributaria lo permitieran.
  fecha_promesa: 2005-11-07
  origen:
    nivel: textual
    fuentes:
      - url: http://archivo.presidencia.gub.uy/_web/noticias/2005/11/2005110709.htm
        medio: presidencia
        fecha: 2005-11-07
        tipo: documento_oficial
        titulo: "Reforma tributaria: un rasgo diferenciador de este gobierno"
        cita: >-
          también nos proponemos reducir la tasa básica del IVA al 20% apenas podamos, con lo cual
          la tasa básica va a estar reducida no en cinco, sino en seis puntos, dada la incidencia
          del COFIS que estamos eliminando
        retrieved_at: 2026-09-15
  evidencias_candidatas:
    - fecha: 2026-09-15
      tipo: dato_oficial
      efecto: en_contra
      descripcion: >-
        El Texto Ordenado vigente (Título 10, IVA, artículo 16) sigue fijando la tasa básica en
        22%, tal como quedó tras la Ley 18.083 (2006): la reducción condicionada al 20% que la
        misma norma preveía nunca se aplicó.
      evidencia:
        nivel: textual
        fuentes:
          - url: https://www.bcu.gub.uy/Acerca-de-BCU/Normativa/Documents/Servicios-Financieros/Seguros/Leyes-y-Decretos/Leyes-y-Decretos-relativos-al-regimen-de-triubutacion-de-las-entidades-aseguradoras/Impuesto-al-valor-agregado(IVA)/titulo10dgi.pdf
            medio: bcu
            fecha: 2026-09-15
            tipo: documento_oficial
            titulo: "Texto Ordenado 1996, Título 10 (IVA), artículo 16 - Tasas"
            cita: >-
              El Poder Ejecutivo reducirá gradualmente la tasa básica del tributo hasta alcanzar
              el 20% (veinte por ciento) cuando los resultados de la aplicación de la presente ley
              aseguren el cumplimiento de los compromisos presupuestales asumidos en relación al
              resultado fiscal.
            retrieved_at: 2026-09-15

