  titulo: Defendió la suba del IRPF del 15% al 18% para la franja entre $33.401 y $50.100
  cita: >-
    Hay que tener en cuenta la forma en la que se liquida el impuesto a la renta. Obviamente se
    está buscando un cierto monto de recaudación que se distribuya equitativamente, pero el
    impuesto se liquida progresionalmente y si uno elimina franjas no está afectando solo a la
    franja que elimina
  resumen: >-
    Dijo que no era posible eliminar el aumento del IRPF del 15% al 18% para los salarios
    nominales entre $33.401 y $50.100 porque afectaría la recaudación prevista y beneficiaría a
    todas las franjas salariales.
