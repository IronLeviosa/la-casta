# Registros de cobertura (tono por nota) — corrida 2026-09-07-empresas-antel
# Crítico: Opus 5 (claude-opus-5[1m]).
#
# Criterio, y es el mismo para las ocho notas: `neutral` es el valor por defecto; `favorable` o
# `desfavorable` solo si puedo citar una frase de la nota en voz del medio —no de un entrevistado, no
# del titular solo— que lo muestre. El tono es sobre cómo la nota trata al político, no sobre si la
# noticia le conviene.
#
# Aclaración de esquema: `crearCoberturaSchema` exige `evento` (ref a content/eventos/) y `politico`
# o `partido`. Este es un lote de empresa: tres de las ocho notas no nombran a ningún político ni
# partido, así que van en `no_emitibles` con su tono observado, para que el criterio quede auditado
# sin romper la validación. Ninguno de los cuatro eventos que hacen falta existe todavía en
# content/eventos/, así que van con el prefijo "propuesto:".
#
# Dos de las notas de esta lista (El Observador 2022-06-16 y Caras y Caretas 2022-06-26) el
# investigador las leyó y no las citó en la ficha; están acá igual porque se leyeron en el lote, y
# porque la crítica recomienda incorporarlas (objeciones 17 y 23).

cobertura:
  - medio: el-observador
    url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
    titulo: Servicios monopólicos de ANTEL son más caros que los de la región
    fecha: 2012-05-19
    evento: "propuesto: monopolio-antel-fibra-optica-2012"
    politico: mujica
    tono: desfavorable
    justificacion: >-
      El medio evalúa la decisión en su propia voz, no en la de una fuente: "Si se tienen en cuenta
      las tarifas que están pagando los uruguayos por un servicio monopolizado –la telefonía básica–
      y por otro en competencia –la telefonía móvil– la decisión de Mujica parece una mala noticia
      para los usuarios". La nota consigna que buscó la versión de ANTEL y no la obtuvo, y también
      publica dos datos favorables (Uruguay entre los más baratos en minuto de celular y en internet
      del continente), pero el juicio del primer párrafo es propio del medio.

  - medio: montevideo-portal
    url: https://www.montevideo.com.uy/Noticias/Gobierno-habilito-a-operadores-de-cable-de-Montevideo-a-brindar-servicio-de-internet-uc824905
    titulo: Gobierno habilitó a operadores de cable de Montevideo a brindar servicio de internet
    fecha: 2022-06-16
    evento: "propuesto: apertura-datos-cableoperadores-2022"
    politico: lacalle-pou
    tono: neutral
    justificacion: >-
      El medio describe el acto sin calificarlo ("Tres diferentes decretos firmados por el presidente
      de la República, Luis Lacalle Pou, y el ministro de Industria, Energía y Minería, Omar
      Paganini, autorizaron cambios en la legislación para que los operadores de cable privado en
      Montevideo puedan brindar servicios de internet fijo") y cita los documentos textualmente; la
      única expresión valorativa, "que quitan el monopolio a Antel", describe el efecto de la norma,
      no al firmante.

  - medio: montevideo-portal
    url: https://www.montevideo.com.uy/En-Perspectiva/Decreto-que-quita-monopolio-a-Antel-puede-ser-perjudicial-para-el-pueblo-dijo-Larrosa-uc825347
    titulo: Decreto que quita monopolio a Antel puede ser “perjudicial” para el pueblo, dijo Larrosa
    fecha: 2022-06-17
    evento: "propuesto: apertura-datos-cableoperadores-2022"
    politico: lacalle-pou
    tono: neutral
    justificacion: >-
      Todo el juicio está atribuido y entrecomillado desde el título ("dijo Larrosa"); la única
      oración en voz del medio es descriptiva ("Tres diferentes decretos firmados por el presidente
      de la República, Luis Lacalle Pou, y el ministro de Industria, Energía y Minería, Omar
      Paganini, autorizaron cambios en la legislación"). No publica respuesta del Poder Ejecutivo ni
      de la mayoría del directorio de ANTEL, lo que la deja incompleta pero no la vuelve
      desfavorable según el criterio de esta colección.

  - medio: el-observador
    url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
    titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
    fecha: 2022-06-16
    evento: "propuesto: apertura-datos-cableoperadores-2022"
    politico: lacalle-pou
    tono: neutral
    justificacion: >-
      La nota se limita a los hechos y a una fuente identificada ("El Poder Ejecutivo habilitó a
      cinco cableoperadores de Canelones, Colonia y Montevideo a prestar servicios de internet en sus
      áreas de cobertura. Las cinco resoluciones, firmadas por el presidente de la República, Luis
      Lacalle Pou, con fecha 14 de junio…"), y la única valoración es la de la abogada de tres de las
      empresas beneficiadas, atribuida y entre comillas.

  - medio: caras-y-caretas
    url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
    titulo: El monopolio de Antel en la transmisión de datos es ley
    fecha: 2022-06-26
    evento: "propuesto: apertura-datos-cableoperadores-2022"
    politico: lacalle-pou
    tono: desfavorable
    justificacion: >-
      Es una columna firmada por el director del medio y el juicio es propio y explícito: "mediante
      un decreto, el Poder Ejecutivo con la firma de Luis Lacalle Pou, otorgó a los tres canales de
      cable de Montevideo y a dos canales más, la licencia para trasmitir datos por líneas físicas,
      lo que constituye una violación de la ley. No es un error brutal, ni una exageración infundada
      e inconsulta ni un acto reprobable de la soberbia de un presidente desbocado, aunque pueda ser
      todo eso junto".

no_emitibles:
  - medio: en-perspectiva
    url: https://enperspectiva.uy/en-perspectiva-programa/titulares/noticias-del-viernes-8-mayo-2020/
    titulo: Noticias del viernes 8 de mayo de 2020
    fecha: 2020-05-08
    motivo: >-
      Es un resumen de titulares; el ítem sobre ANTEL habla de "la decisión del gobierno uruguayo"
      sin nombrar a ningún político ni partido, y asignarle Lacalle Pou por ser el gobierno del día
      sería una atribución mía, no del medio.
    tono_observado: neutral
    justificacion: >-
      Todo está atribuido ("Las dos empresas de telefonía móvil opinaron, en nota con El Observador,
      que no abrir el mercado a todos los operadores va en contra de la 'sana competencia'") y el
      medio consigna expresamente que el original es de otro medio, sin hacer suyo el juicio.

  - medio: ambito
    url: https://ambito.com/uruguay/el-directorio-antel-revoco-el-permiso-ofrecer-red-fibra-optica-privados-n6154677
    titulo: El directorio de Antel revocó el permiso de ofrecer red de fibra óptica a privados
    fecha: 2025-06-09
    motivo: >-
      La nota no nombra a ningún político ni partido: el sujeto es el directorio de ANTEL y su
      vicepresidente, que no está en content/politicos/.
    tono_observado: neutral
    justificacion: >-
      El medio informa y deja hablar al entrevistado, incluida la pregunta incómoda ("Sobre la
      posibilidad de que la decisión del directorio haya sido influenciada por el reclamos del
      sindicato, respondió: 'Es una decisión que toma el directorio…'"), sin adjetivar la medida.

  - medio: presidencia
    url: https://www.gub.uy/presidencia/comunicacion/noticias/uruguay-se-posiciona-entre-mejores-del-mundo-velocidad-internet-movil
    titulo: Uruguay se posiciona entre los mejores del mundo en velocidad de internet móvil
    fecha: 2023-09-05
    motivo: >-
      No nombra a ningún político de content/politicos/ (el entrevistado es el presidente de ANTEL) y
      además es el medio del propio Estado, no prensa: si el editor decide medir tono de medios
      estatales, conviene que sea una categoría aparte y con el mismo criterio para todos los
      gobiernos.
    tono_observado: favorable
    justificacion: >-
      El medio adopta el marco del entrevistado en su propia voz al llamar "logro" al resultado ("El
      presidente de Antel, Gabriel Gurméndez, atribuyó este logro a la incorporación de la tecnología
      celular de quinta generación") y no publica ninguna otra voz ni el dato de qué mide el índice
      (velocidad, no precio ni cobertura).
