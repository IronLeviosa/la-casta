  url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
  titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
  fecha: 2022-06-16
  evento: apertura-datos-cableoperadores-2022
  politico: lacalle-pou
  tono: neutral
  justificacion: La nota se limita a los hechos y a una fuente identificada ("El Poder Ejecutivo
    habilitó a cinco cableoperadores de Canelones, Colonia y Montevideo a prestar servicios de
    internet en sus áreas de cobertura. Las cinco resoluciones, firmadas por el presidente de la
    República, Luis Lacalle Pou, con fecha 14 de junio…"), y la única valoración es la de la abogada
    de tres de las empresas beneficiadas, atribuida y entre comillas.
  revision:
    tier: publicado
- medio: caras-y-caretas
  _investigacion:
    modelo: claude-opus-5[1m]
  url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
  titulo: El monopolio de Antel en la transmisión de datos es ley
  fecha: 2022-06-26
  evento: apertura-datos-cableoperadores-2022
  politico: lacalle-pou
  tono: desfavorable
  justificacion: 'Es una columna firmada por el director del medio y el juicio es propio y explícito:
    "mediante un decreto, el Poder Ejecutivo con la firma de Luis Lacalle Pou, otorgó a los tres
    canales de cable de Montevideo y a dos canales más, la licencia para trasmitir datos por líneas
    físicas, lo que constituye una violación de la ley. No es un error brutal, ni una exageración
    infundada e inconsulta ni un acto reprobable de la soberbia de un presidente desbocado, aunque
    pueda ser todo eso junto".'
  revision:
    tier: publicado
