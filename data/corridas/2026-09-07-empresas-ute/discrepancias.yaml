  analisis: >-
    La nota publica el resultado de UTE de 2016 como "casi 12 millones de pesos". El estado de
    resultados separado auditado de UTE para ese ejercicio registra $ 12.189.879.271, es decir
    12.190 millones de pesos: mil veces la cifra publicada, y por encima de "casi 12", no por debajo.
    La conversión que la misma nota da (410 millones de dólares) es consistente con miles de millones
    de pesos al tipo de cambio del período, no con millones. La nota atribuye la cifra a un informe
    de la consultora Stavros Moyal & Asociados difundido por El País, no a los estados financieros;
    el informe no está publicado y no pude cotejarlo. La otra cifra de la nota, "una ganancia neta de
    14.156,8 de pesos" para 2017, tampoco lleva la unidad, pero no la registro porque los estados
    financieros de 2017 están publicados solo como escaneo sin capa de texto y no tengo el documento
    primario que decida.
