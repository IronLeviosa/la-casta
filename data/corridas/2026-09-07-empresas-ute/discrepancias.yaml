#   - pv magazine (2025-09-23): no abrí el informe de SEG Ingeniería; sin el original no hay
#     discrepancia, hay desacuerdo posible.
#   - Noticia de UTE (2020-03-17): dice USD 179,3 M donde el balance da USD 169,4 M al cierre, pero
#     el comunicado declara su método ("dólares promedio ($ 35,255)"). No hay distancia entre lo
