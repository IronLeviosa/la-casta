# Discrepancias detectadas al releer las fuentes del lote — corrida 2026-09-07-empresas-ute
# Crítico: Opus 5 (claude-opus-5[1m]). No escribo en content/: esto lo evalúa el editor.
#
# Umbral aplicado, y lo digo antes de la única entrada para que se pueda auditar la simetría:
# registré todo lo que un documento primario (documento_oficial) contradice, y nada más. Apliqué el
# mismo test a las otras cuatro notas del lote:
#   - El Observador (Stipanicic, 2025-07-15): todo lo publicado son citas textuales de una columna;
#     el único hecho propio del medio (la observación del Tribunal de Cuentas) no lo coteje contra
