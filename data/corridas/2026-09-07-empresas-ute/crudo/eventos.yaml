  resumen: El Directorio de UTE, con los votos del oficialismo (representantes del Frente Amplio),
    resolvió no renovar el contrato de compraventa de energía con Fenirol S.A. (Energías Renovables
    Tacuarembó), que generaba con biomasa y le vendía a UTE desde 2007. En febrero de 2025 el
    gobierno de Luis Lacalle Pou había adoptado una resolución que renovaba el contrato por tercera
    vez, por 12 años y unos USD 97,9 millones; el nuevo Directorio revirtió esa decisión, dando
    lugar a una observación del Tribunal de Cuentas "por falta de disponibilidad presupuestal", y
    resolvió no reiterar el gasto. El expresidente de ANCAP Alejandro Stipanicic, designado en 2020
    por el gobierno de Lacalle Pou, criticó públicamente la decisión y calificó de "absurdo" el
    "monopolio de la compra de generación eléctrica por parte de UTE".
