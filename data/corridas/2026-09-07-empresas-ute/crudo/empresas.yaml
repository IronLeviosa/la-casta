  revision:
    tier: publicado
    notas_internas: >-
      Pendientes menores, no bloqueantes, con el mismo criterio que se aplicó a ANCAP (que también
      quedó en publicado con varios puntos documentados sin cerrar):

      (1) Monopolio, objeción 11 de la crítica: de los cuatro argumentos, tres (Exante en ambos
      sentidos y Fraschini) salen del eje Augpee/Exante y solo Bentancor es de otro origen, y su
      argumento no defiende específicamente la reserva legal de trasmisión y distribución (se
      reformuló para no atribuirle eso). El investigador de la segunda vuelta buscó activamente un
      argumento primario de AUTE (el único artículo relevante que encontró, sobre los 25 años del
      marco regulatorio, da HTTP 404) y revisó la Política Energética 2005-2030 del MIEM, que no se
      pronuncia sobre si la reserva legal debe mantenerse. No encontré, en el tiempo de esta revisión,
      una fuente primaria adicional. Queda como asimetría documentada, no oculta: el resumen no la
      compensa recortando el lado Augpee/Exante, que es donde está la evidencia disponible.

      (2) Comparaciones, objeción 14: no se pudo incorporar el "Comparativo Regional de Tarifas" que
      la propia UTE publica, porque la extracción de texto de ese PDF pierde las etiquetas de país de
      los gráficos de barras (intento documentado, no abandono sin probar). Las comparaciones de la
      ficha quedan sourceadas en pv magazine América Latina (edición de junio de 2026, con método
      declarado en la propia nota), sin la voz de la empresa en esta sección.

      (3) `deuda_financiera` de 2015 y 2016 usa la nota de gestión de riesgo financiero ("Deuda (i)":
      deuda financiera neta de corto y largo plazo, antes de restar efectivo) porque la fila
      "Préstamos y otros pasivos financieros" del Estado de Situación Financiera separado de esos dos
      años no tiene capa de texto extraíble; de 2018 en adelante la ficha usa esa fila (Nota 5.13 o
      5.14). Ambas son deuda financiera bruta corriente más no corriente y son conceptualmente
      comparables, pero salen de notas distintas del balance; queda dicho en el `concepto` de cada
      año.

      (4) No hay `impuestos_pagados` para 2018: el balance de 2018 es un escaneo sin capa de texto, y
      el balance de 2019 (que sí se puede leer) no trae el comparativo del Literal D/E de 2018.

      (5) 2017 queda sin ningún dato de `finanzas`: los cuatro PDF de estados financieros que UTE
      publica para ese ejercicio (el propio de 2017 y los comparativos de 2016 y 2018) son escaneos
      sin capa de texto en esta máquina, que no tiene `pdftoppm` (poppler) instalado para hacer OCR.
      Es el único año de la serie 2015-2025 sin ninguna cifra.

      (6) No agregué imágenes: no encontré, dentro del alcance de esta revisión (sin usar WebSearch
      general, reservado para giros), una fuente con licencia libre verificable para una foto de UTE.
      Prefiero dejar `imagenes: []` a adivinar una licencia.

      (7) Los títulos de las `Fuente` que repiten URL (los seis PDF de balances) siguen variando por
      sección del documento citado (ej. "- Literal E Separado", "- Nota de Patrimonio"), igual que en
      la ficha ya publicada de ANCAP; no lo traté como una desviación a corregir porque no es distinto
      del estándar ya publicado.
