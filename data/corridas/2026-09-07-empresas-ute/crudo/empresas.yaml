  resumen: >-
    UTE es un ente autónomo del Estado uruguayo, creado en 1912 con el monopolio del suministro
    eléctrico -generación, trasmisión, distribución y comercialización- en todo el territorio
    nacional. Ese monopolio dejó de ser exclusivo primero en 1977 (Decreto-Ley 14.694), que amplió el
    giro de UTE a servicios de asesoramiento fuera del monopolio, y de forma más profunda en 1997
    (Ley 16.832, Marco Regulatorio Eléctrico), que abrió la generación a la competencia de privados y
    creó un mercado mayorista de energía. Desde entonces UTE compite con generadores privados en la
    producción de energía, pero mantiene en forma exclusiva la trasmisión y la distribución como
    servicio público; la ley y el Decreto 276/002 (2002) prevén que esas dos actividades puedan
    cumplirse en concesión si el Poder Ejecutivo lo resuelve, algo que no ha ocurrido.

    En los diez años de 2015 a 2024, el resultado del ejercicio de UTE fue positivo en los nueve años
    con datos disponibles, entre USD 70,1 millones (2020) y USD 415,5 millones (2016). El año 2017 no
    tiene cifra en esta ficha porque los estados financieros de ese ejercicio están publicados por
    UTE solo como un escaneo sin capa de texto extraíble, a diferencia de los balances de 2015, 2016,
    2018 y 2019, que sí se pudieron leer. El resultado de 2025, ya publicado por UTE, fue de USD 338,3
    millones.

    UTE paga y recauda tributos por un monto muy superior al impuesto a la renta (IRAE) que tributa
    por su propia actividad. El total de tributos abonados en el ejercicio -según el Literal D o el
    Literal E de sus estados financieros, la letra cambia según el año- incluye IVA, IRAE, impuesto
    al patrimonio, retenciones y tasas, y estuvo entre USD 152,4 millones (2021) y USD 333,6 millones
    (2025). El IRAE propio pagado en efectivo, cuando consta por separado en el estado de flujos de
    efectivo, es una fracción menor de ese total: por ejemplo, USD 6,3 millones de los USD 152,4
    millones de tributos totales de 2021. No hay cifra de tributos totales para 2017 (balance sin
    capa de texto) ni para 2018 (el balance de 2019, que sí tiene capa de texto, no trae el detalle
    comparativo de ese renglón para 2018).

    Además de los tributos, UTE transfiere a Rentas Generales una "versión de resultados", que esta
    ficha registra según el criterio de caja -lo efectivamente vertido en el ejercicio, no lo
    devengado contablemente- para que la serie sea comparable año a año: entre USD 67,1 millones
    (2015) y USD 323,2 millones (2018). El pago de 2021 (USD 67,2 millones) fue menor al cargo
    patrimonial devengado ese año (equivalente a unos USD 173 millones), porque una parte de ese
    cargo se terminó de pagar en 2022; el pago de 2022 (USD 124,8 millones) corresponde, según el
    propio balance, al saldo del aporte adicional del ejercicio 2021, y no a la ausencia de una
    transferencia en 2022.

    La deuda financiera de UTE, según sus estados financieros separados -que excluyen los
    fideicomisos de trasmisión (PAMPA, ARIAS, Línea Cierre del Anillo) y otras sociedades vinculadas,
    cuya inclusión da una cifra consolidada mayor-, pasó de USD 986,1 millones en 2015 a USD 1.262,0
    millones en 2025, con oscilaciones dentro de ese rango en los años intermedios.

    Los estados financieros de UTE informan segmentos de negocio (generación, trasmisión,
    distribución, comercialización), pero declaran expresamente que no es posible atribuir el
    resultado a cada segmento por separado porque la actividad está integrada verticalmente: todo el
    ingreso por venta de energía se expone dentro de un único segmento, "Comercial". Por esa razón
    esta ficha, a diferencia de la de ANCAP, no tiene un desglose de resultado por línea de negocio;
    sí existe, en el Literal D de cada balance, un desglose de costos -no de resultados- por
    generación, trasmisión, distribución y despacho.

    En 2020, UTE recibió USD 61,8 millones (equivalentes a $ 2.622,8 millones) del Fondo de
    Estabilización Energética, un fondo estatal que amortigua costos de generación en los años de
    sequía; según su propio balance, en 2019 no hubo uso de ese fondo. No se encontraron otras
    capitalizaciones directas del Estado a UTE en el período 2015-2025.

    Según un relevamiento de pv magazine América Latina de junio de 2026, el precio de la
    electricidad industrial en Uruguay (147 USD/MWh, cuenta tipo de 400 MWh mensuales) fue menor que
    en Chile (182 USD/MWh) y mayor que en Brasil (128), Argentina (123) y Paraguay (47). En el
    segmento residencial (cuenta tipo ponderada de cuatro tarifas), Uruguay tuvo el precio más caro de
    la región (277 USD/MWh), por encima de Chile (273), Brasil (227), Argentina (149) y Paraguay (82).

    Sobre si la trasmisión y la distribución deben seguir siendo monopolio legal de UTE hay
    posiciones documentadas de los dos lados. A favor, un informe de la consultora Exante -contratado
    por la asociación de generadores privados Augpee- sostiene que son un monopolio natural, por las
    economías de escala de las redes, aunque aclara que esa calificación técnica no implica
    necesariamente que la propiedad deba ser estatal; el vicepresidente de UTE, Roberto Bentancor,
    defiende que la empresa siga siendo estatal por su función social, sin pronunciarse en la nota
    citada sobre la reserva legal de trasmisión y distribución en particular. En contra, el
    expresidente de ANCAP Alejandro Stipanicic -designado en 2020 por el gobierno de Lacalle Pou-
    calificó de "absurdo" el monopolio de UTE como comprador de la generación privada, a raíz de la no
    renovación de un contrato con la generadora Fenirol en 2025; y el mismo informe de Exante concluye
    que los peajes que UTE cobra a los generadores privados por el uso de sus redes "exceden
    largamente los costos efectivos de UTE".
