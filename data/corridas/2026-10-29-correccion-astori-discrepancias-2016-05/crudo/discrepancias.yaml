  analisis: >-
    Presidencia, al informar el anuncio del ministro de Economía del 23 de mayo de 2016, ubica la
    tercera franja del IRPF entre 33.400 y 50.100 pesos. La nota, publicada cuatro días después,
    la ubica entre $33.041 y $50.110. Los dos límites de la franja no coinciden entre lo publicado y
    el documento.
