- politico: barandiaran
  tema: economia/empleo
  _slug: pasantias-discriminan-universidad-catolica
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 2003-11-07
  contexto: parlamento
  cargo_en_ese_momento: Representante Nacional (Diputado) por Montevideo, suplente
  titulo: Calificó de inconstitucional un llamado a pasantías del MTSS solo para egresados de la
    Universidad Católica
  cita: El reciente llamado a pasantías para 'abogados de la Universidad Católica' realizado por el
    Ministerio de Trabajo y Seguridad Social, para desempeñarse como pasantes en dicho organismo
    gubernamental, no sólo es inconstitucional, sino que agrede nuestra conciencia cívica y ciudadana.
    El artículo 8º de la Constitución de la República establece que 'Todas las personas son iguales
    ante la ley no reconociéndose otra distinción entre ellas sino la de los talentos o las virtudes'.
    En el caso que nos ocupa se establece una distinción entre personas que obtuvieron sus títulos
    habilitantes en diferentes organismos de educación terciaria, privilegiando a unos frente a otros,
    y estableciendo diferencias injustificables entre ellos, salvo que se considere un talento o una
    virtud el hecho de poder costear una universidad privada.
  resumen: Presentó una exposición escrita ante el Ministerio de Trabajo y Seguridad Social, la
    Universidad de la República y la Universidad Católica, calificando de inconstitucional un llamado
    a pasantías del ministerio que exigía título de una universidad privada, por discriminar entre
    ciudadanos según la universidad de origen.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/2003-11-11%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0068).pdf
        medio: parlamento
        fecha: 2003-11-11
        tipo: diario_de_sesiones
        titulo: Diario de Sesión N.º 3170, Cámara de Representantes, 11 de noviembre de 2003 (exposición
          escrita fechada 7 de noviembre de 2003)
        cita: El reciente llamado a pasantías para 'abogados de la Universidad Católica' realizado por el
          Ministerio de Trabajo y Seguridad Social, para desempeñarse como pasantes en dicho organismo
          gubernamental, no sólo es inconstitucional, sino que agrede nuestra conciencia cívica y
          ciudadana.
        retrieved_at: 2026-09-09
  seguimiento:
    estado: resuelto
    fecha: 2004-05-06
    texto: >-
      El Ministerio de Trabajo y Seguridad Social contestó la exposición escrita el 6 de mayo de
      2004, según el Diario de Sesiones de la Cámara de Representantes, que archivó la respuesta "a
      sus antecedentes" sin otra medida de la Cámara; el Diario no reproduce el contenido de esa
      respuesta. No hay registro, en los diarios de sesiones de noviembre de 2003 a diciembre de
      2004 revisados, en IMPO ni en la prensa consultada, de que el llamado se haya anulado,
      ampliado a otras universidades o de a quién se contrató.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/2004-05-06%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0020).pdf
        medio: parlamento
        fecha: 2004-05-06
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 6 de mayo de 2004, N.º 20
          (Comunicaciones de los Ministerios)
        cita: exposición escrita presentada por el señor Representante Gabriel Barandiaran,
          referente a un llamado efectuado por dicha Secretaría de Estado para realizar pasantías.
          C/27/000 - A sus antecedentes
        retrieved_at: 2026-09-09
  revision:
    tier: publicado

- politico: barandiaran
  tema: transparencia-corrupcion
  _slug: caso-banco-pan-azucar-informe-minoria-1995
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 1995-07-25
  contexto: parlamento
  cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
  cita: 'Por lo tanto, se presenta a la Cámara de Repre- sentantes el siguiente proyecto de
    resolución: "1.. Cumplidas las instancias de investigación por esta Comisión Investigadora
    Parlamentaria en relación a la venta del Banco Pan de Azúcar, del análisis del material relevado
    así como de los testimonios recabados por la misma, surge la Comision de presuntas irregularidades
    en la actua- ción que le correspondiera al Directorio del Banco Central del Uruguay en dicha
    operación de venta, y en especial, en la actuación del contador Enrique Braga en su calidad de
    Presidente de dicha insti- tución al momento de gestionarse la venta.-'
  titulo: Propuso, en minoría, denunciar penalmente al Banco Central por la venta del Banco Pan de Azúcar
  resumen: Como miembro informante en minoría de la Comisión Investigadora sobre la venta del Banco
    Pan de Azúcar, presentó un proyecto de resolución que sostenía que existían presuntas
    irregularidades del Directorio del Banco Central y, en particular, de su entonces presidente,
    contador Enrique Braga, y que proponía remitir la denuncia correspondiente a la Justicia Penal.
    Esa madrugada la Cámara aprobó, por amplia mayoría, una resolución de contenido similar -que no
    nombra a Braga- disponiendo pasar los antecedentes de la investigación a la Justicia para que
    evalúe si hubo delitos.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1995-07-25%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0034).pdf
        medio: parlamento
        fecha: 1995-07-25
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1995-07-25, N.º 34
        cita: 'Por lo tanto, se presenta a la Cámara de Repre- sentantes el siguiente proyecto de
          resolución: "1.. Cumplidas las instancias de investigación por esta Comisión Investigadora
          Parlamentaria en relación a la venta del Banco Pan de Azúcar, del análisis del material
          relevado así como de los testimonios recabados por la misma, surge la Comision de presuntas
          irregularidades en la actua- ción que le correspondiera al Directorio del Banco Central del
          Uruguay en dicha operación de venta, y en especial, en la actuación del contador Enrique
          Braga en su calidad de Presidente de dicha insti- tución al momento de gestionarse la
          venta.-'
        retrieved_at: 2026-09-09
  seguimiento:
    estado: resuelto
    fecha: 1995-07-25
    texto: >-
      Esa misma madrugada la Cámara aprobó, 84 en 94 votos, una resolución de mayoría -distinta a la
      que Barandiarán había presentado en minoría, y que no nombra a Braga- que pasó a la Justicia
      todos los antecedentes reunidos por la Comisión Investigadora, las actas de sus reuniones y la
      documentación manejada, para que esa Justicia determine si hubo ilícitos penales y
      responsabilidades. Un tercer punto, aprobado por unanimidad, dispuso hacer públicas las
      actuaciones de la Comisión.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1995-07-25%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0034).pdf
        medio: parlamento
        fecha: 1995-07-25
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1995-07-25, N.º 34 (texto del
          proyecto de resolución aprobado)
        cita: Como consecuencia de las referidas actua- cíones resultan nuevos elementos de
          juicio y antecedentes cuya dilucidación -de conformidad con lo dispuesto por el artículo
          28 de la Ley N2 16.698, de 25 de abril de 1995- correspondería a la Justi- cia competente
          justipreciar si se han configurado o no ilícitos penales y determinar las responsa-
          bilidades que pudieren corresponder, a Ccuyos efectos se pasan a la misma todos los
          antecedentes reunidos por esta Comisión, las actas de sus reuniones y la documentación
          manejada, asf como la versión taquigráfica de esta sesión.
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
    notas_internas: "Bloquea de la crítica resuelto: se agregó 'en minoría' y el desenlace (esa
      madrugada la Cámara votó por unanimidad pasar los antecedentes a la Justicia, sin nombrar a
      Braga en el texto aprobado). El nombre de Braga permanece solo dentro de la cita literal del
      proyecto de resolución que Barandiarán leyó, nunca en la voz del sitio; no se creó un registro
      en content/casos porque no hay una causa propia contra Braga con etapa y fecha, solo la
      referencia genérica a la Justicia que votó la Cámara."

- politico: barandiaran
  tema: economia/seguridad-social
  _slug: irp-doble-imposicion-jubilados-1996
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 1996-08-06
  contexto: parlamento
  cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
  cita: En primer lugar, no es constitucional; en segundo término, es económicamente inconve- niente;
    en tercer lugar, da inseguridad jurídica y, por último, se hace lo que los jubilados no querían
    cuando colocaron esta situación en el estante más alto. Entonces, ¿qué hubiéramos hecho? No
    habríamos votado -tal vez muchos de los que votaron tampoco lo habrían hecho- la aplicación del
    Impuesto a las Retribuciones Personales directamente a los pasivos.
  titulo: Rechazó como inconstitucional un ajuste que no revertía la doble imposición del IRP a jubilados
  resumen: Se opuso al proyecto de ley que modificaba la fórmula de cálculo del Índice Medio de
    Salarios para compensar la doble imposición del Impuesto a las Retribuciones Personales sobre los
    jubilados, por considerarlo inconstitucional e inseguro jurídicamente, y propuso en cambio una
    minuta pidiendo al Poder Ejecutivo eliminar y devolver ese impuesto a los pasivos.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-06%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0031).pdf
        medio: parlamento
        fecha: 1996-08-06
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-06, N.º 31
        cita: En primer lugar, no es constitucional; en segundo término, es económicamente inconve- niente;
          en tercer lugar, da inseguridad jurídica y, por último, se hace lo que los jubilados no
          querían cuando colocaron esta situación en el estante más alto. Entonces, ¿qué hubiéramos
          hecho? No habríamos votado -tal vez muchos de los que votaron tampoco lo habrían hecho- la
          aplicación del Impuesto a las Retribuciones Personales directamente a los pasivos.
        retrieved_at: 2026-09-09
  seguimiento:
    estado: resuelto
    fecha: 1996-09-03
    texto: >-
      El 3 de setiembre de 1996 la Cámara votó, 44 en 45, devolver a la Comisión de Seguridad
      Social el proyecto que buscaba corregir la doble imposición, junto con la minuta de
      comunicación que el Nuevo Espacio había presentado pidiendo al Poder Ejecutivo la devolución
      de lo retenido; en la misma sesión se dejó constancia de que el Poder Ejecutivo, por una
      autorización ya vigente en el Presupuesto Nacional, había reducido a la mitad el adicional
      del Impuesto a las Retribuciones Personales sobre las pasividades desde el 30 de junio de
      1996, con expectativa de eliminarlo el 31 de diciembre. Trece meses después, en la sesión del
      1º de octubre de 1997, un legislador seguía describiendo que los jubilados pagaban el
      impuesto dos veces, y no se encontró una ley posterior que resuelva la devolución que pedía
      la minuta.
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-09-03%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0038).pdf
        medio: parlamento
        fecha: 1996-09-03
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-09-03, N.º 38 (Índice Medio
          de Salarios; fundamento de voto)
        cita: El Nuevo Espacio ha presentado una minuta de comunicación -porque en este caso la
          presentación de un proyecto de ley sería inconstitucional- que busca la devolución de
          dichos importes.
        retrieved_at: 2026-09-09
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-10-01%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0070).pdf
        medio: parlamento
        fecha: 1997-10-01
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-10-01, N.º 70
        cita: que a través de un mecanismo maquiavélico han tenido que pagar dos veces
          el Impuesto a las Retribuciones Personales, por la disminución que se tes efectúa al
          calcularse el lndice Medio de Salarios y también directamente por las jubilaciones o
          pensiones que perciben mensualmente.
        retrieved_at: 2026-09-09
  revision:
    tier: publicado

- politico: barandiaran
  tema: agropecuario
  _slug: trabajadores-brasilenos-arroceras-irregulares-1999
  _investigacion:
    agente: investigador
    modelo: claude-sonnet-5
  fecha: 1999-03-17
  contexto: parlamento
  cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
  cita: Con nuestros propios ojos pudimos compro- bar el ingreso de personal brasileño a una
    explotación arrocera. En estos momentos, en que estamos en plena zafra del arroz, el hecho de que
    haya personas que vienen a trabajar en condiciones ilegales, cobrando sueldos realmen- te
    paupérrimos y sin que se realicen los aportes correspondientes al Banco de Previsión Social y, por
    lo tanto, sin que tengan el amparo de las leyes sociales, no sólo nos ofende como país, sino que
    también constituye una competencia desleal para nuestros trabajadores.
  titulo: Denunció trabajadores brasileños en condición ilegal en explotaciones arroceras uruguayas
  resumen: Denunció el ingreso de trabajadores brasileños en condiciones ilegales a explotaciones
    arroceras del país, sosteniendo que esa situación constituye competencia desleal para los
    trabajadores uruguayos y pidió una inspección al Ministerio de Trabajo.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1999-03-17%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0008).pdf
        medio: parlamento
        fecha: 1999-03-17
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1999-03-17, N.º 8
        cita: Con nuestros propios ojos pudimos compro- bar el ingreso de personal brasileño a una
          explotación arrocera. En estos momentos, en que estamos en plena zafra del arroz, el hecho
          de que haya personas que vienen a trabajar en condiciones ilegales, cobrando sueldos
          realmen- te paupérrimos y sin que se realicen los aportes correspondientes al Banco de
          Previsión Social y, por lo tanto, sin que tengan el amparo de las leyes sociales, no sólo
          nos ofende como país, sino que también constituye una competencia desleal para nuestros
          trabajadores.
        retrieved_at: 2026-09-09
  seguimiento:
    estado: sin_resolucion_publica
    texto: >-
      No hay registro, en el Diario de Sesiones del 17 de marzo de 1999 ni en los diarios de
      sesiones de 1999 revisados en el corpus, de que el Ministerio de Trabajo y Seguridad Social o
      la Junta Departamental de Rocha hayan contestado el pedido de inspección de las explotaciones
      arroceras que Barandiarán formuló en esa media hora previa. Un pedido de informes de otro
      legislador sobre trabajadores extranjeros indocumentados en la cuenca arrocera de Treinta y
      Tres, presentado en junio de 1999, sí obtuvo respuesta del ministerio en agosto de ese año,
      pero es un trámite distinto -de otro departamento y de otro Representante- que no menciona la
      exposición de Barandiarán.
