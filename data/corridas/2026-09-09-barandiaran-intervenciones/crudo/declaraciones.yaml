  cita: 'Por lo tanto, se presenta a la Cámara de Repre- sentantes el siguiente proyecto de resolución: "1.. Cumplidas las instancias de investigación por esta Comisión Investigadora Parlamentaria en relación a la venta del Banco Pan de Azúcar, del análisis del material relevado así como de los testimonios recabados por la misma, surge la Comision de presuntas irregularidades en la actua- ción que le correspondiera al Directorio del Banco Central del Uruguay en dicha operación de venta, y en especial, en la actuación del contador Enrique Braga en su calidad de Presidente de dicha insti- tución al momento de gestionarse la venta.-'
  titulo: Propuso, en minoría, denunciar penalmente al Banco Central por la venta del Banco Pan de Azúcar
  resumen: Como miembro informante en minoría de la Comisión Investigadora sobre la venta del Banco Pan de Azúcar, presentó un proyecto de resolución que sostenía que existían presuntas irregularidades del Directorio del Banco Central y, en particular, de su entonces presidente, contador Enrique Braga, y que proponía remitir la denuncia correspondiente a la Justicia Penal. Esa madrugada la Cámara aprobó, por amplia mayoría, una resolución de contenido similar -que no nombra a Braga- disponiendo pasar los antecedentes de la investigación a la Justicia para que evalúe si hubo delitos.
  evidencia:
    nivel: textual
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1995-07-25%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0034).pdf
        medio: parlamento
        fecha: 1995-07-25
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1995-07-25, N.º 34
        cita: 'Por lo tanto, se presenta a la Cámara de Repre- sentantes el siguiente proyecto de resolución: "1.. Cumplidas las instancias de investigación por esta Comisión Investigadora Parlamentaria en relación a la venta del Banco Pan de Azúcar, del análisis del material relevado así como de los testimonios recabados por la misma, surge la Comision de presuntas irregularidades en la actua- ción que le correspondiera al Directorio del Banco Central del Uruguay en dicha operación de venta, y en especial, en la actuación del contador Enrique Braga en su calidad de Presidente de dicha insti- tución al momento de gestionarse la venta.-'
        retrieved_at: 2026-09-09
  revision:
    tier: publicado
    notas_internas: "Bloquea de la crítica resuelto: se agregó 'en minoría' y el desenlace (esa madrugada la Cámara votó por unanimidad pasar los antecedentes a la Justicia, sin nombrar a Braga en el texto aprobado). El nombre de Braga permanece solo dentro de la cita literal del proyecto de resolución que Barandiarán leyó, nunca en la voz del sitio; no se creó un registro en content/casos porque no hay una causa propia contra Braga con etapa y fecha, solo la referencia genérica a la Justicia que votó la Cámara."
