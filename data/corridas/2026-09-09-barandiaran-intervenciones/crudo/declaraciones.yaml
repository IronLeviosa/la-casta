  cita: Sesenta y cuatro años después de la aprobación de esa ley, nos encontramos con que la incidencia de ANCAP en el mercado es del 2.5% del total de bebidas alcohólicas. Creo que en el día de ayer se corrigió esa versión, estableciéndose que el porcentaje es el 24% del total de alcohol destinado al consumo humano. De todos modos, podríamos estar de acuerdo en que el 76% del alcohol vendido para el consumo humano estaría fuera de lo que es el monopolio y, mirado desde el punto de vista de la cantidad de alcohol, estaríamos hablando del 97.5% de las bebidas brutas alcohólicas vendi- das a la población.
  titulo: Respaldó la desmonopolización de alcoholes porque ANCAP ya tenía baja incidencia en el mercado
  resumen: Al fundamentar el apoyo del Nuevo Espacio a la desmonopolización de los alcoholes, sostuvo que 64 años después de creado el monopolio de ANCAP este representaba apenas entre el 2,5% y el 24% del mercado de bebidas alcohólicas, y que entre el 76% y el 97,5% del alcohol vendido para consumo humano ya estaba fuera del monopolio.
