  fecha: '1998-09-01'
  cita: En cuarto término, otro problema que preocu- pa es el relativo a las camionetas, que, a mi juicio, amerita una revisión de la reglamentación establecida por la Intendencia Municipal de Montevideo. Por un lado, el acceso a este servicio deja mucho que desear, y cada vez es más fundamental en la medida en que ambos padres tienen que trabajar. Por otra parte, por la forma en que se designan estos servicios terminan siendo de carácter monopólico u oligopólico e incrementando el valor de la cuota. A esto hay que agregar las malas condiciones de seguridad en que viajan los niños en estas camionetas, ya que muchas veces lo hacen sin cinturón de seguridad y careciendo de otras medidas de precaución.
  titulo: Cuestionó que las camionetas escolares operen en forma monopólica y sin cinturón de seguridad
  resumen: En el mismo turno sobre problemas de la educación privada, planteó que el servicio de camionetas escolares en Montevideo operaba en forma monopólica u oligopólica encareciendo la cuota, y cuestionó que muchos niños viajaran sin cinturón de seguridad ni otras medidas de precaución, pidiendo una revisión de la reglamentación municipal.
