  cita: 'El tema de fondo, principal, es evitar la presión que pueda llegar a tener cualquier persona -o la propia institución- por haber ingresado mediante un criterio de clientelismo político. Una de las formas de control habitual que podríamos tener es mediante la opinión pública. ¿Cómo hacer para que el cuarto poder del Estado -que es la opinión pública- controle realmente la gestión de los otros tres Poderes? De la mejor forma que uno puede encontrar teniendo en cuenta esa perspectiva: dando publicidad a todos aquellos ingresos, a efectos de que cualquier suspicacia o duda que pueda existir con respecto al ingreso se evacue de esta forma.'
