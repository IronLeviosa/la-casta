  cita: A través del Instituto Nacional de Estadística hemos observado que los precios de la educación privada han experimentando un incremento mayor que el del resto de los bienes de la canasta familiar. Una vez que el colegio establece su propio mercado o nivel de alumnado, en general decide, más que buscar criterios de eficiencia, simplemente aumentar el precio para obtener ingresos que puedan equilibrar los egresos crecientes.
