  cita: '¿Cuáles son las razones que motivan estos hechos? Una de ellas es la propia dictadura: estos son los jóvenes que heredamos de ella. La otra es la educación y tenemos una deuda con ella que no podemos soslayar ni hacernos los distraídos. Necesariamente debemos educar e influir en nuestros jóvenes para evitar que suceda este tipo de cosas. No hay justificación para las acciones de este grupo de inadaptados.'
