  cita: El año pasado, cuando armamos nuestro "Proyecto País" -documento programático general-, decidimos dedicar un capítulo especial a la producción agropecuaria y lo entregamos por escrito en la Expoactiva. Ese es el documento que actualmente distribuimos y donde está expresada nuestra opinión. Eviden- temente, instamos a la Comisión de Ganadería, Agricultura y Pesca -que, de acuerdo con la forma en que se realiza el trabajo parlamentario, será la encargada de estudiar a fondo el problema e informar a esta Cámara- a que necesariamente tome alguna determinación y se pronuncie al respecto. Votamos afirmativamente la iniciativa pensan- do que la movilización del día de ayer merecía, al menos, ampliar ese reclamo en esta caja de resonancia que es el Parlamento, pues consti- tuye el eco de lo que pasa en la calle.
