  cita: El problema es que no se puede culpar al funcionamiento del Parlamento, cuando en última instancia hay colegas que no cumplen con su papel. Por supuesto, me preocupa mucho este tipo de circunstancias, porque después es más fácil echar tierra sobre el prestigio del Parlamento que sobre el de aquellas personas que prefieren votar con los pies antes que estar cumpliendo con sus obligaciones en esta Casa.
