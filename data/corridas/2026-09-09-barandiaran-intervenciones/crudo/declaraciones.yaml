  cita: Por supuesto que existen cuentas pendientes. Es claro que existen. Hay una cuenta pendiente con los Oficiales que actualmente se encuentran en situación de reforma; también hay una cuenta pendiente con aquellas personas que estuvieron exiliadas y en la actualidad no pueden jubilarse porque no se les compu- ta el período jubilatorio. Hay 1,1na cuenta pendiente con los funcionarios de AEBU que no pudieron ingresar a sus trabajos en 1985, porque directamente no se respe- tó una ley, a la que tenían derecho. También, lamentablemente, está la cuenta pendien- te de los desaparecidos durante el período dictatorial; hoy por hoy, ni siquiera sabemos dónde están sus restos.
