  titulo: "Exportaciones subieron 16%, 10% y 13% en tres años: una serie sustituta muestra otra cosa"
  afirmacion: Las empresas uruguayas habían incrementado sus exportaciones en cada uno de los tres años anteriores a diciembre de 1997, en un 16 %, un 10 % y un 13 %, mientras la desocupación seguía aumentando salvo una pequeña disminución en el último año.
  fragmento: en un 16%, 1O% y 13%
  calificacion: discutible
  dato_real:
    valor: 'El PDF de la Revista de Economía del BCU (1997) volvió a fallar la descarga en esta corrida y no tiene copia en Wayback Machine. Se usó en su lugar la serie de comercio exterior de UNSD Comtrade que publica el Banco Mundial (WITS): exportaciones de Uruguay de US$1.914,48 millones en 1994, US$2.106,17 millones en 1995, US$2.397,45 millones en 1996 y US$2.729,52 millones en 1997.


      Eso da variaciones interanuales de +10,0% (1994 a 1995), +13,8% (1995 a 1996) y +13,9% (1996 a 1997). Dos de los tres números que dio (10% y 13%) coinciden razonablemente con esta serie, pero ningún año muestra +16%. Es una serie distinta de la oficial del BCU (balanza de pagos), que no se pudo abrir.'
    fuentes:
      - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-12-17%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0002).pdf
