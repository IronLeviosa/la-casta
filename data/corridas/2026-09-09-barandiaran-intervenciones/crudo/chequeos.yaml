        retrieved_at: 2026-09-09
      - url: http://wits.worldbank.org/data/public/cp/es_URY_allyears_wits_trade_summary.csv
        medio: banco-mundial
        fecha: '2024-12-12'
        tipo: documento_oficial
        titulo: WITS (Banco Mundial) - Comtrade de UNSD, resumen de comercio de Uruguay, todos los años
        cita: Uruguay,Mundo,Todos los productos,Exportación,Exportaciones (en millones de US $),           9192.78,          11183.54,           9535.27,           6863.95,           7680.35,           7502.14,           7889.39,           6963.55,           7669.51,           9165.71,           9065.75,           8709.22,           7911.75,           6724.16,           5404.76,           5941.89,           4517.55,           3989.32,           3421.89,           2937.23,           2208.15,           1861.04,           2057.58,           2295.40,           2237.04,           2769.65,           2729.52,           2397.45,           2106.17,           1914.48,,,,,,
