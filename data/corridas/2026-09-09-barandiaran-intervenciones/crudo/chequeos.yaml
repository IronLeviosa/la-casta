  fecha: 1996-08-13
  titulo: 'Crédito de US$137.000.000 con FOCOEX que "nadie controló": la comparecencia hallada no lo confirma'
  afirmacion: Hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que "absolutamente nadie controló".
  fragmento: aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló
  calificacion: discutible
  dato_real:
    valor: 'No se relevó el expediente de la Comisión Investigadora Parlamentaria sobre el Ministerio de Salud Pública y los convenios con FOCOEX (1995-1996) ni un informe del Tribunal de Cuentas uruguayo que confirme el monto y la falta de control.


      Se localizó el Diario de Sesiones del Congreso de los Diputados de España, Comisión de Economía, sesión núm. 39 del 1.º de marzo de 1995, donde Roberto Cuñat Arias, presidente de FOCOEX, compareció por irregularidades detectadas por el Tribunal de Cuentas español. Ese diario confirma que FOCOEX operaba con créditos FAD por unos 55.000 millones de pesetas en conjunto y lista un contrato en Uruguay entre varios con "subcontratista oculto", pero no contiene la cifra de US$137.000.000 ni el convenio con el Ministerio de Salud Pública que cita Barandiarán: puede tratarse de otra comparecencia de Cuñat Arias no localizada en esta corrida.'
    fuentes:
      - &id007
        url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-08-13%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0033).pdf
        medio: parlamento
        fecha: 1996-08-13
        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1996-08-13, N.º 33
        cita: Además, si algo quedó claro es que aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló.
        retrieved_at: 2026-09-09
      - url: https://www.congreso.es/web/guest/busqueda-de-publicaciones?p_p_id=publicaciones&p_p_lifecycle=0&p_p_state=normal&p_p_mode=view&_publicaciones_mode=mostrarTextoIntegro&_publicaciones_legislatura=V&_publicaciones_id_texto=(CDC199503010438.CODI.)
        medio: congreso-espana
        fecha: 1995-03-01
        tipo: diario_de_sesiones
        titulo: DS. Congreso de los Diputados, Comisiones, núm. 438, de 01/03/1995
        cita: COMPARECENCIA DEL SEÑOR PRESIDENTE DE LA SOCIEDAD ESTATAL «FOMENTO DELCOMERCIO EXTERIOR, S. A.» (FOCOEX), PARA INFORMAR SOBRE LASIRREGULARIDADES APRECIADAS EN LA CITADA EMPRESA POR EL TRIBUNAL DECUENTAS EN EL INFORME DE FISCALIZACION REMITIDO AL CONGRESO DE LOSDIPUTADOS EL 29-11-94. A SOLICITUD DEL GRUPO PARLAMENTARIO POPULAR.
        retrieved_at: 2026-09-09
  analisis: |-
    Dijo que hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que "absolutamente nadie controló". El Diario de Sesiones del Congreso de los Diputados de España confirma que FOCOEX tenía créditos cuestionados por el Tribunal de Cuentas español y un contrato en Uruguay, pero no menciona el monto de US$137.000.000 ni el convenio con el Ministerio de Salud Pública.

    El documento que resolvería esto es el expediente de la Comisión Investigadora Parlamentaria uruguaya sobre el tema, que se cita en el propio debate pero no se relevó en esta corrida.
