  dato_real:
    valor: 'No se encontró un informe oficial del Banco de Previsión Social, el Ministerio de Economía y Finanzas o la Oficina de Planeamiento y Presupuesto con el déficit conjunto de las Cajas Militar y Policial para 1997. Búsquedas generales ubicaron cifras oficiales de años muy posteriores (un déficit de la Caja Militar de US$450-580 millones hacia 2021-2022), ya no comparables por la distancia temporal y porque corresponden solo a esa caja.


      Se buscó también la Ley N.º 16.878 (Rendición de Cuentas, ejercicio 1996) en IMPO: la página que sirve esa ley no trae el articulado (solo una ficha de 792 caracteres), así que no se pudo confirmar ni descartar el dato por esa vía.'
