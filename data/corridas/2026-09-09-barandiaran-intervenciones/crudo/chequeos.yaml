    Dijo que las exportaciones uruguayas habían crecido 16%, 10% y 13% en los tres años previos a diciembre de 1997. La serie de comercio exterior del Banco Mundial (Comtrade/WITS), usada como sustituto porque el informe del BCU no se pudo descargar, da variaciones de +10,0%, +13,8% y +13,9% para esos mismos años: dos de los tres números coinciden de forma aproximada, pero ninguno de los tres años muestra un +16%.

    La serie del Banco Mundial mide el comercio con datos declarados por los socios comerciales ("espejo"), que puede diferir de la serie de balanza de pagos del BCU que Barandiarán probablemente citaba. Sin esa serie oficial, no se puede establecer si el 16% del primer año es un error o corresponde a otra medición legítima del mismo fenómeno.
