        tipo: diario_de_sesiones
        titulo: Diario de Sesiones de la Cámara de Representantes, 1997-06-25, N.º 40
        cita: En 1965, fue el primer país en el mundo que reconoció oficialmente el genocidio armenio
        retrieved_at: 2026-09-09
