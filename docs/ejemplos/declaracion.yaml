  fecha: 1995-03-15
  contexto: parlamento                        # campaña | gobierno | oposicion | entrevista | parlamento | redes
  cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
  titulo: Sostuvo que los roles de género tradicionales también perjudican a los hombres
  cita: >-
    Muchas veces los hombres, llamados a dominar, viven la subordinación, la desvalorización y la
    marginación social y política. El mismo sistema que les adjudica roles protagónicos los excluye
    y estigmatiza por lo que no realizan.
  resumen: >-
    En la media hora previa, en el marco del Día Internacional de la Mujer, sostuvo que los
    estereotipos de género también perjudican a los hombres y que superar esos roles beneficiaría a
    toda la sociedad.
