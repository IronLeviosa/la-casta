  analisis: >-
    El 26 de setiembre de 2022, tras la detención de su jefe de custodia, dijo que Astesiano «no
    tiene antecedentes penales». El 28 y 29 de setiembre dos grupos de medios informaron que había
    sido procesado por estafa en 2002 y en 2013. El 30 de setiembre sostuvo que no mentía y atribuyó
    el error a la información que recibió. Es cambio parcial: no repitió la afirmación ni la
    desmintió, pero admitió que pudo equivocarse. La explicación es por contexto, no reconocimiento
    explícito: lo que adujo fue una circunstancia, no un cambio de posición reconocido.
