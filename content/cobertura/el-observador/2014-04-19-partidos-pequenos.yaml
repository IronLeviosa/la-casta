titulo: Los partidos pequeños
fecha: 2014-04-19
evento: elecciones-2014
politico: abella
tono: desfavorable
justificacion: 'La nota lo caracteriza por asociación con figuras controvertidas y por un llamado a
  encarcelar a un rival político: "Abella quiere restaurar las viejas banderas de la izquierda.
  Admira a Fidel Castro y a Hugo Chávez" y "Esa gente tendría que estar presa (…). Pido cárcel para
  ellos". La misma nota trata con un tono equivalente de curiosidad/burla al candidato de un partido
  marginal de derecha (Unión Para el Cambio, admirador de Perón), que no tiene ficha propia por no
  haber ocupado una banca: el tratamiento no es específico de la izquierda, es parejo hacia los
  partidos chicos de distinto signo que cubre esa nota.'
