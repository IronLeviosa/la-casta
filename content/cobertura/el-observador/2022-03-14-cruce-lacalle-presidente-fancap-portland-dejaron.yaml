justificacion: "El diario aporta por su cuenta el respaldo fáctico de la acusación del presidente al
  gobierno anterior, sin atribuirlo a nadie ni contrastarlo: \"'Dejaron pudrir un horno, nunca te vi
  levantar la voz, nunca hablaste', apuntó en referencia al horno comprado durante los gobiernos del
  Frente Amplio que nunca fue colocado\"."
