justificacion: 'El medio evalúa la decisión en su propia voz, no en la de una fuente: "Si se tienen
  en cuenta las tarifas que están pagando los uruguayos por un servicio monopolizado –la telefonía
  básica– y por otro en competencia –la telefonía móvil– la decisión de Mujica parece una mala
  noticia para los usuarios". La nota consigna que buscó la versión de ANTEL y no la obtuvo, y
  también publica dos datos favorables (Uruguay entre los más baratos en minuto de celular y en
  internet del continente), pero el juicio del primer párrafo es propio del medio.'
