politico: lacalle-pou
tono: neutral
justificacion: 'Nota de contraste que somete a examen los argumentos de los dos lados con la misma
  vara y en voz propia: cuestiona el método de los asesores del Frente Amplio ("si solo se toma los
  dos extremos de un período y se calcula un promedio, se pasa por alto qué ocurrió entre medio") y
  también señala lo que el gobierno actual reconoció y no resolvió ("el gobierno reconoció un
  sobreprecio de hasta $ 2,97 por litro (llamado factor x) […] En la hoja de ruta del gobierno, el
  objetivo era que ese sobreprecio se suprimiera en un plazo de tres años"). Atribuye las cifras al
  CED ("según las estimaciones del CED") en vez de asumirlas. Ninguna frase evaluativa cae de un
  solo lado, así que neutral.'
