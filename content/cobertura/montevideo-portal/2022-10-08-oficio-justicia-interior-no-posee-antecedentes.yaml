justificacion: Es la nota que mejor explica el argumento del Gobierno ("La respuesta se encuentra en
  un oficio que libró el Juzgado Letrado de Primera Instancia en 2015") y a la vez marca la
  contradicción interna del Ministerio ("Heber ha dejado entrever en más de una ocasión que el
  excustodio posee antecedentes, algo que dentro del ministerio no comparten"); la frase más benigna
  para el presidente ("Esta explicación, junto con la confianza que el mandatario tenía en
  Astesiano, lo impulsó a no sospechar") está atribuida a fuentes de Presidencia, no puesta en voz
  del medio. Esta misma nota tiene, además, una discrepancia registrada contra la fuente primaria
  (ver discrepancias.yaml de este lote).
