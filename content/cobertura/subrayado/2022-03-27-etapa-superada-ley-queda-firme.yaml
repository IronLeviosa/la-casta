titulo: '"Una etapa superada, una ley que queda firme", dijo Lacalle Pou tras referéndum por la LUC'
fecha: 2022-03-27
evento: referendum-luc
politico: lacalle-pou
tono: neutral
justificacion: 'Crónica de la conferencia sin evaluación propia: encadena lo que dijo con verbos de
  atribución ("sostuvo", "señaló", "explicó") y no agrega juicio ni contraste, incluso en el pasaje
  donde reproduce cifras suyas sin verificar ("dijo que se pagaron más de USD 1.700 millones de
  sobrecostos en el quinquenio anterior"). Reproducir una cifra sin chequearla no es tono favorable;
  es crónica. La cita alterada está registrada como discrepancia (recorta la reserva "creo que del
  2001 2002") y tampoco mueve el tono: recorta a favor de la contundencia de la frase, no a favor ni
  en contra del político.'
