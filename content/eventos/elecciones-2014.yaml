resumen: La primera vuelta se realizó el 26 de octubre de 2014 y, al no haber mayoría absoluta, el
  balotaje del 30 de noviembre enfrentó a Tabaré Vázquez-Raúl Sendic (Frente Amplio) y Luis Lacalle
  Pou-Jorge Larrañaga (Partido Nacional). Ganó Vázquez con 56,50 % de los votos. En primera vuelta
  obtuvieron representación parlamentaria, además del Frente Amplio y el Partido Nacional, el
  Partido Colorado (Pedro Bordaberry), el Partido Independiente (Pablo Mieres) y Unidad Popular
  (Gonzalo Abella). Junto con la elección se votó un plebiscito, impulsado por sectores del Partido
  Nacional y el Partido Colorado y resistido por el Frente Amplio, para bajar la edad de
  imputabilidad penal de 18 a 16 años; no alcanzó los votos necesarios para aprobarse.
