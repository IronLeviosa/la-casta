    titulo: Elecciones generales de Uruguay de 2014
    cita: Las elecciones generales del Uruguay de 2014 se llevaron a cabo los días 26 de octubre y 30 de
      noviembre de ese año. Ninguna de las fórmulas presidenciales logró la mayoría absoluta de los
      votos emitidos en primera vuelta, por tanto se realizó una segunda vuelta (balotaje) el día 30
      de noviembre de 2014, resultando victoriosa la fórmula presidencial de Tabaré Vázquez y Raúl
      Fernando Sendic.
    retrieved_at: 2026-09-05
  - url: https://es.wikipedia.org/wiki/Elecciones_generales_de_Uruguay_de_2014
    medio: wikipedia
    fecha: 2026-09-05
    tipo: nota
    titulo: Elecciones generales de Uruguay de 2014
    cita: "Junto con estas elecciones se llevó a cabo un plebiscito para bajar la edad de imputabilidad
      de 18 a 16 años, el cual fue impulsado por los sectores mayoritarios del Partido Nacional y
      Colorado y contó con la oposición del partido de gobierno: Frente Amplio. Dicho plebiscito no
      alcanzó los votos suficientes para ser aprobado."
    retrieved_at: 2026-09-05
