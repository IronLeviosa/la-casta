    titulo: Crisis bancaria de 2002 en Uruguay
    cita: >-
      Para mediados de 2002, las ayudas entregadas por el Banco Central del Uruguay a la banca comercial ascendían a varios millones de dólares. Esto provocó la caída del impopular ministro de economía Alberto Bensión.
