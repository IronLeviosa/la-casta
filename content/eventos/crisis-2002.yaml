nombre: Crisis de 2002
alias: [crisis de 2002, crisis bancaria, crisis del 2002, feriado bancario, corralito uruguayo, Banco Comercial, Banco Montevideo, Atchugarry, reprogramación de depósitos]
desde: 2002-01-01
hasta: 2002-12-31
temas: [economia, empresas-publicas, economia/empleo]
politicos: [batlle]
casos: []
resumen: >-
  Durante el gobierno de Jorge Batlle, la crisis financiera de 2002 llevó al Banco Central a asistir a varios bancos, a la caída del ministro de Economía Alberto Bensión, a un feriado bancario y a la designación de Alejandro Atchugarry como ministro. El Parlamento aprobó la Ley de Fortalecimiento del Sistema Bancario, que reprogramó depósitos.
