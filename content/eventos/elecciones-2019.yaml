resumen: >-
  La primera vuelta se realizó el 27 de octubre de 2019 y, al no haber mayoría absoluta, el balotaje del 24 de noviembre enfrentó a Daniel Martínez-Graciela Villar (Frente Amplio) y Luis Lacalle Pou-Beatriz Argimón (Partido Nacional). Ganó Lacalle Pou por un margen estrecho, confirmado recién con el escrutinio definitivo.
