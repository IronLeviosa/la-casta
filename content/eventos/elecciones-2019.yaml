    titulo: Elecciones generales de Uruguay de 2019
    cita: >-
      Como ninguna de las fórmulas presidenciales obtuvo la mayoría absoluta de votos emitidos, se realizó una segunda vuelta (balotaje) el domingo 24 de noviembre de 2019 entre las fórmulas Daniel Martínez-Graciela Villar y Luis Lacalle Pou-Beatriz Argimón para elegir presidente y vicepresidente.
