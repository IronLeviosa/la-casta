casos: []
resumen: En setiembre de 2021 el Directorio de Ancap resolvió, por cuatro votos contra el rechazo
  del director del Frente Amplio Vicente Iglesias, avanzar en un plan para incorporar un socio
  privado al negocio del pórtland, deficitario desde hacía dos décadas; el presidente Lacalle Pou
  confirmó la decisión el 10 de octubre de ese año en un discurso en la Expo Rural de San José. En
  setiembre de 2022 Ancap aprobó las bases de un llamado competitivo para concretar esa asociación
  industrial y comercial en cemento y cal. La Federación Ancap (Fancap) respondió con paros y
  ocupaciones —entre ellas la de la refinería de La Teja el 26 de julio de 2023, la quinta en dos
  meses desde que el sindicato se declaró en conflicto en mayo— exigiendo que la empresa revea la
  decisión de privatizar la industria cementera. La licitación internacional quedó desierta el 12 de
  setiembre de 2023 al no presentarse ofertas de privados.
