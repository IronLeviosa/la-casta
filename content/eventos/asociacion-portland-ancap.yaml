  notas_internas: "El Directorio de Ancap resolvió avanzar con la asociación en setiembre de 2021;
    ninguna de las fuentes citadas da el día exacto de esa resolución. Se usó `desde: 2021-10-10`
    (día en que Lacalle Pou confirmó la decisión en la Expo Rural de San José) por ser la fecha
    mejor documentada: fuente oficial de Presidencia más nota de El País del día siguiente. El
    resumen deja explícito que la resolución del Directorio fue en setiembre."
