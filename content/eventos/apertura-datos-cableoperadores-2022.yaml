nombre: El Poder Ejecutivo habilita a cableoperadores privados a competir con ANTEL en transmisión de datos
alias:
  - apertura de la fibra óptica a los cableoperadores
  - Antel pierde su monopolio de fibra óptica
  - licencias Clase B a cableoperadores
desde: 2022-06-14
hasta: 2022-10-20
temas:
  - empresas-publicas
politicos:
  - lacalle-pou
casos: []
resumen: El 14 de junio de 2022 el Poder Ejecutivo, con la firma de Luis Lacalle Pou, otorgó
  licencias de transmisión de datos Clase B a cinco cableoperadores privados (Korfield, Montecable,
  Praimar, Nuevo Siglo y TCC), que hasta entonces tenían prohibido competir con la fibra óptica de
  ANTEL bajo el artículo 56 de la Ley 19.307. El 20 de octubre de 2022 la Ley 20.075 sustituyó ese
  artículo por uno que habilita a los titulares de licencias de televisión por cable a solicitar
  licencias de banda ancha e internet.
fuentes:
  - url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
    medio: el-observador
    fecha: 2022-06-16
    tipo: nota
    titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
    cita: El Poder Ejecutivo habilitó a cinco cableoperadores de Canelones, Colonia y Montevideo a
      prestar servicios de internet en sus áreas de cobertura. Las cinco resoluciones, firmadas por
      el presidente de la República, Luis Lacalle Pou, con fecha 14 de junio, le otorgan a estas
      empresas una Licencia de Telecomunicaciones Clase B "para brindar a terceros, servicios de
      transmisión de datos".
    retrieved_at: 2026-09-08
  - url: https://www.impo.com.uy/bases/leyes-originales/20075-2022
    medio: impo
    fecha: 2022-10-20
    tipo: documento_oficial
    titulo: Ley N° 20.075, artículo 240 (texto original)
    cita: >-
      Artículo 240 Sustitúyese el artículo 56 de la Ley N° 19.307, de 29 de diciembre de 2014, por
      el siguiente:

      "ARTÍCULO 56.- Los titulares de servicios de comunicación audiovisual de televisión para
      abonados que operan mediante cable tendrán derecho a solicitar licencias para prestar
      servicios de banda ancha y acceso a internet, a través del empleo de sus redes propias,
      desarrollos futuros o de recursos que contraten con terceros, en igual área de cobertura a la
      de su respectiva licencia.
    retrieved_at: 2026-09-08
