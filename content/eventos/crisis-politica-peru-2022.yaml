resumen: El 7 de diciembre de 2022 el presidente peruano Pedro Castillo intentó disolver el
  Congreso, en lo que el arco político, juristas y organizaciones civiles calificaron de autogolpe
  de Estado; horas después el Parlamento aprobó su destitución y tomó juramento a la vicepresidenta
  Dina Boluarte, que asumió la primera magistratura. El embajador uruguayo en Lima, el
  exvicepresidente Luis Hierro López, calificó el desenlace como algo previsible y descartó
  cualquier respaldo de Uruguay a un golpe de Estado.
