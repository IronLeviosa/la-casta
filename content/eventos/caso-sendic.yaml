resumen: >-
  Raúl Sendic, vicepresidente durante el segundo gobierno de Tabaré Vázquez, fue cuestionado en 2016 por un título de licenciado que no existía y en 2017 por gastos con la tarjeta corporativa de ANCAP. El 9 de septiembre de 2017 anunció su renuncia a la Vicepresidencia, efectiva el 13 de septiembre; después fue procesado por abuso de funciones y peculado por su gestión en ANCAP.
