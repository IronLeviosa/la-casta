nombre: Mecanismo de fijación de precios de los combustibles (LUC)
alias:
  - mecanismo de fijación de precios de los combustibles
  - precio de paridad de importación
  - PPI
  - fórmula de los combustibles
  - artículos 235 y 236 de la LUC
desde: 2020-07-09
temas:
  - economia/combustibles
