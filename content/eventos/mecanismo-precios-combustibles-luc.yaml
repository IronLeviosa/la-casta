    medio: impo
    fecha: 2020-07-09
    tipo: documento_oficial
    titulo: Ley N° 19.889 — artículo 235 (Aprobación de los precios de los combustibles)
    cita: El Poder Ejecutivo actualizará con una periodicidad no mayor a sesenta días, los precios
      definidos en el inciso primero de este artículo y el precio máximo de venta al público, en las
      mismas condiciones que en él se definen y de manera independiente de los eventuales volúmenes
      de los diferentes combustibles almacenados, salvo razón válida y debidamente fundada.
    retrieved_at: 2026-09-06
  - url: https://www.impo.com.uy/bases/decretos/241-2020
    medio: impo
    fecha: 2020-08-26
    tipo: documento_oficial
    titulo: Decreto N° 241/020 — artículo 4 (informes preceptivos mensuales de ANCAP y URSEA)
    cita: La Administración Nacional de Combustibles, Alcohol y Portland (ANCAP) y la Unidad Reguladora
      de Servicios de Energía y Agua (URSEA), deberán enviar al Poder Ejecutivo los informes
      preceptivos a los que hace referencia el artículo 235 de la Ley N° 19.889, de 9 de julio de
      2020, antes del día 28 de cada mes. El informe de la Unidad Reguladora de Servicios de Energía
      y Agua (URSEA) deberá incluir el PPI correspondiente del mes móvil cerrado al día 25 del cada
      mes.
    retrieved_at: 2026-09-06
