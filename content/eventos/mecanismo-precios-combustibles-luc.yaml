politicos:
  - lacalle-pou
casos: []
resumen: "La Ley de Urgente Consideración (ley 19.889), promulgada el 9 de julio de 2020, estableció
  en sus artículos 235 y 236 un nuevo mecanismo para fijar el precio de venta de los combustibles de
  ANCAP: el Poder Ejecutivo aprueba el precio con un informe preceptivo de URSEA que debe explicitar
  el precio de paridad de importación (PPI), y debe actualizarlo con una periodicidad no mayor a
  sesenta días salvo razón válida y debidamente fundada. La reglamentación de esos artículos,
  contenida en el decreto 241/020 y sus modificaciones posteriores, exige a ANCAP y a URSEA enviar
  mensualmente al Poder Ejecutivo informes que incluyan el PPI, antes del día 28 de cada mes. El
  propio Lacalle Pou defendió públicamente el mecanismo en octubre de 2021, argumentando que
  permitía a la ciudadanía conocer cuánto del precio corresponde al costo del petróleo, a impuestos,
  al subsidio de Ancap y a las ganancias de la empresa."
