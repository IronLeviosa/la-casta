resumen: El diputado Gabriel Barandiarán presentó en la Cámara de Representantes un proyecto de ley
  de ocho artículos para regular el manejo de bases de datos con información de personas físicas y
  reconocer el derecho de las personas a su intimidad respecto de sus datos personales. El texto del
  proyecto y el diario de sesión en que se presentó no están digitalizados; lo documentado es la
  nota de prensa que lo describe, del 29 de setiembre de 2000.
