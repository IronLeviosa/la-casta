nombre: Acuerdo entre Uruguay y Katoen Natie que extiende la concesión de TCP hasta 2081
alias:
  - acuerdo con Katoen Natie
  - extensión de la concesión de Terminal Cuenca del Plata hasta 2081
  - acuerdo Estado-Katoen Natie de 2021
desde: 2021-02-25
temas:
  - empresas-publicas
politicos: []
casos: []
resumen: El 25 de febrero de 2021 el Estado uruguayo y las compañías del grupo Katoen Natie firmaron
  un acuerdo, aprobado por la Resolución del Poder Ejecutivo CM/401 y recogido en el Decreto
  114/021, por el que la empresa desistió de un reclamo de USD 1.500 millones y se pactaron
  inversiones estimadas en USD 455 millones y una rebaja tarifaria en la Terminal Cuenca del Plata
  del puerto de Montevideo. La concesión de la terminal quedó extendida hasta 2081. En setiembre de
  2025 el presidente de la ANP, Pablo Genta, dijo que el acuerdo no se iba a renegociar.
