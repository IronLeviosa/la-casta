resumen: El embajador uruguayo en Perú, Luis Hierro López, escribió el 24 de octubre de 2023 en su
  cuenta de X que Sergio Massa había hecho una buena campaña pero que Javier Milei y Mauricio Macri
  tenían una oportunidad para un "gran acuerdo", tras la primera vuelta electoral en Argentina. El
  canciller Francisco Bustillo le envió una observación por esos comentarios y la senadora
  frenteamplista Liliam Kechichian los cuestionó públicamente.
