resumen: >-
  La primera vuelta se realizó el 27 de octubre de 2024 junto con dos plebiscitos constitucionales. El balotaje del 24 de noviembre enfrentó a Yamandú Orsi-Carolina Cosse (Frente Amplio) y Álvaro Delgado-Valeria Ripoll (Partido Nacional); ganó la fórmula frenteamplista, que asumió el 1 de marzo de 2025.
