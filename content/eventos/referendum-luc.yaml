resumen: >-
  El 27 de marzo de 2022 se votó la derogación de 135 artículos de la ley 19.889 (Ley de Urgente Consideración), principal iniciativa legislativa del gobierno de Lacalle Pou. El No obtuvo 51,33 % y el Sí 48,67 %, por lo que los artículos impugnados se mantuvieron vigentes.
