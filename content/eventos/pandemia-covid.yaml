temas: [salud/pandemia-covid, salud, economia/empleo]
politicos: [lacalle-pou]
casos: []
resumen: >-
  Los primeros casos de COVID-19 en Uruguay se confirmaron el 13 de marzo de 2020 y ese mismo día el presidente Lacalle Pou decretó la emergencia sanitaria nacional. La emergencia se levantó el 5 de abril de 2022, tras dos años y 24 días.
