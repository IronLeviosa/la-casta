casos: []
resumen: >-
  En marzo de 2023 el senador nacionalista Gustavo Penadés fue acusado públicamente de haber pagado por relaciones sexuales con una persona menor de edad; luego se sumaron más denunciantes. El 7 de junio de 2023 el Senado le quitó los fueros a pedido de la Fiscalía y el 10 de octubre de 2023 fue formalizado con prisión preventiva por delitos de explotación sexual, abuso sexual, violación, corrupción de menores y desacato.
