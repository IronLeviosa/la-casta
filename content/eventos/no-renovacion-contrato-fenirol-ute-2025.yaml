    titulo: 'Stipanicic: "El monopolio de la compra de generación eléctrica de UTE es absurdo y hay que
      combatirlo"'
    cita: El Directorio de UTE resolvió la semana pasada con los votos del oficialismo no renovar el
      contrato de compraventa de energía con la empresa Fenirol S.A (Energías Renovables
      Tacuarembó). Esta empresa se dedica a generar energía renovable a partir de biomasa –quema de
      chips y aserrín de la industria forestal– y le comercializaba producción al ente desde el
      2007. El semanario Búsqueda había informado la semana pasada que en febrero de 2025 el
      gobierno de Luis Lacalle Pou adoptó una resolución en la que por tercera vez se renovaba el
      contrato con este proveedor, por un lapso de 12 años y un monto aproximado de US$ 97,9
      millones. Pero el nuevo Directorio revirtió la decisión dando lugar a una observación
      efectuada por el Tribunal de Cuentas "por falta de disponibilidad presupuestal" y resolvió no
      reiterar el gasto.
