    cita: La exvicepresidenta de Uruguay Lucía Topolansky presentó este martes su carta de renuncia al
      escaño que ocupa en el Senado y se hará efectiva este miércoles, cuando la Cámara Alta vote a
      su sustituto, Sebastián Sabini, uno de los líderes más reconocidos en las juventudes del
      Frente Amplio (izquierda).
