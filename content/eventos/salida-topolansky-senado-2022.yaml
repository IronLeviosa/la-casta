resumen: La exvicepresidenta Lucía Topolansky presentó el 1° de marzo de 2022 su renuncia a la banca
  de senadora que ocupaba desde que dejó la Vicepresidencia en 2020, efectiva al día siguiente; la
  sustituyó Sebastián Sabini, del Movimiento de Participación Popular.
