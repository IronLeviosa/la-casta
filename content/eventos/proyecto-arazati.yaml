    titulo: El proyecto Neptuno de OSE "es inconstitucional", denuncia Comisión Nacional en Defensa del
      Agua
    cita: La Comisión Nacional en Defensa del Agua y de la Vida (CNDAV) se pronunció este miércoles
      sobre el proyecto Neptuno, que está a estudio de OSE, y lo consideró "inconstitucional" en
      tanto permitiría que un conglomerado de empresas privadas termine gestionando el agua potable,
      algo que quedó explícitamente prohibido luego del plebiscito de 2004.
