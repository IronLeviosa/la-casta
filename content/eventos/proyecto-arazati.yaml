resumen: OSE presentó un proyecto de segunda planta potabilizadora sobre el Río de la Plata,
  conocido primero como "Neptuno" y luego como "Arazatí", financiada y construida por un consorcio
  privado bajo un contrato de participación público-privada. La Comisión Nacional en Defensa del
  Agua y la Vida y el sindicato FFOSE denunciaron el proyecto como inconstitucional y privatizador,
  por entender que viola la exclusividad estatal del artículo 47 de la Constitución. El secretario
  de la Presidencia, Álvaro Delgado, respondió que no hay ningún tipo de privatización porque la
  potabilización sigue a cargo de OSE y el privado solo cobra por la disponibilidad de la
  infraestructura.
