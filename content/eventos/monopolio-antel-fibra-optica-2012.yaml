resumen: En mayo de 2012 el presidente José Mujica anunció que enviaría al Parlamento un proyecto de
  ley para mantener el monopolio estatal de ANTEL sobre el tendido de fibra óptica para llevar
  internet a los hogares, en momentos en que se discutía si abrir esa infraestructura a la
  competencia privada.
