    medio: montevideo-portal
    fecha: 2025-01-24
    tipo: nota
    titulo: Tras falta de apoyo, Lacalle Pou decidió retirar venia para nombrar embajador a Bustillo
    cita: El presidente de la República, Luis Lacalle Pou, decidió retirar el pedio de venia para
      designar al excanciller Francisco Bustillo como embajador de Perú.
    retrieved_at: 2026-09-05
