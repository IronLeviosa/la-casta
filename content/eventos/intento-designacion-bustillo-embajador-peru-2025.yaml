    tipo: nota
    titulo: Propondrán designar al excanciller Bustillo como embajador en Perú en lugar de Hierro
    cita: El gobierno propondrá que el exministro de Relaciones Exteriores Francisco Bustillo, que es
      funcionario de carrera de Cancillería, sea designado en las próximas horas como nuevo
      embajador de Perú para ocupar el cargo que actualmente desempeña el exvicepresidente Luis
      Hierro López, informó Eduardo Preve y confirmó Montevideo Portal.
    retrieved_at: 2026-09-05
