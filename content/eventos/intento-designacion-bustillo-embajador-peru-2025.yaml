resumen: En los últimos días de su gobierno, el presidente Luis Lacalle Pou propuso designar al
  excanciller Francisco Bustillo como embajador de Uruguay en Perú, en sustitución del
  exvicepresidente Luis Hierro López, embajador en Lima desde diciembre de 2020. La falta de apoyo
  del Frente Amplio y de legisladores del propio Partido Colorado en la Comisión Permanente llevó a
  Lacalle Pou a retirar el pedido de venia el 24 de enero de 2025.
