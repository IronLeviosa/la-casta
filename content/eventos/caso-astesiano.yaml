    cita: >-
      El caso Astesiano fue un proceso judicial ocurrido en Uruguay entre 2022 y 2023, relacionado con Alejandro Astesiano, entonces jefe de la custodia del presidente Luis Lacalle Pou y una red de falsificación de pasaportes que comenzó en 2013 durante el gobierno de José Mujica.
    retrieved_at: 2026-09-03
