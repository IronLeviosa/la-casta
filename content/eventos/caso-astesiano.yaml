resumen: >-
  El 26 de septiembre de 2022 fue detenido Alejandro Astesiano, jefe de la custodia del presidente Luis Lacalle Pou, por una red de falsificación de documentos para expedir pasaportes uruguayos a ciudadanos rusos. En febrero de 2023 fue condenado a cuatro años y seis meses de cárcel, multa e inhabilitación para cargos públicos, y el presidente relevó a la cúpula de la Policía Nacional.
