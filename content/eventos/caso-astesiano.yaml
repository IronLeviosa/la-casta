    titulo: Caso Astesiano
    cita: >-
      Ese mismo mes Astesiano fue condenado a cuatro años y seis meses de cárcel, una multa de 150.000 pesos y la inhabilitación para volver a ejercer cargos públicos por los delitos de conjunción del interés personal y del público, asociación para delinquir, revelación de secreto y tráfico de influencias.
