    analisis: "Mismo caso que la afirmación anterior: sin un documento oficial que publique el precio de
      importación de referencia de 2013, el monto de Rossa no se puede confirmar ni refutar de forma
      independiente. Discutible."
  - afirmacion: Según el Cr. Álvaro Rossa, en 2014 mezclar combustible producido por ALUR en vez de
      importarlo le significó a ANCAP un sobrecosto de U$S 92.300.000, la cifra más alta de los tres
      años que analiza.
    fragmento: U$ 92.300.000 en el 2014
    calificacion: discutible
    dato_real:
      valor: El informe atribuye este monto al mismo dictamen, sin metodología reproducida en el pasaje
        consultado. Los Estados Contables Individuales de ALUR al 31/12/2014 (ya cargados en esta
        ficha) muestran un resultado del ejercicio positivo de $203.061.490, el mayor de la serie
        2006-2014, en el mismo año en que ALUR adoptó el dólar como moneda funcional; tampoco
        permite confirmar o refutar, por sí solo, el sobrecosto de Rossa. No se encontró un
        documento oficial con el precio de importación de referencia de etanol o biodiésel para
        2014. El crecimiento del monto año a año (48,5 → 58,7 → 92,3 millones) coincide en dirección
        con el aumento de la producción de ALUR en el período (la planta de bioetanol de Paysandú,
        la más cara de las cuatro que construyó ALUR entre 2008 y 2014, entró en operación en 2014;
        ver hitos), pero esta corrida no encontró un documento que separe cuánto del aumento del
        sobrecosto responde a mayor volumen y cuánto a mayor brecha de precio por unidad.
