    analisis: No hay, en esta corrida, un documento oficial (precio de importación de referencia de
      ANCAP, URSEA o MIEM para 2012) que permita reconstruir el monto de forma independiente; los
      estados contables de ALUR miden magnitudes distintas (resultado total, capitalización), no el
      sobrecosto de mezclar frente a importar. La calificación queda discutible.
  - afirmacion: Según el Cr. Álvaro Rossa, en 2013 mezclar combustible producido por ALUR en vez de
      importarlo le significó a ANCAP un sobrecosto de U$S 58.700.000.
    fragmento: U$ 58.700.000 en el 2013
    calificacion: discutible
    dato_real:
      valor: El informe atribuye este monto al mismo dictamen de Rossa, sin metodología reproducida en el
        pasaje consultado. Los Estados Contables Individuales de ALUR al 31/12/2013 (ya cargados en
        esta ficha) muestran un resultado del ejercicio positivo de $40.790.256 y ninguna
        capitalización nueva de ANCAP ese año; tampoco permiten, por sí solos, confirmar o refutar
        el sobrecosto que calcula Rossa. No se encontró un documento oficial con el precio de
        importación de referencia de etanol o biodiésel para 2013.
