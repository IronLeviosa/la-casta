    analisis: "El cálculo es aritméticamente consistente con las dos afirmaciones anteriores: el 58% de
      los USD 312 millones que de León atribuye a los ingresos de telefonía fija de 2011 da USD
      180,96 millones, cerca de los USD 181 millones que declara. Esa consistencia interna no es una
      verificación independiente, porque depende del 58% de la afirmación anterior, que no tiene
      comparador oficial encontrado en esta corrida."
veredicto: "De las tres afirmaciones, una —la base de ingresos de telefonía fija en 2011— quedó en
  impreciso: coincide con el balance oficial dentro de un margen chico (0,05%), con una salvedad de
  categoría (el balance agrupa telefonía fija con pública y telegrafía). Las otras dos —el 58% de
  sobreprecio regional y los USD 181 millones de renta monopólica que se derivan de él— quedaron en
  discutible: no se encontró, en esta corrida, una fuente oficial que publique el comparador
  regional de tarifas que De León dice haber usado. Eso no dice que el 58% sea incorrecto: dice que
  este análisis no pudo verificarlo con un documento oficial, así que la magnitud central del
  argumento de De León —cuánto más caro es el servicio monopolizado que el de referencia regional—
  queda sin confirmar de forma independiente, aunque la base sobre la que se calcula sí es
  consistente con el balance de ANTEL."
