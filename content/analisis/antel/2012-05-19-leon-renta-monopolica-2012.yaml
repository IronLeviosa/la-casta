          cita: Además, De León sostuvo que si se aplica la metodología de análisis para estimar precios
            denominada benchmarking (una herramienta que busca comportamientos competitivos en
            mercados monopolísticos), queda en evidencia que si en Uruguay se establecieran las
            tarifas de acuerdo a los costos "al menos deberían encontrarse en el promedio del
            continente, o sea el 58% menos que los precios actuales".
          retrieved_at: 2026-09-08
    analisis: De León atribuye el 58% a un estudio de benchmarking propio, sin publicar la metodología
      completa ni identificar los países o las tarifas de comparación. No se encontró, en el tiempo
      de esta corrida, una fuente oficial (URSEC, UIT, OCDE) que publique tarifas regionales de
      telefonía fija para 2011-2012 y permita contrastar ese porcentaje, así que queda como una
      afirmación del autor sin comparador verificado.
  - afirmacion: La "renta monopólica" estimada -la diferencia entre lo cobrado por ANTEL en telefonía
      fija y lo que resultaría de aplicar tarifas de costo- asciende a aproximadamente USD 181
      millones por año.
    fragmento: asciende a aproximadamente US$ 181 millones por año
    calificacion: discutible
