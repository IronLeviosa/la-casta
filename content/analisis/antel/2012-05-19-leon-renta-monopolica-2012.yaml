            servicios
          cita: Ejercicio 2011 $ miles Telefonía (*) Datos Telefonía Móvil Total Ingresos Operativos 6.232.799
            3.292.501 8.267.947 17.793.247 Gastos Operativos 5.131.116 2.848.871 6.291.709
            14.271.696 Resultado Operativo 1.101.683 443.630 1.976.238 3.521.551 (*) Incluye
            Telefonía Fija, Pública y Telegrafía
          retrieved_at: 2026-09-08
    analisis: La cifra que cita de León y la que informa el balance individual de 2012 (columna
      comparativa 2011) coinciden casi exactamente (diferencia de 0,05%), pero el balance agrupa
      telefonía fija con telefonía pública y telegrafía bajo la misma categoría "Telefonía",
      mientras que de León habla solo de "telefonía fija". No se pudo determinar si esa pequeña
      diferencia corresponde a esa distinción o a otra causa.
  - afirmacion: Aplicando una metodología de benchmarking, las tarifas de telefonía fija de ANTEL
      deberían ubicarse un 58% por debajo de los precios vigentes en 2012 para alinearse con el
      promedio del continente.
    fragmento: al menos deberían encontrarse en el promedio del continente, o sea el 58% menos que los
      precios actuales
    calificacion: discutible
    dato_real:
      valor: No se encontró, en el tiempo de esta corrida, una fuente oficial (URSEC, UIT, OCDE) que
        publique el promedio regional de tarifas de telefonía fija para 2011-2012 y permita
        contrastar el 58%. La nota de El Observador tampoco identifica el estudio de benchmarking
        del que sale ese porcentaje ni la metodología completa. Queda como una afirmación del autor,
        sin comparador oficial verificado en esta corrida.
      fuentes:
