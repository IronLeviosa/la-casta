titulo: La "renta monopólica" de ANTEL en telefonía fija, según el benchmarking de Omar de León (2012)
empresa: antel
autor: Omar de León
autor_es: Experto en comunicaciones citado por El Observador en 2012; la nota no detalla su
  afiliación institucional ni el estudio completo de benchmarking que dice haber aplicado.
fecha: 2012-05-19
publicado:
  url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
  medio: el-observador
  fecha: 2012-05-19
  tipo: nota
  titulo: Servicios monopólicos de ANTEL son más caros que los de la región
  cita: En las últimas horas el presidente José Mujica anunció que tiene planeado enviar al Parlamento
    una ley que fija el monopolio estatal en el tendido de la fibra óptica para llevar internet a
    los hogares.
  retrieved_at: 2026-09-08
resumen: >-
  De León sostiene que, si Uruguay fijara las tarifas de telefonía fija según los costos
  (metodología de "benchmarking"), esas tarifas deberían ubicarse en el promedio del continente, un
  58% por debajo de las vigentes en 2012. Sobre la base de los ingresos por telefonía fija que ANTEL
  declaró para 2011 ($ 6.229.619.000, unos USD 312 millones), calcula que la diferencia entre lo
  cobrado y lo que resultaría de aplicar costos —la "renta monopólica"— asciende a unos USD 181
  millones anuales.

  La misma nota da dos datos favorables a ANTEL que no forman parte de la estimación de De León:
  según el estudio regional que cita, Uruguay es uno de los países más baratos del continente en
  costo del minuto de celular (servicio en competencia entre ANTEL, Movistar y Claro) y el segundo
  más barato en costos de internet, después de Brasil y Venezuela. El Observador consigna que
  intentó, sin éxito, conseguir la versión de ANTEL sobre el estudio de De León, y que la empresa se
  limitó a enviar una gráfica comparativa sobre cómo había bajado el precio de la telefonía fija.
metodo: El autor menciona una "metodología de análisis para estimar precios denominada benchmarking
  (una herramienta que busca comportamientos competitivos en mercados monopolísticos)", sin detallar
  la fuente de los precios regionales de comparación ni el cálculo completo.
afirmaciones:
  - afirmacion: Los ingresos de ANTEL por telefonía fija en 2011 ascendieron a $ 6.229.619.000,
      aproximadamente USD 312 millones.
    fragmento: Según los Estados Contables de ANTEL de 2011, los ingresos por telefonía fija ascienden
      a$ 6.229.619.000, aproximadamente US$ 312 millones
    calificacion: impreciso
    dato_real:
      valor: Los Estados Contables Individuales de ANTEL de 2012 (con columna comparativa 2011) informan,
        para la categoría "Telefonía" —que la propia nota al pie del cuadro aclara que "incluye
        Telefonía Fija, Pública y Telegrafía", no solo telefonía fija—, ingresos operativos de $
        6.232.799 miles en el ejercicio 2011. Esa cifra es 0,05% más alta que los $ 6.229.619.000
        que cita de León, y corresponde a una categoría algo más amplia que "telefonía fija" sola
        (incluye también telefonía pública y telegrafía). No se pudo leer el balance de 2011 en sí
        (es un PDF escaneado sin capa de texto, y esta máquina no tiene instalado el OCR que exige
        `pnpm fuente`) para comprobar si esa versión desagrega "telefonía fija" por separado de
        "pública" y "telegrafía".
      fuentes:
        - url: https://www.antel.com.uy/documents/37544/378823/estados-contables-2012-2011-individuales.pdf/16d7d5ca-36bc-b455-aa51-86ffe0934db6?t=1755713596344
          medio: antel
          fecha: 2012-12-31
