    analisis: >-
      El tramo 2022 (304 de 348) y el tramo 2023 (384 de 405) se confirman con un "Overall Ranking"
      único en cada informe. El tramo 2021 (265 de 370) corresponde solo al enfoque estadístico de
      esa edición, que todavía publicaba dos rankings separados (265 en el estadístico, 284 en el
      administrativo) sin combinarlos en un puesto único como sí hacen las ediciones posteriores.

      La cifra elegida por la nota (265) es una lectura válida y literal del documento, pero no la
      única: por eso la calificación es discutible y no verdadero, aunque la caída de posiciones que
      describe la nota se confirma bajo cualquiera de las dos lecturas de 2021.
veredicto: "Dos de las tres afirmaciones (el puesto 384 de 405 en 2023, y que Montevideo quedó por
  debajo de Buenos Aires) quedaron verdaderas: el propio informe del Banco Mundial las confirma sin
  ambigüedad. La tercera, sobre la caída de posiciones desde 2021, quedó discutible: los tramos 2022
  y 2023 se confirman con un ranking único por puerto, pero 2021 tiene dos lecturas posibles en el
  mismo documento oficial (265 en el enfoque estadístico, 284 en el administrativo), porque esa
  edición del CPPI todavía no combinaba sus dos metodologías en un solo puesto. Ninguna de las dos
  lecturas de 2021 cambia la conclusión de la nota: bajo las dos, el puesto de Montevideo empeora en
  2022 y vuelve a empeorar en 2023."
