titulo: Montevideo entre los peores puertos del mundo según el Índice de Desempeño Portuario de
  Contenedores (CPPI) del Banco Mundial, edición 2023
empresa: anp
autor: Banco Mundial (con S&P Global Market Intelligence)
autor_es: Organismo financiero multilateral del que Uruguay es país miembro; el índice lo produce el
  staff del Banco Mundial con la contribución externa de la consultora S&P Global Market
  Intelligence, según declara el propio informe.
fecha: 2024-06-11
