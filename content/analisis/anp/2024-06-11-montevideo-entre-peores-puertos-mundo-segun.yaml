  tipo: documento_oficial
  titulo: The Container Port Performance Index 2023 - A Comparable Assessment of Performance Based on
    Vessel Time in Port
  cita: This work is a product of the staff of The World Bank, together with external contributions
    from S&P Global Market Intelligence.
  retrieved_at: 2026-09-09
resumen: >-
  El informe mide el desempeño de 405 puertos de contenedores del mundo según el tiempo que un buque
  pasa en puerto (no el volumen de carga movilizado) y publica un ránking general y por región. La
  nota de La República, que reprodujo el dato para Uruguay, sostuvo que Montevideo cayó al puesto
  384 en la edición 2023, por debajo del puesto 304 (edición 2022) y del puesto 265 (edición 2021),
  y por debajo de Buenos Aires.

  El CPPI mide exclusivamente el tiempo que un buque portacontenedores pasa fondeado y atracado; no
  mide volumen de carga, cantidad de escalas ni ingresos. Es un índice distinto del ranking de CEPAL
  por TEUs movilizados que figura en la ficha de ANP (donde Montevideo ocupó el puesto 20 de la
  región en 2023, su récord histórico): un mismo puerto puede mejorar en volumen y empeorar en
  tiempo de escala en el mismo año, porque cada índice mide una cosa distinta.

  El posicionamiento del CPPI generó una reacción de ANP: según El Observador, "generó molestia en
  la Administración Nacional de Puertos (ANP) y motivó una reunión con representantes del organismo
  internacional. La intención fue conocer con mayor profundidad los parámetros utilizados para
  establecer la medición. Sin embargo, con el paso de los meses no hubo mayores avances sobre ese
  tema."
metodo: El índice combina dos metodologías (una estadística y una de puntaje administrativo) que
  miden el tiempo total que un buque portacontenedores pasa fondeado y atracado en cada puerto, con
  datos de más de 200.000 escalas de buques en el año calendario correspondiente. Desde la edición
  2022 el informe combina las dos metodologías en un único "Overall Ranking" por puerto; en la
  edición 2021 todavía no lo hacía y publicaba dos rankings separados (uno por cada metodología) sin
  combinarlos en un puesto único.
