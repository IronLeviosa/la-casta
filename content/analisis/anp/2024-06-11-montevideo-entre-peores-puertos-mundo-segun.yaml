  - afirmacion: Montevideo cayó del puesto 265 de 370 puertos en 2021 al puesto 304 de 348 en 2022 y al
      puesto 384 de 405 en 2023.
    fragmento: en 2022, Montevideo ocupaba el puesto 304 de 348 puertos, y en 2021, el puesto 265 de 370
      puertos
    calificacion: discutible
    dato_real:
      valor: >-
        El tramo 2022-2023 se confirma sin ambigüedad: el CPPI 2022 del Banco Mundial ubica a
        Montevideo en el puesto 304 (región LAC) de un total de 348 puertos ("The number of ports
        included in the CPPI 2022 is 348"), en una tabla de "Overall Ranking" única, igual que en
        2023 (384 de 405).

        El tramo 2021 admite dos lecturas del mismo documento oficial. El CPPI 2021 confirma el
        total de 370 puertos ("the number of ports assessed... grew from 351 in CPPI 2020 to 370 in
        this edition"), pero esa edición todavía no combinaba sus dos metodologías en un único
        puesto: publica una tabla con dos columnas, "administrative approach" y "statistical
        approach". Montevideo aparece en el puesto 265 en el enfoque estadístico y en el puesto 284
        en el enfoque administrativo. El puesto 265 que cita La República corresponde solo al
        enfoque estadístico, no a un "Overall Ranking" combinado como el de 2022 y 2023.

        Bajo cualquiera de las dos lecturas de 2021 (265 u 284), la dirección de la caída que
        describe la nota se mantiene: el puesto de Montevideo empeora en 2022 (304) y vuelve a
        empeorar en 2023 (384).
