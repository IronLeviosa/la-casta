    analisis: El ROE de BROU (16,0 %) coincide con el 16 % citado por CPA Ferrere; el de los bancos
      privados agregados (20,4 %) difiere en apenas 0,1 punto porcentual del 20,5 % citado. Los dos
      números provienen de la misma tabla del Reporte del Sistema Financiero del BCU, construida
      sobre los boletines mensuales que la propia nota de CPA Ferrere dice usar como fuente; el
      documento es un escaneo sin capa de texto, leído por reconocimiento óptico de caracteres.
  - afirmacion: El resultado del sistema bancario uruguayo (BROU más los nueve bancos privados) en 2025
      totalizó USD 1.046 millones, USD 530 millones menos que en 2024.
    fragmento: totalizó USD 1.046 millones, es decir, USD 530 millones menos que el año anterior
    calificacion: discutible
    dato_real:
      valor: >-
        El Reporte del Sistema Financiero del BCU da el resultado del ejercicio del sistema bancario
        en pesos: $ 44.246 millones en 2025 contra $ 67.597 millones en 2024, una caída de 36,8 %.
        El mismo documento registra que el tipo de cambio pasó de 44,07 pesos por dólar en diciembre
        de 2024 a 39,04 en diciembre de 2025 (-11,4 %).

        El documento no publica ese resultado en dólares ni el tipo de cambio de cada mes que
        permitiría replicar la conversión que CPA Ferrere dice usar ("el Resultado y el TC de cada
        mes"), así que la cifra en dólares (USD 1.046 millones, USD 530 millones menos que 2024) no
        se pudo cotejar contra un valor en la misma moneda del documento oficial. La caída en pesos
        (-36,8 %) es del mismo orden que la caída que implica la cifra de CPA Ferrere en dólares (de
        unos USD 1.576 millones a USD 1.046 millones, -33,6 %), una diferencia consistente con el
        efecto adicional de la apreciación del peso que registra el propio BCU.
