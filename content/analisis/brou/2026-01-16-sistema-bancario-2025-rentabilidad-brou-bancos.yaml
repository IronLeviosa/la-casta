revision:
  tier: publicado
  notas_internas: 'Editor, corrida 2026-09-07-empresas-brou (2026-09-09), resolviendo la objeción C7
    de critica.md (documento_previsible). Se descargó el Reporte del Sistema Financiero del BCU
    (RSF_IV_25.pdf) con `pnpm fuente --ocr` (era un escaneo sin capa de texto; tesseract extrajo
    175.406 caracteres en 58 páginas) y se cotejaron las cinco afirmaciones. `fecha: 2026-05-01` del
    documento es una aproximación: el PDF no declara fecha de publicación, y el propio texto
    menciona datos y decisiones de política monetaria hasta abril de 2026, así que se estima la
    publicación posterior a esa fecha; no se encontró un colofón ni una portada con fecha exacta en
    esta corrida. Tres de las cinco afirmaciones (resultado en dólares, posición en moneda
    extranjera de BROU, depósitos con participación de mercado por moneda) usan unidades o desgloses
    por entidad que este documento no publica (dólares en vez de pesos; porcentaje del activo en vez
    de porcentaje del patrimonio; participación de BROU por moneda); es posible que los "boletines
    mensuales del sistema bancario" que la propia nota de CPA Ferrere cita como fuente (un documento
    distinto de este reporte trimestral) sí las traigan, pero no se localizaron ni se abrieron en
    esta corrida. Mantengo el tier en publicado porque las cinco afirmaciones ya tienen su
    calificación con la regla dura del Veracímetro aplicada (impreciso solo con documento oficial) y
    ninguna quedó con el marcador `_faltante` sin resolver; lo que falta es una fuente más granular
    para ajustar tres "discutible" a una calificación más fina, no una fuente para pasar de "sin
    verificar" a verificado.'
