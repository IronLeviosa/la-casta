    analisis: El BCU no publica el total de depósitos en dólares ni la participación de BROU por moneda;
      sí registra que los depósitos crecieron en las dos monedas (9,2 % en moneda extranjera medido
      en dólares, 6,5 % en moneda nacional en términos reales), consistente con la dirección del +8
      % que cita CPA Ferrere para el total en dólares. El monto exacto (USD 44.963 millones) y la
      participación de BROU por moneda (45 %/55 %) no se pudieron cotejar contra este documento.
veredicto: 'De las cinco afirmaciones verificadas, dos (el ROE de BROU y de los bancos privados; la
  morosidad del sistema) quedaron en "impreciso": los números centrales coinciden con el Reporte del
  Sistema Financiero del BCU dentro de un margen de una a dos décimas de punto porcentual, que no
  cambia el sentido de lo que CPA Ferrere afirma. Las otras tres (el resultado del sistema en
  dólares, la posición en moneda extranjera de BROU y los depósitos con la participación de mercado
  por moneda) quedaron en "discutible": la dirección y el orden de magnitud son consistentes con los
  datos agregados del mismo documento oficial, pero este no publica esas cifras en dólares, ni
  desagregadas por banco, ni con la participación de mercado que usa CPA Ferrere, así que no se
  pudieron cotejar con precisión. Ninguna de las cinco fue contradicha por el documento oficial:
  donde hubo con qué comparar, el sentido y el orden de magnitud del informe se sostienen.'
