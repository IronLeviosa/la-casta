    analisis: El BCU da el resultado del sistema en pesos ($ 44.246 millones en 2025 contra $ 67.597
      millones en 2024, -36,8 %) y no publica una cifra equivalente en dólares ni el tipo de cambio
      de cada mes que exige la conversión de CPA Ferrere. La caída en pesos es del mismo orden que
      la caída implícita en la cifra de CPA Ferrere en dólares, así que la dirección y la magnitud
      aproximada del dato no están en duda; el monto preciso en dólares queda sin cotejar contra un
      documento en la misma moneda.
  - afirmacion: La posición neta en moneda extranjera de BROU (incluida la posición fuera de balance) se
      ubicó en 51 % del activo en 2025, contra 57 % el año anterior.
    fragmento: se ubica en 51% del activo en 2025 vs 57% el año anterior
    calificacion: discutible
    dato_real:
      valor: >-
        El Reporte del Sistema Financiero del BCU mide la posición en moneda extranjera del sistema
        bancario como porcentaje del patrimonio, no del activo, y solo a nivel agregado: al cierre
        de 2025 la ubica en 34,3 % del patrimonio para el conjunto de los bancos, sin desagregar por
        entidad.

        El anexo de indicadores por entidad del mismo documento desagrega activo, pasivo, patrimonio
        y rentabilidad de cada banco, pero no trae una cifra de posición en moneda extranjera de
        BROU como porcentaje del activo; la cifra que cita CPA Ferrere (51 % en 2025, 57 % en 2024)
        no se pudo cotejar contra este documento.
      fuentes:
        - url: https://bcu.gub.uy/Servicios-Financieros-SSF/Reportes%20del%20Sistema%20Financiero/RSF_IV_25.pdf
