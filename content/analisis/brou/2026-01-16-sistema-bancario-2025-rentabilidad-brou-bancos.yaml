          retrieved_at: 2026-09-09
    analisis: El Reporte del Sistema Financiero del BCU no desagrega la posición en moneda extranjera
      por banco ni la expresa como porcentaje del activo (la reporta como porcentaje del patrimonio,
      y solo a nivel agregado del sistema, 34,3 % a fines de 2025). El dato específico de BROU que
      cita CPA Ferrere no se pudo verificar con el documento oficial; queda discutible, no impreciso
      ni falso, porque no hay con qué compararlo.
  - afirmacion: La morosidad del sistema (créditos con retraso mayor a 60 días) se ubicó en 1,7 % al
      cierre de 2025, estable respecto de 2024, con una leve mejora en BROU y un ligero deterioro en
      los bancos privados.
    fragmento: se ubicó en 1,7%, manteniéndose estable respecto al año anterior
    calificacion: impreciso
    dato_real:
      valor: >-
        El Reporte del Sistema Financiero del BCU da la morosidad total del sector no financiero
        (créditos con más de 60 días de atraso) en 1,68 % a diciembre de 2025, contra 1,61 % a
        diciembre de 2024; el propio reporte describe ese movimiento como una suba leve, no como una
        situación estable.

        El 1,7 % que cita CPA Ferrere redondea el 1,68 % oficial. El anexo de indicadores por
        entidad no desagrega la morosidad por banco, así que la comparación puntual entre la mejora
        de BROU y el deterioro de los bancos privados que agrega CPA Ferrere no se pudo cotejar.
      fuentes:
        - url: https://bcu.gub.uy/Servicios-Financieros-SSF/Reportes%20del%20Sistema%20Financiero/RSF_IV_25.pdf
          medio: bcu
          fecha: 2026-05-01
          tipo: documento_oficial
          titulo: Reporte del Sistema Financiero, año 2025 (BCU) - morosidad del sector no financiero
          cita: |-
            El indicador de morosidad total del SNF subió le-
            vemente en diciembre 2025, llegando a 1,68 %, por en-
            cima del 1,61 % registrado a diciembre 2024.
          retrieved_at: 2026-09-09
    analisis: El 1,7 % que cita CPA Ferrere redondea el 1,68 % que da el BCU para diciembre de 2025
      (1,61 % en 2024); la diferencia es de 0,07 puntos porcentuales, dentro del margen de un dato
      impreciso. El BCU describe el movimiento como una suba leve y no como estabilidad, una
      diferencia de caracterización menor sobre un cambio de menos de un décimo de punto; la
      comparación específica entre BROU y los bancos privados no se pudo cotejar porque el documento
      no desagrega la morosidad por entidad.
  - afirmacion: Los depósitos del sector no financiero en bancos privados más BROU totalizaron USD
      44.963 millones en diciembre de 2025 (+8 % interanual); BROU capta el 45 % de los depósitos
      del sistema en moneda extranjera y el 55 % en moneda nacional.
    fragmento: totalizaron USD 44.963 millones, lo que implica un aumento de 8%
    calificacion: discutible
    dato_real:
      valor: >-
        El Reporte del Sistema Financiero del BCU no da el total de depósitos del sector no
        financiero en dólares ni la participación de BROU por moneda. Da el total consolidado en
        pesos ($ 1.811 mil millones a diciembre de 2025, 51,5 % del PIB) y el crecimiento por moneda
        medido en su propia unidad: los depósitos en moneda extranjera crecieron 9,2 % medidos en
        dólares y los depósitos en moneda nacional crecieron 6,5 % en términos reales.

        Esas dos cifras son consistentes con la dirección del +8 % interanual que cita CPA Ferrere
        para el total en dólares, pero el documento no permite reconstruir el monto exacto (USD
        44.963 millones) ni la participación de mercado de BROU por moneda (45 % en moneda
        extranjera, 55 % en moneda nacional); esos dos datos no se pudieron cotejar contra un
        documento oficial.
