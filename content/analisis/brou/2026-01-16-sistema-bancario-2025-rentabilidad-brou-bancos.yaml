  fecha: 2026-01-16
  tipo: nota
  titulo: "Sistema bancario en 2025: desempeño, tendencias y perspectivas"
  cita: El viernes 16 de enero, el Banco Central del Uruguay (BCU) publicó los boletines mensuales del
    sistema bancario correspondientes al cierre de 2025.
  retrieved_at: 2026-09-09
resumen: El informe sostiene que la rentabilidad del sistema bancario uruguayo (BROU y los nueve
  bancos privados) cayó en 2025 tras tres años consecutivos de aumento, con el ROE y el ROA
  retrocediendo tanto en BROU como en el agregado de bancos privados, principalmente por pérdidas
  por diferencia de cambio asociadas a la apreciación del peso; el crédito y los depósitos siguieron
  creciendo y la morosidad se mantuvo estable.
metodo: El informe se construye sobre los boletines mensuales del sistema bancario que publica el
  BCU (datos disponibles hasta noviembre de 2025 para crédito) y, según su nota 2, "se considera el
  Resultado y el TC de cada mes" para expresar los resultados en dólares corrientes; para el crédito
  valora la cartera en moneda extranjera a dólares corrientes y la cartera en moneda nacional a un
  tipo de cambio constante de diciembre de 2025.
afirmaciones:
  - afirmacion: El ROE de BROU fue 16 % en 2025, contra 20,5 % del agregado de bancos privados.
    fragmento: ubicándose en 16% en el BROU y en 20,5% en agregado de BP
    calificacion: impreciso
    dato_real:
      valor: >-
        El Reporte del Sistema Financiero del Banco Central del Uruguay (BCU), con datos a diciembre
        de 2025, da un retorno sobre patrimonio (ROE) de 16,0 % para BROU y de 20,4 % para el
        conjunto de los bancos privados, en su cuadro "Resultado (millones de pesos) y rentabilidad"
        del anexo de indicadores por entidad.

        El dato de BROU coincide exacto con el 16 % que cita CPA Ferrere. El del agregado de bancos
        privados difiere en 0,1 punto porcentual (20,4 % oficial contra 20,5 % citado), una
        diferencia menor al margen de un dato "impreciso" y que no cambia el sentido de la
        comparación: la rentabilidad de BROU fue varios puntos menor que la de la banca privada en
        2025.
      fuentes:
