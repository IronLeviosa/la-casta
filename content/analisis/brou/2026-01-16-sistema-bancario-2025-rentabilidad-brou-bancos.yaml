titulo: "Sistema bancario en 2025: la rentabilidad de BROU y de los bancos privados, según CPA Ferrere"
empresa: brou
autor: CPA Ferrere
autor_es: CPA Ferrere es una firma privada de auditoría y consultoría con sede en Montevideo; el
  informe está publicado en su sitio institucional bajo la sección "Novedades" y firmado por la
  firma, sin vínculo declarado con un partido político o el Estado uruguayo (dato tomado de la
  propia publicación, que no declara otra cosa).
fecha: 2026-01-16
