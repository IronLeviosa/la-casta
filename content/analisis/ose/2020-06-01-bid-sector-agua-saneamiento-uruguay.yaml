  - afirmacion: Según el BID, en Uruguay la tarifa de agua y saneamiento representa un 4% de los
      ingresos del hogar del primer quintil de la población, para un consumo de agua potable de 15
      m3, por debajo del umbral de asequibilidad de 5% que cita el propio documento.
    fragmento: la tarifa de agua y saneamiento corresponde a un 4 % de los ingresos del hogar del primer
      quintil de la población
    calificacion: discutible
    dato_real:
      valor: 'El propio documento del BID atribuye el umbral de referencia a un estudio de 2006: "el gasto
        familiar en estos servicios no debe superar un determinado porcentaje del ingreso del hogar,
        hasta un 5 % (Komives, Foster, Halpern, & Wodon, 2006)", y agrega el criterio más estricto
        del PNUD ("no supere un 3 % de los ingresos"). El dato específico de Uruguay (4% del ingreso
        del primer quintil) proviene de un "adelanto de resultados del estudio de asequibilidad en
        materia de agua y saneamiento en países de América Latina y el Caribe que el BID se
        encuentra realizando" (nota al pie 91 del propio documento), sin publicación separada
        localizada en esta corrida. No se encontró un documento oficial uruguayo (INE, MIDES) con un
        indicador de asequibilidad comparable para contrastar esta cifra.'
      fuentes:
        - url: https://publications.iadb.org/publications/spanish/document/El-estado-del-sector-agua-saneamiento-y-residuos-solidos-en-Uruguay-Diagnostico-y-perspectivas.pdf
          medio: bid
          fecha: 2020-06-01
          tipo: documento_oficial
          titulo: El estado del Sector Agua, Saneamiento y Residuos Sólidos en Uruguay (BID, IDB-TN-1945),
            asequibilidad
          cita: Para definir el grado de asequibilidad de los servicios de agua potable y saneamiento,
            generalmente se establece que el gasto familiar en estos servicios no debe superar un
            determinado porcentaje del ingreso del hogar, hasta un 5 % (Komives, Foster, Halpern, &
            Wodon, 2006)... En lo que respecta a la asequibilidad en Uruguay91, la tarifa de agua y
            saneamiento corresponde a un 4 % de los ingresos del hogar del primer quintil de la
            población, si se considera que un hogar posee un consumo de agua potable promedio de
            aproximadamente 15 m3, sin considerar la tarifa social a la que podría llegar a aplicar
            parte de esta población.
          retrieved_at: 2026-09-08
    analisis: El dato de 4 % de los ingresos del primer quintil proviene, según la propia nota al pie
      del BID, de un "adelanto de resultados" de un estudio de asequibilidad que el Banco realiza,
      sin publicación separada localizada en esta corrida. No se encontró un documento oficial
      uruguayo (INE, MIDES) con un indicador de asequibilidad comparable para confirmar o refutar el
      dato, así que la calificación queda discutible.
veredicto: 'De las doce afirmaciones, ocho quedaron verdadero, una falso y tres discutible. Las ocho
  verdaderas —tarifa de USD 2,06/m3, gasto con tarifa social, acceso al agua y al saneamiento
  básico, agua no facturada, infraestructura y cobertura por redes— coinciden con el documento que
  el BID cita. La única falsa atribuye a "los operadores analizados" un promedio de USD 1,22/m3
  (mínimo 0,39, máximo 2,06): en Lentini (2015) esos son los promedios por país, no los de los 57
  operadores individuales (promedio USD 1,40, mínimo USD 0,17, máximo USD 2,35, en Colombia). El USD
  2,06/m3 en sí es correcto, pero es un indicador de OSE —el único operador uruguayo de la muestra—,
  no de "Uruguay" con más de un prestador, y excluye el saneamiento que cobra Montevideo. Quedan
  discutibles el gasto mensual de USD 29 (10,4 % sobre el cálculo hecho con el decreto), el ahorro
  histórico de agua 2005-2017 (reporte de sostenibilidad de OSE no localizado) y la asequibilidad
  del 4 % (estudio del BID sin publicación separada).'
