      unos USD 140 millones
    calificacion: discutible
    dato_real:
      valor: 'La bibliografía del propio documento del BID identifica la fuente citada como "OSE, 2018b"
        con su título completo: "OSE. (2018b). Reporte de sostenibilidad 2018", un documento
        previsible que OSE publica y que no se localizó ni se pudo leer en esta corrida (no está en
        su sitio actual ni se encontró una copia archivada). El pasaje del BID también omite la
        premisa que le da sentido a la serie acumulada: "A partir de 2006 se aplicaron políticas de
        reducción que permitieron modificar la tendencia" (frase inmediatamente anterior a la citada
        en este registro), es decir que el ahorro se mide contra una tendencia de crecimiento previa
