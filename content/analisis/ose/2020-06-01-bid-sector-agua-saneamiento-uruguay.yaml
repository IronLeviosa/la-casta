  - afirmacion: Según el BID, entre 2005 y 2017 OSE habría ahorrado unos 315 millones de m3 de agua
      elevada y recuperado unos 86,5 millones de m3 de agua facturada gracias a sus políticas de
      reducción de agua no facturada, lo que representa un monto aproximado de USD 140 millones.
