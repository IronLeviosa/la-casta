  - afirmacion: Según el BID, el gasto mensual de un hogar de OSE por agua y saneamiento, para un
      consumo de agua potable de 15 m3, era de USD 29 a enero de 2019; en Montevideo, donde el
      saneamiento lo cobra la Intendencia, era de USD 28.
    fragmento: corresponde a un gasto mensual de USD 29 en materia de agua y saneamiento por vivienda
    calificacion: discutible
    dato_real:
      valor: 'El Decreto N° 27/019 (fijación de tarifas de OSE, vigente desde el 1° de enero de 2019, la
        misma fecha que cita el BID) permite reconstruir la factura de un hogar residencial con
        conexión estándar (diámetro 12,5-13 mm) y 15 m3 de consumo mensual: agua ($ 225,89 hasta 10
        m3, más 5 m3 a $ 22,59 = $ 338,84 de cargo variable, más $ 200,52 de cargo fijo = $ 539,36)
        más saneamiento residencial (cargo variable = 100% del cargo variable de agua = $ 338,84,
        más $ 83,91 de cargo fijo = $ 422,75). El total es de $ 962,11 por mes. Al tipo de cambio de
        $ 36,642 por dólar que el propio documento del BID cita para el 30 de agosto de 2019, eso
        equivale a USD 26,26, un valor cercano pero no idéntico a los USD 29 que reporta el BID
        (diferencia de aproximadamente 10%). El mismo decreto trae un cargo fijo adicional de $
        62,11 por unidad y por mes que "Aplica cuando el consumo promedio mensual anualizado supere
        los 15 m3", que no necesariamente corresponde a un consumo puntual de 15 m3 como el que usa
        el BID. El decreto también aclara, para la tarifa especial (no la residencial), que esta "no
        qued[a] incluida en la exoneración del I.V.A.", lo que sugiere que la tarifa residencial sí
        está exonerada de IVA, y por lo tanto ese impuesto no explicaría la diferencia. El BID
        publica, en el mismo párrafo, la cifra equivalente para Montevideo (USD 28), calculada con
        la tarifa de saneamiento de la Intendencia sobre el mismo consumo de agua de OSE.'
