titulo: La tarifa de agua y saneamiento más cara de la región y 53 % de agua no facturada, según el
  BID (2020)
empresa: ose
tema: economia/tarifas-publicas
autor: Banco Interamericano de Desarrollo (BID), División de Agua y Saneamiento
autor_es: >-
  El documento es la Nota Técnica IDB-TN-1945 del BID, firmada por cuatro autores (Cecilia Maroñas,
  Nicolas Rezzano, Marcello Basani, Santiago Sorhuet) de la División de Agua y Saneamiento del
  Banco, publicada en junio de 2020. El propio documento aclara: "Las opiniones expresadas en esta
  publicación son de los autores y no necesariamente reflejan el punto de vista del Banco
  Interamericano de Desarrollo, de su Directorio Ejecutivo ni de los países que representa."

  El BID es un organismo financiero multilateral de desarrollo, con 26 países miembros prestatarios
  de América Latina y el Caribe; no integra el Estado uruguayo, pero Uruguay es uno de sus países
  prestatarios. Los estados financieros de OSE registran una partida patrimonial de "Aportes
  contrato BID" por $ 3.680.975, sin variación entre los ejercicios 2023 y 2024 (los dos años que
  compara la fuente consultada en esta corrida), equivalente a unos USD 83.500 al tipo de cambio de
  cierre de 2024 ($ 44,066 por dólar) que declara el propio balance de OSE: una cifra pequeña frente
  al patrimonio de la empresa (unos $ 55.000 millones en 2024).

  El "Proyecto OSE Sostenible y Eficiente", que este documento del BID cita como el programa vigente
  de reducción de agua no facturada, no lo financia el BID: se financia con el préstamo BIRF N°
  8183, del Banco Internacional de Reconstrucción y Fomento (uno de los organismos del Grupo Banco
  Mundial), por un monto de USD 42.000.000 aprobado el 16 de noviembre de 2012, según consta en el
  dictamen del Tribunal de Cuentas de la República sobre los estados financieros de ese proyecto:
  "El contrato de Prestamo IBRD 8183, entre la ADMINISTRACION DE LAS OBRAS SANITARIAS DEL ESTADO
  (OSE) y el BANCO INTERNACIONAL DE RECONSTRUCCION Y FOMENTO fue aprobado el 16 de noviembre de
  2012... por un monto total de U$S 42.000.000."
