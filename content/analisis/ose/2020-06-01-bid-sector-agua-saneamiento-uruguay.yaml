    analisis: El Decreto N° 27/019 permite reconstruir una factura de USD 26,26 para un hogar de 15 m3,
      un 10,4 % por debajo de los USD 29 que cita el BID, un margen que supera el umbral de
      imprecisión y que ningún elemento del decreto (IVA, cargo fijo adicional) explica de forma
      concluyente. Sin un documento que reproduzca la fórmula exacta del BID (fecha, componentes y
      redondeos), la diferencia queda sin resolver y la calificación es discutible.
  - afirmacion: Según el BID, la tarifa social de OSE subsidia los consumos menores a 15 m3/mes,
      cobrando entre 22% y 36% de la tarifa residencial de agua potable y entre 42% y 90% de la
      tarifa residencial de saneamiento, según el caudal considerado.
    fragmento: la tarifa final del servicio de agua potable corresponde a un valor fijo entre 22 % y 36
      % de la tarifa de agua potable residencial asociada, y la tarifa final del servicio
      saneamiento corresponde a un valor fijo entre 42 % y 90 % de la tarifa de saneamiento
      residencial
    calificacion: verdadero
    dato_real:
      valor: 'El Decreto N° 27/019 (enero de 2019) fija, para los beneficiarios de tarifa social (planes
        del MIDES, asentamientos regularizados por el MVOTMA, hogares identificados por DINAVI), un
        cargo de $ 111,44 por cargo variable y fijo de agua, y de $ 178,32 por cargo variable y fijo
        de agua y saneamiento combinados, sin importar el consumo hasta el tope de 15 m3/mes.
        Comparado con la tarifa residencial plena de agua a distintos niveles de consumo del mismo
        decreto: a 5 m3 ($ 112,92 de variable + $ 200,52 de fijo = $ 313,44), el cociente
        111,44/313,44 = 35,5%, cerca del techo de 36% que cita el BID; a 15 m3 ($ 539,36 según el
        cálculo de la afirmación anterior), el cociente 111,44/539,36 = 20,7%, cerca del piso de 22%
        que cita el BID. Para saneamiento, el rango del BID (42%-90%) se reconstruye con exactitud
        si se compara el cargo social combinado ($ 178,32, que incluye agua y saneamiento) contra la
        tarifa residencial de saneamiento sola, no contra un cargo social de saneamiento aislado: a
        15 m3 (saneamiento residencial $ 422,75, ya calculado en la afirmación anterior),
        178,32/422,75 = 42,2%, el piso del rango del BID; a 5 m3 (saneamiento residencial $ 112,92
        de variable + $ 83,91 de fijo = $ 196,83), 178,32/196,83 = 90,6%, el techo del rango del
        BID. Los dos extremos del "entre 42% y 90%" coinciden al decimal con esta lectura, hecha con
        los mismos operandos que ya usa este registro. Para Montevideo, el BID señala una
        bonificación social distinta en saneamiento: "un 35 % de descuento del cargo variable en los
        primeros 10 m3 de consumo mensual", que URSEA no detalla en el régimen tarifario general
        consultado en esta corrida.'
