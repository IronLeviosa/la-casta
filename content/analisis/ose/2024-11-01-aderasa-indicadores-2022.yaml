  - afirmacion: Según ADERASA, en 2022 OSE registró pérdidas de agua despachada del 45,30% en sus
      sistemas de transporte y distribución (Δ2021 -10%), el peor valor entre los cuatro operadores
      "Muy Grande" con dato disponible (Sedapal 31,43%, Aguas Andinas 32,23%, AySA 42,79%, OSE
      45,30%; EPM y EAAB no reportaron este indicador).
    fragmento: OSE registró uno de los mayores valores alcanzados con relación a los operadores que
      remitieron información en los dos últimos benchmarking (45.30%)
    calificacion: discutible
    dato_real:
      valor: 'El ranking del informe para el indicador ioa-09 ("Pérdidas en red en porcentaje de agua
        despachada") entre los operadores "Muy Grande" es: Sedapal 31,43% (Δ2021 +19%), Aguas
        Andinas 32,23% (Δ2021 0%), AySA 42,79% (Δ2021 -4%), OSE 45,30% (Δ2021 -10%); EPM y EAAB no
        tienen dato. OSE es, entonces, el peor valor de su clase de tamaño entre los que reportaron,
        no un valor intermedio. El benchmarking de ADERASA de 2016 (Anexo 3 del documento del BID
        del otro registro de este lote) daba, para Uruguay/OSE, un valor de 49,50% en el mismo
        indicador (ioa-09): la comparación ADERASA-ADERASA muestra una mejora de 49,50% (2016) a
        45,30% (2022). La serie de "agua no facturada" del BID (Anexo 1, otra definición) muestra en
        cambio un índice estable o en leve aumento entre 2013 (52,60%) y 2018 (53,40%): las dos
        series juntas no describen una mejora sostenida, sino una posible mejora entre 2018 y 2022
        que ninguna de las dos series documenta año a año en ese tramo.'
