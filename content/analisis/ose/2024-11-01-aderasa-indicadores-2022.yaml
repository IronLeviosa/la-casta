    fragmento: la facturación promedio por metro cúbico fue de 2.16 para OSE
    calificacion: discutible
    dato_real:
      valor: 'No se encontró, en esta corrida, un documento de OSE o de URSEA que publique una
        "facturación unitaria" en dólares para 2022; los estados financieros de OSE registran
        ingresos por venta de agua en pesos, desagregados por actividad, pero no el volumen físico
        de m3 facturados. El Observatorio de datos abiertos de OSE (catalogodatos.gub.uy) publica un
        dataset de "Facturación y consumo" con 83 recursos, incluido uno con "consumos de agua
        potable en metros cúbicos (m3), por mes, departamento y tarifa desde enero de 2017", que
        permitiría reconstruir este cociente cruzándolo con la facturación en pesos y el tipo de
        cambio del BCU; no se procesó en esta corrida por el volumen de datos involucrado. Como
        contraste independiente: el benchmarking de ADERASA 2016 (Anexo 3 del documento del BID) da,
        para Uruguay, una "Facturación unitaria de servicios de saneamiento" (no de agua potable, un
        indicador distinto) de USD 2,13/m3, un valor cercano al 2,16 de 2022.'
