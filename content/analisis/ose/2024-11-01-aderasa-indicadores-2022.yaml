    analisis: El Decreto N° 27/019 (enero de 2019, tres años antes del dato de ADERASA) da un cargo fijo
      de agua de unos USD 5,47, menor al USD 9,20 que reporta ADERASA para 2022, en la dirección
      esperable por los ajustes tarifarios y cambiarios del período, pero no es un documento con la
      misma definición ni el mismo año. Sin ese documento, la calificación queda discutible.
  - afirmacion: Según ADERASA, en 2022 el 95,19% de la población bajo responsabilidad de OSE tuvo acceso
      al agua potable, con una continuidad de 23,99 horas/día y un nivel de micromedición de 92,23%;
      entre los seis operadores "Muy Grande" de la región, OSE ocupa el cuarto lugar en cobertura de
      agua potable, detrás de Aguas Andinas, EPM y EAAB (los tres con 100%) y delante de Sedapal
      (93,77%) y AySA (78,23%).
