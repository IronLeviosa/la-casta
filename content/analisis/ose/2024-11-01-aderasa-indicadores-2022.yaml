    analisis: Los estados financieros auditados de OSE al 31 de diciembre de 2022, verificados de forma
      independiente en esta corrida, dan un cociente de pasivo total sobre patrimonio de 41,18 %
      para 2022 y 45,99 % para 2021, coincidiendo al segundo decimal con lo que reporta ADERASA para
      los dos años. Es, de las nueve afirmaciones de este registro, la única confirmada contra un
      documento propio de OSE distinto del informe de ADERASA.
  - afirmacion: Según ADERASA, en 2022 el informe da dos valores para la cobertura de alcantarillado de
      OSE, 50,60% (ficha de país) y 50,50% (tabla comparativa e indicador ies-03), sobre 1.096.330
      habitantes con acceso; en el grupo "Muy Grande", OSE queda última de seis (EPM y EAAB 100%,
      Aguas Andinas 98,92%, Sedapal 91,36%, AySA 64,35%, OSE 50,50%).
    fragmento: el 50.60% de la población bajo responsabilidad de OSE, tuvo acceso al servicio
    calificacion: discutible
    dato_real:
      valor: 'El informe reporta dos números para el mismo dato de OSE en 2022: la ficha de país da 50,60%
        ("el 50.60% de la población bajo responsabilidad de OSE, tuvo acceso al servicio"), mientras
        que la tabla "INDICADORES DE LOS OPERADORES DEL PAÍS" y el ranking del indicador ies-03 dan
        50,50%. La misma ficha de país da el dato absoluto: "1,096,330 habitantes con acceso al
        alcantarillado sanitario por los operadores que remitieron información". En el ranking "Muy
        Grande" del indicador ies-03, OSE queda última de seis: EPM 100,00% (Δ2021 +3%), EAAB
        100,00% (Δ2021 +5%), Aguas Andinas 98,92% (Δ2021 0%), Sedapal 91,36% (Δ2021 0%), AySA 64,35%
        (Δ2021 +6%), OSE 50,50% (Δ2021 +4%). El Cuadro 3 del Plan Nacional de Saneamiento
        (Ministerio de Ambiente, diciembre de 2018) da, para el interior del país (el área que sirve
        OSE en saneamiento, ya que Montevideo es responsabilidad de la Intendencia), una cobertura
        por redes de 1.083.000 de 2.124.000 habitantes: 51,0%, cercano al 50,50%-50,60% de ADERASA
        aunque de un año distinto (2018 contra 2022). El propio Anexo 1 del BID da, en cambio, un
        indicador propio de OSE de 44,39% para diciembre de 2017 ("Cobertura Saneamiento Interior
        País"): seis puntos por debajo del cálculo hecho con el Plan Nacional de Saneamiento un año
        después, dos fuentes oficiales del mismo período con una brecha no menor.'
