    analisis: El ranking del propio informe confirma que, entre los operadores "Muy Grande" con dato,
      OSE tiene el mayor valor de pérdidas de agua (45,30 %) y no un valor intermedio, pero no hay
      un documento de OSE o de URSEA para 2022 que mida el mismo indicador de forma independiente.
      La comparación con el 49,50 % que el mismo ADERASA reportó en 2016 muestra una mejora entre
      esos dos años, aunque la serie de "agua no facturada" del BID (2013-2018, otra definición) no
      muestra una mejora sostenida en ese tramo anterior; sin un documento independiente para 2022,
      la calificación es discutible.
  - afirmacion: Según ADERASA, en 2022 el informe da dos valores distintos para el tratamiento de aguas
      residuales de OSE, 88,94% (ficha de indicadores y tabla comparativa) y 88,98% (sección de
      conclusiones por país); en el grupo "Muy Grande", OSE queda tercera de cuatro con dato (Aguas
      Andinas 99,57%, Sedapal 97,04%, OSE 88,94%, AySA 62,24%).
    fragmento: el agua residual volcada al cuerpo receptor que recibió tratamiento previo de OSE fue 88.94%
    calificacion: discutible
    dato_real:
      valor: 'El propio informe trae dos cifras distintas para el mismo indicador de OSE en 2022: la ficha
        de país y la tabla comparativa (ioc-07) dan 88,94%; la sección de conclusiones por país da
        88,98%: "el 88.98% de las aguas residuales volcadas de OSE recibió tratamiento previo".
        Ninguna de las dos es un error frente a un documento externo: son dos números distintos que
        el mismo documento reporta para el mismo dato. En el ranking de "Muy Grande" para ioc-07,
        OSE (88,94%, Δ2021 0%) queda entre Sedapal (97,04%) y AySA (62,24%); Aguas Andinas encabeza
        con 99,57%, y EPM y EAAB no tienen dato. El benchmarking de ADERASA 2016 (Anexo 3 del
        documento del BID) daba, para Uruguay, una "Incidencia de tratamiento de aguas residuales"
        de 46,92%: casi el doble en seis años (2016-2022), la mejora más marcada de todo este lote
        para OSE. No se encontró, en esta corrida, un documento propio de OSE o de URSEA con este
        indicador para 2022.'
