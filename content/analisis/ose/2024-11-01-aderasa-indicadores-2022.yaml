    calificacion: verdadero
    dato_real:
      valor: 'Los estados financieros separados de OSE al 31 de diciembre de 2022 confirman esta cifra de
        forma independiente: el Estado de Situación Patrimonial (páginas escaneadas del PDF,
        extraídas por OCR en esta corrida) da un Total Pasivo de $ 20.586.189.603 y un Total Pasivo
        de $ 21.129.815.795 para 2021; la nota sobre riesgo de mercado del mismo balance, extraída
        sin OCR, da "Patrimonio (ii)" de $ 49.987.714.211 (2022) y $ 45.943.750.822 (2021), donde la
        nota aclara que "Patrimonio incluye capital, ajustes al patrimonio, reservas, resultados de
        ejercicios anteriores y resultado del ejercicio", es decir el patrimonio neto total. El
        cociente Total Pasivo sobre Patrimonio da 20.586.189.603 / 49.987.714.211 = 41,18% para 2022
        y 21.129.815.795 / 45.943.750.822 = 45,99% para 2021: los dos coinciden, al segundo decimal,
        con lo que reporta ADERASA. En el ranking "Muy Grande" del propio informe de ADERASA para
        este indicador (ief-04), OSE (41,18%, Δ2021 -10%) tiene el menor endeudamiento de su clase,
        seguida por AySA (68,84%), EAAB (75,45%), Aguas Andinas (168,46%) y Sedapal (172,62%); EPM
        no tiene dato.'
