titulo: "OSE en el benchmarking de ADERASA (2024, datos 2022): último en pérdidas de agua y en
  cobertura de alcantarillado, primero en cargo fijo"
empresa: ose
tema: economia/tarifas-publicas
autor: Grupo Regional de Trabajo de Benchmarking de ADERASA, documento elaborado por la
  Superintendencia Nacional de Servicios de Saneamiento del Perú (SUNASS)
autor_es: >-
  ADERASA (Asociación de Entes Reguladores de Agua Potable y Saneamiento de las Américas) es una
  asociación de organismos reguladores públicos del sector, formada en 2001 y constituida como
  persona jurídica en 2013, con 17 miembros asociados a esa fecha: "En el año 2013, se constituyó
  ADERASA como persona jurídica que consta de 17 miembros asociados, en la ciudad de Asunción,
  Paraguay." El informe que se analiza aquí ("Informe N° 00037-2024-SUNASS-DF") lo elaboró la
  Dirección de Fiscalización de la Superintendencia Nacional de Servicios de Saneamiento de Perú
  (SUNASS), que coordinó el Grupo Regional de Trabajo de Benchmarking de ADERASA para esta edición
  (Lima, noviembre de 2024). El documento lo elaboraron Gretelina Castañeda Sánchez, Ronald Jauregui
  Chipana y Jorge Zavaleta Quintana, lo revisó Gustavo Olivas Aranda y lo aprobó José Miguel
  Kobashikawa Maekawa, Director de la Dirección de Fiscalización.

  Los datos de Uruguay que contiene el informe (OSE) no los calculó SUNASS de forma independiente:
  el propio informe agradece, en su sección de reconocimientos, a "Sandra Rodríguez y Paula Suarez
  de la Unidad Reguladora de Servicios de Energía y Agua (URSEA), Uruguay" por su colaboración, lo
  que indica que el regulador uruguayo remitió o validó los datos de OSE usados en este
  benchmarking.
