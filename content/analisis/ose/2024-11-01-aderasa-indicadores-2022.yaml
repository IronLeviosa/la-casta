    analisis: "El informe da dos cifras distintas para 2022 (50,60 % en la ficha de país, 50,50 % en la
      tabla comparativa y el ranking), lo que ya son dos lecturas del mismo dato. El Plan Nacional
      de Saneamiento (2018) da un 51,0 % para el interior del país, cercano pero de un año distinto,
      mientras que un indicador propio de OSE en el Anexo 1 del BID da 44,39 % para 2017: dos
      fuentes oficiales del mismo período no coinciden, así que la calificación es discutible."
veredicto: 'De las nueve afirmaciones, una quedó verdadero y ocho discutible. La única confirmada es
  el endeudamiento sobre patrimonio (41,18 % en 2022, 45,99 % en 2021): los estados financieros
  auditados de OSE, verificados de forma independiente, coinciden al segundo decimal. Las ocho
  restantes —tarifas de agua y de saneamiento, cargo fijo, acceso y continuidad de agua potable,
  pérdidas de agua, tratamiento de aguas residuales, facturación unitaria y cobertura de
  alcantarillado— no tienen, en esta corrida, un documento propio de OSE o de URSEA con la misma
  definición y el mismo año; dos de ellas (tratamiento de aguas residuales y alcantarillado) traen
  además dos valores distintos dentro del propio informe. Las pérdidas de agua de OSE, 45,30 % en
  2022, son las peores de los cuatro operadores "Muy Grande" con dato pero mejoraron frente al 49,50
  % que el mismo ADERASA reportó en 2016; en tratamiento de aguas residuales, el 88,94-88,98 % de
  2022 casi duplica el 46,92 % de 2016.'
