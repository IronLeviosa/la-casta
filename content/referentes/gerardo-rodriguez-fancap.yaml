nombre: Gerardo Rodríguez
tipo: persona
alias: [Gerardo Rodríguez, Rodríguez]
descripcion: Dirigente sindical de la Federación Ancap (Fancap), el sindicato de trabajadores de
  Ancap. Las fuentes de prensa lo identifican de forma indistinta como "presidente de Fancap" (El
  País, 24/07/2020 y 14/03/2022; El Observador, 14/03/2022) o "secretario general de la Federación
  Ancap" (El País, 15/03/2022), sin que el cargo parezca cambiar entre esas fechas. Protagonizó
  cruces públicos con Luis Lacalle Pou por la asociación de la división portland de Ancap con
  privados, entre ellos uno en Minas (14/03/2022) y, según El País, otro en Paysandú (08/06/2023).
