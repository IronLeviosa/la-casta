      titulo: Ficha Asunto 33683 - Partidos Políticos. Funcionamiento. Regulación.
      cita: "Dir.Gral.Comisiones eleva. Vencimiento del plazo: 1º de mayo de 2009."
      retrieved_at: 2026-09-05
analisis: El Poder Ejecutivo observó dos disposiciones de la ley de partidos políticos. No hay
  registro de una votación de la Asamblea General; el plazo constitucional venció y la ley se
  promulgó pocos días después, un patrón compatible con la aceptación tácita de otros vetos del
  mismo mandato (INAM, Fondo lechera), aunque en este caso la ficha no usa la fórmula explícita.
