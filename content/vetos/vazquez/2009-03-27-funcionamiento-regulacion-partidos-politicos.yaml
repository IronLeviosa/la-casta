alcance: parcial
articulos_observados:
  - 7 numeral 2
  - "40"
fundamento: El Poder Ejecutivo observó el artículo 7, numeral 2, y el artículo 40 del proyecto de
  ley de funcionamiento y regulación de los partidos políticos. El texto del mensaje de
  observaciones con los fundamentos no se ubicó en esta corrida.
resultado:
  estado: observaciones_aceptadas
  fecha: 2009-05-01
  detalle: 'La ficha de trámite no usa la fórmula estándar "Veto aceptado tácitamente...", pero
    registra que la Comisión de Constitución y Legislación de la Asamblea General elevó el asunto el
    29-04-2009 señalando "Vencimiento del plazo: 1° de mayo de 2009", sin que conste una votación
    posterior, y el Poder Ejecutivo promulgó la ley el 11-05-2009 como Ley 18.485. Es compatible con
    la aceptación tácita por vencimiento del plazo constitucional (artículo 139), aunque la ficha no
    lo etiqueta con esas palabras exactas.'
