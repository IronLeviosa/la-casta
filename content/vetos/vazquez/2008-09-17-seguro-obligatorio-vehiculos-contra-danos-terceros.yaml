analisis: El Poder Ejecutivo observó el artículo 21 de la ley de seguro obligatorio de vehículos y
  propuso un texto alternativo. A diferencia de otros vetos del mandato, la ficha de trámite del
  Parlamento no deja constancia de cómo se resolvió la observación antes de la promulgación. Es un
  hueco documentado, no una omisión de esta investigación (ver notas.md, hipótesis).
