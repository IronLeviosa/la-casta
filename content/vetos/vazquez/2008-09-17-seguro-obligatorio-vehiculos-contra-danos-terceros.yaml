politico: vazquez
tema: seguridad
titulo: Seguro obligatorio de vehículos contra daños a terceros
numero_ley: "18.412"
fecha: 2008-09-17
alcance: parcial
articulos_observados:
  - "21"
fundamento: El Poder Ejecutivo observó el artículo 21 del proyecto de ley que dispuso la
  obligatoriedad de un seguro de responsabilidad civil por daños a terceros en accidentes de
  tránsito, y acompañó su observación con un texto sustitutivo para ese artículo. El texto del
  mensaje de observaciones con los fundamentos no se ubicó en esta corrida.
resultado:
  estado: sin_datos
  detalle: 'La ficha de trámite del Parlamento no registra una resolución explícita de la Asamblea
    General (ni "levanta veto", ni "no levanta veto", ni aceptación tácita): solo indica que la
    comisión de Constitución y Legislación recibió y elevó el asunto (06-11-2008) antes de que el
    Poder Ejecutivo promulgara la ley el 17-11-2008 como Ley 18.412. No se pudo determinar con las
    fuentes consultadas si el artículo 21 promulgado corresponde al texto original sancionado por
    ambas Cámaras o al texto sustitutivo que había propuesto el Poder Ejecutivo.'
