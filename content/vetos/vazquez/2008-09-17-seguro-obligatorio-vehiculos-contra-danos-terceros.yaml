revision:
  tier: probable
  que_falta: Todavía no se sabe si el texto sustitutivo que el Poder Ejecutivo propuso para el
    artículo 21 quedó vigente o si rigió el texto que habían votado ambas Cámaras, porque el trámite
    parlamentario no registra ninguna resolución sobre la observación; falta comparar ese artículo
    en la ley promulgada contra las dos versiones que estaban en juego.
  notas_internas: Tres registros de este lote (Discapacitados, Importaciones y este) comparten el
    mismo vacío documental, confirmado de nuevo por el crítico contra la ficha primaria. Acá el
    camino de cierre es más directo que en los otros dos porque el Ejecutivo propuso un texto
    sustitutivo puntual; ver notas.md, hipótesis.
