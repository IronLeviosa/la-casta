politico: vazquez
tema: economia/empleo
titulo: Condiciones de ingreso de personas con discapacidad a organismos del Estado
numero_ley: "18.094"
fecha: 2006-10-20
alcance: parcial
articulos_observados:
  - sin identificar en las fuentes consultadas
fundamento: |-
  El Poder Ejecutivo observó en forma parcial el proyecto de ley que modificaba las condiciones de
  ingreso de personas con discapacidad a organismos del Estado. El artículo observado puntualmente y
  el texto del mensaje de observaciones no se ubicaron en esta corrida.
resultado:
  estado: sin_datos
  detalle: >-
    La ficha de trámite del Parlamento no registra ninguna sesión ni resolución de la Asamblea
    General

    entre la entrada del asunto (31-10-2006) y la promulgación de la ley (09-01-2007): no hay línea
    de

    "Asamblea General levanta veto", "no levanta veto" ni "aceptado tácitamente", a diferencia de
    otros

    vetos del mismo mandato que sí las registran. No se pudo determinar con las fuentes consultadas
    si

    las observaciones fueron aceptadas por vencimiento del plazo constitucional (artículo 139) o por
    otro

    mecanismo, ni si el texto promulgado incorpora o no la observación del Poder Ejecutivo.
  fuentes:
    - url: https://parlamento.gub.uy/documentosyleyes/ficha-asunto/28459/ficha_completa
      medio: parlamento
      fecha: 2007-01-09
      tipo: documento_oficial
      titulo: Ficha Asunto 28459 - Personas con discapacidad. Ingreso a organismos del Estado. Condiciones.
      cita: "09-01-2007 Poder Ejecutivo promulga. Ley Nro: 18094"
      retrieved_at: 2026-09-05
analisis: >-
  El Poder Ejecutivo observó parcialmente este proyecto, pero a diferencia de los demás vetos del

  mandato, la ficha de trámite del Parlamento no deja constancia de cómo se resolvió: no hay sesión
  de

  la Asamblea General registrada entre la entrada del asunto y la promulgación de la ley. Es un
  hueco

  documentado, no una omisión de esta investigación (ver notas.md, hipótesis).
evidencia:
  nivel: textual
  fuentes:
