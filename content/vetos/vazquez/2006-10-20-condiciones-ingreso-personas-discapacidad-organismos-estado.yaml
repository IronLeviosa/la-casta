revision:
  tier: probable
  que_falta: Todavía no se sabe si la observación del Poder Ejecutivo quedó incorporada a la ley o no,
    porque el trámite parlamentario no registra ninguna votación ni una aceptación por vencimiento
    de plazo; falta comparar, artículo por artículo, el texto que finalmente se promulgó contra el
    texto que el Parlamento había aprobado antes del veto.
  notas_internas: Tres registros de este lote (este, Importaciones y Vehículos) comparten el mismo
    vacío documental, confirmado de nuevo por el crítico contra la ficha primaria. No es falta de
    búsqueda de esta corrida; ver notas.md, hipótesis.
