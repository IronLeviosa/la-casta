analisis: "El Poder Ejecutivo observó en su totalidad los capítulos del proyecto de salud sexual y
  reproductiva que habilitaban la interrupción voluntaria del embarazo, aprobado por una iniciativa
  impulsada por la propia bancada oficialista del Frente Amplio. La Asamblea General no levantó el
  veto y la ley se promulgó sin esos artículos, de forma que Uruguay no despenalizó el aborto en
  este período; el proyecto volvió a aprobarse, ya sin observaciones del entonces presidente José
  Mujica, en 2012. La decisión generó un conflicto dentro del propio gabinete: la resolución del
  veto se firmó solo con la rúbrica de la ministra de Salud Pública, María Julia Muñoz, después de
  que otros ministros se negaran a firmarla, y el Partido Socialista, del que Vázquez era afiliado,
  cuestionó públicamente el veto tras conocerse la resolución. Cobertura de prensa contemporánea a
  la sesión que resolvió no levantar el veto (180.com.uy, 21-11-2008) describe que, dentro de la
  bancada del Frente Amplio, solo los legisladores Víctor Semproni y Juan Andrés Roballo se
  pronunciaron por mantenerlo, mientras que Luis Alberto Heber (Partido Nacional) y Philippe Sauval
  (suplente del Partido Independiente) argumentaron coincidir con los fundamentos del Poder
  Ejecutivo para no levantarlo; el resultado de la votación no cambia por este dato, pero la nota
  describe una alineación que cruza los partidos y no una división estricta entre gobierno y
  oposición. No se tiene, de esta o de otra fuente consultada en esta corrida, el detalle del
  recuento numérico de esa votación (ver resultado)."
