politico: vazquez
tema: economia/impuestos
titulo: Devolución de impuestos en importaciones y modificación de la tasa consular
numero_ley: "18.301"
fecha: 2008-04-17
alcance: parcial
articulos_observados:
  - sin identificar en las fuentes consultadas
fundamento: El Poder Ejecutivo observó en forma parcial el proyecto de ley que modificaba el régimen
  de devolución de impuestos en importaciones y la tasa consular. El artículo observado puntualmente
  y el texto del mensaje de observaciones no se ubicaron en esta corrida.
resultado:
  estado: sin_datos
  detalle: 'La ficha de trámite del Parlamento registra que la comisión de Hacienda y Presupuesto de
    la Asamblea General recibió a representantes de la Cámara Nacional de Comercio y Servicios y a
    un economista del Ministerio de Economía y Finanzas (mayo de 2008), pero no deja constancia de
    una votación ni de una resolución explícita de aceptación o rechazo de la observación: pasa
    directamente de esas audiencias a "Poder Ejecutivo promulga" el 03-06-2008. No se pudo
    determinar con las fuentes consultadas el mecanismo exacto de resolución.'
