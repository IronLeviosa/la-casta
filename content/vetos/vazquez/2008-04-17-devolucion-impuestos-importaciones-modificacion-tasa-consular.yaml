analisis: El Poder Ejecutivo observó parcialmente este proyecto sobre comercio exterior. La comisión
  de la Asamblea General escuchó a la Cámara Nacional de Comercio y Servicios y al Ministerio de
  Economía y Finanzas antes de que la ley se promulgara, pero la ficha no registra qué se resolvió
  sobre la observación en sí.
