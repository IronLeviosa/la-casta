fundamento: El Poder Ejecutivo observó en forma parcial el proyecto de ley de protección de datos
  personales y acción de habeas data. El artículo observado puntualmente y el texto del mensaje de
  observaciones no se ubicaron en esta corrida.
resultado:
  estado: observaciones_aceptadas
  fecha: 2008-08-06
  detalle: La Asamblea General, en sesión ordinaria n.° 7 del 06-08-2008 (Diario 48), resolvió, "por
    una mayoría superior a la exigida por el artículo 138 de la Constitución de la República",
    aceptar la observación formulada por el Poder Ejecutivo, el mismo día en que el asunto pasó a
    comisión. La ley se promulgó el 11-08-2008 como Ley 18.331.
