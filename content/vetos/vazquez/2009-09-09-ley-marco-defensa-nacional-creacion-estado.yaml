analisis: "Este es, de los once vetos identificados en el mandato, el único que la Asamblea General
  revirtió: el Frente Amplio y el Partido Nacional acordaron levantar la observación del Poder
  Ejecutivo a la jerarquía del Jefe de Estado Mayor de la Defensa, y votaron unánimemente en ese
  sentido apenas diez días antes del fin del mandato de Vázquez. El senador Rosadilla y el diputado
  Bayardi, del oficialismo, y el diputado García, del Partido Nacional, explicaron en sala que el
  punto observado había sido uno de los argumentos centrales por los que ambos partidos habían
  votado la ley originalmente."
