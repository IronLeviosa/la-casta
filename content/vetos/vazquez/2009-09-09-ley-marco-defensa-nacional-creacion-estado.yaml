politico: vazquez
tema: seguridad
titulo: Ley Marco de Defensa Nacional (creación del Estado Mayor de la Defensa)
numero_ley: "18.650"
fecha: 2009-09-09
alcance: parcial
articulos_observados:
  - "16"
fundamento: El Poder Ejecutivo observó parcialmente el artículo 16, literal C), incisos e) a h), del
  proyecto de Ley Marco de Defensa Nacional, por entender inconveniente modificar la estructura de
  mando de las Fuerzas Armadas al establecer que el cargo de Jefe de Estado Mayor de la Defensa
  tuviera la misma jerarquía que los Comandantes en Jefe de cada fuerza.
resultado:
  estado: veto_levantado
  fecha: 2010-02-09
  detalle: "En sesión extraordinaria de la Asamblea General del 09-02-2010 (Diario 66), con acuerdo
    entre el Frente Amplio y el Partido Nacional, se votó nominalmente el levantamiento del veto:
    votaron 51 representantes y 23 senadores, todos por la negativa, que la Presidencia había
    aclarado de antemano que equivalía a votar por el levantamiento del veto. Al reunirse la mayoría
    exigida por la Constitución, quedó levantado el veto y firme el proyecto de ley tal como lo
    habían sancionado ambas Cámaras. La ley se promulgó el 19-02-2010 como Ley 18.650, con el texto
    original y no con la redacción alternativa que había propuesto el Poder Ejecutivo."
