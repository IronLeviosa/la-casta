analisis: "El Poder Ejecutivo observó parcialmente la ley de creación del INAM. Al igual que en el
  veto al Fondo lechera, no hubo votación de la Asamblea General: el plazo constitucional venció y
  las observaciones quedaron aceptadas tácitamente."
