fundamento: El Poder Ejecutivo observó en forma parcial el proyecto de ley que creaba el Instituto
  Nacional del Adulto Mayor (INAM). El artículo observado puntualmente y el texto del mensaje de
  observaciones no se ubicaron públicamente.
resultado:
  estado: observaciones_aceptadas
  fecha: 2009-10-14
  detalle: La Asamblea General dio entrada al asunto y lo pasó a comisión en su sesión del 15-09-2009,
    sin llegar a votarlo. La ficha de trámite del Parlamento registra que, el 14-10-2009, el "Veto
    [fue] aceptado tácitamente por vencimiento de plazo constitucional", y el mismo día se archivó
    el asunto. La ley se promulgó el 23-10-2009 como Ley 18.617.
