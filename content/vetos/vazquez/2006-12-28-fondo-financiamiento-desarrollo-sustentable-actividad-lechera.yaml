      titulo: Ficha Asunto 30748 - Fondo de Financiamiento y Desarrollo Sustentable de la Actividad
        Lechera. Creación.
      cita: Veto aceptado tácitamente por vencimiento de plazo constitucional.
      retrieved_at: 2026-09-05
analisis: |-
  El Poder Ejecutivo observó parcialmente este proyecto sobre financiamiento del sector lechero. A
  diferencia de otros vetos del mandato, no hubo una votación de la Asamblea General: el plazo
  constitucional de treinta días venció sin que el asunto volviera a votarse, y las observaciones
  quedaron aceptadas tácitamente por ese mecanismo.
