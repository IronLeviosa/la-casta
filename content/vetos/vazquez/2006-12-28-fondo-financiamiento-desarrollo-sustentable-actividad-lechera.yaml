politico: vazquez
tema: economia
titulo: Fondo de Financiamiento y Desarrollo Sustentable de la Actividad Lechera
numero_ley: "18.100"
fecha: 2006-12-28
alcance: parcial
articulos_observados:
  - sin identificar en las fuentes consultadas
fundamento: >-
  El Poder Ejecutivo observó en forma parcial el proyecto de ley que creaba un fondo de
  financiamiento

  y desarrollo sustentable para la actividad lechera. El artículo observado puntualmente y el texto
  del

  mensaje de observaciones no se ubicaron en esta corrida.
resultado:
  estado: observaciones_aceptadas
  fecha: 2007-02-12
  detalle: >-
    La Asamblea General dio entrada al asunto y lo pasó a comisión en su sesión extraordinaria del

    10-01-2007 (Diario 27), sin llegar a votarlo. La ficha de trámite del Parlamento registra que,
    el

    12-02-2007, el "Veto [fue] aceptado tácitamente por vencimiento de plazo constitucional"
    (artículo

    139 de la Constitución), sin que hubiera una votación posterior. La ley se promulgó el
    23-02-2007

    como Ley 18.100.
