politico: vazquez
tema: relaciones-exteriores
titulo: Embarcaciones deportivas de bandera extranjera en aguas jurisdiccionales, puertos o lugares
  de la República
numero_ley: "18.007"
fecha: 2006-08-14
alcance: parcial
articulos_observados:
  - último artículo del proyecto (numeración no consignada en las fuentes consultadas)
fundamento: >-
  El Poder Ejecutivo observó el último artículo del proyecto de ley sobre permanencia y circulación

  de embarcaciones deportivas de bandera extranjera en aguas jurisdiccionales, puertos o lugares de
  la

  República. El texto del mensaje de observaciones con los fundamentos del Poder Ejecutivo no se
  ubicó

  en esta corrida.
resultado:
  estado: observaciones_aceptadas
  fecha: 2006-08-22
  detalle: >-
    La Asamblea General, en sesión extraordinaria n.° 7 del 22-08-2006 (Diario 23), resolvió aceptar
    la

    observación interpuesta por el Poder Ejecutivo, con 75 votos a favor en 78 presentes. La ficha
    de

    trámite del Parlamento etiqueta este trámite como "Asamblea General levanta veto", pero el texto
    de

    la propia ficha aclara que la Asamblea "acepta la observación interpuesta", es decir que el veto
    no

    fue revertido. La ley se promulgó el 28-08-2006 como Ley 18.007.
