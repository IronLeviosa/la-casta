      cita: Asamblea General acepta la observacion interpuesta por el Poder Ejecutivo al último artículo
        del proyecto de ley. Se vota afirmativamente (75 en 78).
      retrieved_at: 2026-09-05
analisis: >-
  El Poder Ejecutivo observó el artículo final de un proyecto sobre embarcaciones deportivas de

  bandera extranjera. La Asamblea General, por amplia mayoría, resolvió aceptar la observación en

  lugar de rechazarla, y la ley se promulgó con el texto que resultó de aceptar esa observación. No
  se

  encontraron declaraciones públicas de Vázquez sobre este veto en particular.
