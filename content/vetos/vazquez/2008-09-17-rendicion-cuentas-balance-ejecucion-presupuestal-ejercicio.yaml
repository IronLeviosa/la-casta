fundamento: El Poder Ejecutivo observó los artículos 241 y 253 del proyecto de Rendición de Cuentas
  y Balance de Ejecución Presupuestal del ejercicio 2007. El texto del mensaje de observaciones con
  los fundamentos del Poder Ejecutivo no se ubicó en esta corrida.
