analisis: El Poder Ejecutivo observó dos artículos de la Rendición de Cuentas 2007. La Asamblea
  General, por amplia mayoría, resolvió aprobar esos vetos (es decir, no levantarlos), y la ley se
  promulgó sin el texto original de esos dos artículos.
