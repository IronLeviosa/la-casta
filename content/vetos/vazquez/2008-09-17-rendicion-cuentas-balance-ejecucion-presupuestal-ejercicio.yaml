  estado: observaciones_aceptadas
  fecha: 2008-09-30
  detalle: La Asamblea General, en sesión ordinaria n.° 12 del 30-09-2008 (Diario 53), resolvió
    "aprobar los vetos interpuestos por el Poder Ejecutivo", con 85 votos a favor en 92 presentes.
    La ley se promulgó el 06-10-2008 como Ley 18.362.
