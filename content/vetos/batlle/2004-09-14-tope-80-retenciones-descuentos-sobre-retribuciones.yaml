politico: batlle
tema: economia/empleo
titulo: Tope del 80% a retenciones y descuentos sobre retribuciones salariales y pasividades
numero_ley: "17.829"
fecha: 2004-09-14
alcance: parcial
articulos_observados:
  - "1"
fundamento: El Poder Ejecutivo remitió, de conformidad con el artículo 137 de la Constitución, un
  mensaje de observaciones parciales al proyecto que fijaba en 80% el tope de retenciones o
  descuentos sobre retribuciones salariales o pasividades; el debate registra que el Poder Ejecutivo
  proponía elevar del 20% al 30% el monto mínimo que debía percibir el trabajador luego de los
  descuentos.
