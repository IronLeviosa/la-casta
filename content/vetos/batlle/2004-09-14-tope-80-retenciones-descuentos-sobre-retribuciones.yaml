analisis: El Poder Ejecutivo observó parcialmente un proyecto sobre el tope de retenciones a
  salarios y pasividades, proponiendo un mecanismo distinto de protección del ingreso mínimo del
  trabajador tras los descuentos. La Asamblea General aceptó las observaciones el mismo día en que
  fueron comunicadas y la ley se promulgó pocos días después. No se encontró declaración pública de
  Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
