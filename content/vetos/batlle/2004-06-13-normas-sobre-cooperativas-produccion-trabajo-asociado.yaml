fundamento: El Poder Ejecutivo remitió observaciones parciales y, en la propia sesión de la Asamblea
  General, un texto complementario acordado con el Ministerio de Trabajo y Seguridad Social y con
  las entidades más representativas del cooperativismo; el mensaje complementario retomaba
  sustancialmente el proyecto original que ya contaba con el apoyo del sector.
