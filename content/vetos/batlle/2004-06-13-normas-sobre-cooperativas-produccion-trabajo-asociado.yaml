analisis: El Poder Ejecutivo observó parcialmente un proyecto sobre cooperativas de producción o
  trabajo asociado y, a diferencia de otros vetos del período, negoció con las entidades del sector
  un texto complementario que fue el que la Asamblea General terminó aprobando junto con las
  observaciones. La ley se promulgó pocos días después. No se encontró declaración pública de Batlle
  sobre este veto puntual más allá del mensaje de observaciones firmado.
