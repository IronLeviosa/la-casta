  detalle: La Asamblea General, tras un cuarto intermedio el 13-07-2004 a la espera del mensaje
    complementario del Poder Ejecutivo, resolvió aceptar las observaciones interpuestas y aprobar el
    Mensaje complementario enviado por el Poder Ejecutivo. La ley se promulgó el 22-07-2004 como Ley
    17.794.
