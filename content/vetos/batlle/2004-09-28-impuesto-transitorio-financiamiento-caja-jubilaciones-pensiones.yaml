analisis: El Poder Ejecutivo vetó en su totalidad un proyecto que creaba un impuesto transitorio a
  las jubilaciones y pensiones de la Caja Bancaria, junto con un aumento de aportes patronales, para
  sostener financieramente al organismo hasta 2010. La Asamblea General reunió los márgenes
  constitucionales para rechazar la observación y la ley se promulgó diez días después. El texto
  formal de la observación del Poder Ejecutivo no se encontró reproducido en el diario de sesiones
  consultado (solo la referencia al Repartido correspondiente), por lo que el fundamento arriba
  descrito se apoya en lo que los propios legisladores debatieron sobre su contenido, no en una cita
  directa del mensaje. No se encontró declaración pública de Batlle sobre este veto puntual.
