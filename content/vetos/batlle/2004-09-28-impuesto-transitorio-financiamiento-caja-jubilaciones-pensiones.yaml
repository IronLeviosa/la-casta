politico: batlle
tema: economia/empleo
titulo: Impuesto transitorio para el financiamiento de la Caja de Jubilaciones y Pensiones Bancarias
numero_ley: "17.841"
fecha: 2004-09-28
alcance: total
fundamento: 'El diario de sesiones consultado no reproduce el texto íntegro del mensaje de
  observaciones (solo remite a "Antecedentes: Repartido N.o 28, de 2004"); del debate en la Asamblea
  General surge que la observación cuestionaba la creación de un impuesto transitorio a cargo de los
  propios jubilados y pensionistas bancarios, junto con un aumento de 4,5% en los aportes
  patronales, para dar viabilidad económica a la Caja Bancaria hasta 2010.'
resultado:
  estado: veto_levantado
  fecha: 2004-10-05
  detalle: "La Asamblea General, en votación nominal el 05-10-2004, resolvió levantar las
    observaciones: el Senado registró 2 votos afirmativos (por respaldar al Poder Ejecutivo) y 22
    negativos en 24 sufragantes, y Diputados 13 afirmativos y 67 negativos en 80 sufragantes,
    alcanzando en ambos casos los márgenes constitucionales. La ley se promulgó el 15-10-2004 como
    Ley 17.841."
