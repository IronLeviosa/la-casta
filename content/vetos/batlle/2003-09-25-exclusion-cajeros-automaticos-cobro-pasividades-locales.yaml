analisis: El Poder Ejecutivo vetó en su totalidad un proyecto que excluía la instalación de cajeros
  automáticos para el pago de pasividades en los locales propios del Banco de Previsión Social, por
  entender que esa regulación invadía la autonomía administrativa del ente y limitaba sin razón
  suficiente el uso de un adelanto tecnológico. La Asamblea General reunió los tres quintos en ambas
  cámaras para rechazar las observaciones y la ley se promulgó. No se encontró declaración pública
  de Batlle sobre este veto puntual más allá del mensaje de observaciones firmado.
