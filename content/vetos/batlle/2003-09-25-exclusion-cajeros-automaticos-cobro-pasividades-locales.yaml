titulo: Exclusión de cajeros automáticos para el cobro de pasividades en locales propios del BPS
numero_ley: "17.710"
fecha: 2003-09-25
alcance: total
fundamento: 'El Poder Ejecutivo observó el proyecto por razones de constitucionalidad y de
  conveniencia: entendió que regular el sistema de pago de las prestaciones del Banco de Previsión
  Social es materia administrativa privativa del propio ente (principio de "especialización del
  Ente"), y que la norma impedía el uso de un adelanto tecnológico sin razón suficiente.'
