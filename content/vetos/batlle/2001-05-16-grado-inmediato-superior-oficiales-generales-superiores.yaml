politico: batlle
tema: economia/empleo
titulo: Grado inmediato superior a Oficiales Generales y Superiores en retiro (Capítulo II de la Ley
  15.848)
numero_ley: "17.358"
fecha: 2001-05-16
alcance: total
fundamento: "El Poder Ejecutivo se opuso al proyecto por entender que no se daba ninguno de los
  presupuestos que la normativa militar exige para ascender a un oficial retirado: no existía
  iniciativa del Poder Ejecutivo para el ascenso (artículo 168 numeral 11 de la Constitución) ni se
  cumplían los requisitos del sistema de ascenso por antigüedad, selección o concurso aplicable al
  grado (Decreto-Ley N.o 14.157, artículos 130 y 133); los oficiales a ascender no estaban en
  actividad ni había movilización de las Fuerzas Armadas -la única circunstancia que habilita el
  ascenso de un retirado-, por lo que tampoco habían sido reincorporados (artículos 185, 187 y 188
  del mismo Decreto-Ley). El mensaje encuadra además esta objeción dentro de la fórmula genérica de
  razones constitucionales, legales, instrumentales y de conveniencia."
resultado:
  estado: veto_levantado
  fecha: 2001-06-13
  detalle: "La Asamblea General, en votación nominal el 13-06-2001, resolvió levantar las
    observaciones: el Senado obtuvo 11 votos afirmativos (por respaldar al Poder Ejecutivo) y 20
    negativos en 31 sufragantes, superando los 19 votos (tres quintos) requeridos; Diputados
    registró 32 afirmativos y 63 negativos en 95 sufragantes, superando los 57 requeridos. Quedaron
    levantadas las observaciones y la ley se promulgó el 22-06-2001 como Ley 17.358."
  fuentes:
    - url: https://infolegislativa.parlamento.gub.uy/temporales/6618078.PDF
      medio: parlamento
      fecha: 2001-06-13
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Asamblea General N.o 18, Tomo 80 (13 de junio de 2001)
      cita: Se obtuvieron 31 votos en quórum máximo. De los 31 votos, 11 sufragaron por la afirmativa y 20
        lo hicieron por la negativa. En consecuencia, se obtuvieron los tres quintos del total de
        31, al superarse los 19 votos requeridos.
      retrieved_at: 2026-09-05
      verificacion: manual
analisis: "El Poder Ejecutivo vetó en su totalidad un proyecto que otorgaba el ascenso al grado
  inmediato superior, en situación de retiro, a los oficiales generales y superiores comprendidos en
  el capítulo II de la Ley de Caducidad (Ley 15.848), por entender que no se cumplía ninguno de los
  presupuestos legales para el ascenso de militares retirados: faltaba la iniciativa del Poder
  Ejecutivo y los requisitos del sistema de ascenso del Decreto-Ley 14.157, y los oficiales no
  estaban en actividad ni reincorporados. La Asamblea General reunió los tres quintos en ambas
  cámaras para rechazar las observaciones y la ley se promulgó pocos días después. No se encontró
  declaración pública de Batlle sobre este veto puntual más allá del mensaje de observaciones que
  firmó."
