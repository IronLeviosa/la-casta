      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Asamblea General N.o 60, Tomo 82 (20 de enero de 2004)
      cita: artículo 139 de la Constitución sin que la Asamblea General se pronunciara sobre las
        observaciones interpuestas por el Poder Ejecutivo al proyecto de ley que modifica el régimen
        de jubilaciones y pensiones de la Caja de Jubilaciones y Pensiones de Profesionales
        Universitarios.
      retrieved_at: 2026-09-05
