analisis: El Poder Ejecutivo vetó parcialmente (un solo artículo) un proyecto que modificaba el
  régimen previsional de la Caja de Profesionales Universitarios, por entender que excedía la
  iniciativa legislativa permitida en materia de beneficios jubilatorios. A diferencia de otros
  vetos de este período, ninguna de las cámaras rechazó expresamente la observación dentro del
  plazo, por lo que quedó tácitamente aceptada por aplicación directa del artículo 139 de la
  Constitución, mecanismo que la propia Asamblea General dejó consignado en su sesión. No se
  encontró declaración pública de Batlle sobre este veto puntual más allá del mensaje de
  observaciones firmado.
