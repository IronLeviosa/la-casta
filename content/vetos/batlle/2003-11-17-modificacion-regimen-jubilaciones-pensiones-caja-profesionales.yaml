politico: batlle
tema: economia/empleo
titulo: Modificación del régimen de jubilaciones y pensiones de la Caja de Profesionales
  Universitarios (artículo 43)
numero_ley: "17.738"
fecha: 2003-11-17
alcance: parcial
articulos_observados:
  - "43"
fundamento: El Poder Ejecutivo observó únicamente el artículo 43 por razones de constitucionalidad,
  al entender que definía el ámbito de afiliación y la actividad profesional amparada por la Caja -y
  por tanto el acceso al beneficio jubilatorio- careciendo de la iniciativa privativa que exige la
  Constitución para materia previsional.
resultado:
  estado: observaciones_aceptadas
  fecha: 2004-01-20
  detalle: La Asamblea General, reunida el 20-01-2004, dejó constancia de que había transcurrido el
    plazo del artículo 139 de la Constitución sin que se pronunciara sobre la observación al
    artículo 43, por lo que la observación quedó tácitamente aceptada; la Presidencia de la Asamblea
    comunicó el texto definitivo incluyendo el artículo 43 con la redacción propuesta por el Poder
    Ejecutivo, y la ley se promulgó (Ley 17.738, de 7 de enero de 2004, según la fecha de sanción
    del texto definitivo).
  fuentes:
