politico: batlle
tema: economia/empleo
titulo: Derechos jubilatorios ante el BPS de docentes de ANEP reincorporados por la Ley 15.783
numero_ley: "17.620"
fecha: 2002-12-29
alcance: total
fundamento: "El Poder Ejecutivo observó el proyecto por razones de inconstitucionalidad: entendió
  que no era una norma meramente interpretativa del artículo 1 de la Ley 16.824 sino una
  modificación de beneficios jubilatorios que carecía de la iniciativa privativa del Poder Ejecutivo
  exigida por el artículo 86 inciso 2 de la Constitución, y que generaba una desigualdad frente a
  otros destituidos."
resultado:
  estado: veto_levantado
  fecha: 2003-02-12
  detalle: "La Asamblea General, en votación nominal el 12-02-2003, resolvió levantar las
    observaciones: el Senado registró 17 votos afirmativos (por el levantamiento) en 28 sufragantes,
    y Diputados 51 afirmativos en 77 presentes, alcanzando en ambos casos los tres quintos
    requeridos. La ley se promulgó ese mismo mes como Ley 17.620."
