analisis: El Poder Ejecutivo vetó en su totalidad un proyecto que declaraba que los docentes de ANEP
  reincorporados tras la dictadura por la Ley 15.783 podían ejercer ante el BPS su derecho a
  pasividad o a modificar su cédula jubilatoria, por entender que excedía la iniciativa legislativa
  permitida y generaba una desigualdad frente a otros destituidos. La Asamblea General reunió los
  tres quintos en ambas cámaras para rechazar las observaciones y la ley se promulgó. No se encontró
  declaración pública de Batlle sobre este veto puntual más allá del mensaje de observaciones
  firmado.
