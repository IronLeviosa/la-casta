politico: batlle
tema: economia
titulo: Sustitución del artículo 154 de la Ley 17.556 sobre licitaciones de obras portuarias con
  dragas y grúas de bandera extranjera
numero_ley: "17.742"
fecha: 2003-12-26
alcance: parcial
articulos_observados:
  - "154"
fundamento: El Poder Ejecutivo observó la sustitución del artículo 154 por entender que revertía el
  objetivo de la norma original (evitar monopolios de hecho en el uso de dragas de bandera uruguaya)
  y que exigir el embanderamiento nacional a equipos especializados de uso poco frecuente (grúas
  flotantes, plataformas) encarecería y demoraría las obras.
resultado:
  estado: veto_levantado
  fecha: 2004-02-17
  detalle: "La Asamblea General, en votación nominal el 17-02-2004, resolvió levantar las
    observaciones: Diputados registró 53 votos afirmativos y 16 negativos en 69 sufragantes, y el
    Senado 18 afirmativos y 9 negativos en 27 sufragantes, alcanzando en ambos casos la mayoría
    constitucional (los tres quintos de 69 son 42 y los tres quintos de 27 son 17; el diario de
    sesiones consultado no expresa estos umbrales de forma explícita para este veto -a diferencia de
    otros del mismo lote-, así que la cifra surge de un cálculo aritmético de esta investigación, no
    de una cita textual del documento). La ley se promulgó el 09-03-2004 como Ley 17.742."
  fuentes:
    - url: https://infolegislativa.parlamento.gub.uy/temporales/1921179.PDF
      medio: parlamento
      fecha: 2004-02-17
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Asamblea General N.o 62, Tomo 82 (17 de febrero de 2004)
      cita: "Han votado sesenta y nueve señores Representantes: cincuenta y tres lo hicieron por la
        afirmativa y dieciséis por la negativa; y han votado veintisiete señores Senadores:
        dieciocho lo hicieron por la afirmativa y nueve por la negativa."
      retrieved_at: 2026-09-05
      verificacion: manual
analisis: El Poder Ejecutivo vetó parcialmente (un solo artículo) un proyecto que modificaba las
  reglas de licitación para obras portuarias que requieren dragas, grúas flotantes o plataformas,
  por entender que la sustitución podía recrear monopolios de hecho y encarecer las obras. La
  Asamblea General reunió la mayoría constitucional para rechazar la observación y la ley se
  promulgó. No se encontró declaración pública de Batlle sobre este veto puntual más allá del
  mensaje de observaciones firmado.
