fundamento: El Poder Ejecutivo fundó las observaciones al Presupuesto Nacional 2000-2004 tanto en
  razones de constitucionalidad como de mérito, en ejercicio de las facultades de los artículos 137
  y 168 numeral 6 de la Constitución, para observar total o parcialmente una veintena de artículos
  por motivos que variaban artículo por artículo (falta de iniciativa privativa del Poder Ejecutivo,
  incompatibilidad con políticas fijadas por el gobierno, distorsiones presupuestales, entre otros).
resultado:
  estado: veto_levantado
  fecha: 2001-02-14
  detalle: "La Asamblea General, reunida el 14-02-2001, resolvió por moción de varios legisladores
    levantar (rechazar) las observaciones del Poder Ejecutivo específicamente a los artículos 329,
    331, 468, 470, 549 y 557 del proyecto de Presupuesto, que quedaron con el texto que había
    sancionado el Parlamento; la ley se promulgó el 21-02-2001 como Ley 17.296. La moción para no
    aceptar esas observaciones se votó primero y obtuvo 116 votos en 117 sufragantes (afirmativa);
    la votación nominal en bloque que siguió alcanzó unanimidad, y la Presidencia de la Asamblea
    señaló expresamente que esa votación comprendía los tres quintos requeridos tanto de Senadores
    como de Diputados. El diario de sesiones consultado no reproduce una votación nominal separada
    para cada uno de los restantes artículos observados (24, 65, 70, 71, 72, 90, 114, 118, 185, 198,
    199, 225, 319), por lo que su desenlace individual no quedó documentado en esta investigación:
    el desenlace aquí descrito cubre 6 de los 19 artículos observados, no los 19."
