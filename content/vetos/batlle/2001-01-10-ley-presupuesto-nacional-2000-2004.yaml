analisis: "El Poder Ejecutivo observó parcialmente el proyecto de Presupuesto Nacional 2000-2004, el
  primero de su gestión, alcanzando alrededor de una veintena de artículos por razones de
  constitucionalidad y de mérito. La Asamblea General, en su primera sesión de considerarlas, votó
  expresamente rechazar las observaciones a seis de esos artículos (329, 331, 468, 470, 549 y 557),
  con 121 legisladores votando por la unanimidad en la votación nominal en bloque; quedaron con el
  texto sancionado por el Parlamento y la ley se promulgó ocho días después. El desenlace
  documentado en esta investigación cubre 6 de los 19 artículos observados: para los 13 restantes no
  se encontró una votación nominal separada en esta sesión, y su desenlace individual no quedó
  establecido. No se encontró en esta investigación una declaración pública de Batlle sobre este
  veto específico más allá del propio mensaje de observaciones, firmado por él como Presidente."
