politico: lacalle-pou
tema: medioambiente
titulo: Ley de suelos de prioridad forestal (impulsada por Cabildo Abierto)
fecha: 2021-12-16
alcance: total
fundamento: El Poder Ejecutivo observó el proyecto en su totalidad por entender que vulneraba los
  derechos de propiedad, libertad y trabajo de los artículos 32, 36, 50 inciso 1° y 53 de la
  Constitución, al limitar el destino productivo de los suelos sin que surgieran razones de interés
  general que lo justificaran, y por considerar que afectaba la cadena productiva forestal y la
  seguridad jurídica para las inversiones del sector.
resultado:
  estado: observaciones_aceptadas
  fecha: 2021-12-29
  detalle: "La Asamblea General votó el 29-12-2021: en el Senado 15 votos a favor de rechazar las
    observaciones y 16 en contra (de 31 presentes), y en Diputados 44 a favor y 53 en contra (de 97
    presentes). No se alcanzó la mayoría de tres quintos que exige el artículo 138 de la
    Constitución (se hubieran necesitado 19 votos en el Senado y 59 en Diputados) y el veto quedó
    vigente; el proyecto no se convirtió en ley."
