analisis: 'El Poder Ejecutivo vetó en su totalidad el proyecto de suelos de prioridad forestal,
  impulsado por Cabildo Abierto con votos del Frente Amplio, por entender que vulneraba derechos de
  propiedad, libertad y trabajo reconocidos en la Constitución. La Asamblea General no reunió los
  tres quintos necesarios para levantar el veto y el proyecto no se convirtió en ley. Meses después,
  en una entrevista, Lacalle Pou usó el episodio como ejemplo de que la coalición de gobierno
  funciona pese a sus diferencias internas: "si uno aprieta, asfixia".'
