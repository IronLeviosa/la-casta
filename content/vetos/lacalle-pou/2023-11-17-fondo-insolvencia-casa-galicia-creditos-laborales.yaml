analisis: El Poder Ejecutivo observó parcialmente la ley, presentada por senadoras y senadores del
  Frente Amplio, que creaba un fondo para pagar créditos laborales a extrabajadores de Casa de
  Galicia, por entender que el texto aprobado por el Parlamento violaba el principio de igualdad y
  afectaba la planificación financiera del Estado, y propuso un fondo más acotado. La Asamblea
  General no alcanzó los tres quintos para levantarlo, por escaso margen en el Senado, y la ley se
  promulgó con la versión reducida. En conferencia de prensa en Dolores, Lacalle Pou dijo que "nos
  tiraron el fardo" y que el veto respondía a razones constitucionales, económicas y de justicia.
