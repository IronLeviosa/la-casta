politico: lacalle-pou
tema: salud
titulo: Fondo de Insolvencia Casa de Galicia (créditos laborales de extrabajadores)
numero_ley: "20.226"
fecha: 2023-11-17
alcance: parcial
articulos_observados:
  - "1"
  - "2"
