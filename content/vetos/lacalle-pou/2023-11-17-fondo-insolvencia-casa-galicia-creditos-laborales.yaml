fundamento: El Poder Ejecutivo observó los primeros tres artículos de la ley, que garantizaban los
  créditos laborales de los extrabajadores de Casa de Galicia hasta 105.000 UI por trabajador en un
  único pago, por entender que violaban el principio de igualdad del artículo 8 de la Constitución
  al dar a ese grupo una cobertura más amplia que al resto de los trabajadores privados, y que
  violaban el artículo 86 al fijar plazos de pago que afectaban la planificación financiera del
  Estado. Propuso en cambio un fondo con un tope de 30.000 UI por trabajador.
resultado:
  estado: observaciones_aceptadas
  fecha: 2023-12-06
  detalle: "La Asamblea General votó el 06-12-2023: en el Senado 17 senadores votaron contra el veto
    (a favor de levantarlo) y 12 a favor de mantenerlo, de 29 presentes, cuando se necesitaban 18
    votos (tres quintos) para levantarlo; en Diputados 56 votaron contra el veto y 41 a favor, de 97
    presentes, cuando se necesitaban 59. El veto quedó firme y la ley se promulgó el 13-12-2023 con
    el fondo de hasta 30.000 UI por trabajador que había propuesto el Poder Ejecutivo."
