analisis: El Poder Ejecutivo observó el artículo 72 de la nueva Ley de Medios, que había incorporado
  Cabildo Abierto y exigía a los servicios de difusión audiovisual informar con imparcialidad sobre
  actores políticos, por considerarlo incompatible con la libertad de expresión y una forma de
  censura previa. A diferencia de los otros tres vetos del período, la Asamblea General no llegó a
  votar dentro del plazo constitucional de treinta días y el veto quedó aceptado tácitamente por
  vencimiento de ese plazo. No se encontraron declaraciones públicas de Lacalle Pou explicando este
  veto más allá del texto del propio decreto, difundido por la prensa.
