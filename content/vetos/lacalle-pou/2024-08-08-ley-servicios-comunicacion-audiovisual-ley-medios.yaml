analisis: El Poder Ejecutivo observó el artículo 72 de la nueva Ley de Medios, que había incorporado
  Cabildo Abierto y exigía a los servicios de difusión audiovisual informar con imparcialidad sobre
  actores políticos, por entender que era incompatible con la libertad de expresión (artículo 29 de
  la Constitución y artículo 13 de la Convención Americana sobre Derechos Humanos) y que además
  vulneraba el derecho al trabajo, industria, comercio y profesión de los artículos 7, 10 y 36 de la
  Constitución. A diferencia de los otros tres vetos del período, la Asamblea General no llegó a
  votar dentro del plazo constitucional de treinta días y el veto quedó aceptado tácitamente por
  vencimiento de ese plazo. No se encontraron declaraciones públicas de Lacalle Pou explicando este
  veto más allá del texto de las propias observaciones.
