revision:
  tier: publicado
  notas_internas: 'Nivel subido de reportado a textual: se incorporó el Repartido 36/0 (mensaje de
    observaciones del Poder Ejecutivo, resuelto en inbox/resoluciones/2026-09-05), leído y
    verificado en esta sesión. Su texto obliga a corregir la corrección anterior de `fundamento`: el
    número de artículo 36 sí está en el documento del Poder Ejecutivo (objeción `corregir` de
    critica.md, vetos[3]) — no se había encontrado antes porque el texto dice "artículos 7, 10 y 36"
    (plural), no "artículo 36" (singular), y tanto la nota de Ámbito citada entonces como una
    búsqueda literal por esa frase exacta lo pasaron por alto. Se agregó también la cita del
    artículo 13 de la Convención Americana sobre Derechos Humanos, antes descrita solo como
    "tratados internacionales" sin precisar cuál. `resultado.detalle` se mantiene como quedó en la
    edición anterior (no verifica de forma independiente la fecha de primera convocatoria del
    artículo 139; objeción `bloquea` de critica.md, vetos[3], ya resuelta ahí). La URL de este
    repartido es del mismo tipo inestable que la de vetos[1] (redirige a un PDF temporal con
    identificador que caduca), pero acá el archivo en Wayback sí funcionó: con ese respaldo no hace
    falta marcar `verificacion: manual`. Sin otra objeción pendiente y con nivel textual, sube a
    `publicado`.'
