politico: lacalle-pou
tema: derechos-humanos
titulo: Ley de Servicios de Comunicación Audiovisual (Ley de Medios), artículo 72 sobre
  imparcialidad política
numero_ley: "20.383"
fecha: 2024-08-08
alcance: parcial
articulos_observados:
  - "72"
fundamento: El Poder Ejecutivo observó el artículo 72, incorporado por Cabildo Abierto, que obligaba
  a los servicios de difusión de contenido audiovisual a informar de forma "completa, imparcial,
  seria, rigurosa, plural y equilibrada" sobre actores políticos. Argumentó que la norma establecía
  una obligación incompatible con la libertad de expresión, que implicaba una forma de censura
  previa y que violaba el artículo 29 de la Constitución y tratados internacionales de derechos
  humanos; la nota citada describe además, sin darle número, una afectación al derecho al trabajo,
  industria y comercio por falta de razón de interés general —el mismo derecho que el Poder
  Ejecutivo identificó expresamente como artículo 36 en el veto a la ley forestal de 2021 (ver
  vetos[0])—.
resultado:
  estado: observaciones_aceptadas
  fecha: 2024-10-07
  detalle: La ficha de trámite del Parlamento registra que el plazo constitucional vencía el
    04-10-2024, que no hubo sesión ni votación en la Asamblea General para tratar el veto (no se
    llegó a fijar fecha), y que el 07-10-2024 se asentó "Veto aceptado tácitamente por vencimiento
    de plazo constitucional". El artículo 139 de la Constitución prevé este mecanismo (treinta días
    desde la primera convocatoria sin rechazo expreso de las observaciones); la fecha de esa primera
    convocatoria no figura en la ficha consultada, así que este registro toma la conclusión que el
    propio Parlamento asentó, sin verificar de forma independiente el cómputo de los treinta días.
    La ley se promulgó el 16-10-2024 sin el artículo 72.
