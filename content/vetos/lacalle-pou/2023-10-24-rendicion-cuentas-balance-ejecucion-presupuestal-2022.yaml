articulos_observados:
  - "636"
  - "664"
  - "665"
  - "666"
  - "578"
fundamento: "El Poder Ejecutivo observó cinco artículos de la Rendición de Cuentas. Del artículo 636
  —que fijaba una inhibición de tres años para ejercer la abogacía, tras el cese, del Fiscal de
  Corte y el Fiscal Adjunto de Corte, y de un año para los fiscales con competencia penal, más un
  subsidio equivalente al 85% de sus haberes durante ese período— el mensaje de observaciones objetó
  únicamente los incisos segundo, tercero y cuarto: sostuvo que las competencias jerárquicas y
  administrativas del Fiscal de Corte y el Fiscal Adjunto justificaban su inhibición (inciso
  primero, que no observó), pero que no encontraba razones de interés general para aplicar la misma
  restricción al derecho al trabajo (artículos 7 y 36 de la Constitución) de los fiscales con
  competencia penal, dada la distinta naturaleza de su función; objetó además que el subsidio no
  indicara los recursos con que se financiaría, conforme al artículo 86. El artículo 578, que
  sustituía el artículo 110 del Texto Ordenado en materia de exoneraciones tributarias a empresas
  periodísticas, se observó en su totalidad por entender que la redacción podía no beneficiar, desde
  el punto de vista tributario, a la generalidad de esas empresas, en situaciones dispares entre sí.
  Los artículos 664 a 666, que devolvían a los Gobiernos Departamentales del interior la
  habilitación de locales de carnicerías —competencia que desde 2020 ejerce el Instituto Nacional de
  Carnes en todo el país—, se observaron por razones de conveniencia."
resultado:
  estado: observaciones_aceptadas
  fecha: 2023-11-01
  detalle: 'La Asamblea General votó el 01-11-2023: el artículo 636 se aprobó con 27 votos a favor y 3
    en contra en el Senado, y 77 a favor y 6 en contra en Diputados; los artículos 664, 665, 666 y
    578 se aprobaron por unanimidad. El trámite quedó registrado como "Asamblea General no levanta
    veto" y la ley se promulgó el 06-11-2023 sin los incisos segundo, tercero y cuarto del artículo
    636 (queda vigente la inhibición del Fiscal de Corte y el Fiscal Adjunto de Corte, inciso
    primero, que el Poder Ejecutivo no observó) ni los artículos 664, 665, 666 y 578, los cinco
    tramos observados.'
