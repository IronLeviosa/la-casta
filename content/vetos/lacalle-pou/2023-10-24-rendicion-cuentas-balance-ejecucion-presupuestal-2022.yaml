analisis: El Poder Ejecutivo observó parcialmente la Rendición de Cuentas 2022 en cinco artículos
  que tocaban tres asuntos distintos. Del artículo 636 —impulsado por Cabildo Abierto a instancias
  de la Asociación de Abogados Penalistas—, el mensaje de observaciones distingue entre el Fiscal de
  Corte y el Fiscal Adjunto de Corte, cuya inhibición de tres años no observó por sus funciones
  jerárquicas, y los fiscales con competencia penal, cuya inhibición de un año observó por no
  encontrar razones de interés general que justificaran restringir su derecho al trabajo (artículos
  7 y 36 de la Constitución); también observó el subsidio asociado a esa inhibición por no indicar
  su financiamiento (artículo 86). El artículo 578, sobre exoneraciones tributarias a empresas
  periodísticas, y los artículos 664 a 666, sobre la habilitación de carnicerías en el interior, se
  observaron por razones de conveniencia. La Asamblea General no levantó el veto y la ley se
  promulgó sin esos tramos. No se encontraron declaraciones públicas de Lacalle Pou sobre este veto
  en particular, más allá del texto de las observaciones.
