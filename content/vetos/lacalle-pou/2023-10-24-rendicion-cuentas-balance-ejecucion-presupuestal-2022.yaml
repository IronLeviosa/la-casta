analisis: "El Poder Ejecutivo observó parcialmente la Rendición de Cuentas 2022 en cinco artículos
  que tocaban tres asuntos distintos: la inhibición a fiscales para ejercer la abogacía tras dejar
  el cargo —artículo impulsado por Cabildo Abierto a instancias de la Asociación de Abogados
  Penalistas—, un artículo sobre medios con un error de redacción y otro sobre fiscalización de
  carnicerías. La única nota disponible sobre este veto atribuye a dos constitucionalistas
  consultados por la prensa, no al Poder Ejecutivo, el argumento de que la inhibición a fiscales
  violaba el artículo 36 de la Constitución. La Asamblea General no levantó el veto y la ley se
  promulgó sin esos artículos. No se encontraron declaraciones públicas de Lacalle Pou sobre este
  veto en particular, más allá del texto de las observaciones."
