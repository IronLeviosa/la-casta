fundamento: "El Poder Ejecutivo observó cinco artículos de la Rendición de Cuentas: la inhibición de
  tres años para que el fiscal de Corte y los fiscales penales ejercieran la abogacía tras dejar el
  cargo; un artículo sobre medios de comunicación que consideró mal redactado; y un artículo que
  devolvía a las intendencias la fiscalización de carnicerías fuera de Montevideo. La única fuente
  disponible sobre este veto no reproduce el argumento propio del Poder Ejecutivo para observar la
  inhibición a fiscales: la referencia al artículo 36 de la Constitución la hacen, en esa nota, dos
  constitucionalistas consultados por la prensa (Daniel Ochs y Eduardo Lust), no el Poder
  Ejecutivo."
resultado:
  estado: observaciones_aceptadas
  fecha: 2023-11-01
  detalle: 'La Asamblea General votó el 01-11-2023: el artículo 636 se aprobó con 27 votos a favor y 3
    en contra en el Senado, y 77 a favor y 6 en contra en Diputados; los artículos 664, 665, 666 y
    578 se aprobaron por unanimidad. El trámite quedó registrado como "Asamblea General no levanta
    veto" y la ley se promulgó el 06-11-2023 sin los cinco artículos observados.'
