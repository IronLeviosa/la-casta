revision:
  tier: probable
  notas_internas: "Nivel subido de reportado a textual: se incorporó el Repartido 24/0 (mensaje de
    observaciones del Poder Ejecutivo, resuelto en inbox/resoluciones/2026-09-05), leído y
    verificado en esta sesión. Su texto obliga a corregir la corrección anterior: no es que el Poder
    Ejecutivo no haya invocado el artículo 36 (objeción `corregir` de critica.md, vetos[1]) —lo
    invoca, junto con el artículo 7, respecto del derecho al trabajo de los fiscales con competencia
    penal—, sino que la única fuente disponible en su momento (El Observador) no lo mostraba porque
    atribuía ese argumento a dos constitucionalistas consultados por la prensa; con el documento
    primario a la vista, `fundamento` y `analisis` se reescribieron para reflejar lo que el Poder
    Ejecutivo argumentó, con más precisión que antes (distingue Fiscal de Corte de fiscales penales,
    y solo observa los incisos 2° a 4° del artículo 636). Tier se mantiene en `probable`, ya no por
    falta de segunda fuente sino por la fuente nueva: la URL pública de este repartido
    (parlamento.gub.uy/documentosyleyes/documentos/repartido/asambleageneral/49/24/0/PDF) redirige a
    un PDF temporal con identificador que caduca (confirmado por el resolvedor: dos pedidos
    sucesivos devuelven UUID distintos) y el intento de archivarlo en Wayback falló (HTTP 523, sin
    wayback de respaldo). Se marca `verificacion: manual` en esa fuente porque no hay forma mecánica
    de garantizar que una re-verificación futura recupere el mismo documento desde la misma URL ni
    desde un archivo; necesita aprobación humana si en el futuro se quisiera subir a `publicado`."
