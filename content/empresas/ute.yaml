          titulo: Estados Contables individuales de UTE al 31 de diciembre de 2008 - Nota 4.2, Versión de
            resultados
          cita: |-
            4.2 	Versión de resultados
            El art. 643 de la Ley Nº 16.170 del 28/12/90 estableció la obligatoriedad de la versión de
            la totalidad de los resultados de los Entes Autónomos y Servicios Descentralizados con excepción
            de las partidas necesarias para el financiamiento de los proyectos de inversión propios y
            coberturas de riesgos.
            El 	Decreto 	N° 	161 	del 	15/03/91 	reglamenta 	los 	criterios 	técnicos 	aplicables 	en 	la
            determinación de los resultados y establece el régimen de adelantos a verter en una cuenta de
            la Tesorería General de la Nación en el Banco Central del Uruguay.
            En el primer trimestre del presente ejercicio fue vertido a Rentas Generales la suma de $
            124.595.000, lo que determina una disminución de los resultados acumulados de $ 131.167.815
            a valores ajustados por inflación.
            El Decreto N° 206 del 14/04/08 autorizó la reducción en $ 700.000.000 de la versión
            realizada en el ejercicio 2007, reconociendo dicho importe como pago a cuenta del Impuesto a la
            Renta de Industria y Comercio del ejercicio finalizado el 31/12/07. Asimismo, por Decreto N°
            275 del 09/06/08 se autorizó la reducción en $ 841.428.784 de dicha versión y su utilización
            para el pago del Impuesto al Valor Agregado y los adelantos mensuales del Impuesto al
            Patrimonio del presente ejercicio. La suma de ambos conceptos ajustados por inflación ($
            1.485.421.746), se expone en el Estado de Evolución del Patrimonio como variación en los
            resultados acumulados.
            Al 	31/12/08, 	la 	cifra 	autorizada 	por 	los 	decretos 	antes 	mencionados, 	había 	sido
            íntegramente utilizada para el pago de impuestos.
          retrieved_at: 2026-09-08
