    nota: El ejercicio 2008 cerró con la mayor pérdida neta de la serie 2004-2014 ($ 8.267.177.704). El
      balance no explicita las causas de esa pérdida; el Literal C muestra que el gasto de
      explotación en Generación fue de $ 14.656.224.813 en 2008, frente a $ 2.367.278.912 en 2004
      (ver fuentes de resultado_ejercicio). La deuda financiera de este ejercicio (Nota 5) se
      presenta bruta, sin netear los intereses a vencer, a diferencia de la presentación neta que
      usan los balances 2004-2007 y 2009-2012; por eso el salto 2007→2008 de este campo no es
      homogéneo (el propio balance de 2008, en base bruta comparable, da $ 7.372.690.510 para 2007,
      un aumento del 116% y no del 164% que muestra esta ficha). Impuestos_pagados y
      transferencias_al_estado son cifras de caja nominales. La Nota 4.2 de este balance explica
      que, de los $ 1.541.428.784 vertidos como versión de resultados en 2007, $ 700.000.000 fueron
      aplicados en 2008 al pago del IRIC del propio 2007 y $ 841.428.784 al pago de IVA y del
      Impuesto al Patrimonio de 2008, de modo que ese mismo importe puede estar comprendido, en otra
      forma, dentro del total de impuestos_pagados de este año (ver la nota de 2007). El Literal E
      de este balance imprime, en cambio, $ 24.595.000 como "adelanto de versión de resultados" del
      ejercicio 2008, una cifra distinta a la que usa transferencias_al_estado (ver fuentes). El
      aporte de capital por los aerogeneradores de la Sierra de los Caracoles equivale a U$S
      10.766.671 al tipo de cambio de la propia operación de conversión de deuda con España,
      distinto del tipo de cambio de cierre del ejercicio (24,362) que usa esta ficha para convertir
      el monto en pesos a dólares.
