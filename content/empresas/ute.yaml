creacion:
  fecha: 1912-10-21
  norma: Ley 4.273
  fuentes:
    - url: https://www.impo.com.uy/bases/leyes/4273-1912
      medio: impo
      fecha: 1912-10-21
      tipo: documento_oficial
      titulo: Ley N° 4273 — resumen de IMPO (la página no publica el articulado)
      cita: Créase como dependencia del Poder Ejecutivo la Administración General de las "Usinas
        Eléctricas del Estado" sustitutiva de la "Usina Eléctrica de Montevideo". Fíjanse sus
        cometidos, los que serán con exclusión de toda otra empresa o persona, la provisión a
        terceros de energía eléctrica para alumbrado, fuerza motriz, tracción y demás aplicaciones
        en todo el territorio de la República.
      retrieved_at: 2026-09-07
    - url: https://portal.ute.com.uy/sites/default/files/docs/UTE%20EEFF%20AL%2031.12.20%20E%20INFORME%20DE%20AUDITOR%C3%8DA.pdf
      medio: ute
      fecha: 2020-12-31
      tipo: documento_oficial
      titulo: Estados Financieros de UTE al 31 de diciembre de 2020 - Notas a los Estados Financieros
        Separados, Nota 1
      cita: "La Ley Nº 4.273 promulgada el 21 de octubre de 1912 creó la UTE, ente autónomo al cual se le
        concedió personería jurídica para cumplir su cometido específico, abarcando éste las etapas
        de: generación, trasmisión, distribución y comercialización de la energía eléctrica. Se le
        confirió el monopolio estatal del suministro eléctrico para todo el territorio nacional y se
        la amparó reconociéndole derechos y privilegios legales para facilitar su gestión y
        respaldar su autoridad. Por Leyes N° 14.694 del 01/09/77, N° 15.031 del 04/07/80 y N° 16.211
        del 01/10/91, el Ente deja de cumplir sus funciones específicas en régimen de monopolio y se
        le amplían sus posibilidades de actuación al campo de prestación de Servicios de
        Asesoramiento y Asistencia Técnica en las áreas de su especialidad y anexas, tanto en el
        territorio de la República como en el exterior. Por el art. 265 de la Ley Nº 16.462 del 11
        de enero de 1994 se amplía su giro, facultándose su participación fuera de fronteras en las
        diversas etapas de la generación, transformación, trasmisión, distribución y
        comercialización de la energía eléctrica, directamente o asociada con empresas públicas o
        privadas, nacionales o extranjeras. Dicha participación estará supeditada a la previa
        autorización del Poder Ejecutivo. Con fecha 17 de junio de 1997 el Poder Ejecutivo promulgó
        la Ley Nº 16.832 que sustituye el artículo 2° del Decreto - Ley Nº 14.694, estableciendo a
        su vez un nuevo Marco Regulatorio Legal para el Sistema Eléctrico Nacional. La misma
        establece un reordenamiento del mercado eléctrico fijando condiciones y creando organismos
        reguladores."
      retrieved_at: 2026-09-08
que_hace: UTE genera, trasmite, distribuye y comercializa energía eléctrica en todo el territorio
  uruguayo, y presta servicios de asesoramiento y asistencia técnica en su área de especialidad,
  dentro y fuera del país. Desde la reforma de 1997, compite con generadores privados en la
  producción de energía, mientras mantiene en forma exclusiva la trasmisión y la distribución. Opera
  un parque generador propio hidrotérmico y eólico, dispone de potencia instalada en la Central de
  Salto Grande y de capacidad de interconexión con Brasil en las estaciones convertidoras de
  frecuencia de Rivera y Melo.
