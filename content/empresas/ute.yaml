hitos:
  - fecha: 1912-10-21
    titulo: Ley 4.273 crea UTE con el monopolio estatal del suministro eléctrico
    detalle: Le confiere el monopolio de generación, trasmisión, distribución y comercialización de
      energía eléctrica en todo el territorio nacional.
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/4273-1912
        medio: impo
        fecha: 1912-10-21
        tipo: documento_oficial
        titulo: Ley N° 4273 — resumen de IMPO
        cita: Fíjanse sus cometidos, los que serán con exclusión de toda otra empresa o persona, la
          provisión a terceros de energía eléctrica para alumbrado, fuerza motriz, tracción y demás
          aplicaciones en todo el territorio de la República.
        retrieved_at: 2026-09-07
  - fecha: 1977-09-01
    titulo: Decreto-Ley 14.694 (Ley Nacional de Electricidad); UTE deja de operar en régimen de
      monopolio exclusivo
    detalle: Amplía las posibilidades de actuación de UTE al campo de asesoramiento y asistencia técnica
      dentro y fuera del país; encarga a UTE el "servicio público de electricidad" y habilita que se
