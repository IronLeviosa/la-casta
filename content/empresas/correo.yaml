que_hace: "Correo Uruguayo (Administración Nacional de Correos) es el servicio descentralizado
  comercial del Estado que presta el servicio postal en todo el territorio nacional: admisión,
  procesamiento, transporte y distribución de envíos de correspondencia y demás productos postales,
  por sí misma o mediante agentes oficiales. La Administración Nacional de Correos es el único
  órgano competente del Estado para prestar el servicio postal y solo ella puede emitir valores
  postales. Es además el operador designado por ley para cumplir el Servicio Postal Universal (SPU),
  que incluye cartas, tarjetas postales, impresos, cecogramas, sacas M y encomiendas de hasta 20
  kilogramos; en el resto de los servicios postales (paquetería, courier, comercio electrónico
  transfronterizo) compite con privados registrados ante el regulador: unas 130 empresas privadas en
  2013, según el Ministerio de Industria, Energía y Minería. Desde 2025 avanza un plan de
  transformación hacia la logística integral (recepción de mercadería, almacenamiento, preparación
  de pedidos, trámites aduaneros y gestión documental) para compensar la caída del negocio
  tradicional de correspondencia."
que_hace_fuentes:
  - url: https://parlamento.gub.uy/documentosyleyes/leyes/ley/19009?GA=
    medio: parlamento
    fecha: 2012-11-22
    tipo: documento_oficial
    titulo: Ley N° 19009, artículo 39 - nueva redacción de los artículos 1 y 2 de la Carta Orgánica de
      la ANC
    cita: '"ARTÍCULO 1º.- La Administración Nacional de Correos es un servicio descentralizado
      comercial, prestador del servicio postal, de acuerdo a lo establecido en la Sección XI de la
      Constitución de la República , con la competencia y organización que por la presente ley se
      determina. Es persona jurídica y constituye su domicilio legal en la ciudad de Montevideo. En
      el ámbito de su competencia puede establecer y cerrar sucursales y agencias en todo el país o
      en el extranjero. Asimismo, previa conformidad del Poder Ejecutivo y por medio de las formas
      de asociación contractual vigentes en la materia, puede acordar con los organismos y empresas
      públicas o privadas que estime conveniente, exclusivamente para el desarrollo de sus obras de
      infraestructura física, de infraestructura e innovación tecnológica y de negocios con
      vinculación internacional". "ARTÍCULO 2º.- La Administración Nacional de Correos tiene a su
      cargo, por sí misma o concesión mediante agentes oficiales, la prestación del servicio postal,
      esto es la admisión, procesamiento, transporte y distribución, en todas o cualesquiera de sus
      etapas de envíos de correspondencia y demás envíos postales, sin perjuicio de otros productos
      postales. El servicio postal se cumplirá de conformidad con las leyes y con los Convenios y
      Acuerdos Internacionales vigentes. La Administración Nacional de Correos es el único órgano
      competente del Estado para prestar el servicio postal y solo ésta puede realizar la emisión de
      valores postales, en la forma que lo disponga la ley y su reglamentación".'
    retrieved_at: 2026-09-09
