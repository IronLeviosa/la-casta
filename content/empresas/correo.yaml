  tiene: true
  alcance: La única actividad que la Ley 19.009 (2012) reserva en exclusiva a la Administración
    Nacional de Correos es la emisión de valores postales (sellos). El resto del servicio postal
    -incluido el Servicio Postal Universal (SPU), que la ley le encarga como único operador
    designado- se presta en un régimen que la propia norma llama "de competencia" o "de
    concurrencia" (términos que declara sinónimos) y se financia con ingresos propios de la ANC, la
    Tasa de Financiamiento del Servicio Postal Universal (TFSPU, que pagan los clientes de todos los
    operadores) y aportes de Rentas Generales, no con una franja de mercado cerrada a privados.
