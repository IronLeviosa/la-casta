  tier: publicado
  notas_internas: 'Editor, 2026-09-09 (corrida 2026-09-07-empresas-correo): resueltos los cinco
    bloqueantes de critica.md (alcance del monopolio reescrito sobre el criterio "actividades
    reservadas por ley" -solo la emisión de valores postales, no el SPU-; deuda financiera de 2024
    corregida; 2014 recargado desde su balance propio; segmentos por línea de negocio cargados
    2022-2025) y las catorce objeciones "corregir" (impuestos_pagados con su quiebre de definición
    explicado donde la página lo muestra; fuente de capitalizaciones 2023 corregida; C4 con la cita
    del artículo 9 reatribuida a parlamento.gub.uy; hito de Pando con fecha y fuente correctas; "más
    de un centenar" reemplazado por la cifra con fuente; artículo 192 de la RC 2026 atribuido
    explícitamente a Búsqueda, no confirmado contra el repartido; comparaciones de Ursec movidas a
    analisis.yaml; notas de finanzas[] acortadas a una oración; usd:0 agregado en
    transferencias_al_estado; anios_sin_balance agregado y 2025 cargado; hito del antecedente de
    1827 agregado; segunda cita de Presidencia agregada al primer argumento a favor). Quedan sin
    resolver, documentados: los dos argumentos a favor del monopolio son partes interesadas
    (gobierno que escribió la ley, sindicato de la empresa) y no se encontró una voz uruguaya
    independiente en contra pese a la búsqueda extendida (26 búsquedas entre las dos vueltas,
    detalladas en notas.md); el artículo 192 de la Rendición de Cuentas 2026 sigue sin poder
    cotejarse contra el repartido del proyecto; el dictamen del Tribunal de Cuentas sobre 2022-2023
    no se buscó (aviso A4 de la crítica); los balances 2009-2012 están disponibles y no se cargaron
    (quedan para una eventual extensión de la serie, igual que se hizo con ANCAP, UTE y ANTEL).
    Ninguno de estos puntos cambia una cifra publicada; todos están dichos en el resumen o en esta
    nota.'
