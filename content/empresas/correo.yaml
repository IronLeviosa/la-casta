resumen: >-
  Correo Uruguayo (Administración Nacional de Correos, ANC) es el servicio descentralizado comercial
  del Estado que presta el servicio postal en todo el país: admisión, procesamiento, transporte y
  distribución de correspondencia y demás productos postales, y es el operador designado por ley
  para el Servicio Postal Universal (SPU). Fuera del SPU compite con privados registrados ante el
  regulador (Ursec): en 2013, unas 130 empresas. Desde 2025 impulsa un plan de transformación hacia
  la logística integral (recepción, almacenamiento, preparación de pedidos, trámites aduaneros y
  gestión documental) para compensar la caída del negocio tradicional de correspondencia.

  En los trece ejercicios de esta ficha (2013-2025), el resultado del ejercicio fue negativo todos
  los años, entre USD 20,5 millones (2014, la menor pérdida de la serie) y USD 37,9 millones (2025,
  la mayor). En el tramo final del gobierno de José Mujica (2013-2014) la pérdida fue de USD 22,0 y
  USD 20,5 millones; en el segundo gobierno de Tabaré Vázquez (2015-2019) osciló entre USD 24,2
  millones (2015) y USD 33,9 millones (2017 y 2018); en el gobierno de Luis Lacalle Pou (2020-2024)
  fue de entre USD 30,5 millones (2022) y USD 36,5 millones (2023); el primer año registrado del
  gobierno de Yamandú Orsi (2025) cerró con una pérdida de USD 37,9 millones. La pérdida y el
  subsidio del Estado son una constante de toda la serie, bajo los tres partidos que gobernaron el
  período: ninguna nota de esta ficha atribuye el déficit a un gobierno en particular.

  Todos los años, la ANC recibió de Rentas Generales un subsidio que los balances registran como
  aumento del patrimonio (Ordenanza 81/89 del Tribunal de Cuentas); en los años en que se pudo
  cotejar (2016, 2017, 2020, 2023 y 2024), el mismo importe aparece en el Estado de Flujos de
  Efectivo de esos balances, así que el subsidio es tanto lo devengado como lo efectivamente cobrado
  en el año. El subsidio bajó de $607,6 millones en 2013 a $484,1 millones en 2014 -el único año en
  que bajó- y después creció cada año hasta 2019 ($1.409,4 millones); desde 2020 se mantiene
  estable, entre $1.465 y $1.478 millones, con $1.470,0 millones exactos en los tres últimos
  ejercicios (2023 a 2025). La ANC está exonerada por su Carta Orgánica (artículo 14) del pago de
  tributos nacionales, con dos excepciones: las contribuciones a la seguridad social y el Impuesto a
  la Renta de las Actividades Económicas (IRAE); en ningún año de la serie transfirió fondos a
  Rentas Generales. Además de la deuda financiera de la tabla, la ANC mantiene una deuda separada
  con el Ministerio de Economía y Finanzas por un convenio bajo el artículo 122 de la Ley 18.046
  ($71,4 millones en 2024), que no se cuenta como deuda financiera porque no es un préstamo bancario
  sino una obligación con otro organismo del Estado.

  El total de impuestos que la ANC paga y retiene solo se puede reconstruir completo desde el
  balance de 2020: hasta 2019 los balances únicamente muestran el Impuesto a la Renta (IRAE mínimo,
  entre $98.000 y $144.000 por año) y desde 2020 agregan una nota con el total de tributos abonados
  (retenciones de IVA, IRPF, IRNR y otras tasas), que ronda los $71 a $98 millones por año; el salto
  entre 2019 y 2020 refleja ese cambio en qué publica el balance, no un aumento real de lo que la
  empresa paga. La deuda financiera de la ANC bajó de forma sostenida en la última parte de la
  serie, de $298,3 millones en 2019 a $24,1 millones en 2025, año en que no queda deuda de largo
  plazo.

  Desde el balance de 2022, la ANC desagrega sus ingresos por línea de negocio (Correspondencia,
  Logística, Filatelia, Servicios transaccionales y Servicios digitales); los balances anteriores no
  traen esa apertura. Entre 2022 y 2025, los ingresos por Correspondencia crecieron 7,8% ($786,8 a
  $848,2 millones) mientras los de Logística aumentaron 108% ($179,1 a $372,8 millones): el negocio
  tradicional de cartas se mantiene casi plano y el crecimiento de la ANC en este período viene del
  transporte de paquetería y mercadería, no de la correspondencia.

  La única actividad que la ley reserva en exclusiva a la ANC es la emisión de valores postales; el
  resto del servicio postal, incluido el SPU, se presta en un régimen que la Ley 19.009 llama de
  competencia o concurrencia, no un mercado cerrado (ver más abajo). A favor de ese diseño hablaron,
  con las citas que trae esta ficha, la Presidencia de la República (que lo compara con la educación
  y la salud como servicio público de acceso universal) y el sindicato de la ANC (que reclama más
  contratación estatal); las dos son partes con interés directo en sostenerlo. En contra, la fuente
  más cercana encontrada es un análisis académico español sobre un mecanismo de financiamiento
  distinto del uruguayo (el "ámbito reservado" europeo, no la TFSPU); pese a buscar en el diario de
  sesiones de la Ley 19.009 (2012), en la Cámara Uruguaya de Logística, en la Cámara Nacional de
  Comercio y Servicios, en el Centro de Estudios para el Desarrollo y en la producción del
  economista Leandro Zipitría, no se encontró una voz uruguaya identificable que se haya pronunciado
  en contra de este diseño específico.

  Cómo leer la tabla: el total de impuestos pagados cambia de definición en 2020 (ver más arriba),
  así que el salto de ese año no es comparable con los anteriores. El año 2013 se agregó en una
  segunda etapa de esta investigación, con su propio balance, pero ese balance no desagrega un total
  de impuestos, por lo que ese año queda sin ese dato. La deuda financiera de 2020 y 2021 está
  reconstruida a partir de balances escaneados (con las columnas del Estado de Situación Financiera
  desordenadas por el reconocimiento óptico de caracteres) y confirmada contra la columna
  comparativa de balances posteriores. El dictamen de auditoría fue una Abstención de Opinión sobre
  la totalidad de los estados financieros de 2022, y sobre el resultado, los flujos y los cambios en
  el patrimonio de 2023 (por la comparabilidad con los saldos de apertura de 2022); las cifras de
  esos dos años están sujetas a esa salvedad, documentada en cada balance. Todos los años cargan el
  "Resultado del ejercicio", no el "Resultado integral": en 2017 los dos difieren por una
  revaluación de propiedades (ver arriba) y en 2019 por apenas $30.000 de otro ajuste menor; en el
  resto de la serie son iguales.
