  tier: publicado
  notas_internas: 'Editor, 2026-09-09 (corrida 2026-09-07-empresas-bhu, vuelta 2 sobre la crítica de
    Opus). Resueltos B1 y B2. Sobre B1/2009: los dos documentos del mismo balance no concilian ($
    582.785.837 en la nota 3.21.1 frente a $ 5.343.273 miles en el Estado de Evolución del
    Patrimonio y en el flujo de financiamiento); cargué la segunda, que dos estados contables
    independientes confirman por separado, y dejé la primera declarada en la nota del año. Sobre B3:
    fijé el criterio de "tiene" como actividad reservada por ley en sentido estricto (BHU no tiene
    ninguna desde 1999; BROU sí, los depósitos de organismos públicos y judiciales), así que no hace
    falta cambiar BROU; y repetí la búsqueda de una defensa específica de los dos privilegios
    puntuales (garantía del Estado, ejecución extrajudicial) sin encontrarla, con el mismo esfuerzo
    que los "en contra" documentados (FMI/BM, BID): queda declarado en el resumen, no resuelto.
    Sobre C15: alineé impuestos_pagados de 2017 a la columna comparativa NIIF, el mismo criterio que
    ya usaba resultado_ejercicio de este año y que usa BROU para su propio año de transición; el
    original pre-NIIF queda citado en el propio campo. 2014 queda ausente (memoria sin balance en su
    capa de texto; BCU sin capturas posteriores a 2011 en esa carpeta). Sin objeciones "corregir"
    pendientes de esta crítica.'
