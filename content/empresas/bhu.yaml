que_hace: El BHU es un banco estatal especializado en crédito hipotecario para la adquisición,
  construcción, refacción o ampliación de vivienda, actividad en la que compite con la banca privada
  desde que la Ley 17.202 (1999) derogó la exclusividad del artículo 3 de su Carta Orgánica. Capta
  depósitos del público mediante el sistema de ahorro previo, emite valores negociables
  (obligaciones hipotecarias reajustables) y presta servicios de cobranza y administración de
  valores de terceros. Desde la reestructura de 2007 (Ley 18.125), que creó la Agencia Nacional de
  Vivienda (ANV) y le transfirió buena parte de su cartera de difícil cobro, sus sucursales y
  personal, el banco declara en sus estados financieros un único segmento de negocio, el
  financiamiento de la adquisición o construcción de vivienda individual para personas físicas.
