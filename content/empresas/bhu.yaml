    valor_par: 3,9% en UI (nuevo producto anunciado)
    periodo: 2022-02
    fuentes:
      - url: https://www.elobservador.com.uy/nota/fuerte-baja-en-la-tasa-hipotecaria-del-bhu-para-competir-con-fuerza-con-los-bancos-privados-2022222164933
        medio: el-observador
        fecha: 2022-02-22
        tipo: nota
        titulo: Fuerte baja en la tasa hipotecaria del BHU para competir con los bancos privados
        cita: |-
          En las últimas semanas, el banco Santander anunció un nuevo producto hipotecario
          con una tasa del 3,9% en unidades indexadas (UI); previamente el banco Itaú también
          había salido al mercado con una rebaja en la tasa de sus créditos hipotecarios a 3,9%
          en UI hasta en 10 años y de 4,5% para plazos mayores. Ahora el BHU parece ponerse a
          tiro del resto del mercado.
        retrieved_at: 2026-09-09
      - url: https://www.elobservador.com.uy/nota/fuerte-baja-en-la-tasa-hipotecaria-del-bhu-para-competir-con-fuerza-con-los-bancos-privados-2022222164933
