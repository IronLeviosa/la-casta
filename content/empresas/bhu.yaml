  argumentos_a_favor:
    - texto: Defiende la importancia de fortalecer las instituciones públicas encargadas de garantizar el
        derecho a la vivienda y destaca como un logro haber evitado que se debatiera la fusión del
        BROU y el BHU, porque velar por ese derecho es una responsabilidad intransferible del Estado
        que no puede llevarse a cabo con enfoques puramente comerciales y de mercado.
      quien: AEBU (Asociación de Bancarios del Uruguay), en el informe en mayoría de su Consejo Central
        hacia la Asamblea Nacional de Delegados de noviembre de 2023
      fuentes:
        - url: https://www.aebu.org.uy/noticias/40032
          medio: aebu
          fecha: 2023-11-08
          tipo: documento_oficial
          titulo: ANV y BHU esenciales para garantizar derecho a la vivienda
          cita: |-
            Velar por el cumplimiento del derecho a la vivienda es una responsabilidad
            intransferible del Estado, y esta misión no puede llevarse a cabo si se toman
            enfoques comerciales y de mercado. Para desarrollar políticas de vivienda efectivas
            se requieren instituciones especializadas como lo son el BHU y la Agencia Nacional
            de Vivienda (ANV), en coordinación con el Ministerio de Vivienda.
          retrieved_at: 2026-09-09
        - url: https://www.aebu.org.uy/noticias/40032
          medio: aebu
          fecha: 2023-11-08
          tipo: documento_oficial
          titulo: ANV y BHU esenciales para garantizar derecho a la vivienda - fusión BROU-BHU
          cita: |-
            El informe del Consejo Central destaca como un logro haber podido evitar que se
            debatiera la fusión del BROU y el BHU, una iniciativa que habría debilitado la
            capacidad de este último para cumplir con su misión de facilitar el acceso a la
            vivienda para todos los uruguayos.
          retrieved_at: 2026-09-09
    - texto: La reestructura del BHU busca fortalecerlo como institución financiera estatal dedicada a
        facilitar el acceso a la vivienda a través del crédito hipotecario, desarrollando productos
        crediticios accesibles a la población con capacidad de repago pero históricamente no
        atendida por el resto de la banca, y no solo a competir con la banca privada en los
        segmentos que esta ya cubre.
      quien: Ministro de Vivienda, Ordenamiento Territorial y Medio Ambiente Mariano Arana, al presentar
        el proyecto de reestructura del BHU y creación de la ANV, gobierno de Tabaré Vázquez
      fuentes:
        - url: http://archivo.presidencia.gub.uy/_web/noticias/2006/11/2006110708.htm
          medio: presidencia
          fecha: 2006-11-07
          tipo: documento_oficial
          titulo: Gobierno crea Agencia Nacional de Vivienda y reestructura BHU
          cita: Asimismo se pretende fortalecer al Banco Hipotecario del Uruguay para que funcione como
            institución financiera estatal dedicada a facilitar el acceso a la vivienda a través de
            la concepción de créditos hipotecarios.
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: Los bancos estatales BROU y BHU tienen garantías de depósito totales, mandatadas por sus
        propias cartas orgánicas, lo que les da una ventaja competitiva frente a la banca privada.
      quien: Misión conjunta del Fondo Monetario Internacional y el Banco Mundial (Programa de Evaluación
        del Sector Financiero, FSAP, informe de mayo de 2013)
      fuentes:
        - url: https://www.imf.org/external/pubs/ft/scr/2013/cr13152.pdf
          medio: fmi
          fecha: 2013-05-01
          tipo: documento_oficial
          titulo: "Uruguay: Financial System Stability Assessment (IMF Country Report No. 13/152) - párrafo
            43, marco de seguro de depósitos"
          cita: >-
            (iv) state banks BROU and BHU have blanket

            deposit guarantees mandated by their charters, providing them with a competitive
            advantage.
          retrieved_at: 2026-09-09
    - texto: La intervención de una institución estatal como el BHU en el contrato de hipoteca conlleva
        una serie de ventajas para el acreedor sobre la hipoteca pactada entre particulares, entre
        ellas la posibilidad de ejecutar extrajudicialmente al deudor moroso; el sector privado se
        ha visto discriminado por vía jurídica a favor del BHU en lo que tiene que ver con las
        posibilidades de ejecución de morosos, y el hecho de no tener que pasar por el procedimiento
        de ejecución judicial es una de las diferencias fundamentales entre el sector público y el
        sector privado, que explica en buena medida la desproporción en su desarrollo relativo
        dentro del mercado hipotecario.
      quien: Eduardo Gandelman y Néstor Gandelman, economistas, en el Documento de Trabajo N° 503 del
        Departamento de Investigación del Banco Interamericano de Desarrollo (BID)
      fuentes:
        - url: https://publications.iadb.org/publications/spanish/document/Los-efectos-del-sector-p%C3%BAblico-en-el-financiamiento-de-la-vivienda-el-mercado-hipotecario-de-Uruguay.pdf
          medio: bid
          fecha: 2004-01-01
          tipo: documento_oficial
          titulo: "Los efectos del sector público en el financiamiento de la vivienda: el mercado hipotecario
            de Uruguay - Resumen"
          cita: En cuanto al sector privado, el mismo es discriminado en favor de esta institución pública en
            lo que tiene que ver con la posibilidad de ejecución de préstamos morosos.
          retrieved_at: 2026-09-09
        - url: https://publications.iadb.org/publications/spanish/document/Los-efectos-del-sector-p%C3%BAblico-en-el-financiamiento-de-la-vivienda-el-mercado-hipotecario-de-Uruguay.pdf
          medio: bid
          fecha: 2004-01-01
          tipo: documento_oficial
          titulo: "Los efectos del sector público en el financiamiento de la vivienda: el mercado hipotecario
            de Uruguay - conclusión sobre ejecución extrajudicial"
          cita: En conclusión, el hecho de no tener que pasar por el procedimiento de ejecución (en el caso de
            la ejecución extrajudicial fundamentalmente pero también de la rescisión administrativa)
            es una de las diferencias fundamentales entre el sector público y el sector privado, y
            explica en buena medida la desproporción en su desarrollo relativo.
          retrieved_at: 2026-09-09
