monopolio:
  tiene: false
  alcance: 'El BHU no tiene hoy actividades reservadas por ley: el privilegio exclusivo original
    (artículo 3 de la Carta Orgánica, Ley 5.343 de 1915) era sobre "la emisión de títulos, bonos y
    obligaciones hipotecarias", no sobre el otorgamiento de préstamos, y quedó derogado por el
    artículo 35 de la Ley 16.774, en la redacción dada por el artículo 1 de la Ley 17.202
    (promulgada el 24/9/1999). Desde entonces el BHU compite con los bancos privados de plaza
    autorizados por el BCU en crédito hipotecario. Conserva, sin embargo, dos privilegios legales
    frente a esa banca privada. Primero, la garantía del Estado: el artículo 8 de la Carta Orgánica
    establece que "el Estado garantiza el servicio de intereses y amortizaciones de las Cédulas,
    Títulos y Obligaciones Hipotecarias del Banco, el pago de los Bonos, el de los depósitos que se
    hagan en su caja de ahorros y, en general, todas las operaciones que realice", garantía que un
    estudio del FMI y el Banco Mundial de 2013 describió como una "ventaja competitiva" compartida
    con el BROU. Segundo, la ejecución extrajudicial: el artículo 80 de la Carta Orgánica permite al
    Banco, ante el incumplimiento del deudor, "proceder a la venta de las propiedades hipotecadas
    por sí, y sin forma alguna de juicio, ordenando el remate público", mientras que un acreedor
    hipotecario privado debe recurrir a la vía judicial. La Ley 18.125 (27/4/2007), que reestructuró
    el Banco y creó la Agencia Nacional de Vivienda (ANV), lo redefinió como "institución financiera
    especializada en el crédito hipotecario" sin restablecer ninguna exclusividad de mercado ni
    tocar esos dos privilegios.'
