resumen: >-
  El Banco Hipotecario del Uruguay (BHU) es un banco estatal de crédito hipotecario, creado en 1892
  (Ley 2.175) sobre la sección hipotecaria del Banco Nacional en liquidación y estatizado en 1912.
  Su Carta Orgánica (Ley 5.343, 1915) le dio, además del negocio de préstamos para vivienda, dos
  privilegios que todavía conserva: la garantía del Estado sobre sus operaciones (artículo 8) y la
  facultad de ejecutar extrajudicialmente al deudor moroso, sin pasar por la vía judicial (artículo
  80). Desde 1999 (Ley 17.202) el BHU no tiene ninguna actividad reservada por ley: compite con la
  banca privada en crédito hipotecario en un mercado abierto.


  La crisis bancaria de 2002 le costó al BHU una pérdida de $ 22.831,3 millones (unos USD 839,4
  millones al tipo de cambio de ese año) y el Estado lo capitalizó ese mismo año por $ 19.936,8
  millones, y en 2003 por otros $ 3.375,0 millones, según sus propios balances publicados por el
  Banco Central. La Ley 18.125 (2007) reestructuró al banco, creó una agencia hermana para la
  cartera de difícil cobro y los deudores morosos (la Agencia Nacional de Vivienda, ANV) y le
  transfirió buena parte de sus sucursales y personal. La capitalización que esa ley autorizó, hasta
  USD 250 millones, se ejecutó recién en marzo de 2009: el Estado de Evolución del Patrimonio y el
  flujo de financiamiento del balance de 2009 registran una integración de capital de $ 5.343,3
  millones (unos USD 272,3 millones); el mismo balance describe además, en una nota aparte, un
  mecanismo más chico y distinto -el Ministerio de Economía y Finanzas asumió pasivos del banco por
  $ 11.860,96 millones a cambio de activos por $ 11.278,18 millones, una diferencia neta de $ 582,8
  millones- sin conciliar las dos cifras entre sí.


  En dólares, el BHU perdió dinero los tres años de la crisis (2001 a 2003) y volvió a números
  positivos desde 2004, con una sola excepción (2005, una pérdida de USD 9,1 millones). Desde
  entonces tuvo resultados positivos todos los años cargados, entre un mínimo de USD 14,7 millones
  (2016) y un máximo de USD 210,7 millones (2007); en 2024 ganó USD 82,1 millones.


  En criterio de caja -lo que efectivamente salió del banco, no lo que se previó en el presupuesto-
  el BHU vertió a Rentas Generales $ 638,962 millones en 2023 (la suma de dos distribuciones
  previstas en 2021 y 2022 que quedaron como pasivo hasta que se cancelaron ese año) y $ 400
  millones más en 2024. El balance dice explícitamente que no hubo distribución de utilidades en
  2007, 2015, 2016 y 2018 a 2020; para 2008 a 2013 no se encontró la nota que lo aclare.


  De los dos privilegios que el BHU conserva desde 1999, un estudio del FMI y el Banco Mundial de
  2013 critica la garantía del Estado como una ventaja competitiva frente a la banca privada, y un
  documento de trabajo del BID de 2004 critica la ejecución extrajudicial como una discriminación en
  contra del acreedor privado. A favor de la existencia de un banco público de vivienda se
  pronunciaron AEBU (2023) y el Poder Ejecutivo al presentar la reestructura de 2007, pero ninguna
  de las dos fuentes defiende específicamente esos dos privilegios puntuales. Buscando lo mismo del
  otro lado -Hemeroteca del Parlamento, exposición de motivos de la Ley 18.125, la propia AEBU y el
  BHU- no se encontró una defensa concreta y contemporánea de la garantía del Estado ni de la
  ejecución extrajudicial en particular.


  El ejercicio 2014 queda sin datos: la única publicación de ese año en el sitio del banco (una
  memoria) no trae los estados contables auditados en su versión de texto, y el Banco Central -que
  publica los balances del BHU desde 2001- no tiene capturas de esa serie después de 2011 en el
  archivo de Wayback; desde entonces los publica en un buscador de registros que no se pudo
  consultar en esta corrida.


  Cómo leer la tabla: las cifras son del banco individual, no del consolidado con sus fideicomisos.
  Los dólares se calculan con el tipo de cambio de cierre que declara cada balance; 2018 queda sin
  esa conversión porque ese balance no declaró una tasa de cierre. El BHU adoptó las normas
  internacionales de contabilidad (NIIF) desde el ejercicio 2018 y reexpresó 2017 a modo de
  comparación; donde las dos versiones de 2017 difieren, se usó la reexpresada, con el dato original
  declarado aparte (mismo criterio que la ficha de BROU para su propio año de transición). El banco
  declara en sus balances un único segmento de negocio, crédito hipotecario a personas físicas, por
  lo que no hay una tabla de segmentos que cargar en ningún año. No se carga una cifra de "deuda
  financiera": en un banco los pasivos son depósitos del público y valores emitidos para financiar
  la cartera, no una deuda adicional, el mismo criterio que usa la ficha del BROU; el BHU sí emite
  Obligaciones Hipotecarias Reajustables, con nota propia en sus balances ($ 18.374,9 millones al
  31/12/2023).
