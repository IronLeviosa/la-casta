        titulo: Fuerte baja en la tasa hipotecaria del BHU para competir con los bancos privados - la cifra
          del BHU
        cita: >-
          "Con el fin de adaptar las tasas de interés a las necesidades de sus clientes, el Banco

          Hipotecario del Uruguay (BHU) adecuó su tarifario, pasando de un 5% de interés a un 3,75%
          para

