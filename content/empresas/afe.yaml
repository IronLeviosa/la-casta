que_hace: AFE es el ente autónomo que desde 1952 presta el servicio de transporte ferroviario del
  Estado uruguayo. Por su ley de creación y su carta orgánica de 1975 tenía a su cargo tanto el
  transporte de pasajeros y cargas por vía férrea como la construcción y conservación de las líneas
  y la explotación de servicios complementarios. Desde 2022, por la Ley 20.075, las competencias
  sobre construcción y conservación de la infraestructura ferroviaria, los convenios de
  interconexión internacional y el retiro y reposición de material ferroviario pasaron a la
  Dirección Nacional de Transporte Ferroviario (DNTF) del Ministerio de Transporte y Obras Públicas
  (MTOP); desde entonces la actividad principal de AFE es el transporte de pasajeros y la
  explotación de servicios complementarios o accesorios (hoy, una sola línea activa entre Tacuarembó
  y Rivera), mientras el transporte de cargas se presta a través de la empresa Servicios Logísticos
  Ferroviarios S.A. (SELF, de la que AFE tiene el 51%) y de otros operadores habilitados por la DNTF
  en un régimen de acceso abierto a la red ferroviaria nacional.
