resumen: >-
  AFE es el ente autónomo que presta el transporte ferroviario del Estado uruguayo desde 1952. Hasta
  2022 tenía a su cargo, además del transporte, la construcción y conservación de la infraestructura
  ferroviaria y los convenios de interconexión internacional; la Ley 20.075 transfirió esas
  competencias a la Dirección Nacional de Transporte Ferroviario (DNTF) del Ministerio de Transporte
  y Obras Públicas (MTOP), que desde entonces administra la red. Hoy AFE opera la única línea de
  pasajeros activa (Tacuarembó-Rivera) y comparte el transporte de cargas con la sociedad estatal
  Servicios Logísticos Ferroviarios (SELF, de la que tiene el 51%) y con operadores privados
  habilitados en un sistema de acceso abierto.

  Esta ficha carga el resultado del ejercicio desde 2011, con huecos: no hay estados contables de
  AFE para 2013, 2014 y 2015 (solo memorias operativas, con datos de tráfico pero sin balance), y
  2016 se toma de la columna comparativa del balance de 2017 porque no hay un balance propio de ese
  año. Para 1952-2010 no se buscaron balances en esta corrida. 2011 y 2012 miden la capitalización
  del Estado con el criterio de caja del "Balance General del Organismo" bajo la Ley 17.040, sin una
  cotización de cierre confiable en esos documentos; desde 2016 los balances son individuales o
  separados bajo Normas Internacionales de Información Financiera para PYMES y miden la
  capitalización por el aumento devengado de la cuenta Capital.

  AFE tuvo pérdidas todos los años de la serie. En pesos: $561,6 millones en 2011 y $526,4 millones
  en 2012, sin balance propio para 2013-2015. Desde 2016, ya en dólares: USD 21,0 millones en 2016,
  USD 17,0 millones en 2017 (cifra reexpresada por el balance siguiente; el propio balance de 2017
  declaraba una pérdida distinta, con una diferencia de $35,96 millones que ningún documento
  explica), USD 21,3 millones en 2018 y USD 21,0 millones en 2019. En el gobierno de Lacalle Pou
  (2020-2024) la pérdida fue de USD 20,9 millones en 2020 (pandemia), USD 19,4 millones en 2021, USD
  21,7 millones en 2022 y USD 25,1 millones en 2023, la mayor de la serie; en 2024, ya con Orsi,
  bajó a USD 18,5 millones. Las diferencias entre el resultado propio de 2021, 2022 y 2023 y el que
  muestra, reexpresado, el balance del año siguiente están explicadas con monto y concepto por los
  propios balances de AFE (reclasificaciones y correcciones contables menores); la de 2017 es la
  única sin explicación documentada.

  El Estado capitalizó a AFE todos los años mediante la subcuenta "Asistencia financiera" de la
  cuenta Capital (un subsidio operativo): $499,3 millones en 2011 y $853,0 millones en 2012, y
  luego, ya en dólares, entre USD 13,7 millones (2024) y USD 25,8 millones (2016). Esta cifra no
  incluye los aportes del FOCEM (Fondo para la Convergencia Estructural del Mercosur) para obras de
  vías en las líneas de Rivera y Artigas, que existieron en 2016, 2017, 2018, 2019, 2020 y 2021, con
  un máximo de $1.834,5 millones en 2018 (el 78% de lo que creció la cuenta Capital ese año); desde
  2022 no hubo más aportes de ese fondo. Tampoco incluye el salto de otra subcuenta patrimonial,
  "Cap. por inversiones", que subió $230,6 millones en 2020 y $2.102,4 millones en 2021 (el 76% de
  lo que creció la cuenta Capital ese año) sin que ningún balance narre el origen de ese aumento; el
  informe de auditoría de los estados financieros 2022 menciona que en 2021 AFE reclasificó $2.306,8
  millones de materiales de infraestructura ferroviaria, antes contabilizados como inventario, al
  rubro Propiedad, Planta y Equipo, una cifra cercana pero que ningún documento vincula
  explícitamente con ese movimiento patrimonial; queda como una hipótesis a confirmar con la memoria
  de gestión de AFE de esos años.

  AFE está exonerada de todo tributo por el artículo 17 de su carta orgánica (Decreto-Ley 14.396,
  1975), con la excepción de las tarifas por servicios efectivamente prestados; en la práctica paga
  o retiene por cuenta de terceros menos de USD 1 millón al año (pago mínimo de IRAE más retenciones
  de IVA, IRAE, IRPF e IRNR) y no transfiere nada a Rentas Generales en ningún año de la serie. Su
  deuda financiera —préstamos con el BROU para material rodante— bajó de USD 1,5 millones en 2016 a
  cero desde 2023, cuando canceló el último préstamo pendiente.

  Los estados contables de AFE tuvieron abstención de opinión del auditor externo en 2018 (Crowe
  Global), 2020 (Ecovis) y 2022 (RSM), y del Tribunal de Cuentas en 2024, en los cuatro casos por la
  falta de un detalle confiable de terrenos, edificios y material rodante; en 2022 el auditor señaló
  además una incertidumbre material sobre la continuidad de AFE como empresa en funcionamiento. El
  Tribunal de Cuentas constató en su dictamen de 2024 el incumplimiento de dos normas de publicación
  de estados financieros (Ley 19.438, artículo 190, y Ley 19.889, artículo 286).

  Los ingresos operativos por división (los balances no informan un resultado separado por segmento,
  solo ingresos) cayeron de $118,1 millones en 2016 a $42,5 millones en 2017 y a $3,7 millones en
  2024: el salto mayor ocurrió porque la sociedad estatal SELF, que hasta entonces contrataba a AFE
  para transportar sus cargas, dejó de hacerlo desde enero de 2018, y el ingreso por canon y por
  servicio de pasajeros nunca lo compensó.

  AFE tuvo el transporte ferroviario reservado por ley desde su creación (Ley 11.859, 1952, y su
  carta orgánica de 1975) hasta una apertura gradual: la Ley 17.243 (2000) habilitó el uso de las
  vías por otras empresas mediante peaje; la Ley 17.930 (2005) autorizó la sociedad estatal SELF
  (constituida en 2011, 51% AFE y 49% CND) para el transporte de cargas; y la Ley 20.075 (2022)
  transfirió a la DNTF la administración de la infraestructura, dejando a AFE sin actividad
  reservada en exclusiva. Hoy el transporte por la red es, según la propia DNTF, un "sistema
  abierto": AFE es el único operador de pasajeros y comparte cargas con SELF, con el operador
  privado Portren (con contrato exclusivo con UPM en el tramo del Ferrocarril Central) y con el
  Grupo RAS. El Ferrocarril Central, construido y mantenido por el consorcio privado Grupo Vía
  Central bajo un contrato de participación público-privada, generó un diferendo de pagos que el
  Estado cerró en mayo de 2025 con un acuerdo de USD 144 millones (sujeto a la revisión de un
  mediador durante 60 días) y un nuevo canon a los operadores de carga —0,005 dólares por tonelada
  bruta transportada por kilómetro, según fuentes del gobierno citadas por la prensa— hoy a cargo de
  UPM. A favor del diseño actual se documentan el marco general de participación público-privada,
  que exige demostrar que otras formas de contratación no sirven mejor al interés público (OPP), y
  la posición del director de la DNTF de que el sistema debe ser mixto, con el Estado aportando
  infraestructura y patrimonio a través de AFE; en contra, el presidente de la Unión Ferroviaria
  sostuvo ante el Parlamento que el acceso abierto terminó constituyendo un monopolio de hecho de la
  empresa privada Portren sobre el tramo del Ferrocarril Central, y el sindicato denunció un
  "desmantelamiento sostenido" del ente estatal en el marco de esa apertura.
