  argumentos_a_favor:
    - texto: Los contratos de Participación Público-Privada, régimen que el Poder Ejecutivo aplicó para
        construir el Ferrocarril Central, solo pueden celebrarse cuando se demuestra previamente que
        otras formas de contratación no permiten satisfacer mejor el interés público, y deben
        respetar principios de distribución de riesgos, responsabilidad fiscal y transferencia de la
        infraestructura al Estado al finalizar el contrato.
      quien: Oficina de Planeamiento y Presupuesto (OPP), sobre el régimen general de los contratos de
        Participación Público-Privada (Ley 18.786)
      fuentes:
        - url: https://www.opp.gub.uy/es/participacion-publico-privada
          medio: opp
          fecha: 2026-09-09
          tipo: documento_oficial
          titulo: Participación Público y Privada | OPP
          cita: Sólo podrán celebrarse Contratos de Participación Público-Privada cuando previamente se
            resuelva que otras modalidades alternativas de contratación no permiten la mejor forma
            de satisfacción de las finalidades públicas
          archived_url: https://web.archive.org/web/20260909042055/https://www.opp.gub.uy/es/participacion-publico-privada
          retrieved_at: 2026-09-09
    - texto: "El sistema ferroviario debe desarrollarse con participación de ambos sectores: el Estado
        aporta la infraestructura y el patrimonio, y opera a través de AFE, mientras otros
        operadores -públicos o privados- pueden sumarse bajo las mismas reglas de acceso a la red."
      quien: Waverley Tejera, director de la Dirección Nacional de Transporte Ferroviario (DNTF, MTOP)
      fuentes:
        - url: https://www.gub.uy/presidencia/comunicacion/noticias/ferrocarril-central-tren-uruguay-mtop
          medio: presidencia
          fecha: 2025-11-18
          tipo: nota
          titulo: '"El ferrocarril es el camino correcto", indicó la ministra Etcheverry'
          cita: Estamos trabajando para desarrollar un sistema ferroviario donde participen ambos sectores,
            con el Estado aportando infraestructura, patrimonio y operación a través de AFE
          archived_url: https://web.archive.org/web/20260730222540/https://www.gub.uy/presidencia/comunicacion/noticias/ferrocarril-central-tren-uruguay-mtop
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: El "open access" (sistema abierto) tiende a beneficiar a las grandes empresas por su
        capacidad de precontratar el espacio de la vía, y en Uruguay, además, se sumaron
        restricciones técnicas para el ingreso de otras cargas al tramo del Ferrocarril Central
        -sobre todo el acceso al puerto de Montevideo, hoy reservado de hecho a la conexión de UPM-
        que en la práctica constituyen un monopolio de la empresa privada Portren; desde la creación
        de la unidad ejecutora (DNTF) no hubo avances tangibles hacia la libre competencia prometida
        por el nuevo sistema.
      quien: Washington Sánchez, presidente de la Unión Ferroviaria (sindicato de trabajadores de AFE)
      fuentes:
        - url: https://infolegislativa.parlamento.gub.uy/temporales/0566.PDF
          medio: parlamento
          fecha: 2026-06-17
          tipo: diario_de_sesiones
          titulo: Versión taquigráfica, Comisión de Transporte, Comunicaciones y Obras Públicas (Cámara de
            Representantes) - recepción a la Unión Ferroviaria
          cita: el open access tiende a beneficiar más a las grandes empresas que a las pequeñas o medianas
            por su capacidad de precontratar el espacio, pero en Uruguay se han sumado ciertas
            restricciones técnicas para el ingreso de otras mercaderías a las vías del Ferrocarril
            Central, lo que se viene constituyendo de hecho un monopolio de la empresa Portren.
          archived_url: https://web.archive.org/web/20260909052915/https://infolegislativa.parlamento.gub.uy/temporales/0566.PDF
          retrieved_at: 2026-09-09
    - texto: El sindicato de AFE denuncia un "desmantelamiento sostenido" del ente estatal, que atribuye
        en parte a recortes presupuestales de la Oficina de Planeamiento y Presupuesto (OPP), en el
        marco del traspaso de la infraestructura a la DNTF y la apertura del sistema a otros
        operadores.
      quien: Unión Ferroviaria (sindicato de trabajadores de AFE)
      fuentes:
        - url: https://ladiaria.com.uy/trabajo/articulo/2025/1/sindicato-de-afe-denuncia-desmantelamiento-sostenido-de-la-empresa-ante-incidente-de-tren-de-pasajeros/
          medio: la-diaria
          fecha: 2025-01-14
          tipo: nota
          titulo: Sindicato de AFE denuncia "desmantelamiento sostenido" de la empresa ante incidente de tren
            de pasajeros
          cita: La Unión Ferroviaria, sindicato que nuclea a los trabajadores de AFE, emitió un comunicado
            respecto del incidente en el que denuncia el "desmantelamiento sostenido" del ente y
            apunta a la "tijera infame de OPP
          retrieved_at: 2026-09-09
