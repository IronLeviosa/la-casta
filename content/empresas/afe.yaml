monopolio:
  tiene: false
  alcance: 'La Ley 11.859 (1952) y su carta orgánica, el Decreto-Ley 14.396 (1975), reservaron a AFE
    el transporte ferroviario de pasajeros y cargas, la construcción y conservación de las líneas
    férreas y del material rodante, y la suscripción de convenios de interconexión ferroviaria
    internacional (artículo 3, literales A, C y E). La Ley 17.243 (2000), artículo 21, habilitó por
    primera vez al Poder Ejecutivo a autorizar a otras empresas a usar las vías pagando un peaje a
    AFE. La Ley 17.930 (2005), artículo 206, autorizó a AFE a integrar una sociedad anónima con la
    Corporación Nacional para el Desarrollo (CND) para el transporte de cargas; esa sociedad,
    Servicios Logísticos Ferroviarios S.A. (SELF), quedó constituida en 2011 por el Decreto 473/011
    con 51% de AFE y 49% de la CND, ambas de capital estatal. La Ley 18.834 (2011), artículo 173,
    creó la Dirección Nacional de Transporte Ferroviario (DNTF) dentro del MTOP. Finalmente, la Ley
    20.075 (2022), artículo 243, transfirió a la DNTF las competencias de AFE sobre construcción y
    conservación de la infraestructura, convenios de interconexión internacional y retiro o
    reposición de material ferroviario (literales C, E y F del artículo 3 de su carta orgánica).
    Desde esa transferencia, AFE ya no administra la infraestructura ferroviaria ni tiene ninguna
    actividad reservada por ley en exclusiva: la administración de la red quedó en cabeza de la DNTF
    (un organismo estatal, no de AFE), y el transporte de pasajeros y de cargas por la red es, según
    la propia DNTF, un "sistema abierto" en el que cualquier empresa habilitada, pública o privada,
    puede operar pagando un canon. En la práctica, hoy AFE es el único operador de pasajeros (con
    una sola línea activa entre Tacuarembó y Rivera) y comparte el transporte de cargas con SELF
    (51% de AFE), Portren (operador privado con contrato exclusivo con UPM) y el Grupo RAS (operador
    en formación), según describió la Unión Ferroviaria ante el Parlamento en 2026. El tramo
    Montevideo-Paso de los Toros (Ferrocarril Central) fue construido y es mantenido por el
    consorcio privado Grupo Vía Central bajo un contrato de Participación Público-Privada (Ley
    18.786), con pagos por disponibilidad del Estado al consorcio y, desde mayo de 2025, un canon de
    operadores que la ministra de Transporte anunció como "similar a un peaje"; según fuentes del
    gobierno citadas por El Observador, la tarifa es de 0,005 dólares por tonelada bruta
    transportada por kilómetro y recae hoy sobre UPM por ser el único operador de carga que usa ese
    tramo.'
