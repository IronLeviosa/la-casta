  argumentos_a_favor:
    - texto: El presidente José Mujica dudó en abrir a la competencia el tendido de fibra óptica para
        llevar internet a los hogares porque entendía que, si se permite la competencia, el mercado
        termina concentrado en dos o tres empresas transnacionales; según El Observador, decidió
        mantener el monopolio de ANTEL sobre esa infraestructura y enviar al Parlamento un proyecto
        de ley en ese sentido.
      quien: José Mujica, presidente de la República (según cobertura de El Observador, 2012)
      fuentes:
        - url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
          medio: el-observador
          fecha: 2012-05-19
          tipo: nota
          titulo: Servicios monopólicos de ANTEL son más caros que los de la región
          cita: el presidente Mujica se había mostrado dubitativo porque entendía que si se da competencia el
            mercado "termina en dos o tres empresas transnacionales", pero de lo contrario se le
            crea "un problema jurídico al país". Finalmente decidió laudar a favor de ANTEL y
            enviará un proyecto de ley con el monopolio para la telefónica.
          retrieved_at: 2026-09-08
    - texto: ANTEL es un "monopolio natural" y en términos económicos es más barato brindar el servicio
        con una sola empresa; las empresas privadas no aportarían nada en términos de cobertura, y
        la apertura deteriora una herramienta de política que dio acceso a internet a "relativamente
        todo el pueblo uruguayo" en calidad, precio y cobertura pocas veces vistos a nivel mundial.
      quien: Daniel Larrosa, director representante del Frente Amplio en el directorio de ANTEL (2022)
      fuentes:
        - url: https://www.montevideo.com.uy/En-Perspectiva/Decreto-que-quita-monopolio-a-Antel-puede-ser-perjudicial-para-el-pueblo-dijo-Larrosa-uc825347
          medio: montevideo-portal
          fecha: 2022-06-17
          tipo: nota
          titulo: Decreto que quita monopolio a Antel puede ser "perjudicial" para el pueblo, dijo Larrosa
          cita: Larrosa insistió en que las empresas privadas "no aportarían nada en términos de cobertura".
            Larrosa dijo que, al tomar esta medida, "deterioran una herramienta de política
            fundamental que ha permitido el acceso a internet de relativamente todo el pueblo
            uruguayo a calidades, precios y cobertura en general pocas veces visto a nivel mundial".
          retrieved_at: 2026-09-08
        - url: https://www.montevideo.com.uy/En-Perspectiva/Decreto-que-quita-monopolio-a-Antel-puede-ser-perjudicial-para-el-pueblo-dijo-Larrosa-uc825347
          medio: montevideo-portal
          fecha: 2022-06-17
          tipo: nota
          titulo: Decreto que quita monopolio a Antel puede ser "perjudicial" para el pueblo, dijo Larrosa (2)
          cita: Larrosa explicó que Antel es un "monopolio natural" y que en términos económicos "es más
            barato brindarlo con una sola empresa".
          retrieved_at: 2026-09-08
    - texto: El monopolio de ANTEL tiene sustento histórico, marco legal y el respaldo de la ciudadanía
        expresado en una consulta (en referencia al referéndum de 1992 contra la privatización de
        empresas públicas).
      quien: Alberto Grille, director de Caras y Caretas (columna de opinión, 2022)
      fuentes:
        - url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
          medio: caras-y-caretas
          fecha: 2022-06-26
          tipo: nota
          titulo: El monopolio de Antel en la transmisión de datos es ley
          cita: El monopolio de Antel tiene un sustento histórico, un marco legal y el respaldo de la
            ciudadanía en una consulta histórica.
          retrieved_at: 2026-09-08
  argumentos_en_contra:
    - texto: Los monopolios establecidos por ley son excepción en el mundo y se dan solo cuando es
        imprescindible; son escasos incluso en telefonía fija tradicional en América Latina. ANTEL
        no puede ser responsabilizada de la situación porque procede como cualquier otra empresa,
        pero conviene observar cómo el monopolio por ley afecta a los ciudadanos.
      quien: Omar de León, experto en comunicaciones (según cobertura de El Observador, 2012)
      fuentes:
        - url: https://www.elobservador.com.uy/nota/servicios-monopolicos-de-antel-son-mas-caros-que-los-de-la-region-20125192280
          medio: el-observador
          fecha: 2012-05-19
          tipo: nota
          titulo: Servicios monopólicos de ANTEL son más caros que los de la región
          cita: '"Los monopolios establecidos por ley son excepción en el mundo y se dan solo cuando es
            imprescindible. Los monopolios, aun en telefonía fija tradicional, son muy escasos
            incluso en América Latina. Si bien ANTEL no puede ser responsabilizada de la situación
            ya que procede como cualquier otra empresa, y es como debe ser, es conveniente observar
            cómo afecta a los ciudadanos uruguayos el establecimiento de un monopolio por ley", dijo
            a El Observador el experto en comunicaciones Omar de León.'
          retrieved_at: 2026-09-08
    - texto: El monopolio de ANTEL sobre la fibra óptica implementa "prácticas abusivas" en el servicio de
        internet fija al hogar.
      quien: Claro (según nota de El Observador del 8 de mayo de 2020, resumida por En Perspectiva)
      fuentes:
        - url: https://enperspectiva.uy/en-perspectiva-programa/titulares/noticias-del-viernes-8-mayo-2020/
          medio: en-perspectiva
          fecha: 2020-05-08
          tipo: nota
          titulo: Noticias del viernes 8 de mayo de 2020
          cita: Claro, en tanto, hizo foco en el actual monopolio de Antel a la que acusó de implementar
            "prácticas abusivas" en el servicio de internet fija al hogar.
          retrieved_at: 2026-09-08
    - texto: Movistar, junto con Claro, calificó como contraria a la "sana competencia" la decisión de
        excluir a las telefónicas móviles del negocio de internet a los hogares, reservado a las
        empresas con licencia de televisión por cable. Movistar agregó que limitar el acceso a la
        infraestructura de fibra óptica dificultaría el despliegue de tecnologías como el 5G, y que
        dejar operadores afuera del proyecto haría perder la oportunidad de impulsar uno de los
        sectores más dinamizadores de la economía.
      quien: Movistar (según nota de El Observador del 8 de mayo de 2020, resumida por En Perspectiva; la
        nota original de El Observador no se pudo ubicar y abrir en esta sesión)
      fuentes:
        - url: https://enperspectiva.uy/en-perspectiva-programa/titulares/noticias-del-viernes-8-mayo-2020/
          medio: en-perspectiva
          fecha: 2020-05-08
          tipo: nota
          titulo: Noticias del viernes 8 de mayo de 2020
          cita: Las dos empresas de telefonía móvil opinaron, en nota con El Observador, que no abrir el
            mercado a todos los operadores va en contra de la “sana competencia”. Afirmaron que es
            “fundamental” que todos los actores de la industria de las telecomunicaciones puedan
            brindar una mayor cantidad de servicios ya que eso redundará en “más beneficios para los
            consumidores”. Movistar expresó en su respuesta por escrito que “limitar el acceso a esa
            infraestructura (fibra óptica) -o solo permitírsela a algunas empresas- dificultará la
            posibilidad de que en nuestro país contemos en los próximos años con nuevas tecnologías
            -como la 5G- que otros países ya han comenzado a desplegar”. Para Movistar, en caso de
            que el proyecto se apruebe tal como fue presentado y deje afuera algunos operadores, se
            perdería la “oportunidad de impulsar el desarrollo de uno de los sectores más
            dinamizadores de la economía”
          retrieved_at: 2026-09-08
    - texto: El artículo 56 de la ley de medios establecía un monopolio de hecho a favor de ANTEL sin
        cumplir con las previsiones constitucionales, limitando la competencia en un mercado que
        debería ser libre, sin ningún beneficio para el interés general.
      quien: Cristina Olaso, abogada de tres de las empresas cableoperadoras beneficiadas (según El
        Observador, 2022)
      fuentes:
        - url: https://www.elobservador.com.uy/nota/gobierno-habilito-a-cables-del-interior-a-ofrecer-internet-y-antel-pierde-su-monopolio--2022616135432
          medio: el-observador
          fecha: 2022-06-16
          tipo: nota
          titulo: "Antel pierde su monopolio: gobierno habilitó a cables a ofrecer internet"
          cita: '"Basados en que se estaría estableciendo un monopolio de hecho a favor de Antel. Sin cumplir
            con las previsiones legales que establece la Constitución, se estaría limitando la
            competencia de un mercado en libre competencia y en definitiva no habría ningún
            beneficio para el interés general el limitar que el proveedor de acceso Internet fuera
            uno solo", explicó a El Observador Cristina Olaso, abogada de tres de las empresas
            beneficiadas.'
          retrieved_at: 2026-09-08
