  - fecha: "1992"
    titulo: Un referéndum frena la privatización de ANTEL prevista en la Ley de Empresas Públicas
    detalle: La Ley 16.211 buscaba privatizar varios servicios públicos, entre ellos ANTEL; el recurso
      de referéndum frenó el proceso.
    fuentes:
      - url: https://www.carasycaretas.com.uy/politica/el-monopolio-antel-la-transmision-datos-es-ley-n53485
        medio: caras-y-caretas
        fecha: 2022-06-26
        tipo: nota
        titulo: El monopolio de Antel en la transmisión de datos es ley
