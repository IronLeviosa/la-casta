    nota: "Es el primer ejercicio en el que consta el mecanismo de pago diferido a Rentas Generales: de
      la transferencia de este año quedó un saldo a reintegrar entre 2016 y 2019 (Nota 19.8 del
      balance 2015), además de lo que se generó en cada uno de esos ejercicios. El mecanismo se
      funda en el artículo 643 de la Ley 16.170 (empresas públicas vierten sus resultados en Rentas
      Generales) y en los decretos 161/91 y 436/002. El resultado y la deuda financiera de este año
      se toman de la columna comparativa del balance de 2016, que es donde se verificó el detalle de
      ambos renglones."
