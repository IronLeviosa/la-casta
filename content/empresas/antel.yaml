que_hace: 'ANTEL es un servicio descentralizado del Estado uruguayo cuyo cometido es la prestación
  de servicios de telecomunicaciones en todo el territorio nacional: telefonía fija, telefonía
  móvil, transmisión de datos y banda ancha (fibra óptica), enlaces internacionales y, en menor
  medida, televisión por streaming (Antel TV/Vera). En telefonía fija opera en un régimen de
  exclusividad: no hay otro operador licenciado para prestarla, y el artículo 115 de la Ley 18.046
  (2006) describe ese servicio como prestado "en condiciones de exclusividad". En transmisión de
  datos y banda ancha fija por fibra óptica compite, desde junio de 2022, con cableoperadores
  privados con licencia Clase B (TCC, Montecable, Nuevo Siglo, Korfield, Praimar); en telefonía
  móvil compite con Movistar y Claro. Opera además, a través de subsidiarias, en asesoramiento en
  telecomunicaciones (ITC S.A.), alojamiento y mantenimiento de sitios web (HG S.A.), servicios de
  call center (Accesa S.A.), telecomunicaciones en Brasil y Argentina, y financió a través de un
  fideicomiso (FAFOAA) la construcción del complejo Antel Arena.'
