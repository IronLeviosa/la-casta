resumen: >-
  ANTEL tuvo resultado positivo los diez años del período que releva esta ficha (2015-2024), con un
  mínimo de $ 1.854,7 millones en 2016 y un máximo de $ 10.765,7 millones en 2021, según sus estados
  financieros individuales auditados.

  Transfirió a Rentas Generales los diez años, con montos que fueron de $ 1.961,3 millones (2015,
  USD 65,5 millones) a $ 7.540,2 millones (2024, USD 171,1 millones). La cifra de cada año es el
  renglón "Contribución a Rentas Generales" del estado de flujos de efectivo (lo que efectivamente
  salió en caja ese ejercicio), no la nota narrativa "Transferencias a Rentas Generales" del mismo
  balance: las dos coinciden en nueve de los diez años, pero en 2022 difieren ($ 5.914,1 millones
  contra $ 4.860,0 millones) y el documento no explica por qué. Parte de lo transferido cada año
  corresponde a resultados de ejercicios anteriores, porque el mecanismo de pago a Rentas Generales
  (artículo 643 de la Ley 16.170 y decretos 161/91 y 436/002) admite diferir el pago; entre 2015 y
  2021 el propio balance documenta saldos de años previos arrastrados al pago del año.

  Pagó impuestos los diez años, de $ 4.392,3 millones (2015) a $ 10.087,1 millones (2024). La cifra
  es una suma que hace este sitio de lo que ANTEL declara como contribuyente (IVA, IRAE, Impuesto al
  Patrimonio) más lo que recauda como agente de retención de terceros (IVA y otros impuestos de
  clientes y empleados); el balance no publica un renglón de "total de impuestos". No hay, en los
  estados contables de 2015 a 2024, ningún registro de que el Estado le haya puesto capital a ANTEL
  en ese período.

  La deuda financiera (préstamos corrientes y no corrientes) es chica frente a lo que ANTEL
  transfiere y factura: pasó de $ 193,9 millones en 2015 a un pico de $ 2.138,7 millones en 2018 y
  bajó de manera sostenida hasta $ 1.103,1 millones en 2024.

  Los balances desagregan el ingreso operativo por línea de negocio, no el resultado (costo y
  ganancia): no se puede saber con esta información qué segmento gana o pierde plata, solo cuánto
  factura cada uno. De los cuatro segmentos con serie completa, el que más creció fue "Servicios de
  datos" (de $ 5.674,4 a $ 19.951,0 millones, casi cuadruplicado); "Servicio móvil" también creció
  de forma sostenida (de $ 12.253,2 a $ 20.567,6 millones). "Telefonía fija" —el único segmento en
  el que ANTEL mantiene exclusividad— es el único que cayó: de $ 5.219,4 a $ 4.065,2 millones, una
  baja del 22% en la década, más marcada desde 2021. Las cifras comparativas que trae el balance de
  cada año siguiente a veces difieren de las del año original por reexpresiones contables (ejemplos:
  "Otros ingresos" de 2018 pasa de $ 71,3 a $ 275,5 millones en la comparativa del balance 2019;
  "Servicios de datos" de 2020 pasa de $ 14.707,5 a $ 14.470,6 millones en la comparativa de 2021);
  esta ficha usa siempre la cifra que publica el balance del año propio.

  ANTEL mantiene hoy exclusividad legal en telefonía fija; en transmisión de datos y banda ancha por
  fibra compite, desde junio de 2022, con cableoperadores privados con licencia Clase B, y en
  telefonía móvil compite con Movistar y Claro desde hace más de una década. Sobre ese diseño hay
  posiciones documentadas de los dos lados: a favor, entre otros, de José Mujica y de un director de
  ANTEL en 2022; en contra, entre otros, de un experto en comunicaciones, de las dos operadoras
  móviles privadas y de la abogada de tres de las empresas cableoperadoras.
