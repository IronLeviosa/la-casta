resumen: >-
  ANTEL tuvo resultado positivo en los 28 ejercicios con dato entre 1997 y 2024, sin una sola
  pérdida registrada en los balances y resúmenes oficiales que releva esta ficha. No hay
  documentación pública de resultados anteriores a 1997: para 1974-1996, los primeros 23 años desde
  la creación de ANTEL, esta ficha no encontró balance, memoria anual ni resumen financiero en el
  sitio de ANTEL, en Wayback Machine, en Yumpu, ni en las búsquedas hechas en el Tribunal de Cuentas
  y el Parlamento.

  Hasta el ejercicio 2011 ANTEL reexpresaba sus estados contables por inflación (ver hito de 2012),
  así que una misma cifra en pesos anterior a esa fecha vale distinto según en qué balance se la
  mire; cada año de esta ficha indica en su nota la moneda de cierre a la que está expresado. Las
  cifras en dólares no cambian por ese efecto, así que son la base que usa esta ficha para comparar
  entre años de todo el período: el resultado del ejercicio fue de un mínimo de USD 44,9 millones
  (2003) a un máximo de USD 253,6 millones (2022). Dos años, 2001 y 2002, no tienen cifra en dólares
  en las fuentes que se pudieron consultar.

  En 2002, en plena crisis financiera, ANTEL tuvo un resultado de $ 1.437,9 millones (sin cifra en
  dólares disponible) y transfirió $ 3.020,2 millones a Rentas Generales; parte de esa
  transferencia, un anticipo de resultados de 2003 por US$ 5,5 millones que la Oficina de
  Planeamiento y Presupuesto le exigió a fin de año, se pagó con títulos públicos en vez de
  efectivo, con una ganancia contable de US$ 1,9 millones por la diferencia entre el valor nominal
  de esos títulos y su valor de mercado (ver hito de diciembre de 2002).

  Transfirió a Rentas Generales todos los años con dato, entre USD 65,5 millones (2015) y USD 273
  millones (2000); las cifras en dólares de 1997 a 2000 son varias veces más altas que las de años
  posteriores porque son anteriores a la fuerte devaluación del peso de 2002, no porque ANTEL
  transfiriera más en términos reales. De 2010 a 2014 el monto nominal en pesos históricos fue el
  mismo cada año, $ 1.867,7 millones, sin que esta ficha haya encontrado la norma que fije ese
  número específico.

  Pagó impuestos, según la suma que hace este sitio de lo que ANTEL declara como contribuyente más
  lo que recauda como agente de retención, en cuatro años del tramo 1997-2014 en los que el balance
  imprime una cifra o un desglose que permite confirmar el total (2008, 2010, 2012 y 2014, entre $
  2.201,3 y $ 3.869,8 millones): en 2009 la única fuente es la columna comparativa del balance de
  2010, que no repite esa nota; en 2007, 2011 y 2013 el balance propio sí trae el detalle de
  conceptos, pero sin una línea de total ni un segundo documento que lo confirme, así que esta ficha
  no publica la suma de una sola lectura de OCR sin confirmar. Desde 2015 el dato está completo los
  diez años, de $ 4.392,3 a $ 10.087,1 millones.

  La deuda financiera (préstamos corrientes y no corrientes) fue chica en toda la serie, igual que
  en 2015-2024; consta desde 1999, con la excepción de los años en que la única fuente es el resumen
  oficial no auditado (1997, 1998 y 2003 a 2006), que no la desagrega.

  En ningún año del período 1997-2024 esta ficha encontró evidencia de que el Estado le haya puesto
  capital a ANTEL: el capital que muestran los balances leídos no varía ($ 390,7 millones en 2007 y
  2008; $ 480,5 millones, sumando Capital y Aportes por Corrección Monetaria, entre 2012 y 2014, la
  última cifra disponible con este detalle).

  Los balances desagregan el ingreso operativo por línea de negocio, no el resultado (costo y
  ganancia): no se puede saber con esta información qué segmento gana o pierde plata, solo cuánto
  factura cada uno, y esto vale para toda la serie, no solo para 2015-2024. En 2007, el primer año
  con esta desagregación, la telefonía (fija, pública y telegrafía, agrupadas en una sola línea
  hasta el balance de 2012) era el segmento que más facturaba, $ 8.488,5 millones, muy por delante
  del servicio móvil ($ 4.651,4 millones); para 2012 el móvil ya la había superado ($ 9.088,0
  millones contra $ 5.947,5 millones), y desde 2015, con los segmentos separados, "Telefonía fija"
  —el único en el que ANTEL mantiene exclusividad— es el único que cayó en la década (de $ 5.219,4 a
  $ 4.065,2 millones, un 22% menos). Para 2000 y 2001 los balances desagregan ingresos por servicio
  (telefonía internacional, transmisión de radio y TV, RDSI, acceso a celulares desde la red fija,
  entre otros), una clasificación distinta de la que usa el resto de esta ficha que no se cargó por
  no ser claramente equivalente. Las cifras comparativas que trae el balance de cada año siguiente a
  veces difieren de las del año original por reexpresiones contables (ejemplos: "Otros ingresos" de
  2018 pasa de $ 71,3 a $ 275,5 millones en la comparativa del balance 2019; "Servicios de datos" de
  2020 pasa de $ 14.707,5 a $ 14.470,6 millones en la comparativa de 2021); esta ficha usa siempre
  la cifra que publica el balance del año propio cuando existe.

  Los años 1997, 1998 y 2003 a 2006 dependen únicamente del resumen oficial "Datos Financieros y
  Operativos Relevantes" que ANTEL publica junto a sus estados contables, no del estado contable
  auditado en sí (que no se localizó para esos años); el resto de la serie -1999 a 2002 y 2007 a
  2024- sale de estados contables con dictamen de los auditores independientes, del que esta ficha
  cita un ejemplo, el del balance de 2001 y 2000, firmado el 12 de abril de 2002.

  ANTEL mantiene hoy exclusividad legal en telefonía fija; en transmisión de datos y banda ancha por
  fibra compite, desde junio de 2022, con cableoperadores privados con licencia Clase B, y en
  telefonía móvil compite con Movistar y Claro desde hace más de una década. Sobre ese diseño hay
  posiciones documentadas de los dos lados: a favor, entre otros, de José Mujica y de un director de
  ANTEL en 2022; en contra, entre otros, de un experto en comunicaciones, de las dos operadoras
  móviles privadas y de la abogada de tres de las empresas cableoperadoras.

  Cómo leer la tabla: resultado_ejercicio es la utilidad neta del ejercicio, deuda_financiera son
  los préstamos corrientes y no corrientes, impuestos_pagados es la suma de lo que ANTEL paga como
  contribuyente y recauda como agente de retención, y transferencias_al_estado es la contribución a
  Rentas Generales; en los segmentos, el campo resultado es siempre el ingreso operativo del
  segmento (nunca el resultado, costo menos ganancia, que el balance no desagrega por línea de
  negocio) y, desde 2022, corresponde al bloque individual de ANTEL, no al consolidado. Cuando el
  año usa la columna comparativa de un balance posterior, las cifras en pesos quedan en la moneda de
  cierre de ese balance posterior, no en la del propio ejercicio; cada nota lo indica cuando
  corresponde. Entre 2003 y 2007, la cifra en dólares de transferencias_al_estado es la
  efectivamente pagada, convertida al tipo de cambio del momento del pago, no al de cierre del
  ejercicio.
revision:
  tier: publicado
  notas_internas: "Objeciones de la crítica sin resolver del todo, ninguna bloqueante (ver razones.md
    para el detalle completo de esta corrida). De la corrida anterior (2015-2024): comparaciones con
    fuente externa (URSEC/UIT/Cable.co.uk/catalogodatos.gub.uy) siguen en dos puntos (2012 y 2023),
    la publicación de Ookla del Speedtest Global Index no se pudo abrir (queda Presidencia como
    única fuente de esa comparación), la sentencia de la SCJ de 2016 y la resolución del directorio
    de 2024 solo constan por cobertura de prensa, y la versión taquigráfica del debate parlamentario
    de la Ley 20.075 no se pudo ubicar. De esta corrida (serie histórica 1997-2014): 2001 y 2002 no
    tienen cifra en dólares (no se persiguió la serie de cotizaciones del BCU que sugirió el
    crítico, queda para una próxima vuelta); los ingresos por servicio de 2000-2001 no se cargaron
    como segmentos por no ser mapeables a la clasificación por división del resto de la ficha (sí se
    documentó su existencia); 1974-1996 sigue sin balance público, con el dictamen del Tribunal de
    Cuentas ante la Asamblea General como única vía previsible no explorada; la agrupación de las
    fuentes repetidas por documento en la página es un cambio de plantilla, no de este YAML. De la
    corrida de OCR de 2007, 2011 y 2013 (2026-09-09): impuestos_pagados queda ausente en los tres
    años, con el mismo criterio (suma del sitio sobre una sola lectura de OCR, sin línea de total
    impresa ni un segundo documento que confirme la suma); ver razones.md de esta corrida para por
    qué se aplicó ese criterio también a 2007, que la vuelta anterior había mantenido con salvedad.
    Segmentos de 2013 sigue citado desde la nota agregada del balance de 2014 (Servicios
    Fijos/Servicios Móviles), no desde el desglose más fino que trae el balance propio de 2013,
    porque las categorías no son equivalentes uno a uno."
