comparaciones:
  - con: Emiratos Árabes Unidos, Catar y Kuwait (1°, 2° y 3° del ranking)
    indicador: velocidad de banda ancha móvil, Speedtest Global Index (julio 2023)
    valor_propio: Uruguay, 149,08 Mbps (4° puesto mundial); Montevideo, 2° ciudad del mundo
    valor_par: Emiratos Árabes Unidos 205,77 Mbps (1°); Catar 186,35 Mbps (2°); Kuwait 160,87 Mbps (3°)
    periodo: julio de 2023
    fuentes:
      - url: https://www.gub.uy/presidencia/comunicacion/noticias/uruguay-se-posiciona-entre-mejores-del-mundo-velocidad-internet-movil
        medio: presidencia
        fecha: 2023-09-05
        tipo: documento_oficial
        titulo: Uruguay se posiciona entre los mejores del mundo en velocidad de internet móvil
        cita: En la clasificación mensual que efectúa el Speedtest Global Index, Uruguay logró un promedio
          de 149,08 megabits por segundo (mbps) y se ubicó 4.° en la lista, precedido por Emiratos
          Árabes Unidos, con 205,77 mbps; Catar, con 186,35, y Kuwait, con 160,87. En tanto, según
          establece dicha herramienta para el mismo intervalo de tiempo, Montevideo se situó en el
          2.° puesto en la clasificación de ciudades con la mejor velocidad de internet móvil.
        retrieved_at: 2026-09-08
