    nota: 'ANCAP publicó originalmente, en sus Estados Financieros Individuales de 2020, una pérdida de
      $ (510.662.282) para el ejercicio (cita: "Resultado del ejercicio (510.662.282)
      1.464.281.136", mismo documento). Los Estados Financieros Individuales de 2021 (Nota 30.2)
      reexpresaron ese resultado en tres columnas: Original (510.662.282), Ajustes 895.776.155,
      Modificado 385.113.873. El motivo, según la Nota 30 de esos mismos estados: "un error en el
      cálculo del impuesto a la renta contabilizado el 31 de diciembre de 2020 y en los impuestos
      liquidados correspondientes a los ejercicios finalizados el 31 de diciembre de 2019 y 2018".
      El ajuste está enteramente en el impuesto a la renta: el resultado antes de impuesto a la
      renta de 2020 fue negativo en $ 277.690.029 tanto en la versión original como en la
      modificada. La cifra de USD 9,1 millones que lleva este campo corresponde a la versión
      modificada; la versión original (USD -12,1 millones) es la que citan la prensa y el chequeo
      publicado sobre la frase de Orsi de abril de 2025.'
