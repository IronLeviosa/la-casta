que_hace: ANCAP administra y explota el monopolio de la importación y refinación de petróleo, y de
  la importación y exportación de combustibles líquidos, semilíquidos y gaseosos, con excepción de
  la importación de gas natural. Sus principales actividades son la importación y refinación de
  petróleo y derivados en la refinería de La Teja, la comercialización y distribución de
  combustibles, la importación y elaboración de lubricantes, la fabricación y comercialización de
  cemento pórtland, la preparación de agrocombustibles (mezcla de biodiésel con gasoil y de alcohol
  carburante con nafta) y, desde 2022, la producción de hidrógeno verde y derivados en régimen de
  libre competencia. Opera además, a través de subsidiarias y participadas, en distribución de
  combustibles (DUCSA), producción de alcoholes y agrocombustibles (ALUR), gas por cañería
  (Gasoducto Cruz del Sur, Conecta) y cemento (Cementos del Plata).
