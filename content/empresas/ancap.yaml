          titulo: Ley N° 8764
          cita: "A tal fin se declara de utilidad pública el derecho exclusivo a favor del Estado: A) A la
            importación y exportación de alcoholes, su fabricación, rectificación, desnaturalización
            y venta, así como la de carburantes nacionales en todo el territorio de la República.
            Esta disposición alcanza total o parcialmente a las bebidas alcohólicas destiladas,
            cuando el Ente Industrial lo crea oportuno. B) A la importación y refinación de petróleo
            crudo y sus derivados en todo el territorio de la República. C) A la importación y
            exportación de carburantes líquidos, semilíquidos y gaseosos, cualesquiera sea su estado
            y su composición, cuando las refinerías del Estado produzcan por lo menos, el 50 % de la
            nafta que consuma el país."
