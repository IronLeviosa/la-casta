  argumentos_a_favor:
    - texto: "Que el ingreso por ventas de combustibles sea superior o inferior a la paridad de
        importación no dice nada sobre el valor agregado de refinar petróleo: refinar crea valor
        cuando producir los derivados para la canasta energética que demanda el país es menos
        costoso que importarlos, más allá del precio que se decida fijar por otras consideraciones."
      quien: ANCAP
      fuentes:
        - url: https://www.ancap.com.uy/2147/6/composicion-de-precio-y-comparacion-ursea.html
          medio: ancap
          fecha: 2026-04-15
          tipo: documento_oficial
          titulo: Composición de Precio y Comparación URSEA
          cita: Qué el ingreso por ventas de los combustibles sea superior o inferior a la paridad de
            importación, no dice nada sobre el valor agregado al refinar petróleo. Refinar petróleo
            crea valor, cuando producir los derivados de petróleo para la canasta de energéticos que
            demanda el país es menos costoso que importarlos, más allá del precio que se decida
            fijar en base a otras consideraciones.
          retrieved_at: 2026-09-07
    - texto: Al poseer la refinería y el monopolio de importación de combustibles, Uruguay gana en
        soberanía y reduce su dependencia del exterior.
      quien: quienes defienden el rol de la empresa estatal en la economía (formulación de la diaria, sin
        atribución individual)
      fuentes:
        - url: https://ladiaria.com.uy/luc/articulo/2021/11/luc-numeros-y-argumentos-detras-del-debate-sobre-el-precio-de-los-combustibles/
          medio: la-diaria
          fecha: 2021-11-24
          tipo: nota
          titulo: "LUC: números y argumentos detrás del debate sobre el precio de los combustibles"
          cita: al poseer ese activo Uruguay gana en soberanía y reduce su dependencia del exterior, plantean
            quienes defienden el rol de la empresa estatal dentro de la economía
          retrieved_at: 2026-09-07
    - texto: Las empresas públicas son un factor fundamental de transformación social, respaldo y escudo
        de los más necesitados; existe preocupación de que Ancap pierda su esencia, el monopolio, si
        avanzan cambios como los que se discutieron en la ley de urgente consideración.
      quien: Gerardo Rodríguez, presidente de la Federación Ancap (Fancap)
      fuentes:
        - url: https://www.elpais.com.uy/negocios/presidente-de-ancap-y-los-trabajadores-debatieron-sobre-el-futuro-de-la-empresa
          medio: el-pais
          fecha: 2020-10-17
          tipo: nota
          titulo: Presidente de Ancap y los trabajadores debatieron sobre el futuro de la empresa
          cita: Rodríguez habló sobre el marco ideológico “que defiende a las empresas públicas como un factor
            fundamental de transformación social, respaldo y escudo de los más necesitados”, pero
            señaló que la discusión de la ley de urgente consideración “marcó algunas divergencias
            en la coalición de gobierno” en esa “concepción ideológica” y dijo estar preocupado por
            la posibilidad de que Ancap “pierda su esencia”, el monopolio.
          retrieved_at: 2026-09-07
    - texto: Siempre conviene refinar y no importar.
      quien: Daniel Martínez, expresidente de Ancap, en campaña electoral como candidato presidencial por
        el Frente Amplio
      fuentes:
        - url: https://ladiaria.com.uy/luc/articulo/2021/11/luc-numeros-y-argumentos-detras-del-debate-sobre-el-precio-de-los-combustibles/
          medio: la-diaria
          fecha: 2021-11-24
          tipo: nota
          titulo: "LUC: números y argumentos detrás del debate sobre el precio de los combustibles"
          cita: "En setiembre de 2019, en plena campaña electoral y durante un evento en la Expo Prado, hubo
            un cruce que cobró notoriedad entre los entonces candidatos presidenciales Luis Lacalle
            Pou y Daniel Martínez. Mencionaron varios términos que se repetirían mucho en los meses
            posteriores: “Ley de urgente consideración (LUC)”, “liberalización de los combustibles”,
            “Ancap se tiene que poner a tiro”, y la mención a que Raúl Sendic “fundió Ancap”, del
            lado del líder blanco y actual presidente; “siempre conviene refinar y no importar”,
            retrucó el frenteamplista, expresidente de la empresa estatal."
          retrieved_at: 2026-09-07
  argumentos_en_contra:
    - texto: Impulsó la libre importación de combustibles como una postura casi en solitario dentro de su
        propio espacio político, sin conseguir el apoyo necesario para llevarla a cabo; considera
        una contradicción rechazar "los monopolios" salvo el propio, porque si cada sector
        protegiera el suyo eso multiplicaría los monopolios, y cree que el país terminará adoptando
        la libre importación.
      quien: Luis Lacalle Pou, presidente, en un discurso ante la Asociación de Cultivadores de Arroz,
        marzo de 2024
      fuentes:
        - url: https://www.montevideo.com.uy/Noticias/-Jugamos-como-nunca-perdimos-como-siempre--Lacalle-por-libre-importacion-de-combustibles-uc881969
          medio: montevideo-portal
          fecha: 2024-03-08
          tipo: nota
          titulo: '"Jugamos como nunca, perdimos como siempre": Lacalle por libre importación de combustibles'
          cita: "Los individuos, por lo general, dicen: ‘No a los monopolios’, salvo cuando es la mía. No, no
            hay monopolio en nada. Porque si cada uno protege la suya, somos una multiplicación de
            monopolios. Por eso, en el tema de los combustibles hay que entender cómo se conforma
            una decisión política, y también hay que seguir con estos temas, que creo más temprano
            que tarde vamos a terminar en eso"
          retrieved_at: 2026-09-07
    - texto: Al ser el sector público el responsable de generar un insumo clave para la producción, como
        los combustibles, hay ineficiencias que se trasladan a toda la población.
      quien: otros (formulación de la diaria, contrapuesta a la defensa de la empresa estatal, sin
        atribución individual)
      fuentes:
        - url: https://ladiaria.com.uy/luc/articulo/2021/11/luc-numeros-y-argumentos-detras-del-debate-sobre-el-precio-de-los-combustibles/
          medio: la-diaria
          fecha: 2021-11-24
          tipo: nota
          titulo: "LUC: números y argumentos detrás del debate sobre el precio de los combustibles"
          cita: otros apuntan a que al ser responsable el sector público de generar un insumo clave para la
            producción, hay ineficiencias que se trasladan a toda la población
          retrieved_at: 2026-09-07
    - texto: El gobierno de Jorge Batlle promovió, con una "ley de consenso" acordada entre varios
        partidos (sin el Frente Amplio), derogar el monopolio de importación, exportación y
        refinación de petróleo crudo y habilitar la asociación de ANCAP con un socio privado que
        podría gestionar el negocio, aunque ANCAP retendría la mayoría accionaria y el control de
        las decisiones estratégicas.
      quien: gobierno de Jorge Batlle (Ley 17.448, 2001-2002)
      fuentes:
        - url: https://uruguay.justia.com/nacionales/leyes/ley-17448-jan-4-2002/gdoc
          medio: justia
          fecha: 2002-01-14
          tipo: nota
          titulo: "Ley 17448 - ANCAP: derógase el monopolio de la importación, exportación y refinación de
            petróleo crudo"
          cita: Artículo 3º.- A los efectos de la constitución de la asociación, la Administración Nacional de
            Combustibles, Alcohol y Portland (ANCAP) deberá aprobar un plan básico de negocios y
            tendrá la mayoría accionaria de la sociedad así creada, sin perjuicio que podrá
            encomendar la gestión al socio en los términos y condiciones que se establezcan en la
            presente ley, pliego del llamado y contrato respectivo.
          retrieved_at: 2026-09-07
        - url: https://www.subrayado.com.uy/ancap-empresas-publicas-y-caducidad-la-historia-los-referendums-uruguay-n852564
          medio: subrayado
          fecha: 2022-03-26
          tipo: nota
          titulo: "ANCAP, empresas públicas y Caducidad: la historia de los referéndums en Uruguay"
          cita: En 2001, el gobierno del entonces presidente Jorge Batlle buscaba impulsar la reforma de
            ANCAP. Para que eso fuera exitoso se definió que lo mejor era que el proyecto no
            surgiera a iniciativa del Poder Ejecutivo. Así, fue que el gobierno creó un llamado
            proyecto de “ley de consenso” con aportes de todos los partidos políticos. El Frente
            Amplio no votó la iniciativa.
          retrieved_at: 2026-09-07
