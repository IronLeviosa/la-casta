      comparativa está, además, reexpresada en moneda de cierre del 31 de diciembre de 2005 (según
      la nota de reexpresión del balance de 2005, por la variación del índice de Precios al
      Productor de Productos Nacionales, IPPN), mientras que el tipo de cambio usado para
      convertirla a dólares es el de cierre de 2004: es una base mixta (pesos de poder adquisitivo
      de fines de 2005 divididos por el dolar de fines de 2004) distinta de la de los demás años de
      esta serie, que usan siempre el balance y el tipo de cambio del propio ejercicio. El efecto es
      del orden de la variación del IPPN en 2005 y probablemente pequeño. No hay desagregado por
      división para este año: el balance de 2005 no trae una columna comparativa por división de
      2004, solo el total."
