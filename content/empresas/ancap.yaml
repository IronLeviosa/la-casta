precios_vs_paridad:
  descripcion: 'El Precio de Paridad de Importación (PPI) es el cálculo que hace URSEA, producto por
    producto, de lo que costaría abastecer el mercado importando el producto terminado y llevándolo
    a planta de distribución de ANCAP, incluyendo tasas e impuestos de ese tramo de la cadena; URSEA
    publica esa serie mensual, con datos desde 2002, en el dataset "PPI vs PE" de
    catalogodatos.gub.uy. El cálculo recibió críticas técnicas desde diversos ámbitos, incluida
    ANCAP, que sostiene que subestima costos. Desde agosto de 2021 se sumó al PPI un ajuste
    adicional (el "factor X", surgido de un comité de asesores del MIEM) para reconocer sobrecostos
    de ANCAP en subsidios y otros costos estructurales, con el objetivo de que converja a cero en
    tres años. Desde julio de 2021 (Ley 19.889, arts. 235-237), el Poder Ejecutivo fija el precio en
    planta ANCAP (PEP) con informes preceptivos de URSEA y de ANCAP, actualizando el precio con una
    periodicidad no mayor a 60 días; antes de esa fecha las tarifas eran propuestas por ANCAP y
    fijadas por el Poder Ejecutivo sin ese mecanismo. La diferencia entre el precio de venta fijado
    y el PPI (a favor o en contra del consumidor) se conoce como "brecha" o, cuando el consumidor
    paga de más, "sobreprecio". No hay, para años sueltos del período 2015-2024, un desglose oficial
    de esa brecha por nafta y gasoil en dólares que calce con el campo de series de este esquema
    (que pide un año puntual): lo que hay publicado, y se documenta en las comparaciones, son dos
    períodos plurianuales (2010-2014 y 2015-2019, con desglose nafta/gasoil, cálculo del CED) y
    cifras agregadas para 2020-2021 y 2024, sin desglose por producto.'
