    nota: >-
      La capitalización de $ 18.856,7 millones (UI 5.840.159.519) canceló una deuda de Ancap y Ducsa
      con el MEF; el contrato es del 2 de febrero de 2016, pero el equivalente en dólares de este
      registro (USD 642,7 millones) está convertido al tipo de cambio de cierre de diciembre de
      2016, no al de la fecha de la operación. La cobertura de prensa de la época (El Observador)
      cifró el aporte del MEF en USD 622 millones, más un préstamo de USD 250 millones del Banco de
      Desarrollo de América Latina (CAF) que integró el mismo paquete; ese préstamo no figura en
      esta ficha como capitalización porque es deuda, no aporte de capital.

      Esta cancelación explica la mayor parte de la baja de la deuda financiera entre 2015 ($
      37.135,7 millones) y 2016 ($ 14.058,5 millones). De lo que queda de deuda financiera en 2016,
      según la Nota 23, $ 6.700,8 millones son préstamos bancarios y $ 7.357,8 millones son
      préstamos de partes relacionadas: un contrato del 15 de setiembre de 2016 entre la República,
      la CAF y Ancap para el Programa de Reordenamiento Institucional y Financiero de Ancap.
