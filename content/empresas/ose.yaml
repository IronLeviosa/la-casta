resumen: >-
  OSE es un servicio descentralizado del Estado uruguayo, creado en 1952, que presta el servicio de
  agua potable en todo el país y el de alcantarillado en todo el país excepto Montevideo (a cargo de
  la Intendencia); depende del Poder Ejecutivo, hoy a través del Ministerio de Ambiente (ley 19.889
  de 2020). Desde la reforma constitucional de 2004, esos dos servicios están reservados por ley
  exclusivamente a personas jurídicas estatales; antes de esa reforma, OSE había entregado en 2000
  el servicio de Maldonado a la empresa privada Uragua S.A., contrato rescindido en 2005 por
  incumplimiento de la concesionaria. Sobre si el proyecto Arazatí, presentado en 2022, respeta esa
  exclusividad hay una disputa documentada entre el gobierno y organizaciones como la Comisión
  Nacional en Defensa del Agua y la Vida y el sindicato FFOSE.

  La ficha tiene balances de diecinueve de los veinte ejercicios entre 2005 y 2024: falta 2006 (no
  se encontró un documento público) y 2005, 2007 y 2010 son parciales (2005 viene de una
  presentación institucional sin auditar, no de estados contables; 2007 y 2010 son la columna
  comparativa de balances posteriores, sin impuestos, transferencias ni capitalizaciones). Los
  balances de 1952 a 2004 no aparecieron en las fuentes consultadas (Banco Mundial, BID, Tribunal de
  Cuentas, Rendición de Cuentas); no se descarta que existan solo en papel.

  En los dieciocho ejercicios con dato de resultado (falta 2010), OSE tuvo pérdida en tres años
  consecutivos, 2013 a 2015 (entre USD -5,8 millones y USD -7,9 millones), y ganancia en los otros
  quince, entre USD 9,4 millones (2020) y USD 101,1 millones (2022). El resultado de 2013 fue
  modificado por la propia OSE en 2014, de una ganancia de $ 111,6 millones a una pérdida de $ 168,9
  millones, por una previsión de incobrables y un ajuste de impuesto diferido; el de 2015 también
  fue reexpresado en 2016, de una pérdida de USD 15,6 millones a USD 5,8 millones. El resultado de
  OSE está dominado por la diferencia de cambio: con la deuda casi toda en dólares y en unidades
  indexadas, en 2015 la pérdida neta por diferencia de cambio fue de $ 1.626 millones mientras el
  resultado operativo del año fue una ganancia de unos $ 300 millones, según la propia nota de
  eventos relevantes del balance de ese año.

  OSE pagó entre USD 36,6 millones (2015) y USD 59,6 millones (2024) por año en impuestos y tasas
  (Impuesto al Patrimonio, IRAE, IVA, Tribunal de Cuentas, URSEA, Sistema Postal Universal), sin
  contar los anticipos que la misma nota informa pagados en enero del año siguiente. En los años con
  dato, OSE no transfirió a Rentas Generales en doce de trece ejercicios (2008, 2009, 2012 a 2018,
  2020, 2022 y 2024); no hay dato para 2005, 2007, 2010, 2011, 2019 y 2021. La única transferencia
  documentada fue en 2023 ($ 23,4 millones, USD 0,6 millones): en plena emergencia hídrica, OSE giró
  esos fondos al Tesoro Nacional para comprar agua potable embotellada para la población más
  vulnerable, un giro de la empresa hacia el Estado y no al revés, en el año de mayor estrés
  financiero de la serie.

  La deuda financiera de OSE aumentó de forma sostenida entre 2007 (USD 99,8 millones) y 2024 (USD
  461,0 millones), con caídas puntuales en dólares frente al año anterior en 2008, 2018, 2020 y
  2021. En 2016, el Ministerio de Vivienda transfirió a OSE $ 513 millones (USD 17,5 millones), la
  única capitalización del Estado identificada en los diecinueve ejercicios documentados; en los
  otros quince años con dato (2008, 2009, 2011 a 2015 y 2017 a 2024) los propios balances muestran
  que el renglón de aportes del Gobierno Central no cambió. Para 2005, 2007 y 2010 no hay documento
  que permita determinarlo.

  OSE desagrega su resultado por actividad (Agua Potable, Alcantarillado, Otros) en trece de los
  diecinueve ejercicios documentados: 2008, 2009, 2011 a 2014 y 2018 a 2024; los balances de 2015 a
  2017 no traen esa apertura, y los de 2005, 2007 y 2010 tampoco. Alcantarillado tuvo resultado
  negativo en ocho de esos trece años (2012, 2013, 2014, 2018, 2019, 2020, 2023 y 2024) y positivo
  en los otros cinco (2008, 2009, 2011, 2021 y 2022); Agua Potable sostuvo el resultado positivo del
  conjunto en los trece años. Desde 2020, los propios balances de OSE prorratean entre segmentos los
  resultados financieros y "otros resultados" según los ingresos de explotación de cada actividad y
  no según un cálculo de costos propio, así que la pérdida de Alcantarillado no refleja
  necesariamente su operación; los balances de 2008 a 2014 no traen esa aclaración.

  En comparaciones internacionales, la tarifa de OSE fue la más cara de un grupo de operadores
  latinoamericanos de ciudades de más de 300.000 habitantes que analizó un estudio de Lentini (2015)
  citado por una nota técnica del BID (2020): USD 2,06/m³, frente a un promedio de los once
  promedios por país de USD 1,22/m³ (mínimo 0,39, el promedio de Argentina); por operador
  individual, el promedio de esa muestra de 57 operadores es USD 1,40/m³ y el máximo USD 2,35/m³, en
  Colombia. Uruguay es uno de los cinco países de la muestra con datos de un único operador (los
  otros son Costa Rica, Honduras, México y Panamá) y uno de los tres de esos cinco con un operador
  de alcance nacional (junto con Costa Rica y Panamá), así que la cifra corresponde a OSE, no a un
  promedio de varios prestadores del país. En el benchmarking de ADERASA (datos de 2022), la tarifa
  doméstica y la comercial de OSE también estuvieron entre las más altas de los operadores
  relevados. El mismo informe, sobre indicadores de servicio, ubica a OSE con 95,19% de la población
  con acceso al agua potable, 23,99 horas de continuidad del servicio y entre 88,94% y 88,98% de las
  aguas residuales tratadas antes de ser vertidas según la tabla del informe que se mire, valores
  más altos que varios de los operadores comparados (por ejemplo, AyA de Costa Rica tuvo 9,88 horas
  de continuidad y EPMAPS de Ecuador trató apenas 1,87% de sus aguas residuales). OSE tiene además
  una tarifa social para consumos menores a 15 m³/mes que, según el BID, reduce la tarifa de agua
  potable a entre 22% y 36% de la tarifa residencial.

  Sobre si el agua debe ser un monopolio estatal hay posiciones documentadas de los dos lados. A
  favor, el propio artículo 47 de la Constitución establece que el servicio debe anteponer las
  razones de orden social a las económicas, y organizaciones como la Comisión Nacional en Defensa
  del Agua y la Vida y el sindicato FFOSE sostienen que el proyecto Arazatí viola esa exclusividad.
  En contra, el entonces presidente Jorge Batlle hizo campaña por el No en el plebiscito de 2004 por
  considerar la reforma "una grave equivocación", y el economista Juan Dubra cuestionó, con datos de
  la facturación de OSE en Maldonado entre 2002 y 2006, que el prestador estatal fuera
  automáticamente más eficiente que uno privado.
