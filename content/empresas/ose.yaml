  tier: publicado
  notas_internas: "Pendientes menores, no bloqueantes, en la línea del precedente de
    content/empresas/ancap.yaml (gaps documentados no se bajan a probable): (1)
    capitalizaciones_del_estado no se pudo verificar para 2015 y 2017-2021 (6 de 10 años); el
    renglón de aportes del Gobierno Central está congelado en los años sí verificados (2016,
    2022-2024 salvo el propio 2016), así que es probable que tampoco haya cambiado en el medio, pero
    eso no se afirma sin haber abierto el Estado de evolución del patrimonio de esos años. (2)
    transferencias_al_estado sin dato en 2019, 2021 y 2022: esos balances no traen la nota
    correspondiente en la parte consultada; verificado que 'Rentas Generales' no aparece en el texto
    de 2021 ni 2022, así que no es un hueco de búsqueda. Alternativa para ambos puntos: Rendición de
    Cuentas del MEF, ain.gub.uy o catalogodatos.gub.uy, ninguno consultado en esta corrida. (3)
    Fuentes repetidas (la cotización del dólar como segunda fuente de resultado_ejercicio en varios
    años): no se corrigió en este lote para no aplicar un criterio de presentación distinto al de
    content/empresas/ancap.yaml, que tiene el mismo patrón; queda para una decisión de conjunto
    sobre la colección, ver razones.md. (4) El proyecto Arazatí tuvo una medida cautelar judicial en
    2024 (juez Recarey) que frenó y luego el Tribunal de Apelaciones revocó; no se investigó como
    caso (fuera del alcance del brief) y no está en esta ficha ni en content/casos/: si se decide
    cubrirlo, es trabajo de una corrida aparte."
