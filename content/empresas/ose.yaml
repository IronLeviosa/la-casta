que_hace: OSE presta el servicio de agua potable en todo el territorio de Uruguay y el servicio de
  alcantarillado (saneamiento) en todo el país excepto en el departamento de Montevideo. Sus
  cometidos incluyen el estudio, la construcción y la conservación de las obras necesarias para esos
  servicios, el contralor higiénico de los cursos de agua que utiliza, la posibilidad de proveer
  agua sin potabilizar a terceros cuando hay excedente sobre lo necesario para el abastecimiento
  poblacional, y la de construir o adquirir y enajenar a terceros, dentro y fuera del país, ingenios
  para la potabilización de aguas y el tratamiento de efluentes cloacales cuya tecnología de
  fabricación le pertenezca. Desde la reforma constitucional de 2004 (artículo 47, numeral 3), el
  servicio de agua potable y de saneamiento debe prestarse exclusiva y directamente por personas
  jurídicas estatales.
que_hace_fuentes:
  - url: https://www.ose.com.uy/sites/default/files/2026-04/OSE_EEFF_separados_2024_e_informe_autditoria.pdf
    medio: ose
    fecha: 2024-12-31
    tipo: documento_oficial
    titulo: Estados Financieros Separados de OSE al 31 de diciembre de 2024 e informe de auditoría, Nota
      1 (cometidos y facultades, literales a-g)
    cita: a) la prestación del servicio de agua potable en todo el territorio de la República; b) la
      prestación del servicio de alcantarillado en todo el territorio de la República, excepto en el
      Departamento de Montevideo; c) la celebración de convenios con los Gobiernos Municipales y/o
      comisiones vecinales para realizar obras de alcantarillado o abastecimiento de agua potable de
      interés local, mediante contribución de las partes, con aprobación previa del Poder Ejecutivo;
      d) el estudio, la construcción y la conservación de todas las obras destinadas a los servicios
      que se le cometen; e) El contralor higiénico de todos los cursos de agua que utilice directa o
      indirectamente para la prestación de sus servicios; f) Podrá proveer a terceros a título
      oneroso, el suministro de agua sin potabilizar para ser destinada a finalidades diversas del
      consumo humano, siempre que la disponibilidad del recurso natural resulte excedentaria
      respecto de los caudales necesarios para atender el servicio público de agua potable; g) Podrá
      construir o adquirir ya construidos y enajenar a título oneroso a terceros dentro y fuera del
      país, ingenios para la potabilización de aguas y para el tratamiento de efluentes cloacales
      cuya tecnología de fabricación le pertenezca.
    retrieved_at: 2026-09-08
