monopolio:
  tiene: true
  alcance: Desde la reforma constitucional aprobada por plebiscito el 31 de octubre de 2004 (artículo
    47, numeral 3), el servicio público de saneamiento y el de abastecimiento de agua para consumo
    humano deben ser prestados exclusiva y directamente por personas jurídicas estatales en todo el
    territorio uruguayo. Antes de esa reforma, OSE había concesionado el servicio de agua potable y
    saneamiento del departamento de Maldonado a la empresa privada Uragua S.A., contrato rescindido
    en 2005 por incumplimiento contractual de la concesionaria (ver `normas` e `hitos`). Desde 2022
    hay una disputa pública, documentada en `argumentos_a_favor`, `argumentos_en_contra` e `hitos`,
    sobre si el contrato del proyecto Arazatí respeta esa exclusividad.
  normas:
    - norma: Constitución de la República, artículo 47, numeral 3) (texto incorporado por la reforma
        constitucional aprobada en el plebiscito del 31 de octubre de 2004) - exclusividad estatal
        del servicio de agua potable y saneamiento
      fuentes:
        - url: https://www.impo.com.uy/bases/constitucion/1967-1967/47
          medio: impo
          fecha: 1967-02-02
          tipo: documento_oficial
          titulo: Constitución de la República Oriental del Uruguay, artículo 47 (con nota sobre la reforma de
            2004)
          cita: 3) El servicio público de saneamiento y el servicio público de abastecimiento de agua para el
            consumo humano serán prestados exclusiva y directamente por personas jurídicas
            estatales. 4) La ley, por tres quintos de votos del total de componentes de cada Cámara,
            podrá autorizar el suministro de agua, a otro país, cuanto éste se encuentre
            desabastecido y por motivos de solidaridad. (*) (*)Notas:La redacción de este artículo
            fue dada por la Reforma Constitucional, aprobada por plebiscito de fecha 8 de diciembre
            de 1996. El inciso segundo fue agregado por la Reforma Constitucional, aprobada por
            plebiscito de fecha 31 de octubre de 2004.
          retrieved_at: 2026-09-08
    - norma: Ley 11.907 (19/12/1952) y Ley 17.277 (28/09/2000) - cometidos y facultades de OSE (literales
        a a g de la Nota 1 de sus estados financieros) como prestador de los servicios de agua
        potable y saneamiento
      fuentes:
        - url: https://www.ose.com.uy/sites/default/files/2026-04/OSE_EEFF_separados_2024_e_informe_autditoria.pdf
          medio: ose
          fecha: 2024-12-31
          tipo: documento_oficial
          titulo: Estados Financieros Separados de OSE al 31 de diciembre de 2024 e informe de auditoría, Nota
            1
          cita: >-
            De acuerdo con la Ley Orgánica N° 11.907 promulgada el 19 de diciembre de 1952 y con la
            Ley N° 17.277 promulgada

            el 28 de setiembre de 2000, la Administración de las Obras Sanitarias del Estado
            (O.S.E.) tiene los siguientes

            cometidos y facultades:

            a) 	la prestación del servicio de agua potable en todo el territorio de la República;

            b) 	la prestación del servicio de alcantarillado en todo el territorio de la República,
            excepto en el Departamento de

            Montevideo;

            c) 	la celebración de convenios con los Gobiernos Municipales y/o comisiones vecinales
            para realizar obras de

            alcantarillado o abastecimiento de agua potable de interés local, mediante contribución
            de las partes, con

            aprobación previa del Poder Ejecutivo;

            d) 	el estudio, la construcción y la conservación de todas las obras destinadas a los
            servicios que se le cometen;

            e) 	El contralor higiénico de todos los cursos de agua que utilice directa o
            indirectamente para la prestación de sus

            servicios;
          retrieved_at: 2026-09-08
