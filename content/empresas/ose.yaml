    nota: '2023 fue el año de la crisis hídrica metropolitana (la peor sequía en 100 años, según
      cobertura de prensa): el Poder Ejecutivo declaró la emergencia hídrica por Decreto 177/023 del
      19/06/2023, vigente hasta el Decreto 253/023 del 23/08/2023. Según la Nota 11 de estos Estados
      Financieros, "estas medidas extraordinarias conllevaron costos adicionales que superaron los
      presupuestos previstos, lo que provocó un incremento en las deudas financieras y un aumento en
      las inversiones y gastos por encima de lo inicialmente previsto para el año". La deuda
      financiera de este año está en la Nota 8.1 (no en la tabla de la Nota 5.7 con detalle por
      institución, que en el texto extraído no trae un renglón de total). Los resultados financieros
      y "otros resultados" de este año se prorratean entre Agua Potable y Alcantarillado (y "Otros",
      si lo hay) en función de los ingresos de explotación del ejercicio, según la propia nota de
      segmentos del balance 2023 (Estados Financieros Separados de OSE al 31 de diciembre de 2023):
      "La asignación de los resultados financieros a las actividades de agua y alcantarillado, es en
      función de los ingresos de explotación del ejercicio. Otros resultados incluye resultados
      diversos y extraordinarios, los mismos se distribuyen en base a los ingresos de explotación
      del ejercicio." El crédito de $ 23:400.000 para agua embotellada es la única transferencia a
      Rentas Generales de todo el período 2015-2024 en este registro: los años 2015 a 2018, 2020 y
      2024 tienen constancia expresa en sus balances de que no hubo transferencias, y 2019, 2021 y
      2022 quedan sin dato por no incluir esa nota en el texto disponible.'
