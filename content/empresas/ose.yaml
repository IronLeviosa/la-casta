  argumentos_a_favor:
    - texto: El agua es un recurso natural esencial para la vida y el acceso al agua potable y al
        saneamiento constituyen derechos humanos fundamentales; por eso la prestación del servicio
        debe anteponer las razones de orden social a las de orden económico.
      quien: Constitución de la República (artículo 47, agregado por la reforma aprobada en el plebiscito
        del 31 de octubre de 2004)
      fuentes:
        - url: https://www.impo.com.uy/bases/constitucion/1967-1967/47
          medio: impo
          fecha: 1967-02-02
          tipo: documento_oficial
          titulo: Constitución de la República Oriental del Uruguay, artículo 47 (texto completo del inciso
            agregado en 2004)
          cita: "El agua es un recurso natural esencial para la vida. El acceso al agua potable y el acceso al
            saneamiento, constituyen derechos humanos fundamentales. 1) La política nacional de
            Aguas y Saneamiento estará basada en: a) el ordenamiento del territorio, conservación y
            protección del Medio Ambiente y la restauración de la naturaleza. b) la gestión
            sustentable, solidaria con las generaciones futuras, de los recursos hídricos y la
            preservación del ciclo hidrológico que constituyen asuntos de interés general. Los
            usuarios y la sociedad civil, participarán en todas las instancias de planificación,
            gestión y control de recursos hídricos; estableciéndose las cuencas hidrográficas como
            unidades básicas. c) el establecimiento de prioridades para el uso del agua por
            regiones, cuencas o partes de ellas, siendo la primera prioridad el abastecimiento de
            agua potable a poblaciones. d) el principio por el cual la prestación del servicio de
            agua potable y saneamiento, deberá hacerse anteponiendo las razones de orden social a
            las de orden económico."
          retrieved_at: 2026-09-08
    - texto: El proyecto Neptuno permitiría que un conglomerado de empresas privadas termine gestionando
        el agua potable, algo que quedó explícitamente prohibido luego del plebiscito de 2004, lo
        que constituye una violación del artículo 47 de la Constitución.
      quien: Comisión Nacional en Defensa del Agua y la Vida (CNDAV) y sindicato FFOSE
      fuentes:
        - url: https://ladiaria.com.uy/ambiente/articulo/2022/4/el-proyecto-neptuno-de-ose-es-inconstitucional-denuncia-comision-nacional-en-defensa-del-agua/
          medio: la-diaria
          fecha: 2022-04-20
          tipo: nota
          titulo: El proyecto Neptuno de OSE "es inconstitucional", denuncia Comisión Nacional en Defensa del
            Agua
          cita: La Comisión Nacional en Defensa del Agua y de la Vida (CNDAV) se pronunció este miércoles
            sobre el proyecto Neptuno, que está a estudio de OSE, y lo consideró "inconstitucional"
            en tanto permitiría que un conglomerado de empresas privadas termine gestionando el agua
            potable, algo que quedó explícitamente prohibido luego del plebiscito de 2004.
          retrieved_at: 2026-09-08
        - url: https://www.lr21.com.uy/politica/1460393-ffose-denuncia-que-proyecto-neptuno-es-inconstitucional-y-privatizador
          medio: la-republica
          fecha: 2022-06-05
          tipo: nota
          titulo: FFOSE denuncia que "Proyecto Neptuno" es inconstitucional y privatizador
          cita: FFOSE remarca su posición política y económica y denuncia la "violación del artículo 47 de la
            Constitución", y además elementos técnicos y ambientales.
          retrieved_at: 2026-09-08
  argumentos_en_contra:
    - texto: Este tipo de reformas que establecen la exclusividad estatal del agua es una grave
        equivocación para el país, porque el tema del agua en Uruguay ya estaba legislado desde
        hacía mucho tiempo y no había riesgo de que alguien se apropiara del agua.
      quien: Jorge Batlle, presidente de la República (2000-2005), en campaña por el No al plebiscito de
        2004
      fuentes:
        - url: https://www.lr21.com.uy/politica/156389-contrario-al-plebiscito-del-agua
          medio: la-republica
          fecha: 2004-10-09
          tipo: nota
          titulo: Contrario al plebiscito del agua
          cita: «Acá el tema no es que uno triunfe o no. El tema es que cuando se habla de reformar la
            Constitución no se habla de algo sencillo. Por eso me parece que todos tenemos derecho a
            dar nuestro punto de vista. Si el gobierno entiende que algo le puede hacer daño a la
            población, tiene la obligación de decírselo y la gente después decidirá como le
            parezca», sostuvo Batlle y habilitó a que el ministro de Vivienda, Saúl Irureta,
            realizara una encendida defensa de la posición oficial. «Que cada uno decida lo que
            quiera, pero yo ya dije que me parece una grave equivocación para el país este tipo de
            reformas, porque el tema del agua en nuestro país está legislado desde hace mucho tiempo
            y no hay nadie que se pueda apropiar del agua», agregó el presidente Batlle.
          retrieved_at: 2026-09-08
    - texto: Entre 2002 y 2006, de cada 100 metros cúbicos de agua que produjo, OSE facturó apenas 46,6,
        mientras que las empresas privadas que antes operaban en esas mismas zonas de Maldonado
        facturaban entre 75% y 80%; además, en el único caso analizado (Aguas Corrientes-El Pinar)
        el costo del agua para el usuario aumentó tras la nacionalización, lo que cuestiona el
        supuesto de que el prestador estatal sea automáticamente más eficiente que uno privado.
      quien: Juan Dubra, economista (Universidad de Montevideo), en el blog académico Foco Económico
      fuentes:
        - url: https://dev.focoeconomico.org/2012/12/19/nacionalizacion-y-calidad-del-agua/
          medio: foco-economico
          fecha: 2012-12-19
          tipo: nota
          titulo: Nacionalización y Calidad del Agua
          cita: Finalmente, un aspecto preocupante de la OSE es que de cada 100 metros cúbicos de agua que
            produjo entre 2002 y 2006, facturó sólo 46,6; el resto se fue entre pérdidas del
            sistema, gente colgada a la red, y otros factores. En el caso de las privadas, ese
            número era del orden de 75-80%.
          retrieved_at: 2026-09-08
