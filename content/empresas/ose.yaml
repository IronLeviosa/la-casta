  tier: publicado
  notas_internas: "Pendientes menores, no bloqueantes, en la línea del precedente de
    content/empresas/ancap.yaml (gaps documentados no se bajan a probable): (1)
    transferencias_al_estado sin dato en 2005, 2007, 2010, 2011, 2019 y 2021 (2011, 2019 y 2021 con
    la nota ausente confirmada en el texto disponible, no un hueco de búsqueda);
    capitalizaciones_del_estado sin dato en 2005, 2007 y 2010 por falta de documento comparativo
    utilizable. Alternativa para ambos: Rendición de Cuentas del MEF, ain.gub.uy o
    catalogodatos.gub.uy, ninguno consultado en esta corrida. (2) Fuentes repetidas (la cotización
    del dólar como segunda fuente de resultado_ejercicio en varios años): no se corrigió en este
    lote para no aplicar un criterio de presentación distinto al de content/empresas/ancap.yaml, que
    tiene el mismo patrón; queda para una decisión de conjunto sobre la colección. (3) El proyecto
    Arazatí tuvo una medida cautelar judicial en 2024 (juez Recarey) que frenó y luego el Tribunal
    de Apelaciones revocó; no se investigó como caso (fuera del alcance del brief) y no está en esta
    ficha ni en content/casos/: si se decide cubrirlo, es trabajo de una corrida aparte. (4)
    comparaciones[] se vació en esta vuelta: las 7 que traía la ficha salían todas del informe del
    BID (2020) o de ADERASA (2024/datos 2022), que ahora tienen página propia en
    content/analisis/ose/ y la página de la empresa oculta las comparaciones cuya fuente es un
    análisis publicado; el resumen conserva una versión corregida y resumida de esas cifras. (5)
    2019, segmento Otros: no se verificó si una nota de los Estados Financieros de 2021 explica el
    ajuste de $ 728.287.262 por una corrección del Impuesto a la Renta de 2018-2019; ese documento
    no se leyó en ninguna vuelta, la hipótesis no se publicó por no estar confirmada. (6) 2005 se
    admite como año parcial con la cifra de una presentación institucional no auditada, no de
    estados contables: es el único año de la serie con ese estándar más laxo; si aparece en el
    futuro una publicación institucional equivalente de otro año, corresponde el mismo criterio."
