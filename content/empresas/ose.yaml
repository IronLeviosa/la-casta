resumen: >-
  OSE es un servicio descentralizado del Estado uruguayo, creado en 1952, que presta el servicio de
  agua potable en todo el país y el de alcantarillado en todo el país excepto Montevideo (a cargo de
  la Intendencia). Desde la reforma constitucional de 2004, esos dos servicios están reservados por
  ley exclusivamente a personas jurídicas estatales; antes de esa reforma, OSE había concesionado el
  servicio de Maldonado a la empresa privada Uragua S.A., contrato rescindido en 2005 por
  incumplimiento de la concesionaria. Sobre si el proyecto Arazatí, presentado en 2022, respeta esa
  exclusividad hay una disputa documentada entre el gobierno y organizaciones como la Comisión
  Nacional en Defensa del Agua y la Vida y el sindicato FFOSE.

  En los diez años de 2015 a 2024, el resultado del ejercicio de OSE fue negativo solo en 2015
  (pérdida de USD 5,8 millones, cifra reexpresada por la propia OSE en 2016; la cifra publicada
  originalmente en 2015 era una pérdida mayor, de unos USD 15,6 millones). Los otros nueve años
  tuvieron resultado positivo, entre USD 9,4 millones (2020) y USD 101,1 millones (2022). El
  resultado de OSE está dominado por la diferencia de cambio: con la deuda casi toda en dólares y en
  unidades indexadas, en 2015 la pérdida neta por diferencia de cambio fue de $ 1.626 millones
  mientras el resultado operativo del año fue una ganancia de unos $ 300 millones, según la propia
  nota de eventos relevantes del balance de ese año.

  OSE pagó entre USD 36,6 millones (2015) y USD 59,6 millones (2024) por año en impuestos y tasas
  (Impuesto al Patrimonio, IRAE, IVA, Tribunal de Cuentas, URSEA, Sistema Postal Universal), sin
  contar los anticipos que la misma nota informa pagados en enero del año siguiente. OSE no
  transfirió a Rentas Generales en la mayoría de los años del período: sus propios balances declaran
  expresamente que no hubo transferencias en 2015, 2016, 2017, 2018, 2020 y 2024, y no hay dato
  disponible para 2019, 2021 y 2022 porque esos balances no traen esa nota en la parte consultada.
  La única transferencia del período fue en 2023 ($ 23,4 millones, USD 0,6 millones): en plena
  emergencia hídrica, OSE giró esos fondos al Tesoro Nacional para la compra de agua potable
  embotellada para la población más vulnerable, un giro de la empresa hacia el Estado y no al revés,
  en el año de mayor estrés financiero de la década.

  La deuda financiera de OSE subió de forma sostenida en el período, de USD 381,4 millones en 2015 a
  USD 461,0 millones en 2024, con una caída puntual en 2022 (a USD 398,2 millones) que coincide con
  una apreciación del peso frente al dólar. En 2016, el Ministerio de Vivienda transfirió a OSE $
  513 millones (USD 17,5 millones), la única capitalización del Estado identificada en el período;
  en 2022, 2023 y 2024 los propios balances muestran que el renglón de aportes del Gobierno Central
  no cambió, es decir que no hubo una capitalización nueva del Estado en esos tres años. Para 2015 y
  2017 a 2021 no fue posible determinar si hubo o no una capitalización del Estado en esos años
  puntuales.

  Desde 2018, OSE desagrega su resultado en tres segmentos: Agua Potable, Alcantarillado y Otros.
  Alcantarillado tuvo resultado negativo en cinco de los siete años con datos por segmento (2018,
  2019, 2020, 2023 y 2024) y positivo en los otros dos (2021 y 2022); Agua Potable sostuvo el
  resultado positivo del conjunto todos los años. Los propios balances de OSE aclaran que buena
  parte de esos resultados por segmento es un prorrateo: los resultados financieros y "otros
  resultados" se distribuyen entre Agua Potable y Alcantarillado en función de los ingresos de
  explotación de cada uno, no de un cálculo de costos propio de cada actividad, así que la pérdida
  de Alcantarillado no refleja necesariamente su operación.

  En comparaciones internacionales, la tarifa media de agua y saneamiento de Uruguay fue la más cara
  de una muestra de operadores latinoamericanos analizada por el BID (estudio Lentini 2015): USD
  2,06/m³ contra un promedio de USD 1,22/m³ en la muestra (mínimo USD 0,39/m³, máximo USD 2,06/m³,
  el propio Uruguay); esa cifra es de país, no solo de OSE, porque en Montevideo el saneamiento lo
  cobra la Intendencia. En el benchmarking de ADERASA (datos de 2022), la tarifa doméstica y la
  comercial de OSE también estuvieron entre las más altas de los 11 operadores relevados. El mismo
  informe, sobre indicadores de servicio, ubica a OSE con 95,19% de la población con acceso al agua
  potable, 23,99 horas de continuidad del servicio y 88,98% de las aguas residuales tratadas antes
  de ser vertidas, valores más altos que varios de los operadores comparados (por ejemplo, AyA de
  Costa Rica tuvo 9,88 horas de continuidad y EPMAPS de Ecuador trató apenas 1,87% de sus aguas
  residuales). OSE tiene además una tarifa social para consumos menores a 15 m³/mes que, según el
  BID, reduce la tarifa de agua potable a entre 22% y 36% de la tarifa residencial.

  Sobre si el agua debe ser un monopolio estatal hay posiciones documentadas de los dos lados. A
  favor, el propio artículo 47 de la Constitución establece que el servicio debe anteponer las
  razones de orden social a las económicas, y organizaciones como la Comisión Nacional en Defensa
  del Agua y la Vida y el sindicato FFOSE sostienen que el proyecto Arazatí viola esa exclusividad.
  En contra, el entonces presidente Jorge Batlle hizo campaña por el No en el plebiscito de 2004 por
  considerar la reforma "una grave equivocación", y el economista Juan Dubra cuestionó, con datos de
  la facturación de OSE en Maldonado entre 2002 y 2006, que el prestador estatal fuera
  automáticamente más eficiente que uno privado.
