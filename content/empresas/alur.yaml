resumen: >-
  ALUR (Alcoholes del Uruguay S.A.) es una sociedad anónima cerrada constituida el 21 de octubre de
  1999, sin ley de creación propia, al amparo de la Ley General de Sociedades Comerciales N.º
  16.060. En 1999 sus socios fueron ANCAP (90 %) y la Corporación Nacional para el Desarrollo (CND,
  10 %); PDVSA Uruguay S.A. compró el paquete accionario de la CND el 12 de noviembre de 2007, y
  desde 2015 la composición es 90,79 % ANCAP y 9,21 % PDVSA Uruguay. ALUR produce y comercializa
  azúcar, etanol, biodiésel, energía eléctrica y alimento animal: procesa caña de azúcar y sorgo
  dulce en Bella Unión —donde entró al negocio azucarero el 1° de febrero de 2006, al asumir la
  explotación del Ingenio Alfredo Mones Quintela—, girasol y otras oleaginosas en su planta de
  Capurro (Montevideo) y granos en Paysandú.

  El resultado del ejercicio fue positivo en catorce de los veinte años que cubre esta ficha
  (2006-2025) y negativo en seis: 2006, 2007, 2008, 2010, 2016 y 2017 (en pesos; los balances de
  2006 y 2007 no declaran una cotización de cierre, así que esos dos años no tienen conversión a
  dólares en esta ficha). La mayor pérdida fue la de 2016 (US$ 9,2 millones), que el propio balance
  explica por una pérdida por deterioro de propiedad, planta y equipo e intangibles de $ 841,2
  millones —la mayor de toda la serie—, sin identificar a qué planta corresponde. La mayor ganancia
  fue la de 2019 (US$ 12,7 millones). El resultado cayó de forma marcada en 2021, de US$ 11,1
  millones en 2020 a US$ 4,7 millones, después de que ANCAP y ALUR cambiaran a fines de ese año el
  contrato de compra de biocombustibles a un esquema de margen comercial nulo para ALUR.

  La deuda financiera de ALUR creció con la construcción de las cuatro plantas que la empresa
  levantó entre 2008 y 2014 —cogeneración eléctrica en Bella Unión (2008), biodiésel en el predio de
  Cousa, Paso de la Arena (2009), la ampliación de la planta de biodiésel de Capurro (2012) y la
  planta de bioetanol de Paysandú (2014, la más cara: US$ 147 millones de los US$ 248 millones
  invertidos en las cuatro, según la Comisión Investigadora del Senado)—, alcanzó su máximo en 2015
  (US$ 190,4 millones) y bajó después de forma sostenida hasta llegar a cero en 2024 y 2025, sin
  préstamos ni obligaciones financieras.

  ANCAP puso capital nuevo en ALUR en 2007 ($ 145,8 millones, para la reactivación de la sociedad),
  2008 ($ 30,6 millones, más una condonación de créditos por $ 385 millones ese mismo año,
  rectificada en 2009 a un 100 % a cargo de ANCAP), 2009 ($ 945 millones, plan de integración), 2011
  ($ 450 millones), 2012 ($ 348,2 millones —el año en que PDVSA Uruguay dejó de acompañar
  proporcionalmente las capitalizaciones, lo que fue diluyendo su participación—) y 2015 ($ 737
  millones). En 2006, 2010, 2013 y 2014 esta ficha no encontró evidencia de un aporte de capital
  nuevo: en 2006 el balance no desagrega por accionista el «aporte de propietarios» de $ 69,2
  millones del año (y el segundo socio era entonces la CND, no PDVSA); el aumento de 2010 fue una
  reclasificación contable de una prima de emisión ya integrada en 2009; y el ajuste al patrimonio
  de 2014 responde a la adopción del dólar como moneda funcional, no a dinero nuevo. Desde 2016 el
  capital integrado no volvió a cambiar, con cita del balance de cada año. Aparte de las
  capitalizaciones de capital, en 2013 el entonces ministro de Industria Roberto Kreimerman informó
  al Parlamento que ANCAP llevaba aportados US$ 116 millones a ALUR y había avalado otros US$ 192
  millones.

  Por ley, ALUR tiene garantizada la compra de parte de su producción por ANCAP. La Ley 18.195 de
  2007 excluyó del monopolio de importación y refinación de ANCAP la producción y exportación de
  alcohol carburante y de biodiésel, y a la vez encomendó a ANCAP incorporar a la mezcla con naftas
  un mínimo de alcohol carburante de producción nacional —hoy 8,5 % del volumen, desde la Ley 19.996
  de 2021— y, hasta esa misma ley, un mínimo de mezcla de biodiésel en el gasoil. El artículo 7, que
  fijaba ese mínimo de biodiésel, fue derogado el 3 de noviembre de 2021 (Ley 19.996, artículo 183):
  desde entonces el mandato de mezcla obligatoria rige solo para el etanol. El costo de la
  incorporación se traslada a tarifas, salvo que el Poder Ejecutivo disponga otro mecanismo; el
  contrato vigente para la compra de biocombustibles, según la propia ANCAP, remunera los costos de
  ALUR y le fija un margen comercial, que pasó a ser nulo a fines de 2021.

  Sobre si ese diseño debe mantenerse hay posiciones documentadas de los dos lados. A favor: el
  texto de la ley, que fundamenta el mandato en el desarrollo agroindustrial y la sustitución de
  importaciones —el país sustituyó importaciones de biocombustibles, alimento animal y azúcar por
  más de US$ 100 millones en 2015, según el entonces gerente general de ALUR—, y el propio Poder
  Ejecutivo, que en 2021, al evaluar la reforma, reconoció que la planta de etanol de Paysandú es
  «la más eficiente» y que la de Bella Unión «es la que más relevancia tiene en la economía local».
  En contra: el informe que el MIEM elevó a la Asamblea General en 2021 (difundido por la diaria y
  El Observador) sostuvo que el esquema genera «un fuerte subsidio implícito» porque ALUR vendía el
  etanol y el biodiésel entre 100 % y 400 % más caro que las alternativas importadas, y el
  Ministerio de Economía y Finanzas fundamentó en la Rendición de Cuentas 2020 la eliminación del
  mandato de biodiésel en que reduciría «un sobrecosto del precio del gasoil, que beneficiará a
  todos los consumidores». Antes de esa reforma, la Comisión Investigadora del Senado sobre ANCAP
  documentó el mismo tipo de sobrecosto para 2012-2014, con cifras crecientes que esta ficha no pudo
  verificar de forma independiente (ver análisis).

  La Comisión Investigadora del Senado sobre la situación económica y financiera de ANCAP
  (2000-2015), presidida e informada por el senador Pedro Bordaberry, publicó su informe final en
  febrero de 2016; documentó que ANCAP había capitalizado a ALUR por más de US$ 110 millones,
  condonado deudas, pagado cuentas de la subsidiaria y avalado sus obligaciones con bancos y
  prestamistas.

  Los balances 2011 a 2014 son documentos escaneados con reconocimiento óptico de caracteres (OCR)
  parcial, de unas cuatro páginas cada uno; las cifras cargadas de esos años se verificaron contra
  la columna comparativa del balance del año siguiente. El balance propio de 2019 también es un
  escaneo: su resultado se tomó, en cambio, de la columna comparativa limpia del balance 2020, que
  lo reproduce igual.

  Cómo leer la tabla: ALUR adoptó el dólar estadounidense como moneda funcional desde el ejercicio
  iniciado el 1° de enero de 2014. Hasta 2020 esta ficha convierte los pesos a dólares con la
  cotización de cierre que declara el balance del propio ejercicio; desde 2021 usa la cifra en
  dólares que el balance publica directamente, porque los resultados se convierten con el tipo de
  cambio de cada transacción (NIC 21) y no con el de cierre, y las dos conversiones no coinciden
  exactamente (2021: US$ 4,7 millones auditados contra US$ 4,4 millones si se dividiera el resultado
  en pesos entre la cotización de cierre); desde 2023 todos los estados financieros de ALUR se
  presentan en las dos monedas. El año 2019 se cargó desde la columna comparativa del balance 2020
  porque el balance propio es un escaneo.

  Los segmentos de negocio están cargados para 2019-2025 —los balances de ALUR no traen antes una
  nota de información por segmentos— con las tres divisiones que declara el propio balance
  (Biocombustibles/Coproductos y Derivados, Alcoholes y Solventes, y Otros), y el monto es el
  resultado de esa división (ingresos menos egresos de la misma nota, no solo ingresos); el segmento
  Otros tuvo resultado negativo los siete años, y el segmento Biocombustibles, el más grande, cayó
  de forma marcada en 2021 con el cambio de contrato a margen nulo. Las
  `capitalizaciones_del_estado` en cero desde 2016 llevan cita del balance de ese año; 2006, 2010,
  2013 y 2014 quedan ausentes por falta de evidencia de un aporte nuevo (ver más arriba).
