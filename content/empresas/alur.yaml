creacion:
  fecha: 1999-10-21
  norma: Sociedad anónima cerrada constituida al amparo de la Ley General de Sociedades Comerciales
    N.º 16.060, con acciones nominativas, por un período de 100 años; no tiene una ley de creación
    propia como ANCAP (Ley Orgánica N.º 8.764 de 1931). En 1999 sus socios fueron ANCAP y la
    Corporación Nacional para el Desarrollo (CND); PDVSA Uruguay S.A. compró el paquete accionario
    de la CND el 12/11/2007 (ver hitos).
