  argumentos_a_favor:
    - texto: En 2015, con una inversión acumulada desde 2006 de unos 250 millones de dólares, ALUR alcanzó
        su máxima producción de biocombustibles (más de 130 millones de litros) y de alimento animal
        (110.000 toneladas); sumando esos rubros más el azúcar, el país sustituyó importaciones por
        más de 100 millones de dólares ese año, con el mayor nivel de empleo de la historia de la
        empresa.
      quien: Manuel González, gerente general de ALUR, en la presentación de resultados de la zafra 2015
        en Bella Unión, difundida por Presidencia de la República
      fuentes:
        - url: https://www.gub.uy/presidencia/comunicacion/noticias/alcoholes-del-uruguay-contribuyo-sustituir-importaciones-100-millones-dolares
          medio: presidencia
          fecha: 2015-12-02
          tipo: documento_oficial
          titulo: Alcoholes del Uruguay contribuyo a sustituir importaciones por 100 millones de dolares
          cita: >-
            toneladas."Sumando estos productos, biocombustibles, alimento animal, además de

            azúcar, finalizaremos el presente año con una sustitución de importaciones superior a
            los

            100 millones de dólares. Es decir que "el país va a dejar de gastar esa voluminosa cifra

            por productos elaborados con mano de obra nacional", subrayó.
          retrieved_at: 2026-09-09
    - texto: La ley de agrocombustibles tiene por objeto, además de fomentar y regular la producción,
        comercialización y utilización de agrocombustibles, reducir las emisiones de gases de efecto
        invernadero en los términos del Protocolo de Kyoto y contribuir al desarrollo sostenible del
        país, fomentando las inversiones, la tecnología asociada a insumos y equipos de origen
        nacional y el fortalecimiento de las capacidades productivas locales y nacionales.
      quien: Poder Legislativo, Ley 18.195 (articulo 1, objeto de la ley)
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes/18195-2007
          medio: impo
          fecha: 2007-11-28
          tipo: documento_oficial
          titulo: Ley N.18195 - Articulo 1
          cita: Asimismo, tiene por objeto reducir las emisiones de gases de efecto invernadero en los
            términos del Protocolo de Kyoto de la Convención Marco de las Naciones Unidas sobre el
            Cambio Climático, aprobados por la Ley Nº 17.279, de 23 de noviembre de 2000,
            contribuyendo al desarrollo sostenible del país.
          retrieved_at: 2026-09-09
    - texto: Al evaluar la reforma de 2021, el propio Poder Ejecutivo reconocio que la planta de etanol de
        ALUR en Paysandu es la mas eficiente, y que la de Bella Union, centrada en el mismo
        producto, es la que mas relevancia tiene en la economia local.
      quien: Ministerio de Industria, Energía y Minería (MIEM), informe a la Asamblea General sobre
        reformas al mercado de combustibles (gobierno de Lacalle Pou), según la cobertura de la
        diaria
      fuentes:
        - url: https://ladiaria.com.uy/politica/articulo/2021/2/combustibles-miem-pretende-eliminar-el-biodiesel-crear-impuesto-a-las-emisiones-y-revisar-subsidio-al-supergas/
          medio: la-diaria
          fecha: 2021-02-03
          tipo: nota
          titulo: Combustibles - MIEM pretende eliminar el biodiesel, crear impuesto a las emisiones y revisar
            subsidio al supergas
          cita: >-
            el gobierno evalúa que la planta de etanol de ALUR en Paysandú es "la más eficiente",

            la de Bella Unión centrada en el mismo producto "la que más relevancia tiene en la
            economía

            local", y la de Capurro que produce biodiésel aumenta "el precio final del gasoil de
            forma

            significativa, sin mejorar el producto final"
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: El esquema por el cual los costos de produccion de los biocombustibles de ALUR se trasladan
        integramente a la tarifa de los combustibles que vende ANCAP genera un fuerte subsidio
        implicito a ALUR, porque esta vende el etanol y el biodiesel entre 100 % y 400 % mas caro
        que sus alternativas importadas; el Poder Ejecutivo evaluo, y luego concreto, eliminar la
        obligacion de mezclar biodiesel por ese sobrecosto.
      quien: Ministerio de Industria, Energía y Minería (MIEM), informe a la Asamblea General sobre
        reformas al mercado de combustibles (gobierno de Lacalle Pou), según la cobertura de la
        diaria y de El Observador
      fuentes:
        - url: https://ladiaria.com.uy/politica/articulo/2021/2/combustibles-miem-pretende-eliminar-el-biodiesel-crear-impuesto-a-las-emisiones-y-revisar-subsidio-al-supergas/
          medio: la-diaria
          fecha: 2021-02-03
          tipo: nota
          titulo: Combustibles - MIEM pretende eliminar el biodiesel, crear impuesto a las emisiones y revisar
            subsidio al supergas
          cita: |-
            Según el informe del MIEM, este esquema genera "un fuerte subsidio implícito" a ALUR,
            porque vende el etanol y el biodiésel más caro —entre 100% y 400%, se menciona— "que sus
            alternativas importadas".
          retrieved_at: 2026-09-09
        - url: https://www.elobservador.com.uy/nota/combustibles-como-sera-el-impuesto-a-las-emisiones-de-co2-que-propone-el-gobierno--20212221220
          medio: el-observador
          fecha: 2021-02-03
          tipo: nota
          titulo: El gobierno envio su propuesta para el mercado de combustibles con un impuesto a las
            emisiones de CO2
          cita: |-
            el proyecto recomienda la eliminación de la mezcla de biodiésel en el gasoil, en la
            medida en que implique sobrecostos. Según el texto, "el biodiésel aumenta el precio del
            gasoil de forma significativa, sin mejorar el producto final"
          retrieved_at: 2026-09-09
    - texto: Frente a la alternativa de importar, mezclar combustible producido por ALUR significo para
        ANCAP un sobrecosto cuantificado en U$S 48.500.000 en 2012, U$S 58.700.000 en 2013 y U$S
        92.300.000 en 2014, segun el analisis del Cr. Alvaro Rossa incorporado al informe de la
        Comision Investigadora del Senado; el mismo informe documenta que ANCAP modifico de forma
        retroactiva los porcentajes que le abonaba a ALUR, en un caso del 5 % al 35 %.
      quien: Comisión Investigadora del Senado sobre la situación económica y financiera de ANCAP
        (2000-2015), en base al informe del Cr. Álvaro Rossa (Senador Pedro Bordaberry, informante)
      fuentes:
        - url: https://www.enperspectiva.net/wp-content/uploads/2016/02/InformeFinalAncap.pdf
          medio: en-perspectiva
          fecha: 2016-02-01
          tipo: documento_oficial
          titulo: Informe de la Comision Investigadora del Senado sobre la situacion financiera y economica de
            ANCAP entre los anios 2000 y 2015, parrafo 244
          cita: 48.500.000 en el año 2012, U$ 58.700.000 en el 2013 y U$ 92.300.000 en el 2014.
          retrieved_at: 2026-09-09
    - texto: El Poder Ejecutivo promovio la eliminacion de la obligacion de mezclar biodiesel; esto
        implicaria la eliminacion o reduccion de un sobrecosto del precio del gasoil que
        beneficiaria a todos los consumidores de ese producto, y se acompaniaria de un fondo con
        parte de lo recaudado por un nuevo impuesto a las emisiones de CO2 para politicas de
        mitigacion. La Ley 19.996, aprobada el 3/11/2021, derogo esa obligacion (articulo 183).
      quien: Poder Ejecutivo (Ministerio de Economía y Finanzas), Exposición de Motivos de la Rendición de
        Cuentas 2020
      fuentes:
        - url: https://www.gub.uy/ministerio-economia-finanzas/sites/ministerio-economia-finanzas/files/documentos/publicaciones/Exposici%C3%B3n%20de%20motivos.pdf
          medio: mef
          fecha: 2021-06-30
          tipo: documento_oficial
          titulo: Exposicion de Motivos - Rendicion de Cuentas y Balance de Ejecucion Presupuestal 2020
          cita: Por su parte, el Poder Ejecutivo promueve la eliminación de la obligación de mezclar
            biodiesel. Esto implicará la eliminación o reducción de un sobrecosto del precio del
            gasoil, que beneficiará a todos los consumidores de dicho producto.
          retrieved_at: 2026-09-09
        - url: https://www.impo.com.uy/bases/leyes/18195-2007
          medio: impo
          fecha: 2007-11-28
          tipo: documento_oficial
          titulo: Ley N.18195 - Articulo 7, nota de vigencia (derogacion)
          cita: "Artículo 7 (*)(*)Notas:Derogado/s por: Ley Nº 19.996 de 03/11/2021 artículo 183."
          retrieved_at: 2026-09-09
