    ($296,2 millones), sin explicación encontrada (se usó el balance propio, como en el resto de la
    serie, y se dejó la diferencia sin resolver en la nota del año 2022). El dictamen completo del
    Cr. Rossa (Anexo 9 del informe del Senado) no se leyó por separado: es lo único que podría subir
