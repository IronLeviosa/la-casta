    diario de sesiones de la discusión parlamentaria de los artículos 182 a 184 de la Ley 19.996 en
    la Hemeroteca del Parlamento; no se encontró el informe completo del MIEM sobre la reforma de
    2021 en miem.gub.uy ni en el Parlamento (el argumento en contra que se apoya en él queda en
    nivel reportado con dos grupos de medios, la-diaria y El Observador); el total de tributos de
