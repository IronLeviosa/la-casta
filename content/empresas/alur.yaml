que_hace: ALUR opera en la producción y comercialización de azúcar, etanol, biodiésel, energía
  eléctrica y alimentación animal, procesando caña de azúcar y sorgo dulce en Bella Unión, girasol y
  otras oleaginosas en su planta de Capurro (Montevideo) y granos en Paysandú. Desde el 3/6/2009 y
  hasta la reforma de 2021 vendió a ANCAP, por contrato, la totalidad de su producción de etanol; el
  biodiésel se regía por el mismo esquema de mezcla obligatoria hasta que la Ley 19.996 derogó esa
  obligación en noviembre de 2021 (ver monopolio e hitos). En 2024, según sus propios estados
  financieros, el 97 % de sus ingresos por biocombustibles (US$ 130,9 millones de US$ 135,1
  millones) siguió siendo con ANCAP y otras empresas vinculadas; el resto se vendió a otros países.
  Es propietaria del 100 % de Agroalur S.A., que prestaba servicios agrícolas hasta que cesó
  actividades en 2022 y su personal fue absorbido por ALUR.
