monopolio:
  tiene: true
  alcance: "La Ley 18.195 (14/11/2007) excluyó del monopolio de importación y refinación de ANCAP (Ley
    8.764 de 1931) la producción y la exportación de alcohol carburante y de biodiésel (artículos 2
    a 4), y encomendó a ANCAP incorporar a la mezcla con naftas un mínimo de alcohol carburante de
    producción nacional, hoy 8,5 % del volumen (artículo 6, con la redacción dada por la Ley 19.996
    del 3/11/2021). El artículo 7, que fijaba un mínimo de mezcla obligatoria de biodiésel en el
    gasoil, fue derogado por el artículo 183 de la misma Ley 19.996 el 3/11/2021: desde entonces el
    mandato de mezcla obligatoria rige solo para el etanol. El artículo 8 encomienda a ANCAP
    realizar la mezcla, y el artículo 9 traslada a tarifas el costo de esa incorporación (hoy solo
    la del artículo 6), salvo que el Poder Ejecutivo disponga otro mecanismo de compensación. Como
    ALUR es la subsidiaria industrial de ANCAP para biocombustibles y tiene contrato de suministro
    con su matriz (ver hitos), el mandato de mezcla de etanol le garantiza a ALUR un comprador para
    esa producción; desde el cambio de contrato de diciembre de 2021 el margen que ANCAP le reconoce
    a ALUR por esa venta es nulo (ver hitos). El contrato vigente para la compra de biocombustibles
    desde ANCAP remunera los costos de ALUR y fija un margen comercial, según la propia ANCAP."
