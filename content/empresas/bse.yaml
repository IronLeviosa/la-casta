          titulo: Ley N° 16074, artículo 7
          cita: Acreditada por el patrono la existencia del seguro obligatorio establecido por esta ley, la
            acción deberá dirigirse directamente contra el Banco de Seguros del Estado, quedando
            eximido el patrono asegurado de toda responsabilidad y siendo inaplicables, por lo
