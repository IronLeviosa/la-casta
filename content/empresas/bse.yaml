  notas_internas: 'Pendiente para una corrección futura: 2005-2014 (el BCU los publica; no se cargaron
    por presupuesto de tiempo de esta corrida). transferencias_al_estado de 2023: hay certeza de que
    hubo transferencia (Nota 20.3) pero no el monto (falta el Estado de Evolución del Patrimonio de
    ese año). impuestos_pagados: sumé "Impuestos, tasas y contribuciones" + "Impuesto al patrimonio"
    (Nota 11, devengado) en los once años; excluí el IRAE a propósito porque cambia de signo entre
    años (crédito fiscal en 2021, 2023 y 2024) y sumarlo habría hecho bajar el total de impuestos en
    los años de mayor resultado, al contrario de lo que el campo debe mostrarle al dueño de la
    empresa. Para 2017, 2018, 2021 y 2022 esos dos renglones se leyeron de una nota cuya extracción
    de texto separa la columna de conceptos de la columna de valores; el orden se verificó contra el
    total que la propia nota declara (en 2021 esa verificación además destapó un signo negativo
    espurio de extracción en un renglón distinto, "Publicidad, propaganda y publicaciones", que no
    se usa en esta ficha). A-5 de la crítica (monopolio de hecho en renta vitalicia previsional, sin
    argumentos de ningún lado) sigue abierto, documentado como aviso, no como bloqueo.'
