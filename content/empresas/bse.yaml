resumen: >-
  El Banco de Seguros del Estado (BSE) es un ente autónomo del dominio comercial del Estado, creado
  por la Ley 3.935 de 1911 y reorganizado por la Ley 18.243 de 2007. Ofrece seguros de vida y los
  ramos generales en competencia con aseguradoras privadas desde la desmonopolización de 1993, y
  opera en forma exclusiva el seguro de accidentes de trabajo de la Ley 16.074 de 1989.

  El gráfico de resultado del ejercicio cubre 2005-2025; solo 2008 dio pérdida. El capital integrado
  ($ 10) y los aportes a capitalizar no varían en ningún año: no hubo capitalizaciones del Estado en
  el período.

  El Estado de Evolución del Patrimonio, que el BCU también publica por separado desde 2009
  ("estevpat"), da la distribución de utilidades a Rentas Generales de cada año, con su monto en el
  gráfico: hubo transferencia en 2009, 2011, 2020, 2023, 2024 y 2025, y ninguna en 2010, 2012-2019,
  2021 y 2022. Para 2005-2008 no se encontró ese documento: esos años quedan sin dato, no en cero.
  La Carta Orgánica (Ley 3.935 de 1911 y su sucesora, la Ley 18.243 de 2007) no obliga a verter
  utilidades: por defecto las capitaliza, y la obligación de transferir nace cada vez de una ley
  específica o de una instrucción del Poder Ejecutivo. Para 2020, 2023 y 2024 el propio balance cita
  la nota de la Oficina de Planeamiento y Presupuesto que ordena la transferencia (015/C/20;
  014/C/23 y 032/C/23; 013/C/24, 018/C/24 y 027/C/24); para 2009, 2011 y 2025 el balance registra el
  monto vertido pero no cita una instrucción equivalente.

  El total de tributos se cargó en diecisiete de los veintiún años (Nota 11 o 12, base devengado,
  sin el IRAE, que figura aparte en el resultado); quedan sin dato 2005, 2006, 2007 y 2009, por
  falta de documento legible o porque el OCR no reconcilia contra el total impreso.

  "Vida Prev." (renta vitalicia y seguro colectivo previsional, separados desde 2019) perdió dinero
  todos los años cargados. La planilla del BCU trae catorce ramos más el total; esta ficha carga
  siete en los veintiún años y deja fuera Caución, Transporte, Otros, Vida, Ingeniería, Crédito y
  Reaseguros Activos, ya presentes en la cita de cada año pero sin renglón propio.

  El seguro de accidentes de trabajo es el único ramo que la Ley 16.426 de 1993 dejó fuera de la
  desmonopolización general. A favor, la política social y no negocio (presidencia del BSE) y el
  argumento parlamentario de 1996 de que es deficitario; en contra, la cámara de aseguradoras
  privadas (Audea) y un diputado que en 1996 reconoció que la desmonopolización había bajado los
  precios.

  Según la Transparencia del BSE, a diciembre de 2025 tenía el 71,2% de las primas del mercado
  (67,7% sin accidentes de trabajo).

  Esta ficha cubre 2005-2025, desde donde el BCU publica los filings del BSE. El Banco existe desde
  1911; para 1911-2004 la vía a probar es el Diario Oficial (art. 191 de la Constitución), con
  ediciones ya localizadas en la Hemeroteca del Parlamento que mencionan al BSE y su Estado de
  Situación Patrimonial el mismo día, todavía sin abrir.

  La línea de tiempo muestra las tres designaciones de presidente del Directorio del BSE que tienen
  resolución del Consejo de Ministros localizada: Mario Castro (2010, gobierno de Mujica), José
  Amorín Batlle (2020, gobierno de Lacalle Pou) y Marcos Otheguy (2025, gobierno de Orsi). No se
  encontró la resolución de 2005 ni la de 2015; no hay evidencia de que en 2015 haya habido una
  designación nueva (Castro siguió en el cargo hasta 2020), pero tampoco un documento que lo
  confirme.

  Cómo leer la tabla: resultado_ejercicio es el resultado neto después de impuesto a la renta (IRIC
  hasta 2009, IRAE desde 2010, mismo renglón bajo dos rótulos); impuestos_pagados es la suma
  devengada —no de caja— de "Impuestos, tasas y contribuciones" e "Impuesto al patrimonio" de la
  Nota 11 o 12 a los estados contables, sin el IRAE; transferencias_al_estado es la distribución de
  utilidades vertida en efectivo (y, en 2025, también con cargo a la Reserva Legal) según el Estado
  de Evolución del Patrimonio; deuda_financiera es el total de deudas financieras del Estado de
  Situación Patrimonial. La cotización de cada año es el tipo de cambio interbancario de cierre del
  último día hábil de diciembre ("Dólar USA Fondo BCU"; código 2223 en 2005-2006, 2230 desde 2007);
  el reporte de 2005 y 2006 no da un valor de cierre único y se usó el punto medio entre compra y
  venta.
revision:
  tier: publicado
  notas_internas: 'Pendiente para una corrección futura: 1911-2004 (vía a probar: Diario Oficial, art.
    191 de la Constitución; ediciones ya localizadas en la Hemeroteca del Parlamento, sin abrir).
    impuestos_pagados sin documento o sin reconciliar: 2005, 2006 (PDF con escaneo en espejo, OCR
    ilegible), 2007 (sin documento) y 2009 (los trece renglones de la Nota 12 no reconcilian contra
    el total impreso por $ 90.000 y no hay forma de aislar el renglón que falla).
    transferencias_al_estado sin documento: 2005-2008 (el reporte "estevpat" da HTTP 404 con los dos
    patrones de nombre de archivo probados, consistente con que no se exigía o no se publicaba antes
    del ejercicio 2009). segmentos: la ficha carga 7 de los 14 ramos que publica el "resram" del BCU
    (Incendio, Vehículos, Robo, RC, Accidentes, Rurales, Vida Prev.); los otros siete (Caución,
    Transporte, Otros, Vida, Ingeniería, Crédito, Reaseguros Activos) están en la cita de cada año
    pero sin renglón propio, declarado en el resumen. hitos: no se encontró la resolución de
    designación de presidente del BSE de 2005 ni de 2015; sí se encontró y cargó la de 2010 (Mario
    Castro, Resolución del Consejo de Ministros N.º 708/010). impuestos 2011: el renglón "Gastos de
    mantenimiento de bienes de uso" está parcialmente ilegible en el escaneo de la Nota 12
    ("£3.026.699"); se confirmó como 83.026.699 porque con ese valor los doce renglones suman exacto
    contra el total impreso ($ 714.801.518); no hay otro documento con texto nativo que lo confirme
    de forma independiente. impuestos 2012: el dígito que no reconcilia está en el total impreso, no
    en un renglón (los once renglones suman $ 739.991.958 contra un total impreso de $ 739.091.958);
    se publicó por eso, a diferencia de 2009. impuestos_pagados excluye a propósito el IRAE en toda
    la serie porque cambia de signo entre años (crédito fiscal en 2021, 2023 y 2024) y sumarlo
    habría hecho bajar el total de impuestos en los años de mayor resultado. Para 2017, 2018, 2021 y
    2022 los renglones de impuestos se leyeron de una nota cuya extracción de texto separa la
    columna de conceptos de la de valores; en 2021 esa verificación destapó un signo negativo
    espurio de extracción en "Publicidad, propaganda y publicaciones", que no se usa en esta ficha.
    Aviso A-5 de la crítica de la corrida 2026-09-07 (monopolio de hecho en renta vitalicia
    previsional, sin argumentos de ningún lado documentados) sigue abierto, sin resolver en esta
    corrida.'
