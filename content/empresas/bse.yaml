          tipo: documento_oficial
          titulo: Ley N° 16426, artículo 2 (quién controla a las aseguradoras, incluido el BSE)
          cita: Artículo 2 Las empresas públicas o privadas para desarrollar actividad aseguradora o
            reaseguradora deberán instalarse en el país y ser autorizadas por el Poder Ejecutivo,
            con el asesoramiento y control de la Superintendencia de Servicios Financieros del Banco
