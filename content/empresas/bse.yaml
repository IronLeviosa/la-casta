nombre: BSE
nombre_completo: Banco de Seguros del Estado
tipo: ente_autonomo
alias:
  - BSE
  - Banco de Seguros del Estado
  - el asegurador estatal
creacion:
  fecha: 1911-12-27
  norma: Ley 3.935
  fuentes:
    - url: https://www.impo.com.uy/bases/leyes/3935-1911
      medio: impo
      fecha: 1911-12-27
      tipo: documento_oficial
      titulo: Ley N° 3935 (resumen de IMPO; la página no publica el articulado completo)
      cita: Establécese la creación del Banco de Seguros del Estado, su denominación, capital, domicilio
        legal y administración, establecimiento de agencias, garantías, fondos de reserva,
        exenciones, operaciones, prohibiciones, liquidación de siniestros, administración del Banco,
        integración de su Directorio, remuneración de su Presidente, duración y renovación de su
        Directorio, publicación del balance de su activo y pasivo, apertura y cierre de su ejercicio
        económico, aprobación del Reglamento General de la Institución. Declárase monopolio del
        Estado los contratos de seguro, cubriendo los riesgos de vida, accidentes de trabajo e
        incendios, regúlase el registro de contratos y la fijación de penas por violar las
        disposiciones que se determinan.
      retrieved_at: 2026-09-09
    - url: https://www.bcu.gub.uy/Servicios-Financieros-SSF/Seguros/Datos%20del%20Mercado/reportes/notas/bse20151231.pdf
      medio: bcu
      fecha: 2015-12-31
      tipo: documento_oficial
      titulo: Notas a los Estados Contables al 31 de diciembre de 2015 (BSE, filing ante la
        Superintendencia de Servicios Financieros), Nota 1.1
      cita: El Banco de Seguros del Estado ("BSE" o "Banco") es un ente autónomo estatal que desarrolla la
        actividad aseguradora en el Uruguay, bajo el régimen legal establecido por las Leyes N”
        3.935 del 27 de diciembre de 1911, N* 7.915 del 19 de julio de 1926, N* 8.416 del 30 de mayo
        de 1929, N” 16.426 del 14 de octubre de 1993 y N* 18.243 del 27 de diciembre de 2007.
      retrieved_at: 2026-09-09
que_hace: El BSE realiza todo tipo de operaciones de seguros, reaseguros, comercialización de rentas
  vitalicias y seguro de retiro, constitución y administración de rentas vitalicias previsionales y
  demás operaciones similares o conexas, así como todas aquellas que efectúen las empresas del ramo.
  Opera en seguros de vida, vida previsional y en las ramas de seguros generales (incendio,
  vehículos automotores, robo/hurto, responsabilidad civil, caución, transporte, cristales, riesgos
  rurales, ingeniería y créditos) en competencia con aseguradoras privadas desde la
  desmonopolización de 1993, y en forma monopólica en el seguro de accidentes de trabajo y
  enfermedades profesionales que ampara a todos los trabajadores previstos en la Ley 16.074. Además
  presta servicios de asistencia médica y prestaciones económicas a los trabajadores lesionados por
  accidentes de trabajo o afectados por enfermedades profesionales a través del Hospital BSE.
