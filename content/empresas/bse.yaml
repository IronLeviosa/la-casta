          retrieved_at: 2026-09-09
    - norma: Ley 16.426 (14/10/1993), desmonopolización general de los seguros, con excepción de
        accidentes de trabajo, seguros de personas públicas estatales y seguro de fianza
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes/16426-1993
          medio: impo
          fecha: 1993-10-14
          tipo: documento_oficial
          titulo: Ley N° 16426, artículo 1
          cita: Declárase libre la elección de las empresas aseguradoras para la celebración de contratos de
            seguros sobre todos los riesgos, en las condiciones que determine la ley. Deróganse
            todas las disposiciones que establecen monopolios de contratos de seguros en favor del
            Estado y ejercidos por el Banco de Seguros del Estado, especialmente los artículos 1 a
            7, inclusive y 29 de la Ley Nº 3.935, de 27 de diciembre de 1911, y el artículo 1 de la
            Ley 7.975, de 19 de julio de 1926. Derógase, asimismo, el artículo 2 de esta última ley.
            Exceptúanse de lo dispuesto precedentemente todos los contratos de seguros que celebren
            las personas públicas estatales y los relativos a accidentes de trabajo y enfermedades
            profesionales a que refiere la ley 16.074, de 10 de octubre de 1989, así como el
            contrato de seguro de fianza a que alude el artículo 503 de la ley 15.903, de 10 de
            noviembre de 1987, y sus modificativas, los que sólo podrán celebrarse con el Banco de
            Seguros del Estado.
          retrieved_at: 2026-09-09
        - url: https://www.impo.com.uy/bases/leyes/16426-1993
