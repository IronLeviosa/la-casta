  argumentos_a_favor:
    - texto: "Uruguay entiende los seguros de accidentes de trabajo no como un negocio, sino como una
        política social: el empleador paga la prima y el beneficio es para el trabajador, y el BSE
        tiene una larga tradición en el tema y un centro asistencial (el Hospital BSE) de referencia
        regional por el tipo de prestaciones que brinda."
      quien: Marcos Otheguy, presidente del Banco de Seguros del Estado (designado en 2025 por el gobierno
        de Yamandú Orsi, Frente Amplio)
      fuentes:
        - url: https://cronicas.com.uy/news-69340-uruguay-entiende-los-seguros-de-accidentes-de-trabajo-no-como-un-negocio-sino-como-una-politica-social
          medio: cronicas
          fecha: 2026-05-29
          tipo: nota
          titulo: '"Uruguay entiende los seguros de accidentes de trabajo no como un negocio, sino como una
            política social"'
          cita: Cuando en la década del 90 se desmonopolizaron los seguros en el país, se mantuvo el monopolio
            de los seguros de accidentes de trabajo y enfermedades profesionales en manos del BSE.
            Yo creo que eso es porque Uruguay entiende los seguros de accidentes de trabajo no como
            un negocio, sino como una política social.El banco tiene una larga tradición de trabajar
            en estos temas y ha generado un centro asistencial de referencia regional, y yo diría
            que mundial, por el tipo de prestaciones que se brindan.
          retrieved_at: 2026-09-09
    - texto: "El seguro de accidentes de trabajo se mantuvo fuera de la desmonopolización de 1993 porque
        tradicionalmente se lo ha tomado como un servicio a la comunidad y, por lo tanto, es
        deficitario: a diferencia de otros ramos, cuya apertura benefició al capital financiero que
        instaló aseguradoras privadas, este ramo no es un negocio lucrativo."
      quien: Guillermo Álvarez, Representante Nacional (Cámara de Diputados)
      fuentes:
        - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-06-04%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0013).pdf
          medio: parlamento
          fecha: 1996-06-04
          tipo: diario_de_sesiones
          titulo: Diario de Sesiones, Cámara de Representantes, 4 de junio de 1996 (0013) — intervención del
            señor Diputado Álvarez
          cita: "legislación aprobada en los últimos años -que en su momento no compartimos- ha brindado al
            capital financiero internacional dos excelentes negocios: por un lado, la
            desmonopolización de los seguros -salvo el de accidentes de trabajo, que
            tradicionalmente se ha tomado como un servicio a la comunidad y, por lo tanto, es
            deficitario- y, por otro, la creación de las Administradoras de Fondos de Ahorro
            Previsional."
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: "No hay ninguna razón por la cual el seguro de accidentes de trabajo debería mantenerse en
        forma monopólica: eso priva al consumidor (las empresas que pagan la prima y los
        trabajadores que son los beneficiarios) de un servicio en condiciones de competencia que
        asegure mejor precio y mejor calidad, tal como ocurrió con el resto de los ramos que se
        desmonopolizaron en 1993, donde hubo una baja sustancial de precios y mayor variedad de
        productos; todas las aseguradoras privadas que operan en Uruguay tienen las capacidades y la
        experiencia para trabajar en accidentes de trabajo porque lo hacen en otros países. En todo
        caso, lo que antes que nada le interesa al sector es igualar las condiciones de competencia,
        y si eso se logra desmonopolizando, mejor."
      quien: Federico Veiroj, director ejecutivo de la Asociación Uruguaya de Empresas Aseguradoras
        (Audea), la cámara que agrupa a las aseguradoras privadas
      fuentes:
        - url: https://www.ambito.com/uruguay/empresas-aseguradoras-abogan-mayor-desregulacion-del-sector-n6095305
          medio: ambito
          fecha: 2024-12-20
          tipo: nota
          titulo: Empresas aseguradoras abogan por mayor "desregulación" del sector
          cita: El Uruguay en el año 1993 resolvió que el mercado de seguros debía funcionar en competencia.
            La verdad que la experiencia de un mercado en competencia en seguros en estos últimos 30
            años ha sido muy buena, para los consumidores ha habido una baja sustancial de precios,
            una mayor variedad de productos. Nosotros no visualizamos ninguna razón por la cual el
            seguro de accidentes de trabajo debería mantenerse en forma monopólica, privando al
            consumidor, que en este caso son las empresas y los beneficiarios, que son los
            trabajadores, de un servicio en condicionada de competencia, que asegure mejor precio y
            mejor calidad
          retrieved_at: 2026-09-09
        - url: https://www.ambito.com/uruguay/empresas-aseguradoras-abogan-mayor-desregulacion-del-sector-n6095305
          medio: ambito
          fecha: 2024-12-20
          tipo: nota
          titulo: Empresas aseguradoras abogan por mayor "desregulación" del sector (matiz del representante
            de la comisión)
          cita: '"En definitiva lo que nos interesa antes que nada es igualar las condiciones de competencia.
            Si es desmonopolizando, mejor, porque todas las compañías privadas que operan en Uruguay
            tienen las capacidades y la experiencia para trabajar en el seguro de accidentes de
            trabajo, porque lo hacen en otros países del mundo y de forma muy robusta", agregó el
            representante de la comisión.'
          retrieved_at: 2026-09-09
    - texto: Votamos en la Legislatura anterior en contra de la desmonopolización de los seguros,
        entendiendo que se debía mantener el monopolio de determinados seguros en favor del Banco de
        Seguros del Estado; hoy hay que reconocer que la ley de desmonopolización fue conveniente
        para los usuarios, porque los seguros son ahora bastante más baratos.
      quien: Diputado García (don Alem), Representante Nacional (Cámara de Diputados)
      fuentes:
        - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-07-09%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0024).pdf
          medio: parlamento
          fecha: 1996-07-09
          tipo: diario_de_sesiones
          titulo: Diario de Sesiones, Cámara de Representantes, 9 de julio de 1996 (0024) — intervención del
            señor Diputado García (don Alem)
          cita: Fuimos de los que votaron en la Legislatura anterior en contra de la desmonopolización de los
            seguros. En aquel momento, entendíamos que se debía mantener el monopolio de
            ·determinados seguros en favor del Banco de Seguros del Estado, pero hoy debemos
            reconocer que la ley de desmonopolización de los seguros fue conveniente para los
            intereses de nuestra sociedad en general y de los usuarios del servicio porque ahora,
            paradojalmente, los seguros son ahora bastante más baratos para quienes contratan con
            esta institución estatal.
          retrieved_at: 2026-09-09
