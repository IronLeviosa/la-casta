monopolio:
  tiene: true
  alcance: 'La Ley 3.935 (27/12/1911) creó el BSE con monopolio estatal de los contratos de seguro que
    cubrieran los riesgos de vida, accidentes de trabajo e incendios. La Ley 16.426 (14/10/1993)
    desmonopolizó la actividad aseguradora en general, declarando libre la elección de empresa
    aseguradora "para todos los riesgos", y derogó expresamente los artículos 1 a 7 y 29 de la Ley
    3.935 que sostenían el monopolio del BSE. La misma Ley 16.426 exceptuó de esa desmonopolización,
    y por lo tanto mantuvo en exclusividad del BSE, tres actividades: los contratos de seguro de las
    "personas públicas estatales", el seguro de accidentes de trabajo y enfermedades profesionales
    de la Ley 16.074 (10/10/1989), y el seguro de fianza del artículo 503 de la Ley 15.903. La Ley
    16.074 regula en detalle el seguro obligatorio de accidentes de trabajo y enfermedades
    profesionales: todo empleador es responsable civil de los accidentes de sus trabajadores, pero
    acreditada la existencia del seguro obligatorio la acción se dirige contra el BSE, que presta
    asistencia médica y abona las indemnizaciones con independencia de que el empleador esté al día,
    con potestad de recuperar de empleadores no asegurados o con dolo o culpa grave. La Ley 18.243
    (27/12/2007) sustituyó por completo la Ley 3.935 como Carta Orgánica del BSE (art. 21: "Derógase
    la Ley N° 3.935, de 27 de diciembre de 1911"), sin modificar el reparto de exclusividad que dejó
    vigente la Ley 16.426. Hoy el BSE compite con aseguradoras privadas en vida, vida previsional
    (donde ninguna privada ofrece el producto, aunque no hay reserva legal) e incendio, automóviles,
    robo/hurto, responsabilidad civil, caución, transporte, riesgos rurales, ingeniería y créditos,
    y mantiene en exclusividad legal el seguro de accidentes de trabajo y enfermedades
    profesionales, y los seguros contratados por otras personas públicas estatales.'
