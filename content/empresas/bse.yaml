resumen: >-
  El Banco de Seguros del Estado (BSE) es un ente autónomo del dominio comercial del Estado, creado
  por la Ley 3.935 de 1911 y reorganizado por su Carta Orgánica actual, la Ley 18.243 de 2007.
  Ofrece seguros de vida, vida previsional y los ramos generales (incendio, automóviles, robo/hurto,
  responsabilidad civil, entre otros) en competencia con aseguradoras privadas desde la
  desmonopolización de 1993, y opera en forma exclusiva el seguro de accidentes de trabajo y
  enfermedades profesionales que crea la Ley 16.074 de 1989.

  El resultado del ejercicio, convertido a dólares con la cotización de cierre de cada año, pasó de
  USD 10,2 millones en 2015 a USD 66,7 millones en 2020 y USD 143,4 millones en 2021, bajó a USD
  77,5 millones en 2022 y volvió a subir hasta USD 103,8 millones en 2024 y USD 144,4 millones en
  2025 (último ejercicio cerrado). El BSE no tuvo pérdidas en ninguno de los once años cargados
  (2015-2025), no recibió capitalizaciones ni aportes del Estado en ese período y no registra deuda
  financiera al cierre de ningún ejercicio.

  Dentro del resultado, el ramo Seguro de Renta Vitalicia (la parte previsional del negocio de vida)
  perdió dinero todos los años en que la planilla del BCU lo desagrega por separado (2019 a 2025),
  con una pérdida técnica creciente que llegó a $ 9.686,0 millones en 2024, la mayor de toda la
  serie. Desde el ejercicio 2022 esa misma planilla cambia los rótulos de otros ramos ("Robo" pasa a
  llamarse "Hurto", se agregan "Varios" y "Todo Riesgo Operativo" y deja de figurar "Invalidez" como
  columna aparte), un cambio de nomenclatura que no altera los montos de los ramos que siguen igual
  pero sí corta la serie de los que cambiaron de nombre.

  El BSE transfirió a Rentas Generales $ 4.157,1 millones en 2024 (utilidades de ejercicios
  anteriores más un adelanto a cuenta de 2024, según el Estado de Evolución del Patrimonio). Según
  la Nota 20.3 de los estados contables hubo transferencias también en 2023, pero no se consiguió el
  documento que da el monto; en 2021 y 2022 no las hubo, y para 2015-2020 y 2025 la ficha no tiene
  el documento que lo declare. El total de tributos del año se pudo cargar en los once años sumando
  dos renglones que la Nota 11 a los estados contables desagrega por separado ("Impuestos, tasas y
  contribuciones" e "Impuesto al patrimonio"), sobre base devengado, no de caja. Queda afuera el
  IRAE (impuesto a la renta), que figura aparte en el resultado del ejercicio y que en 2021, 2023 y
  2024 fue un ingreso para el BSE en lugar de un gasto, así que sumarlo habría reducido el total de
  impuestos justo en años de mayor ganancia.

  El seguro de accidentes de trabajo es el único ramo que la Ley 16.426 de 1993 dejó fuera de la
  desmonopolización general de los seguros, junto con los seguros de las personas públicas estatales
  y el seguro de fianza. A favor de mantener esa reserva se documentan el argumento de que se trata
  de una política social y no de un negocio, sostenido por la presidencia del BSE, y el argumento
  parlamentario de 1996 de que es un ramo deficitario que no atrae capital privado. En contra, la
  cámara de aseguradoras privadas (Audea) sostiene que ninguna razón impide la competencia en ese
  ramo y que la desmonopolización de 1993 bajó los precios en el resto de los ramos, y un diputado
  que había votado en 1993 en contra de desmonopolizar los seguros reconoció en 1996, con la
  desmonopolización ya en marcha, que había bajado los precios para los usuarios.

  Según la propia página de Transparencia del BSE, a diciembre de 2025 el BSE tenía el 71,2% de las
  primas del mercado asegurador uruguayo (dieciséis compañías) y el 67,7% si no se cuenta el ramo de
  accidentes de trabajo, que es monopolio legal suyo; la página no publica la cuota de cada
  competidor privado por separado.

  Esta ficha cubre 2015-2025 (2025 se agregó porque el documento ya estaba disponible al cierre de
  esta corrida). El Banco Central del Uruguay publica los estados contables que el BSE le presenta
  desde al menos 2005; los años 2005-2014 quedan pendientes de una corrección futura, con el mismo
  criterio de cobertura que ya se aplicó a ANCAP, UTE y ANTEL.
