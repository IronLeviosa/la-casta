resumen: >-
  BROU es un banco estatal, organizado como ente autónomo, creado en 1896 por la Ley 2.480; su Carta
  Orgánica vigente es la Ley 18.716 de 2010. Presta los servicios bancarios y financieros habituales
  y compite en esa actividad con nueve bancos privados de plaza. Por otras normas, ajenas a esa
  competencia, es depositario obligado de los depósitos de organismos públicos y de los depósitos
  judiciales, y el Estado responde directamente de sus depósitos y operaciones (ver más abajo).

  Los estados contables auditados que publica el Banco Central del Uruguay (institución 0001)
  permiten extender la serie de resultados a 2001-2006 (con "tipo de cambio interbancario comprador
  de cierre" en 2001-2002 y "tipo de cambio financiero comprador de cierre" en 2003-2006, según la
  nota de cada balance; esta ficha usa siempre la cotización que declara el propio balance), y el
  propio BROU publica en su sitio los Estados Contables auditados por Deloitte de 2007 a 2015, con
  opinión favorable o con salvedades según el año: esta ficha carga 2007-2014 desde esos documentos
  y deja el "informe de indicadores" más breve que BROU difundió hasta 2016 como fuente secundaria
  (un archivo del sitio de BROU llamado "SWIFT_BALANCE_2008.pdf" resultó ser el reporte anual de la
  red de mensajería interbancaria S.W.I.F.T., no un balance del banco, y se descartó).

  En este tramo (2001-2014) el resultado del ejercicio fue positivo todos los años menos 2002, el
  año de la crisis bancaria, en que BROU perdió USD 188,7 millones según su Estado de Resultados
  (convertidos al dólar de cierre de ese año, ya devaluado un 84 % respecto al de 2001). Ese año el
  Estado no capitalizó a BROU: la línea "Aportes de capital" del Estado de Evolución del Patrimonio
  está en cero en los seis balances auditados de 2001 a 2006, y el apoyo de la crisis llegó por otra
  vía, como préstamo del Fondo de Estabilidad del Sistema Bancario que BROU usó del 5 de agosto de
  2002 a diciembre de 2004 (ver hitos); los Estados Contables de 2007 a 2014 no incluyen el Estado
  de Evolución del Patrimonio, así que capitalizaciones_del_estado queda ausente esos ocho años.
  Para 2007-2014 esta ficha toma el total de tributos ("Impuestos, tasas y contribuciones" más
  "Impuesto a la Renta") de los Estados Contables auditados y no del informe de indicadores, que en
  los años cruzados da una cifra unos $ 10 millones más alta por una reclasificación entre
  "impuestos" y "otras pérdidas".

  El resultado del ejercicio fue positivo los diez años del período 2015-2024, sin ninguna pérdida:
  pasó de USD 197,8 millones en 2015 a USD 773,7 millones en 2024, con el mínimo en 2016 (USD 74,6
  millones). La serie cambia de norma contable en el ejercicio 2017: hasta 2016 los balances de BROU
  se presentaban como "informe de indicadores", con una línea "Resultado por Inflación"; desde 2017
  se presentan bajo Normas Internacionales de Información Financiera (NIIF). Esta ficha carga el
  resultado de 2017 reexpresado por NIIF ($ 5.886,4 millones, USD 204,6 millones), que trae el
  balance de 2018 como columna comparativa; en el formato contable anterior, el mismo ejercicio 2017
  había cerrado en $ 5.025 millones (USD 174,7 millones con la cotización de ese informe). Dentro de
  la serie 2001-2016 el ajuste por inflación entra y sale de los balances: el estado de resultados
  de 2003 trae una línea "RESULTADO POR INFLACION" de $ -485,7 millones; los Estados Contables y el
  informe de indicadores la muestran en cero en 2007, 2008, 2011, 2012 y 2013, y con pérdida en 2009
  ($ -1.856,3 millones según el Estado de Resultados auditado, distinto de los $ -1.628 millones que
  agrega el informe de indicadores) y en 2010 ($ -1.176 millones según el informe de indicadores);
  desde enero de 2014 el banco retomó el ajuste según la Comunicación 94/156 del BCU, con una
  pérdida neta por inflación de $ 2.176,1 millones ese año, según la propia nota C.6.1 del balance
  de 2014.

  BROU paga y recauda impuestos por un monto que se movió entre USD 96,9 millones (2015) y USD 242,5
  millones (2024); sus balances no traen un renglón único de "total de impuestos", así que esta
  ficha suma el Impuesto a la Renta de operaciones continuas y la línea "Impuestos, tasas y
  contribuciones" de la nota de gastos generales. La serie está en base devengada (lo que el banco
  contabilizó ese año), no en base de caja (lo que efectivamente pagó); el balance de 2024 permite
  comparar las dos convenciones para ese año: el Impuesto a la Renta devengado fue $ 7.436,7
  millones, y el estado de flujos de efectivo registra pagos por Impuesto a las ganancias de $
  6.760,4 millones, un 9,1 % menos. En el tramo 2001-2006, con balances auditados por el BCU, el
  total de tributos tiene su propia nota (Nota 6 - Impuestos) con un renglón de total explícito en
  todos los años salvo 2001 (donde esta ficha lo suma a partir de los conceptos individuales) y 2002
  (donde la nota no trae desglose y el dato queda ausente).

  Las transferencias al Estado combinan dos artículos de la Carta Orgánica: el artículo 11 fija
  hasta el 50 % de las utilidades netas anuales con destino a Rentas Generales, y el artículo 40
  habilita al Poder Ejecutivo a pedir hasta un 30 % adicional con destino a fondos específicos que
  no vuelven al banco (el Fondo Solidario COVID-19, la ANDE, la ACAU y el Proyecto Ferrocarril
  Central; la redacción vigente del artículo 40 es de la Ley 20.075 de 2022, antes de la Ley 19.889
  de 2020, y originalmente de la propia Ley 18.716 de 2010). Esta ficha carga el total de los dos
  artículos, que entre 2019 y 2024 pasó de USD 181,4 a USD 404,8 millones; cada pago del artículo 40
  queda además como hito propio en la línea de tiempo. En el tramo 2001-2014 se cargaron, con
  criterio de caja, las transferencias de 2008 (US$ 30 millones más $ 1.324,3 millones), 2009 ($
  3.506,8 millones), 2011 (US$ 120 millones), 2012 ($ 2.021,3 millones) y 2013 ($ 1.740,0 millones);
  en 2001 y 2002 los balances documentan solo la cancelación parcial de un adelanto pagado en 2000,
  no una transferencia nueva de caja, y en 2003 a 2007, 2010 y 2014 no se encontró la nota
  correspondiente pese a buscarla en los mismos Estados Contables y Notas a los Estados Contables.
  Los ejercicios 2015 y 2017 quedan igual sin este dato.

  El Estado no aportó capital fresco a BROU en ningún año del período con este dato disponible (2001
  a 2006 y 2017 a 2024): el Estado de Evolución del Patrimonio de los balances auditados de 2001 a
  2006, y la línea "4.1 Aumentos de capital" del estado de cambios en el patrimonio de 2017 en
  adelante, están en cero todos los años. El crecimiento del patrimonio del tramo reciente (de $
  45.341,2 millones en 2017 a $ 112.463,2 millones en 2024) proviene de la capitalización de
  utilidades retenidas del propio banco, no de un ingreso adicional del Tesoro; 2007 a 2016 quedan
  sin este dato porque el "informe de indicadores" de esos años no incluye el estado de evolución
  del patrimonio. El balance de 2024 cita el "artículo 140" de la Ley 18.716 para uno de los pagos
  del artículo 40 (31 de julio de 2024); ese artículo no existe en una ley de 40 artículos, y es,
  con toda probabilidad, una errata del propio documento del banco por "artículo 40". El patrimonio
  de 2023 en el estado de situación separado ($ 96.645,0 millones) difiere del consolidado con la
  participación no controladora ($ 98.233,5 millones); esta ficha usa siempre el separado, como el
  resto de sus cifras. El campo deuda_financiera queda vacío en los 24 años cargados: para un banco,
  cuyo pasivo son mayoritariamente depósitos de clientes y no préstamos financieros propiamente
  dichos, los balances de BROU no traen un renglón equivalente al de una empresa no financiera.

  BROU no tiene un monopolio sobre la actividad bancaria: compite con nueve bancos privados de
  plaza. Tiene tres privilegios legales ajenos a esa competencia. El Estado responde directamente de
  sus depósitos y operaciones (artículo 24, Ley 18.716), una garantía que los bancos privados no
  tienen (su respaldo es el acotado Fondo de Garantía de Depósitos Bancarios). Es depositario
  obligado de los depósitos de organismos públicos, salvo excepción autorizada por el Poder
  Ejecutivo (Ley 15.903 de 1987, artículo 453; Ley 18.716, artículo 25). Y desde 2007 recibe también
  los depósitos judiciales que antes se radicaban en el Banco Hipotecario del Uruguay (Ley 18.125).
  Según AEBU, en 2021 el 96 % de los US$ 1.623 millones en depósitos del sector estatal (9,7 % de
  los depósitos totales del sector no financiero del país) estaba en bancos públicos.

  Ese año el Poder Ejecutivo propuso, en el artículo 281 del proyecto de Rendición de Cuentas 2020,
  terminar con la exclusividad sobre los depósitos públicos; el artículo generó objeciones dentro de
  la coalición de gobierno y fue retirado antes de su votación en la Comisión de Presupuestos de
  Diputados. Sobre si ese diseño debe mantenerse hay posiciones documentadas de los dos lados: a
  favor, entre otros, AEBU (el sindicato bancario) y la diputada frenteamplista Lilián Galán; en
  contra, el entonces presidente del Banco Central Diego Labat (que sostuvo ante el Parlamento que
  la apertura no afectaría la competitividad de BROU) y una misión conjunta del FMI y el Banco
  Mundial que en 2013 describió el monopolio de depósitos públicos y la garantía estatal como
  "ventajas competitivas" de BROU y recomendó designar al Banco Central como depositario único de
  los fondos del gobierno.

  BROU desagrega el resultado en cuatro segmentos de negocio desde el ejercicio 2017 (no antes):
  Corporativa, Personas, Finanzas y Otros. Los tres primeros tuvieron resultado positivo los ocho
  años con este dato (2017-2024); el segmento Otros, que agrupa gastos de funcionamiento, impuesto a
  la renta, impuesto al patrimonio y resultados por valuación que el banco no reparte entre los
  demás segmentos, fue negativo los ocho años, entre $ -9.649,6 millones (2019) y $ -26.406,8
  millones (2022).

  Esta ficha reúne 2001-2024: 2015-2024 desde los informes de indicadores y los estados financieros
  auditados que el propio BROU publica, 2001-2006 desde los estados contables auditados que publica
  el BCU, y 2007-2014 desde los Estados Contables auditados que el propio BROU publica en su sitio,
  con el mismo criterio usado para ANCAP, UTE y ANTEL. No hay un documento contable propio anterior
  a 2001 en el sitio de BROU, en Wayback, en el BCU, en el catálogo de la Biblioteca del Parlamento
  (que solo tiene historias institucionales del banco, no sus balances) ni en una búsqueda por texto
  del Diario Oficial: el banco existe desde 1896, pero el primer estado contable auditado localizado
  es el de 2001.
