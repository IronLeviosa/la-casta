    titulo: Ley N° 18716, artículo 12 (Cometidos)
    cita: Artículo 12(Cometidos). El Banco tendrá como principales cometidos, procurar que los servicios
      financieros resulten accesibles a la población, estimular el ahorro como instrumento de
      desarrollo personal y fomentar la producción de bienes y servicios de forma de contribuir al
      crecimiento económico y social del país.
    retrieved_at: 2026-09-09
  - url: https://impo.com.uy/bases/leyes/18716-2010
    medio: impo
    fecha: 2010-12-24
    tipo: documento_oficial
    titulo: Ley N° 18716, artículo 13 (Atribuciones principales)
    cita: Artículo 13(Atribuciones principales). El Banco podrá realizar toda clase de operaciones
      comerciales y/o financieras que constituyan transacciones bancarias usuales y que no se
      encuentren prohibidas por la Constitución de la República y esta Carta Orgánica.
    retrieved_at: 2026-09-09
monopolio:
  tiene: true
  alcance: 'BROU no tiene un monopolio sobre la actividad bancaria en general: compite con nueve
    bancos privados de plaza. Tiene tres privilegios legales ajenos a esa competencia. Primero, la
    garantía del Estado: el artículo 24 de la Ley 18.716 establece que "el Estado responde
    directamente de los depósitos y operaciones que realice el Banco", una garantía ilimitada que
    los bancos privados no tienen (su respaldo es el Fondo de Garantía de Depósitos Bancarios,
    acotado). Segundo, la reserva de los depósitos de organismos públicos y judiciales: el artículo
    453 de la Ley 15.903 (1987) y el artículo 25 de la Ley 18.716 (2010) exigen depositar los fondos
    de instituciones públicas y los depósitos judiciales de conformidad con esas disposiciones,
    salvo excepción autorizada por el Poder Ejecutivo. Según AEBU, en 2021 el 96 % de los US$ 1.623
    millones en depósitos del sector estatal (9,7 % de los depósitos totales del sector no
    financiero del país) estaba en bancos públicos; en los balances de BROU los depósitos del
    "Sector Público" fueron $ 42.996, $ 49.239 y $ 49.113 millones en 2015, 2016 y 2017
    respectivamente. En 2021 el Poder Ejecutivo propuso, en el artículo 281 del proyecto de
    Rendición de Cuentas 2020 (que sustituía el artículo 453 de la Ley 15.903), terminar con esa
    exclusividad y permitir el depósito en cualquier banco autorizado; el artículo generó objeciones
    dentro de la coalición de gobierno y fue retirado antes de su votación en la Comisión de
    Presupuestos de Diputados.'
