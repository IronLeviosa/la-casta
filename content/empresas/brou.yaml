          retrieved_at: 2026-09-09
  argumentos_a_favor:
    - texto: La norma que terminaba con la exclusividad de BROU en los depósitos de organismos públicos
        (artículo 281 de la Rendición de Cuentas de 2021) deteriora la competitividad de las
        instituciones públicas y promueve que el sector privado capte depósitos que tienen un
        volumen significativo respecto al tamaño del mercado uruguayo; de aprobarse, el banco
        perdería espacio de mercado y rentabilidad, y se erosionaría su capacidad de sostener
        políticas crediticias con objetivos de desarrollo, que en el mercado local solo pueden
        llevar adelante estas instituciones.
      quien: Asociación de Bancarios del Uruguay (AEBU), en un comunicado de su Consejo Central
      fuentes:
        - url: https://www.elobservador.com.uy/nota/aebu-pide-dejar-sin-efecto-articulo-que-elimina-exclusividad-del-brou-en-depositos-de-instituciones-publicas-20217695135
          medio: el-observador
          fecha: 2021-07-06
          tipo: nota
          titulo: AEBU pide "dejar sin efecto" artículo que elimina exclusividad del BROU en depósitos de
            instituciones públicas
          cita: La norma impulsada por el Poder Ejecutivo deteriora la competitividad de las instituciones
            públicas y promueve la participación del sector privado en la captación de estos
            depósitos, que tienen un volumen significativo respecto al tamaño del mercado uruguayo
          retrieved_at: 2026-09-09
    - texto: "Los depósitos de las empresas públicas no deberían quedar librados a que cada una elija
        dónde le conviene capitalizar mejor: colocar el dinero en la banca estatal tiene que ser una
        política de Estado, entre otras razones porque las empresas públicas tienen como cometido,
        según sus Cartas Orgánicas, no solo el lucro sino también una función social; la apertura de
        estos depósitos a la banca privada, además, es un viejo reclamo de una banca privada que en
        Uruguay es mayoritariamente transnacional."
      quien: Lilián Galán, diputada del MPP (Frente Amplio), ante la Comisión de Presupuestos integrada
        con Hacienda de la Cámara de Representantes
      fuentes:
        - url: http://www.diputados.gub.uy/com/presup/Primer%20tratamiento/Versiones%20taquigr%C3%A1ficas/09%20VT%2022-07%20MEF%20UTEC.PDF
          medio: parlamento
          fecha: 2021-07-22
          tipo: diario_de_sesiones
          titulo: Versión taquigráfica de la Comisión de Presupuestos integrada con Hacienda, Cámara de
            Representantes, 22/7/2021 (Rendición de Cuentas 2020, artículos 279 a 282)
          cita: Ustedes decían que las empresas públicas pueden elegir libremente; nosotros pensamos que esto
            de las empresas públicas tiene que ser una política de Estado. No me imagino a las
            empresas públicas, una por una, eligiendo dónde poner su dinero porque pueden
            capitalizar mejor. Colocar su dinero en la banca estatal tiene que ser una política de
            Estado. Además, las empresas públicas tienen determinado en sus Cartas Orgánicas que su
            función no es el lucro, sino también una función social.
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: Los artículos 279 a 282 de la Rendición de Cuentas 2020 (que habilitan a que las
        instituciones públicas depositen en cualquier banco habilitado por el Banco Central, y no
        solo en BROU) buscan fomentar mayor competencia en un segmento del mercado con restricciones
        de ingreso; lo que debe guiar esa apertura es velar por la estabilidad del sistema
        financiero, su solidez, solvencia, eficiencia y desarrollo, no la posición de un banco en
        particular.
      quien: Diego Labat, presidente del Banco Central del Uruguay (BCU), ante la Comisión de Presupuestos
        integrada con Hacienda de la Cámara de Representantes
      fuentes:
        - url: http://www.diputados.gub.uy/com/presup/Primer%20tratamiento/Versiones%20taquigr%C3%A1ficas/09%20VT%2022-07%20MEF%20UTEC.PDF
          medio: parlamento
          fecha: 2021-07-22
          tipo: diario_de_sesiones
          titulo: Versión taquigráfica de la Comisión de Presupuestos integrada con Hacienda, Cámara de
            Representantes, 22/7/2021 - exposición de Diego Labat
          cita: >-
            Lo que quiero decir con todos estos ejemplos es que lo que nos ha guiado y lo que nos
            debe guiar -es la obligación que tenemos- es velar por esa estabilidad del sistema

            financiero, por la solidez, la solvencia, la eficiencia y el desarrollo del sistema
            financiero.

            Y no se busca otra cosa que eso.
          retrieved_at: 2026-09-09
        - url: http://www.diputados.gub.uy/com/presup/Primer%20tratamiento/Versiones%20taquigr%C3%A1ficas/09%20VT%2022-07%20MEF%20UTEC.PDF
          medio: parlamento
          fecha: 2021-07-22
          tipo: diario_de_sesiones
          titulo: Versión taquigráfica de la Comisión de Presupuestos integrada con Hacienda, Cámara de
            Representantes, 22/7/2021 - artículos 279 a 282
          cita: |-
            Los artículos 279 a 282 -voy a hacer referencia en conjunto porque están los cuatro
            relacionados- tienen que ver con la posibilidad de que las instituciones públicas puedan
            abrir cuentas en cualquier banco habilitado por el Banco Central del Uruguay
          retrieved_at: 2026-09-09
        - url: http://www.diputados.gub.uy/com/presup/Primer%20tratamiento/Versiones%20taquigr%C3%A1ficas/09%20VT%2022-07%20MEF%20UTEC.PDF
          medio: parlamento
          fecha: 2021-07-22
          tipo: diario_de_sesiones
          titulo: Versión taquigráfica de la Comisión de Presupuestos integrada con Hacienda, Cámara de
            Representantes, 22/7/2021 - respuesta sobre competitividad del BROU
          cita: |-
            SEÑOR LABAT (Diego).- Yo entiendo que eso no va a afectar la competitividad del
            Banco de la República, y creo -esta es una opinión personal-, que, claramente, va a
            ayudar a fortalecerlo.
          retrieved_at: 2026-09-09
    - texto: El monopolio de BROU sobre los depósitos del sector público (sujeto a un encaje del 100 %) y
        su garantía explícita, ilimitada y permanente de depósitos son ventajas competitivas frente
        a los bancos privados; para promover más igualdad de condiciones entre bancos, las
        autoridades deberían considerar designar al Banco Central, y no a un banco comercial, como
        depositario único de los fondos del gobierno.
      quien: Misión conjunta del Fondo Monetario Internacional y el Banco Mundial (Programa de Evaluación
        del Sector Financiero, FSAP, informe de mayo de 2013)
      fuentes:
        - url: https://www.imf.org/external/pubs/ft/scr/2013/cr13152.pdf
          medio: fmi
          fecha: 2013-05-01
          tipo: documento_oficial
          titulo: "Uruguay: Financial System Stability Assessment (IMF Country Report No. 13/152) - Box 1"
          cita: >-
            Box 1. Competitive Advantages and Disadvantages of BROU

            Competitive advantages

            • 	The right to deduct payments directly from payroll to recover interest and principal
            on consumer loans.

            • 	Monopoly on public sector deposits (although subject to 100 percent reserve
            requirement).

            • 	Explicit unlimited and permanent deposit guarantee.
          retrieved_at: 2026-09-09
        - url: https://www.imf.org/external/pubs/ft/scr/2013/cr13152.pdf
          medio: fmi
          fecha: 2013-05-01
          tipo: documento_oficial
          titulo: "Uruguay: Financial System Stability Assessment (IMF Country Report No. 13/152) -
            recomendación sobre depósitos públicos"
          cita: |-
            Finally, to further promote a level playing field among banks, authorities should
            consider designating the BCU as the sole depository of government funds.
          retrieved_at: 2026-09-09
