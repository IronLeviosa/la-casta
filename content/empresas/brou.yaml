hitos:
  - fecha: 1896-08-04
    titulo: Creación del BROU por la Ley 2.480
    detalle: Se sancionó la ley con las 34 bases de la Carta Orgánica; el Banco se constituyó como
      empresa mixta, con la primera serie de acciones integrada por el Estado.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: El 4 de agosto de 1896 se sancionó la ley que contenía las treinta y cuatro bases de la Carta
          Orgánica. El Banco se constituyó como empresa mixta, con un capital autorizado de 12
          millones de pesos nominales representativos de 10 millones de pesos efectivos, a
          integrarse en dos series de acciones.
        retrieved_at: 2026-09-09
  - fecha: "1913"
    titulo: Estatización completa y primera corrida bancaria
    detalle: La segunda serie de acciones nunca fue integrada por particulares, lo que posibilitó la
      estatización completa del Banco entre 1911 y 1913; en 1913 el BROU debió enfrentar una corrida
      de depósitos que superó.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: La primera serie de 5 millones de pesos fue integrada por el Estado y la segunda nunca lo fue
          por particulares, lo que posibilitó su completa estatización en el corto plazo
          (1911-1913).
        retrieved_at: 2026-09-09
  - fecha: "1935"
    titulo: División en Departamento Bancario y Departamento de Emisión
