        url: https://web.archive.org/web/20060614040606id_/http://www.bcu.gub.uy:80/autoriza/sieras/balaudi_200412_0001.pdf
        medio: bcu
        fecha: 2004-12-31
        tipo: documento_oficial
        titulo: Estados Contables del BROU al 31/12/2004 (BCU) - Nota 3.21.4, Pasivo con el FESB
        cita: >-
          3.21.4. 	Pasivo con el Fondo de estabilidad del sistema bancario (FESB)

          El Banco a partir del 5 de agosto de 2002 hizo uso del referido Fondo, generándose un
          pasivo con el mismo.

          Al 31 de diciembre de 2004 el fondo se encuentra cancelado.

          En junio de 2004 se procedió a realizar una utilización del fondo por $ miles 4.874.750,
          en julio de 2004 se realizó una

