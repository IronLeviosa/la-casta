    detalle: "Fue un préstamo, no una capitalización: el Banco generó un pasivo con el Fondo que se
      canceló recién en diciembre de 2004, con una utilización adicional en junio de 2004 y una
      compensación con el convenio del BHU en julio de ese año."
    fuentes:
