hitos:
  - fecha: 1896-08-04
    titulo: Creación del BROU por la Ley 2.480
    detalle: Se sancionó la ley con las 34 bases de la Carta Orgánica; el Banco se constituyó como
      empresa mixta, con la primera serie de acciones integrada por el Estado.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: El 4 de agosto de 1896 se sancionó la ley que contenía las treinta y cuatro bases de la Carta
          Orgánica. El Banco se constituyó como empresa mixta, con un capital autorizado de 12
          millones de pesos nominales representativos de 10 millones de pesos efectivos, a
          integrarse en dos series de acciones.
        retrieved_at: 2026-09-09
  - fecha: "1913"
    titulo: Estatización completa y primera corrida bancaria
    detalle: La segunda serie de acciones nunca fue integrada por particulares, lo que posibilitó la
      estatización completa del Banco entre 1911 y 1913; en 1913 el BROU debió enfrentar una corrida
      de depósitos que superó.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: La primera serie de 5 millones de pesos fue integrada por el Estado y la segunda nunca lo fue
          por particulares, lo que posibilitó su completa estatización en el corto plazo
          (1911-1913).
        retrieved_at: 2026-09-09
  - fecha: "1935"
    titulo: División en Departamento Bancario y Departamento de Emisión
    detalle: Buscó resolver la contradicción entre la función crediticia y la función emisora del Banco.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: en 1935 se dividió a la Institución en dos, con la creación de un Departamento Bancario y un
          Departamento de Emisión, con la intención de resolver la contradicción entre sus funciones
          crediticia y emisora.
        retrieved_at: 2026-09-09
  - fecha: "1967"
    titulo: El Departamento de Emisión se separa y da origen al Banco Central del Uruguay
    detalle: Consecuencia de la crisis bancaria de 1965 y de la nueva Constitución vigente desde 1967.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: En 1965 se produjo una profunda crisis bancaria que, entre sus consecuencias, trajo separación
          del Departamento de Emisión del Banco de la República y su transformación en una nueva
          entidad, el Banco Central del Uruguay, creado a partir de la Constitución que entró en
          vigencia en 1967.
        retrieved_at: 2026-09-09
  - fecha: "1985"
    titulo: BROU se hace cargo de cuatro bancos privados en dificultades ("bancos gestionados")
    detalle: Gestionó, aportó capital y absorbió pérdidas de esas entidades entre 1985 y 1987, como
      herramienta frente a la inestabilidad financiera post-crisis de 1982.
    fuentes:
      - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
        medio: brou
        fecha: 2026-09-09
        tipo: documento_oficial
        titulo: Creación del banco - BROU
        cita: la Institución se hizo cargo de cuatro bancos privados – los "bancos gestionados" – a partir
          de 1985 y 1987. Gestionó, aportó capital y se hizo cargo de pérdidas de estas entidades,
          constituyéndose en una herramienta fundamental frente a los episodios de inestabilidad del
          sistema financiero.
        retrieved_at: 2026-09-09
  - fecha: 1987-11-10
    titulo: Ley 15.903 obliga a depositar los fondos públicos en bancos del Estado
    detalle: El artículo 453 fija la regla vigente sobre dónde deben depositarse los recursos públicos,
      con excepción autorizada por el Poder Ejecutivo.
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/15903-1987/453
        medio: impo
        fecha: 1987-11-10
        tipo: documento_oficial
        titulo: Ley N° 15903, artículo 453
        cita: Su producto deberá depositarse en bancos del Estado. En casos de excepción debidamente
          fundados, el Poder Ejecutivo podrá autorizar su depósito en instituciones financieras no
          estatales.
        retrieved_at: 2026-09-09
  - fecha: 2002-08-04
    titulo: Ley 17.523 crea el Fondo de Estabilidad del Sistema Bancario y reprograma depósitos
    detalle: En plena crisis financiera, la ley reprogramó los vencimientos de los depósitos a plazo
      fijo en moneda extranjera y creó un Fondo de US$ 1.500 millones con desembolsos de organismos
      multilaterales, que garantizó los depósitos de BROU y del Banco Hipotecario del Uruguay y les
      entregó las sumas "en carácter de préstamo".
    fuentes:
      - url: https://www.impo.com.uy/bases/leyes/17523-2002
        medio: impo
        fecha: 2002-08-04
        tipo: documento_oficial
        titulo: Ley N° 17523, artículos 1 y 2
        cita: |-
          Artículo 1 Créase un Fondo de Estabilidad del Sistema Bancario que se integrará con 
          los desembolsos de los organismos multilaterales de crédito por un monto 
          total de US$ 1.500.000.000 (mil quinientos millones de dólares de los 
          Estados Unidos de América) otorgados con la finalidad de proveer los 
          recursos
        retrieved_at: 2026-09-09
      - url: https://www.impo.com.uy/bases/leyes/17523-2002
        medio: impo
        fecha: 2002-08-04
        tipo: documento_oficial
        titulo: Ley N° 17523, artículo 2
        cita: |-
          Artículo 2 Sin perjuicio de la garantía del Estado establecida en sus respectivas 
          cartas orgánicas, el Fondo de Estabilidad del Sistema Bancario garantiza 
          el total cumplimiento de los depósitos de los ahorristas del Sector No 
          Financiero en moneda extranjera existentes al 30 de julio de 2002 en el 
          Banco de la República Oriental del Uruguay y el Banco Hipotecario del 
          Uruguay, tanto en cuenta corriente como en caja de ahorros. Las sumas que 
          suministre el Fondo a dichos Bancos lo serán en carácter de préstamo en 
          los términos que establezca la reglamentación.
        retrieved_at: 2026-09-09
