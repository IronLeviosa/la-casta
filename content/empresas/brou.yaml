    8 años que faltaban), B2 (cita de Labat corregida contra la versión taquigráfica del 22/7/2021,
    sin la cláusula que la fuente no respaldaba) y B3 (artículo 24 de la Ley 18.716 agregado a
    `monopolio.normas` y a `alcance`). También los 13 `corregir`: C1 (2017 con documento propio y
    quiebre de norma declarado), C2 (capitalizaciones en cero con cita 2017-2024; agregué yo mismo
    `usd`/`cotizacion` a esos ocho registros, que habían quedado con `pesos: 0` sin par en dólares y
    por eso el gráfico los habría descartado igual que a B1), C3 (transferencias con artículo 11 +
    artículo 40), C4 y C5 (notas y conceptos de una oración), C6 (impuestos 2016 completado con la
    Memoria Anual; serie devengada declarada en el resumen), C7 (analisis.yaml nuevo), C8 (hitos
    reordenados y con fuente primaria), C9 y C10 (alcance con cifras, cita del artículo 25
    completa), C11 (Ache reemplazado por Galán, con fuente primaria), C12 (2009-2014 declarado como
    pendiente en el resumen, no cargado: la vuelta 2 documentó que no había margen para hacerlo con
    el mismo rigor que los bloqueadores, y lo dejo así para no demorar más este lote; los documentos
    ya están confirmados en el inventario para una corrida futura) y C13 (2015 y 2017 quedan sin
    transferencias con la búsqueda agotada y declarada, tal como preveía la propia acción sugerida
    de la crítica). De los avisos, quedan sin resolver A2 (la cita de `resultado_ejercicio`
    2019-2024 sale de la nota de segmentos y no del renglón directo del estado de resultados; los
    valores están verificados y coinciden, es preferencia de fuente) y A4 (tres hitos --1913, 1935,
    1985-- dependen solo de la página institucional de BROU, sin fecha propia, cargada con `fecha`
    de retrieval); ninguno de los dos cambia una cifra ni una calificación, quedan para una vuelta
    futura. Corregí un error de forma no señalado por la crítica: el `usd` de 2015 (197,9) no
    cerraba con `pesos/cotizacion` (197,8); ver razones.md. Pendiente para `/revisar` antes de
    promover: `pnpm validar --red` da 4 errores porque
    `http://www.diputados.gub.uy/com/presup/Primer%20tratamiento/Versiones%20taquigráficas/09%20VT%\
    2022-07%20MEF%20UTEC.PDF` (la versión taquigráfica que resuelve B2, B3 parcialmente y C11)
    devuelve HTTP 502 y no tiene copia en Wayback; probé varias veces en esta sesión (con y sin
    `www`, http y https) y el sitio siguió caído. El documento está íntegro en el corpus (bajado hoy
    a las 05:20, 278.618 caracteres, `pnpm fuente` lo sirve desde caché) y las cinco citas que salen
    de él pasaron `--red --solo citas` sin error; lo único que falta es que `pnpm archivar` (que no
    corro yo) le consiga una copia en Wayback, o reintentar cuando el sitio de Diputados vuelva a
    responder. No bajo el tier por esto: la evidencia está verificada y completa, es la
    disponibilidad del sitio en vivo la que está caída."
