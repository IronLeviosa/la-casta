revision:
  tier: publicado
  notas_internas: >-
    Editor, corrida 2026-09-09-brou-serie-historica. El bloque `revision` que traía este crudo era
    el de la corrida anterior (2026-09-07-empresas-brou), con objeciones (B3, C11-C13) que no son
    las de esta corrida: es contenido residual de haber partido de la ficha ya publicada como base
    para extenderla. Lo reescribo entero; el detalle de por qué queda en razones.md.

    Vuelta 2 del investigador (notas.md) resolvió los dos `bloquea` de critica.md (Opus) con
    documento oficial. B1: recargó 2007-2014 desde los Estados Contables auditados que BROU publica
    en su propio sitio (antes el resumen y dos `concepto` afirmaban que ese documento no existía,
    cuando estaba a un clic), con el informe de indicadores como fuente secundaria. B2: cargó con
    criterio de caja las transferencias a Rentas Generales de 2008, 2009, 2011, 2012 y 2013 (Nota
    C.6.4), y para 2001-2002 reemplazó "no se encontró documento" por la explicación correcta
    (cancelación de un adelanto de 2000, no transferencia nueva).

    De los 10 `corregir`: C1 (impuestos_pagados de 2008 recargado a $1.388,6 M desde el auditado,
    mismo criterio aplicado a 2007 y 2009-2014); C2 (la cita del hito 2010-12-24 pasa a los
    artículos 11 y 40, que sostienen el `detalle`; el artículo 39 queda como fuente adicional de la
    derogación que el `detalle` también menciona); C3 (la comparación con el BHU, que atribuía mal
    la ley de capitalización, se sacó del resumen y del `concepto` de 2002); C4 (hito nuevo del uso
    del Fondo de Estabilidad del Sistema Bancario, 5/8/2002 a 12/2004, con `nota` de una línea en
    2002-2004); C5 (párrafo del resumen sobre los años con y sin ajuste por inflación dentro de
    2001-2016, con cifra); C6 (`concepto` de 2002 y de 2008 reducidos a una oración); C7 (unifiqué
    yo mismo el `concepto` de `capitalizaciones_del_estado` de 2002, que había quedado con una
    redacción distinta a los otros cinco años de 2001-2006 y habría generado dos notas al pie en vez
    de una); C8 (las citas del informe de indicadores, como fuente secundaria, pasan a una sola
    línea; las del documento auditado siguen siendo bloques largos en 2008-2014 porque el PDF
    entrelaza etiquetas y montos de columnas distintas, y acortarlas rompería la correspondencia
    entre cada número y su concepto — es la misma razón por la que 2010-2013 citan "montos" y
    "etiquetas" por separado; ver razones.md); C9 (se agregaron las vías de la Biblioteca del
    Parlamento y el Diario Oficial a la búsqueda de 1896-2000, sin resultado en ninguna); C10
    (segunda fuente sin OCR, del propio sitio de BROU, para el resultado de 2006).

    De los avisos: A1 (nada que corregir en el registro, la premisa del encargo era falsa), A2
    (hipótesis del código 0001=BROU con dos corroboraciones agregadas, sigue como hipótesis), A3,
    A4, A5 y A7 (cláusulas agregadas al resumen), A6 (sin acción: el propio crítico concluye que el
    umbral de extensión del resumen, si se aplica, es transversal a las ocho fichas de empresas y no
    algo para resolver ficha por ficha), A8 (mapa de carpetas confirmado uno por uno abriendo cada
    documento, no dado por bueno).

    Verificado campo por campo: ninguna cifra de `finanzas[2015..2024]` cambió respecto de la ficha
    publicada. Sí cambian, respecto de lo publicado, el `detalle` y las `fuentes` del hito de
    2010-12-24 y se agrega un hito nuevo (2002-08-05); los dos quedan en la corrección adjunta
    (`_correccion.yaml`). No hay casos judiciales, giros ni fuentes `verificacion: manual` en este
    lote: no hace falta aprobación humana para publicar.
