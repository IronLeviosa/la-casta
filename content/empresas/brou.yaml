nombre: BROU
nombre_completo: Banco de la República Oriental del Uruguay
tipo: ente_autonomo
alias:
  - BROU
  - Banco República
  - el banco estatal
creacion:
  fecha: 1896-08-04
  norma: Ley 2.480
  fuentes:
    - url: https://impo.com.uy/bases/leyes/18716-2010
      medio: impo
      fecha: 2010-12-24
      tipo: documento_oficial
      titulo: Ley N° 18716, artículo 1
      cita: El Banco de la República Oriental del Uruguay, creado por la Ley Nº 2.480, de 4 de agosto de
        1896, es un servicio del dominio comercial del Estado, organizado bajo la forma de ente
        autónomo, que se regirá por las disposiciones de las Secciones XI, XIII y XIV de la
        Constitución de la República y las que por esta ley se establecen, así como por las leyes
        que regulan la actividad bancaria.
      retrieved_at: 2026-09-09
    - url: https://brou.com.uy/institucional/el-banco/creacion-del-banco
      medio: brou
      fecha: 2026-09-09
      tipo: documento_oficial
      titulo: Creación del banco - BROU
      cita: El 4 de agosto de 1896 se sancionó la ley que contenía las treinta y cuatro bases de la Carta
        Orgánica. El Banco se constituyó como empresa mixta, con un capital autorizado de 12
        millones de pesos nominales representativos de 10 millones de pesos efectivos, a integrarse
        en dos series de acciones. La primera serie de 5 millones de pesos fue integrada por el
        Estado y la segunda nunca lo fue por particulares, lo que posibilitó su completa
        estatización en el corto plazo (1911-1913).
      retrieved_at: 2026-09-09
que_hace: BROU es un banco estatal, organizado como ente autónomo, que presta todos los servicios
  bancarios y financieros habituales (depósitos, créditos, avales, tarjetas, comercio exterior) y
  compite en esa actividad con los bancos privados de plaza. Por su Carta Orgánica tiene como
  cometidos principales procurar que los servicios financieros resulten accesibles a la población,
  estimular el ahorro y fomentar la producción de bienes y servicios. A la vez, por otras normas
  (ver "monopolio"), es depositario obligado de los fondos de organismos públicos y de los depósitos
  judiciales, salvo excepción autorizada por el Poder Ejecutivo.
