resumen: >-
  ANP es un servicio descentralizado creado en 1916 (Ley 5.495) que administra el Puerto de
  Montevideo y otros puertos que le encomienda el Poder Ejecutivo (Nueva Palmira, Fray Bentos,
  Colonia y Juan Lacaze desde 1993; Paysandú y Salto desde 2006; Sayago desde 2008; La Paloma desde
  2014; y los puertos deportivos de Carmelo, Colonia y Piriápolis desde 2021). Desde la Ley de
  Puertos (16.246, 1992) no opera en exclusividad los servicios de carga y descarga: esos se prestan
  en competencia entre empresas privadas y la propia ANP, mientras la administración del puerto y la
  fijación de tarifas máximas quedan reservadas a ANP.

  Esta ficha reúne 22 de los 23 ejercicios entre 2003 y 2025: no se encontró ningún balance de 2007.
  Los balances propios de 2016, 2017 y 2021 son PDF escaneados sin capa de texto y se leyeron por
  reconocimiento óptico de caracteres; para 2017 y 2021 esa lectura confirma los mismos montos que
  ya estaban cargados desde la columna comparativa del balance siguiente. El resto de los años que
  faltan en algún dato puntual (deuda, transferencias o segmentos) también se explica por la misma
  causa: la fuente disponible no lo desagrega, no que el dato no exista.

  En 2003, el año siguiente a la crisis financiera de 2002, ANP cerró con una pérdida de unos USD
  4,2 millones. Desde entonces el resultado fue mayormente positivo, con el último ejercicio cargado
  (2025) en una ganancia de USD 57,2 millones. Cuatro años (2003, 2005, 2008 y 2010) solo existen en
  los balances como columna comparativa reexpresada por inflación a la fecha del año siguiente; esta
  ficha convierte esos cuatro años al tipo de cambio de la fecha de reexpresión, no al de su propio
  ejercicio, para no sobreestimar el resultado en dólares.

  ANP no recibió aportes de capital del Estado en ningún ejercicio cargado: los balances de 2016 a
  2025 lo declaran de forma expresa ("La ANP no recibió subsidios"), y no hay indicios de lo
  contrario en los años anteriores. En cambio, sí transfiere resultados a Rentas Generales: el
  artículo 643 de la Ley 16.170 (1990) obliga a los entes autónomos y servicios descentralizados de
  dominio comercial e industrial del Estado a verter la totalidad de sus resultados, salvo lo
  necesario para inversión propia y cobertura de riesgos.

  Lo que esta ficha registra como "impuestos pagados" combina dos cosas distintas que el propio
  balance de ANP separa en su nota: lo que ANP paga como contribuyente (Impuesto al Patrimonio,
  IRAE, tasa del Tribunal de Cuentas) y lo que recauda como agente de retención de terceros (IVA de
  proveedores, IRPF de funcionarios, IRNR de no residentes, y la Ley 15.097 a favor de A.N.S.E., que
  en 2025 representó $ 407,2 millones de los $ 1.709,6 millones del total). La cita de cada año trae
  el desglose completo por concepto.

  La deuda financiera de ANP arranca en 2009, con el préstamo del BID (contrato N° 2031/OC-UR,
  firmado el 17 de abril de 2009, hasta USD 40 millones) que financió el Muelle C, el primer
  endeudamiento relevante del organismo. Desde 2021 se suma un tercer préstamo, del FONPLATA, junto
  a los dos del BID (2031 y 2247); ese año el FONPLATA (USD 50,4 millones) era más de la mitad de la
  deuda total. La deuda llegó a USD 94,5 millones en 2024 y bajó a USD 86,4 millones en 2025.

  Los balances desagregan ingresos (proventos) por puerto, no resultado: no informan qué gana o
  pierde cada puerto por separado. En los años con este dato, Montevideo genera la gran mayoría del
  ingreso total (en 2025, unos USD 200 millones de un total de USD 223 millones, alrededor del 90%);
  los demás puertos son, individualmente, una fracción pequeña del total, con Salto como el más
  chico de todos ($ 16.000 en 2017). El desglose por puerto falta para 2003, 2005, 2006, 2008 a
  2012, 2014 y 2024: para esos años solo se conoce el total agregado.

  La concesión de la Terminal Cuenca del Plata (TCP), la terminal de contenedores de Montevideo, es
  el episodio más disputado de la historia reciente de ANP. Se otorgó en 2001 al grupo belga Katoen
  Natie por 30 años, con ANP como socia minoritaria (20%). En 2019 Katoen Natie notificó un reclamo
  de USD 1.500 millones contra el Estado; en 2021 un acuerdo extendió la concesión hasta 2081, que
  según los considerandos del decreto que lo aprobó canceló ese reclamo, sumó nuevas inversiones por
  unos USD 455 millones y bajó tarifas. En la interpelación al ministro Heber del 18 de agosto de
  2021 en el Senado, el gobierno lo defendió como "el gran acuerdo, el excelente acuerdo, el
  altamente beneficioso acuerdo", mientras la oposición lo cuestionó por conceder "a una
  multinacional extranjera, en régimen de monopolio, hasta el año 2081". El actual presidente de ANP
  dice que no hay una estrategia de renegociación del acuerdo. Un operador privado competidor de
  TCP, Montecon, denunció ante la Comisión de Promoción y Defensa de la Competencia que la doble
  condición de ANP —autoridad portuaria y socia de TCP— genera privilegios para esa terminal; el MEF
  revocó la admisibilidad de esa denuncia por falta de competencia de la Comisión, y el TCA confirmó
  esa revocación en 2026 sin pronunciarse sobre el fondo del reclamo.

  Dos organismos miden el desempeño del puerto de Montevideo con resultados opuestos, porque miden
  cosas distintas. La CEPAL, que mide volumen de contenedores movilizados (TEUs), ubicó a Montevideo
  en el puesto 20 de 96 puertos de la región en 2023, su récord histórico (1.125.190 TEUs),
  mejorando el puesto 21 de 2022. El Banco Mundial, que mide el tiempo que un buque pasa en puerto,
  ubicó a Montevideo en el puesto 384 de 405 puertos del mundo en el CPPI 2023, peor que el puesto
  304 de 348 en 2022 y que el puesto 265 (o 284, según el método) de 370 en 2021, y por debajo de
  Buenos Aires. ANP cuestionó los parámetros del Banco Mundial en una reunión con el organismo, sin
  que trascendieran avances posteriores.
