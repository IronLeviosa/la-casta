        medio: el-pais
        fecha: 2016-05-09
        tipo: nota
        titulo: "10 de agosto 1916: fue la primera reunión de directorio de la ANP"
        cita: "Esta situación continuó hasta 1933. El 25 de abril de ese año el presidente de la República
          dictó el siguiente decreto: Art. 1º - La Administración Nacional del Puerto de Montevideo
          se denominará en adelante Administración Nacional de Puertos y será regida por un
          directorio honorario en la siguiente forma: un presidente, dos vocales designados por el
          Poder Ejecutivo, y cuatro miembros natos"
