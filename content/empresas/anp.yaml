que_hace: "ANP es un servicio descentralizado del Estado uruguayo encargado de la administración,
  conservación y desarrollo del Puerto de Montevideo y de los demás puertos comerciales que le
  encomiende el Poder Ejecutivo: desde 1993 tiene a su cargo Nueva Palmira, Fray Bentos, Colonia y
  el muelle de Juan Lacaze; desde 2006 también Paysandú y Salto, desde 2008 el puerto de Sayago y
  desde 2014 el Muelle N° 3 de La Paloma; y desde noviembre de 2021 también la administración,
  conservación y seguridad de los puertos deportivos y turísticos de Carmelo, Colonia y Piriápolis.
  Fija, con aprobación del Poder Ejecutivo, las tarifas de los servicios portuarios. Desde la Ley de
  Puertos (16.246, 1992) los servicios operativos de estiba, desestiba, carga y descarga se prestan
  en régimen de libre competencia entre operadores privados (Montecon, TCP) y la propia ANP, que
  además puede asociarse con capitales privados u otorgar concesiones sobre espacios del recinto
  portuario; la principal es la de la Terminal Cuenca del Plata (TCP), la terminal especializada de
  contenedores del puerto de Montevideo, a cargo del grupo belga Katoen Natie desde 2001, en la que
  ANP mantiene una participación minoritaria del 20%."
