monopolio:
  tiene: true
  alcance: 'La Ley 5.495 (1916), artículo 9 (redacción dada por el artículo 10 de la Ley 16.246 de
    1992), reserva a ANP en exclusividad la administración, conservación y desarrollo del Puerto de
    Montevideo y de los demás puertos comerciales que le encomiende el Poder Ejecutivo: no puede
    haber, para un mismo puerto estatal, otro administrador portuario que compita con ANP. La misma
    ley (artículo 7 de la Ley 16.246) reserva al Estado, a través del Poder Ejecutivo, "el derecho
    de fijar tarifas máximas" para los servicios portuarios. Es, por lo tanto, un monopolio
    administrativo y tarifario, no un monopolio sobre la prestación de los servicios: desde la Ley
    de Puertos 16.246 (8 de abril de 1992), los servicios operativos de estiba, desestiba, carga y
    descarga se prestan "en los puertos comerciales de la República" en un "objetivo prioritario" de
    "servicios portuarios eficientes y competitivos" (artículo 1), con empresas privadas operando en
    competencia entre sí y con la propia ANP (artículo 9), y con la prohibición expresa de que el
    uso de muelles y grúas estatales "pueda constituir un monopolio de hecho en manos de agentes
    privados" (artículo 9) o que una concesión o permiso implique "la atribución exclusiva a una o
    varias empresas de la explotación de los muelles comerciales de la Administración Nacional de
    Puertos" (artículo 12). Antes de 1992 el artículo 15 de la Ley 5.495 (1916) facultaba -sin
    obligar- al Poder Ejecutivo a "decretar el monopolio de todos o cada uno de los servicios del
    puerto"; un artículo de una columna histórica de El País sostiene, sin cita de la norma, que una
    ley del 4 de enero de 1909 ya establecía que "el Puerto Comercial de Montevideo será
    administrado y explotado exclusivamente por el Estado", pero esa norma no se verificó en esta
    corrida contra el texto de IMPO. Dentro de ese marco de competencia, ANP puede asociarse con
    capitales privados y otorgar concesiones sobre espacios del recinto portuario (artículo 11 de la
    Ley 16.246); la principal es la de la Terminal Cuenca del Plata (TCP), otorgada en 2001 al grupo
    belga Katoen Natie por 30 años y extendida en 2021 hasta 2081, en la que ANP es socia
    minoritaria (20%) del capital. Un operador privado competidor de TCP (Montecon) sostiene que esa
    doble condición de ANP -autoridad portuaria y accionista de TCP- genera en los hechos una
    situación de privilegio para TCP incompatible con el régimen de libre competencia de la Ley
    16.246 (ver argumentos_en_contra); no se encontró, en esta corrida, una respuesta pública de ANP
    o del Poder Ejecutivo dirigida específicamente a esa acusación.'
