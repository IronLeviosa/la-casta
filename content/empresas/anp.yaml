comparaciones:
  - con: los 96 puertos relevados por la CEPAL en América Latina y el Caribe (ranking 2023, publicado en
      marzo de 2025)
    indicador: volumen de contenedores movilizados (TEUs) en 2023
    valor_propio: Montevideo, 1.125.190 TEUs (puesto 20 de la región, mejorando el puesto 21 de 2022;
      récord histórico del puerto)
    valor_par: Santos (Brasil) 4.284.387 TEUs (1°); Manzanillo (México) 3.698.582 (2°); Bahía de
      Cartagena (Colombia) 3.300.366 (3°); San Antonio (Chile) 1.407.869 (11°); Buenos Aires
      (Argentina) 1.367.136 (12°)
    periodo: "2023"
    fuentes:
      - url: https://elobservador.com.uy/economia-y-empresas/puertos-regionales-montevideo-se-ubico-los-primeros-20-america-latina-n5989553
        medio: el-observador
        fecha: 2025-03-14
        tipo: nota
        titulo: "Puertos regionales: Montevideo se ubicó entre los primeros 20 de América Latina"
        cita: En la clasificación de 2023, los tres primeros lugar se mantuvieron incambiados respecto al
          año anterior. En primer lugar se ubicó el puerto brasileño de Santos con 4.284.387 TEUs.
          Después estuvo Manzanillo (México) con 3.698.582 y Bahía de Cartagena (Colombia) con
          3.300.366. El Callao (Perú) y MIT en Panamá alternaron en el cuarto y quinto puesto. La
          terminal chilena de San Antonio ocupó el undécimo lugar con 1.407.869 contenedores,
          seguido por Buenos Aires con 1.367.136. Puerto de Montevideo Montevideo –que se había
          ubicado en el puesto 21 en 2022- quedó en el 20 con 1.125.190 TEUs. Esa cantidad de
          contenedores marcó el récord del puerto local.
        retrieved_at: 2026-09-08
