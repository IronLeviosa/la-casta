  - fecha: "1933"
    titulo: El organismo pasa a llamarse Administración Nacional de Puertos
    detalle: Según una columna histórica de El País, un decreto del 25 de abril de 1933 renombró el
      organismo y reorganizó su directorio; no se verificó el texto de ese decreto en IMPO en esta
      corrida.
    fuentes:
