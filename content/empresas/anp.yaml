  argumentos_a_favor:
    - texto: La defensa del dragado como política de Estado a cargo de ANP, con medios propios, es
        fundamental para garantizar autonomía, eficiencia, seguridad y capacidad pública de
        respuesta, en un contexto de años de falta de inversión, escasez de insumos y debilitamiento
        de la plantilla; el argumento es sobre una tarea operativa (el dragado), no sobre el diseño
        legal completo de administración y tarifas.
      quien: Sindicato Único Portuario y Ramas Afines (Supra), boletín informativo
      fuentes:
        - url: https://www.elobservador.com.uy/economia-y-empresas/entrega-soberania-multinacionales-el-choque-el-sindicato-portuario-y-jerarcas-anp-n6044952
          medio: el-observador
          fecha: 2026-05-25
          tipo: nota
          titulo: '"Entrega de soberanía a multinacionales": el choque entre el sindicato portuario y jerarcas
            de ANP'
          cita: el sindicato divulgó el viernes pasado un boletín informativo con un capítulo sobre el
            dragado. Sin hacer mención en este caso a Ferrer y Peña señaló que "el dragado nacional
            se encuentra en una situación crítica producto de años de falta de inversión, escasez de
            insumos, debilitamiento de la plantilla y ausencia de una planificación sostenida". Y a
            continuación defendió su punto de vista. "La defensa del dragado como política de Estado
            es fundamental para garantizar autonomía, eficiencia, seguridad y capacidad pública de
            respuesta".
          retrieved_at: 2026-09-08
    - texto: La ANP debe ejercer plenamente su papel como autoridad portuaria, con capacidad de
        planificación, regulación y control; el sindicato reivindica el fortalecimiento de la
        Administración Nacional de Puertos y cuestiona la concentración de la operativa en el puerto
        de Montevideo, en defensa de que la administración y la regulación del sistema portuario
        sigan en manos del Estado.
      quien: Alejandro Díaz, presidente del Sindicato Único Portuario y Ramas Afines (Supra)
      fuentes:
        - url: https://portalmaritimo.com.uy/a-110-anos-anp-elabora-hoja-de-ruta-para-convertir-a-uruguay-en-una-plataforma-logistica-regional
          medio: portalmaritimo-com-uy
          fecha: 2026-07-23
          tipo: nota
          titulo: A 110 años, ANP elabora hoja de ruta para convertir a Uruguay en una plataforma logística
            regional
          cita: El presidente del Sindicato Único Portuario y Ramas Afines (SUPRA), Alejandro Díaz, aprovechó
            el acto por el Día del Trabajador Portuario para realizar un balance del primer año de
            la actual administración, reivindicar el fortalecimiento de la Administración Nacional
            de Puertos (ANP) y cuestionar la concentración de la operativa en el puerto de
            Montevideo.
          retrieved_at: 2026-09-09
        - url: https://portalmaritimo.com.uy/a-110-anos-anp-elabora-hoja-de-ruta-para-convertir-a-uruguay-en-una-plataforma-logistica-regional
          medio: portalmaritimo-com-uy
          fecha: 2026-07-23
          tipo: nota
          titulo: A 110 años, ANP elabora hoja de ruta para convertir a Uruguay en una plataforma logística
            regional
          cita: sostuvo que la ANP debe ejercer plenamente su papel como autoridad portuaria, con capacidad de
            planificación, regulación y control.
          retrieved_at: 2026-09-09
  argumentos_en_contra:
    - texto: "La participación de ANP como socia de Terminal Cuenca del Plata S.A. ha sido determinante
        para que el Estado tomara medidas de privilegio a favor de esa compañía, cuando las leyes le
        exigían trabajar en régimen de libre competencia con los demás operadores portuarios: el
        Estado es juez y parte. La Comisión de Promoción y Defensa de la Competencia había declarado
        admisible la denuncia contra el MTOP, ANP y la naviera belga en dos oportunidades, pero el
        MEF revocó esa decisión por entender que la Comisión carece de competencia para evaluar la
        legalidad de actos del Poder Ejecutivo en materia portuaria; Montecon recurrió al TCA, que
        en 2026 confirmó la revocación del MEF y no se pronunció sobre el fondo de la denuncia de
        competencia."
      quien: Montecon S.A. (operador portuario privado), denuncia ante la Comisión de Promoción y Defensa
        de la Competencia
      fuentes:
        - url: https://montevideo.com.uy/Noticias/Montecon-denuncio-a-la-Administracion-Nacional-de-Puertos-por-falta-de-competencia-uc848134
          medio: montevideo-portal
          fecha: 2023-03-13
          tipo: nota
          titulo: Montecon denunció a la Administración Nacional de Puertos por falta de competencia
          cita: '"Como denunciamos en expediente 45/021, la participación de la ANP como socia de Terminal
            Cuenca del Plata S. A. ha sido determinante para que el Estado tomara medidas de
            privilegio a favor de esta compañía, cuando las leyes le exigían trabajar en régimen de
            libre competencia con los demás operadores portuarios. El Estado es juez y parte",
            advierte Montecon en su denuncia.'
          retrieved_at: 2026-09-08
        - url: https://www.elobservador.com.uy/economia-y-empresas/nuevo-round-portuario-tca-desestimo-otra-demanda-montecon-practicas-anticompetitivas-n6033921
          medio: el-observador
          fecha: 2026-02-10
          tipo: nota
          titulo: "Nuevo round portuario: TCA desestimó otra demanda de Montecon por prácticas
            anticompetitivas"
          cita: El TCA mencionó que el artículo 7 de la Ley de Puertos establece que "compete al Poder
            Ejecutivo el establecimiento de la política portuaria y el control de su ejecución".
            Además expuso que el régimen de explotación portuario se encuentra sometido a una
            regulación especial como parte de una política pública de interés general.
          retrieved_at: 2026-09-09
    - texto: El nuevo reglamento de atraque, que dirige los movimientos de contenedores hacia la terminal
        especializada, crea en los hechos un monopolio privado, que es peor que uno público; atenta
        contra la Ley de Puertos, que establece la libre concurrencia, y contra los contratos entre
        privados, obligando a los armadores a trabajar con un solo proveedor de servicios.
      quien: Gabriel Grinschpun, agencia marítima Antonio Mitrano
      fuentes:
        - url: https://www.elobservador.com.uy/nota/navieras-preocupadas-por-futuro-monopolio-privado-en-puerto-de-montevideo-20216313130
          medio: el-observador
          fecha: 2021-06-04
          tipo: nota
          titulo: Navieras internacionales preocupadas por futuro "monopolio privado" en puerto de Montevideo
          cita: “Eso atenta contra la ley de Puertos que, en primer lugar, establece que la competencia dentro
            del puerto es de libre concurrencia cumpliendo con los reglamentos. Además, atenta
            contra contratos entre privados y obliga a los armadores a no tener opción más que
            trabajar solamente con un proveedor de servicios”, dijo. Grinschpun añadió que al no
            haber competencia, el control de costos “seguramente va a dispararse”. “¿Quién va a
            pagarlo? El comercio exterior uruguayo, y doña María y don José cuando vayan al almacén.
            Los armadores pueden decir que no escalan en Montevideo y lo sirven con un feeder (barco
            más pequeño). Eso extendería los tiempos de tránsito y quitaría valor a muchas
            mercaderías, como los citrus, las frutas, la carne enfriada, ya que les saca lo que se
            llama el shelf life, es decir, la vida en el estante en destino. (…) Básicamente, con
            este reglamento se crea un monopolio privado que, como todos sabemos, es peor que uno
            público”, consideró.
