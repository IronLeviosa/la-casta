  - fecha: 1990-12-28
    titulo: La Ley 16.170 obliga a ANP a verter sus resultados a Rentas Generales
    detalle: El artículo 643 fija la obligación, para los entes autónomos y servicios descentralizados
      de dominio comercial e industrial del Estado, de verter la totalidad de sus resultados a la
      Tesorería General de la Nación, salvo lo necesario para inversión propia y cobertura de
      riesgos; es la base legal de la serie de transferencias_al_estado de esta ficha.
    fuentes:
      - url: https://www.anp.com.uy/sites/default/files/archivos/parrafo-colapsable/2021-04/ANP%202020%20-%20ESTADOS%20FINANCIEROS.pdf
        medio: anp
        fecha: 2020-12-31
        tipo: documento_oficial
        titulo: Estados financieros de ANP al 31/12/2020, Nota "Transferencias a Rentas Generales"
        cita: De acuerdo con el artículo 643 de la Ley 16.170 de fecha 28 de diciembre de 1990 los entes
          autónomos y servicios descentralizados de dominio comercial e industrial del Estado, así
          como las empresas de propiedad estatal cualquiera sea su naturaleza deben verter la
          totalidad de sus resultados excepto aquellas partidas necesarias para el financiamiento de
          proyectos de inversión propios y coberturas de riesgos, a la Tesorería General de la
          Nación. El citado artículo otorgó potestad al Poder Ejecutivo para reglamentar los
          criterios técnicos aplicables para la determinación de resultados.
        retrieved_at: 2026-09-09
