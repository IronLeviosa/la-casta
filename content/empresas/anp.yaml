          titulo: Estados contables de ANP al 31/12/2009, Nota "Impuestos pagos..." (columna comparativa 2008)
          cita: >-
            Impuesto al Patrimonio: pagos por concepto de anticipos efectuados por $ 150.334.702

            ($149.226.146 al 31/12/08).

            • Impuesto a las Rentas de Actividades Económicas pagos por conceptos de anticipos

            $ 79.214.292 ($ 4.594.639 al 31/12/08).

            • En cumplimiento de la Ley 16.853, tasa del 1,5 0/000 sobre los ingresos brutos, pagos
            por

            $ 206.170 ($190.333 al 31/12/08) a favor del Tribunal de Cuentas de la República.

            • Con la promulgación del Decreto 528/003 del 23/12/2003, el Poder Ejecutivo designa a
            los Entes

            Autónomos y Servicios Descentralizados que integran el dominio industrial y comercial
            del

            Estado como agentes de retención del IVA por las adquisiciones de bienes y servicios que

            realicen, en el ejercicio 2009 el monto ascendió a $ 10.994.742 ($ 13.063.735 al
            31/12/08).

            • En cumplimiento del Artículo 8° de la Ley 18.083 reglamentada por el Decreto N°
            148/007,

            impuesto a la renta persona física el monto retenido en el año 2009 ascendió a $ 585.334

            ($ 277.129 en el ejercicio 2008).

            • En cumplimiento del Artículo 10º de la Ley 18.083 reglamentada por el Decreto N°
            149/007,

            impuesto a la renta de los no residentes el monto retenido en el año 2009 ascendió a $
            153.139

            ($669.121 en el ejercicio 2008).

            • El monto recaudado en el ejercicio 2009 por concepto de la Ley N° 15.097, retención a
            favor de

            A.N.S.E., ascendió a $ 84.243.908 ($ 94.391.088 al 31/12/08).
          retrieved_at: 2026-09-08
