  notas_internas: 'Actualización sobre el registro ya publicado en content/politicos/lacalle-pou.yaml
    (agrega Cámara de Representantes 2000-2015, Presidencia de la Cámara 2011-2012, Senado 2015-2019
    y la candidatura de 2019). Por CLAUDE.md ("Cómo cambia un registro ya publicado") esto necesita
    un registro en content/correcciones/ antes de aplicarse con pnpm promover --correccion; no lo
    escribo yo porque no me corresponde correr promover. Sobre el cierre del mandato de Senado
    (hasta: 2019-08-12): la crítica marca aviso de que la renuncia se presentó el 12/08 pero se
    habría votado en sesión el 13/08; no encontré el Diario de Sesiones del 13 en esta sesión y dejo
    la fecha de presentación (12/08) por ser la única con dos fuentes independientes (Wikipedia y
    Teledoce) que coinciden.'
