revision:
  tier: publicado
  notas_internas: "Sobre content/politicos/lacalle-pou.yaml (publicado con procedencia de tipo
    corrección, correccion: 2026-09-05-votos-balotaje-2019, que ya agregó Diputado 2000-2015,
    Presidencia de la Cámara 2011-2012, Senado 2015-2019 y la candidatura de 2019 con la cita de
    balotaje corregida — 1.189.313 votos con la fila real de balotaje, no la de primera vuelta).
    Este lote (2014) rebasó sobre esa versión ya publicada, no sobre el inbox de 2019, y agregó solo
    la candidatura de 2014, verificada de forma independiente contra la tabla de resultados de 2014.
    No se tocaron los mandatos ni la candidatura de 2019: ya vienen corregidos. Queda sin resolver,
    porque excede el alcance de este lote, si el cierre del mandato de Senado (hasta: 2019-08-12)
    debería ser 2019-08-13 (fecha en que, según la propia fuente de Teledoce, se votaría la
    renuncia); la nota que se cita documenta la presentación de la renuncia, no su aceptación. Ver
    razones.md."
procedencia:
  tipo: correccion
  correccion: 2026-09-05-candidaturas-2014
