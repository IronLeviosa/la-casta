          Jorge Luis Batlle Ibáñez (Montevideo, 25 de octubre de 1927-Montevideo, 24 de octubre de 2016) fue un abogado, periodista y político uruguayo que se desempeñó como presidente de la República Oriental del Uruguay desde el 1 de marzo de 2000 hasta el 1 de marzo de 2005.
        retrieved_at: 2026-09-03
