  notas_internas: "Cargadas 12 de 26 convocatorias; la lista completa entra por corrección cuando se
    fusione con el padrón regenerado de suplentes. El partido no está confirmado por ninguna cita de
    la actuación parlamentaria: el campo del lema aparece vacío en todas las convocatorias
    documentadas; se mantiene el valor de la investigación previa, sin fuente que lo confirme.
    Posible duplicado de suplentes:diaz-natalia (mismo nombre, sin cruzar el id de legislador entre
    los dos lotes); fusionar antes de promover ambos. Según su ficha oficial (id 13695) es titular
    en ejercicio desde el 01/03/2026; esta ficha todavía la muestra como suplente de Ana María
    Olivera Pessano, sin convocatoria cerrada. Actualizar al resolver la fusión."
