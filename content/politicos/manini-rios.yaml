        titulo: ¿Qué dice el veto de Luis Lacalle Pou al artículo 72 de la ley de medios?
        cita: el líder de Cabildo Abierto, Guido Manini Ríos, se mostró sorprendido y lamentó la decisión de
          Lacalle Pou que, por tercera vez en su gestión, vetó un artículo propuesto por ese partido
          de la coalición de gobierno. "Quedamos solos, como quedamos solos con las deudas, con el
          cambio de política en las adicciones a las drogas, como quedamos solos en las medidas de
          la seguridad pública, quedamos solos en muchos aspectos", apuntó el senador
