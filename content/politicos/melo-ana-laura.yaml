  notas_internas: La única cita del mandato ("Melo Cedrés, Ana Laura FLORES") no dice ni
    "Representante" ni "Frente Amplio"; está impresa justo antes de un renglón de otro partido. La
    fila de LegAlfab.pdf que sí trae partido y departamento con su encabezado legible no es contigua
    a la fila de Melo en el texto extraído (más de treinta filas de distancia), así que citarlas
    juntas violaría la regla de cita contigua. Su página individual y `legislaturas-actuo` no
    renderizan del lado del servidor (60-176 caracteres, sin tabla) en los intentos de esta sesión y
    de la anterior. Falta un diario de sesiones de la L que la nombre con cargo y partido, o que la
    página individual empiece a renderizar.
