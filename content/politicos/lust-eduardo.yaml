revision:
  tier: probable
  notas_internas: 'El partido (Cabildo Abierto) no está probado por ninguna cita de la ficha dentro
    del período en que lo tuvo: sus dos citas (convocatoria y fila entrelazada de la nómina de 2024)
    no nombran el partido. La única fila que sí lo hace (censo del 07/03/2023, releído en esta
    sesión: "Rodríguez, Conrado	Lust Hitta, Eduardo	Capillera, Elsa CA Montevideo CA PC Montevideo
    Montevideo") no es contigua al encabezado que permite leer la tabla (están a más de 1.500
    caracteres de distancia en el texto extraído), así que citarlos juntos violaría la regla de cita
    contigua. Lust rompió públicamente con Cabildo Abierto durante el período, así que la fecha del
    corte importa y no está documentada. Falta un diario de sesiones o una fuente que nombre el
    partido directamente junto a la persona.'
