  notas_internas: "Sobre content/politicos/vazquez.yaml (publicado, sin correcciones previas). Se
    agregó el mandato de Intendente de Montevideo y la candidatura de 2014; el resto (presidencias
    2005-2010 y 2015-2020, fallecimiento) queda igual. El mandato de Intendente NO usa las fechas
    del infobox de Wikipedia (5 de mayo de 1990 - 5 de mayo de 1995): una fuente no- Wikipedia (El
    Observador, 2020-12-06) documenta que asumió el 15 de febrero de 1990 y que cedió el mando antes
    de las elecciones nacionales de 1994, no en 1995. Ver razones.md para el detalle de la
    corrección y las fuentes que la sostienen."
