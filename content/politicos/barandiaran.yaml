  texto: >-
    La corrida `2026-09-09-barandiaran-dias-restantes` sigue a la corrida
    `2026-09-09-barandiaran-suplencias-2000-2004`, que dejó publicados 87 de los 110 días de
    suplencia que el Parlamento agrupa como "suplencias menores a cinco días" en la Legislatura 45
    (2000-2005) —el texto de cobertura de esa corrida decía 89 por un error de suma que esta vuelta
    corrige—. Se barrieron los 552 diarios de sesión del período en la Hemeroteca de la Biblioteca
    del Poder Legislativo (`biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/`): 480 de la
    Cámara de Representantes y 72 de la Comisión Permanente. El nombre "Barandiarán" aparece en 83
    diarios de la Cámara de Representantes y en ninguno de la Comisión Permanente. De los 83, 36 ya
    estaban citados en la ficha publicada; los 47 restantes se abrieron y se leyeron en esta vuelta:
    2 dieron un período de mandato nuevo (22 de setiembre de 2000 y 3 de junio de 2002, un día cada
    uno), 3 dieron hallazgos sobre mandatos ya publicados (se detallan abajo) y el resto no aportó
    dato nuevo (asistencia o contenido dentro de un rango ya fechado, o menciones retrospectivas "ex
    Representante").

    Tres hallazgos de esta vuelta cambian mandatos ya publicados. (1) El mandato del 16 al 20 de
    diciembre de 2002 se retira: el diario de sesiones del 11 de diciembre de 2002 registra que
    Barandiarán comunicó ese día que dejaba sin efecto la convocatoria del 4 de diciembre, que la
    Cámara aceptó esa negativa junto con la del suplente siguiente, Carlos Castaldi, y que convocó
    en su lugar a Ana María Casalás para el mismo período; no hay, para esos cinco días, otra fuente
    que documente ejercicio efectivo del cargo. Se aplica el mismo criterio que a las convocatorias
    rechazadas de mayo de 2001 y mayo de 2002, ya documentadas como tales y nunca cargadas como
    mandato. (2) El mandato de un día del 6 de marzo de 2002 se mantiene: fue convocado por
    resolución votada el 5 de marzo y no hay constancia de que la declinara. La lista de asistencia
    de la sesión del propio 6 de marzo lo registra, sin embargo, en "Sin aviso", no entre los
    Representantes presentes; esa cita se agrega a las fuentes del mandato. El criterio, el mismo
    para cualquier otro día de esta ficha, es que la convocatoria votada y no declinada es lo que
    constituye el mandato de suplencia; la asistencia a una sesión puntual es un hecho distinto, que
    se declara cuando hay evidencia y no anula la convocatoria. (3) El cierre del mandato que
    empieza el 6 de noviembre de 2000 se corrige del 12 al 9 de noviembre: la resolución de licencia
    votada en sala el 1º de noviembre de 2000 otorga al titular, Iván Posada, el período "6 y 9 de
    noviembre de 2000", no 6 al 12 como da el documento compilado "Parlamentarios Uruguayos", única
    fuente que sostenía el cierre anterior. No se encontró, entre los 552 diarios ya barridos, una
    resolución que extienda la licencia del 9 al 12. El mismo desfasaje de "Parlamentarios
    Uruguayos" ya se había corregido, con el mismo criterio, en dos suplencias de 2004 (16-20 de
    marzo y 19-23 de abril): prevalece la fecha de la resolución votada, que es el acto que otorga
    la licencia. La suplencia del 9 al 20 de octubre de 2002 sigue documentada solo por
    "Parlamentarios Uruguayos", sin resolución de licencia propia entre los diarios barridos que la
    cruce.

    Con estos tres cambios y los dos mandatos nuevos, el total de días de suplencia de la
    Legislatura 45 documentados con fecha y cita queda en 81 de los 110 que registra el Parlamento;
    29 siguen sin fechar. Los 552 diarios de la Cámara de Representantes y de la Comisión Permanente
    del período ya se barrieron completos: los días que faltan no están mencionados por el nombre de
    Barandiarán en ninguno de ellos, así que no se pueden fechar con el diario de sesiones. Puede
    haber, entre esos 29 días, suplencias reales que un diario documenta sin el nombre completo o
    con una errata que el barrido no capturó, o directamente sin una sesión pública que las
    registre; no se encontró, en esta vuelta, evidencia de ninguna de las dos cosas.

    Dos hallazgos de la vuelta anterior siguen vigentes: una intervención hablada sustantiva (12 de
    mayo de 2004, preguntas sobre un proyecto de comisiones inmobiliarias) y una exposición escrita
    sustantiva (7 de noviembre de 2003, sobre un llamado a pasantías que discriminaba por
    universidad de origen), ambas en `declaraciones.yaml`.

    Los Diarios de Sesiones de la Cámara de Representantes están disponibles en línea desde el 11 de
    febrero de 2000; antes de esa fecha no hay registro digitalizado de sus intervenciones como
    titular (1995-2000). La Asamblea General y la Comisión Permanente están digitalizadas desde
    1985; se revisaron para todo el período sin encontrar, fuera de lo ya citado, ninguna otra
    intervención suya. Su actuación en sala como titular en la Legislatura 44 (1995-1999) está en la
    Hemeroteca de la Biblioteca del Poder Legislativo y se recorrió completa por una corrida aparte
    (`2026-09-09-barandiaran-intervenciones`, 107 declaraciones); esa misma corrida deja constancia
    de que, para 1995-1999, el sitio todavía no tiene cargados a los legisladores de los demás lemas
    de esa legislatura.

    No se buscó cobertura de prensa nueva en esta vuelta: la vuelta anterior ya había revisado, sin
    éxito, el índice CDX de Wayback Machine sobre lr21.com.uy, larepublica.com.uy,
    elobservador.com.uy, montevideo.com.uy y radioelespectador.com filtrando por "barandiaran" en la
    URL, y tampoco encontró fotografía con licencia libre (hay una fotografía de prensa archivada en
    espectador.com, del 2 de julio de 2002, pero sin licencia libre declarada, así que no se usa).

    Lo que hay: una intervención en el debate de la ley de trasplantes de órganos y tejidos (7 de
    noviembre de 2000), la exposición y la intervención sustantivas ya mencionadas, su firma como
    uno de los primeros firmantes del proyecto que se convirtió en la Ley 17.189 sobre relaciones de
    consumo (promulgada el 20 de setiembre de 1999), y 81 de los 110 días de suplencia que el
    Parlamento registra para la Legislatura 45 (2000-2005), documentados con fecha y cita cada uno.

    Lo que no hay en la web: ninguna cita de prensa suya salvo una nota de LR21 (La República) del
    29 de setiembre de 2000 sobre un proyecto de protección de datos personales; los 29 días de
    suplencia sin fechar de la Legislatura 45; actividad pública documentada después del 14 de
    febrero de 2005 (fin de esa Legislatura); y ninguna fotografía con licencia libre.
