revision:
  tier: probable
  notas_internas: 'Corrección de la crítica de la corrida 2026-09-05-vicepresidentes-fichas-2000-2015
    (objeción "bloquea" sobre mandatos[5] y estado_actual). El registro publicado tenía
    hasta/salida.fecha: 2022-12-07, sostenido por dos fuentes que en realidad no lo prueban: El
    Observador (2022-12-07) dice literalmente que ESE día Hierro López era "actual embajador" (sigue
    en el cargo, no lo deja), y la Wikipedia en inglés que sí decía "In office 22 March 2021 – 7
    December 2022" está desmentida por la propia Wikipedia en español (que a esa misma fecha de
    bajada dice "Actualmente en el cargo", sin fecha de cierre) y por prensa posterior (Subrayado
    25-10-2023 lo sigue llamando embajador en funciones). Se buscó la fecha real con pnpm fuente y
    WebSearch: la designación de Bustillo como su sucesor (que había motivado la fecha "febrero de
    2025" de Montevideo Portal) se retiró el 24-1-2025 por falta de votos, así que Hierro López no
    dejó el cargo en esa fecha. Encontré dos fuentes peruanas que documentan una ceremonia de
    despedida el 17-18 de junio de 2025 en la que la Cancillería peruana da su gestión por concluida
    ("gestión diplomática concluye luego de más de cuatro años de servicio"), y una entrevista del
    5-7-2025 que ya lo describe en pasado ("tras culminar su misión diplomática"). No encontré un
    decreto o comunicado de la Cancillería uruguaya con el día exacto del cese (sí encontré, para
    contexto, que su sucesora Silvana Montes de Oca asumió recién el 20-10-2025, lo que sugiere que
    hubo un encargado de negocios interino en el medio). Bajo a "probable" por eso: la fecha
    2025-06-17 es la mejor documentada (día de la ceremonia de despedida en Torre Tagle) pero no es
    necesariamente el último día formal en el cargo.'
