analisis: >-
  El 13 de julio de 1993, como senador en un sector opositor al gobierno de Lacalle Herrera,
  fundamentó su voto a un ajuste puntual del Impuesto al Patrimonio sobre inmuebles rurales y
  agregó: "Quisiéramos que algún día el país abordara, en conjunto, el sistema tributario vigente".


  Doce años después, el 7 de noviembre de 2005, ya como ministro de Economía y Finanzas del primer
  gobierno del Frente Amplio, presentó en conferencia de prensa el borrador de una reforma
  tributaria integral, con el objetivo declarado de bajar la tasa básica del IVA.


  Los dos episodios ocurren en roles distintos -oposición y gobierno- y a doce años de distancia,
  pero versan sobre el mismo objeto: una revisión conjunta del sistema tributario, y no un ajuste
  puntual como los que se discutían en 1993. No hay contradicción que resolver; es una posición
  sostenida a través del tiempo y del cambio de rol.
