analisis: >-
  El 4 de agosto de 2016, en la misma interpelación donde reconoció el incumplimiento de la promesa
  de 2014-2015, dijo que esperaba no tener que volver a modificar el sistema impositivo si la
  corrección fiscal de ese año resultaba suficiente.


  Repitió la misma posición en una entrevista de marzo de 2017 ("nuestra sincera intención es no
  aumentar la carga tributaria"), al fijar en cero el espacio fiscal para nuevo gasto en la
  Rendición de Cuentas de 2018 y en un comité de base del Frente Amplio en mayo de 2019.


  En un foro empresarial de junio de 2019 descartó explícitamente subir los impuestos como forma de
  mejorar los ingresos fiscales y dijo que la vía era aumentar el nivel de actividad económica.


  En los casi tres años que van de una declaración a la otra no hay registro de una nueva suba de
  impuestos ni de una declaración en sentido contrario: la posición se sostiene sin cambios hasta el
  final de ese período como ministro.
