analisis: 'El 30 de mayo de 2026, en una rueda de prensa en Salto, consultado sobre si se había
  equivocado al aceptar un descuento de USD 25.000 en la compra de su camioneta, Orsi respondió "Me
  equivoco todos los días, desde que me levanto" y, sobre el caso puntual, "No"; agregó que "lo
  dictaminarán los organismos de contralor" y que, "por lo general, cuando hay descuentos", él "se
  tira de cabeza". Dirigentes de la oposición calificaron esa respuesta de "tomadura de pelo"
  (Infobae, 2/6/2026). Tres días después, el 2 de junio, en un video de unos tres minutos grabado y
  difundido desde Presidencia, cerró un mensaje pidiendo disculpas "si mi proceder ofendió o lesionó
  los intereses de algún individuo o colectivo". En el mismo video reconoció que accedió al vehículo
  "porque el precio era razonable" y se comprometió a pagar la diferencia si algún organismo de
  contralor determinaba un error. La posición de fondo no cambió entre ambos momentos: en los dos
  remite la determinación de si hubo una falta a los organismos de contralor, sin admitir por sí
  mismo haber cometido un error. Lo que cambió es el registro: de una respuesta improvisada e
  irónica ante la prensa a un mensaje preparado, con reconocimiento explícito de que el precio fue
  conveniente y una disculpa condicional por la ofensa causada, en un contexto en que la primera
  respuesta ya había sido criticada públicamente como una burla.'
