analisis: >-
  El 17 de noviembre de 2024, en el debate presidencial, Orsi prometió no aumentar los impuestos,
  pero matizó: "Si el contexto me lo impone, andá a saber qué puede pasar"; aclaró que regía "en
  términos de normalidad". El 21 de noviembre repitió que el contexto internacional podía forzar
  cambios.


  El 21 de agosto de 2025, como presidente, defendió con "equidad" el nuevo IVA a las compras
  minoristas por internet en plataformas extranjeras antes exoneradas: una justificación distinta de
  la contingencia internacional que había planteado como condición en 2024.


  La medida amplía la base del IVA sobre una categoría antes exonerada, sin tocar la tasa general.
  Son sostenibles dos lecturas: que es un aumento, o que no lo es porque la tasa no cambia. Orsi
  había calificado un caso distinto —el recargo de IVA a compras con tarjeta del gobierno de Lacalle
  Pou— como "aumento de tributos", sin un criterio que distinga ambos casos.


  En enero de 2026, la Ley de Presupuesto creó el Impuesto Mínimo Complementario Doméstico (Pilar
  Dos de la OCDE, sobre grandes multinacionales); sin una declaración de Orsi que la aborde, queda
  como evidencia de la promesa asociada, no como un giro propio.
revision:
  tier: publicado
  notas_internas: Las dos declaraciones que sostienen este giro tienen dos fuentes de grupos distintos
    cada una. El Impuesto Mínimo Complementario Doméstico (Ley 20.446, enero de 2026) no se
    incorporó como un giro separado por no haber una declaración de Orsi que lo aborde directamente;
    alcanza a multinacionales con facturación superior a US$ 750 millones. La cita completa del
    debate del 17/11/2024 es 'No podemos hacer futurología, yo no sé si va a haber una tercera
    guerra mundial'; la del 21/8/2025, 'La (solución) que se nos ocurre es gravar como cualquier
    otro producto, o sea que acá se apunta a la equidad'. Orsi calificó el recargo de IVA de Lacalle
    Pou como 'una muestra clara de aumento de tributos' el 18 de noviembre de 2024.
procedencia:
  tipo: correccion
  correccion: 2026-09-09-presentacion-narracion-b
