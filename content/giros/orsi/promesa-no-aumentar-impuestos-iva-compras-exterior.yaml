analisis: 'El 17 de noviembre de 2024, en el debate presidencial, Orsi prometió: "No vamos a
  aumentar los impuestos", reiterado minutos después como "no voy a subir los impuestos". En el
  mismo debate matizó esa promesa: "Si el contexto me lo impone, andá a saber qué puede pasar. No
  podemos hacer futurología, yo no sé si va a haber una tercera guerra mundial", y la nota que
  registra esa frase aclara que la planificación de no subir impuestos regía "en términos de
  normalidad". El 21 de noviembre, en una entrevista de streaming, repitió la idea de que el
  contexto internacional podía forzar cambios: "Estamos en un mundo de una fragilidad y una
  incertidumbre que los capitales vuelan [...] no sabés si arranca la tercera guerra mundial". El 21
  de agosto de 2025, como presidente, tras el anuncio del Ministerio de Economía de gravar con IVA
  las compras minoristas por internet en plataformas extranjeras que antes estaban exoneradas bajo
  el régimen de franquicias, Orsi defendió la medida así: "La (solución) que se nos ocurre es gravar
  como cualquier otro producto, o sea que acá se apunta a la equidad, yo no sé si la justicia, pero
  sí la equidad". La justificación que dio en ese momento es la equidad frente al comercio local, no
  la contingencia de contexto internacional (guerra, fuga de capitales) que había planteado como
  condición en noviembre de 2024; no hay en las fuentes de este lote una declaración que ate esta
  medida a esa contingencia específica. La medida amplía la base imponible de un impuesto ya
  existente (IVA) sobre una categoría de compras antes exonerada; no modifica la tasa general del
  IVA ni otros impuestos de aplicación amplia (IRPF, IRAE en sus tasas generales). Son sostenibles
  dos lecturas: que sí es un aumento de impuestos, porque una transacción antes exonerada de IVA
  pasa a pagar la tasa general del 22%; o que no lo es, porque la tasa general no cambia y lo que se
  modifica es el alcance de una exención puntual. Orsi había calificado un caso distinto —el recargo
  de IVA a compras con tarjeta del gobierno de Lacalle Pou— como "una muestra clara de aumento de
  tributos" (18 de noviembre de 2024), sin formular en este lote un criterio general que distinga
  ese caso del suyo propio. En enero de 2026, la Ley de Presupuesto (Ley 20.446) creó además el
  Impuesto Mínimo Complementario Doméstico, que alcanza a multinacionales con facturación superior a
  US$ 750 millones bajo el marco del Pilar Dos de la OCDE; la exposición de motivos de esa parte del
  proyecto sostiene que el objetivo es "localizar" en Uruguay una recaudación que esas empresas ya
  pagan en otro país, no aumentar la carga sobre contribuyentes uruguayos. Esa medida no tiene, en
  este lote, una declaración de Orsi que la aborde directamente, por lo que queda documentada como
  evidencia de la promesa asociada (promesas.yaml) y no como un giro propio.'
revision:
  tier: publicado
  notas_internas: Las dos declaraciones que sostienen este giro tienen dos fuentes de grupos distintos
    cada una. El Impuesto Mínimo Complementario Doméstico (enero de 2026) no se incorporó como un
    giro separado por no haber, en este lote, una declaración de Orsi que lo aborde directamente.
