analisis: >-
  El 14 de diciembre de 2023, consultado en Telemundo sobre si podía garantizar que no subiría los
  impuestos, Orsi respondió: "Ni descarto ni la afirmo. Pero es lo que no deseo. Tiene que ser la
  última de las medidas" — una posición que dejaba abierta la posibilidad como recurso final. El 17
  de noviembre de 2024, en el debate presidencial de balotaje, dijo: "No vamos a aumentar los
  impuestos", y lo repitió sin el matiz anterior: "Repito nuevamente porque no se entendió: no voy a
  subir los impuestos".


  El 7 de marzo de 2024, en un comité de base en Trouville, había calificado de "liviandad" y
  "frivolidad" las promesas formuladas como "no voy a aumentar impuestos, no voy a subir la edad de
  jubilación", dijo que se hacían "para conseguir votos" y llamó a "cobrar" esas actitudes; la nota
  que registra esa frase aclara que apuntaba al candidato Álvaro Delgado, no a una tesis general
  sobre cualquier promitente.


  No hay una declaración de Orsi que conecte el paso de la ambigüedad de diciembre de 2023 a la
  promesa sin matices de noviembre de 2024, ni que conecte esa promesa con su crítica de marzo a la
  misma formulación en boca de un rival. Las declaraciones de diciembre de 2023 y marzo de 2024
  provienen de la misma fuente única, El Observador, en notas retrospectivas publicadas casi un año
  después de los hechos; no se encontró segunda fuente de otro grupo mediático.
