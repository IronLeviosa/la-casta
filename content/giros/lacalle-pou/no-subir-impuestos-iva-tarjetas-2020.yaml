cambio: cambio_parcial
explicacion: justificado_por_contexto
analisis: 'El 30 de marzo de 2019, al lanzar su campaña, dijo que si ganaba el Partido Nacional "se
  terminó el aumento de impuestos". El 11 de marzo de 2020, a once días de asumir, su gobierno
  anunció la reducción a la mitad de la exoneración de IVA por pago con tarjeta creada por la ley de
  inclusión financiera: según El Observador, quien paga con débito pasó de pagar 18% a 20% de IVA,
  en crédito en restaurantes la exoneración bajó de 9 a 5 puntos, y el gobierno estimó una
  recaudación adicional de unos US$ 40 millones. Consultado ese día por la medida, respondió: "Se
  toma porque el déficit es grande. Debería ser una pregunta para los que estaban acá hace seis
  meses". Es cambio parcial y no total porque las dos lecturas son sostenibles con los mismos
  hechos: no se creó ningún tributo ni se modificó la tasa legal del IVA (22%), sino que se recortó
  un beneficio; pero el contribuyente paga más IVA por la misma compra y el Estado recauda más. La
  explicación que dio fue contemporánea y pública (el déficit heredado; ya en el debate de noviembre
  de 2019 hablaba de un déficit cercano al 5% del PIB, según Infobae), y tres meses antes de asumir
  había fijado el criterio de que "acompañar los costos no es un aumento de tarifas para recaudar";
  no reconoció en ningún momento haber cambiado de posición. La frase "no se incumplió, se súper
  cumplió" es de Isaac Alfie (OPP), no suya. El crítico coincide en cambio_parcial y
  justificado_por_contexto, y anota que nadie verificó con documento oficial (DGI, IMPO) el decreto
  y la recaudación efectiva de la medida.'
