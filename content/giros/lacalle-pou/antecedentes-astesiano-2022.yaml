analisis: 'El 26 de setiembre de 2022, tras la detención de su jefe de custodia, dijo que Astesiano
  "no tiene antecedentes penales". El 28 y 29 de setiembre, Montevideo Portal (con confirmación del
  Ministerio del Interior) y El Observador informaron que Astesiano había sido procesado por estafa
  en 2002 y en 2013, esta última con cuatro meses de prisión y una condena de setiembre de 2014. El
  30 de setiembre, en Maldonado, sostuvo que no mentía ("Me puedo equivocar, pero no les voy a
  mentir") y, consultado por los antecedentes, respondió, según Montevideo Portal, que de lo que
  está seguro es que no le dieron "la información correcta", y que había pedido el legajo de toda la
  custodia presidencial. Es cambio parcial: no repitió la afirmación del 26 ni la desmintió con esas
  palabras, pero admitió que pudo equivocarse y atribuyó el error a la información que recibió. La
  explicación se califica como justificada por contexto, no como reconocimiento explícito: el hecho
  externo entre las dos fechas es la publicación de los antecedentes por dos grupos de medios, y lo
  que adujo fue una circunstancia (la información que le dieron), no un cambio de posición
  reconocido. Queda abierto qué mostraban los informes de 2020 y 2021 sobre Astesiano; la afirmación
  del 26 tiene su propio chequeo en el Veracímetro.'
