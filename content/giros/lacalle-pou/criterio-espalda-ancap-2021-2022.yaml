analisis: 'El 16 de noviembre de 2021 dijo que, con el precio del refinado duplicado, "deberíamos de
  haber aumentado, pero como ANCAP dio ganancia... dijimos vamos a no cobrarle a la gente más caro
  el combustible y mantengamos el precio con la ganancia que tuvo el Estado". El 28 de mayo de 2022
  dijo que "cada vez que no aumentamos lo que debemos aumentar... eso es sacrificio de Ancap. La
  espalda básicamente se terminó", anticipando un ajuste al alza. Las dos frases aplican el mismo
  criterio: el precio se sostiene con las ganancias de ANCAP mientras las haya y se ajusta cuando la
  empresa no puede absorber la diferencia con la referencia internacional. En el medio, el 25 de
  enero de 2022, lo había enunciado como regla ("si tiene la espalda suficiente... no aumentamos los
  combustibles. Si... ANCAP no tiene espalda los vamos a tener que aumentar"). El crítico señala que
  "la espalda se terminó" fue una decisión discrecional del Poder Ejecutivo, no un dato externo, y
  que en enero de 2023 él mismo dijo que "a veces el gobierno ha subido, a veces no"; eso no altera
  la consistencia del criterio enunciado. No hay cambio que explicar.'
revision:
