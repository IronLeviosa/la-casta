  notas_internas: La declaración "antes" está en el tema economia (promovida desde la corrida de
    impuestos) porque la frase cubre impuestos, tarifas y combustibles. Falta la serie oficial de
    precios 2020-2025 (URSEA, ANCAP, decretos en IMPO) para cuantificar el traslado; no cambia la
    calificación del giro. Las fuentes de este registro no dan la cotización del petróleo citada por
    Lacalle Pou; se verifica con los informes mensuales de PPI de URSEA. Sobre la calificación se
    evaluó cambio_parcial como alternativa (en mayo de 2022 el gasoil estaba $10,75 y la nafta $6,41
    por litro debajo de la referencia de paridad) y se descartó porque no revierte que la posición
    se invirtió.
