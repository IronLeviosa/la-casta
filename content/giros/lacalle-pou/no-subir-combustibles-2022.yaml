explicacion: reconocido_explicitamente
analisis: 'El 30 de marzo de 2019 dijo que si ganaba el Partido Nacional "se terminó el aumento
  de... los combustibles". El 3 de marzo de 2022, preguntado en Telemundo si había incumplido esa
  promesa, respondió que "es cierto" que no se pudo cumplir y que "si yo antes del 1° de marzo
  podría prever" la pandemia y la guerra en Ucrania, con el petróleo duplicado, "obviamente no
  hubiera hecho ese compromiso". Entre las dos fechas, la ley 19.889 (julio de 2020) fijó que el
  Poder Ejecutivo aprueba los precios con informe preceptivo de URSEA que explicita el precio de
  paridad de importación; en noviembre de 2021 él mismo dijo que "deberíamos de haber aumentado" y
  que no lo hicieron por las ganancias de ANCAP; en mayo de 2022 dijo que "cada vez que no
  aumentamos lo que debemos aumentar" es sacrificio de ANCAP y que "la espalda básicamente se
  terminó". La posición pasó de "no habrá aumentos" a "aumentamos según la referencia internacional
  cuando ANCAP no puede absorber la diferencia": es una contradicción directa de la promesa, no un
  matiz, y por eso cambio_total. El crítico propuso cambio_parcial porque los aumentos se
  contuvieron por debajo del PPI (en mayo de 2022 el gasoil estaba $10,75 y la nafta $6,41 por litro
  debajo de la referencia) y hubo rebajas en 2023; eso pesa en la promesa, donde se describe, pero
  no cambia el hecho de que la posición se invirtió. Él reconoció el cambio explícitamente y lo
  atribuyó a hechos externos documentados (emergencia sanitaria decretada el 13 de marzo de 2020;
  invasión de Rusia a Ucrania en febrero de 2022); las fuentes del lote no dan la cotización del
  petróleo, que se verifica con los informes mensuales de PPI de URSEA. El giro es respecto de la
  frase de campaña; respecto de la política que el gobierno explicó desde 2021 (absorber con
  ganancias de ANCAP cuando las hay, subir cuando no), no hay cambio.'
