analisis: >-
  Batlle dijo que en la primera Ley de Urgencia de su gobierno bajaron algunos recursos, sobre todo
  al sector agropecuario. La Ley 17.243 confirma la parte agropecuaria: un capítulo entero
  (artículos 3 a 10) rebaja aportes patronales rurales, exonera a productores pequeños y rebaja la
  Contribución Inmobiliaria Rural, con compensación explícita a las Intendencias.


  Para la industria manufacturera, el Capítulo I fija la tasa de aportes patronales en 6,5 puntos y
  deroga la facultad anterior de reducirla por decreto (artículo 25 de la Ley 16.697): el texto de
  ambas leyes no alcanza para decir si 6,5 puntos fue una baja, y no se afirma que lo haya sido.


  Por cantidad de artículos y por el monto explícito de compensación (USD 15.000.000), el bloque
  agropecuario es el más extenso y detallado de la ley: la descripción de Batlle -"sobre todo al
  sector agropecuario"- se sostiene con ese criterio, aunque el texto no permite medir en pesos
  cuánto bajó cada sector.
