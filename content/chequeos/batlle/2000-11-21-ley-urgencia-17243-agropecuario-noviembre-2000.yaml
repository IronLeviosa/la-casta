analisis: >-
  Batlle dijo que en la primera Ley de Urgencia de su gobierno bajaron algunos recursos, sobre todo
  al sector agropecuario.


  La Ley 17.243, publicada el 6/07/2000, tiene un capítulo entero dedicado a "AGROPECUARIA"
  (artículos 3 a 9) que rebaja la escala de aportes patronales rurales y exonera de aportes
  patronales a los productores con predios de menos de 100 hectáreas durante ese año: es el bloque
  de rebajas más extenso de la ley, más que el de la industria manufacturera (artículos 1 y 2).


  La descripción de Batlle coincide con el contenido real de la ley: bajó aportes patronales en
  varios sectores, y el tratamiento más detallado fue para el agro.
