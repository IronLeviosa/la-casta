titulo: La primera Ley de Urgencia de Batlle (Ley 17.243) bajó aportes patronales, sobre todo en el agro
afirmacion: Dijo que en la primera Ley de Urgencia de su gobierno bajaron algunos recursos, sobre
  todo al sector agropecuario.
fragmento: en la primera Ley de Urgencia bajamos algunos recursos, sobre todo al sector agropecuario
calificacion: verdadero
dato_real:
  valor: >-
    La Ley 17.243, "Ley de Urgencia" del primer año de gobierno de Batlle, se publicó el 6/07/2000,
    cuatro meses después de que asumiera la presidencia.


    El Capítulo I (artículos 1 y 2) fija en 6,5 puntos la tasa de aportes patronales jubilatorios de
    la industria manufacturera y faculta al Poder Ejecutivo a reducirla por sector.


    El Capítulo II, dedicado enteramente a "AGROPECUARIA" (artículos 3 a 9), rebaja la escala de
    aportes patronales rurales, exonera de aportes patronales a los productores con predios de menos
    de 100 hectáreas durante el año 2000 y agrega beneficios impositivos para agrupamientos de
    productores: es el bloque de rebajas específicas más extenso de toda la ley.


    El texto de la ley respalda lo que dijo Batlle: bajó aportes patronales en varios sectores, y el
    capítulo más largo y detallado de rebajas es el del agro.
