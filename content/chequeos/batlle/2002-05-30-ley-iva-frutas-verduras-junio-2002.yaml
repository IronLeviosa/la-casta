dato_real:
  valor: >-
    La Ley 17.503 fue sancionada por el Senado el 29 de mayo de 2002 (bajo la presidencia de Luis
    Hierro López) y promulgada por el presidente Jorge Batlle, junto a los ministros Alberto Bensión
    (Economía y Finanzas) y Gonzalo González (Ganadería, Agricultura y Pesca), el 30 de mayo de
    2002, el mismo día en que Batlle habló con Bloomberg News.


    El artículo 8 financia el Fondo de Reconstrucción y Fomento de la Granja con el IVA aplicado a
    la venta de frutas, flores y hortalizas; el artículo 9 suspende hasta el 1º de julio de 2005 la
    exoneración de IVA que regía para esas ventas. El texto legal usa "frutas, flores y hortalizas",
    no la expresión "frutas y verduras" que empleó Batlle.
