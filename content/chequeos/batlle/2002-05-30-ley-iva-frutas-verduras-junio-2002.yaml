analisis: >-
  Batlle dijo, el 30 de mayo de 2002, que la mayoría de gobierno había votado "la semana pasada" una
  ley que aplicaba el IVA a "frutas y verduras". La Ley 17.503 fue sancionada por el Senado el 29 de
  mayo y promulgada el 30, el mismo día de la entrevista: la sanción fue un día antes, en la misma
  semana calendario, no en la anterior.


  Las mismas dos lecturas que en el chequeo de la Ley 17.502, la ley fiscal —una traducción de una
  expresión como "last week", o un voto anterior de la cámara de origen— hacen compatible la frase
  con esa fecha.


  La ley suspendió, hasta el 1º de julio de 2005, la exoneración de IVA que regía para la venta de
  frutas, flores y hortalizas, para financiar el Fondo de Reconstrucción y Fomento de la Granja:
  extendió el IVA a ese sector, no "al agro" en general.


  "Hortalizas" es más amplio que "verduras" en el uso técnico de la ley, y "flores" no está en lo
  que dijo Batlle, pero en el uso rioplatense corriente "verduras" y "hortalizas" nombran lo mismo:
  no es un error de dato, sino de vocabulario, y no cambia el sentido de lo que afirmó.
