analisis: >-
  Batlle dijo que el Parlamento había votado una ley que extendía el IVA a "frutas y verduras". La
  Ley 17.503, sancionada por el Senado el 29 de mayo de 2002 y promulgada el 30 de mayo, aplicó el
  IVA a la venta de "frutas, hortalizas y flores" para financiar el Fondo de Reconstrucción y
  Fomento de la Granja: existe, y la fecha es compatible con la entrevista del 30 de mayo.


  La única imprecisión es de vocabulario: la ley habla de "hortalizas" (más amplio que "verduras") y
  agrega "flores", que Batlle no mencionó. El sentido de lo dicho -el Parlamento extendió el IVA al
  agro- se mantiene.
