titulo: Ley que extendió el IVA a frutas y verduras en 2002
afirmacion: El Senado sancionó la ley que aplicó el IVA a la venta de frutas, hortalizas y flores el
  29 de mayo de 2002, y el presidente Batlle la promulgó al día siguiente, el 30 de mayo; días
  después, el 3 de junio, la mencionó en conferencia de prensa.
fragmento: una tercera referente a la aplicación del IVA a frutas y verduras
calificacion: impreciso
dato_real:
  valor: >-
    La Ley 17.503 fue sancionada por el Senado el 29 de mayo de 2002 (bajo la presidencia de Luis
    Hierro López) y promulgada por el presidente Jorge Batlle, junto a los ministros Alberto Bensión
    (Economía y Finanzas) y Gonzalo González (Ganadería, Agricultura y Pesca), el 30 de mayo de
    2002, tres días antes de que Batlle se refiriera a ella en su conferencia de prensa del 3 de
    junio.


    El artículo 2 de la ley financia el Fondo de Reconstrucción y Fomento de la Granja con el IVA
    aplicado a la venta de frutas, hortalizas y flores; el texto legal no usa la expresión frutas y
    verduras que empleó Batlle. No se encontró en esta sesión la fecha exacta de la votación en la
    Cámara de Representantes.
