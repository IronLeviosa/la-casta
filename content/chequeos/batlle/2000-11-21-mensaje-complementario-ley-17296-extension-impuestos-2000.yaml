calificacion: discutible
dato_real:
  valor: >-
    El Mensaje Complementario al Presupuesto Nacional 2000-2004 se promulgó como Ley 17.296 el
    21/02/2001.


    Es un texto de más de 600 artículos que modifica numerosos tributos: extiende exoneraciones de
    IVA a actividades que antes no las tenían, como los productores agropecuarios que usan campos de
    recría autogestionados (artículo 573) y la asistencia técnica a grupos de productores (artículo
    574), y da nuevo tratamiento de IVA a los servicios financieros de los fondos cerrados de
    crédito (artículo 571).


    No se localizó dentro del texto un artículo que extienda puntualmente el IVA a "emergencias
    médicas móviles". Lo que el documento muestra en conjunto es una combinación de extensiones,
    exoneraciones y ajustes de tasas sobre impuestos preexistentes, no la creación de un tributo
    enteramente nuevo.
