analisis: >-
  Batlle dijo que la reforma tributaria bajaría de 30% a 25% el impuesto que pagan las empresas. La
  Ley 18.083, sancionada un año después (27/12/2006, vigente desde el 1/7/2007), sustituyó el IRIC
  por el IRAE y fijó la tasa general en 25%: la cifra que dio coincide con la que quedó en la ley.


  En noviembre de 2005, cuando habló, la reforma era todavía un anteproyecto del Poder Ejecutivo, no
  una ley votada; la tasa que describió es la que terminó aprobando el Parlamento más de un año
  después. La cita de evidencia ("las empresas pagarán 25% en lugar de 30%") es estilo indirecto del
  periodista, no palabras textuales de Batlle entre comillas.
