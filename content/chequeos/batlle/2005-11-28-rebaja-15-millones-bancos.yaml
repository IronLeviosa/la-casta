analisis: >-
  Batlle dijo que la rebaja de impuestos para los bancos sería de unos USD 15 millones. La reforma
  no solo bajó la tasa del IRIC al 25% para el sector: también eliminó el Impuesto a los Activos de
  las Empresas Bancarias (IMABA) y el Impuesto de Control del Sistema Financiero (ICOSIFI), que en
  2005 recaudaron en conjunto unos USD 55 millones, más de tres veces la cifra que dio Batlle.


  Eso sugiere que sus USD 15 millones no incluían la eliminación de esos dos tributos, sino solo una
  parte de la rebaja prevista para el sector. Esta sesión no encontró el documento que desglose qué
  componía exactamente esa cifra.
