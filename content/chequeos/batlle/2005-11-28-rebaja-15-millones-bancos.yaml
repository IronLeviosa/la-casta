titulo: "Rebaja de unos USD 15 millones para los bancos: sin estimación oficial"
afirmacion: Las rebajas de impuestos para los bancos previstas en la reforma tributaria alcanzarían
  unos USD 15 millones.
fragmento: de unos USD 15 millones para los bancos
calificacion: discutible
dato_real:
  valor: >-
    En la presentación del 7 de noviembre de 2005, el ministro Astori incluyó el Impuesto a los
    Activos Bancarios (IMABA) y el ICOSIFI entre los quince impuestos a eliminar, y propuso una tasa
    general de 25% sobre la renta neta, cinco puntos menos que el IRIC.


    Según la serie anual de recaudación de la DGI, en 2005 el IMABA recaudó $ 1.151.522.983 y el
    ICOSIFI $ 196.324.310: unos USD 47,0 millones y USD 8,0 millones al tipo de cambio promedio de
    ese año ($ 24,4786 por dólar, según el Banco Mundial), en conjunto unos USD 55 millones.


    No se encontró un documento oficial que estime el costo de la reforma para los bancos ni qué
    componía los USD 15 millones. La serie de la DGI no separa a los bancos públicos de los privados
    ni da el IRIC pagado por el sector financiero.
