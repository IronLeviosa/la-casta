analisis: >-
  Batlle dijo que las rebajas de impuestos para los bancos alcanzarían unos USD 15 millones. Ningún
  documento oficial encontrado estima el costo de la reforma para los bancos ni dice qué incluía esa
  cifra, así que queda «discutible»: hay dos lecturas posibles.


  Primera lectura: son solo la baja de tasa del IRIC para los bancos. El dato que la juzgaría es el
  IRIC pagado por el sector financiero en 2005; no se encontró.


  Segunda lectura: incluyen la eliminación del IMABA y el ICOSIFI, que en 2005 recaudaron en
  conjunto unos USD 55 millones, más de tres veces los USD 15 millones. Esa comparación tiene dos
  límites: lo recaudado en 2005 no es lo que costaría eliminar esos impuestos cuando la reforma
  entrara en vigencia, y la serie de la DGI no separa a los bancos públicos de los privados.


  La cifra de Batlle llega por una nota de El País que resume, «en base a radio Sarandí», una
  entrevista en Canal 4; no ata los USD 15 millones a ningún impuesto y no hay cita textual suya.
revision:
  tier: probable
  notas_internas: "Falta segunda fuente de otro grupo de medios: la única cobertura es la nota de El
    País del 28/11/2005 (la misma de chequeos[3]), que resume «en base a radio Sarandí» una
    entrevista en Canal 4. Puertas: Canal 4 y Radio Sarandí del 28/11/2005 (sin perfil en medios) y
    prensa de esos días. Para el dato: el IRIC pagado por el sector financiero en 2005 (DGI, por
    sector de actividad), repartido 585 de la Cámara (2006) y versión taquigráfica de la comisión de
    Hacienda de 2006. La lista de quince impuestos incluye además el IRIC, el COFIS, el Impuesto a
    las Comisiones y el de Tarjetas de Crédito: no se sumaron porque no hay documento que diga qué
    parte recaía en bancos."
