analisis: >-
  Batlle dijo que Mujica, tras ser electo, "empezó a repartir dinero" y le generó al país un déficit
  que quedaría pendiente para Vázquez. Según el Ministerio de Economía y Finanzas, el déficit del
  Sector Público Consolidado fue de 2,8% del PIB en 2012 y bajó a 2,4% en 2013, dentro del segundo
  mandato de Mujica (2010-2015).


  No se pudo confirmar el cierre de 2014, el último año completo de gobierno antes del traspaso a
  Vázquez: el informe correspondiente del Ministerio de Economía y Finanzas es un PDF escaneado sin
  texto legible todavía.


  Con los datos disponibles hubo déficit en los dos años, pero la trayectoria parcial (de 2,8% a
  2,4%) no confirma por sí sola el relato de un déficit creciente que se le "cuelga" a Vázquez:
  falta el dato de 2014 para saber si la mejora continuó o se revirtió antes del cambio de gobierno.
