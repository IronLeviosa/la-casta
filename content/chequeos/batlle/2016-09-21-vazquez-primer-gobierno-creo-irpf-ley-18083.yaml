analisis: >-
  Batlle dijo que en los primeros cinco años de gobierno de Tabaré Vázquez (2005-2010) no tuvo que
  subir impuestos. La Ley 18.083, promulgada el 27/12/2006 por ese mismo gobierno, creó el Impuesto
  a la Renta de las Personas Físicas (IRPF) -un tributo que no existía antes- junto con el IRAE y el
  IASS, y entró en vigencia el 1/07/2007, dentro de ese primer quinquenio.


  La afirmación es falsa: el primer gobierno de Vázquez sí creó un impuesto nuevo durante ese
  período, el más importante de la reforma tributaria uruguaya de las últimas décadas, y lo hizo
  entrar en vigencia antes de terminar el mandato.
