calificacion: discutible
dato_real:
  valor: >-
    No se localizó el valor del Precio de Paridad de Importación (PPI) de URSEA para agosto o
    setiembre de 2016 ni el precio de venta al público vigente en esa fecha, pese a una búsqueda
    amplia.


    El conjunto de datos "Combustibles líquidos: Precios de Paridad de Importación" del Catálogo de
    Datos Abiertos dice cubrir el período 2002-01 a 2020-09, pero el archivo descargable y una
    consulta directa a su API solo devuelven registros desde octubre de 2020; para 2016 el total de
    coincidencias es cero.


    Tampoco se encontró el informe mensual en PDF que URSEA publicaba entonces: existe, por ejemplo,
    el de marzo de 2016, lo que confirma que la serie se difundía en ese formato, pero no se ubicó
    la URL exacta de agosto o setiembre de 2016.
