analisis: >-
  Batlle dijo, en su última entrevista, que le estaban cobrando el combustible a la gente por encima
  de lo que valía, en referencia implícita a la paridad de importación que calcula URSEA. No se
  localizó el valor del Precio de Paridad de Importación (PPI) ni el precio de venta al público
  vigente en agosto o setiembre de 2016.


  El conjunto de datos del Catálogo de Datos Abiertos dice cubrir el período desde 2002, pero en la
  práctica solo entrega registros desde octubre de 2020, y no se ubicó el informe mensual en PDF que
  URSEA publicaba entonces para esa fecha (sí existe, por ejemplo, el de marzo de 2016, lo que
  confirma que la serie se difundía en ese formato).


  Sin el dato de PPI de la fecha exacta, no se puede confirmar ni descartar la comparación que hizo
  Batlle.
