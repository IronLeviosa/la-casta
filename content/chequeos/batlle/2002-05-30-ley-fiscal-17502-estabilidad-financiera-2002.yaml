analisis: >-
  Batlle dijo, en una entrevista con Bloomberg News del 30 de mayo de 2002, que la mayoría de
  gobierno había votado "la semana pasada" la ley fiscal. La Ley 17.502 fue sancionada por la Cámara
  de Representantes y promulgada el día anterior, el 29 de mayo, y publicada el 31: la sanción fue
  el día antes de la entrevista, en la misma semana calendario, no en la semana anterior.


  Dos lecturas hacen compatible la frase con esa fecha: la cita es una traducción al español de una
  entrevista dada en inglés, y expresiones como "last week" pueden referirse a los últimos siete
  días corridos y no a la semana calendario previa.


  Además, en la frase anterior Batlle dijo que "en menos de una semana el Parlamento votó todo", lo
  que sugiere que la cámara de origen de esta ley pudo haber votado en los días previos, sin que se
  pueda precisar cuál fue.


  El contenido de la ley coincide con lo que Batlle llamó "la ley fiscal": fijó en 35% las tasas del
  Impuesto a las Rentas de la Industria y Comercio y a las Rentas Agropecuarias, en 10,50% el
  Impuesto a las Comisiones, y estableció nuevas escalas del Impuesto a las Retribuciones y
  Prestaciones Personales, medidas adoptadas en medio de la crisis financiera regional de 2002.
