analisis: >-
  Batlle dijo que la coalición de gobierno había votado, entre otras leyes, "la ley fiscal" la
  semana anterior a la conferencia de prensa del 3 de junio de 2002. La Ley 17.502, de Estabilidad
  Financiera, fue promulgada el 29 de mayo y publicada el 31 de mayo de 2002, seis días antes de la
  conferencia: la fecha es compatible con "la semana pasada".


  Fijó en 35% las tasas del Impuesto a las Rentas de la Industria y Comercio y del Impuesto a las
  Rentas Agropecuarias, en 10,50% el Impuesto a las Comisiones, y estableció nuevas escalas del
  Impuesto a las Retribuciones y Prestaciones Personales, medidas fiscales adoptadas en medio de la
  crisis financiera regional de 2002: el contenido corresponde a lo que Batlle describió como "la
  ley fiscal".
