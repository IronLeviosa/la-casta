analisis: >-
  Batlle dijo que no ajustar las franjas menores del IRPF y el IASS le costó $ 2.500 millones a los
  contribuyentes de menor ingreso, para financiar un aumento de gasto de US$ 140 millones de "la
  última rendición de cuentas". Esa rendición era la Ley 18.996 (22/11/2012), que aprobó el
  ejercicio 2011 con un resultado deficitario de unos $ 11.526 a $ 12.802 millones, sin desglosar un
  gasto incremental de US$ 140 millones.


  No hay documento oficial que confirme los $ 2.500 millones ni los US$ 140 millones, ni el decreto
  de la Base de Prestaciones y Contribuciones de 2013 con las franjas del IRPF y el IASS, ni la
  declaración del funcionario del MEF que Batlle cita como fuente.
