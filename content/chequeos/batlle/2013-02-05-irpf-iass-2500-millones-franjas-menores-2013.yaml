analisis: >-
  Batlle dijo que no ajustar las franjas menores del IRPF y el IASS le costó $ 2.500 millones a
  quienes están por encima de la primera franja, para pagar un aumento de gasto de US$ 140 millones
  de «la última rendición de cuentas». El gasto es del orden de lo que dice el MEF (unos US$ 143
  millones); los $ 2.500 millones no tienen documento oficial. Queda «discutible».


  El nexo «para poder pagar» es una atribución de intención y no se chequea.


  El mecanismo que describe sí tiene un dato oficial: la BPC subió 7,48% en enero de 2013 (decreto
  7/013), y la ley 18.083, en su texto de 2006, expresa los tramos del IRPF por rentas del trabajo
  en múltiplos de la BPC. Batlle sostuvo que los sueldos subieron más que eso; el decreto no dice
  cuánto subieron los salarios y no se encontró un documento que compare ambos movimientos.


  El gasto: la Rendición de Cuentas del ejercicio 2011 (ley 18.996, del 22 de noviembre de 2012) era
  la última aprobada en febrero de 2013. Según el MEF incrementó las asignaciones en $ 2.807
  millones para 2013, a valores de enero de 2012; al dólar interbancario de fines de ese mes son
  unos US$ 143 millones, 2% más que los US$ 140 millones que dijo Batlle.


  Falta una estimación oficial de lo que se recaudó de más por no ajustar los tramos, y lo que dijo
  en primera persona el funcionario del MEF a quien Batlle atribuye la explicación.
