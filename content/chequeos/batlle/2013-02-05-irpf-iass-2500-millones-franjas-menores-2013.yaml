tema: economia/impuestos
fecha: 2013-02-05
titulo: "Recaudación extra de $ 2.500 millones por no ajustar franjas del IRPF y el IASS: sin
  estimación oficial"
afirmacion: El gobierno no modificó los cobros del IRPF y el IASS en los grados menores, lo que
  significó cobrar $2.500 millones adicionales a los contribuyentes de menores ingresos para
  financiar un aumento de gasto de US$ 140 millones aprobado en la última rendición de cuentas.
fragmento: no podían modificar los cobros del IRPF y del IASS en los grados menores. Al no
  modificarlo - por el aumento que han tenido los sueldos en el pasado - le están cobrando al que
  está por encima de la primera franja, $ 2.500 millones para poder pagar el aumento de gasto de la
  última rendición de cuentas de U$S 140 millones
calificacion: discutible
dato_real:
  valor: >-
    Decreto 7/013: la Base de Prestaciones y Contribuciones (BPC) pasó de $ 2.417 a $ 2.598 el 1 de
    enero de 2013, un 7,48% más, por los criterios del artículo 3 de la ley 17.856. La ley 18.083,
    en su texto de 2006, expresa los tramos del IRPF por rentas del trabajo en múltiplos de la BPC
    (mínimo no imponible de 60 BPC y luego 120, 180, 600 y 1.200 BPC). El decreto no menciona esos
    tramos ni estima recaudación.


    La última Rendición de Cuentas aprobada en febrero de 2013 era la del ejercicio 2011 (ley
    18.996, del 22 de noviembre de 2012). Según el MEF, incrementó las asignaciones en $ 2.807
    millones para 2013, a valores de enero de 2012: unos US$ 143 millones al dólar interbancario del
    31 de enero de 2012 ($ 19,611).


    No se encontró una estimación oficial de los $ 2.500 millones, el texto de los tramos del IRPF y
    del IASS vigente en 2013, ni lo que dijo el funcionario del MEF (de la Asesoría Macroeconómica y
    Financiera) a quien Batlle atribuye la explicación.
