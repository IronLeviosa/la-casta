    Puertas: lo que dijo Masoller en primera persona en enero de 2013 (conferencia del MEF o de
    Presidencia), la exposición de motivos de la Rendición de Cuentas del ejercicio 2012 (MEF, junio
    de 2013) y la redacción de 2013 de los tramos del IRPF (ley 18.083, decreto 148/007) y del IASS.
    Opcional: variación nominal del Índice Medio de Salarios del INE de 2012 contra el 7,48% de la
    BPC."
