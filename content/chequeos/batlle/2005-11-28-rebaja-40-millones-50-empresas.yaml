  notas_internas: "Falta segunda fuente de otro grupo de medios: la única cobertura es la nota de El
    País del 28/11/2005, que resume «en base a radio Sarandí» una entrevista en Canal 4. Puertas:
    Canal 4 y Radio Sarandí del 28/11/2005 (sin perfil en medios) y prensa de esos días. Para el
    dato: repartido 585 de la Cámara (mensaje y exposición de motivos de 2006), versión taquigráfica
    de la comisión de Hacienda de 2006 (pnpm sesion crr 2006-11-01) y la recaudación del IRIC de
    grandes contribuyentes de la DGI."
