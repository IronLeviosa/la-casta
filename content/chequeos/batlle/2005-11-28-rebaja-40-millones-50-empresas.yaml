titulo: "Rebaja de unos USD 40 millones para las 50 mayores empresas: sin estimación oficial"
afirmacion: La rebaja del impuesto a la renta empresarial representaría unos USD 40 millones anuales
  menos de impuestos para las 50 empresas más importantes de Uruguay.
fragmento: una rebaja de unos USD 40 millones para las 50 empresas más importantes del país
calificacion: discutible
dato_real:
  valor: >-
    Según la serie anual de recaudación de la DGI, el IRIC recaudó $ 10.515.773.662 corrientes en
    2005. Al tipo de cambio promedio de ese año ($ 24,4786 por dólar, según el Banco Mundial), son
    unos USD 429,6 millones.


    El 7 de noviembre de 2005 el ministro Astori presentó una tasa general de 25% sobre la renta
    neta, cinco puntos menos que el IRIC (de 30% a 25%), junto con otros cambios: gravar rentas
    netas, mejores estímulos a la reinversión y la eliminación de quince impuestos.


    La baja de 30% a 25% es una sexta parte de la tasa: aplicada a toda la recaudación del IRIC de
    2005 serían unos USD 71,6 millones. Los USD 40 millones que Batlle atribuye a las 50 mayores
    empresas equivalen al 56% de esa cuenta. Es solo la baja de tasa sobre la base de 2005, no el
    efecto de toda la reforma.


    No se encontró un documento oficial que estime el costo de la reforma para las 50 mayores
    empresas ni cuánto de la recaudación del IRIC concentran.
