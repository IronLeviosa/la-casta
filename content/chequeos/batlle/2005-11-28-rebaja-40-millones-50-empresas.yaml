analisis: >-
  Batlle dijo que la rebaja para las 50 empresas más importantes sería de unos USD 40 millones al
  año. Ningún documento oficial encontrado da esa cifra por empresa ni por tamaño de empresa, así
  que queda «discutible».


  Lo que sí se puede calcular es la baja de tasa sola, con la base de 2005: de 30% a 25% es una
  sexta parte, unos USD 71,6 millones si se aplicara a toda la recaudación del IRIC de ese año (USD
  429,6 millones). Para que 50 empresas ahorraran USD 40 millones tendrían que concentrar el 56% de
  esa recaudación; no se encontró un documento oficial que diga cuánto concentran.


  Es una cuenta parcial: Astori presentó la tasa de 25% junto con otros cambios (gravar rentas
  netas, mejores estímulos a la reinversión y la eliminación de quince impuestos), que esta cuenta
  no incluye.


  La cifra de Batlle llega por una nota de El País que resume, «en base a radio Sarandí», una
  entrevista en Canal 4; no hay cita textual suya con los USD 40 millones.
