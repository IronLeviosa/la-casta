analisis: >-
  Batlle dijo que la rebaja de impuestos para las 50 empresas más importantes del país sería de unos
  USD 40 millones al año. No hay un documento que desglose esa cifra empresa por empresa: el IRIC
  recaudó unos USD 429,6 millones en 2005, y la baja de tasa que describió (de 30% a 25%) equivale a
  una sexta parte de esa recaudación, unos USD 71,6 millones si se aplicara a toda la base.


  Los USD 40 millones que atribuye a 50 empresas quedan por debajo de ese techo, pero exigirían que
  esas 50 empresas concentraran más de la mitad de toda la recaudación del IRIC del país, algo
  plausible en una economía con alta concentración empresarial pero que esta sesión no pudo
  confirmar con la exposición de motivos del proyecto.
