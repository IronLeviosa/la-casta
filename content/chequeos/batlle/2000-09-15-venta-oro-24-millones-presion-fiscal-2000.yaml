titulo: Venta de una parte de las reservas de oro del Banco Central por 24 millones de dólares
afirmacion: Dijo que la venta de una parte de las reservas de oro del Banco Central, sumada a lo ya
  colocado a interés, juntaría 24 millones de dólares para aliviar la presión fiscal.
fragmento: juntaremos 24 millones de dólares con lo cual aliviaremos la presión fiscal y movilizamos
