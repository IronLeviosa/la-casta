calificacion: discutible
dato_real:
  valor: >-
    No se localizó la Memoria Anual 2000 del Banco Central del Uruguay en un PDF legible: el sitio
    institucional del BCU solo publica en esa ruta las memorias desde 2020.


    Un artículo de 2023 del semanario Búsqueda, que cita una serie mensual que el Banco Central le
    proporcionó, confirma que durante la presidencia de Batlle (2000-2005) el BCU vendió 1.830.000
    onzas troy de oro, en operaciones concretadas en 2000-2001.


    Esa nota reproduce la misma frase de la entrevista de setiembre de 2000, pero no aporta un
    documento oficial que permita cotejar por separado la cifra de "24 millones de dólares" que
    Batlle da como resultado de la venta de oro.
