analisis: >-
  Batlle dijo que la venta de una parte de las reservas de oro del Banco Central, sumada a lo ya
  colocado a interés, juntaría 24 millones de dólares para aliviar la presión fiscal. No se encontró
  la Memoria Anual 2000 del BCU en un PDF legible para cotejar esa cifra.


  Un artículo de 2023 de Búsqueda, con una serie que le proporcionó el propio Banco Central,
  confirma que durante su gobierno el BCU vendió 1.830.000 onzas troy de oro en operaciones de
  2000-2001, y reproduce la misma frase de Batlle, pero no aporta un documento oficial que permita
  cotejar por separado los 24 millones de dólares.
