analisis: >-
  Batlle dijo, en lo que se publicó como su última entrevista, que "los impuestos los van a empezar
  a cobrar desde enero" de 2017. La Ley 19.438 de Rendición de Cuentas del ejercicio 2015, publicada
  el 26 de octubre de 2016, fija en su artículo 2 que rige desde el 1° de enero de 2017: la fecha
  que dio es exacta.


  Cuando habló, la ley todavía era un proyecto en el Parlamento (el Mensaje del Poder Ejecutivo
  había fijado esa misma fecha de vigencia desde junio de 2016); su previsión se cumplió tal como se
  votó.
