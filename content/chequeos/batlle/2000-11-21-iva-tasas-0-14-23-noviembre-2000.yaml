analisis: >-
  En noviembre de 2000 Batlle describió el IVA vigente con tres tasas: 0%, 14% y 23%. La Ley 16.697
  de 1995 fijó la tasa básica en 23% y la mínima en 14%, vigentes hasta que la Ley 18.083 las bajó a
  22% y 10% en julio de 2007: las dos cifras que dio son exactas para esa fecha.


  La tercera, la tasa 0% para exportaciones, es un rasgo general y conocido del régimen de IVA
  uruguayo, pero esta sesión no encontró la cita puntual del artículo que la fija, así que queda sin
  confirmar con un documento propio.
