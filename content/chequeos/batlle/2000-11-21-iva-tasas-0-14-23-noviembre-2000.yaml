analisis: >-
  En noviembre de 2000 Batlle describió el IVA vigente con tres valores: 0%, 14% y 23%. La Ley
  16.697 de 1995 fijó la tasa básica en 23% y la mínima en 14%, vigentes hasta que la Ley 18.083 las
  bajó a 22% y 10% en julio de 2007: las dos cifras que dio son exactas para esa fecha.


  El "0" no es una tercera tasa sino, como el propio Batlle explicó en la misma respuesta ("algún
  sector que estuviera, digamos, exonerado de pagar esa tasa"), una exoneración: el artículo 19 del
  Título 10 del Texto Ordenado 1996 regula, bajo ese nombre, qué operaciones no pagan IVA, un
  régimen distinto del de las tasas del artículo 14.


  Llamarla "0" en vez de "exonerada" es una simplificación de vocabulario, no un error de dato, con
  el mismo criterio que "frutas y verduras" en el chequeo de la Ley 17.503.
