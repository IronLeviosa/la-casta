tema: economia/impuestos
fecha: 2000-11-21
titulo: Tasas de IVA vigentes en noviembre de 2000
afirmacion: 'En noviembre de 2000, el IVA vigente en Uruguay tenía tres tasas: una básica, otra
  mínima y una de 0%, que él describió como "el de 0, el de 14 y el de 23".'
fragmento: el de 0, el de 14 y el de 23
calificacion: discutible
dato_real:
  valor: >-
    Según el artículo 9 de la Ley 16.697 (sancionada el 21 de abril de 1995, publicada el 2 de mayo
    de 1995), que sustituyó el artículo 14 del Título 10 del Texto Ordenado 1991, el IVA tenía desde
    1995 una tasa básica de 23% y una tasa mínima de 14%. Esas dos tasas rigieron hasta el 1 de
    julio de 2007, cuando el artículo 25 de la Ley 18.083 las redujo a 22% y 10%.


    Ninguna de las dos leyes fija en el artículo citado una tasa "0" explícita: el tercer valor que
    menciona Batlle corresponde al tratamiento de tasa cero que el régimen general del IVA aplica a
    las exportaciones, sin una cita puntual verificada en esta sesión.
