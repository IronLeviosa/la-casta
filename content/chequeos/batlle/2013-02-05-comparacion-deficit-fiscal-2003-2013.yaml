analisis: >-
  Batlle dijo que el déficit de 2003 fue de 2,8% del producto, igual al de 2012. Lo de 2012 es
  exacto (2,8% según el MEF); para 2003 los documentos oficiales dan entre 3,0% y 3,2%, y el que se
  toma, 3,1%, es 0,3 puntos más: una diferencia de 9,7% respecto de la cifra oficial, dentro del
  margen de 10% de «impreciso». El sentido se mantiene: en los tres documentos 2012 queda apenas por
  debajo de 2003.


  Está en el borde. Con el 3,0% del BCU la diferencia sería de 6,7%; con el 3,2% de la Rendición de
  Cuentas 2003 sería de 12,5%, y la calificación sería «falso».


  Se toma el 3,1% por un criterio que vale para cualquier cifra: manda la versión oficial más
  reciente de la misma serie que el dato contra el que se compara. Es la del Presupuesto 2005-2009,
  de 2005, un cuadro con los mismos grandes renglones que el del comunicado de 2012. El 3,2% es de
  2004, y el informe del BCU con el 3,0% cerró, según su propia nota, sin el resultado medido por
  debajo de la línea.


  Otras diferencias de método pueden mover la cifra: el BCU mide por arriba de la línea y la
  Rendición de Cuentas 2003 por fuentes de financiamiento, y cada documento usa el PIB de su época.
  Una serie del MEF de 2013 que recalcule 2003 con el PIB revisado podría dar otro valor; no se
  encontró.


  El MEF calcula además -1,9% para 2012 sin factores extraordinarios. Batlle habló del resultado
  observado, y las cifras de 2003 también lo son, así que el 1,9% no se usa para calificar.


  Los tres documentos ponen el mayor déficit de la crisis en 2002 (entre 4,1% y 4,2%), no en 2003;
  en 2003 fue mayor la carga de intereses (6,1% del PIB contra 4,4% en 2002). Este chequeo mide la
  cifra de 2003, como Batlle la dijo.
