fecha: 2013-02-05
titulo: "Déficit fiscal de 2003 y de 2012: 2,8% en 2012 y entre 3,0% y 3,2% en 2003"
afirmacion: El déficit fiscal de 2003, el peor momento de la crisis según Batlle, fue de 2,8% del
  producto, igual al de 2012 (2,8%), el último dato disponible en febrero de 2013.
fragmento: Nosotros en el peor momento de la crisis, en 2003, tuvimos como déficit fiscal sobre el
  producto 2,8%. Este gobierno después de dos años de bonanza, con precios exorbitantes en los
  productos, con intereses de la deuda en valor cero, con un flujo de capitales para cualquier cosa,
  tiene un déficit fiscal de 2,8%
calificacion: impreciso
dato_real:
  valor: >-
    2012: el resultado global del Sector Público Consolidado fue de -2,8% del PIB, según el
    comunicado del Ministerio de Economía y Finanzas del 31 de enero de 2013 (base caja). La
    exposición de motivos de la Rendición de Cuentas del ejercicio 2013, del mismo ministerio, trae
    la misma cifra para 2012 y una carga de intereses de 2,6% del PIB.


    Sin los factores extraordinarios, el MEF calcula -1,9% para 2012. Entre lo que ajusta están un
    sobrecosto energético de 1,0% del PIB, el pago de 0,3% a los bancos por la liquidación del Banco
    Comercial en el marco de la crisis de 2002 y el cierre de Pluna (0,1%).


    2003 según el Banco Central: -3,0% del PIB (Memoria Anual 2003, Sector Público Global, medido
    por arriba de la línea; el resultado por debajo de la línea no estaba disponible al cierre del
    informe). Según la Rendición de Cuentas 2003, que envió el Poder Ejecutivo de Batlle: -3,2%
    (sector público en su conjunto, por fuentes de financiamiento, criterio de caja).


    Según el Presupuesto 2005-2009, que envió el Poder Ejecutivo de Vázquez: -3,1%, la versión más
    reciente de 2003 y la que se toma para calificar. Ese cuadro da para 2003 un resultado primario
    de +3,0% e intereses de 6,1% del PIB; para 2012, el MEF da un primario de -0,2% e intereses de
    2,6%.


    Los tres documentos ponen el mayor déficit de la crisis en 2002, no en 2003: -4,2% el BCU, -4,1%
    la Rendición de Cuentas 2003 y el Presupuesto 2005-2009. En el cuadro del Presupuesto los
    intereses fueron de 4,4% del PIB en 2002 y de 6,1% en 2003.
