    Carlo (CX20) del 5/2/2013 y lo que otros medios levantaron ese día; Monte Carlo no tiene perfil
    en medios. El dato oficial ya está cargado, así que lo que mantiene el registro en probable es
    la declaración, no el dato. La calificación está en el borde del 10% (3,1%: 9,7%); si apareciera
    una serie del MEF de 2013 con 2003 recalculado sobre el PIB revisado, se recalcula."
