analisis: >-
  Batlle comparó el déficit fiscal del último dato disponible en febrero de 2013 -el cierre de 2012-
  con el de 2003, y dijo que ambos fueron 2,8% del producto. La Memoria Anual del BCU de 2003 está
  en un PDF escaneado sin texto legible, y las series del MEF y de la Unidad de Gestión de Deuda
  disponibles no llegan hasta 2012, así que no hay documento oficial que confirme ambas cifras.


  Tampoco precisó qué perímetro usaba (sector público global, consolidado o gobierno central-BPS), y
  el resultado cambia según cuál se elija. Queda discutible por falta de ese documento y de esa
  precisión, no porque las cifras sean inverosímiles.
