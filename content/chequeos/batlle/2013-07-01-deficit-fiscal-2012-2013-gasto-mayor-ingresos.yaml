    cerró con un déficit fiscal de 2,4% del PIB, una mejora de 0,4 puntos porcentuales respecto de
    2012 (es decir, el déficit de 2012 fue de aproximadamente 2,8% del PIB). Un resultado
    deficitario implica que el gasto del sector público superó sus ingresos —que incluyen, pero no
    se limitan a, la recaudación impositiva— en ambos años, cubierto con endeudamiento.
