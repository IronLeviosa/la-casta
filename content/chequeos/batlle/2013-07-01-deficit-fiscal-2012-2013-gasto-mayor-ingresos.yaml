analisis: >-
  Batlle dijo que el gobierno de Mujica gastaba más dinero del que percibía por los impuestos y por
  eso tenía que pedir dinero prestado. Según el Ministerio de Economía y Finanzas, el Sector Público
  Consolidado cerró 2013 con un déficit de 2,4% del PIB, una mejora de 0,4 puntos porcentuales
  respecto de 2012 (es decir, el déficit de 2012 rondó el 2,8% del PIB).


  Un resultado deficitario en los dos años implica, por definición, que el gasto del sector público
  superó sus ingresos y se cubrió con endeudamiento: la afirmación de Batlle es correcta en sus
  términos generales, aunque los ingresos del sector público no se limitan a la recaudación
  impositiva.
