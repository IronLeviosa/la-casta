analisis: >-
  Batlle dijo que, en las dos semanas anteriores, el gobierno salió a colocar unos US$ 11 millones
  en pesos y «nadie le tomó la oferta», y que una semana después, al volver a pedir ofertas, le
  subieron los intereses. No se encontró ningún documento oficial que confirme o descarte la
  licitación, su monto o la suba de tasas, así que queda «discutible».


  Batlle dijo «el gobierno» sin precisar quién licitó. En títulos en pesos había dos emisores, el
  Ministerio de Economía (Letras y Notas de Tesorería) y el Banco Central (Letras de Regulación
  Monetaria): si se trató de las Letras, quien licitó fue el Banco Central y no el Poder Ejecutivo.
  El documento que lo resolvería es el resultado de la licitación del emisor que corresponda, con el
  monto propuesto y, si no hubo ofertas, la marca de licitación desierta.


  La segunda parte, la suba de tasas en la licitación de la semana siguiente, también está sin
  documento: para compararla hacen falta los resultados de las dos semanas, con la tasa adjudicada
  en cada una.
revision:
  tier: probable
  notas_internas: "Falta segunda fuente de otro grupo de medios: la única cobertura es La República
    (1/7/2013), que lo atribuye a declaraciones a radio Montecarlo. Falta además el documento
    oficial: las puertas que quedan (resultados de las licitaciones de Letras de Regulación
    Monetaria y de Notas del Tesoro de junio y julio de 2013, Memoria del BCU 2013, Informe de
    Política Monetaria del segundo y tercer trimestre de 2013) están en notas.md del lote."
