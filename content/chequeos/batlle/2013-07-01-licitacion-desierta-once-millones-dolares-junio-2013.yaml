analisis: >-
  Batlle dijo que en las dos semanas anteriores el gobierno no consiguió ofertas en una licitación
  de deuda de unos US$ 11 millones y que la semana siguiente tuvo que convalidar tasas más altas. Ni
  el sitio del BCU ni los informes de la Unidad de Gestión de Deuda del MEF disponibles cubren esa
  licitación puntual de junio de 2013, así que no hay documento oficial que confirme o descarte la
  cifra.


  Queda discutible por falta de ese documento, no porque la cifra sea inverosímil: en 2013 el
  gobierno colocaba habitualmente Letras de Regulación Monetaria y Notas del Tesoro por montos de
  ese orden.
