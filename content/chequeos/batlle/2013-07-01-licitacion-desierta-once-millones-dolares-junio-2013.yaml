calificacion: discutible
dato_real:
  valor: >-
    No se encontró el resultado de ninguna licitación de títulos en pesos de junio o julio de 2013,
    ni del Ministerio de Economía ni del Banco Central, ni una licitación desierta de ese período en
    la Rendición de Cuentas del ejercicio 2013. Tampoco hay documento de las tasas de la licitación
    siguiente.


    En títulos en pesos nominales había dos emisores: el Banco Central (Letras de Regulación
    Monetaria) y el Gobierno (Letras y Notas de Tesorería), según la Rendición de Cuentas del
    ejercicio 2013.
