titulo: "Licitación en pesos de unos US$ 11 millones sin ofertas, junio de 2013: sin documento oficial"
afirmacion: En las dos semanas anteriores al 1 de julio de 2013, una licitación de títulos en pesos
  por unos US$ 11 millones no recibió ofertas y, cuando una semana después se volvió a licitar, las
  tasas de interés subieron por encima de las anteriores.
