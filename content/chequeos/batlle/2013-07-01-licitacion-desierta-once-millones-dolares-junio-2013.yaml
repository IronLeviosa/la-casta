titulo: Licitación de deuda por unos US$ 11 millones que quedó desierta, junio de 2013
afirmacion: Una licitación de deuda del gobierno por unos US$ 11 millones no tuvo ofertas, y una
  semana después el gobierno debió convalidar tasas de interés más altas para colocar deuda.
fragmento: cuando el gobierno salió a pedir colocar unos pocos pesos, más o menos 11 millones de
  dólares, nadie le tomó la oferta
calificacion: discutible
dato_real:
  valor: >-
    El BCU publica el resultado de cada licitación de títulos públicos (Letras de Regulación
    Monetaria, Notas del Tesoro) y la Unidad de Gestión de Deuda del MEF publica informes periódicos
    de deuda. Los documentos disponibles de 2013 en el sitio del BCU son pliegos y resultados de
    compras y contrataciones administrativas del banco; no incluyen licitaciones de deuda pública.


    Los documentos disponibles de 2013 en el sitio de la Unidad de Gestión de Deuda incluyen los
    informes mensuales de enero y julio y comunicados de calificadoras de riesgo, pero ninguno cubre
    específicamente la licitación semanal de la ventana del 15 de junio al 1 de julio de 2013 que
    menciona Batlle.


    No hay, con las fuentes revisadas, un documento oficial que confirme o descarte la cifra de USD
    11 millones ni la suba de tasas de la semana siguiente.
