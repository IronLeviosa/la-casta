titulo: La baja del IVA al 20% que Astori anunció en 2005 nunca se aplicó
afirmacion: La reducción de la tasa básica del IVA al 20% que Astori anunció en 2005 se concretó.
fragmento: reducir la tasa básica del IVA al 20% apenas podamos
calificacion: falso
dato_real:
  valor: "La Ley 18.083 (27/12/2006) fijó la tasa básica del IVA en 22% y previó que el Poder
    Ejecutivo la redujera gradualmente al 20% cuando los resultados de la reforma aseguraran el
    cumplimiento de los compromisos presupuestales. Dos décadas después, el Texto Ordenado vigente
    (Título 10, artículo 16) sigue fijando la tasa básica en 22%: la reducción condicionada nunca se
    aplicó."
