analisis: >-
  Astori anunció que el gobierno bajaría la tasa básica del IVA al 20% en cuanto las cuentas
  públicas lo permitieran; dos décadas después, el Texto Ordenado vigente sigue fijando esa tasa en
  22%, así que la baja nunca se aplicó.


  La Ley 18.083 dispuso que la reducción a 20% quedaba condicionada a que los resultados de la
  reforma aseguraran el cumplimiento de los compromisos presupuestales; no hay registro de que el
  Poder Ejecutivo haya dado ese paso en ningún gobierno posterior, incluidos los de Astori como
  ministro hasta 2019.
