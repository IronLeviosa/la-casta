analisis: >-
  La declaración es verdadera: tres días antes, en la conferencia donde presentó el ajuste fiscal de
  2016, Presidencia confirmó por escrito que la franja de $33.401 a $50.100 pasaría del 15 % al 18 %
  de IRPF, la misma cifra que consignó El País al reportar los dichos de Astori en radio Carve.


  Once días después, un comunicado oficial de Presidencia confirmó que esa suba puntual fue retirada
  del proyecto por acuerdo con legisladores del Frente Amplio y que la franja siguió pagando 15 %.
  La medida estuvo efectivamente en danza cuando Astori la defendió el 26/5, aunque no llegó a
  aplicarse.
revision:
  tier: probable
  notas_internas: >-
    Documento previsible resuelto: el comunicado de Presidencia del 23/5/2016 (misma conferencia del
    anuncio del ajuste fiscal) confirma literalmente "de tener una tasa de 15 % a 18 %" para esta
    franja, documento_oficial independiente de El Pais. Con eso y el comunicado del 6/6/2016 (marcha
    atras), calificacion pasa de discutible a verdadero.


    No se re-ancla el chequeo a la declaracion del 23/5
    (astori/2016-05-23-anuncio-ajuste-fiscal-irpf-iass-80-recaudacion-2016) pese a que el dato esta
    en el texto de esa conferencia: esa declaracion esta publicada y fuera de alcance de esta
    correccion, y su cita/resumen no traen el tramo "33.401 a 50.100" ni "15% a 18%", asi que un
    cambio de id dejaria el campo fragmento sin correspondencia en el registro de destino
    (chequeos.md exige que el fragmento sea un tramo literal de la cita o el resumen de la
    declaracion). Reanclar requeriria ademas ampliar el resumen de esa declaracion, que es una
    segunda correccion fuera de este alcance.


    Corrector (2026-09-16): se saco El Observador del 27/5/2016 de evidencia.fuentes de este
    chequeo. Verificado con pnpm fuente --buscar sobre esa nota: trae la franja "33.401 y 50.100" y
    la frase de liquidacion progresiva, pero no menciona "15%" ni "18%" en ningun lado, asi que no
    respalda la afirmacion numerica que el chequeo verifica (docs/colecciones/correcciones.md, "la
    segunda fuente falsa"). Queda solo en la declaracion, donde si corrobora la cita general de
    Astori sin las cifras. evidencia.fuentes del chequeo vuelve a una sola fuente (El Pais, nota,
    reportado); validar avisa "un solo grupo de medios" porque reportado pide dos grupos, pero no es
    error: la calificacion verdadero no depende de esta evidencia sino de dato_real.fuentes
    (Presidencia, documento_oficial), que ya cumple la regla dura de chequeos.md. El tier se
    mantiene probable por esta falta de segunda fuente en evidencia, no por el nivel de dato_real.
