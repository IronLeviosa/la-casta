titulo: La suba del IRPF del 15% al 18% en una franja salarial
afirmacion: El IRPF sube del 15% al 18% para los salarios nominales entre $33.401 y $50.100.
fragmento: ese aumento era del 15% al 18%
calificacion: verdadero
dato_real:
  valor: >-
    El 23 de mayo de 2016, en la misma conferencia de prensa donde Astori presentó el ajuste fiscal
    de 2016, Presidencia confirmó por escrito que la franja de ingresos mensuales entre $33.400 y
    $50.100 pasaría de una tasa de 15 % a 18 % de IRPF.


    Once días después de la declaración del 26/5, Astori confirmó en conferencia de prensa tras el
    Consejo de Ministros -según lo publicó la propia Presidencia- que ese aumento puntual fue
    retirado del proyecto de Rendición de Cuentas por acuerdo entre el Gobierno y los parlamentarios
    del Frente Amplio: la franja de $33.400 a $50.100 se mantuvo en 15%, sin la suba a 18% que la
    propuesta original y esta declaración contemplaban.


    El ajuste finalmente propuesto trasladó el aumento a las franjas superiores (la de $50.100 a
    $100.200 pasó de 20% a 24%, y de ahí hacia arriba hasta 36% para salarios de más de $384.000) y
    elevó el tope de deducciones de la franja de $33.400-$50.100 de 8% a 10%. La Ley 19.438
    (Rendición de Cuentas 2015, promulgada 14/10/2016) expresa la escala en unidades BPC y no
    permite verificar de forma independiente los montos en pesos de este tramo específico.
