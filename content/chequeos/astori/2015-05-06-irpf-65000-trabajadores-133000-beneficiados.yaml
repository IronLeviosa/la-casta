fecha: 2015-05-06
titulo: Trabajadores exonerados del IRPF por el cambio en la liquidación del aguinaldo
afirmacion: 65.000 trabajadores con ingresos inferiores a $27.000 dejarían de pagar IRPF, dentro de
  un total de 133.000 beneficiados, el 93% con ingresos menores a $50.000.
fragmento: 65.000 trabajadores con ingresos inferiores a 27.000 pesos dejarán de pagar el impuesto.
  Puntualizó que serán 133.000 el total de beneficiados y precisó que el 93 % perciben ingresos
  nominales inferiores a 50.000 pesos.
calificacion: discutible
dato_real:
  valor: >-
    El Decreto 154/015 (1/6/2015, firmado por Tabaré Vázquez y Danilo Astori), que reglamenta la Ley
    19.321 sobre el cómputo independiente del aguinaldo y el salario vacacional en el IRPF, fija en
    $27.000 mensuales ($324.000 anuales) el límite de ingresos para quedar excluido de las
    retenciones del impuesto: coincide con el umbral de "$27.000" que cita la afirmación.


    Ese decreto no publica cuántas personas quedaron por debajo del umbral: los conteos de 65.000
    trabajadores exonerados, 133.000 beneficiados en total y 93% con ingresos menores a $50.000 se
    encontraron únicamente en el propio anuncio del Ministerio de Economía y Finanzas (Presidencia,
    2015-05-06).


    No hay, hasta donde se pudo establecer, un informe posterior de la DGI o el BPS que publique el
    número real de contribuyentes exonerados tras la entrada en vigencia del decreto, ni una cifra
    equivalente en el diario de sesiones del debate parlamentario de la Ley 19.321 (Senado, primera
    quincena de mayo de 2015; Diputados, 21 y 22 de mayo de 2015).
