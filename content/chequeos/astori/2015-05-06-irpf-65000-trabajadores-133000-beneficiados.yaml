analisis: >-
  Astori dijo que 65.000 trabajadores de menores ingresos dejarían de pagar IRPF por un cambio en la
  liquidación del aguinaldo y el salario vacacional, dentro de un total de 133.000 beneficiados, 93%
  de ellos con ingresos menores a $50.000. El decreto que fijó el umbral en $27.000 mensuales
  confirma el mecanismo, pero no publica cuántas personas quedaron efectivamente exoneradas.


  Los tres números (65.000, 133.000 y 93%) tienen una sola fuente: el propio anuncio del Ministerio
  de Economía. No hay un informe público de la DGI o el BPS que publique el universo real de
  contribuyentes exonerados tras la entrada en vigencia del decreto.
