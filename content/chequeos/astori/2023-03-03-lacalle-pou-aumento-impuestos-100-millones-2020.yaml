fecha: 2023-03-03
titulo: El aumento de impuestos de US$ 100 millones que Astori atribuyó al inicio del gobierno de
  Lacalle Pou
afirmacion: El gobierno de Lacalle Pou aumentó los impuestos en un total de US$ 100 millones al
  asumir, pese a lo anunciado en la campaña electoral de 2019.
fragmento: a poco de asumir el gobierno se aumentaron los impuestos en un total de 100 millones de dólares
calificacion: discutible
dato_real:
  valor: >-
    El Decreto 97/020 (11/3/2020, firmado por Lacalle Pou y Arbeleche) redujo, "con el fin de abatir
    el déficit fiscal" según su propio texto, los dos descuentos de IVA por pago electrónico creados
    en gobiernos anteriores: el de las compras con tarjeta de débito (2 puntos porcentuales
    adicionales, Decreto 203/014 de 2014) y el de los servicios gastronómicos y turísticos (9
    puntos, Decreto 537/005 de 2005).

    Que el propio decreto encuadre la medida como corrección del déficit fiscal, y no como
    devolución de un beneficio, respalda la lectura de Astori de que implicó una mayor carga
    tributaria efectiva; el decreto no cuantifica ese impacto en dólares.

    La cifra de "US$ 100.000.000" no se encontró en un documento del MEF o la DGI que la calcule: el
    antecedente más cercano es el debate de Rendición de Cuentas en el Senado del 14/3/2023, diez
    días después de esta declaración.

    Allí, un senador del Frente Amplio citó, atribuyéndolo a "analistas independientes" sin
    nombrarlos, un aumento de recaudación de aproximadamente USD 35.000.000 por la rebaja del
    descuento de IVA más USD 65.000.000 por el cambio en el método de ajuste de las franjas de
    IRPF/IASS, que sumados da "del orden de los USD 100.000.000".

    Esa cuenta agrega un componente -el ajuste de franjas de IRPF/IASS- distinto del que Astori citó
    en su propia declaración de marzo de 2020 sobre este mismo episodio, que habla solo de los
    descuentos de IVA. No se encontró una estimación oficial y desagregada de cuánto rindió cada
    medida del Decreto 97/020 por separado.
