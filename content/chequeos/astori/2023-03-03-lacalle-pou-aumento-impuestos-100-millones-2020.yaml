analisis: >-
  Astori afirmó que el gobierno de Lacalle Pou aumentó los impuestos en US$ 100 millones al asumir,
  contrariando lo anunciado en campaña. El mecanismo que describe es real: el Decreto 97/020 de
  marzo de 2020 redujo, "para abatir el déficit fiscal", los descuentos de IVA por pago electrónico
  en débito y en consumos gastronómicos y turísticos, pero el decreto no cuantifica el efecto en
  dólares.


  La única cifra en dólares que se localizó surge de una intervención en el Senado de un legislador
  del Frente Amplio -el propio partido de Astori-, que atribuye a "analistas independientes" sin
  nombrarlos una recaudación adicional de USD 35 millones por el IVA más USD 65 millones por un
  cambio en el ajuste de las franjas de IRPF e IASS, una medida distinta de la que Astori describió
  en 2020, que en conjunto suman los USD 100 millones.


  No hay una estimación oficial y desagregada de cuánto rindió cada medida por separado.
