analisis: >-
  Astori dijo ante el Senado que, por el ajuste de 2016 al IRPF y al IASS, solo el 17% de
  trabajadores y pasivos pagaría más y el 67% no pagaría el impuesto; la versión taquigráfica agrega
  un tercer dato que la crónica de El País no recogía: un 15% que sigue pagando lo mismo que antes.


  No se localizó un desglose independiente de la DGI o el BPS que confirme esos tres porcentajes: la
  única fuente es la lámina que el propio Ministerio de Economía proyectó durante la sesión. En la
  misma sesión, un senador cuestionó esa lectura del dato: dijo que sostener que "el 67% no paga el
  impuesto" equivale a decir que casi el 70% de los uruguayos gana menos de 30.000 pesos.
