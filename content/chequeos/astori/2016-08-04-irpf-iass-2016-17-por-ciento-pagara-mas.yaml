titulo: Cuánta gente pagaría más por el ajuste de 2016 al IRPF y al IASS
afirmacion: Por los ajustes al IRPF y al IASS de 2016, solo el 17% de los trabajadores y pasivos
  pagará más, el 67% no paga ni pagará el impuesto, y el 15% restante paga lo mismo que antes.
fragmento: solo el 17 % de los trabajadores y pasivos pagará más impuestos que en la actualidad. El
  67 % de los trabajadores y pasivos no paga ni pagará impuesto. Luego, el 15 % paga lo mismo
calificacion: discutible
dato_real:
  valor: >-
    El diario de sesiones de la Cámara de Senadores del 4/8/2016 -la misma sesión que reportó El
    País- registra la frase textual de Astori, quien la sostuvo mostrando "la gráfica que estamos
    viendo en pantalla" durante su intervención: el dato remite a esa gráfica del Ministerio de
    Economía, no a un informe separado y públicamente disponible de la DGI o el BPS con el universo
    de contribuyentes por franja.


    La propia versión taquigráfica registra que la cifra fue cuestionada en la sala: un senador
    señaló que la justificación de que "el 67% no paga el impuesto" equivale a decir que "casi el
    70% de los uruguayos ganan menos de $30.000", una lectura en espejo del mismo dato que el
    Gobierno presentaba como beneficio.


    No hay, hasta donde se pudo establecer, un desglose oficial de la DGI o el BPS por franja de
    ingresos que permita verificar de forma independiente el 17% y el 67%.
