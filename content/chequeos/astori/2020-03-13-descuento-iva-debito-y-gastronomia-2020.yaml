analisis: >-
  Astori dijo que el gobierno de Lacalle Pou bajó en 2 puntos el descuento de IVA por débito y de 9
  a 5 puntos el de consumos gastronómicos; el decreto que lo hizo confirma completa la segunda cifra
  y solo parcialmente la primera.


  La baja de 9 a 5 puntos en el descuento gastronómico y turístico está en el texto legal hoy
  vigente. La de 2 puntos en débito es más difícil de verificar: el decreto no tocó el artículo que
  fija esa rebaja general, sino una fórmula de cálculo para casas de apuestas y un artículo que
  quedó derogado, cuyo contenido ya no puede leerse.
revision:
  tier: probable
  notas_internas: "Documento previsible resuelto para la mitad del chequeo: el Decreto 97/020 y el
    texto vigente del Decreto 537/005 confirman la baja de 9 a 5 puntos en el descuento
    gastronómico. La otra mitad (2 puntos en débito) sigue discutible: el propio decreto solo tocó,
    del lado del Decreto 203/014, una fórmula de cálculo para casas de apuestas y derogó un artículo
    cuyo contenido ya no se puede leer en el texto vigente de IMPO. Para cerrar esa parte haría
    falta el texto del artículo 2° de 203/014 antes de su derogación (una captura de Wayback de esa
    página anterior a marzo de 2020, o el Diario Oficial de julio de 2014)."
