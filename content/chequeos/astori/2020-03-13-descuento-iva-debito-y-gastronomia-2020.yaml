titulo: El descuento de IVA gastronómico bajó de 9 a 5 puntos en 2020; el del débito, por otra vía
afirmacion: El gobierno de Lacalle Pou redujo en 2 puntos el descuento de IVA en las compras con
  tarjeta de débito y de 9 a 5 puntos el descuento en consumos gastronómicos y turísticos.
fragmento: Se ha disminuido en 2 puntos la ventaja tributaria del IVA en las compras con tarjeta de
  débito y se ha rebajado la ventaja tributaria de 9 a 5 puntos en el consumo de servicios
  gastronómicos
calificacion: discutible
dato_real:
  valor: >-
    El Decreto 97/020 (11/3/2020, Lacalle Pou y Arbeleche) dice en sus propios considerandos que,
    hasta entonces, el Decreto 537/005 daba una rebaja de 9 puntos porcentuales de IVA a consumos
    gastronómicos y turísticos con pago electrónico, y que el Decreto 203/014 daba una rebaja de 2
    puntos en compras con débito y medios electrónicos por montos menores a UI 4.000.


    El texto hoy vigente del artículo 1° del Decreto 537/005, con la redacción que le dio el
    artículo 2° de 97/020, fija esa rebaja gastronómica en 5 puntos: la baja de 9 a 5 que describe
    Astori está confirmada por el propio texto legal.


    El artículo 1° del Decreto 203/014, que fija la rebaja general de 2 puntos por débito, sigue
    vigente sin cambios. Lo que 97/020 modificó del lado del débito fue una fórmula de cálculo
    específica para casas de apuestas (artículo 1° BIS).


    97/020 también derogó por completo otro artículo (el 2°) y partes de otros dos, cuyo texto ya no
    se puede leer por estar derogado; no se pudo confirmar con la redacción vigente si esa
    derogación equivalía, para el consumidor común, a los 2 puntos que menciona Astori.
