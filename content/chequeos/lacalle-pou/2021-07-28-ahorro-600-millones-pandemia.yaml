titulo: 'Ahorro de US$600 millones "durante la pandemia": el dato oficial cubre solo 2020'
afirmacion: En una entrevista con el canal argentino LN+, Lacalle Pou dijo que su gobierno ahorró
  más de US$600 millones sin poner impuestos, sin precisar el período.
fragmento: logró ahorrar más de US$600 millones
calificacion: discutible
exhaustivo: false
dato_real:
  valor: >-
    El MEF calculó (08/02/2021) un ahorro de USD 660 millones para 2020: USD 380M en Gobierno
    Central-BPS y USD 280M en el resto del sector público, a valores de 2019 y sin gasto COVID.

    Ese mismo día informó que se habían destinado USD 1.217 millones (2,3% del PBI) a atender la
    pandemia. No hay actualización oficial de la cifra de ahorro para 2021: la presentación del MEF
    más próxima a la declaración, del 12/07/2021, no la repite.

    En la misma entrevista, Lacalle Pou dio otro desglose: gasto de US$670 millones en 2020, US$940
    millones previstos para 2021 y ahorro de US$640 millones. La promesa de campaña había sido
    ahorrar US$900 millones.
