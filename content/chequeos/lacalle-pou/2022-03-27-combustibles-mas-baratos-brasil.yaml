revision:
  tier: probable
  notas_internas: 'Se sacó El País de evidencia.fuentes (crítica, chequeos[1] A): su nota no contiene
    "Brasil". afirmacion y fragmento se reescribieron para seguir el audio, con la reserva "creo que
    del 2001 2002" incluida como parte de lo dicho (crítica B); fragmento se actualizó junto con el
    resumen de la declaración. Se declaró la regla de emparejamiento del gasoil y se dan los dos
    resultados (50S vs. S10: Uruguay 6,8% más barato; 10S vs. S10, mismo azufre: Uruguay 16,2% más
    caro), agregando "Gas Oil 10S 67,30" a la cita del decreto, que antes se cortaba una línea antes
    (crítica C, bloquea). Se agregó el contexto de las cuatro semanas previas (CED 3/3: 38% nafta,
    17% gasoil más caros que Brasil; ANP: suba de 18,10% diesel y 9,91% nafta en Brasil) y la
    comparación contra la región Sul (crítica D y E). Se corrigió la URL del BCB a la forma GET con
    query params y se documentó el cuerpo SOAP del BCU y la distinción billete/interbancario
    (crítica F). Se reformuló el párrafo de "por primera vez" para no decir "no se encontró serie"
    cuando lo que falta es reconstruirla con series oficiales ya identificadas (crítica H).
    calificacion: discutible por regla (verdadero/falso exigen documento oficial que sostenga la
    conclusión, y acá el oficial da los insumos, no la conclusión) y por el resultado mixto entre
    nafta y gasoil (crítica J). Tier probable, no publicado: dos de las fuentes de dato_real (bcu,
    bcb-brasil) tienen verificacion: manual, y ese es justamente el criterio que baja un registro a
    probable. Que_falta: aprobación humana de esas dos fuentes (pnpm aprobar --pendientes); si se
    aprueban, correspondería una corrección de tipo cambio_de_rating a publicado, no una
    republicación silenciosa. También queda pendiente, para el resolvedor: la reconstrucción de la
    serie pareada Uruguay-Brasil (ANP Série Histórica + URSEA + BCU/BCB) que permitiría verificar
    "por primera vez" con series oficiales en vez de con una sola declaración con reserva.'
