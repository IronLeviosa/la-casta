revision:
  tier: probable
  que_falta: "Ocho de las veinticuatro fuentes de dato_real llevan verificacion: manual (los binarios
    y API que pnpm fuente no puede leer como texto: xlsx de URSEA, csv de ANCAP/catalogodatos, zip
    del MIEM, dos xlsx de la ANP, la API SGS 3695 del BCB, más el BCU y la API olinda del BCB del
    chequeo original). Por regla del sitio eso exige la firma del mantenedor en pnpm aprobar antes
    de subir a publicado, más allá de que la crítica de esta corrida confirmó que ninguna está mal
    clasificada."
  notas_internas: >-
    Calificación cambiada de discutible a falso. La razón anterior de discutible ya no aplica: decía
    que "por primera vez" no se había reconstruido, y el gráfico de esta misma corrida es esa
    reconstrucción; la otra razón que daba (que el documento oficial debía enunciar la conclusión,
    no solo dar los insumos) no es una regla del sitio -ya la había corregido el commit 0f913e9-. El
    fundamento nuevo es que "por primera vez", el elemento distintivo de la frase, es falso bajo
    cualquier combustible o convención de cálculo probada; el mismo criterio debería aplicarse a un
    "por primera vez" de cualquier otro presidente con evidencia documentada de que ya había pasado
    antes.

    Dos objeciones de la crítica quedan documentadas pero no resueltas en esta pasada, ninguna
    bloqueante: el congelamiento del precio uruguayo entre junio de 2019 y diciembre de 2020 sigue
    apoyado en parte en el índice de UNVENU (asociación privada de estacioneros) en vez de la página
    "Decretos Precios" de ANCAP que la crítica propuso como reemplazo parcial (esa página tampoco es
    un índice completo: le faltan 171/021 y 205/021 en su pestaña de 2021); y el año 2001 de la
    afirmación original ("2001 o 2002") no pudo probarse por falta de serie oficial uruguaya de ese
    año -ya está dicho en grafico.nota, no solo acá-.
procedencia:
  tipo: correccion
  correccion: 2026-09-08-brasil-datasets-verificables
