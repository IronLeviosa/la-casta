tema: economia/combustibles
fecha: 2022-03-27
titulo: "Combustibles más baratos que Brasil «por primera vez desde 2001»: no fue la primera vez"
afirmacion: En marzo de 2022, Lacalle Pou dijo que, por primera vez desde 2001 o 2002 según su
  propio cálculo, tenía combustibles más baratos en Uruguay que en Brasil.
fragmento: por primera vez —según creía, desde 2001 o 2002— tenía combustibles más baratos que Brasil
calificacion: falso
exhaustivo: false
dato_real:
  valor: >-
    Precios oficiales de la semana del 27/03/2022: la nafta (Gasolina Súper 95) costaba USD 1,81 por
    litro en Uruguay (Decreto 64/022) y USD 1,51 en Brasil (ANP, Gasolina C comum), 19,6% más cara
    en Uruguay. Conversión al tipo de cambio de referencia del BCU y el BCB del 25/03/2022.

    El gasoil uruguayo (Gas Oil 50S) costaba USD 1,30 por litro contra USD 1,40 del Diesel S10
    brasileño, 6,8% más barato; emparejado por especificación de azufre (Gas Oil 10S uruguayo, USD
    1,62), resulta 16,2% más caro que el mismo S10. Ningún documento oficial fija cuál
    emparejamiento corresponde.

    Tres semanas antes, el CED medía la nafta uruguaya 38% más cara que en Brasil y el gasoil 17%
    más caro (03/03/2022); en esas cuatro semanas la ANP registró en Brasil una suba de 18,10% en el
    diésel y 9,91% en la nafta, mientras los precios uruguayos, fijados por decreto, no cambiaron.

    En la serie mensual oficial 2002-2022 (URSEA y decretos del Poder Ejecutivo para Uruguay; ANP
    para Brasil), la nafta uruguaya fue más barata que la brasileña en 28 de los 252 meses de la
    serie, todos entre mayo de 2007 y mayo de 2011; en los doce meses de 2022 estuvo por encima,
    entre 19,8% (marzo) y 101,1% (diciembre).

    El gasoil (50S, o su antecesor sin grado, contra el diesel brasileño de cada época) fue más
    barato en 13 meses: agosto y diciembre de 2002; enero, febrero, abril y mayo de 2003; enero a
    abril de 2006; abril y mayo de 2009; y marzo de 2022. Los dos combustibles fueron más baratos el
    mismo mes solo en abril y mayo de 2009 (nafta 15,3% y gasoil 3,4% más baratos en mayo).
