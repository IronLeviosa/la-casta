analisis: "Dijo que toda la renuncia fiscal del paquete anunciado ese día —IRPF, IASS y apoyo a
  mipymes, entre personas y empresas— sumaba 150 millones de dólares; el anexo técnico oficial del
  mismo día desglosa USD 80 millones (IRPF) + USD 30 millones (IASS) + USD 40 millones (mipymes),
  que suman exactamente USD 150 millones. Es una estimación del propio Poder Ejecutivo para una
  propuesta recién anunciada, no un costo ya ejecutado o auditado; la Comisión de Hacienda de
  Diputados registró la misma cifra agregada trece días después, por boca del subsecretario de
  Economía y Finanzas, Alejandro Irastorza. La frase no aparece en la transcripción que publicó El
  Observador porque ese texto se corta antes de llegar a ese tramo del discurso —termina en la
  oración anterior, sobre las mipymes— y no porque no se haya dicho: el audio oficial completo, sin
  cortes, la registra de forma contigua inmediatamente después."
