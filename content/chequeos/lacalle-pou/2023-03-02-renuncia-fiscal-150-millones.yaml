analisis: >-
  El desglose oficial (80+30+40) suma exactamente los USD 150 millones que dijo.

  Es una estimación del propio Poder Ejecutivo para una propuesta recién anunciada, no un costo ya
  ejecutado o auditado; la Comisión de Hacienda de Diputados registró la misma cifra agregada trece
  días después, por boca del subsecretario de Economía y Finanzas, Alejandro Irastorza.

  La frase no aparece en la transcripción que publicó El Observador porque ese texto se corta antes
  de llegar a ese tramo del discurso —termina en la oración anterior, sobre las mipymes— y no porque
  no se haya dicho: el audio oficial completo, sin cortes, la registra de forma contigua
  inmediatamente después.
