  notas_internas: 'Segunda pasada encontró el audio oficial completo (AK_502.mp3, 41.154 caracteres
    sin cortes) y confirmó que Lacalle Pou sí dijo la cifra: la primera pasada la había dado por no
    dicha basándose en la transcripción de El Observador, que se corta exactamente en ese tramo (ver
    notas.md ## resumen_vs_primaria). Se reescribió la afirmacion para atribuirla directamente a
    Lacalle Pou (antes decía "Presidencia informó"), se subió evidencia a nivel textual con fuente
    primaria propia, se corrigió la composición del dato_real (80+30+40=150, antes solo
    IRPF+IASS=110) y se retiró la fecha de envío del proyecto de ley por no tener fuente citable.
    Calificación verdadero: cifra y composición coinciden exactamente entre lo dicho y dos fuentes
    oficiales independientes entre sí (anexo de Presidencia y versión taquigráfica de la Comisión de
    Hacienda), con la salvedad de que es una estimación ex ante del propio Poder Ejecutivo, no un
    costo ejecutado. Tier bajado de publicado a probable en esta calibración: pnpm validar --red
    marca 1252.pdf (dato_real.fuentes, la versión taquigráfica de la Comisión de Hacienda) sin
    respuesta HTTP y sin copia en Wayback; el texto ya está en el corpus propio (75.736 caracteres,
    bajado 2026-09-07, cita confirmada, incluye la cifra buscada en el carácter 4843) pero
    diputados.gub.uy no resuelve la conexión en vivo en este momento. Se marcó verificacion: manual
    en esa fuente puntual, lo que exige aprobación humana y tope de tier en probable hasta que
    /revisar corra pnpm archivar y, si corresponde, se apruebe. La calificación verdadero no cambia:
    el audio (fuente primaria de evidencia, ok en --red) y el anexo técnico (ok en --red) ya
    sostienen 80+30+40=150 por sí solos; 1252.pdf es corroboración adicional, no la única base.'
