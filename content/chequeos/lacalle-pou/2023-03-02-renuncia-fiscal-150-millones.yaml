titulo: Renuncia fiscal de US$150 millones, según el desglose oficial
afirmacion: En la rendición de cuentas ante la Asamblea General del 2 de marzo de 2023, Lacalle Pou
  dijo que toda la renuncia fiscal del paquete de rebajas anunciado ese día —IRPF, IASS y apoyo a
  micro y pequeñas empresas, entre personas y empresas— sumaba 150 millones de dólares.
