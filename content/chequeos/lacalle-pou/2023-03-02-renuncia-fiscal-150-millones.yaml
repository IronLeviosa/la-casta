    El anexo desglosa USD 80M (IRPF), USD 30M (IASS) y USD 40M (mipymes): USD 150M en total.


    El IASS beneficia a unos 20.000 uruguayos; la cifra agregada coincide con el audio oficial
    (marca 1:01:29).

    La versión taquigráfica de la Comisión de Hacienda de Diputados del 15/03/2023 registra la misma
    cifra agregada, dicha por el subsecretario de Economía y Finanzas, Alejandro Irastorza, trece
    días después del anuncio.
