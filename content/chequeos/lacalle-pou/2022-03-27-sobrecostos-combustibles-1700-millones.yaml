dato_real:
  valor: >-
    El único cálculo público (CED, privado) da USD 443 millones en nafta y USD 1.337 millones en
    gasoil (2015-2019), USD 1.780 millones en total.

    El CED es un centro de estudios privado, no un organismo oficial, con vínculo institucional
    documentado con Lacalle Pou. El mismo informe muestra sobreprecios de magnitud comparable en
    2010-2014 (USD 1.181 millones en gasoil) y consigna que, al inicio de su gobierno, este
    reconoció un sobreprecio de hasta $2,97 por litro (el "factor x"), con el objetivo de eliminarlo
    en tres años.
