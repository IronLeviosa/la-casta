analisis: >-
  Sin dato oficial; la única estimación (CED, privada) da un monto similar.

  La cifra depende de un cálculo que combina una serie oficial (el PPI de URSEA) con datos de
  volúmenes que el CED no publica, así que no se puede reproducir con la fuente oficial sola; el
  propio documento además trae el dato de gasoil con dos valores distintos (1137 y 1.337) sin
  explicar la diferencia, y la cifra de Lacalle Pou solo cierra con la lectura de 1.337.

  El mismo cálculo del CED muestra sobreprecios de magnitud comparable en el quinquenio anterior
  (2010-2014, USD 1.181 millones en gasoil) y un componente —el "factor x" que el propio gobierno de
  Lacalle Pou reconoció— que antecede a la gestión a la que le atribuye el sobrecosto.

  El CED, además, tiene un vínculo institucional documentado con Lacalle Pou (discursos suyos en sus
  cenas anuales, liderazgo de uno de sus programas). Sin documento oficial que sostenga el monto, la
  calificación queda en discutible.
