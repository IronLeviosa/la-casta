revision:
  tier: publicado
  notas_internas: >-
    Se sacó El País de evidencia.fuentes (crítica, chequeos[0] A): su nota no contiene "1.700" ni
    "millones" ni "paridad", no es testigo de esta afirmación. Se movió El Observador de
    evidencia.fuentes a dato_real.fuentes: su cita es sobre lo que dice el informe del CED
    (publicado el 2022-03-07, veinte días antes de la conferencia), no sobre lo que dijo Lacalle
    Pou, así que corrobora el dato_real, no la evidencia de que él lo haya dicho — mismo tipo de
    error que El País, aplicado con el mismo criterio. Se ajustó marca_tiempo de 670 a 666 (la cita
    empieza en 666,3, no al final de la pregunta retórica). Se agregó una segunda cita de El
    Observador (factor X) y se reescribió dato_real.valor sin la explicación causal no probada sobre
    el 1137/1.337 (crítica C) y con el contexto del factor X y el vínculo CED-Lacalle Pou (crítica D
    y objeción de simetría del lote). _faltante: dato_oficial se mantiene: falta la serie de ventas
    mensuales en litros de ANCAP o la Dirección Nacional de Energía (tarea para el resolvedor, no de
    este lote).

    Presentación (2026-09-07): dato_real.valor se condensó; se movió acá el detalle de método: el
    documento del CED trae el dato de gasoil 2015-2019 con dos cifras en el mismo PDF (resumen de
    portada: 1137M; cuerpo, carácter 7862: 1.337M); se usó 1.337 por ser la cifra contigua y no
    cosida, y porque es la que reproduce El Observador citando el mismo informe (corroboración no
    independiente, lee el mismo PDF). "Quinquenio anterior" (marzo 2015-marzo 2020, según lo dijo
    Lacalle Pou) y "2015-2019" (años calendario, que es lo que mide el CED) difieren en
    enero-febrero de 2020 (dentro del quinquenio, fuera del cálculo) y enero-febrero de 2015 (fuera
    del quinquenio, dentro del cálculo); no se recalculó el efecto de ese desfase. El mismo informe
    da además USD 14 millones y USD 67 millones de sobreprecio para 2020-2021, sin que esta corrida
    haya verificado a qué combustible corresponde cada cifra (no se confirmó el orden "nafta,
    gasoil" contra el original) — por eso no se llevaron esos dos años al gráfico; ver
    observaciones.md.
