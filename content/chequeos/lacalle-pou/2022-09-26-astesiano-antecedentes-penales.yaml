fecha: 2022-09-26
titulo: 'Astesiano "no tiene antecedentes penales": condenado en 2014, causa extinguida en 2015'
afirmacion: Alejandro Astesiano, jefe de la custodia presidencial, "no tiene antecedentes penales"
  (conferencia de prensa del 26 de setiembre de 2022).
fragmento: no tiene antecedentes penales
calificacion: discutible
dato_real:
  valor: >-
    El Diario de Sesiones del Senado del 12 de octubre de 2022 registra que Astesiano fue procesado
    con prisión preventiva el 17 de marzo de 2013 (el senador Alejandro Sánchez da el 18; coinciden
    mes y año) y condenado el 5 de setiembre de 2014 a dieciocho meses de prisión por un delito
    continuado de estafa, no cumplidos en cárcel porque ya había purgado la preventiva de 2013. El
    subsecretario del Interior, doctor Maciel, sostuvo que esa condena se extinguió en 2015 por
    suspensión condicional de la pena (Código Penal, artículo 126, título VIII, capítulo I) y que el
    Juzgado lo comunicó por oficio n.º 3861 del 29 de junio de 2015 a la Policía Científica; con
    eso, dijo, Astesiano queda como "primario legal" y no "primario absoluto", categoría que, según
    el subsecretario, también usó ante la prensa la fiscal que investiga el caso de 2022.

    El decreto 382/999 (artículos 3 y 4, IMPO) dispone que el Certificado de Antecedentes Judiciales
    solo consigna "las resoluciones y sentencias judiciales que hubieren recaído sobre el individuo"
    y prohíbe asentar hechos sin condena firme; no se refiere a la extinción, que es un instituto
    del Código Penal. Sobre el procesamiento de 2002 que la prensa y el senador Sánchez atribuyeron
    a Astesiano, el subsecretario dijo en la misma sesión que "no figura ni hay registro" de esa
    causa a su nombre, y que el mismo delito con la misma fecha corresponde, según la búsqueda del
    Ministerio, a otra persona.
