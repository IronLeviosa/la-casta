revision:
  tier: publicado
  notas_internas: >-
    Discutible por el fondo, no por falta de documento (objeciones 1 y 5 de critica.md, resueltas):
    hay lectura jurídico-técnica documentada (primario legal, extinción del delito en 2015, artículo
    126 CP, oficio 3861/2015, corroborada según el subsecretario por la fiscal del caso de 2022) y
    lectura corriente (hubo condena en 2014, confirmada por el propio Ministerio), ambas en el mismo
    documento oficial. No sale de "discutible" agregando más papel del Ministerio: la ambigüedad es
    sobre qué acepción de "antecedentes penales" corresponde, no un dato pendiente de verificar.

    El procesamiento de 2002 se retiró como hecho porque el Ministerio lo niega en la misma sesión
    (objeción 2, resuelta) y dice que el registro con esa fecha y ese delito pertenece a otra
    persona; no se investigó a esa persona ni corresponde hacerlo, no es figura pública.

    El Ministerio también admitió en la misma sesión que alguien desasoció la cédula de Astesiano
    del sistema en 2015 y que se reasoció el 8 de setiembre de 2021 sin informar a las autoridades
    ("adulteración informática", según su propia descripción). Es relevante para un futuro registro
    sobre la investigación administrativa o sobre qué sabía el Gobierno, no para este chequeo.

    Pendiente, aviso no bloqueante (objeción 6): la cita "no tiene antecedentes penales" solo está
    entrecomillada en Subrayado; El Observador la parafrasea y podría estar uniendo dos respuestas
    distintas (antecedentes / futuro laboral del custodio). Buscar video o versión de Presidencia
    (medios.presidencia.gub.uy, archivo.presidencia.gub.uy, YouTube de Presidencia) de la
    conferencia del 26-09-2022 para subir evidencia.nivel de reportado a textual.

    No se usa la lista de custodios de gobiernos anteriores con antecedentes que leyó el ministro en
    la misma sesión (Fabra, Ferreira, Romero, Rodríguez, Frattini): son personas privadas sin etapa
    ni fecha verificable en el registro oficial, no alcanzan el umbral de la ley 18.331 art. 18
    (objeción 7, resuelta).
