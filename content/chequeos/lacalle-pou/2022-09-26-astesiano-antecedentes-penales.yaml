analisis: >-
  Lacalle Pou dijo, dos días después de la detención de Astesiano, que "no tiene antecedentes
  penales". El Ministerio del Interior confirmó en el Senado que fue procesado con prisión
  preventiva en 2013 y condenado en 2014 a dieciocho meses por estafa: antecedentes penales en
  sentido corriente. Pero sostuvo, con norma y oficio, que esa condena se extinguió en 2015 y que en
  el sentido del certificado oficial no quedan antecedentes. Las dos lecturas están documentadas:
  queda discutible por el fondo, no por falta de documento.

  La extinción se apoya en el artículo 126 del Código Penal (si la persona no reincide durante cinco
  años tras la suspensión condicional, el delito se extingue) y en el oficio n.º 3861 del 29 de
  junio de 2015 del Juzgado a la Policía Científica. El subsecretario Maciel llamó a esa situación
  "primario legal", distinta de "primario absoluto" (nunca tuvo antecedentes), y dijo que la fiscal
  que investiga el caso de 2022 usó la misma categoría ante la prensa.

  El procesamiento de 2002 que la prensa y el senador Alejandro Sánchez atribuyeron a Astesiano no
  está confirmado: en la misma sesión el Ministerio dijo que "no figura ni hay registro" de esa
  causa a su nombre y que el mismo delito con la misma fecha corresponde a otra persona. Sobre 2013,
  Sánchez dio el día 18 de marzo y el subsecretario el 17; coinciden mes y año.

  El ministro Heber dijo en la sesión que al presidente se le informó dos veces, en 2020 y en 2021,
  que Astesiano "tenía anotaciones y que no tenía antecedentes"; el registro no afirma qué sabía
  Lacalle Pou el 26 de setiembre, solo compara lo que dijo con lo que el propio Gobierno documentó
  después.
