analisis: 'Dijo, según el audio oficial, que el cambio en las deducciones del IRPF iba a
  «beneficiar» al 75% de los contribuyentes; el anexo técnico de su propio gobierno reserva ese
  verbo para un grupo más chico, un 47%, y usa «alcanzan» —un cambio en el cálculo del impuesto, no
  necesariamente un beneficio significativo— para el 75%. Del 47% "significativamente beneficiado",
  un 30% (≈14% del total, cerca de 63.000 personas) deja de pagar el impuesto; ese 14% no contradice
  al 75% ni al 47%, son subconjuntos distintos del mismo cambio. La palabra que usó Lacalle Pou
  coincide con la transcripción independiente de El Observador ("beneficiará al 75%") y difiere de
  la gacetilla de Presidencia, que sí siguió la distinción técnica del anexo ("alcanzarán al 75%").
  El 75% no tiene, hasta donde se relevó en esta corrida, una fuente de verificación independiente
  de quien propuso la medida: no se consultó la serie de contribuyentes de IRPF Categoría II de la
  DGI (Asesoría Económica) que permitiría recalcularlo por fuera del Poder Ejecutivo.'
