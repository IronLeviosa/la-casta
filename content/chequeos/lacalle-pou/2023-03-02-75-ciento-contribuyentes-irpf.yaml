revision:
  tier: publicado
  notas_internas: 'Segunda pasada reemplazó la cita cosida de info-rebaja-impuestos.pdf (similitud
    0.72 contra el validador) por la cita limpia y contigua del anexo técnico, y subió evidencia a
    primaria propia (audio oficial, marca 59:27): el audio confirma que Lacalle Pou dijo
    "beneficiar", no "alcanzar", el mismo verbo que ya traía la transcripción de El Observador.
    Calificación discutible: "beneficiar al 75%" excede lo que el propio anexo del gobierno atribuye
    a ese verbo (reservado para el 47%). Pendiente para el resolvedor: serie de contribuyentes de
    IRPF Categoría II de la DGI (Asesoría Económica) para verificar el 75% de forma independiente
    del Poder Ejecutivo.'
