tema: economia/impuestos
fecha: 2023-03-02
afirmacion: En la rendición de cuentas ante la Asamblea General del 2 de marzo de 2023, Lacalle Pou
  dijo que el aumento de las deducciones del IRPF beneficiaría al 75% de los contribuyentes de ese
  impuesto, y que un 14% de ellos (cerca de 63.000 personas, las de menores ingresos) dejaría de
  pagarlo.
fragmento: alcanzaría al 75% de los contribuyentes de IRPF
calificacion: discutible
exhaustivo: false
dato_real:
  valor: 'El anexo técnico que Presidencia distribuyó junto con el discurso ("Documento a tres años de
    gestión") dice: "Estos cambios en las deducciones del IRPF alcanzan al 75% de los
    contribuyentes. El 47% de los contribuyentes se verán significativamente beneficiados dentro de
    los cuales, el 30% dejará de ser contribuyente, siendo en más de un 90% contribuyentes de
    menores ingresos" (30% de ese 47% equivale a ≈14% del total, consistente con el "14%, cerca de
    63.000 uruguayos" que se menciona aparte; no hay contradicción entre ambas cifras). El propio
    documento distingue entonces dos universos con la misma reforma: un 75% al que las nuevas
    deducciones "alcanzan" (les cambia el cálculo del impuesto, aunque sea marginalmente) y un 47%
    que resulta "significativamente beneficiado". El audio oficial del discurso (transcripción
    propia, Whisper large-v3-turbo, marca 59:27) confirma que Lacalle Pou usó el verbo "beneficiar",
    no "alcanzar", para el 75%: "de estos cambios en la deducción del IRPF beneficiar el 75% de los
    contribuyentes mientras el 14% cerca de 63.000 uruguayos aquellos de menores ingresos van a
    dejar de pagar el IRPF"; es la misma formulación que ya traía la transcripción de El Observador
    ("beneficiará al 75% de contribuyentes"). La gacetilla de Presidencia, en cambio, escribió
    "alcanzarán al 75%". La cifra del 75% no tiene, hasta donde se relevó en esta corrida, una
    fuente de verificación independiente del Poder Ejecutivo: no se localizó una serie pública de la
    DGI (Asesoría Económica) sobre contribuyentes de IRPF Categoría II que permita recalcularla; el
    único cálculo disponible es el que hizo el propio gobierno que propuso la medida.'
