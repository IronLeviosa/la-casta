analisis: >-
  Orsi dijo que Ancap volvía a tener números negativos en su balance "después de 10 años". Con la
  cifra de 2020 que Ancap tiene vigente hoy (reexpresada en 2021), el ejercicio negativo
  inmediatamente anterior a 2024 fue 2015, nueve años antes, no diez.

  En 2020 los estados financieros originales mostraban una pérdida de USD 12,1 millones; en 2021
  Ancap corrigió un error en el cálculo del impuesto a la renta de los ejercicios 2018 a 2020 y
  reexpresó 2020 como una ganancia de USD 9,1 millones. Con los estados tal como se emitieron en su
  momento —lo que tenía a mano cualquiera al escuchar a Orsi en abril de 2025— 2020 sí había sido
  negativo, cuatro años antes de 2024 y no diez.

  2014 también fue un ejercicio negativo (pérdida de USD 323,2 millones), aunque queda fuera de la
  década que menciona Orsi. El ejercicio 2023, inmediatamente anterior a la pérdida de 2024, fue
  positivo (USD 85,3 millones), de modo que tampoco hubo una racha ininterrumpida de diez años en
  positivo antes de 2024.

  El expresidente de Ancap del gobierno anterior, consultado por El Observador, no desmintió el
  dato: remitió a los mismos estados contables y señaló que aun con el mecanismo de precios que
  beneficiaba a Ancap hasta 2019, "aún así" había sido necesaria una capitalización en 2015,
  consistente con un resultado negativo ese año. Ningún medio de los que cubrieron la conferencia
  cotejó la afirmación contra el balance de 2020 vigente en ese momento.
