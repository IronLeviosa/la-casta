titulo: 'ANCAP en negativo "después de 10 años": el ejercicio anterior a 2024 fue 2015, nueve años antes'
afirmacion: Orsi afirmó que, al presentar el balance de Ancap del ejercicio 2024, la empresa volvía
  a tener números negativos en su balance después de 10 años sin tenerlos.
fragmento: volvemos después de 10 años a tener números negativos
calificacion: discutible
dato_real:
  valor: >-
    La serie de resultados del ejercicio (individuales, auditados) de Ancap entre 2014 y 2024 es:
    2014, pérdida de $ 7.876.081.940 (USD 323,2 millones); 2015, pérdida de $ 5.944.013.417 (USD
    198,5 millones); 2016, ganancia de $ 435.536.149 (USD 14,8 millones); 2017, ganancia de $
    1.124.635.133 (USD 39,0 millones); 2018, ganancia de $ 2.854.322.969 (USD 88,1 millones); 2019,
    ganancia de $ 1.464.281.136 (USD 39,2 millones); 2020, pérdida de $ 510.662.282 según los
    Estados Financieros Individuales publicados en su momento, reexpresada por los Estados
    Financieros Individuales de 2021 (Nota 30.2, en aplicación de la Norma Internacional de
    Contabilidad N° 8) a una ganancia de $ 385.113.873 (USD 9,1 millones) tras corregirse un error
    en el cálculo del impuesto a la renta de los ejercicios 2018 a 2020 —el resultado antes de
    impuesto a la renta de 2020 fue negativo, $ 277.690.029, en las dos versiones—; 2021, ganancia
    de $ 3.936.375.660 (USD 88,1 millones); 2022, ganancia de $ 6.527.893.312 (USD 162,9 millones);
    2023, ganancia de $ 3.329.544.346 (USD 85,3 millones); 2024, pérdida de $ 5.217.605.497 (USD
    118,4 millones).

    Con la cifra de 2020 vigente hoy (la reexpresada por Ancap en los estados de 2021), el ejercicio
    negativo inmediatamente anterior a 2024 fue 2015, nueve años antes, no diez ni cuatro.
