afirmacion: Orsi afirmó que, al presentar el balance de Ancap del ejercicio 2024, la empresa volvía
  a tener números negativos en su balance después de 10 años sin tenerlos.
fragmento: volvemos después de 10 años a tener números negativos
dato_real:
  valor: 'Los Estados Financieros Individuales de Ancap al 31 de diciembre de 2020 registran un
    resultado del ejercicio de $ 510.662.282 de pérdida, y los Estados Financieros Consolidados del
    mismo año, $ 457.129.828 de pérdida ($ 510.662.283 atribuible a los propietarios de la
    compañía): el ejercicio negativo inmediatamente anterior a 2024 fue 2020, cuatro años antes, no
    diez. Los Estados Financieros Individuales de 2024 (los mismos que documentan la pérdida de 118
    millones de dólares de ese año) muestran además que 2023, el ejercicio inmediato anterior, cerró
    con una ganancia de $ 3.329.544.346: el último ejercicio positivo antes de 2024 fue apenas un
    año antes. El expresidente de Ancap durante el gobierno de Lacalle Pou, Alejandro Stipanicic,
    salió a responderle a Orsi remitiendo a los mismos estados contables y señalando que, aun cuando
    el mecanismo de fijación de precios generaba ganancias para Ancap hasta 2019, "aún así" había
    sido necesaria una capitalización en 2015, lo que sugiere que ese ejercicio también fue de
    resultado negativo. El País, citando el mismo balance auditado, describe la serie completa de la
    última década: "Estas son las pérdidas más grandes desde 2015, cuando el rojo había sido de US$
    198 millones. Además, dejó atrás tres años consecutivos de ganancias (en 2020 había perdido US$
    12 millones)." Es decir, dentro de los diez años que Orsi da a entender que Ancap estuvo en
    positivo, hubo al menos dos ejercicios con resultado negativo documentados por la propia empresa
    (2015 y 2020), y el más reciente de esos dos fue hace cuatro años, no diez.'
