revision:
  tier: publicado
  notas_internas: 'Corrección de tipo cambio_de_rating sobre
    content/chequeos/orsi/2025-04-25-ancap-volvio-negativos-diez-anos-2025.yaml, de falso a
    discutible: los Estados Financieros Individuales de 2021 (Nota 30.2) reexpresaron el resultado
    de 2020 de pérdida a ganancia, con lo que el último ejercicio negativo antes de 2024 es 2015
    (nueve años antes), no 2020 (cuatro años antes) ni la lectura de "diez años" de Orsi. No se
    sostiene "falso": con la cifra vigente hoy, la afirmación de Orsi se equivocó por un año, no por
    seis, y con la cifra tal como estaba publicada en abril de 2025 la afirmación era razonable.
    Tampoco corresponde "verdadero": nueve no es diez. Regla de método para la colección: cuando una
    empresa reexpresa un ejercicio, el sitio publica la cifra vigente y muestra la anterior, para
    todos los gobiernos por igual.'
