titulo: 'ANCAP en números negativos "después de 10 años": el último ejercicio negativo fue 2020'
afirmacion: Orsi afirmó que, al presentar el balance de Ancap del ejercicio 2024, la empresa volvía
  a tener números negativos en su balance después de 10 años sin tenerlos.
fragmento: volvemos después de 10 años a tener números negativos
dato_real:
  valor: >-
    Los Estados Financieros Individuales de Ancap al 31/12/2020 registran una pérdida de $
    510.662.282 (consolidados: $ 457.129.828): el ejercicio negativo inmediatamente anterior a 2024
    fue 2020, cuatro años antes, no diez. Los mismos estados de 2024 muestran que 2023 cerró con una
    ganancia de $ 3.329.544.346, el último ejercicio positivo antes de la pérdida.

    El País, citando el mismo balance auditado, ubica además una pérdida de USD 198 millones en 2015
    y de USD 12 millones en 2020. El expresidente de Ancap del gobierno anterior, Alejandro
    Stipanicic, remitió a los mismos estados contables y señaló que, pese al mecanismo de precios
    favorable hasta 2019, "aún así" fue necesaria una capitalización en 2015.

    Al tipo de cambio de cierre de cada año (Ancap, Estados Financieros Individuales 2024, nota de
    moneda extranjera: 39,022 en 2023, 44,066 en 2024), los resultados de 2023 y 2024 equivalen a
    USD 85,3 millones y USD 118,4 millones respectivamente.
