calificacion: falso
analisis: >-
  Orsi dijo que Ancap volvía a tener números negativos "después de 10 años"; los estados financieros
  auditados de la propia Ancap muestran resultado negativo en 2020 -cuatro años antes, no diez- y
  también en 2015, según la prensa que cita el mismo balance.

  El ejercicio inmediatamente anterior a 2024, además, había sido positivo (2023, con una ganancia
  de $ 3.329.544.346), de modo que tampoco hubo una racha ininterrumpida de diez años de resultados
  positivos antes de la pérdida de 2024.

  El expresidente de Ancap del gobierno anterior, consultado por El Observador, no desmintió el
  dato: remitió a los mismos estados contables y señaló que aun con el mecanismo de precios que
  beneficiaba a Ancap hasta 2019, "aún así" había sido necesaria una capitalización en 2015, lo que
  es consistente con un resultado negativo ese año.

  Ningún medio de los que cubrieron la conferencia cotejó la afirmación contra el balance de 2020 al
  momento de publicarla.
