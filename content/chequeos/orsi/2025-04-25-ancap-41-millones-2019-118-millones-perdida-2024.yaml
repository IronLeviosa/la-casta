titulo: "Ancap: ganancia de US$41 millones en 2019 y pérdida de US$118 millones en 2024, según los
  balances"
afirmacion: Orsi afirmó que en 2019 Ancap tuvo una ganancia de 41 millones de dólares y que en el
  ejercicio 2024 tuvo un resultado de pérdida de 118 millones de dólares.
fragmento: en el año 19 ANCAP daba 41 millones de dólares de ganancia, y en el año 24 el resultado
  es un resultado de pérdida de 118 millones
dato_real:
  valor: >-
    Los Estados Financieros Individuales de Ancap al 31/12/2024 (auditados por Grant Thornton)
    registran una pérdida de $ 5.217.605.497, que Ancap difunde en dólares como USD 118 millones
    ("Resultados Ancap - Ejercicio 2024", 01/04/2025) y que, al tipo de cambio de cierre de 2024
    (44,066), equivalen a USD 118,4 millones.

    El resultado de 2019 fue una ganancia de $ 1.464.281.136: USD 39,2 millones al tipo de cambio de
    cierre de ese año (37,31) o USD 41,7 millones al promedio (35,15). Presidencia difundió "39
    millones" en 2020 (cierre) y Orsi dio "41" en 2025 (promedio): es el mismo resultado auditado
    bajo dos convenciones distintas, no dos cifras que se contradigan.

    La pérdida de 2024 se explica por la parada de 297 días de la refinería de La Teja (agosto
    2023-junio 2024), USD 55 millones resignados por vender combustible bajo el precio de paridad de
    importación y USD 24 millones de subsidio al supergás (El Observador, con datos de Ancap).
