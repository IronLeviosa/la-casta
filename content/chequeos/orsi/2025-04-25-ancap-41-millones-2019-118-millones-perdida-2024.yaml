fecha: 2025-04-25
afirmacion: Orsi afirmó que en 2019 Ancap tuvo una ganancia de 41 millones de dólares y que en el
  ejercicio 2024 tuvo un resultado de pérdida de 118 millones de dólares.
fragmento: en el año 19 ANCAP daba 41 millones de dólares de ganancia, y en el año 24 el resultado
  es un resultado de pérdida de 118 millones
dato_real:
  valor: 'Los Estados Financieros Individuales de Ancap al 31 de diciembre de 2024 (auditados por
    Grant Thornton, según consta en el propio documento) registran un resultado del ejercicio de $
    5.217.605.497 de pérdida. Ancap comunica esa pérdida directamente en dólares -USD 118 millones-
    en su presentación oficial "Resultados Ancap - Ejercicio 2024" del 01/04/2025 (El País la
    redondea a USD 118,4 millones). El tipo de cambio que sostiene esa conversión no está en la
    presentación, que no lo incluye, sino en la nota de moneda extranjera de los propios Estados
    Financieros Individuales de 2024: "Dólar estadounidense 40,231 38,689 44,066 39,022" (promedio y
    cierre, 2024 y 2023 respectivamente), es decir 44,066 al cierre de 2024; a esa tasa, $
    5.217.605.497 equivalen a los USD 118,4 millones que cita El País. Para el ejercicio 2019, el
    resultado del ejercicio individual (atribuible a la matriz) fue de $ 1.464.281.136 de ganancia,
    y el resultado consolidado del grupo con sus subsidiarias (antes de interés minoritario) fue de
    $ 1.513.044.719. Los Estados Financieros Individuales de 2019 publican, en su propia nota de
    moneda extranjera, dos tasas de cambio del dólar para ese ejercicio bajo el encabezado "Dic-19
    Dic-18 Dic-19 Dic-18": "Dólar Estadounidense 35,15 30,67 37,31 32,41" (siguiendo el mismo orden
    promedio-luego-cierre que usa Ancap en la tabla equivalente de 2024: promedio 2019 = 35,15,
    promedio 2018 = 30,67, cierre 2019 = 37,31, cierre 2018 = 32,41). Convertido al cierre (37,31),
    el resultado de 2019 equivale a USD 39,2 millones -la cifra que Presidencia difundió el
    27/02/2020 citando a la entonces presidenta de Ancap, Marta Jara-. Convertido al promedio
    (35,15), equivale a USD 41,7 millones -la cifra que dio Orsi el 25/04/2025, reproducida sin
    verificación adicional por la gacetilla del MIEM-. No son dos comunicados oficiales que se
    contradigan: es el mismo resultado auditado en pesos, convertido con dos convenciones de tipo de
    cambio que la propia Ancap publica en el mismo documento. No existe, en cambio, un documento
    oficial que exprese literalmente "41 millones de dólares" como cifra publicada en sí misma, más
    allá de la palabra de Orsi reproducida sin chequeo por el MIEM. Comparando los dos ejercicios
    bajo una sola convención -la de cierre, que es la que sostiene la cifra de 118 millones que el
    propio Orsi da para 2024-, Ancap pasó de +USD 39,2 millones en 2019 a -USD 118,4 millones en
    2024 (bajo la convención de promedio, el contraste sería +USD 41,7 millones contra -USD 129,7
    millones, ya que $ 5.217.605.497 al tipo de cambio promedio de 2024 de 40,231 equivalen a unos
    USD 129,7 millones). En las dos lecturas el signo y el orden de magnitud de la comparación de
    Orsi se sostienen; la cifra puntual de "41 millones" que dio para 2019 corresponde a la
    convención de promedio, distinta de la convención de cierre que efectivamente respalda su propia
    cifra de 118 millones para 2024. Sobre las causas de la pérdida de 2024: El Observador precisó
    que la refinería de La Teja estuvo sin producir a plena capacidad 297 días entre agosto de 2023
    y junio de 2024, que Ancap resignó unos USD 55 millones por vender combustible por debajo del
    Precio Paridad de Importación (PPI) que calcula Ursea, y que el subsidio focalizado al supergás
    sumó otros USD 24 millones ese año.'
