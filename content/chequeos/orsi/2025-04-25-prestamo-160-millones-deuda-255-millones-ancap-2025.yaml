titulo: 'Deuda de Ancap "de 255 millones": sin balance a esa fecha que lo confirme'
afirmacion: Orsi afirmó que, en noviembre de 2024, el gobierno anterior había autorizado a Ancap a
  endeudarse por hasta 200 millones de dólares, de los cuales la empresa tomó 160 millones, y que
  eso llevaba la deuda total de Ancap a 255 millones de dólares.
