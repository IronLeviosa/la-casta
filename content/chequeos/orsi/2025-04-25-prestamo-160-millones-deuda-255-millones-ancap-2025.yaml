revision:
  tier: publicado
  notas_internas: >-
    Discutible en lugar de verdadero/falso porque no hay documento con corte a la fecha de la
    conferencia (25/04/2025) que sostenga o refute los 255 millones de deuda total; sí hay documento
    oficial (balance auditado) para el resto de la afirmación (composición de la deuda, autorización
    de 200 de los que se tomaron 160, caída del stock durante 2024).

    Presentación (2026-09-07): dato_real.valor condensado a cifra, unidad, período y fuente; el
    gráfico agregado en esta corrida usa los mismos tres montos que ya estaban en dato_real.valor
    (no se agregó ninguna fuente nueva) para mostrar que "255" no coincide con ninguno de los dos
    conceptos oficiales de deuda a fin de 2024, y que además corresponde a una fecha distinta.
