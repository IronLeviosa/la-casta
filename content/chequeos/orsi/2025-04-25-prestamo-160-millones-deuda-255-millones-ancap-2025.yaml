  por 160 millones de dólares, lo que hace que la deuda total de Ancap hoy sea de 255 millones
dato_real:
  valor: >-
    Las deudas financieras de Ancap sumaban USD 232 millones al 31/12/2024 (menos que en 2023); el
    pasivo total del balance a esa fecha era mayor, USD 696 millones. El MEF autorizó en noviembre
    de 2024 un endeudamiento de hasta USD 200 millones, de los que Ancap tomó 160.

    Orsi dio, para la fecha de la conferencia (25/04/2025), una deuda total de USD 255 millones,
    cifra reproducida sin verificación adicional por la gacetilla del MIEM.
