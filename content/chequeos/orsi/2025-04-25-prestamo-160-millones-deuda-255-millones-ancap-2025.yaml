calificacion: discutible
analisis: Orsi dijo que un préstamo de 160 millones de dólares autorizado en noviembre de 2024
  llevaba la deuda total de Ancap a 255 millones; los estados financieros auditados muestran que la
  autorización fue en realidad por hasta 200 millones (de los que Ancap tomó 160, según El
  Observador) y que la cifra de "deuda total" corresponde a las deudas financieras de la empresa
  (unos 232 millones de dólares a fines de 2024, un stock menor al de fines de 2023), no al pasivo
  total del balance (unos 696 millones de dólares). No hay, entre las fuentes relevadas, un estado
  financiero o informe posterior al cierre de 2024 que permita verificar de forma independiente los
  255 millones que Orsi da para la fecha de la conferencia (25/04/2025); el único respaldo de esa
  cifra puntual es la propia declaración de Orsi, reproducida sin verificación adicional por la
  gacetilla oficial del MIEM. Sobre la "novedad" que Orsi atribuye al préstamo, El Observador
  documentó que la operación fue pública en su momento y que Ancap había recurrido a préstamos
  similares en tres oportunidades recientes, incluida una autorización de hasta 300 millones de
  dólares en agosto de 2023 para el mismo fin.
revision:
  tier: publicado
  notas_internas: Discutible en lugar de verdadero/falso porque no hay documento con corte a la fecha
    de la conferencia (25/04/2025) que sostenga o refute los 255 millones de deuda total; sí hay
    documento oficial (balance auditado) para el resto de la afirmación (composición de la deuda,
    autorización de 200 de los que se tomaron 160, caída del stock durante 2024).
