titulo: ANTEL facturó US$500 millones y ganó US$100 millones en 1995
afirmacion: En 1995 ANTEL facturó más de US$ 500 millones y obtuvo una ganancia superior a los US$
  100 millones, según cifras dadas por su entonces vicepresidente, Tabaré Viera.
fragmento: en 1995 la empresa facturó más de US$ 500:000.000 y obtuvo una ganancia superior a los
  US$ 100:000.000
calificacion: discutible
dato_real:
  valor: >-
    No se encontró un balance, memoria anual o resumen financiero oficial de ANTEL para 1995: no hay
    documentación pública de resultados anteriores a 1997, pese a haberse buscado en el sitio de
    ANTEL, Wayback Machine, Yumpu, el Tribunal de Cuentas y el Parlamento.


    La misma cifra fue repetida por Barandiarán dos meses después, en la sesión del 03/02/1997, esa
    vez atribuida a "los datos que nos entregara la propia empresa" y no a su vicepresidente (ver el
    chequeo de esa declaración). Ninguna de las dos atribuciones es un documento contable
    independiente.
