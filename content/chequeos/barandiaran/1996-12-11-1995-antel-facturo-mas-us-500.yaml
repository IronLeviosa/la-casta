analisis: >-
  Citó cifras de facturación (más de US$500.000.000) y ganancia (más de US$100.000.000) de ANTEL en
  1995, atribuidas a su entonces vicepresidente, Tabaré Viera. No existe un balance público de ANTEL
  para 1995: la documentación de esta empresa en el sitio empieza en 1997 por falta de registros
  anteriores en ningún archivo consultado.


  Que la misma cifra la haya repetido el propio Barandiarán meses después, atribuyéndola esa vez a
  la empresa en general, corrobora que era el número que circulaba puertas adentro de ANTEL, sin que
  eso sea un balance auditado.
