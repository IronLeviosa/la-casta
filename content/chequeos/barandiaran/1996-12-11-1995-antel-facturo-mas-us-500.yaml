analisis: >-
  Citó cifras de facturación y ganancia de ANTEL en 1995 (US$500 y US$100 millones), atribuidas a su
  vicepresidente. No existe un balance público para ese año.


  La documentación de esta empresa en el sitio empieza en 1997 por falta de registros anteriores en
  ningún archivo consultado. Que la misma cifra la haya repetido el propio Barandiarán meses
  después, atribuyéndola esa vez a la empresa en general, corrobora que era el número que circulaba
  puertas adentro de ANTEL, sin que eso sea un balance auditado.
