fecha: 1997-11-25
titulo: Déficit conjunto de las Cajas Militar y Policial en US$250 millones anuales
afirmacion: El déficit conjunto de las Cajas Militar y Policial alcanzaba, hacia noviembre de 1997,
  a US$ 250 millones anuales.
fragmento: cuyo déficit conjunto estimó en US$250.000.000 anuales
calificacion: discutible
dato_real:
  valor: >-
    No se encontró un informe oficial (Banco de Previsión Social, Ministerio de Economía y Finanzas
    u Oficina de Planeamiento y Presupuesto) con el déficit conjunto de las Cajas Militar y Policial
    para 1997.


    Búsquedas generales ubicaron cifras oficiales de años muy posteriores (un déficit de la Caja
    Militar de US$450-580 millones hacia 2021-2022), ya no comparables por la distancia temporal y
    porque corresponden solo a esa caja.


    Se buscó también la Ley N.º 16.878 (Rendición de Cuentas, ejercicio 1996) en IMPO: la página que
    sirve esa ley no trae el articulado (solo una ficha de 792 caracteres), así que no se pudo
    confirmar ni descartar el dato por esa vía.
  fuentes:
