titulo: El déficit conjunto de las Cajas Militar y Policial llegaba a US$250 millones anuales, dijo en 1997
afirmacion: El déficit conjunto de las Cajas Militar y Policial alcanzaba, hacia noviembre de 1997,
  a US$ 250 millones anuales.
fragmento: cuyo déficit conjunto estimó en US$250.000.000 anuales
calificacion: discutible
dato_real:
  valor: >-
    No se encontró un informe oficial del Banco de Previsión Social, el Ministerio de Economía y
    Finanzas o la Oficina de Planeamiento y Presupuesto con el déficit conjunto de las Cajas Militar
    y Policial para 1997. Búsquedas generales ubicaron cifras oficiales de años muy posteriores (un
    déficit de la Caja Militar de US$450-580 millones hacia 2021-2022), ya no comparables por la
    distancia temporal y porque corresponden solo a esa caja.


    Se buscó también la Ley N.º 16.878 (Rendición de Cuentas, ejercicio 1996) en IMPO: la página que
    sirve esa ley no trae el articulado (solo una ficha de 792 caracteres), así que no se pudo
    confirmar ni descartar el dato por esa vía.
  fuentes:
    - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1997-11-25%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0085).pdf
      medio: parlamento
      fecha: 1997-11-25
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Cámara de Representantes, 1997-11-25, N.º 85
      cita: excluir o posponer las posibles reformas de las Cajas Militar y Policial es absolutamente
        injustificable, mucho más aún cuando la iniciativa del Poder Ejecutivo sigue estando en el
        Senado, por lo que creemos que continúa contando con su bendición.
      retrieved_at: 2026-09-09
analisis: >-
  Dijo que el déficit conjunto de las Cajas Militar y Policial alcanzaba, hacia noviembre de 1997, a
  US$250.000.000 anuales. No se encontró un informe oficial de ese año con esa cifra; los datos
  oficiales disponibles son de dos décadas después y no son comparables.


  El mismo documento que falta para el costo de la Caja Militar por separado -la Rendición de
  Cuentas de 1996 o 1997 con detalle por organismo- es el que podría confirmar o descartar esta
  cifra conjunta.
