      cita: excluir o posponer las posibles reformas de las Cajas Militar y Policial es absolutamente
        injustificable, mucho más aún cuando la iniciativa del Poder Ejecutivo sigue estando en el
        Senado, por lo que creemos que continúa contando con su bendición.
      retrieved_at: 2026-09-09
analisis: >-
  Dijo que el déficit conjunto de las Cajas Militar y Policial alcanzaba US$250.000.000 anuales en
  1997. No se encontró un informe oficial de ese año con esa cifra.


  Los datos oficiales disponibles son de dos décadas después y no son comparables. El mismo
  documento que falta para el costo de la Caja Militar por separado -la Rendición de Cuentas de 1996
  o 1997 con detalle por organismo- es el que podría confirmar o descartar esta cifra conjunta.
