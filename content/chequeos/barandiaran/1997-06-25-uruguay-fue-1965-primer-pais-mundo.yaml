        Escuela Pública N.º 156"
      cita: Declárase el 24 de abril próximo "Día de recordación de los mártires armenios", en homenaje a
        los integrantes de esa nacionalidad asesinados en 1915.
      retrieved_at: 2026-09-09
analisis: >-
  Dijo que Uruguay fue, en 1965, el primer país del mundo en reconocer oficialmente el genocidio
  armenio. La ley que efectivamente se aprobó ese año crea un día de recordación y no contiene esa
  frase ni compara a Uruguay con otros países.


  Que la ley no lo diga no prueba que el dato sea falso: la afirmación de que Uruguay fue pionero
  circula en fuentes secundarias y podría surgir de otro documento que esta corrida no relevó. Sin
  ese cotejo, la afirmación queda sin poder confirmarse ni descartarse.
