titulo: 'Uruguay, "primer país del mundo" en reconocer el genocidio armenio: la ley de 1965 no lo dice'
afirmacion: Uruguay fue, en 1965, el primer país del mundo en reconocer oficialmente el genocidio armenio.
fragmento: En 1965, fue el primer país en el mundo que reconoció oficialmente el genocidio armenio
calificacion: discutible
dato_real:
  valor: >-
    La Ley N.º 13.326, promulgada el 22/04/1965, declaró el 24 de abril "Día de recordación de los
    mártires armenios" en homenaje a los armenios asesinados en 1915, autorizó a los descendientes
    de armenios en la función pública a faltar ese día y pidió a las emisoras oficiales dedicarle
    parte de su programación.


    El texto de la ley no dice en ningún pasaje que Uruguay haya sido "el primer país del mundo" en
    reconocer el genocidio armenio; esa caracterización circula en la prensa uruguaya y en
    organizaciones de la comunidad armenia, pero no se cotejó en esta corrida contra un registro
    internacional comparativo de reconocimientos de genocidio.
