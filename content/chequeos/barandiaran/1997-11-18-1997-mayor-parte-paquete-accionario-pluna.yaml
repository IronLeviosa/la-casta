analisis: >-
  Dijo que la mayor parte del paquete accionario de PLUNA estaba en poder de una aerolínea
  brasileña. El pliego oficial de la licitación de PLUNA confirma que el 51% del capital iba al
  adjudicatario privado, pero no nombra a VARIG: esa identificación viene de una nota de opinión, no
  de un documento oficial.


  La estructura de propiedad mayoritaria privada está confirmada; falta la resolución de
  adjudicación que identifique a VARIG (o a otra empresa) como la ganadora de esa licitación.
