tema: empresas-publicas
fecha: 1997-11-18
titulo: "Mayoría accionaria de PLUNA en manos de una aerolínea brasileña: la estructura es oficial,
  la identidad no"
afirmacion: En 1997, la mayor parte del paquete accionario de PLUNA estaba en poder de una compañía
  de aviación brasileña (VARIG).
fragmento: su mayor participación accionaría está en poder de una compaf'lía de aviación brasilelia
calificacion: discutible
dato_real:
  valor: >-
    El Pliego de Condiciones de la licitación de PLUNA (Resolución N.º 373/993, IMPO), con el
    Estatuto de la nueva sociedad como Anexo I, fija que el capital se dividiría en Acciones Serie A
    (49%, en poder de PLUNA) y Serie B (51%, en poder del "Adjudicatario" de la licitación): la
    estructura que hace mayoritario al socio privado está en un documento oficial.


    Ese pliego no nombra a VARIG como adjudicatario, y no se relevó la resolución de adjudicación
    propiamente dicha (posterior a la 373/993). La identificación de VARIG como ganador de la
    licitación de 1995 sigue apoyada solo en una nota de opinión de La República (28/08/2000), que
    además la caracteriza como una operación irregular; esa imputación es del medio, no un hecho
    documentado en esta corrida.
