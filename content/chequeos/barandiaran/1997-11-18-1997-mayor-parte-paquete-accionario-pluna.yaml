analisis: >-
  Dijo que en 1997 la mayor parte del paquete accionario de PLUNA estaba en poder de una aerolínea
  brasileña. La Resolución del Poder Ejecutivo N.º 629/995 confirma la estructura —51% del capital
  para el adjudicatario privado— y nombra a VARIG como operador del Pluriconsorcio de
  Aeronavegación, el único oferente y adjudicatario de esa licitación.


  La resolución identifica a VARIG como operador del consorcio adjudicatario, no como titular
  directo de las acciones a su nombre; esa distinción no cambia el sentido de lo dicho: la aerolínea
  brasileña, a través del consorcio que operaba, controlaba la porción mayoritaria del capital de
  PLUNA.


  La nota de opinión de La República, que antes era la única fuente de la identificación de VARIG y
  que además calificaba la operación de irregular, deja de ser necesaria para sostener el dato de la
  propiedad; la imputación de irregularidad sigue siendo del medio, no un hecho documentado en esta
  corrida.
