titulo: "Mayoría accionaria de PLUNA en manos de VARIG: confirmado por la resolución de adjudicación"
afirmacion: En 1997, la mayor parte del paquete accionario de PLUNA estaba en poder de una compañía
  de aviación brasileña (VARIG).
fragmento: su mayor participación accionaría está en poder de una compaf'lía de aviación brasilelia
calificacion: verdadero
dato_real:
  valor: >-
    El Pliego de Condiciones de la licitación de PLUNA (Resolución N.º 373/993, IMPO), con el
    Estatuto de la nueva sociedad como Anexo I, fija que el capital se dividiría en Acciones Serie A
    (49%, en poder de PLUNA) y Serie B (51%, en poder del "Adjudicatario" de la licitación): la
    estructura que hace mayoritario al socio privado está en un documento oficial.


    La Resolución del Poder Ejecutivo N.º 629/995 (31/05/1995), que autorizó a PLUNA a firmar el
    contrato de adjudicación, identifica al Pluriconsorcio de Aeronavegación —único oferente de la
    Licitación Pública Internacional N.º 1/93 y adjudicatario de esas acciones Serie B desde el 21
    de junio de 1994— como una entidad cuyo operador es VARIG.


    La identificación de VARIG deja de depender solo de una nota de opinión de La República
    (28/08/2000, que además calificaba la operación de "irregular", una imputación del medio que no
    está en el documento oficial) y queda respaldada por la resolución de adjudicación.
