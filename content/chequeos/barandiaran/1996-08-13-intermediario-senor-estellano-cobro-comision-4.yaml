analisis: >-
  Dijo que un intermediario cobró una comisión del 4% (unos US$5.000.000) en el crédito con FOCOEX,
  y planteó, sin tener certeza, la duda de si había evadido impuestos por esa suma. No se encontró
  un contrato ni un informe oficial que confirme el monto de la comisión.


  El mismo documento que falta para el chequeo del crédito completo -el expediente de la Comisión
  Investigadora Parlamentaria- es el que podría confirmar o descartar esta cifra.
