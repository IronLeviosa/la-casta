analisis: >-
  Dijo que un intermediario, el señor Estellano, cobró una comisión del 4% (unos US$5.000.000) en el
  crédito con FOCOEX. El Informe en Minoría de la Comisión Investigadora —el mismo documento del
  chequeo del crédito— dice que la Comisión no pudo acceder al contrato de Estellano ni a la
  documentación de comisiones pagadas: el propio expediente no confirma la cifra.


  El informe sí recoge que, según lo declarado por los jerarcas de FOCOEX, las comisiones no habrían
  podido superar el 5%, un techo distinto del 4% que mencionó Barandiarán. Ninguna de las dos cifras
  está documentada con precisión.


  Queda discutible con documento oficial en mano: no hay contradicción entre el 4% dicho y el techo
  del 5% declarado por FOCOEX —son compatibles entre sí—, pero tampoco hay una fuente que fije el
  monto exacto de la comisión de Estellano.
