calificacion: discutible
dato_real:
  valor: >-
    El Informe en Minoría de la Comisión Investigadora Parlamentaria sobre FOCOEX —el mismo
    documento ya citado para el chequeo del crédito de US$137.000.000— dice que la Comisión no pudo
    acceder al contrato de Estellano con FOCOEX ni a la documentación de comisiones pagadas ni de
    órdenes de pago emitidas: no confirma ni descarta el 4% (US$5.000.000) que mencionó Barandiarán.


    El mismo informe agrega que, según lo declarado por los propios jerarcas de FOCOEX ante la
    Comisión, las comisiones no habrían podido superar el 5% en las operaciones con financiación
    concesional: un techo distinto (más alto) que el 4% que Barandiarán citó en Sala, y tampoco una
    cifra puntual verificada.
