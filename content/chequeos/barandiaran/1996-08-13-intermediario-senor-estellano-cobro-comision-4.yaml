  notas_internas: El resolvedor atribuyó el techo del 5% al "testimonio del contador Testoni";
    verificado con pnpm fuente, ese pasaje del informe lo atribuye a "lo declarado por los jerarcas
    de FOCOEX", no a Testoni (que es un Diputado nombrado en otra parte del mismo documento, autor
    de la denuncia original ante la Comisión Preinvestigadora). Se corrige la atribución acá.
