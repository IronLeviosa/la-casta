titulo: "Comisión del 4% a Estellano en FOCOEX: no verificada"
afirmacion: Un intermediario, el señor Estellano, cobró una comisión del 4% del crédito con FOCOEX,
  unos US$5.000.000.
fragmento: cobra el 4% de comisión, es decir, US$ 5:000.000
calificacion: discutible
dato_real:
  valor: >-
    El Informe en Minoría sobre FOCOEX dice que la Comisión no accedió al contrato de Estellano ni a
    la documentación de comisiones: no confirma el 4% (US$5.000.000).


    Es el mismo documento ya citado para el chequeo del crédito de US$137.000.000. Agrega que, según
    lo declarado por los propios jerarcas de FOCOEX ante la Comisión, las comisiones no habrían
    podido superar el 5% en las operaciones con financiación concesional: un techo distinto (más
    alto) que el 4% que Barandiarán citó en Sala, y tampoco una cifra puntual verificada.
