titulo: Gasto en seguridad social cerca del 16% del PBI en 1994
afirmacion: El documento del Nuevo Espacio que Barandiarán leyó en Sala decía que los gastos de la
  Seguridad Social se acercaban al 16% del PBI en 1994.
fragmento: Los gastos de la Seguridad Social han venido en aumento sostenido, acercándose al 16% del
  PBI en 1994
calificacion: discutible
dato_real:
  valor: >-
    La cifra proviene del documento del Nuevo Espacio "Aportes para la reforma de la seguridad
    social" (20/03/1995), que Barandiarán leyó en Sala.


    No es una afirmación suya de primera mano. No se localizó una serie oficial del BPS, el BCU o el
    MEF sobre el gasto en seguridad social como porcentaje del PBI para 1994 que permita confirmar o
    descartar el 16%.
