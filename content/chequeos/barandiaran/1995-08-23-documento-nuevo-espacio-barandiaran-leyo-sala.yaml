analisis: >-
  El documento del Nuevo Espacio que leyó en Sala decía que el gasto en seguridad social se acercaba
  al 16% del PBI en 1994.


  No se encontró una serie oficial de esos años que confirme o desmienta ese porcentaje. La cifra no
  es una afirmación espontánea de Barandiarán sino la cita de un texto partidario; de cualquier
  modo, sin un documento del BPS, el BCU o el MEF para ese ejercicio, la calificación queda en
  discutible.
