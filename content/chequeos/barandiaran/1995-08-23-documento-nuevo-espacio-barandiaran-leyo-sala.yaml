dato_real:
  valor: >-
    La cifra proviene del documento del Nuevo Espacio "Aportes para la reforma de la seguridad
    social" (20/03/1995), que Barandiarán leyó en Sala; no es una afirmación suya de primera mano.


    No se localizó una serie oficial del BPS, el BCU o el MEF sobre el gasto en seguridad social
    como porcentaje del PBI para 1994 que permita confirmar o descartar el 16%.
