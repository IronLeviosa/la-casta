analisis: >-
  Recogió, sin verificarlo, la cifra de US$20 millones citada por un diputado preopinante.


  No se encontró el documento del Poder Ejecutivo o del BPS que fije esa cifra ni la de 110.000
  beneficiarios. La afirmación chequeable es la del diputado preopinante, transmitida por
  Barandiarán; sin el documento del Poder Ejecutivo, queda discutible.
