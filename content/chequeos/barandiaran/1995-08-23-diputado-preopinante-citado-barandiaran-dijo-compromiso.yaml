titulo: US$20 millones para la reforma jubilatoria
afirmacion: Un diputado preopinante, citado por Barandiarán, dijo que el compromiso del Poder
  Ejecutivo implicaba un cargo a Rentas Generales de unos US$20.000.000 para llegar a un nivel de
  unos 110.000 beneficiarios.
fragmento: un cargo a Rentas Generales de unos US$ 20:000.000, logrando llegar a un nivel de unos
  ciento diez mil beneficiarios
calificacion: discutible
dato_real:
  valor: >-
    No se localizó un documento oficial que la confirme.


    El cargo a Rentas Generales de US$20.000.000 y los 110.000 beneficiarios corresponden a la etapa
    de implementación de la Ley 16.713 que menciona. La cifra la introdujo, según la propia cita,
    "el señor Diputado preopinante", no Barandiarán; él la recoge y dice que el Nuevo Espacio espera
    la iniciativa del Poder Ejecutivo.
