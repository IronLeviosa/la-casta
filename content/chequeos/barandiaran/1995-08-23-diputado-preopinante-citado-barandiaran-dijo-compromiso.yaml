  ciento diez mil beneficiarios
calificacion: discutible
dato_real:
  valor: >-
    No se localizó el documento del Poder Ejecutivo o del BPS que fije un cargo a Rentas Generales
    de US$20.000.000 ni la cifra de 110.000 beneficiarios para la etapa de implementación de la Ley
    16.713 que menciona.


    La cifra la introdujo, según la propia cita, "el señor Diputado preopinante", no Barandiarán; él
    la recoge y dice que el Nuevo Espacio espera la iniciativa del Poder Ejecutivo.
