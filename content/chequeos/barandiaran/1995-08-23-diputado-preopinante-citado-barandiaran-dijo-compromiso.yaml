analisis: >-
  Recogió lo señalado por un diputado preopinante sobre un compromiso del Poder Ejecutivo de
  destinar unos US$20.000.000 de Rentas Generales para llegar a 110.000 beneficiarios. No se
  encontró el documento del Poder Ejecutivo o del BPS que fije esas cifras.


  La afirmación chequeable es la del diputado preopinante, transmitida por Barandiarán; sin el
  documento del Poder Ejecutivo, queda discutible.
