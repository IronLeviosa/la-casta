tema: educacion
fecha: 1998-09-01
titulo: "Precios de la educación privada por encima de la canasta, según el INE: la planilla no se
  pudo descargar"
afirmacion: Según el Instituto Nacional de Estadística, los precios de la educación privada habían
  experimentado, hacia septiembre de 1998, un incremento mayor que el del resto de los bienes de la
  canasta familiar.
fragmento: los precios de la educación privada han experimentando un incremento mayor que el del
  resto de los bienes de la canasta familiar
calificacion: discutible
dato_real:
  valor: >-
    No se encontró la serie del Índice de Precios al Consumo del INE desagregada por rubro
    "Enseñanza" para comparar contra el índice general en el período previo a setiembre de 1998.


    Se ubicó el archivo correspondiente: "Series históricas IPC Base Marzo 1997=100", planilla "IPC
    2 gral rub M.xls" (por rubro mayor, mensual, 12/1985-12/2010), en el sitio del INE. No se pudo
    descargar ni directamente ni por Wayback Machine en esta sesión de trabajo por una falla de
    conexión.
