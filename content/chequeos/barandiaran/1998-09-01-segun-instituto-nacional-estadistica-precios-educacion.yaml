      cita: A través del Instituto Nacional de Estadística hemos observado que los precios de la educación
        privada han experimentando un incremento mayor que el del resto de los bienes de la canasta
        familiar.
      retrieved_at: 2026-09-09
analisis: >-
  Dijo, atribuyéndolo al Instituto Nacional de Estadística, que los precios de la educación privada
  habían subido más que el resto de la canasta familiar hacia setiembre de 1998. Se identificó la
  planilla exacta del INE con esa serie, pero no se pudo descargar en esta corrida por una falla
  técnica.


  Es una afirmación que el propio orador atribuye al INE, y la planilla que la confirmaría o la
  descartaría es pública y ya está localizada: falta bajarla y comparar el rubro Enseñanza contra el
  índice general para 1997-1998.
