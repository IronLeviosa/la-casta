tema: educacion
fecha: 1998-09-01
titulo: Precios de la educación privada por encima de la canasta, según el INE
afirmacion: Según el Instituto Nacional de Estadística, los precios de la educación privada habían
  experimentado, hacia septiembre de 1998, un incremento mayor que el del resto de los bienes de la
  canasta familiar.
fragmento: los precios de la educación privada han experimentando un incremento mayor que el del
  resto de los bienes de la canasta familiar
calificacion: verdadero
dato_real:
  valor: >-
    El INE registra, para Enseñanza, una suba de 15,45 % entre setiembre de 1997 y setiembre de
    1998, contra 9,98 % del índice general.


    El Índice de Precios del Consumo por Grandes Rubros del INE (Base Marzo 1997=100, serie "IPC 2
    gral rub M.xls") va de 107,68 a 124,31 en Enseñanza y de 107,17 a 117,87 en el índice general,
    en ese mismo período.


    El rubro Enseñanza subió más que el índice general en ese año, que es lo que Barandiarán
    atribuyó al INE.
