analisis: >-
  Dijo que en Uruguay se detectaban 600 casos de cáncer cervicouterino por año y morían 100
  personas. No se encontró un informe de 1998 del Registro Nacional de Cáncer que confirme esas
  cifras.


  Un estudio posterior, de un período distinto, da números del mismo orden (unos 327 casos y 134
  muertes anuales, con otra metodología y otro año), lo que sugiere que la escala del problema que
  describía era real, sin que eso confirme las cifras puntuales de 1998.
