titulo: "600 casos de cáncer cervicouterino y 100 muertes al año en Uruguay: sin dato oficial de 1998"
afirmacion: En Uruguay se detectaban 600 casos de cáncer cervicouterino por año y morían 100 personas.
fragmento: Se detectan actualmente seiscientos casos por año, y cien personas fallecen
calificacion: discutible
dato_real:
  valor: >-
    No se localizó un informe del Registro Nacional de Cáncer o de la Comisión Honoraria de Lucha
    Contra el Cáncer de 1998 que confirme esos 600 casos y 100 muertes anuales.


    Un artículo posterior de la Revista Médica del Uruguay (Nozar y Briozzo, sin fecha de
    publicación identificada) cita, para un período más reciente, un promedio de unos 327 casos
    nuevos por año y una tasa de mortalidad de 5,47 cada 100.000 (unas 134 muertes anuales): son
    cifras del mismo orden de magnitud pero de un período distinto al de 1998, y no permiten
    confirmar ni descartar el dato de esa fecha.
