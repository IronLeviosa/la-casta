analisis: >-
  Dijo que los fondos que administraban las AFAP eran, en 1998, de aproximadamente US$300 millones.
  No se encontró la serie histórica del Fondo de Ahorro Previsional del Banco Central para esa
  fecha.


  El BCU publica esa estadística de forma periódica desde 1996, pero la serie que se pudo ubicar no
  llega hasta noviembre de 1998; falta el número exacto de ese mes.
