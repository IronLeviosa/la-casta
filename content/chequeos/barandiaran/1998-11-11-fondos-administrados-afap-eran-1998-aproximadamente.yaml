dato_real:
  valor: No se relevó una memoria o estadística del Banco Central del Uruguay de 1998 sobre el total
    de fondos administrados por las AFAP en ese momento. Se buscó la Memoria Trimestral del Régimen
    de Jubilación por Ahorro Individual del BCU y de la Superintendencia de Servicios Financieros
    para noviembre de 1998, sin ubicar el dato de esa fecha exacta; las series disponibles
    públicamente arrancan más adelante.
