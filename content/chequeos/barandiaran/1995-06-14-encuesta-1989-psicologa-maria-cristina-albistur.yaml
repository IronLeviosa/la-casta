analisis: >-
  Atribuyó a una encuesta de 1989 de la psicóloga María Cristina de Albistur el dato de que el 64%
  de los jóvenes de 12 a 18 años consumía alcohol. No se encontró esa encuesta ni una publicación de
  la autora con esos números.


  Al tratarse de un estudio privado y no de una estadística de un organismo público, es poco
  probable que exista un documento oficial que lo confirme o lo desmienta; la cita de Barandiarán en
  el diario de sesiones es, hasta donde se buscó, el único registro disponible.
