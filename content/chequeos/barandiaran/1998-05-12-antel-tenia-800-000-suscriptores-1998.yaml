titulo: "ANTEL tenía 800.000 suscriptores en 1998: el resumen oficial de la empresa no trae ese dato"
afirmacion: ANTEL tenía 800.000 suscriptores en 1998, y una consulta al Clearing de Informes por
  cada uno, a US$1,5 cada una, significaría transferirle US$1.200.000.
fragmento: ANTEL tiene 800.000 suscriptores; una sola consulta a la base de datos por cada usuario,
  a US$ 1,5 cada una -que es lo que cobra- significaría una transfe- rencia de US$ 1 :200.000
calificacion: discutible
dato_real:
  valor: >-
    Se revisó la ficha de ANTEL en este sitio (balances desde 1997) y el resumen oficial "Datos
    Financieros y Operativos Relevantes" de ANTEL (1997-2000) que esa ficha ya cita: la tabla trae
    datos financieros y un ratio de "empleados por cada 1.000 terminales en servicio", pero no la
    cantidad absoluta de suscriptores o líneas.


    No se localizó una memoria anual de ANTEL de 1998 con el número de suscriptores para confirmar o
    descartar el dato.
