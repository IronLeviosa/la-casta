analisis: >-
  Dijo que el Parlamento votó, en el Presupuesto Nacional 1995-1999, US$60.000.000 para
  reacondicionar el Aeropuerto de Carrasco. El articulado de la Ley 16.736 no nombra la obra ni ese
  monto: los fija por Rubro y Programa, no por proyecto.


  El monto por obra probablemente está en una planilla anexa del Plan de Inversiones que IMPO no
  publica junto al texto de la ley; esa planilla, o un informe posterior de la Dirección de
  Infraestructura Aeronáutica, es el documento que falta para confirmar o descartar la cifra.
