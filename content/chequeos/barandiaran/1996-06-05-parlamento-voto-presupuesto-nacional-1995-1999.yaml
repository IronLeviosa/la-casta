tema: empresas-publicas
fecha: 1996-06-05
titulo: "US$60.000.000 para el Aeropuerto de Carrasco en el Presupuesto 1995-1999: no está en el
  articulado"
afirmacion: El Parlamento votó, en el Presupuesto Nacional 1995-1999, la suma de US$60.000.000 para
  reacondicionar el Aeropuerto de Carrasco.
fragmento: ha llevado a este Parla- mento a votar en el Presupuesto Nacional la suma de US$
  60:000.000 a fin de reacon- dicionarlo
calificacion: discutible
dato_real:
  valor: >-
    El articulado completo de la Ley N.º 16.736 (Presupuesto Nacional 1995-1999) no nombra al
    Aeropuerto de Carrasco ni fija una partida de US$60.000.000: los montos del Plan de Inversiones
    se fijan por Rubro y Programa, no por obra, y la planilla anexa que los desagrega por proyecto
    no está publicada en el texto que sirve IMPO.


    No se localizó esa planilla ni un informe posterior de la Dirección General de Infraestructura
    Aeronáutica que confirme el monto exacto asignado a Carrasco.
