      retrieved_at: 2026-09-09
analisis: >-
  Dijo que, según datos entregados por la propia empresa, ANTEL facturó en 1995 alrededor de
  US$500.000.000 con una ganancia de US$100.000.000. No existe un balance público de ANTEL para ese
  ejercicio: la serie de esta empresa en el sitio empieza en 1997 porque no se encontró
  documentación anterior en ningún archivo consultado.


  Que la misma cifra la haya dado también el entonces vicepresidente de ANTEL en otra sesión
  corrobora que era el número que manejaba la empresa puertas adentro, pero no la convierte en un
  dato auditado.
