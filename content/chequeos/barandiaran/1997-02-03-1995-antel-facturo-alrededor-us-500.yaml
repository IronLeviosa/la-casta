tema: empresas-publicas
fecha: 1997-02-03
titulo: "ANTEL facturó US$500 millones y ganó US$100 millones en 1995, según la propia empresa: sin
  balance público"
afirmacion: En 1995, ANTEL facturó alrededor de US$500.000.000, con una ganancia de US$100.000.000
  obtenida gracias a su condición de monopolio.
fragmento: en el ano 1995 ANTEL facturó alrededor de US$ 500:000.000 con una ganancia de US$ 100:000.000
calificacion: discutible
dato_real:
  valor: >-
    No se localizó un balance de ANTEL de 1995 ni un informe de la Oficina de Planeamiento y
    Presupuesto o del Tribunal de Cuentas de ese ejercicio. La ficha de empresas públicas de este
    sitio (content/empresas/antel.yaml) documenta que no hay resultados públicos de ANTEL anteriores
    a 1997, tras buscar en el sitio de ANTEL, Wayback Machine, Yumpu, el Tribunal de Cuentas y el
    Parlamento.


    La misma cifra (más de US$500.000.000 facturados, más de US$100.000.000 de ganancia) la dio
    también el entonces Vicepresidente de ANTEL, Tabaré Viera, en la sesión del 11/12/1996 (ver el
    chequeo sobre esa declaración), lo que corrobora que el número circulaba dentro de la empresa,
    sin que eso equivalga a un documento contable independiente.
