dato_real:
  valor: >-
    El Banco Central del Uruguay publicó, en la Revista de Economía usada como parte del prospecto
    para la colocación de Bonos Globales (1997), el cuadro oficial de Balanza de Pagos con
    exportaciones de bienes: US$1.645,3 millones (1993), US$1.913,4 millones (1994), US$2.147,6
    millones (1995) y US$2.439,6 millones (1996, cifra preliminar).


    Esas cifras dan variaciones interanuales de +16,3 % (1994), +12,2 % (1995) y +13,6 % (1996): los
    tres años inmediatamente anteriores al discurso de diciembre de 1997. Barandiarán dijo 16 %, 10
    % y 13 %: el primer y el tercer número difieren en menos de un punto porcentual; el segundo, en
    2,2 puntos.
