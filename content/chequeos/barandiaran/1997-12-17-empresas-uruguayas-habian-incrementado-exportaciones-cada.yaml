analisis: >-
  Cifras cercanas a la serie del BCU.


  Los tres años muestran, según la serie oficial, crecimiento de dos dígitos y ningún año de caída,
  que es el sentido general de lo que dijo; la imprecisión está concentrada en la magnitud del año
  del medio, no en la dirección del fenómeno.


  Esta serie reemplaza a la que había usado la corrida anterior (Comtrade/Banco Mundial, WITS), una
  serie "espejo" con otra metodología que no se pudo cotejar contra el documento del Banco Central
  por no haber podido descargarlo en ese momento.
