analisis: >-
  Dijo que en Uruguay se producían entre 80 y 100 nacimientos múltiples por año. No se encontró una
  estadística oficial del INE o del MSP para ese dato en el período.


  El INE publica nacimientos por tipo de parto en su Anuario Estadístico; falta ubicar la edición
  correspondiente a fines de los años noventa para confirmar o descartar el rango que citó.
