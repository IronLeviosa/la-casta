tema: empresas-publicas
fecha: 1996-05-08
titulo: "ANCAP y el mercado de alcoholes: 2,5% o 24%, dos medidas del mismo dato, no una corrección
  de error"
afirmacion: La incidencia de ANCAP en el mercado de bebidas alcohólicas era, según la cifra
  corregida, del 24% del total de alcohol destinado al consumo humano (frente al 2,5% que había
  dicho un día antes).
fragmento: estableciéndose que el porcentaje es el 24% del total de alcohol destinado al consumo humano
calificacion: verdadero
dato_real:
  valor: >-
    El diario de sesiones del día anterior (07/05/1996) registra el origen de las dos cifras, en el
    mismo debate sobre la desmonopolización de alcoholes: la participación de ANCAP es del 2,5% si
    se mide como proporción del volumen total de bebidas destiladas, pero del 24% si se mide en
    "alcohol absoluto" (el contenido de alcohol puro), base que otro legislador pidió usar por ser
    más rigurosa para medir el daño a la salud.


    No es una cifra corregida por error: son dos bases de cálculo distintas sobre el mismo mercado,
    y las dos están documentadas en la Cámara.
