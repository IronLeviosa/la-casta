tema: empresas-publicas
fecha: 1996-05-08
titulo: "ANCAP en alcoholes: 2,5% o 24% según la base"
afirmacion: La incidencia de ANCAP en el mercado de bebidas alcohólicas era, según la cifra
  corregida, del 24% del total de alcohol destinado al consumo humano (frente al 2,5% que había
  dicho un día antes).
fragmento: estableciéndose que el porcentaje es el 24% del total de alcohol destinado al consumo humano
calificacion: verdadero
dato_real:
  valor: >-
    El diario del 07/05/1996 documenta ambas cifras: 2,5% del volumen total, o 24% en "alcohol
    absoluto".


    Un legislador pidió usar la base de alcohol absoluto por ser más rigurosa para medir el daño a
    la salud. No es una cifra corregida por error: son dos bases de cálculo distintas sobre el mismo
    mercado, y las dos están documentadas en la Cámara.
  fuentes:
    - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-05-08%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0010).pdf
      medio: parlamento
      fecha: 1996-05-08
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Cámara de Representantes, 1996-05-08, N.º 10
      cita: Creo que en el día de ayer se corrigió esa versión, estableciéndose que el porcentaje es el
        24% del total de alcohol destinado al consumo humano.
      retrieved_at: 2026-09-09
    - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-05-07%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0009).pdf
      medio: parlamento
      fecha: 1996-05-07
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Cámara de Representantes, 1996-05-07, N.º 9
      cita: y que se mida el porcentaje de participación de ANCAP en el mercado de alcoholes tomando en
        cuenta el alcohol abso- luto. Aquí ya no parece una cifra ridícula, pues en alcohol absoluto
        la participación de ANCAP es del 24%.
      retrieved_at: 2026-09-09
analisis: >-
  La incidencia de ANCAP en alcoholes pasó de 2,5% a 24%: dos formas de medir el mismo dato.


  No se trata de que el 2,5% fuera un error: es la misma participación medida con otro denominador
  (volumen total de bebidas destiladas contra contenido de alcohol puro). Ambas cifras son correctas
  para lo que miden, y la sesión donde se debatió cuál usar quedó registrada en el propio diario de
  sesiones.
