      cita: Creo que en el día de ayer se corrigió esa versión, estableciéndose que el porcentaje es el
        24% del total de alcohol destinado al consumo humano.
      retrieved_at: 2026-09-09
    - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescrr/1996-05-07%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20REPRESENTANTES%20(0009).pdf
      medio: parlamento
      fecha: 1996-05-07
      tipo: diario_de_sesiones
      titulo: Diario de Sesiones de la Cámara de Representantes, 1996-05-07, N.º 9
      cita: y que se mida el porcentaje de participación de ANCAP en el mercado de alcoholes tomando en
        cuenta el alcohol abso- luto. Aquí ya no parece una cifra ridícula, pues en alcohol absoluto
        la participación de ANCAP es del 24%.
      retrieved_at: 2026-09-09
analisis: >-
  Dijo que la incidencia de ANCAP en el mercado de bebidas alcohólicas, según la cifra corregida el
  día anterior, era del 24% (frente al 2,5% de la sesión previa). El diario del 7 de mayo confirma
  que esa corrección ocurrió y que el 24% corresponde a medir en "alcohol absoluto".


  No se trata de que el 2,5% fuera un error: es la misma participación medida con otro denominador
  (volumen total de bebidas destiladas contra contenido de alcohol puro). Ambas cifras son correctas
  para lo que miden, y la sesión donde se debatió cuál usar quedó registrada en el propio diario de
  sesiones.
