tema: economia
fecha: 1997-12-11
titulo: "La Caja Militar cuesta US$230.000.000 al año: sin informe oficial que lo confirme"
afirmacion: La Caja Militar costaba aproximadamente US$230.000.000 por año.
fragmento: la Caja Militar significa aproxima- damente US$ 230:000.000 todos los anos
calificacion: discutible
dato_real:
  valor: >-
    No se relevó un informe actuarial o presupuestal oficial (BPS, MEF, Ministerio de Defensa
    Nacional) de 1997 que confirme el costo anual de la Caja Militar en ese momento.


    Se buscó la Ley N.º 16.878 (Rendición de Cuentas, ejercicio 1996) en IMPO, pero la página que
    sirve esa ley no trae el articulado (solo una ficha de 792 caracteres), así que no se pudo
    confirmar ni descartar el dato por esa vía.
