      cita: Por ejemplo, la Caja Militar significa aproxima- damente US$ 230:000.000 todos los anos, es
        una de las que tiene peor relación activo-pasivo
      retrieved_at: 2026-09-09
analisis: >-
  Dijo que la Caja Militar costaba aproximadamente US$230.000.000 por año. No se encontró un informe
  actuarial o presupuestal oficial de 1997 con ese dato, y la Rendición de Cuentas de 1996 no está
  disponible con su articulado completo en IMPO.


  El documento que resolvería esto -la Rendición de Cuentas y Balance de Ejecución Presupuestal de
  1996 o 1997, con el detalle de la Caja Militar- existe pero no se pudo abrir por esta vía en esta
  corrida.
