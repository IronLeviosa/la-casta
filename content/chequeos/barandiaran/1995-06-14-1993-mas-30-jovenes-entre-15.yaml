titulo: "Consumo de alcohol adolescente en 1993: citó una encuesta sin identificar quién la hizo"
afirmacion: En 1993, más del 30% de los jóvenes de entre 15 y 19 años había abusado del alcohol.
fragmento: en 1993, más del 30% de los jÓvenes de entre Quince y diecinue- ve anos había abusado del alcohol
calificacion: discutible
dato_real:
  valor: >-
    No se localizó la encuesta de 1993 que menciona ("más del 30% de los jóvenes de entre 15 y 19
    años había abusado del alcohol"), ni un dato equivalente del INE, la Junta Nacional de Drogas o
    el Ministerio de Salud Pública para ese año.


    La única referencia disponible es la que él mismo da en su intervención, sin identificar el
    organismo que hizo la encuesta ni su ficha técnica.
