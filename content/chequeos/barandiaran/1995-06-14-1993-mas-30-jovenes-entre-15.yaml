analisis: >-
  Citó una encuesta de 1993 según la cual más del 30% de los jóvenes de 15 a 19 años había abusado
  del alcohol, sin decir quién la realizó. No se encontró esa encuesta ni una serie oficial
  equivalente para ese año.


  Sin el nombre del organismo o del estudio, no hay documento oficial contra el cual contrastar la
  cifra. La calificación queda en discutible porque falta identificar la fuente misma, no solo
  confirmar el número.
