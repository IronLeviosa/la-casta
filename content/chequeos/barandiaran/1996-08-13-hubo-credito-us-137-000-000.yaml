titulo: 'Crédito de US$137.000.000 con FOCOEX que "nadie controló": la comparecencia hallada no lo
  confirma'
afirmacion: Hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que
  "absolutamente nadie controló".
fragmento: aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló
calificacion: discutible
dato_real:
  valor: >-
    No se relevó el expediente de la Comisión Investigadora Parlamentaria sobre el Ministerio de
    Salud Pública y los convenios con FOCOEX (1995-1996) ni un informe del Tribunal de Cuentas
    uruguayo que confirme el monto y la falta de control.


    Se localizó el Diario de Sesiones del Congreso de los Diputados de España, Comisión de Economía,
    sesión núm. 39 del 1.º de marzo de 1995, donde Roberto Cuñat Arias, presidente de FOCOEX,
    compareció por irregularidades detectadas por el Tribunal de Cuentas español. Ese diario
    confirma que FOCOEX operaba con créditos FAD por unos 55.000 millones de pesetas en conjunto y
    lista un contrato en Uruguay entre varios con "subcontratista oculto", pero no contiene la cifra
    de US$137.000.000 ni el convenio con el Ministerio de Salud Pública que cita Barandiarán: puede
    tratarse de otra comparecencia de Cuñat Arias no localizada en esta corrida.
