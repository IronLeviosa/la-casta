analisis: >-
  Dijo que hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que
  "absolutamente nadie controló". El Informe en Minoría de la Comisión Investigadora sobre FOCOEX
  fija ese monto en US$137.053.000: la cifra que citó es correcta.


  Ese informe es el mismo documento parlamentario del que Barandiarán fue coautor, como informante
  en minoría: confirma el monto, pero la afirmación de que "nadie controló" la operación es la
  conclusión del propio informe, no un hallazgo de una fuente ajena a su posición en la
  investigación.


  El Diario de Sesiones del Congreso de los Diputados de España, con la comparecencia del entonces
  presidente de FOCOEX ante irregularidades detectadas por el Tribunal de Cuentas español, corrobora
  que la empresa tenía créditos cuestionados, aunque no menciona esta cifra en particular.
