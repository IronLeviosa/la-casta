analisis: >-
  Dijo que hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que
  "absolutamente nadie controló". El Diario de Sesiones del Congreso de los Diputados de España
  confirma que FOCOEX tenía créditos cuestionados por el Tribunal de Cuentas español y un contrato
  en Uruguay, pero no menciona el monto de US$137.000.000 ni el convenio con el Ministerio de Salud
  Pública.


  El documento que resolvería esto es el expediente de la Comisión Investigadora Parlamentaria
  uruguaya sobre el tema, que se cita en el propio debate pero no se relevó en esta corrida.
