titulo: "Crédito de US$137.000.000 con FOCOEX: el Informe en Minoría confirma la cifra"
afirmacion: Hubo un crédito de US$137.000.000 con la empresa estatal española FOCOEX que
  "absolutamente nadie controló".
fragmento: aquí hubo un crédito de US$ 137:000.000 que absolutamente nadie controló
calificacion: verdadero
dato_real:
  valor: >-
    El Informe en Minoría de la Comisión Investigadora Parlamentaria sobre los convenios con FOCOEX
    S.A., que Barandiarán integró como informante y leyó en la misma sesión, fija en US$137.053.000
    el monto de los negocios en los que FOCOEX intermedió: la cifra que citó ("US$137:000.000")
    coincide, redondeada, con la del propio informe.


    Ese informe es el mismo documento parlamentario del que él fue coautor como informante en
    minoría: confirma el monto, pero no es una fuente externa a su propia declaración.


    El Diario de Sesiones del Congreso de los Diputados de España (comparecencia de Roberto Cuñat
    Arias, presidente de FOCOEX, 1995-03-01) confirma por separado que la empresa operaba con
    créditos cuestionados por el Tribunal de Cuentas español, pero no incluye esta cifra puntual.
