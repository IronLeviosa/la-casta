analisis: >-
  Dijo que las medidas comerciales de Brasil podían hacerle perder a Uruguay unos US$70 millones en
  las seis semanas siguientes, atribuyendo la cifra a la Cámara de Industrias. No se encontró el
  informe de esa cámara empresarial con la estimación.


  Al ser una proyección de una cámara privada sobre un episodio puntual, y no una estadística
  oficial con publicación periódica, es poco probable que exista un documento oficial que la
  confirme o la descarte; queda como una estimación atribuida a su fuente, sin verificación
  independiente.
