dato_real:
  valor: >-
    Según la base de datos de gasto militar de SIPRI (Stockholm International Peace Research
    Institute), hoja "Per capita" en dólares corrientes, el gasto militar per cápita de 1997 fue de
    US$178,92 en Uruguay, US$142,95 en Chile y US$84,23 en Brasil.


    Uruguay tuvo, en efecto, el gasto militar per cápita más alto de los tres países ese año.
