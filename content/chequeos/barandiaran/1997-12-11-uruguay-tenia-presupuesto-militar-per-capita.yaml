analisis: >-
  Dijo que Uruguay tenía un presupuesto militar per cápita más alto que Chile o Brasil. La base de
  datos de gasto militar de SIPRI confirma que en 1997 Uruguay gastó US$178,92 per cápita en
  defensa, contra US$142,95 de Chile y US$84,23 de Brasil.


  SIPRI es la referencia internacional estándar para comparaciones de gasto militar; su serie por
  país y año está disponible desde 1949 y permite este tipo de comparación regional.
