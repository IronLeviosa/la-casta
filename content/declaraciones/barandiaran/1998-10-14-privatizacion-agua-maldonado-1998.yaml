politico: barandiaran
tema: empresas-publicas
fecha: 1998-10-14
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Si el negocio es vender agua, al privatizar este servicio, el sector privado que lo explote o
  el gobierno que entienda que el agua es una mercancía va a recibir más ingresos cuanto más
  cantidad de agua venda, mientras las organizaciones ambientalistas y todos los que se preocupan
  por el medio ambiente recalcan la necesidad de proteger este escaso recurso.
titulo: Cuestionó tratar el agua como mercancía en la concesión del servicio en Maldonado
resumen: En el debate sobre la concesión del agua en Maldonado, dijo no tener inconveniente a priori
  con las concesiones pero cuestionó que se tratara el agua como una mercancía, advirtiendo que un
  operador privado o el propio Estado que la vendiera como tal iba a recibir más ingresos cuanto más
  agua vendiera, en contra de la necesidad de proteger ese recurso escaso.
