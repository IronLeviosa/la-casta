contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Creemos que el tema de fondo que preocupa a todo el mundo y está vinculado a la Aduana, es el
  del contrabando. A la luz del contrabando podemos considerar adecuado el análisis de éste y de
  otros temas, ya que ése es el problema de actualidad a que refiere el informe en mayoría cuando
  dice que "ha tenido amplia difusión en los medios de comunicación, generando las consiguientes in-
  quietudes en la sociedad".
titulo: Pidió ampliar una Comisión Investigadora de Aduanas para abarcar todo el contrabando
resumen: Pidió ampliar el alcance de una Comisión Investigadora sobre la Dirección Nacional de
  Aduanas para que abarcara la problemática del contrabando en su conjunto, en lugar de limitarse a
  los hechos puntuales analizados por la Comisión Preinvestigadora, que consideraba poco relevantes.
