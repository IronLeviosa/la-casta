politico: barandiaran
tema: derechos-humanos/datos-personales
fecha: 1998-05-12
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: 'Entendemos que la información de las personas es un bien económico y corresponde a la propia
  intimidad. El líder de la empresa Microsoft, Bill Gates, dice que el eslogan de su empresa es:
  "Información al alcance de los dedos", pero hay que tener muy en claro a quién pertenece esa
  información y, fundamentalmente, a quién per- tenecen los dedos.'
titulo: La información de las personas "es un bien económico" que corresponde a su intimidad
resumen: Al fundamentar un proyecto de ley sobre bases de datos personales, sostuvo que la
  información de las personas "es un bien económico" que corresponde a su intimidad, y criticó,
  entre otros casos, que el recibo de los jubilados del Banco de Previsión Social usara el mismo
  formato que la factura de UTE, exponiendo información privada.
