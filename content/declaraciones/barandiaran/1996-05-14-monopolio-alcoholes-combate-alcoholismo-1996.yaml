politico: barandiaran
tema: salud
fecha: 1996-05-14
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: 'Si realmente creyéramos que a través del monopolio podríamos evitar el alcoholismo, seríamos
  los primeros en mante- nerlo y en extenderlo a todas las bebidas alcohólicas y a todos los vicios
  sociales. Es más: creemos que el monopolio puede significar lo contrario, la "terrible
  encrucijada" de la que hablaba Frugoni. Como representa el ingreso de una empresa del Estado, en
  algún momento podríamos estar promoviendo la venta del alcohol, cuando realmente lo que deberíamos
  estar haciendo es evitar que se consuma.'
titulo: Cuestionó que el monopolio estatal de los alcoholes sirva para combatir el alcoholismo
resumen: Cuestionó que el monopolio estatal de los alcoholes sea el instrumento adecuado para
  combatir el alcoholismo, porque el interés fiscal de la empresa pública puede terminar
  incentivando la venta en lugar de desalentar el consumo.
