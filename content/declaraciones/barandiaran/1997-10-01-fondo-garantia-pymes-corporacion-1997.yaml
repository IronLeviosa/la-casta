titulo: Se opuso al diseño de un fondo de garantía para pequeñas empresas por su discrecionalidad
resumen: Se opuso al mecanismo de un fondo de garantía para micro y pequeñas empresas administrado
  por la Corporación Nacional para el Desarrollo, por considerar que su diseño dejaba un margen de
  discrecionalidad excesivo, aunque compartía el objetivo de fomentar el empleo en esas empresas.
