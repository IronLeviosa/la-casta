fecha: 1997-02-03
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: De acuerdo con los datos que nos entregara la propia empresa, en el ano 1995 ANTEL facturó
  alrededor de US$ 500:000.000 con una ganancia de US$ 100:000.000, que fue obtenida gracias a las
  actividades monopólicas del Ente.
titulo: Votó en contra de habilitar a ANTEL a invertir en el exterior sus ganancias monopólicas
resumen: Fundamentó el voto negativo del Nuevo Espacio a la ley que habilitó a ANTEL a invertir en
  el exterior, señalando que, según datos entregados por la propia empresa, en 1995 había facturado
  unos US$500.000.000 con una ganancia de US$100.000.000 obtenida gracias a su condición de
  monopolio, y que permitir que ese dinero se invirtiera afuera era negativo dada la falta de
  responsabilidad de las empresas monopólicas al invertir.
