titulo: La energía de Salto Grande es la más barata de la región pero no llega así al usuario
resumen: En el debate del marco regulatorio eléctrico, sostuvo que aunque Uruguay produce la energía
  más barata de la región gracias a Salto Grande, ese menor costo no se traslada a la tarifa que
  paga el usuario final.
