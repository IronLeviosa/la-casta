titulo: Apoyó con salvedades que las AFAP presten sus fondos a los propios trabajadores
resumen: Al apoyar con salvedades un proyecto que permitía a las AFAP prestar parte de sus fondos
  —entonces de unos US$300 millones— a tasas más bajas a los trabajadores, insistió en que ese
  dinero pertenecía a los trabajadores y no a las administradoras.
