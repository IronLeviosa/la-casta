titulo: Cuestionó que ANTEL y otros organismos públicos paguen al Clearing de Informes por sus cobros
resumen: Cuestionó que los organismos públicos usaran el Clearing de Informes para gestionar sus
  cobros, calculando que si ANTEL —con 800.000 suscriptores— consultara la base de datos por cada
  uno a US$1,5 la consulta, eso implicaría transferirle US$1.200.000 a esa empresa privada.
