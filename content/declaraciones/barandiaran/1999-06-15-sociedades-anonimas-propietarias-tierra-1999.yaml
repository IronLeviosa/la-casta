titulo: Votó en contra de permitir que sociedades anónimas sean propietarias de tierras rurales
resumen: Votó en contra de derogar la prohibición para que sociedades anónimas sean propietarias de
  tierras rurales, argumentando que la llegada de capital anónimo y concentrado desplazará a los
  pequeños y medianos productores rurales del mismo modo que los supermercados desplazan a los
  almacenes de barrio.
