politico: barandiaran
tema: empresas-publicas
fecha: 1997-10-16
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Nosotros creemos firmemente que corresponde al Ministerio la determinación, el planeamiento,
  la previsión, el control e, inclusive, la implementación de las políticas que tienen que ver con
  esta temática. Obviamente, también deben intervenir las em- presas del Estado en lo que
  corresponda. Inclusive, ahora tendremos operadores privados que van a estar cumpliendo estos fines
  dentro del marco de guía razonable que debe tener nuestro país. Pero el que debe establecer,
  regular y controlar el marco de condiciones es necesariamente el Estado a través de su gobierno y,
  en forma más específica, del Ministro del ramo.
titulo: Sostuvo que la política energética la debe definir el Ministerio y no las empresas públicas
resumen: En una sesión con el Ministro de Industria, Energía y Minería sobre la política energética,
  sostuvo que la definición y el control de esa política corresponden al Ministerio y no a las
  empresas públicas del sector (ANCAP, UTE, Salto Grande), y cuestionó discrepancias entre lo que
  decían UTE y el Ministerio sobre la potencia necesaria de una nueva central.
