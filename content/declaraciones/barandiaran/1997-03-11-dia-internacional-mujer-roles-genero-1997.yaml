contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: En principio, queremos decir que hombres y mujeres estamos frente a un problema, que ya
  aparece planteado en esas fotograffas o cuadros incluidos en los manuales que lefan .nuestros
  ninos, donde observamos a una madre lavando ropa o a otra mujer realizando tareas domés- ticas. Me
  pregunto si, como contrapartida de ese tipo de situaciones, no se trasmite al varón la
  responsabilidad de traer el sustento a su casa.
titulo: La desigualdad de género también involucra los roles asignados a los hombres
resumen: En la conmemoración del Día Internacional de la Mujer, sostuvo que la desigualdad de género
  es un problema que involucra también los roles asignados al hombre, y llamó a tomar medidas de
  acción positiva para permitir a las mujeres acceder a actividades políticas, empresariales o
  comerciales que históricamente les fueron vedadas.
