seguimiento:
  estado: resuelto
  fecha: 2004-05-06
  texto: El Ministerio de Trabajo y Seguridad Social contestó la exposición escrita el 6 de mayo de
    2004, según el Diario de Sesiones de la Cámara de Representantes, que archivó la respuesta "a
    sus antecedentes" sin otra medida de la Cámara; el Diario no reproduce el contenido de esa
    respuesta. No hay registro, en los diarios de sesiones de noviembre de 2003 a diciembre de 2004
    revisados, en IMPO ni en la prensa consultada, de que el llamado se haya anulado, ampliado a
    otras universidades o de a quién se contrató.
