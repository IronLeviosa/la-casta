titulo: Repudió por igual las acciones de Milošević y el bombardeo de la OTAN sobre Belgrado
resumen: En una sesión en Comisión General sobre la guerra de Kosovo, sostuvo que tanto las acciones
  de Milošević contra los albanokosovares como el bombardeo de la OTAN sobre Belgrado le repugnaban
  por igual, y advirtió sobre el riesgo de no reconocer los genocidios, citando el caso armenio.
