contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: en el Uruguay el consumidor está absolu- tamente desamparado. Sabemos que la falta de
  información, los errores, la publicidad tendencio- sa, los ataques a la intimidad de las personas,
  los contratos de adhesión, las formas de "marketing" agresivas -como las de tiempo compartido o
  algunas otras que se le pare- cen-, la falta de estándares de calidad y el manejo de los precios
  en forma arbitraria, llevan a que la persona que no tiene más remedio que consumir, lo haga en un
  marco de absoluta desprotección.
titulo: Insistió en la falta de una ley de protección al consumidor en Uruguay
resumen: Insistió, por tercera vez en poco más de un año, en la falta de una ley de protección al
  consumidor en Uruguay, y pidió que el Parlamento la aprobara antes del año 2000.
