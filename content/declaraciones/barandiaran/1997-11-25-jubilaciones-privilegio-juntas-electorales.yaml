politico: barandiaran
tema: economia/seguridad-social
fecha: 1997-11-25
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Dentro de lo que pueden denominarse jubilaciones de privilegio, los cargos de particu- lar
  confianza gozaban de una jubilación distinta a la del común de los uruguayos; no era necesario
  alcanzar determinada edad y cumplir tantos anos de servicio, sino que bastaba con llegar a los
  ochenta puntos para obtener la jubilación. Indudablemente, éste fue uno de los elementos que
  atentó contra la Caja de Jubilaciones y el sistema previsional. Una de las cosa_s que la Ley N2
  16.713 quiso imponer es, precisamente, la eliminación de las jubilaciones de privilegio en el
  país.
titulo: Votó en contra de restablecer una jubilación de privilegio para las Juntas Electorales
resumen: Votó en contra de una minuta que pedía al Poder Ejecutivo restablecer un beneficio
  jubilatorio especial para los miembros de las Juntas Electorales, por considerar que reabriría la
  puerta a las "jubilaciones de privilegio" que la reforma de la seguridad social (Ley 16.713) había
  buscado eliminar. En el mismo turno, señaló que las Cajas Militar y Policial, cuyo déficit
  conjunto estimó en US$250.000.000 anuales, habían quedado excluidas de esa reforma.
