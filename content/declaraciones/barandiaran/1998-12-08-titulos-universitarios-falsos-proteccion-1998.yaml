politico: barandiaran
tema: educacion
fecha: 1998-12-08
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: 'el "consumidor" -entre comillas- de la educación -esto es: el alumno o sus padres- contratan
  un servicio privado, oneroso, por el cual se obtiene un título que no está de acuerdo con lo que
  se espera o con lo que se le ofrece según el centro de enseñanza.'
titulo: Pidió enfocar la regulación de títulos universitarios en la defensa del consumidor educativo
resumen: Al votar una ley que restringía el uso de denominaciones universitarias por instituciones
  no habilitadas, sostuvo que el enfoque debía apuntar a la defensa del consumidor educativo,
  permitiendo a los estudiantes reclamar la devolución de lo pagado si fueron inducidos a error
  sobre el título que recibirían.
