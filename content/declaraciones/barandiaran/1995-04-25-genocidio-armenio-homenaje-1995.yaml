titulo: Uruguay fue el primer país en reconocer el genocidio armenio, desde 1965
resumen: En un homenaje al pueblo armenio con motivo del aniversario del genocidio, dijo sentirse
  orgulloso de que Uruguay lo reconociera desde 1965, siendo el primer país en hacerlo, y relató el
  origen vasco de su padre como inmigrante que encontró refugio en Uruguay.
