politico: barandiaran
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
tema: sistema-politico
fecha: 1999-08-04
cita: El problema es que no se puede culpar al funcionamiento del Parlamento, cuando en última
  instancia hay colegas que no cumplen con su papel. Por supuesto, me preocupa mucho este tipo de
  circunstancias, porque después es más fácil echar tierra sobre el prestigio del Parlamento que
  sobre el de aquellas personas que prefieren votar con los pies antes que estar cumpliendo con sus
  obligaciones en esta Casa.
titulo: Atribuyó una demora legislativa a la baja asistencia de legisladores, no al Parlamento como
  institución
resumen: Al fundamentar una prórroga del término de la sesión, dijo que la baja asistencia de
  legisladores del propio oficialismo -y no un problema del funcionamiento del Parlamento como
  institución- explicaba que se demorara la aprobación de una iniciativa, y pidió mirar hacia
  adentro en lugar de volcar la frustración sobre la imagen del Parlamento.
