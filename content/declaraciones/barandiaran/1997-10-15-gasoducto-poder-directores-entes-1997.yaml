cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: los Directores de ANCAP y de UTE son los que determinan la política energética del país -tal
  vez con mucho más poder que el que debería tener el propio señor Ministro de Industria, Energía y
  Minería-, razón por la cual se torna importantísimo y fundamental contar con su presencia, a fin
  de dejar todo lo más claro y transparente posible.
titulo: Sostuvo que los directores de ANCAP y UTE tienen más poder que el Ministro de Industria
resumen: Apoyó convocar a la Cámara en Comisión General a las autoridades de ANCAP y UTE junto con
  el Ministro de Industria por el tema del gasoducto, señalando que los directores de los entes
  energéticos tenían "mucho más poder" que el propio Ministro en la definición de la política
  energética.
