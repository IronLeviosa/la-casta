politico: barandiaran
tema: economia/seguridad-social
fecha: 1998-09-16
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Hablamos de una cuestión de ética política y administrativa, en la medida en que la relación
  que, como patrono, tiene el Estado con sus funcionarios sea compatible con su exigencia a los
  empresarios privados de que toda retribución a sus empleados sea acompañada con el correspondiente
  aporte a la seguridad social. En la medida en que esto no lo cumpla el propio Estado, obviamente
  no tendrá la autoridad para exigirlo, redundando en una gran injusticia.
titulo: El Ministerio del Interior debe aportar a la seguridad social por el servicio 222 de los policías
resumen: Como miembro informante, defendió un proyecto de ley para obligar al Ministerio del
  Interior a aportar a la seguridad social por las retribuciones que paga a policías por el servicio
  222, sosteniendo que el Estado pierde autoridad moral para exigir ese cumplimiento a las empresas
  privadas si no lo respeta con sus propios funcionarios.
