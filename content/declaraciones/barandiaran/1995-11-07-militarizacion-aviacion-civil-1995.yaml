politico: barandiaran
tema: seguridad
fecha: 1995-11-07
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Lo que expreso no se refiere a la vuelta de la Dirección General de AviaciÓn Civil a la Órbita
  del Ministerio de Transporte y Obras PÚblicas, como lo fue antes del golpe de Estado y como lo
  comparte actualmente quien habla y nuestro Partido, ya que este es un tema político y no apto para
  ser tratado en la media hora previa. En lo que sí podemos estar de acuerdo es en evitar,
  independientemente de quien esté a cargo, la filosofía militar en una actividad básicamente civil.
titulo: Pidió sacar la Aviación Civil de la órbita militar por tener una "filosofía militar"
resumen: Criticó que la Dirección General de Aviación Civil y de Infraestructura Aeronáutica
  siguieran bajo la órbita del Ministerio de Defensa Nacional desde el golpe de Estado, con una
  "filosofía militar" en una actividad básicamente civil, y respaldó su retorno a la órbita del
  Ministerio de Transporte.
