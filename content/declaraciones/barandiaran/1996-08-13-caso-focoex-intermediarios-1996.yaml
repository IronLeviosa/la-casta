cita: Además, si algo quedó claro es que aquí hubo un crédito de US$ 137:000.000 que absolutamente
  nadie controló. Increíblemente, el país se enfrentó a un crédito de dóla- res 137:000.000, se
  obligó a pagar la mitad en cinco anos y el resto en treinta anos, y cuando se ejecuta aparecen
  comisionistas privados, la empresa EDUCTRADE como intermediaria con FOCOEX, que compra a otras
  firmas.
titulo: El crédito de US$137.000.000 con FOCOEX "no lo controló absolutamente nadie"
resumen: Como miembro informante en minoría de la Comisión Investigadora sobre el Ministerio de
  Salud Pública y los convenios con la empresa estatal española FOCOEX, sostuvo que un crédito de
  US$137.000.000 se ejecutó sin control del Tribunal de Cuentas y que en la operación intervinieron
  intermediarios privados que cobraron comisiones millonarias.
