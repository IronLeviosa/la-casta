politico: barandiaran
tema: economia
fecha: 1998-12-15
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Es común ver cómo los grandes establecimientos comerciales pueden disponer de exoneraciones
  tributarias como, por ejemplo, la que corresponde a la libre importación de los productos e
  instrumentos que les son necesa- rios. Es así que algunos centros comerciales grandes han podido
  importar todo su equipamiento prácticamente sin impuestos, den- tro de la declaratoria de interés
  nacional. Esta no es la situación que se le presenta, por ejemplo, a un panadero que clebe
  acompasar los requerimientos que tiene como empresa sin este tipo de beneficios.
titulo: Dijo que el comercio formal pequeño enfrenta competencia desleal de la informalidad y las
  grandes superficies
resumen: Planteó que el comercio formal pequeño enfrenta competencia desleal tanto de la
  informalidad y el contrabando como de las exoneraciones tributarias y ventajas regulatorias de las
  grandes superficies comerciales.
