politico: barandiaran
tema: vivienda
fecha: 1996-07-09
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Lo que sí va a ayudar mucho a la construcción de viviendas, lo que sí va a generar
  posibilidades de volcar ahorro público a operadores particulares para un fin tan loable
  socialmente, es un proyecto de ley que fue anunciado por el Poder Ejecutivo y todavía no ha sido
  presentado y que, dada su importancia, lo estamos esperando. Nos referimos al proyec- to de ley
  sobre securitización de activos.
titulo: Votó a favor de préstamos hipotecarios para propiedad horizontal, con reservas por el riesgo
  financiero
resumen: Votó a favor de habilitar a las entidades financieras a otorgar préstamos hipotecarios para
  la construcción en propiedad horizontal, pero con reservas por el riesgo que representa para el
  sistema financiero, y reclamó al Poder Ejecutivo el proyecto de titularización de activos que, a
  su juicio, sería más eficaz para volcar ahorro a la vivienda.
