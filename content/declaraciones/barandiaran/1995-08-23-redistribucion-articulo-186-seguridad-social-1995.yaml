politico: barandiaran
tema: economia/seguridad-social
fecha: 1995-08-23
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: En la medida en que la aplicación de esta reforma va a redundar en una mejor recaudación y
  relación entre activos y pasivos, nos preocupa la posibilidad de repartir socialmente los
  beneficios que pueden llegar a obtenerse. Por otra parte, el sef'lor Diputado preopinante
  mencionaba el compromiso del Poder Ejecutivo en cuanto a que en la primera etapa se iban a
  modificar los montos de $ 1.050 y $ 1.250 de tal forma que se pueda cubrir la idea original, es
  decir que en la primera franja haya un equilibrio entre ingresos y egresos y que en la segunda-
  hubiera un cargo a Rentas Generales de unos US$ 20:000.000, logrando llegar a un nivel de unos
  ciento diez mil beneficiarios.
titulo: Recogió el compromiso del Poder Ejecutivo de ajustar montos de la reforma jubilatoria
resumen: Al fundamentar la separación de un artículo en el debate de la reforma de la seguridad
  social, recogió lo señalado por un diputado preopinante sobre un compromiso del Poder Ejecutivo de
  ajustar los montos de $1.050 y $1.250 con un cargo a Rentas Generales de unos US$20.000.000 para
  llegar a unos 110.000 beneficiarios, y dijo que el Nuevo Espacio esperaba la iniciativa del Poder
  Ejecutivo en ese sentido.
