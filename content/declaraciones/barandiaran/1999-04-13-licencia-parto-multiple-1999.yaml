titulo: Fundamentó una licencia paterna más extensa para los partos múltiples
resumen: Como miembro informante, fundamentó un proyecto que otorgaba una licencia maternal más
  extensa y una licencia paternal en partos múltiples, señalando que en Uruguay se producían entre
  80 y 100 nacimientos múltiples por año y que la licencia paternal ayudaría a reducir la
  discriminación laboral hacia las mujeres embarazadas.
