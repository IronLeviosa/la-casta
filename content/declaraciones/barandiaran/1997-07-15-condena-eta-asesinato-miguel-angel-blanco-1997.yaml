titulo: Condenó el asesinato de Miguel Ángel Blanco por ETA y expresó solidaridad con el pueblo vasco
resumen: Condenó el asesinato del concejal Miguel Ángel Blanco por la banda terrorista ETA, expresó
  su "defensa inclaudicable de los derechos humanos, en todo lugar y circunstancia" y solidaridad
  con el pueblo vasco y español, y remarcó que la ETA no representaba al pueblo vasco.
