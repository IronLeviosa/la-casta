titulo: Sostuvo que los roles de género tradicionales también perjudican a los hombres
resumen: En la media hora previa, en el marco del Día Internacional de la Mujer, sostuvo que los
  estereotipos de género también perjudican a los hombres y que superar esos roles beneficiaría a
  toda la sociedad, tras repasar datos sobre discriminación laboral y salarial de las mujeres.
