cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Pero tenemos que reconocer que cada vez que tomamos una decisión de este tipo, cada vez que
  gastamos lo que no deberíamos gastar, cada vez que con un fin espurio contratamos a una persona
  que no necesitamos, cada vez que por sensibilidad traemos a l.lna familia a un trabajo, estamos
  alterando, lamentablemente, ese contrato social que nos liga con el resto de la ciudadanía Y
  ponemos en entredicho ese relacionamiento.
titulo: Dijo que contratar personal público por motivos electorales deteriora el contrato social
resumen: En el debate sobre el ajuste fiscal de 1995, sostuvo que la contratación de personal
  público por motivos ajenos a la necesidad del cargo, sobre todo en año electoral, deteriora el
  contrato social entre la clase política y la ciudadanía, y por eso resta autoridad al Estado para
  pedir sacrificios a la población.
