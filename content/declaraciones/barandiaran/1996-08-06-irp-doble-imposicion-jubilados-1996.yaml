seguimiento:
  estado: resuelto
  fecha: 1996-09-03
  texto: El 3 de setiembre de 1996 la Cámara votó, 44 en 45, devolver a la Comisión de Seguridad
    Social el proyecto que buscaba corregir la doble imposición, junto con la minuta de comunicación
    que el Nuevo Espacio había presentado pidiendo al Poder Ejecutivo la devolución de lo retenido;
    en la misma sesión se dejó constancia de que el Poder Ejecutivo, por una autorización ya vigente
    en el Presupuesto Nacional, había reducido a la mitad el adicional del Impuesto a las
    Retribuciones Personales sobre las pasividades desde el 30 de junio de 1996, con expectativa de
    eliminarlo el 31 de diciembre. Trece meses después, en la sesión del 1º de octubre de 1997, un
    legislador seguía describiendo que los jubilados pagaban el impuesto dos veces, y no se encontró
    una ley posterior que resuelva la devolución que pedía la minuta.
