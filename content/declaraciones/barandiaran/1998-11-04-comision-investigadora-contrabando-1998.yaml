titulo: Defendió incluir el contrabando en una Comisión Investigadora, sin cálculo electoral
resumen: Defendió la propuesta del Nuevo Espacio de incluir el contrabando entre los objetivos de
  una comisión investigadora parlamentaria, rechazando que la iniciativa tuviera un cálculo
  electoral y respaldando que se creara una comisión especial si esa era la salida política.
