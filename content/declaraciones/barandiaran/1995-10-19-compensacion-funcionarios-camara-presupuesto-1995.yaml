titulo: '"El Estado es un patrón espantoso", dijo al fundamentar una compensación a funcionarios de
  la Cámara'
resumen: Al fundamentar el apoyo a una compensación extraordinaria para funcionarios de la Cámara
  que trabajaron en el Presupuesto Nacional, señaló que, por su experiencia en la Comisión de
  Presupuestos recibiendo delegaciones de empleados públicos, había comprobado que "el Estado es un
  patrón espantoso" en muchos casos, y pidió cuidar con responsabilidad el dinero público destinado
  a esas compensaciones.
