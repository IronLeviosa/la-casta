seguimiento:
  estado: sin_resolucion_publica
  texto: No hay registro, en el Diario de Sesiones del 17 de marzo de 1999 ni en los diarios de
    sesiones de 1999 revisados en el corpus, de que el Ministerio de Trabajo y Seguridad Social o la
    Junta Departamental de Rocha hayan contestado el pedido de inspección de las explotaciones
    arroceras que Barandiarán formuló en esa media hora previa. Un pedido de informes de otro
    legislador sobre trabajadores extranjeros indocumentados en la cuenca arrocera de Treinta y
    Tres, presentado en junio de 1999, sí obtuvo respuesta del ministerio en agosto de ese año, pero
    es un trámite distinto -de otro departamento y de otro Representante- que no menciona la
    exposición de Barandiarán.
