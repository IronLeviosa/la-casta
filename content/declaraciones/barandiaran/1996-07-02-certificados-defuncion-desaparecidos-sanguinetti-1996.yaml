politico: barandiaran
tema: derechos-humanos
fecha: 1996-07-02
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: >-
  El Estado uruguayo debe decir a los familiares de los desaparecidos algo que todos sabemos: que
  ellos no van a volver, que están muertos. ¿Por qué no se presenta un certificado de defunción?
  ¿Por qué no se resuelven estos problemas? Además, sinceramente creo que éste es el mejor momento
  para resolver este tema. En primer lugar, porque el artífice del voto amarillo

  Martes 2 de julio de 1996 CAMARA DE REPRESENTANTES 41 en relación a la ley de caducidad, también
  hoy es Presidente de la República, y podría colaborar para la resolución de esta situación en dos
  tiempos: hace diez años, la cuestión legal; ahora, la cuestión moral.
titulo: Pidió que el Estado reconozca la muerte de los desaparecidos y expida sus certificados de defunción
resumen: En el debate sobre reconciliación y pasado reciente, pidió que el Estado reconozca la
  muerte de los desaparecidos y expida sus certificados de defunción, y dijo que el entonces
  presidente de la República, Julio María Sanguinetti, a quien describió como "el artífice del voto
  amarillo" en relación con la ley de caducidad, podía colaborar ahora a resolver la cuestión moral
  del tema.
