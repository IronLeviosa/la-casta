contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Voy a mencionar los motivos por los cuales, según la opinión de algunos jerarcas, las mujeres
  no podían ingresar a determinado trabajo. El primero de ellos se refiere a la falta de capacidad
  locativa. Indudablemente, en este caso no podemos considerar que la falta de duchas y de banas
  para mujeres signifique, en última instancia, un impedimento a la decisión política de que las
  mujeres empiecen a tomar preponderan- cia en determinados medios laborales.
titulo: Cuestionó los argumentos de la Intendencia de Montevideo para excluir mujeres de ciertos empleos
resumen: Cuestionó los argumentos usados por jerarcas de la Intendencia de Montevideo para excluir a
  mujeres de determinados puestos de trabajo, como la falta de infraestructura o el embarazo, por
  considerarlos insuficientes para restringir el acceso femenino al empleo.
