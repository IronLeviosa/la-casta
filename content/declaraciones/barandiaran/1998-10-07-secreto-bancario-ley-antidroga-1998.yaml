titulo: Advirtió que una base de datos contra el narcotráfico podía chocar con el secreto bancario
resumen: Al votar a favor de una ley contra el lavado de dinero proveniente del narcotráfico,
  advirtió que la obligación de las instituciones financieras de mantener una base de datos de
  transacciones podía colisionar con el secreto bancario uruguayo.
