politico: barandiaran
tema: economia/seguridad-social
fecha: 1996-06-18
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "hemos votado negativamente esta moción, no por considerarla injusta sino todo lo contrario:
  sería muy bueno que los trabajadores pudieran disponer de este beneficio. Sin embargo, nos
  preguntamos por qué no pueden gozarlo todos los trabajadores. La Ley N11 16.713 exige treinta y
  cinco anos de trabajo y sabemos que, precisamente, uno de los argumentos que se han hecho contra
  la nueva Ley de Seguridad Social es que haya aumentado el tope para poder jubilarse de treinta a
  treinta y cinco anos de trabajo. ¿Por qué razones, entonces, no pedimos para todos los
  trabajadores la rebaja a treinta anos?"
titulo: Votó en contra de bajar a 30 años el requisito jubilatorio solo para un grupo de trabajadores
resumen: Votó en contra de una moción que reducía a 30 años el requisito jubilatorio solo para un
  grupo específico de trabajadores, no por considerarla injusta sino porque entendía que ese
  beneficio debía extenderse a todos los alcanzados por la Ley 16.713.
