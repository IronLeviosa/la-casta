politico: barandiaran
tema: derechos-humanos
fecha: 1998-05-05
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "¿Cuáles son las razones que motivan estos hechos? Una de ellas es la propia dictadura: estos
  son los jóvenes que heredamos de ella. La otra es la educación y tenemos una deuda con ella que no
  podemos soslayar ni hacernos los distraídos. Necesariamente debemos educar e influir en nuestros
  jóvenes para evitar que suceda este tipo de cosas. No hay justificación para las acciones de este
  grupo de inadaptados."
titulo: Atribuyó a la dictadura y a fallas educativas el ultraje a la estatua de Batlle y Ordóñez
resumen: Tras el ultraje a la estatua de José Batlle y Ordóñez por un grupo de jóvenes, condenó el
  hecho y atribuyó la intolerancia de esos jóvenes tanto a la herencia de la dictadura como a fallas
  de la educación, rechazando que se buscara responsabilizar por eso a los organizadores del acto
  que se había realizado días antes.
