politico: barandiaran
tema: educacion
fecha: 1998-09-01
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: A través del Instituto Nacional de Estadística hemos observado que los precios de la educación
  privada han experimentando un incremento mayor que el del resto de los bienes de la canasta
  familiar. Una vez que el colegio establece su propio mercado o nivel de alumnado, en general
  decide, más que buscar criterios de eficiencia, simplemente aumentar el precio para obtener
  ingresos que puedan equilibrar los egresos crecientes.
titulo: Los precios de la educación privada subieron más que el resto de la canasta familiar, según el INE
resumen: Sostuvo que los precios de la educación privada, según el Instituto Nacional de
  Estadística, habían aumentado por encima del resto de los bienes de la canasta familiar, y que los
  colegios, una vez consolidado su nivel de alumnado, subían el precio para cubrir sus egresos
  crecientes en lugar de buscar eficiencia.
