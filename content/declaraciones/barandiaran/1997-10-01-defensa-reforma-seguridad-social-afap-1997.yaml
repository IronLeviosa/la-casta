politico: barandiaran
tema: economia/seguridad-social
fecha: 1997-10-01
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: A nuestro juicio, la situación era insostenible. Si bien se trata de una reforma muy sui
  géneris, en cierta forma nos enorgullecemos de que se haya podido optar por una solución "a la
  uruguaya" que no hay por qué desprestigiar, ya que al menos mantiene el criterio fuertemente
  solidario de lo que debe ser un sistema de seguridad social, tratando de rescatar ese instrumento
  estatista tan importante, que garantiza las jubilaciones del Estado.
titulo: Defendió la reforma jubilatoria de 1995 como una solución "a la uruguaya" pese a sus problemas
resumen: Defendió la reforma de la seguridad social de 1995 (creación de las AFAP) como una
  respuesta necesaria a un sistema previsional insostenible, reconociendo que tuvo problemas de
  implementación pero defendiéndola como una solución "a la uruguaya" que, a su juicio, conservaba
  un criterio fuertemente solidario.
