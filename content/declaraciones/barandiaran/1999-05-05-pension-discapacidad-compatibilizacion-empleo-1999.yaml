cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Creemos que hay un cambio de perfil en cuanto a la filosofía con la cual se encara el trabajo
  con los disc.apacitados: desde la pers- pectiva de que cobren una pensión para que se queden en la
  casa porque no pueden trabajar, a otra, según la cual se tienen que reciclar, trabajar y cooperar
  como todo el mundo con el trabajo colectivo."
titulo: Impulsó compatibilizar la pensión por discapacidad con el trabajo remunerado
resumen: Presentó casos de personas ciegas o con baja visión insertas en tareas de responsabilidad
  en empresas públicas y privadas para respaldar un proyecto de ley que permitiera compatibilizar el
  cobro de una pensión por discapacidad con el trabajo remunerado.
