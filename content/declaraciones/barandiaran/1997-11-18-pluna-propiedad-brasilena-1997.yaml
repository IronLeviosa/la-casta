cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Los seliores Diputados conocerán que la realidad de esta empresa en 1997 indica que su mayor
  participación accionaría está en poder de una compaf'lía de aviación brasilelia, lo cual ha
  significado una dualidad en cuanto a su propiedad y a la bandera a la que pertenece. Obviamente,
  PLUNA es de bandera uruguaya mientras que la propiedad mayoritaria pertenece a una empresa de
  aviación de origen brasileno; también goza de todas las prerrogativas que puede tener una aeroHnea
  de bandera uruguaya, pero los uruguayos no poseemos las ventajas de tener el control de una
  aerolínea de estas características.
titulo: Cuestionó que la mayoría accionaria de PLUNA esté en manos de una aerolínea brasileña
resumen: Cuestionó que la mayor parte del paquete accionario de PLUNA estuviera en poder de una
  aerolínea brasileña mientras la empresa conservaba las prerrogativas de bandera uruguaya, y pidió
  evaluar si tenía sentido mantenerlas dado el impacto de los altos precios de los pasajes en el
  turismo.
