titulo: Condenó las medidas comerciales de Brasil contra productos uruguayos
resumen: Condenó las medidas comerciales adoptadas por el gobierno de Brasil contra productos
  uruguayos y respaldó una acción conjunta del Parlamento, en el marco de la Comisión Parlamentaria
  Conjunta del Mercosur, para revertirlas.
