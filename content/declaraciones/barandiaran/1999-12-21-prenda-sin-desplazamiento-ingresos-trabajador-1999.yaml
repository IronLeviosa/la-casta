cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: quiero preguntar si los ingresos de un trabajador, por el desempeño de su oficio, podrían ser
  prendados. En el caso de un jugador de fútbol, por ejemplo, ¿puede obtener un crédito contra los
  futuros ingresos que pueda tener?
titulo: Preguntó si los ingresos futuros de un trabajador podían darse en garantía de un crédito
resumen: Preguntó, en el debate de una ley sobre prenda sin desplazamiento, si los ingresos futuros
  de un trabajador podían ser dados en garantía, advirtiendo que eso podría pasar por encima de las
  protecciones de la legislación laboral.
