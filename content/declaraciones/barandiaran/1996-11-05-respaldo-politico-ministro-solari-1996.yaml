titulo: Cuestionó si el ministro de Salud Pública Raúl Solari conservaba respaldo político para continuar
resumen: Cuestionó si el ministro de Salud Pública, Raúl Solari, conservaba respaldo político para
  seguir en el cargo, señalando que se había reincorporado a un funcionario con una denuncia penal
  pendiente y que no se había investigado a fondo la muerte de una paciente tras un parto en un
  hospital público.
