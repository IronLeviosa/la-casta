politico: barandiaran
tema: transparencia-corrupcion
fecha: 1996-08-13
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: EDUCTRADE S.A. es interme- diaria, como asesora de FOCOEX; el senor Estellano, que cobra el 4%
  de comisión, es decir, US$ 5:000.000 -¡US$ 5:000.0001-, también es intermediario. Pero, senor
  Presidente, ¿cuán- tos intermediarios pagamos? ¡Es impresionante la cantidad de intermediarios que
  pagamos! ¿Cómo hizo el senor Estellano -no tengo la menor idea- para evadir -si lo hizo- los
  impuestos que deberra haber pagado por US$ 5:000.000?
titulo: Un intermediario cobró una comisión del 4% en el crédito con FOCOEX, según denunció en Sala
resumen: En el mismo informe en minoría sobre el crédito de FOCOEX, dijo que un intermediario, el
  señor Estellano, había cobrado una comisión del 4% del crédito (unos US$5.000.000), y planteó, sin
  tener certeza, la duda de si había evadido impuestos por esa suma.
