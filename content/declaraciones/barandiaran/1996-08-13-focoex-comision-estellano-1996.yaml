revision:
  tier: publicado
  notas_internas: 'Bloquea de la crítica resuelto: el resumen atribuye la afirmación a Barandiarán
    ("dijo que...", "planteó, sin tener certeza, la duda de...") y no la asevera como hecho del
    sitio; el nombre de Estellano queda en la cita literal del diario de sesiones, junto con la
    propia duda del orador ("no tengo la menor idea... si lo hizo"). No hay denuncia judicial ni
    investigación documentada contra Estellano, por lo que no corresponde un registro en
    content/casos; se mantiene como declaración con la cita completa.'
