politico: barandiaran
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
tema: transparencia-corrupcion
fecha: 1997-07-31
cita: Es importante decir que votamos este artículo en la medida en que se están distribuyendo
  ahorros generados gracias a la política de incentivos realizada por la Cámara de Diputados. En
  esta perspectiva podríamos decir que, de acuerdo con el artículo 2º originalmente presentado por
  la Comisión y con lo que dice el informe, de todas maneras habría un ahorro importante en el Rubro
  O de la Cámara, de unos US$ 900:000.000. Si bien hoy este importe cambiaría, ello no significaría
  un perjuicio, pues estaríamos dentro de los márgenes que corres- ponden a la partida que se
  manejaba para el Rubro O, inclusive dentro del Presupuesto global del Poder Legislativo. De modo
  que esto bajo ningún concepto va a representar un aumento de costos, un aumento del Presupuesto de
  la Cámara.
titulo: Condicionó su apoyo a que un ahorro de la Cámara no representara un aumento del presupuesto
  legislativo
resumen: Al fundamentar el voto de un artículo sobre el destino de ahorros generados por la Cámara
  de Diputados en su Rubro 0, condicionó su apoyo a que la distribución de esos ahorros entre los
  funcionarios no representara, bajo ningún concepto, un aumento del Presupuesto del Poder
  Legislativo.
