contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Las empresas públicas son gigantes ante los cuales el ciudadano común y corriente se siente
  desprotegido y sin más derechos que aquellos que los administradores de las mismas quieran darle
  en su momento.
titulo: Contó que ANTEL le reclamó una deuda telefónica que no había contraído
resumen: Contó, como caso propio, que ANTEL le reclamó una deuda telefónica que no había contraído
  poco después de instalarle una línea, para plantear la desprotección de los usuarios de las
  empresas públicas frente a errores administrativos que invierten la carga de la prueba sobre el
  cliente y pueden derivarlo al Clearing de Informes.
