politico: barandiaran
tema: derechos-humanos
fecha: 1997-09-03
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: me voy a referir a una noticia publicada en el último número de la revista "Posdata", que hace
  referencia a un manual de entrenamiento y procedimiento que es entregado por la empresa American
  Airlines a sus pilotos. En él se realizan algunos comentarios de neto corte racista sobre los
  latinoamericanos. La nota expresa que, entre otras cosas, en dicho manual se advierte que los
  pasajeros latinoamericanos suelen viajar borrachos y también que provocan el retraso de los
  vuelos, mediante una amenaza telefónica de bomba, cuando saben que van a llegar tarde.
titulo: Denunció comentarios racistas en un manual de American Airlines para sus pilotos
resumen: Denunció que, según una nota periodística, un manual de entrenamiento de la empresa
  American Airlines para sus pilotos contenía comentarios "de neto corte racista" sobre los
  pasajeros latinoamericanos, y planteó si los legisladores debían reconsiderar viajar con esa
  aerolínea.
