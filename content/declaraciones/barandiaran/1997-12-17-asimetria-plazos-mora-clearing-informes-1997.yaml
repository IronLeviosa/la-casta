cita: ¿Por qué el Banco de Previsión Social puede apelar por deudas de aportes de tres ai'los
  anteriores y el empleado no? ¿Por qué no achicamos también las deudas comerciales?
titulo: Cuestionó que el BPS reclame aportes de hasta tres años sin una rebaja equivalente para el
  trabajador
resumen: "Al interrumpir a otro diputado en el debate de la ley de promoción de inversiones,
  cuestionó una asimetría de plazos: mientras el Banco de Previsión Social podía reclamar aportes
  atrasados hasta tres años atrás, no había una reducción equivalente para el trabajador, y pidió
  también achicar los plazos de las deudas comerciales y de permanencia en el Clearing de Informes."
