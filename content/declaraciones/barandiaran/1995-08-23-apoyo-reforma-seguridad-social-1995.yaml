politico: barandiaran
tema: economia/seguridad-social
fecha: 1995-08-23
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Mientras tanto el Nuevo Espacio, preocupado por el tema, presenta un documento al que
  denomina \"Aportes para la reforma de la seguridad social\", fechado el 20 de marzo de 1995, en el
  que se establecen algunas ideas sobre el tema. En la parte general sef'lala: \"El sistema de
  Seguridad Social está en crisis. No brinda prestaciones dignas, tiene costos que pesan
  excesivamente sobre la población, y está crecientemente desfinanciado. Los gastos de la Seguridad
  Social han venido en aumento sostenido, acercándose al 16% del PBI en 1994."
titulo: Respaldó la reforma de la seguridad social por un sistema previsional "en crisis"
resumen: Al fundamentar el apoyo del Nuevo Espacio a la reforma de la seguridad social (luego Ley
  16.713), relató el acuerdo tripartito de febrero de 1995 y leyó el documento de su partido que
  calificaba de "en crisis" al sistema previsional, con un gasto que se acercaba al 16% del PBI en
  1994.
