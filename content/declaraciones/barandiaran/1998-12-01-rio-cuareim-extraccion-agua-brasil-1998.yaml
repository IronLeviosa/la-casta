titulo: Productores brasileños extrajeron agua del río Cuareim causando "un grave daño ecológico"
resumen: Votó a favor de un ajuste al estatuto jurídico de la frontera con Brasil, señalando que
  productores brasileños habían extraído agua del río Cuareim en cantidad suficiente como para
  provocar "un grave daño ecológico".
