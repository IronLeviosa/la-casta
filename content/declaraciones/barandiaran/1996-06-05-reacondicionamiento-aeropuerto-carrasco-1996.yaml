cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: La mala situación en que se encuentra el Aeropuerto Internacional de Carrasco, nuestro
  principal aeropuerto, ha llevado a este Parla- mento a votar en el Presupuesto Nacional la suma de
  US$ 60:000.000 a fin de reacon- dicionarlo, al menos parcialmente.
titulo: Cuestionó los US$60.000.000 votados para reacondicionar Carrasco sin evaluar un aeropuerto nuevo
resumen: Cuestionó que el Parlamento hubiera votado US$60.000.000 en el Presupuesto Nacional para
  reacondicionar el Aeropuerto de Carrasco sin antes evaluar una propuesta de construir un nuevo
  aeropuerto, y preguntó en qué se gastaban los ingresos propios de la Dirección General de
  Infraestructura Aeronáutica.
