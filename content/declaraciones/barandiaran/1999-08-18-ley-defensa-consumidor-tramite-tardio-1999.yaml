titulo: Celebró que la ley de defensa del consumidor llegara a la Cámara, aunque "un poco tarde"
resumen: En la discusión general del proyecto de ley de defensa del consumidor -que sancionaría la
  Ley 17.189-, celebró que el tema llegara finalmente a la Cámara pero lamentó que el trámite se
  hubiera demorado desde 1995 a la espera de un acuerdo regional con Brasil y Argentina que no se
  concretó, y advirtió que los tiempos parlamentarios harían que la ley recién se aprobara en la
  siguiente Legislatura.
