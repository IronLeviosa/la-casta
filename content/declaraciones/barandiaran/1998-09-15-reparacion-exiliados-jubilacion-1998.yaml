titulo: Buscará reparar a quienes se exiliaron o perdieron su trabajo durante la dictadura
resumen: Antes de una comparecencia de la Ministra de Trabajo y Seguridad Social, adelantó que
  buscaría apoyo parlamentario para reparar la situación de las personas obligadas a exiliarse o que
  perdieron su trabajo durante la dictadura y que, por eso, no habían generado derechos jubilatorios
  por esos años.
