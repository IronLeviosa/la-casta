titulo: La Caja Militar cuesta US$230 millones al año y Uruguay gasta más en defensa per cápita que
  sus vecinos
resumen: Al cuestionar una ley que restituía beneficios jubilatorios que la reforma de la seguridad
  social (Ley 16.713) había buscado eliminar, señaló que la Caja Militar costaba unos US$230.000.000
  anuales y que Uruguay tenía un presupuesto militar per cápita más alto que Chile o Brasil, y
  objetó que hubiera organismos públicos que no aportaban al nuevo sistema.
