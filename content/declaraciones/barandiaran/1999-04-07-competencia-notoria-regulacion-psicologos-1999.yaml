cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
tema: economia/empleo
fecha: 1999-04-07
cita: Es muy difícil que no se reconozca la competencia notoria a un profesional que viene
  ejerciendo desde hace años, de forma probada y con validación del mercado -es decir, de los
  pacientes que se atienden con él y se sienten satisfechos con su trabajo- y que, por ende, deba
  abandonar el ejercicio de esa carrera.
titulo: Defendió reconocer la "competencia notoria" de psicólogos que ya ejercían antes de la
  reglamentación
resumen: Al fundamentar el proyecto de ley que regula el ejercicio de la profesión de psicólogo,
  defendió que se reconociera la "competencia notoria" a quienes ya ejercían la profesión desde
  hacía años y tenían validación de sus pacientes, para que no debieran abandonar su carrera por la
  nueva reglamentación.
