contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Me preocupa saber que el porcentaje de pacientes que están siendo sometidos a un protocolo de
  investigación no tradicional oscila entre un 7% y un 1 0%; inclusive, algunas personas consideran
  que ese porcentaje es más alto. Me alarma saber que no hay protocolos estándares globales,
  respetados por toda la profesión médica, establecidos por el Ministerio de Salud Pública, que en
  última instancia debería proteger la salud pública.
titulo: Reclamó protocolos de ética médica estandarizados para pacientes sometidos a investigación
resumen: Planteó su preocupación por pacientes sometidos a protocolos de investigación médica sin
  ser informados de que participan en un ensayo, y reclamó al Ministerio de Salud Pública protocolos
  y comités de ética médica estandarizados para proteger sus derechos.
