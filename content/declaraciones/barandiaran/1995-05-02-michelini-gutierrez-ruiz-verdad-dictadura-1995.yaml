titulo: A 19 años de la aparición de sus cuerpos, pidió esclarecer la verdad sobre Michelini y
  Gutiérrez Ruiz
resumen: En la media hora previa, a diecinueve años de la aparición de los cuerpos de Zelmar
  Michelini y Héctor Gutiérrez Ruiz, pidió esclarecer la verdad sobre los hechos de la dictadura
  citando la reciente admisión de torturas y desapariciones del jefe del Ejército argentino, general
  Martín Balza, sin cuestionar el resultado del plebiscito de 1989 sobre la ley de caducidad.
