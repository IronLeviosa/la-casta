titulo: El gasto en Defensa Nacional está sobredimensionado para un país en paz
resumen: En el debate presupuestal, sostuvo que el gasto en el Ministerio de Defensa Nacional estaba
  sobredimensionado para un país en paz, y cuestionó que se privilegiara ese rubro con un aumento de
  sueldos mientras otros sectores del Estado quedaban postergados.
