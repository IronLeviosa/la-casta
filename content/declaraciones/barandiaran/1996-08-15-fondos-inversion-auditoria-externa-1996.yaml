politico: barandiaran
tema: economia
fecha: 1996-08-15
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: La pregunta que uno se hace es si se puede abrir la posibilidad de que un órgano externo, por
  ejemplo una auditoría externa, periódica- mente verifique si la entidad administradora está
  cumpliendo o no las condiciones establecidas en el contrato. De acuerdo con la historia uruguaya
  -tal vez abogando por esta solución-, debo decir que me sentiría más tranquilo si una auditoría
  externa -algunas hasta de rango internacional o aproba- das por el Banco Central del Uruguay, ya
  que muchas veces son utilizadas por este organis- mo- efectuara la fiscalización de las
  institucio- nes financieras.
titulo: Propuso que una auditoría externa controle a las administradoras de fondos de inversión
resumen: En el debate sobre la ley de fondos de inversión, propuso que el control de las sociedades
  administradoras pueda hacerse mediante una auditoría externa además de la sindicatura, para dar
  más garantías a los ahorristas que asumen el riesgo de esas colocaciones.
