politico: barandiaran
tema: derechos-humanos/datos-personales
fecha: 1996-09-04
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Para ser más claros: con un procesador Java ejecutando todo el tiempo en el televisor de una
  persona o en su teléfono celular y con un módem de cable en contacto permanente con Internet, no
  se tiene ninguna certeza de permanecer en el anonimato. El anonimato o la vida privada no es una
  conveniencia; es la protección contra la tiranía de la mayor.fa, es decir, proteger a los
  individuos impopulares de las represalias."
titulo: Advirtió sobre los riesgos de Internet para el anonimato y la vida privada
resumen: En la media hora previa, advirtió sobre los riesgos de Internet para la privacidad de las
  personas, mencionó un proyecto de ley del Nuevo Espacio sobre protección de datos personales, y
  criticó la ley estadounidense de "decencia en las comunicaciones" por vaga y restrictiva.
