politico: barandiaran
tema: empresas-publicas
fecha: 1998-03-19
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: El tema de fondo es que las empresas públicas actúan en régimen de monopolio y no necesitan
  este tipo de iniciativas que puede tener una empresa que actúa en régimen de competencia. La
  empresa que compite genera un costo -el del producto- y un precio de mercado que le da una
  rentabilidad, la que se genera de su propia gestión. Cuando existe monopolio esto no es más que un
  subsidio, el traslado de un costo -determinado en general administrativamente- que se vuelca como
  una mera transferencia, y no con el objetivo que deberfa tener. Las empresas públicas no tienen
  utilidades, sino precios obtenidos por decisiones administrativas.
titulo: Sostuvo que las empresas públicas no tienen utilidades sino precios fijados administrativamente
resumen: Al pedir el pase a comisión de un proyecto que buscaba limitar las donaciones de las
  empresas públicas, sostuvo que el problema de fondo es que esas empresas actúan en régimen de
  monopolio, por lo que sus "utilidades" son en realidad precios fijados administrativamente y no el
  resultado de competir en el mercado.
