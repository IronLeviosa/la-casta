cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Estos delitos no prescriben con el tiempo, aunque este Juez consideró que sr. Estos delitos no
  pueden ser eliminados por perdón o indulto, porque, repito, no son ni siquiera contra la persona a
  quien se está atacando; son contra toda la humanidad. Estos delitos -insisto- no prescriben. Nadie
  puede decir que por determinada ley o determinado plebiscito estos delitos están cubiertos.
titulo: Los crímenes de lesa humanidad no prescriben ni se cubren por ley o plebiscito
resumen: Al fundamentar una resolución de solidaridad con las víctimas de la matanza de las Fosas
  Ardeatinas, sostuvo que los crímenes de lesa humanidad no prescriben ni pueden cubrirse por ley o
  plebiscito, y extendió el reclamo de verdad a los desaparecidos y las víctimas de la dictadura
  uruguaya.
