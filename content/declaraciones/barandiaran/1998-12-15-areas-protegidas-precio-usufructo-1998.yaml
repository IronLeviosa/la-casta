politico: barandiaran
tema: medioambiente
fecha: 1998-12-15
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Pero, por otro lado, el Ministerio de Vivienda, Ordenamiento Territorial y Medio Ambiente tal
  vez pretenda limitar esa cantidad de personas y una de las formas de hacerlo podría ser
  estableciendo un precio alto, que impida una afluencia importante en esa zona. (Ocupa la
  Presidencia el señor Represen- tante Trobo) - Por eso este punto no lo veo así, en la medida en
  que éste no es un precio que se vaya a cobrar de acuerdo con la libre empresa y su producido no va
  a quedar a favor del propietario del establecimiento, sino que será volcado al Fondo de Areas
  Protegidas. En ese caso, veo justificable que el Poder Ejecutivo determine el precio.
titulo: Defendió que el Poder Ejecutivo fije el precio del usufructo en zonas protegidas
resumen: En el debate de la ley de áreas protegidas, defendió que el Poder Ejecutivo pueda fijar el
  precio que se cobra por el usufructo de una zona protegida, ya que ese producido no queda para el
  propietario del predio sino que se destina al Fondo de Áreas Protegidas.
