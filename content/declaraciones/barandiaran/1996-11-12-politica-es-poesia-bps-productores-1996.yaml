contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Hoy habilitamos la discusión de este proyecto sabiendo que lamentablemente no tuvimos el
  tiempo necesario para ponernos de acuerdo en un texto que beneficie a toda la ciudadanía y que
  cuente con el apoyo de todos los partidos políticos. Más aún: ahora nos enteramos de que, si se
  vota, vamos a hacer mucho dano a los pequenos y medianos productores."
titulo: Criticó aprobar con apuro una ley de aportes al BPS que podía dañar a pequeños productores
resumen: Criticó que se aprobara con apuro un proyecto sobre aportes al Banco de Previsión Social
  sin el análisis suficiente, señalando que el propio informe discorde reconocía que podía dañar a
  los pequeños y medianos productores, y comentó irónicamente que "a veces pensamos que la política
  es poesía".
