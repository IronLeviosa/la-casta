contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: no voy a reconocer nunca a los Directores o administradores de estas empresas públicas el
  derecho -hasta que la ley en algún caso lo establezca- de disponer con liberalidad de esos fondos
  que pertenecen a todos los uruguayos, que -como dije- somos los accionis- tas de estas empresas.
titulo: Votó en contra de que directores de empresas públicas dispongan de fondos para donaciones
resumen: Votó en contra de un proyecto que habilitaba a las empresas —incluidas las públicas— a
  disponer de fondos para acciones benéficas, argumentando que el dinero de las empresas públicas
  pertenece a todos los uruguayos y sus directores no pueden disponer de él con liberalidad sin que
  la ley lo autorice expresamente.
