cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Por lo tanto, quiero dejar en claro que el Nuevo Espacio no vota este artículo porque quiera
  liquidar a la empresa, sino todo lo contrario: porque pretende que ANCAP, como empresa de todos
  los uruguayos, tenga la oportunidad de seguir sobreviviendo en las nuevas condiciones económicas
  que al Uruguay le toca vivir."
titulo: Defendió que ANCAP se asocie con capital privado para sobrevivir, no para liquidarla
resumen: En el debate de la ley de desmonopolización de los alcoholes, defendió permitir que ANCAP
  se asocie con capital privado en sus actividades no monopólicas para que la empresa pueda competir
  y sobrevivir, no para liquidarla.
