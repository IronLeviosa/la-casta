titulo: Señaló que exonerar de impuestos autos de arrendamiento fomenta sociedades ficticias para evadir
resumen: Señaló, en el debate de la ley de promoción de inversiones, que la exoneración impositiva a
  la compra de autos para arrendamiento fomentaba la creación de sociedades de responsabilidad
  limitada ficticias para evadir el IVA y el IMESI en la compra de vehículos.
