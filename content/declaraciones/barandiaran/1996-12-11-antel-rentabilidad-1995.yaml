politico: barandiaran
tema: empresas-publicas
fecha: 1996-12-11
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: De acuerdo con pala- bras de su propio Vicepresidente, el senor Tabaré Viera, en 1995 la
  empresa facturó más de US$ 500:000.000 y obtuvo una ganancia superior a los US$ 100:000.000. Esto,
  que es muy bueno en una empresa que trabaja en un régimen competitivo -porque significa que obtie-
  ne alta rentabilidad en un mercado en el que es difícil moverse-, entra a ser cuestionable en el
  sistema donde actúan las empresas públicas.
titulo: Cuestionó la alta rentabilidad de ANTEL en 1995 por ser una empresa pública en monopolio
resumen: En el debate sobre habilitar a ANTEL a operar en el exterior, citando cifras de facturación
  y ganancia de la empresa en 1995 dadas por su entonces vicepresidente Tabaré Viera, cuestionó que
  una empresa pública en régimen de monopolio tenga ese nivel de rentabilidad extraída de sus
  usuarios, y advirtió sobre el riesgo de invertir esas ganancias en el exterior.
