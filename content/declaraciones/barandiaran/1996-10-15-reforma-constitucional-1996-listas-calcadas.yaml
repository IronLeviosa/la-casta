titulo: Votó a favor del balotaje y celebró el fin de las "listas calcadas" en la reforma de 1996
resumen: Votó a favor de la reforma constitucional de 1996 (que introdujo el balotaje y terminó con
  la doble candidatura simultánea), celebrando que las "listas calcadas" y la multiplicidad de
  candidatos presidenciales de un mismo partido quedaran en el pasado.
