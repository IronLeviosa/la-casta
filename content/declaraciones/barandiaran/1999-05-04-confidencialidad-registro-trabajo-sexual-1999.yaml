titulo: Pidió que el BPS no deje constancia del trabajo sexual en la historia laboral de una persona
resumen: En el debate de la ley que regulaba el trabajo sexual, pidió que el Banco de Previsión
  Social no dejara constancia del tipo de actividad en la historia laboral de quienes ejercían el
  trabajo sexual, para no vulnerar la confidencialidad que la propia ley pretendía garantizar en el
  registro sanitario.
