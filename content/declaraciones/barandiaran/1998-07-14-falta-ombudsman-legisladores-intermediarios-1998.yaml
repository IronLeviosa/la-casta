contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Muchas veces el ciudada- no como consumidor se encuentra frente a un Estado que es tan vasto
  que en algunos casos se hace poco sensible a los intereses de un usuario de determinado servicio.
  Ello hace que muchas veces tengamos que interceder, no con el fin de otorgarle un beneficio
  económico sino para hacer valer su derecho, en tanto nuestra sociedad no tiene un "Ombudsman".
titulo: Sin un Ombudsman, dijo, los legisladores terminan de intermediarios entre el ciudadano y el Estado
resumen: Señaló que, a falta de un Ombudsman en Uruguay, los legisladores terminan haciendo de
  intermediarios informales entre los ciudadanos y un Estado poco sensible a sus reclamos como
  consumidores, e incluso ante empresas privadas como las de tiempo compartido.
