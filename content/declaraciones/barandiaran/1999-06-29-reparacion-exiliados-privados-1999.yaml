cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Debemos reparar el daño que ha hecho la dictadura a nuestros conciudadanos. Bajo ningún
  concepto podemos decir que, porque hayan existido abusos en la aplicación de otras leyes, no se
  atienda el justo reclamo de reparación en estos casos.
titulo: Respaldó reparar a trabajadores privados presos y exiliados durante la dictadura
resumen: En una interpelación a la Ministra de Trabajo y Seguridad Social, respaldó la reparación de
  los trabajadores privados presos y exiliados durante la dictadura, y preguntó por el estado del
  proyecto de ley comprometido por el Poder Ejecutivo y su financiamiento.
