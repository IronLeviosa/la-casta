contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: El Nuevo Espacio no tiene miedo a los golpes bajos. Intentamos con todos nuestros medios hacer
  alta política. Podremos lograrlo en mayor o en menor medida, pero tampoco tenemos miedo a los
  golpes bajos. Si el tema tiene que ver con el tráfico de influencias, estamos a la orden.
titulo: Cuestionó que una denuncia de tráfico de influencias en ANTEL quedara sin pruebas
resumen: Ante una denuncia de tráfico de influencias del contador Lombardo sobre ANTEL, cuestionó
  que el denunciante respondiera con evasivas ("golpes bajos") cuando un periodista le pidió
  pruebas, y dijo que el Nuevo Espacio estaba "a la orden" para que el asunto se investigara a
  fondo.
