politico: barandiaran
tema: transparencia-corrupcion
fecha: 1996-04-09
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Creemos que como centros de la representación popular deberlamos dar el ejemplo en el manejo
  de las finanzas de nuestra propia Casa, siendo lo suficiente· mente cristalinos y claros como para
  evitar cualquier suspicacia en cuanto a por qué razón la Comisión Administrativa, que deberla
  actuar a la luz del dfa, tiene que hacerlo en plena clandestinidad, evitando que otros
  legisladores -que en todo momento pueden asistir a cualquier Comisión, ya sea de la Cámara de
  Diputados o de la de Senadores, salvo aquellas que sean secre- tas- puedan concurrir. ¿Por qué
  razón tenemos que trabajar con una Comisión Administrativa que actúe bajo secreto? ¿Secreto para
  qué?
titulo: Cuestionó que la Comisión Administrativa del Parlamento funcione "en plena clandestinidad"
resumen: Cuestionó que la Comisión Administrativa del Parlamento, que maneja buena parte del
  presupuesto del Poder Legislativo, funcionara "en plena clandestinidad" sin que otros legisladores
  pudieran participar ni siquiera como observadores, y reclamó mayor transparencia en el manejo de
  esos fondos.
