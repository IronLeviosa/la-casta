politico: barandiaran
tema: derechos-humanos/datos-personales
fecha: 1998-08-05
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "En Uruguay la situación es, tal vez, más alarmante. En nuestro país se compra y se vende
  información privada de las personas: nombre, dirección y teléfono; ingresos, en qué se gasta el
  dinero; a qué organizaciones se pertenece; si se hizo paro, huelga o se adhirió a alguna otra
  medida sindical en el pasado; si se es afiliado a un sindicato; el nombre del cónyuge; a qué
  colegio van los hijos, etcétera."
titulo: Denunció que en Uruguay se compra y vende información privada de las personas sin control
resumen: Denunció que en Uruguay se compraba y vendía información privada de las personas sin ningún
  control, mencionó que, según datos de prensa que citó, el Clearing de Informes había sido vendido
  en varios millones de dólares, y comparó la falta de regulación con el "Gran Hermano" de la novela
  "1984" de George Orwell.
