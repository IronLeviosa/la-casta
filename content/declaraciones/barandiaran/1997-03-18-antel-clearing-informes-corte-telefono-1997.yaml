  monopolio puede negarlo.
titulo: Cuestionó que ANTEL niegue el teléfono a quienes están en el Clearing de Informes
resumen: En el Día Internacional de los Derechos del Consumidor, criticó que ANTEL denegara el
  servicio telefónico a las personas registradas en el Clearing de Informes, y pidió una ley de
  protección al consumidor, de la que Uruguay aún carecía.
