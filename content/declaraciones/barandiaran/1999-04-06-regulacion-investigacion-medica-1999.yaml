titulo: Uruguay no tenía una norma que regulara la ética de la investigación médica en humanos
resumen: Informó que, tras un pedido de informes que había enviado en agosto de 1998, el Ministerio
  de Salud Pública reconoció que no existía una norma legal ni procedimientos que regularan la ética
  de la investigación médica en seres humanos en Uruguay, y pidió avanzar en una legislación al
  respecto.
