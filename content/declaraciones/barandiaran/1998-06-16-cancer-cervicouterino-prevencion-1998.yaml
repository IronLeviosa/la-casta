cita: Uruguay tiene uno de los fndices más altos en el mundo en cuanto a la existencia de cáncer
  cervical. Esta dolencia ocupa el segundo lugar entre los tipos de cáncer que afectan a las
  mujeres. Se detectan actualmente seiscientos casos por año, y cien personas fallecen.
titulo: Alertó que Uruguay tiene una de las tasas más altas del mundo de cáncer cervicouterino
resumen: En el Día Internacional por la Salud de la Mujer, alertó que Uruguay tenía una de las tasas
  más altas del mundo de cáncer cervicouterino —600 casos y 100 muertes por año, según sus datos—, y
  propuso políticas de detección temprana como las aplicadas en Canadá, que habían llevado la
  mortalidad a cero.
