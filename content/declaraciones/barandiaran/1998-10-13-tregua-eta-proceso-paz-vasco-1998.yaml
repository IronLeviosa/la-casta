titulo: Saludó la tregua unilateral de ETA y pidió no poner obstáculos al proceso de paz vasco
resumen: Saludó la declaración de tregua unilateral de ETA y el proceso de paz vasco de 1998, y
  pidió al gobierno español y a la comunidad internacional no poner obstáculos a esa oportunidad de
  resolución pacífica del conflicto.
