cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: La pregunta que deseo hacer es por qué razón nuestra sociedad sigue permitiendo que se abuse
  de estos ninos. Sé que no es un tema fácil; no se puede erradicar la pobreza de un día para otro.
  Las causas sociales que la explican son muy profundas.
titulo: Preguntó si la sociedad hace lo posible para proteger a los niños de la calle en Montevideo
resumen: En la media hora previa, planteó la situación de los niños de la calle en Montevideo y
  preguntó si la sociedad uruguaya estaba haciendo todo lo posible para protegerlos de la pobreza y
  de los riesgos de abuso a los que quedan expuestos.
