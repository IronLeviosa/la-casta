politico: barandiaran
tema: derechos-humanos
fecha: 1996-04-17
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: Por supuesto que existen cuentas pendientes. Es claro que existen. Hay una cuenta pendiente
  con los Oficiales que actualmente se encuentran en situación de reforma; también hay una cuenta
  pendiente con aquellas personas que estuvieron exiliadas y en la actualidad no pueden jubilarse
  porque no se les compu- ta el período jubilatorio. Hay 1,1na cuenta pendiente con los funcionarios
  de AEBU que no pudieron ingresar a sus trabajos en 1985, porque directamente no se respe- tó una
  ley, a la que tenían derecho. También, lamentablemente, está la cuenta pendien- te de los
  desaparecidos durante el período dictatorial; hoy por hoy, ni siquiera sabemos dónde están sus
  restos.
titulo: Señaló cuentas pendientes con exiliados, funcionarios de AEBU y desaparecidos de la dictadura
resumen: En el debate sobre una compensación a jefes y oficiales militares, señaló que también
  existían "cuentas pendientes" con los exiliados que no podían jubilarse, con los trabajadores de
  AEBU no reincorporados en 1985 y con los desaparecidos durante la dictadura, de quienes aún no se
  sabía el paradero de sus restos.
