titulo: Pidió máxima energía ante el ingreso irregular de ganado para no retroceder frente a la aftosa
resumen: En el debate sobre el ingreso irregular de ganado desde la frontera, pidió a las
  autoridades actuar "con la máxima energía y rigor" para no retroceder en la condición de país
  libre de fiebre aftosa.
