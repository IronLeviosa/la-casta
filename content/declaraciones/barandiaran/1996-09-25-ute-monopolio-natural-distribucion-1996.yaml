titulo: La distribución eléctrica, por ser un monopolio natural, debe permanecer siempre en manos de UTE
resumen: Al fundamentar el voto afirmativo en general de la ley de marco regulatorio del sector
  eléctrico, planteó como salvedad que la distribución de energía, por ser un monopolio natural,
  debía permanecer siempre en manos de UTE y no habilitarse su concesión a privados; luego votó en
  contra del artículo que permitía esa concesión.
