politico: barandiaran
tema: economia/empleo
fecha: 1997-12-17
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: el Nuevo Espacio ha votado coherentemente en forma negativa, por un lado, el proyecto de ley
  en general y, por otro, su columna vertebral, que es el artículo 18, por considerar que atenta de
  manera directa contra el empleo. Obviamente, las empresas van a ser más productivas y van a tener
  la posibilidad de obtener fondos para hacer inversiones. Sin embargo, las inversiones en una
  empresa en general significan más máquinas y menos gente. En los hechos, las empresas uruguayas
  han ido incrementando sus exportaciones en los últimos tres anos -en un 16%, 1O% y 13%-, no
  obstante lo cual la desocupación ha venido aumentando en forma sostenida, salvo una pequeíia
  dismi- nución en el último alío.
titulo: Votó en contra de la ley de inversiones por considerar que su artículo 18 atenta contra el empleo
resumen: Votó en contra de la ley de promoción de inversiones por considerar que la exoneración de
  aportes patronales de su artículo 18 fomenta la sustitución de mano de obra por maquinaria,
  señalando que el crecimiento de las exportaciones de los tres años previos no había impedido que
  la desocupación siguiera en aumento.
