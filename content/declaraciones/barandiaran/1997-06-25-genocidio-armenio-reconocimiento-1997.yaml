contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: En 1920, Uruguay es uno de los primeros Estados en reconocer oficialmente a la República
  Armenia. En 1965, fue el primer país en el mundo que reconoció oficialmente el genocidio armenio,
  y el 4 de diciembre de 1991 nuestro gobierno establece relaciones con la República Armenia, en un
  segundo reconocimiento.
titulo: Repasó que Uruguay reconoció a Armenia en 1920 y su genocidio en 1965
resumen: Al fundamentar el apoyo a un proyecto vinculado con la comunidad armenia que dijo haber
  presentado el año anterior, repasó que Uruguay reconoció a la República de Armenia en 1920, fue el
  primer país en reconocer oficialmente el genocidio armenio en 1965 y restableció relaciones en
  1991, y mencionó que entre 13.000 y 15.000 armenios o descendientes vivían en Uruguay.
