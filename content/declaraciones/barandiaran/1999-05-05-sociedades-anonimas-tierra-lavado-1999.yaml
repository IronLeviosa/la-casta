politico: barandiaran
tema: transparencia-corrupcion
fecha: 1999-05-05
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: 'Sinceramente, me preocupa mucho que la mayoría de los apartamentos de Punta del Este
  pertenezcan a sociedades anónimas por accio- nes al portador porque cuando alguien nos dice que
  allí se lava dinero, es difícil decir que no. Uno va por la carretera y encuentra edificios que
  sorprenden. A veces decimos: "Esto no es Uruguay", pero no sabemos a quién pertenecen. Les
  cobramos la ContribUCión Inmobiliaria y los impuestos, pero no sabemos quiénes son los dueños.
  Cada tanto, el Departamento de Estado de Estados Unidos nos viene con comentarios diciendo, por
  ejemplo, que en nuestro país se lava dinero, y no podemos decir que no. Podemos plantear que se
  invierta la carga de la prueba y que nos digan si efectivamente ello ocurre. Sin embargo, no
  contamos con elemen- tos. ¿Debemos permitir que ocurra lo mismo con la tierra?'
titulo: El anonimato de las sociedades dueñas de apartamentos en Punta del Este no permite descartar
  el lavado
resumen: Se opuso al proyecto que habilitaba a las sociedades anónimas a ser propietarias de
  inmuebles rurales, señalando que el anonimato de las sociedades por acciones al portador impide
  saber quiénes son los dueños de la propiedad urbana -como ocurre en Punta del Este- y que por eso
  no se puede descartar que ese anonimato facilite el lavado de dinero.
