politico: barandiaran
tema: empresas-publicas
fecha: 1996-09-25
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: "Señor Presidente: en el transcurso del trabajo de la Comisión me he visto sorprendido
  grandemente ante la constatación de que UTE como empresa no lleva contabilidades separadas en las
  actividades de generación, trasmisión y distribución. Es indu- dable que ello conduce a que no
  pueda preverse ni observarse cuál es la verdadera asignación de costos; uno se pregunta cómo una
  empresa pública de esta naturaleza puede tomar decisio- nes adecuadas con la falta de información
  que esto le significa."
titulo: UTE no lleva contabilidad separada entre generación, transmisión y distribución de energía
resumen: Durante la discusión particular del marco regulatorio eléctrico, señaló que UTE no llevaba
  contabilidad separada por actividad (generación, transmisión y distribución), lo que a su juicio
  impedía conocer la verdadera asignación de costos de la empresa, y pidió que la norma exigiera esa
  separación en vez de solo facultarla.
