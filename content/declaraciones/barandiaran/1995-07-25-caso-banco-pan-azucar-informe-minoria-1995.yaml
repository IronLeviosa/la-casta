      cita: Como consecuencia de las referidas actua- cíones resultan nuevos elementos de juicio y
        antecedentes cuya dilucidación -de conformidad con lo dispuesto por el artículo 28 de la Ley
        N2 16.698, de 25 de abril de 1995- correspondería a la Justi- cia competente justipreciar si
        se han configurado o no ilícitos penales y determinar las responsa- bilidades que pudieren
        corresponder, a Ccuyos efectos se pasan a la misma todos los antecedentes reunidos por esta
        Comisión, las actas de sus reuniones y la documentación manejada, asf como la versión
        taquigráfica de esta sesión.
