politico: barandiaran
tema: seguridad
fecha: 1998-04-01
contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: como respuesta a un pedido de informes, se ha recibido el inventario correspondiente al
  "stock" de minas antipersonales que tiene nuestro Ejército. Esperamos que con este proyecto -que
  expresa la voluntad del Parlamento de adherir a este Tratado relativo a la prohibición del empleo
  de un artefacto que va más allá de lo que se puede establecer como arma- el Poder Ejecutivo y el
  Ejército Nacional actúen en consecuencia y procedan a la destrucción de nuestro escaso pero
  importante arsenal de minas antipersonales.
titulo: Votó a favor de adherir al tratado que prohíbe las minas antipersonales
resumen: Votó a favor de que la Cámara adhiriera al tratado de prohibición de minas antipersonales,
  e informó que había recibido, por un pedido de informes, el inventario del stock de minas del
  Ejército uruguayo, esperando que se procediera a su destrucción.
