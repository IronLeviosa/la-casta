contexto: parlamento
cargo_en_ese_momento: Representante Nacional por Montevideo (Nuevo Espacio)
cita: el Nuevo Espacio, con la firma de sus cinco Diputados, ha presentado un proyecto de ley que
  tiende a regularizar este tipü de situaciones, a fin de que sea estudiado por la Comisión de
  Hacienda. Reitero que si bien el producto es bueno, generarlo sin las garantías de una
  modificación en el ámbito legal puede resultar perjudicial para el trabajador y provocar
  situaciones no deseadas para el em- pleador y, por supuesto, para la institución ban- cana que
  ofrece este producto como servicio.
titulo: Presentó un proyecto para regular el pago de salarios por acreditación bancaria
resumen: Presentó, junto a toda la bancada del Nuevo Espacio, un proyecto de ley para regular el
  pago de salarios mediante acreditación bancaria, advirtiendo que sin un marco legal esa modalidad
  podía perjudicar a los trabajadores por el secreto bancario y la inembargabilidad de los créditos
  laborales.
