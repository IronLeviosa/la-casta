titulo: Prometer no subir impuestos ni la edad jubilatoria se hace para conseguir votos
cita: Obviamente que se hace para conseguir votos
resumen: En el mismo comité de base de Trouville del 7 de marzo de 2024 (misma intervención que la
  declaración anterior sobre "liviandad y frivolidad"), Orsi sostuvo que prometer no subir impuestos
  ni la edad jubilatoria se hacía para conseguir votos, y llamó a la ciudadanía a "cobrar" ese tipo
  de actitudes.
