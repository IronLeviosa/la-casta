resumen: En un comité de base en Trouville, Orsi cuestionó como livianas y frívolas las promesas de
  no subir impuestos ni la edad jubilatoria, criticando en particular la promesa de no subir
  impuestos del entonces candidato oficialista Álvaro Delgado, y dijo que ese tipo de promesas se
  hacían para conseguir votos.
