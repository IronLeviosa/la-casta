    propia, atribuyó parte de la pérdida de 2024 a que el gobierno de Lacalle Pou fijó ajustes por
    debajo del PPI de Ursea). No se incorpora al resumen porque es un hecho distinto (la disputa en
    sí, no lo que dijo Orsi); queda documentada en
