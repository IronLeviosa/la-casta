titulo: Ancap vuelve a números negativos «después de 10 años» y su deuda llega a US$ 255 millones
cita: Lo primero que tenemos para decir es que volvemos después de 10 años a tener números negativos
  en el balance de la empresa ANCAP. Para poner un ejemplo, en el año 19 ANCAP daba 41 millones de
  dólares de ganancia, y en el año 24 el resultado es un resultado de pérdida de 118 millones. Otro
  dato que hay que tener en cuenta, fundamentalmente porque no es un dato común, sino que es una
  novedad, novedad con la que se encuentra el nuevo directorio, es que en el mes de noviembre el
  anterior gobierno autorizó un crédito y se pidió un préstamo por 160 millones de dólares, lo que
  hace que la deuda total de Ancap hoy sea de 255 millones.
resumen: Orsi dijo que Ancap volvió a tener resultados negativos "después de 10 años" y que la deuda
  total de la empresa asciende a 255 millones de dólares.
