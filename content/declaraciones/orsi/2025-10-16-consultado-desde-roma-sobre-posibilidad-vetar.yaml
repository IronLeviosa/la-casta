    alguno registra la frase con marca de tiempo: de ser así, sería fuente documento_oficial/video y
    subiría el nivel de evidencia a textual, resolviendo el _faltante sin necesidad de una segunda
    nota de prensa. Cronología: esta declaración es del 16/10/2025, ocho días antes de que
    Iafigliola pidiera el veto (24/10/2025, mismo día en que la ley se promulgó); no es una
    respuesta a ese pedido, ver notas.md.'
