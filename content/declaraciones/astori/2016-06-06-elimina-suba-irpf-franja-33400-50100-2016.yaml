resumen: Confirmó que, por acuerdo entre el Gobierno y los parlamentarios del Frente Amplio, se
  eliminó del proyecto de Rendición de Cuentas el incremento del IRPF para la franja de salarios
  entre $33.400 y $50.100, once días después de haber defendido esa suba como necesaria.
