cargo_en_ese_momento: Ministro de Economía y Finanzas
titulo: Dijo que el espacio fiscal para nuevo gasto era cero en la Rendición de Cuentas de 2018
cita: El espacio fiscal propuesto por el Ministerio de Economía es cero, es decir que todo lo que se
  quiera colocar como gasto debe tener su correspondiente financiamiento
resumen: En rueda de prensa, ante pedidos de mayor gasto para llegar al 6% del PIB en educación,
  dijo que el espacio fiscal propuesto por el Ministerio de Economía para nuevo gasto era cero, es
  decir que todo lo que se quisiera agregar debía tener su financiamiento. El País agregó, sin citar
  una fuente, que el gobierno "descartó la posibilidad de aumentar la carga impositiva".
