resumen: En la discusión en comisión general del proyecto de ajuste tributario enviado por el Poder
  Ejecutivo, señaló que el texto no dejaba clara la tasa del impuesto a las retribuciones personales
  que se aplicaría a los funcionarios públicos exceptuados de la tasa máxima.
