titulo: Pidió una reforma integral del sistema tributario vigente
cita: Quisiéramos que algún día el país abordara, en conjunto, el sistema tributario vigente
resumen: Al intervenir sobre un proyecto que corregía el cálculo del Impuesto al Patrimonio sobre el
  valor ficto del ajuar y los inmuebles rurales, dijo que se trataba de una corrección puntual del
  sistema de cálculo y expresó su deseo de que el país abordara alguna vez, en conjunto, una reforma
  del sistema tributario vigente.
