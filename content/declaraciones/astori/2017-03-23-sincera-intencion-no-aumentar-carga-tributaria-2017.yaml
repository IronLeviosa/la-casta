resumen: En una entrevista radial dijo que la intención del gobierno era no aumentar la carga
  tributaria sobre la producción, el nivel de actividad, el empleo y el ingreso, y que ese nivel "no
  debería ser necesario aumentar". Lo dijo después de que Vázquez, aunque había afirmado que no
  estaba en los planes del gobierno aumentar la carga tributaria, dejara abierta esa puerta al decir
  que, de subir, no recaería en la clase media.
