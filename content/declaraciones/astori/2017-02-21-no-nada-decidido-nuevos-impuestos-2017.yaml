cita: No hay nada decidido sobre nuevos impuestos o subir los que ya existen
resumen: En una entrevista radial, tras la filtración a la prensa de un documento de la Comisión de
  Programa del Frente Amplio, desmintió que hubiera una decisión de crear nuevos impuestos o subir
  los existentes y dijo que se trataba de propuestas de grupos del FA que no necesariamente se
  reflejarían en la propuesta del Poder Ejecutivo.
