titulo: Dijo que subir los impuestos para mejorar los ingresos fiscales era una opción descartada
cita: Aumentando los impuestos que no lo vamos a hacer o incrementando el nivel de actividad, algo
  que estamos convirtiendo en nuestro principal desafío
resumen: En un foro sobre inversión y empleo organizado por Somos Uruguay, dijo que para mejorar los
  ingresos fiscales había dos caminos, subir los impuestos o aumentar el nivel de actividad
  económica, y que la primera opción no se iba a tomar.
