cargo_en_ese_momento: Senador de la República
titulo: En el debate del COFIS, cuestionó financiar la reactivación económica con endeudamiento
cita: Prometo que mi intervención va a ser muy breve y que no va a sacar al señor Senador Heber de
  su línea argumental. Quería aportar un razonamiento para que manejemos con precisión algunas
  cifras con respecto a lo que significaría el camino del endeudamiento. El país tiene una deuda
  pública neta de aproximadamente U$S 2.900:000.000, reservas por más de U$S 2.000:000.000 y una
  deuda bruta que supera los U$S 5.000:000.000.
resumen: En la discusión general del proyecto que rebajaba impuestos a la producción nacional y
  creaba el COFIS para financiar la seguridad social, interrumpió al senador Heber para cuestionar
  con cifras de deuda pública la alternativa de financiar la reactivación económica con
  endeudamiento en lugar de las medidas del proyecto en debate.
