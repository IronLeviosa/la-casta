politico: astori
tema: economia/impuestos
fecha: 1999-09-01
contexto: parlamento
cargo_en_ese_momento: Senador de la República
titulo: Dijo que no se puede conformar a la vez a quien paga impuestos y a quien recibe beneficios
cita: no es posible quedar bien con los que no tienen que pagar los impuestos y, al mismo tiempo,
  hacer lo propio con quienes reciben los beneficios, sin tener en cuenta de dónde salen los
  recursos
resumen: Al defender el respaldo del Frente Amplio a una extensión de las asignaciones familiares
  pese a rechazar su forma de financiamiento, retomó un argumento del senador Pozzolo y del contador
  Davrieux para decir que no se puede conformar a la vez a quienes pagan impuestos y a quienes
  reciben beneficios sin considerar de dónde salen los recursos.
