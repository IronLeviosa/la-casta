titulo: Dijo que esperaba que la corrección fiscal de 2016 fuera suficiente y no debiera repetirse
cita: Esto se dijo de buena fe, como digo ahora de buena fe que no quisiera seguir modificando el
  sistema impositivo. Esa es mi voluntad a la luz de la realidad actual. Y mi esperanza es que esta
  corrección fiscal sea suficiente en el país y no tengamos que hacer otra.
resumen: En la misma interpelación dijo que esperaba no tener que volver a modificar el sistema
  impositivo después del ajuste de 2016.
