titulo: Anunció el ajuste fiscal de 2016, con el 80% de la recaudación adicional a cargo del 10% de
  mayores ingresos
cita: Las modificaciones de tasas no afectarán a los trabajadores y pasivos en 70 % de menores ingresos
resumen: En conferencia de prensa, al presentar el proyecto de Rendición de Cuentas, anunció subas
  del IRPF y del IASS para los tramos de ingresos más altos, una nueva rebaja del IVA en compras con
  débito y la postergación de gastos previstos para 2017, y dijo que el 80% de la recaudación
  adicional recaería sobre el 10% de mayores ingresos.
