contexto: gobierno
cargo_en_ese_momento: Ministro de Economía y Finanzas
titulo: Anunció que 65.000 trabajadores dejarían de pagar IRPF por un cambio en la liquidación del
  aguinaldo
cita: 65.000 trabajadores con ingresos inferiores a 27.000 pesos dejarán de pagar el impuesto.
  Puntualizó que serán 133.000 el total de beneficiados y precisó que el 93 % perciben ingresos
  nominales inferiores a 50.000 pesos.
resumen: En conferencia de prensa informó que, tras un cambio en la liquidación del IRPF sobre el
  aguinaldo y el salario vacacional, 65.000 trabajadores de menores ingresos dejarían de pagar el
  impuesto, dentro de un total de 133.000 beneficiados (93% con ingresos menores a $50.000). Precisó
  que parte de los recursos para financiar esa exoneración saldrían de la reinstalación del Impuesto
  de Primaria a productores agropecuarios que estaban exonerados.
