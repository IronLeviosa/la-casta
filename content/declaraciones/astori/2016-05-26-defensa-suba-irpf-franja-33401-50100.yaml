politico: astori
tema: economia/impuestos
fecha: 2016-05-26
contexto: gobierno
cargo_en_ese_momento: Ministro de Economía y Finanzas
titulo: Defendió la suba del IRPF del 15% al 18% para la franja entre $33.401 y $50.100
cita: Hay que tener en cuenta la forma en la que se liquida el impuesto a la renta. Obviamente se
  está buscando un cierto monto de recaudación que se distribuya equitativamente, pero el impuesto
  se liquida progresionalmente y si uno elimina franjas no está afectando solo a la franja que
  elimina sino a la liquidación de todo el impuesto porque, digamos, dejar de cobrar impuesto en
  determinada franja, y lo hemos hecho para la de más abajo, es que dejen de contribuir por esa
  franja de ingresos todos los contribuyentes. Esto es si a la franja entre $ 33.401 y $ 50.100 no
  le estoy definiendo una alícuota algo más alta, entonces afecto la liquidación de todo el
  impuesto, de todos los contribuyentes
resumen: Dijo, en radio Carve, que no se podía eliminar el aumento del IRPF para los salarios
  nominales entre $33.401 y $50.100 sin afectar la liquidación de todo el impuesto para todos los
  contribuyentes. El País, que reportó la entrevista, consignó que ese aumento era del 15% al 18%;
  esa cifra no está entre las palabras de Astori citadas en la nota.
