contexto: parlamento
cargo_en_ese_momento: Senador de la República
titulo: Respaldó ampliar la exoneración del Impuesto al Patrimonio para productores agropecuarios
cita: En primer lugar, un avance de esta medida ya fue aprobado por el Parlamento y, en particular,
  por este Senado, para aquellos productores que venían pagando -en aquel entonces y a precios de
  esa época- hasta $4.000 de Impuesto al Patrimonio. Esta propuesta que ahora se formula en este
  proyecto va exactamente en el mismo sentido.
resumen: En el debate de la reforma tributaria para el agro, dijo que el proyecto extendía en el
  mismo sentido un beneficio ya aprobado antes por el Senado para los productores agropecuarios que
  pagaban montos bajos de Impuesto al Patrimonio.
