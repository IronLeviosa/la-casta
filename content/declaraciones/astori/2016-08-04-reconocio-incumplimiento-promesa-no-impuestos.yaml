contexto: parlamento
cargo_en_ese_momento: Ministro de Economía y Finanzas
titulo: Reconoció ante el Senado que el anuncio de no subir los impuestos, hecho con Vázquez, no se cumplió
cita: Cuando dijimos «no vamos a poner más impuestos», era porque no queríamos hacerlo. Esa era
  nuestra voluntad política, pero la realidad cambia y nos obliga a nosotros a cambiar. Hay que
  reconocer que el anuncio no se cumplió, como lo estoy haciendo en este momento, pero a quienes me
  están escuchando les pido que no tengan la más mínima duda de que no hubo intención de mala fe, en
  absoluto.
resumen: Interpelado en el Senado por la Rendición de Cuentas de 2016, reconoció que el anuncio
  hecho junto con Vázquez de que no se iban a subir los impuestos no se cumplió.
