politico: astori
tema: economia/impuestos
fecha: 2014-05-24
contexto: entrevista
cargo_en_ese_momento: Vicepresidente de la República
titulo: Descartó un ajuste fiscal y anticipó una baja de la carga tributaria si el FA ganaba un
  tercer gobierno
cita: Si ese es el concepto de ajuste fiscal niego enfáticamente que vaya a haber ajuste fiscal. ¡No
  va a haber ajuste fiscal en el país, no va a haber ajuste fiscal! No va a haber ajuste porque la
  situación fiscal es sostenible. Esto no quiere decir que no haya que tener cautela con el gasto y
  sin duda que la vamos a tener porque el orden y la estabilidad macroeconómica lo requiere. Lo
  hemos tenido en cuenta hasta ahora y lo vamos a seguir teniendo en cuenta en el futuro. Respecto a
  la otra hoja del tema fiscal que son los ingresos y el sistema tributario nuestro objetivo es
  exactamente el inverso, es ir disminuyendo la carga tributaria. Estoy hablando en términos
  generales porque hay quienes deben pagar más porque tienen mayor capacidad y quienes tienen que
  pagar menos porque tienen menor capacidad. Nosotros queremos disminuir la carga tributaria media
  que tiene la población beneficiando especialmente a los que más lo necesitan.
resumen: En una entrevista, meses antes de la campaña de 2014, definió el ajuste fiscal como una
  contención generalizada del gasto y una carga impositiva creciente, dijo que no lo habría porque
  la situación fiscal era sostenible, y afirmó que el objetivo era bajar la carga tributaria media
  de la población, aclarando que quienes tienen mayor capacidad de pago pagarían más.
