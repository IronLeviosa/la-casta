politico: astori
tema: economia/impuestos
fecha: 2016-08-04
contexto: parlamento
cargo_en_ese_momento: Ministro de Economía y Finanzas
titulo: Dijo que el 17% de trabajadores y pasivos pagaría más, el 67% no pagaría y el 15% pagaría lo mismo
cita: La gráfica que estamos viendo en pantalla nos muestra que solo el 17 % de los trabajadores y
  pasivos pagará más impuestos que en la actualidad. El 67 % de los trabajadores y pasivos no paga
  ni pagará impuesto. Luego, el 15 % paga lo mismo, y solamente el 17 % de trabajadores y pasivos
  –insisto– va a pagar un poco más de lo que paga hoy.
resumen: En la interpelación, mostrando una lámina del Ministerio de Economía, dijo que por los
  ajustes al IRPF y al IASS el 17% de trabajadores y pasivos pagaría más, el 67% no paga ni pagaría
  el impuesto, y el 15% restante pagaría lo mismo que hasta entonces.
