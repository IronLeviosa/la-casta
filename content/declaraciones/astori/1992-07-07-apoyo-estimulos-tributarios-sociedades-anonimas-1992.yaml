cargo_en_ese_momento: Senador de la República
titulo: Respaldó estímulos tributarios a sociedades anónimas por estimular la inversión productiva
cita: Por compartir ese contenido y esta coherencia. nosotros acompañamos la iniciativa, ya que en
  última instancia, se trata de estimular la inversión productiva en el país.
resumen: En el debate de un proyecto de ley que ampliaba estímulos tributarios a la constitución de
  sociedades anónimas y a la ampliación de su capital, dijo que acompañaba la iniciativa por
  considerarla coherente con normas similares ya votadas por el Senado en 1990 y por estimular la
  inversión productiva.
