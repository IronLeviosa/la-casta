cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que el gobierno de Mujica estaba "empantanado" por gastar más de lo que recauda en impuestos
cita: "La política económica del gobierno fue equivocada. El gobierno gasta más dinero del que
  percibe por los impuestos. Por lo tanto tiene que pedir dinero prestado. Esa cantidad tan
  importante que el gobierno pidió prestado, hace que lo que paga de intereses sea muy alto: una
  cifra y cantidad muy alta. Tampoco puede aumentar esa cantidad porque va a perder otro tipo de
  posibilidades, que mantiene, de que le continúen prestando dinero"
resumen: En declaraciones a radio Montecarlo, calificó de equivocada la política económica del
  gobierno de José Mujica porque el gasto público superaba la recaudación impositiva, lo que
  obligaba a un endeudamiento creciente y a pagar intereses altos.
