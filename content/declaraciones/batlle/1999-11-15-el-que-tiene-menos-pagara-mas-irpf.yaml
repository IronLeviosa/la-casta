titulo: En el balotaje de 1999 advirtió que el IRPF propuesto por el EP-FA perjudicaría a la clase media
cita: El que tiene menos va a pagar más y el que tiene más se va a escapar
resumen: En la segunda quincena de noviembre de 1999, durante la campaña del balotaje, advirtió que
  el Impuesto a la Renta de las Personas Físicas (IRPF) propuesto por el Encuentro
  Progresista-Frente Amplio perjudicaría más a quienes menos tienen. La frase la reconstruye una
  nota de 2019 que la ubica en el contexto de una guerra de avisos de campaña entre ambos
  candidatos, sin precisar el día exacto ni si la dijo en un discurso, una entrevista o un aviso.
