titulo: "Defendió el segundo ajuste fiscal en cuatro meses: subir impuestos no le gusta a nadie"
cita: votando leyes que nunca son gratas porque votar impuestos nunca es grato; es lindo bajar
  impuestos, pero subir impuestos no le gusta a nadie.
resumen: En un coloquio sobre la inserción internacional del país, se refirió al segundo ajuste
  fiscal en cuatro meses que el Parlamento votaría esa misma tarde (la Ley de Estabilidad Fiscal,
  aprobada días después) como una muestra del sentido de responsabilidad del sistema político, y
  dijo que subir impuestos no le gusta a nadie aunque haya que hacerlo.
