cargo_en_ese_momento: Expresidente de la República (líder de la Lista 15, Partido Colorado)
titulo: Dijo que Astori estaba políticamente muerto por el IRPF y por tener que modificarlo al mes
  de vigencia
cita: Astori está muerto, políticamente está muerto, porque implementó como la bandera principal de
  su gestión el Impuesto a la Renta de la Persona Física, y al mes de estar ese impuesto a la renta
  vigente, hasta el propio Presidente de la República dice que hay que modificarlo subiendo la base
  imponible, y el ministro de Economía se entera de eso por la prensa
resumen: Como expresidente, dijo que el ministro de Economía Danilo Astori estaba políticamente
  acabado por haber impulsado el IRPF como bandera de su gestión y tener que aceptar modificarlo al
  mes de entrar en vigencia.
