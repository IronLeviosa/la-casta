politico: batlle
tema: economia/impuestos
fecha: 2016-09-21
contexto: entrevista
cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que 2017 sería peor porque los impuestos se empezarían a cobrar desde enero
cita: No, el año que viene es peor porque los impuestos los van a empezar a cobrar desde enero. El
  tipo de cambio estará más o menos en lo mismo. Si usted vende un litro de leche le van a pagar en
  pesos, pero no le van a bajar impuestos ni combustibles, porque aunque ANCAP mienta tranquilamente
  y Astori diga que es una maravilla, le están cobrando el combustible por encima de lo que vale.
  Los costos para producir no le van a bajar, y la plata que va a recibir va a ser menos que la que
  recibió hasta ahora
resumen: En una entrevista con El Observador realizada el 21 de setiembre de 2016 por el periodista
  Leandro Gómez, y publicada como resumen de esa entrevista el 25 de octubre, un día después de su
  muerte, dijo que 2017 iba a ser un año económicamente peor porque nuevos cobros de impuestos
  empezarían a aplicarse desde enero, y acusó a ANCAP de cobrar el combustible por encima de su
  valor real y a Astori de presentarlo como algo positivo.
