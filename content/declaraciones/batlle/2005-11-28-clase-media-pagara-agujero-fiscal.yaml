resumen: En la misma entrevista sostuvo que la clase media terminaría pagando el costo fiscal de las
  rebajas de impuestos a empresas y bancos previstas en la reforma tributaria, para evitar un
  desequilibrio en las cuentas públicas. Su partido, adelantó, no votaría el proyecto por su
  carácter permanente.
