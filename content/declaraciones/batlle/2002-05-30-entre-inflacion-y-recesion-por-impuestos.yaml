politico: batlle
tema: economia/impuestos
fecha: 2002-05-30
contexto: entrevista
cargo_en_ese_momento: Presidente de la República
titulo: Ante la consulta de si subir impuestos era recesivo, respondió con ironía sobre inflación y
  recesión
cita: Sabe una cosa, es muy interesante lo que usted me dice, sino ponemos los impuestos caemos en
  la inflación, si ponemos los impuestos caemos en la recesión. Es realmente interesante y hasta
  divertido
resumen: En la misma entrevista con Bloomberg News (30/5/2002) en la que había dicho, minutos antes,
  que habían votado el Ajuste Fiscal "para terminar con el déficit", ante la pregunta de si no sería
  recesivo aumentar los impuestos respondió, en tono irónico, que si no los subían caían en
  inflación y si los subían caían en recesión, y calificó la pregunta de "interesante y hasta
  divertida".
