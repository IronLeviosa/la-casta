politico: batlle
tema: economia/impuestos
fecha: 2013-02-05
contexto: entrevista
cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que no ajustar las franjas menores del IRPF y el IASS costó $2.500 millones a los de
  menor ingreso
cita: El ajuste fiscal que acaba de hacer el gobierno, lo explicó (el director de la Asesoría
  Macroeconómica y Financiera del Ministerio de Economía) Massoller, que dijo que ante el hecho de
  la delicada situación fiscal no podían modificar los cobros del IRPF y del IASS en los grados
  menores. Al no modificarlo - por el aumento que han tenido los sueldos en el pasado - le están
  cobrando al que está por encima de la primera franja, $ 2.500 millones para poder pagar el aumento
  de gasto de la última rendición de cuentas de U$S 140 millones y eso lo está pagando el
  funcionario que tiene el menor ingreso de la sociedad
resumen: En declaraciones a radio Montecarlo, dijo que el gobierno decidió no ajustar los tramos
  menores del IRPF y el IASS pese al aumento de sueldos, lo que según él significó cobrarle a los
  contribuyentes de menores ingresos unos $2.500 millones adicionales para financiar un aumento de
  gasto de US$ 140 millones aprobado en la última rendición de cuentas.
