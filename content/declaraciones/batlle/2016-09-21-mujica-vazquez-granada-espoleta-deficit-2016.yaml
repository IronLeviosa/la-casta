politico: batlle
tema: economia/impuestos
fecha: 2016-09-21
contexto: entrevista
cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que el primer gobierno de Vázquez no tuvo que subir impuestos y Mujica dejó un déficit
  a su sucesor
cita: Por una razón muy sencilla, en esos primeros cinco años no tuvo que hacer ajuste fiscal, no
  tuvo que subir impuestos o devaluar. Al contrario. Y con eso pudo mejorar la situación deprimida
  de los salarios. Eso determinó que votaran a Mujica. Y cuando votaron a Mujica, empezó a repartir
  dinero y generarle al país un déficit que cuando llega el doctor Vázquez, como en su momento lo
  dije, "le va a colgar una granada al mismo tiempo que la banda, le va a sacar la espoleta y se va
  a sentar en la plaza a escuchar la explosión". Y la explosión la está viviendo el pobre presidente
  de la República, que no puede bajar el gasto, porque el partido que generó el gasto, no le deja
  bajar el gasto
resumen: En una entrevista con El Observador realizada el 21 de setiembre de 2016 por el periodista
  Leandro Gómez, y publicada como resumen de esa entrevista el 25 de octubre, un día después de su
  muerte, dijo que el primer gobierno de Vázquez (2005-2010) no tuvo que subir impuestos ni
  devaluar, lo que según él explicó el triunfo posterior de Mujica; y que el gasto del gobierno de
  Mujica le dejaría a Vázquez, en su segundo mandato, una granada con la espoleta ya sacada -es
  decir, un déficit fiscal a punto de estallar-.
