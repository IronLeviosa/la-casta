cargo_en_ese_momento: Ex presidente de la República
titulo: Como expresidente, dijo que la reforma tributaria de Vázquez bajaba impuestos a empresas y bancos
cita: Me extraña que en el proceso no se comente que hay una rebaja en los impuestos que deben pagar
  las empresas y las sociedades anónimas
resumen: En una entrevista a Canal 4 -la nota se basa en Radio Sarandí-, como expresidente y
  dirigente del Partido Colorado, dijo que en el debate sobre la reforma tributaria que planeaba el
  gobierno de Vázquez no se mencionaba que bajaría de 30% a 25% el impuesto que pagan las empresas y
  sociedades anónimas, con una rebaja de unos USD 40 millones para las 50 empresas más importantes
  del país y de unos USD 15 millones para los bancos.
