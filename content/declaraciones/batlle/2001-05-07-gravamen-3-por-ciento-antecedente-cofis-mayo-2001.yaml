titulo: Anunció que pediría al Parlamento un gravamen del 3% a las ventas, antecedente directo del Cofis
cita: Vamos a solicitarle al Parlamento que nos habilite un gravamen de 3% sobre los artículos
  importados, salvo aquellos exentos de IVA o aquellos que pagan ya un IMESI importante
resumen: En conferencia de prensa con medidas para la reactivación productiva, pidió al Parlamento
  un gravamen del 3% sobre bienes importados y de producción nacional (antecedente del Cofis, creado
  semanas después por la Ley 17.345) para financiar la derogación del impuesto al patrimonio
  agropecuario y otras rebajas de aportes.
