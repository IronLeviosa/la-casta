titulo: Describió las tres tasas de IVA vigentes (0%, 14% y 23%) al defender el Mensaje Complementario
cita: El IVA en este país existe, el de 0, el de 14 y el de 23, se le aplica a unos y a otros no.
resumen: "Al explicar que el Mensaje Complementario no creaba impuestos nuevos, describió las tres
  tasas de IVA vigentes -0%, 14% y 23%- y señaló que se aplicaban a unos sectores sí y a otros no,
  como base del mecanismo que proponía: extender el pago a sectores hasta entonces exonerados, como
  las emergencias médicas móviles."
