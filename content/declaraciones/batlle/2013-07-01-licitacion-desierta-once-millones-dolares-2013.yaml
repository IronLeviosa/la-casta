contexto: entrevista
cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que una licitación de deuda por US$ 11 millones quedó desierta y la siguiente subió la tasa
cita: En una palabra si usted mira lo que pasó en las últimas dos semanas en materia financiera,
  usted verá en primer lugar que cuando el gobierno salió a pedir colocar unos pocos pesos, más o
  menos 11 millones de dólares, nadie le tomó la oferta. Y cuando una semana después volvió a pedir
  que le tomaran ofertas le subieron los intereses por encima de lo que estaba antes. Por lo cual el
  gobierno está empantanado
resumen: En declaraciones a radio Montecarlo, dijo que en las dos semanas anteriores el gobierno no
  consiguió ofertas en una licitación de deuda por unos US$ 11 millones y que la semana siguiente,
  al volver a salir a colocar deuda, tuvo que convalidar tasas de interés más altas que antes.
