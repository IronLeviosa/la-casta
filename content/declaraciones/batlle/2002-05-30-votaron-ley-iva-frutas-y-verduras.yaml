contexto: entrevista
cargo_en_ese_momento: Presidente de la República
titulo: Dijo que el Parlamento había votado una ley fiscal y otra que extendía el IVA a frutas y verduras
cita: "nuestra mayoría –una coalición compuesta por los dos partidos tradicionales que es mayoría en
  ambas ramas del parlamento- votó la semana pasada tres leyes: una referida al Banco Hipotecario,
  la ley fiscal y una tercera referente a la aplicación del IVA a frutas y verduras."
resumen: En una entrevista con la agencia Bloomberg News, cuya versión en español publicó
  Presidencia como anexo de la conferencia de prensa del 3 de junio, dijo que el Parlamento había
  votado, en la semana anterior, una ley sobre el Banco Hipotecario, una ley fiscal y una tercera
  que extendía el IVA a frutas y verduras.
