politico: batlle
tema: economia/impuestos
fecha: 2002-05-14
contexto: gobierno
cargo_en_ese_momento: Presidente de la República
titulo: Defendió el impuesto a las retribuciones personales diciendo que quienes tienen más ingresos
  deben poner más
cita: yo creo que cuando un país tiene una dificultad tan grande como la que tiene el Uruguay, como
  consecuencia de casi cinco meses estamos sufriendo ese embate permanente de la situación
  argentina, lamentablemente todos tenemos que poner algo de nosotros. Y los que tienen más ingresos
  tienen que poner más, y por eso las escalas son diferentes.
resumen: Ante una pregunta sobre críticas de que la clase media y los sectores más necesitados
  pagaban la crisis por el impuesto a las retribuciones personales, al agua y al transporte,
  respondió que quienes tienen más ingresos debían poner más, por eso las escalas del impuesto eran
  diferentes.
