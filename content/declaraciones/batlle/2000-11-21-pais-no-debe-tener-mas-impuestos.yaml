politico: batlle
tema: economia/impuestos
fecha: 2000-11-21
contexto: entrevista
cargo_en_ese_momento: Presidente de la República
titulo: Reafirmó que el país no debe tener más impuestos y explicó los ajustes que hizo en su lugar
cita: Y yo creo que el país no, no, no debe tener más impuestos. Por eso es que nosotros, el primero
  de marzo anunciamos que no íbamos a hacer un ajuste, por eso inclusive, en la primera Ley de
  Urgencia bajamos algunos recursos, sobre todo al sector agropecuario, y por eso en la Ley de
  Presupuesto que se remitió en agosto hicimos una compensación, bajamos algunos recursos y
  modificamos otros, pero la cifra final era la misma.
resumen: "Cuando el periodista le recordó que había dicho que el país no soportaba más impuestos,
  insistió en que el país no debía tener más impuestos y explicó por qué: al asumir, el 1° de marzo,
  habían anunciado que no harían un ajuste; en la primera Ley de Urgencia bajaron algunos recursos,
  sobre todo al sector agropecuario; y en la Ley de Presupuesto de agosto compensaron, bajando
  algunos recursos y modificando otros, sin cambiar la cifra final."
