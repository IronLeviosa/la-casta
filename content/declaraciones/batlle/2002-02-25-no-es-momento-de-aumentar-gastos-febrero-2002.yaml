resumen: En declaraciones a la prensa tras reunirse con el presidente de la Suprema Corte de
  Justicia, dijo que el compromiso del Poder Ejecutivo era bajar el gasto y no subirlo, equiparando
  explícitamente aumentar el gasto con aumentar impuestos.
