contexto: entrevista
cargo_en_ese_momento: Presidente de la República
titulo: Dijo que la venta de reservas de oro ayudaría a aliviar la presión fiscal
cita: juntaremos 24 millones de dólares con lo cual aliviaremos la presión fiscal y movilizamos la
  reservas, que son las cosas que tiene que hacer
resumen: Explicó que la parte de las reservas de oro ya vendida y colocada a interés daba 12
  millones de dólares por año, y que con otra venta todavía pendiente buscarían sacar 12 millones de
  dólares más, para reunir en total unos 24 millones de dólares que ayudarían a aliviar la presión
  fiscal.
