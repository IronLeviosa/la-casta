cargo_en_ese_momento: Presidente de la República
titulo: Sostuvo que el Mensaje Complementario extendía impuestos existentes y no creaba impuestos nuevos
cita: Bueno, no impuestos nuevos, en el sentido de que fueran nuevos, sino que en el Mensaje
  Complementario se hace una extensión de impuestos existentes
resumen: "Ante la objeción de que el Mensaje Complementario al Presupuesto incluía impuestos nuevos
  -el periodista dio como ejemplo el financiamiento de las emergencias médicas móviles-, respondió
  que no eran impuestos nuevos sino una extensión de impuestos existentes: la fórmula era cobrarle
  el IVA a algún sector que hasta entonces estuviera exonerado de esa tasa."
