politico: batlle
tema: economia/impuestos
fecha: 2013-02-05
contexto: entrevista
cargo_en_ese_momento: Expresidente de la República (sin cargo electivo; referente del Partido Colorado)
titulo: Dijo que el déficit fiscal de ese momento era igual al del peor momento de la crisis de 2002
cita: Nosotros en el peor momento de la crisis, en 2003, tuvimos como déficit fiscal sobre el
  producto 2,8%. Este gobierno después de dos años de bonanza, con precios exorbitantes en los
  productos, con intereses de la deuda en valor cero, con un flujo de capitales para cualquier cosa,
  tiene un déficit fiscal de 2,8%
resumen: En declaraciones a radio Montecarlo, comparó el déficit fiscal del último dato disponible
  en ese momento -el cierre de 2012, 2,8% del producto- con el que su gobierno enfrentó en el peor
  momento de la crisis, en 2003, y sostuvo que era igual pese a lo que describió como dos años de
  bonanza para el gobierno de entonces.
