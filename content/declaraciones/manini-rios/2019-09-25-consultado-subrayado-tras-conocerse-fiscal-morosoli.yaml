resumen: Consultado por Subrayado tras conocerse que el fiscal Morosoli lo consideraba responsable
  de omitir la denuncia de la confesión de Gavazzo sobre Gomensoro, Manini Ríos sostuvo que había
  cumplido con lo que correspondía y evitó polemizar con el fiscal.
