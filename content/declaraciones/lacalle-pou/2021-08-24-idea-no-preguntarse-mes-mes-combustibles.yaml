cita: La idea es que no se pregunte mes a mes qué va a pasar con los combustibles. La idea es que
  los uruguayos no paguen sobreprecio, que los combustibles no sean una forma de hacer caja y sean
  lo más parecido a lo que cuesta en el resto de la región. De alguna manera, tratando de trabajar
  sobre subsidios, sobre ineficiencias y que ustedes mes a mes tengan un precio lo más transparente
  y apropiado posible
resumen: En rueda de prensa tras reunirse con los ministros de Economía e Industria por un cambio en
  las fechas de cálculo del precio de paridad de importación, explicó el objetivo del mecanismo de
  fijación de precios de los combustibles.
