titulo: No había motivos aparentes para el paro que frenó la refinería de Ancap
cita: Yo escuché las explicaciones del presidente de Ancap y son meridianamente claras, y después
  escuché al ministro de Industria. Si se para la refinería y no se puede refinar lo que no puede
  hacer Uruguay es quedarse sin combustible, si no, ¿cómo nos movemos?
resumen: Tras el paro de 24 horas de los trabajadores de Ancap que detuvo la refinería de La Teja,
  dijo que había huelgas que, aun teniendo un motivo, no tenían razones aparentes para un paro de
  esa dimensión, y que se importaría combustible para evitar el desabastecimiento.
