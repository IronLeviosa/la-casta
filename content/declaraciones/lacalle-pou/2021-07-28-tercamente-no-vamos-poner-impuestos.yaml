titulo: Ahorró más de US$ 600 millones durante la pandemia sin subir impuestos
cita: Todos los analistas y quienes competían con nosotros decían que no había forma de salir de
  esto sin impuestos, y nosotros tercamente y obstinadamente decíamos que no vamos a poner impuestos
resumen: En una entrevista con un medio argentino (LN+), sostuvo que durante la pandemia el gobierno
  logró ahorrar más de US$600 millones sin crear ni aumentar impuestos, pese a las críticas de
  analistas. La senadora Liliam Kechichian (FA) respondió que en ese período se "subió el IVA" y se
  aumentaron las tarifas.
