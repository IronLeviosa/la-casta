resumen: En una entrevista con un medio argentino (LN+), sostuvo que durante la pandemia el gobierno
  logró ahorrar más de US$600 millones sin crear ni aumentar impuestos, pese a las críticas de
  analistas. En la misma nota de la diaria, la senadora Liliam Kechichian (FA) le respondió que en
  este período se "subió el IVA" y se aumentaron las tarifas. La cifra de ahorro no está verificada
  con documento oficial.
