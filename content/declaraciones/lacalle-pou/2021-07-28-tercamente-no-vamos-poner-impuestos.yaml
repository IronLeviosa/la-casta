      cita: "Tercamente decíamos: no vamos a poner impuestos. Primero, porque no es necesario. Pasamos la
        pandemia, hicimos un gasto importante en 2020 y ahora tenemos un gasto mayor previsto por la
        pandemia en 2021. Y ahorramos más de US$ 600 millones. Sin poner impuestos"
