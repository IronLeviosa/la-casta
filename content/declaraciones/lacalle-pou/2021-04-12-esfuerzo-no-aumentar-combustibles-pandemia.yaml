cita: El Gobierno ha tomado una decisión en base a la situación actual del país debido a la
  pandemia. Sin perjuicio de la suba del precio del petróleo y el costo nacional, se hace un
  esfuerzo para no aumentar los combustibles.
resumen: Publicó en su cuenta de Twitter que el gobierno decidió no aumentar el precio de los
  combustibles durante abril pese a la suba del petróleo, respaldando el anuncio hecho ese mismo día
  por la ministra de Economía y el ministro de Industria.
