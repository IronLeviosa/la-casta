titulo: Admite que las críticas por la suba de los combustibles tienen razón
cita: No me gusta que me critiquen, pero menos me gusta cuando tienen razón
resumen: Tras la tercera suba de combustibles en menos de dos meses, dialogando informalmente con
  periodistas después de un acto en Cerrillos, admitió que las críticas por la suba eran acertadas y
  defendió el nuevo mecanismo de fijación de precios de la LUC.
