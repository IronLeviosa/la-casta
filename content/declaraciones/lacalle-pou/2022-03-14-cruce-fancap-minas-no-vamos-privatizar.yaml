resumen: En el mismo cruce con el sindicalista Gerardo Rodríguez en Minas, negó que la asociación de
  la división portland de Ancap con una empresa privada fuera una privatización, dijo que buscaban
  hacerla competitiva porque de lo contrario la competencia externa "se los van a comer", y aseguró
  que los trabajadores no perderían el empleo por ser funcionarios públicos.
