cargo_en_ese_momento: presidente de la República
cita: Tengo la íntima convicción que tanto el ministro del Interior, el subsecretario, Francisco
  Bustillo y Carolina Ache no tienen ninguna responsabilidad legal en el otorgamiento del famoso
  pasaporte.
resumen: Afirmó tener la íntima convicción de que ninguno de los jerarcas involucrados en la entrega
  del pasaporte al narcotraficante Sebastián Marset (Heber, Maciel, Bustillo y Ache) tiene
  responsabilidad legal, minutos antes de anunciar, en la misma conferencia, que aceptaba las
  renuncias del ministro del Interior Luis Alberto Heber, del subsecretario Guillermo Maciel y del
  asesor Roberto Lafluf; Bustillo había renunciado el miércoles anterior y Ache en diciembre de
  2022.
