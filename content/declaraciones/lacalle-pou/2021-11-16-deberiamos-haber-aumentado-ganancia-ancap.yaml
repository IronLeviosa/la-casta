titulo: No subió los combustibles pese a que el criterio lo habría justificado
cita: Y ANCAP, que dio ganancias extraordinarias, porque está pudiendo tener un negocio, el famoso
  X, que el X era siempre para ver cuánto aumentamos, en este caso tenemos, digámosle, un X
  virtuoso, y deberíamos de haber aumentado, pero como ANCAP dio ganancia y no somos un gobierno que
  va a cobrarle a la gente para tapar agujeros porque administramos mal, dijimos vamos a no cobrarle
  a la gente más caro el combustible y mantengamos el precio con la ganancia que tuvo el Estado.
resumen: Dijo que, según el criterio que venían aplicando, la suba del precio internacional del
  petróleo hubiera justificado un aumento del combustible, pero que el gobierno optó por no
  trasladarlo a la gente porque ANCAP tuvo ganancias extraordinarias, y defendió esa decisión
  atribuyéndola a las ganancias de la empresa y no a un cambio de criterio.
