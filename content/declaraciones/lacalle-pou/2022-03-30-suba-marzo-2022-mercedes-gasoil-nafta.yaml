  notas_internas: "Segunda fuente falsa (objeción de critica.md): la cita de El Observador usada
    originalmente no contenía una sola palabra de Lacalle Pou, solo la descripción del anuncio. Se
    cambió por el pasaje que sí es literal de El Observador y al menos le atribuye el anuncio a él,
    pero sigue sin corroborar sus palabras exactas; se marca `_faltante` porque ningún medio
    distinto de El País reproduce la cita. Es la evidencia `en_contra` más limpia de este lote para
    la promesa publicada `no-aumentar-combustibles` (aumento con montos concretos): ver
    `material_para_correccion_promesa` en razones.md, no se agrega acá porque esa promesa está fuera
    del alcance de esta corrida."
