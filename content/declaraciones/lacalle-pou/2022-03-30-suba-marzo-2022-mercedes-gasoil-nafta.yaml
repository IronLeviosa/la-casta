cita: La recomendación de la Ursea fue de $ 15 pesos al gasoil y $ 7,5 para las naftas. Nosotros, de
  nuevo, con un esfuerzo para no estar pagando sobreprecios, ni siquiera lo que debería costar,
  vamos a dar un aumento de $ 5 en el gasoil y $ 3 en la nafta
resumen: En rueda de prensa durante una visita a Mercedes tras un temporal, anunció un aumento de $5
  en el gasoil y $3 en la nafta a partir del 1° de abril de 2022, inferior a la suba de $15 y $7,5
  recomendada por Ursea según el precio de paridad de importación, y anunció además la exoneración
  de IVA a panificados y fideos por al menos 30 días.
