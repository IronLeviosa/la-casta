cita: Estamos convencidos de que es una medida de transparencia y que el uruguayo no paga sobrecosto
resumen: Tras el triunfo del "No" en el referéndum contra la LUC, dijo en conferencia de prensa que
  no se iba a cambiar el mecanismo de fijación de precios de los combustibles, sostuvo que es "una
  medida de transparencia" bajo la cual "el uruguayo no paga sobrecosto", afirmó que en el
  quinquenio anterior se habían pagado más de USD 1.700 millones de sobrecostos, y dijo que por
  primera vez los combustibles eran más baratos que en Brasil.
