      titulo: '"Una etapa superada, una ley que queda firme", dijo Lacalle Pou tras referéndum por la LUC'
      cita: Otro tema del que habló en conferencia fue el de los combustibles y afirmó que no se va a
        cambiar el mecanismo. "Estamos convencidos de que es una medida de transparencia y que el
        uruguayo no paga sobrecosto", sostuvo y dijo que se pagaron más de USD 1.700 millones de
        sobrecostos en el quinquenio anterior. "Hoy por primera vez tenemos combustibles más baratos
        que Brasil", señaló y explicó que se debe a que "no se trasladaron los costos a todos los
        uruguayos".
