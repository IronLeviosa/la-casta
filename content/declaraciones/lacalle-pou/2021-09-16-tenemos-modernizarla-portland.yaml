  notas_internas: 'Cita de dos palabras con referente que la propia Presidencia resuelve de forma
    distinta en el título ("Ancap") que en el cuerpo (el párrafo previo habla del "sector portland"
    y dice que "el ente debe asociarse con un inversor privado en ese sector"). Objeción de
    critica.md: una cita tan corta no debería sostener sola un registro `textual` cuando la fuente
    primaria es ambigua sobre a qué se refiere. Pendiente: la misma página enlaza el audio
    "Declaraciones del presidente Luis Lacalle Pou a la prensa"; con una cita de ese audio con
    sujeto explícito y marca_tiempo, sube a publicado.'
