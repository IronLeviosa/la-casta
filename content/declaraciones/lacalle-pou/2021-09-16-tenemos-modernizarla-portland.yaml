titulo: El sector del cemento portland de Ancap debe modernizarse
cita: Tenemos que modernizarla
resumen: "Tras inaugurar una planta cementera privada en Treinta y Tres, dijo en rueda de prensa
  \"Tenemos que modernizarla\" en referencia al sector de cemento portland de Ancap, que da
  pérdidas, y consideró que ese sector debe asociarse con un inversor privado. Presidencia tituló la
  nota \"Lacalle Pou: 'Tenemos que modernizar Ancap'\", un alcance más amplio que el que da el
  cuerpo de la propia nota."
