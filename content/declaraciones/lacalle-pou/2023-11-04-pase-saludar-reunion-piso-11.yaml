fecha: 2023-11-04
contexto: gobierno
cargo_en_ese_momento: presidente de la República
cita: Pasé a saludar, no llegué a los dos minutos. Es acá arriba en el piso 11. No participé de la
  reunión. Sí, fui yo el que pedí que se convoque a los efectos de tener una línea única de trabajo
  y acción.
resumen: Afirmó que solo pasó a saludar una reunión, que él mismo había pedido convocar "a los
  efectos de tener una línea única de trabajo y acción", entre su asesor Roberto Lafluf y los
  entonces subsecretarios Carolina Ache (Relaciones Exteriores) y Guillermo Maciel (Interior) sobre
  los chats vinculados al caso Marset, y que no participó de ella. Relató que cuando Ache discrepó y
  Lafluf lo llamó, él dijo que "se presente todo", que los documentos se presentaron en el juzgado
  el lunes siguiente y que le escribió a Ache para que le avisara cuando los hubiera presentado. Él
  ubicó su pedido de reunión "a fines de octubre"; Ache y una captura de chat difundida por Búsqueda
  la ubican el 25 de noviembre de 2022; la discrepancia no está resuelta.
