politico: lacalle-pou
tema: economia/combustibles
fecha: 2020-03-11
contexto: gobierno
cargo_en_ese_momento: presidente
cita: en estos días, con la baja muy grande en los precios del petróleo, nuestro equipo económico
  trabajó fuertemente para conseguir buen combustible a buen precio para el segundo semestre del
  año. Ancap ya había comprado petróleo para el primer semestre al precio anterior a la caída. El
  trabajo de estos días en la compra del mercado futuro que nos permitió comprar para los próximos
  seis meses puede llegar a resultar en que la adecuación en el precio sea bastante menor a la que
  planificábamos. Somos optimistas en generar buena compra. Preferimos no adelantar cuál va a ser la
  adecuación en el precio de los combustibles.
resumen: En el anuncio del primer ajuste de tarifas públicas de su gobierno, dijo que los
  combustibles no subirían por ahora gracias a la caída del precio internacional del petróleo y a
  compras adelantadas en el mercado de futuros, mientras sí subían las tarifas de UTE, OSE y Antel;
  aclaró que esa compra podía derivar en una futura "adecuación" del precio de los combustibles
  menor a la planificada, pero se negó a adelantar de cuánto sería.
