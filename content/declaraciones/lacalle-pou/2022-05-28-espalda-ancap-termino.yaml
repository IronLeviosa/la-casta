cita: Cada vez que no aumentamos lo que debemos aumentar, que es lo que viene pasando hace un
  tiempo, eso es sacrificio de Ancap. La espalda básicamente se terminó
resumen: Consultado sobre si a ANCAP le quedaba espalda financiera, advirtió que la capacidad de la
  empresa para sostener precios de combustibles sin aumentos se había agotado, anticipando un ajuste
  al alza para junio de 2022. Según El Observador, el informe de URSEA al 25 de mayo mostraba que el
  gasoil estaba $10,75 por litro y la nafta súper $6,41 por litro por debajo del precio de paridad
  de importación, porque las tarifas se venían ajustando por debajo del PPI. En ninguna de las dos
  notas se le pregunta por la promesa de 2019.
