titulo: El intento de liberalizar la importación de combustibles sí se discutió
cita: No es cierto que no se haya discutido porque fue en anteproyecto al Parlamento (dentro de la
  Ley de Urgente Consideración). Jugamos como nunca y perdimos como siempre
resumen: 'En el mismo acto de Tacuarembó, sostuvo que el intento de liberalizar la importación de
  combustibles sí se debatió -dijo que fue como anteproyecto al Parlamento- aunque no logró
  aprobarse, y atribuyó a un tercero ("como decía un amigo mío") la frase "jugamos como nunca y
  perdimos como siempre". La aclaración entre paréntesis sobre la Ley de Urgente Consideración es de
  la redacción de El País, no palabras suyas: Montevideo Portal desgraba la misma frase sin ella.'
