  notas_internas: 'No se tocó la `cita`: el paréntesis sobre la LUC está en el cuerpo original de El
    País y una cita es un tramo contiguo, no se le sacan palabras del medio. Se aclaró en el resumen
    que esa precisión es de la redacción, verificado contra Montevideo Portal (que no la trae). Se
    agregó que él mismo atribuye la frase "jugamos como nunca..." a un tercero, dato que faltaba en
    el resumen original y que solo trae la segunda fuente. Montevideo Portal declara tomar el
    discurso de Subrayado: testigo real único, El País.'
