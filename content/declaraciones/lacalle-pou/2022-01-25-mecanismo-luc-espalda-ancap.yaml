fecha: 2022-01-25
contexto: gobierno
cargo_en_ese_momento: presidente
cita: De manera transparente, desde que está la Ley de Urgente Consideración, dijimos que este es el
  precio que tomamos, en este caso el del Golfo de México. Esto es lo que dice la URSEA y vamos, nos
  damos vuelta, y a la empresa ANCAP, si tiene la espalda suficiente, como la ha tenido, por otro
  tipo de situaciones, no aumentamos los combustibles. Si el día de mañana el precio de los
  combustibles o el precio de referencia aumenta exageradamente y ANCAP no tiene espalda los vamos a
  tener que aumentar. Ojalá sea a la inversa.
resumen: Defendió el mecanismo de fijación de precios de la Ley de Urgente Consideración como una
  forma transparente de tomar el precio de referencia internacional (Golfo de México) informado por
  URSEA, y dijo que el gobierno no aumenta los combustibles cuando ANCAP tiene "espalda" financiera
  suficiente, aunque advirtió que podría tener que hacerlo si el precio de referencia sube
  demasiado.
