resumen: Durante un acto por el 160° aniversario de Paysandú, respondió así a integrantes de la
  Federación Ancap que lo llamaron "mentiroso" y "mitómano" en rechazo a la asociación con privados
  del negocio del portland de Ancap y por reclamos de pérdida de puestos de trabajo; en el mismo
  cruce se comprometió a recibirlos en la Torre Ejecutiva después del 20 de junio.
