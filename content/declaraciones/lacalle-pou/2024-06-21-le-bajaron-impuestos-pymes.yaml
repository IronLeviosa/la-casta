politico: lacalle-pou
tema: economia/impuestos
fecha: 2024-06-21
contexto: gobierno
cargo_en_ese_momento: presidente
cita: Se le bajaron los impuestos a las pymes. Hace un par de años, por primera vez en muchos años,
  no solo se le bajó los impuestos a las personas físicas y a algunos jubilados, sino que a las
  empresas.
resumen: En un encuentro con centros comerciales del interior en Paso de los Toros, afirmó que
  durante su gobierno se redujeron los impuestos a las pymes, a las personas físicas y a algunos
  jubilados. En el mismo discurso, según Subrayado, reconoció que las medidas tomadas para paliar la
  situación del litoral (BROU, exoneraciones a combustibles) "no han sido suficientes".
