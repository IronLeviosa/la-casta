resumen: Ante la Asamblea General, en la rendición de cuentas de sus tres años de gobierno, anunció
  una rebaja del IRPF y del IASS que dijo alcanzaría al 75% de los contribuyentes de IRPF y
  significaría una renuncia fiscal de US$150 millones.
