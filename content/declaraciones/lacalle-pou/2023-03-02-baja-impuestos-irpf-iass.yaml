cita: Estamos en condiciones de proceder a una baja de impuestos para quienes hacen los mayores esfuerzos
resumen: Ante la Asamblea General, en la rendición de cuentas de sus tres años de gobierno, anunció
  una rebaja del IRPF (aumento de deducciones para los ingresos más bajos) y del IASS, que dijo
  alcanzaría al 75% de los contribuyentes de IRPF y significaría una renuncia fiscal de US$150
  millones. Encuadró la rebaja del IASS como cumplimiento de un compromiso de campaña ("como nos
  comprometimos en la campaña electoral, empezamos a desandar el IASS") y anunció beneficios para
  micro y pequeñas empresas.
