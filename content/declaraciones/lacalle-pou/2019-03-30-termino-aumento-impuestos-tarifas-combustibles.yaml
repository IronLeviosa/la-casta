titulo: No habrá más aumentos de impuestos, tarifas ni combustibles si gana la elección
cita: Si gana el Partido Nacional se terminó el aumento de impuestos, las tarifas y los
  combustibles. Se terminó
resumen: En el lanzamiento de su campaña en el Parque Viera, prometió que si es electo presidente no
  habrá más aumentos de impuestos, tarifas públicas ni combustibles. La frase agrupa tres objetos
  distintos; por eso se archiva bajo el tema general "economía" y da origen a tres promesas
  separadas (impuestos, tarifas públicas y combustibles). Las dos fuentes de prensa transcriben la
  frase con distinto orden de los sustantivos; ninguna de las dos es transcripción del audio del
  acto.
