resumen: En el debate de balotaje contra Daniel Martínez, sostuvo que el programa del Frente Amplio
  establecía un aumento de impuestos y que su propuesta iba por otro camino. Según la crónica de
  Infobae, "acotó que no piensa en incrementar los impuestos" (paráfrasis del medio, no cita
  textual). En el mismo intercambio Martínez respondió que "el candidato decide y yo decido que los
  impuestos no van a variar".
