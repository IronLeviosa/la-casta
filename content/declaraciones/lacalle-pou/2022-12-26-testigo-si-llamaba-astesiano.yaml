titulo: No dio instrucciones concretas sobre qué informarle a Astesiano
cita: No, indicaciones concretas, no. Puedo asumir de que se entendía que si llamaba Astesiano era
  como si hubiera pedido yo la información.
resumen: Declaró como testigo ante la fiscal del caso Astesiano que no le dio indicaciones concretas
  a los entonces ministros del Interior sobre qué información debían brindarle a su jefe de
  custodia, pero agregó que podía asumirse que si llamaba Astesiano era como si él mismo hubiera
  pedido la información; ese último comentario fue usado casi un año después por otra fiscal como
  evidencia para pedir el sobreseimiento de la causa de un exjerarca policial.
