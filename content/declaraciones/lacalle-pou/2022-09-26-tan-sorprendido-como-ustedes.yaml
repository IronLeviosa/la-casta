      titulo: '"Estoy tan sorprendido como ustedes", dijo Lacalle Pou sobre detención de su jefe de
        seguridad'
      cita: Por otra parte indicó que conoció al jefe de seguridad en 1999 en una campaña. "Después lo vi
        en 2004, después 2014 y en 2019 me acompañó en toda la campaña. Yo no le entrego lo más
        preciado que es mi familia a una persona que puede tener indicio que actúa por fuera de la
        ley", aseguró.
