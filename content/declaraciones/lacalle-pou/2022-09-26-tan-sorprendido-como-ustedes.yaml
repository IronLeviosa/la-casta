contexto: gobierno
cargo_en_ese_momento: presidente de la República
cita: Tan sorprendido como ustedes estoy yo.
resumen: Dijo estar tan sorprendido como la ciudadanía por la detención de su jefe de custodia
  personal, Alejandro Astesiano, detenido el día anterior y declarando ante la fiscal de Flagrancia
  por una investigación de falsificación de documentos para pasaportes a ciudadanos rusos; afirmó
  que si hubiera tenido el más mínimo indicio de irregularidades no le habría confiado el cuidado de
  su familia, y asumió la responsabilidad de la contratación ("El responsable último soy yo
  siempre").
