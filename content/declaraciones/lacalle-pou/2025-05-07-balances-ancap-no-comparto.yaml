resumen: En su primera entrevista como expresidente, en una radio de Florida, remitió a los balances
  de ANCAP, su capitalización y el precio de los combustibles "en uno u otro" gobierno como datos
  "en blanco y negro", y dijo que "las cosas que se están discutiendo no las comparto". Según
  Subrayado, lo dijo sobre los planteos sobre ANCAP que hizo el gobierno actual respecto al
  anterior; ninguna cita suya nombra a Orsi.
