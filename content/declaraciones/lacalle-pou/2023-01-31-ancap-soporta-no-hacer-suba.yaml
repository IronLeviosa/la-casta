resumen: Dijo que evaluaba mantener sin cambios el precio de los combustibles en febrero de 2023
  pese a la recomendación de suba de Ursea. La nota aclara que la metodología de precio de paridad
  de importación se aplica desde 2002, con modificaciones en 2010 y 2017.
