titulo: No hubo aumento de combustibles pese a que la oposición en Ancap lo pedía
cita: Lo que hubo fue un no aumento de combustibles. O sea, tenemos que aumentar. Increíblemente los
  miembros de la oposición dentro de Ancap dijeron 'tenemos aumentar'. Yo estoy de acuerdo con
  ellos. Simplemente que en virtud de la pandemia y la situación económica dijimos 'vamos a
  aguantar'.
resumen: En una entrevista en Subrayado, dijo que no hubo aumento de combustibles pese a que, según
  afirmó, la oposición en el directorio de Ancap también consideraba necesario aumentar, y adelantó
  que el gobierno iba a tener que subir el precio. Al día siguiente (02/06/2021), el director de
  Ancap por el Frente Amplio, Walter Sosa, negó públicamente haber pedido un aumento, calificó la
  afirmación de "no verdad" y pidió comparar su versión con las actas del Directorio de Ancap.
