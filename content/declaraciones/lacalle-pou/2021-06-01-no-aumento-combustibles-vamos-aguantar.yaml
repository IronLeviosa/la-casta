  notas_internas: "Bloqueante de critica.md resuelto: el registro difundía que directores del FA en
    Ancap pidieron aumentar, y las dos fuentes originales estaban construidas alrededor del
    desmentido de Walter Sosa sin incluirlo. Se agregó el desmentido al resumen (con nombre y fecha)
    y se amplió la cita de montevideo-portal para que cubra la afirmación completa, no solo la
    mitad. Pendiente para subir a textual: el tuit de Sosa ubica el pasaje en el minuto 29:40 de la
    entrevista de Blanca Rodríguez (Subrayado); no localizamos el video en esta sesión. La
    afirmación es además chequeable contra las actas del Directorio de Ancap de abril-mayo de 2021,
    que el propio desmentido de Sosa invoca; no armamos un chequeo en este lote porque no hay
    `chequeos.yaml` en esta carpeta."
