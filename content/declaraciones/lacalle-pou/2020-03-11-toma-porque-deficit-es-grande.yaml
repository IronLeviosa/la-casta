cita: ¿Por qué se toma? Se toma porque el déficit es grande. Debería ser una pregunta para los que
  estaban acá hace seis meses
resumen: Consultado por la reducción de la exoneración de IVA en tarjetas de débito y crédito, a
  once días de asumir, atribuyó la necesidad de la medida al déficit heredado del gobierno anterior;
  en la misma conferencia calificó la suba de tarifas públicas como una "adecuación" por debajo de
  los costos, no como un aumento para recaudar. La tesis de que con estas medidas el compromiso
  electoral "se súper cumplió" es de Isaac Alfie (director de OPP), no una frase suya.
