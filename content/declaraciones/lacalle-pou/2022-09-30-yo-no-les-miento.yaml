titulo: No miente sobre el caso Astesiano, aunque pueda equivocarse
cita: Yo no les miento, yo les digo la verdad.
resumen: A la salida de un acto en Maldonado, sostuvo que dijo la verdad en su primera explicación
  pública sobre el caso Astesiano ("Me puedo equivocar, pero no les voy a mentir"; "Un presidente
  que se equivoca pueden tener, pero que miente, no"). Consultado sobre los antecedentes de
  Astesiano, respondió, según Montevideo Portal, que de lo que está seguro es que no le dieron "la
  información correcta", y confirmó que pidió el legajo de todo el personal de la custodia
  presidencial.
