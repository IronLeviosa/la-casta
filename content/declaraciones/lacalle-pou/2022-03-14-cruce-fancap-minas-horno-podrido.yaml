cita: Las empresas públicas están dando déficit hace años. Dejaron pudrir un horno. Nunca te vi
  levantar la voz, nunca hablaste
resumen: Durante un cruce en vivo con el secretario general de la Federación Ancap (Fancap), Gerardo
  Rodríguez, en la inauguración de una sede de UTEC en Minas, defendió la decisión de asociar la
  división portland de Ancap con una empresa privada señalando que las empresas públicas vienen
  dando déficit hace años y que el sindicato nunca había protestado antes por la falta de inversión
  en un horno de cemento que, según dijo, dejaron pudrir.
