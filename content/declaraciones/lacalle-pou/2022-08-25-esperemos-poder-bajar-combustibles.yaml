titulo: Espera poder bajar el precio de al menos algunos combustibles
cita: Ayer (por el miércoles) estuve en una reunión exprés con el ministro de Industria. El lunes
  seguramente me junte con la ministro de Economía y el de Industria, veremos cuál es el informe de
  la URSEA, esperemos poder bajar por lo menos algunos de los combustibles, esperando obviamente el
  precio de paridad que siempre URSEA brinda unos días antes de tomar la decisión
resumen: Dijo que evaluaría con los ministros de Economía e Industria si sería posible bajar el
  precio de al menos algunos combustibles en setiembre de 2022, a la espera del informe de precio de
  paridad de importación de URSEA, tras la caída del precio internacional del petróleo en agosto.
