cita: Si yo antes del 1° de marzo podría prever que el 13 de marzo iba a explotar el coronavirus y
  que el mundo iba a cambiar como cambió, y el ataque injustificado de Rusia a Ucrania y que el
  petróleo pase a duplicarse o más que duplicarse en su precio, obviamente no hubiera hecho ese
  compromiso.
resumen: En una entrevista en Telemundo, reconoció que no había podido cumplir su promesa de campaña
  de no subir el precio de los combustibles y atribuyó el incumplimiento a hechos imprevisibles -la
  pandemia de covid-19 y la invasión rusa a Ucrania-; sobre el mecanismo de ajuste mensual del
  precio por el PPI, dijo que "da una referencia técnica de la cual" parte el gobierno.
