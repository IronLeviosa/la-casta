cita: Estamos dispuestos a liberar la importación de incombustibles. Esto obviamente trae aparejada
  una incomodidad para Ancap. La liberalización de la importación de combustible estará en la Ley de
  Urgente consideración, y esta estaría aprobada en 90 días. El Poder Ejecutivo determinará una
  reglamentación paulatina para que Ancap se prepare para la competencia.
resumen: En un coloquio de En Perspectiva con sus asesores, anunció que impulsaría la liberalización
  de la importación de combustibles dentro de la Ley de Urgente Consideración, que estaría aprobada
  en 90 días de gobierno, con una reglamentación paulatina. En el mismo bloque, Azucena Arbeleche
  dijo que buscarían que las tarifas públicas reflejaran los costos de producción de las empresas.
  "Incombustibles" es errata de la fuente.
