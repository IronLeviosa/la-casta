titulo: Hace 20 años que se pierde dinero en el cemento de Ancap
cita: Nosotros estamos para dar una mano en lo que sea. Estamos para ayudar a que sigan las fuentes
  de trabajo, pero sabemos que hay ineficiencias, sabemos que hace 20 años que se pierde ...
resumen: Durante una recorrida oficial en el puerto de Paysandú, tras ser abordado por sindicalistas
  de Fancap que reclamaban por el futuro de la planta de cemento de Ancap en esa ciudad, dijo que el
  gobierno quiere ayudar a sostener las fuentes de trabajo pero que hay "ineficiencias" y que "hace
  20 años que se pierde" en esa actividad, y se comprometió a recibirlos en su despacho la semana
  siguiente ("Los espero el miércoles que viene a las dos de la tarde").
