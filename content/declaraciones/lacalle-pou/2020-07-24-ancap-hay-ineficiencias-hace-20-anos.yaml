  notas_internas: Cita original ("Los espero el miércoles...") era de agenda y no tocaba combustibles
    ni Ancap (objeción corregir de critica.md); se reemplazó por el pasaje sobre
    "ineficiencias"/"hace 20 años que se pierde", que sí es sobre la gestión de Ancap, y la frase de
    la reunión pasó al resumen. Sigue con una sola fuente (El País); la nota dice que el diálogo lo
    registró Subrayado, no lo encontré en esta sesión.
