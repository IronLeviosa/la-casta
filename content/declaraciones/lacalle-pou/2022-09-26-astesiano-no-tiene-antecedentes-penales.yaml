resumen: En la misma conferencia de prensa sobre la detención de su jefe de custodia, afirmó que
  Alejandro Astesiano no tenía antecedentes penales; tres días después la prensa informó que
  Astesiano había sido procesado por estafa en 2002 y en 2013 (esta última vez con prisión), con una
  condena emitida en setiembre de 2014, cuando ya trabajaba para Lacalle Pou.
