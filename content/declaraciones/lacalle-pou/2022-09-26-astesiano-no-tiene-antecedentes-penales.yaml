titulo: Astesiano no tiene antecedentes penales
cita: Astesiano "no tiene antecedentes penales" y que "todo el mundo es inocente hasta que se
  demuestre lo contrario".
resumen: En la misma conferencia de prensa sobre la detención de su jefe de custodia, afirmó que
  Alejandro Astesiano no tenía antecedentes penales; tres días después la prensa informó, y el 12 de
  octubre el Ministerio del Interior confirmó en el Senado, que Astesiano había sido procesado con
  prisión en 2013 y condenado por estafa en setiembre de 2014, cuando ya trabajaba para Lacalle Pou.
