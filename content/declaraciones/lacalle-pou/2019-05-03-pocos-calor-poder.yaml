politico: lacalle-pou
tema: transparencia-corrupcion
fecha: 2019-05-03
contexto: campaña
cargo_en_ese_momento: precandidato a la presidencia (Partido Nacional)
cita: “Dijimos que Uruguay estaba haciendo cosas muy feas. Dijimos que unos pocos al amparo y al
  calor del poder estaban haciendo mucho dinero, negocios hechos porque el gobierno les dio la
  posibilidad de hacer los negocios con sus amigos, muy cercanos al expresidente Mujica y a Tabaré
  Vázquez”, expresó.
resumen: En un acto de campaña interna en Barros Blancos, al referirse al pedido de procesamiento
  del diputado Daniel Placeres (Envidrio/Fondes) y a la comisión investigadora sobre los negocios
  con Venezuela que propuso en 2016, sostuvo que durante los gobiernos del Frente Amplio "unos
  pocos" hicieron "mucho dinero" con negocios que el gobierno habilitó "con sus amigos", personas
  que describió como cercanas a Mujica y a Vázquez. Es la acusación de un adversario en campaña; la
  cita no imputa conductas a los expresidentes sino a personas de su entorno, y no dice
  "irregulares".
