  - url: https://impo.com.uy/bases/leyes/18331-2008
    medio: impo
    fecha: 2008-08-18
    tipo: documento_oficial
    titulo: Ley N° 18.331 — artículo 18, datos especialmente protegidos
    cita: >-
      Nada de lo establecido en esta ley impedirá a las autoridades públicas comunicar o hacer
      pública la identidad de las personas físicas o jurídicas que estén siendo investigadas por,
      o hayan cometido, infracciones a la normativa vigente, en los casos en que otras normas lo
      impongan o en los que lo consideren conveniente.
