numero: "18.331"
titulo: Ley de protección de datos personales
nombre_comun: Ley de protección de datos personales
fecha: 2008-08-11
resumen: >-
  Regula qué se puede hacer con los datos de una persona: quién los puede guardar, para qué,
  y qué derechos tiene el titular sobre ellos. Alcanza a cualquiera que trate datos personales,
  sea del Estado o privado. Para este sitio importa por dos artículos concretos: el 9 bis, que
  declara públicas las publicaciones oficiales y las de la prensa (o sea, se pueden usar como
  fuente), y el 18, que reserva a las autoridades competentes el tratamiento de datos sobre
  infracciones penales. De ahí sale la regla de que la sección de casos solo reproduce lo que ya
  está en fuentes públicas, con etapa judicial y fecha.
articulos:
  - numero: 9 bis
    resumen: >-
      Enumera qué fuentes cuentan como públicas: el Diario Oficial y las publicaciones oficiales,
      lo publicado por los medios de comunicación, y las guías y directorios. Es la base legal
      para citar prensa y documentos oficiales sin pedir permiso a cada persona nombrada.
    cita: >-
      se consideran como públicas o accesibles al público, las siguientes fuentes o documentos:
      A) El Diario Oficial y las publicaciones oficiales, cualquiera sea su soporte de registro o
      canal de comunicación. B) Las publicaciones en medios masivos de comunicación, entendiendo
      por tales los provenientes de la prensa, cualquiera sea el soporte en el que figuren o el
      canal a través del cual se practique la comunicación.
  - numero: "18"
    resumen: >-
      Los datos sobre delitos o infracciones solo los pueden tratar las autoridades públicas
      competentes. El propio artículo aclara que nada impide que esas autoridades hagan pública
      la identidad de quien está siendo investigado. Por eso un caso judicial acá se limita a
      reproducir lo ya publicado por esas vías, con su etapa y su fecha.
    cita: >-
      Los datos personales relativos a la comisión de infracciones penales, civiles o
      administrativas sólo pueden ser objeto de tratamiento por parte de las autoridades públicas
      competentes, en el marco de las leyes y reglamentaciones respectivas, sin perjuicio de las
      autorizaciones que la ley otorga u otorgare.
