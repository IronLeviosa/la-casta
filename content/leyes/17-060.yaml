numero: "17.060"
titulo: Uso indebido del poder público (corrupción)
nombre_comun: Ley Cristal
fecha: 1998-12-23
resumen: >-
  Es la ley anticorrupción uruguaya: define corrupción como el uso indebido del poder público para
  obtener un provecho económico, crea el organismo que hoy se llama JUTEP y obliga a presidentes,
  legisladores, ministros, jueces, intendentes y muchos otros cargos a declarar por escrito qué
  tienen y qué ganan. La declaración se presenta en dos partes: una detallada y reservada, y una
  síntesis que la JUTEP publica en su sitio. Este sitio usa únicamente lo publicado por la JUTEP,
  nunca la parte reservada. La ley fue reformada a fondo por la ley 19.797, de 2019, que es la que
  ordenó publicar las declaraciones en internet.
articulos:
  - numero: "12.1"
    resumen: >-
      La declaración jurada tiene dos partes. La primera es reservada y ahí va el detalle: cada
      bien con su título de propiedad, dónde está depositado el dinero, las empresas vinculadas.
      Ese detalle no es público, y por eso el sitio nunca lo muestra.
    cita: >-
      La declaración jurada contendrá dos partes. Una primera parte detallada y reservada, y una
      segunda parte, denominada síntesis y abierta. 12.1. La primera parte reservada contendrá los
      siguientes datos: A) Una relación precisa y circunstanciada de los bienes muebles e inmuebles
      propios del declarante, de su cónyuge o concubino
  - numero: "12.2"
    resumen: >-
      La segunda parte es un resumen: quién es el declarante, el promedio mensual de sus ingresos
      de los últimos doce meses, el total de su activo y su pasivo, y las empresas a las que está
      vinculado. Es exactamente el nivel de detalle con el que trabaja la sección de patrimonio.
    cita: >-
      La segunda parte, abierta a la JUTEP, será una síntesis de la anterior y contendrá los datos
      identificatorios del funcionario, un resumen del promedio mensual de sus ingresos de los
      últimos doce meses, de los totales de su activo y pasivo patrimonial
  - numero: 12 bis
    resumen: >-
      Agregado por la ley 19.797. Manda a la JUTEP a abrir y publicar en su sitio web las
      declaraciones del presidente, el vicepresidente, senadores, diputados, ministros,
      subsecretarios, jueces de los altos tribunales, directores de entes autónomos, intendentes y
      alcaldes, omitiendo los datos que identifican cada bien.
    cita: >-
      Las declaraciones del Presidente, Vicepresidente de la República, Senadores, Representantes
      Nacionales, Ministros de Estado, Subsecretarios, Directores Generales de Secretaría,
      Ministros de la Suprema Corte de Justicia, de la Corte Electoral, del Tribunal de Cuentas y
      del Tribunal de lo Contencioso Administrativo, Directores de Entes Autónomos y Servicios
      Descentralizados, Intendentes Departamentales, Secretarios Generales de las Intendencias
      Departamentales y Alcaldes, serán recibidas por la Junta de Transparencia y Ética Pública
      (JUTEP), en sus correspondientes sobres o a través de medios electrónicos. Posteriormente se
      procederá a su apertura, publicando todas las declaraciones en el sitio web de la JUTEP.
  - numero: "13"
    resumen: >-
      Fija los plazos. La primera declaración se presenta dentro de los treinta días siguientes a
      cumplir sesenta días en el cargo; después se repite cada dos años; y al dejar el cargo hay
      treinta días para presentar una final. Esas fechas son las que ordenan la línea de tiempo
      patrimonial de cada persona.
    cita: >-
      Para la presentación de las declaraciones juradas se dispondrá de un plazo de treinta días.
      Este plazo comenzará a computarse para las declaraciones juradas iniciales una vez cumplidos
      sesenta días corridos o alternados de ejercicio del cargo, desde la toma de posesión del
      mismo
  - numero: "14"
    resumen: >-
      La JUTEP custodia las declaraciones, las guarda diez años contados desde que la persona deja
      su último cargo obligado y después las destruye con acta notarial, salvo que el interesado
      pida que se las devuelvan. También analiza cómo evolucionan activos, pasivos e ingresos.
      Ese plazo de diez años es el techo de lo que se puede reconstruir hacia atrás.
    cita: >-
      Conservará las declaraciones por un período de diez años, contados a partir del cese del
      funcionario en su último cargo obligado a declarar. Vencido el mismo, procederá a su
      destrucción, labrándose acta notarial de dicho acto, salvo que el interesado hubiera
      solicitado su devolución, en cuyo caso se le entregará.
