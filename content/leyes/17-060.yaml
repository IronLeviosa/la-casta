fuentes:
  - url: https://impo.com.uy/bases/leyes/17060-1998
    medio: impo
    fecha: 1999-01-08
    tipo: documento_oficial
    titulo: Ley N° 17.060 — Ley Cristal, funcionarios públicos (texto vigente en IMPO)
    cita: >-
      A los efectos del Capítulo II de la presente ley se entiende por corrupción el uso indebido
      del poder público o de la función pública, para obtener un provecho económico para sí o para
      otro, se haya consumado o no un daño al Estado.
    archived_url: https://web.archive.org/web/20260729110636/https://www.impo.com.uy/bases/leyes/17060-1998
    retrieved_at: 2026-09-04
  - url: https://impo.com.uy/bases/leyes/17060-1998
    medio: impo
    fecha: 1999-01-08
    tipo: documento_oficial
    titulo: Ley N° 17.060 — artículo 10, quiénes están obligados a declarar
    cita: >-
      El Presidente y el Vicepresidente de la República, los Ministros de Estado, los Ministros de
      la Suprema Corte de Justicia, del Tribunal de lo Contencioso Administrativo, del Tribunal de
      Cuentas y de la Corte Electoral, los Senadores, los Representantes Nacionales y los
      Intendentes Municipales deberán formular una declaración jurada de bienes e ingresos a
      cualquier título.
    archived_url: https://web.archive.org/web/20260729110636/https://www.impo.com.uy/bases/leyes/17060-1998
