numero: "19.797"
titulo: Modificaciones del régimen de declaración jurada de los funcionarios públicos establecido en la Ley Cristal, N° 17.060
nombre_comun: Reforma de las declaraciones juradas
fecha: 2019-09-13
resumen: >-
  Reformó el régimen de declaraciones juradas de la ley 17.060 y entró en vigencia el 1° de marzo
  de 2020. Reescribió los artículos 11 a 17 y 19 de aquella ley, sumó la obligación de declarar
  para los candidatos proclamados a la Presidencia, la Vicepresidencia y las intendencias, y
  agregó el artículo 12 bis, que es el que ordena a la JUTEP abrir las declaraciones de las
  máximas autoridades y publicarlas en su sitio web. Es la razón por la que la sección de
  patrimonio de este sitio puede existir: antes de esta ley las declaraciones no se publicaban.
articulos:
  - numero: "2"
    resumen: >-
      Agregó a la ley 17.060 el artículo 11 bis, que obliga a precandidatos y candidatos
      proclamados a la Presidencia, la Vicepresidencia y las intendencias a presentar declaración
      jurada antes de la elección.
    cita: >-
      Artículo 2 (*)(*)Notas:Este artículo agregó a: Ley Nº 17.060 de 23/12/1998 artículo 11 - BIS.
  - numero: "3"
    resumen: >-
      Reescribió los artículos 12 a 17 y 19 de la ley 17.060 y agregó el artículo 12 bis, que es el
      que manda publicar las declaraciones en el sitio de la JUTEP.
    cita: >-
      Artículo 3 (*)(*)Notas:Este artículo dio nueva redacción a: Ley Nº 17.060 de 23/12/1998
      artículos 12, 13, 14, 15, 16, 17 y 19. Este artículo agregó a: Ley Nº 17.060 de 23/12/1998
      artículo 12 - BIS.
  - numero: "6"
    resumen: >-
      La ley empezó a regir el 1° de marzo de 2020, o sea con el cambio de gobierno. Es la fecha
      desde la cual hay declaraciones publicadas.
    cita: "Artículo 6 (Vigencia).- La presente ley entrará en vigencia el 1° de marzo de 2020."
