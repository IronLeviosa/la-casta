numero: "19.827"
titulo: Declaración de la obligatoriedad de un debate entre candidatos a la Presidencia de la República
nombre_comun: Ley del debate obligatorio
fecha: 2019-09-18
resumen: >-
  Obliga a los dos candidatos que van a segunda vuelta a debatir entre sí antes del balotaje. El
  debate lo organiza la Corte Electoral, se transmite en vivo por cadena nacional de radio y
  televisión en horario central y no puede durar más de dos horas. Quien se niegue a participar
  pierde la contribución del Estado para los gastos de esa segunda elección. Para este sitio es
  la norma que garantiza que exista, cada cinco años, una intervención comparable de los dos
  finalistas sobre los mismos temas.
articulos:
  - numero: "1"
    resumen: >-
      Declara obligatorio el debate entre los candidatos que no alcanzaron la mayoría absoluta en
      octubre y deben ir a la segunda elección.
    cita: >-
      Declárase de carácter obligatorio la celebración de un debate entre los candidatos a la
      Presidencia de la República que, no habiendo logrado la mayoría absoluta de votos requeridos
      para ser electos en la fecha establecida en el numeral 9°) del artículo 77 de la Constitución
      de la República, deban comparecer a una segunda elección
  - numero: "2"
    resumen: >-
      El debate va en vivo, en horario central, por cadena nacional de radio y televisión, y dura
      como máximo dos horas. La producción técnica y la transmisión quedan a cargo del sistema de
      medios públicos.
    cita: >-
      El debate que se celebre será transmitido en vivo y en horario central por cadena nacional de
      radio y televisión, de acuerdo con lo establecido por la Ley N° 19.307, de 29 de diciembre de
      2014 y su duración no excederá las dos horas.
  - numero: "5"
    resumen: >-
      La sanción por no ir: el candidato que se niegue a debatir no cobra la contribución que el
      Estado paga por los gastos de la segunda elección.
    cita: >-
      Los candidatos a la Presidencia de la República referidos en el artículo 1° que se nieguen a
      participar del debate no percibirán la contribución del Estado para los gastos de la segunda
      elección nacional prevista en el artículo 20 de la Ley N° 18.485, de 11 de mayo de 2009.
