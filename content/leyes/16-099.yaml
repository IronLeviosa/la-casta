numero: "16.099"
titulo: Libertad en los medios de comunicación
nombre_comun: Ley de Prensa
fecha: 1989-11-03
resumen: >-
  Es la ley de prensa uruguaya. Declara enteramente libre la expresión de opiniones y la difusión
  de informaciones por cualquier medio, reconoce el secreto profesional del periodista sobre sus
  fuentes, y manda interpretar todo el capítulo según la Declaración Universal de Derechos Humanos
  y la Convención Americana. En su capítulo III crea el derecho de respuesta: cualquier persona
  afectada por una información inexacta o agraviante puede pedirle a un juez que el medio publique
  su respuesta, en un procedimiento de pocos días. Este sitio ofrece una réplica propia, más
  simple y voluntaria, que no reemplaza ese derecho.
articulos:
  - numero: "1"
    resumen: >-
      Declara libre la expresión y la difusión de información por cualquier medio, dentro de los
      límites de la Constitución y la ley, y reconoce el derecho del periodista a no revelar sus
      fuentes.
    cita: >-
      Es enteramente libre en toda materia, la expresión y comunicación de pensamientos u opiniones
      y la difusión de informaciones mediante la palabra, el escrito o la imagen, por cualquier
      medio de comunicación, dentro de los límites consagrados por la Constitución de la República
      y la ley.
  - numero: "7"
    resumen: >-
      Cualquier persona, física o jurídica, pública o privada, puede ir ante el juez a pedir que se
      publique su respuesta cuando un medio la afectó con información inexacta o agraviante. Es un
      derecho que se ejerce en la Justicia y que corre por separado de cualquier reclamo por daños.
    cita: >-
      Toda persona física o jurídica de derecho público o privado puede ejercer ante el Juzgado
      competente el derecho de responder a una publicación o cualesquiera otros medios de
      comunicación pública que la haya afectado por informaciones inexactas o agraviantes
  - numero: "8"
    resumen: >-
      Fija el procedimiento y sus plazos: el juzgado cita a las partes dentro de las 24 horas y la
      audiencia se celebra dentro de las 48; la respuesta que se ordena publicar no puede pasar del
      doble de extensión de lo que se contesta ni contener ofensas.
    cita: >-
      Presentada la solicitud, el Juzgado competente dentro de las veinticuatro horas citará al
      solicitante y al responsable del medio de comunicación respectivo, a una audiencia que se
      celebrará dentro de las cuarenta y ocho horas y que presidirá el Juez, so pena de nulidad
      absoluta.
