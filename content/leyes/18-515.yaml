numero: "18.515"
titulo: Ley de prensa, modificación; Código Penal, modificación
nombre_comun: Reforma de los delitos contra el honor
fecha: 2009-06-26
resumen: >-
  Es la ley que en 2009 reescribió los delitos de difamación e injuria para sacar del riesgo penal
  a quien informa u opina sobre asuntos públicos. Su artículo 4 le dio al artículo 336 del Código
  Penal la redacción que rige hoy: queda exento de responsabilidad quien difunde cualquier
  manifestación sobre un asunto de interés público referida a un funcionario público, salvo que se
  pruebe real malicia, es decir, la intención de agraviar o de meterse en la vida privada. Es la
  norma que hace posible un sitio como este, y también su límite: publicar proceso, fuentes y
  correcciones en abierto es la forma de mostrar que no hay malicia.
articulos:
  - numero: 336 del Código Penal
    resumen: >-
      Exime de responsabilidad penal a quien difunde o reproduce manifestaciones sobre asuntos de
      interés público referidas a funcionarios públicos o a quienes se metieron voluntariamente en
      un asunto público. La exención se cae si se prueba real malicia: la intención de agraviar a
      la persona o de vulnerar su vida privada.
    cita: >-
      Estará exento de responsabilidad el que: A) efectuare o difundiere cualquier clase de
      manifestación sobre asuntos de interés público, referida tanto a funcionarios públicos como a
      personas que, por su profesión u oficio, tengan una exposición social de relevancia, o a toda
      persona que se haya involucrado voluntariamente en asuntos de interés público
  - numero: "1"
    resumen: >-
      Declara de interés general la actividad de los medios de comunicación y la de sus periodistas
      y trabajadores de prensa, tanto escritos como radiales y televisivos.
    cita: >-
      Declárase de interés general la promoción de la actividad de los medios de comunicación, así
      como la actividad de sus periodistas y trabajadores de la prensa en general, tanto de los
      medios escritos como radiales y televisivos.
