nombre: Denuncia ante la JUTEP por el pase en comisión de la hermana de Beatriz Argimón
tipo: otro
temas:
  - transparencia-corrupcion
involucrados:
  - politico: argimon
    rol: denunciado
resumen: La vicepresidenta Beatriz Argimón designó a su hermana Estela Argimón, funcionaria de
  carrera del Banco República, como asesora de su despacho en el Senado mediante un pase en
  comisión. Antes de agosto de 2020 la Junta de Transparencia y Ética Pública (Jutep) recibió una
  denuncia por esa designación, que planteaba una posible contradicción con el artículo 35 del
  decreto 30/003 (que prohíbe la actuación, en la misma oficina, de un funcionario vinculado por
  parentesco de segundo grado con su jerarca). El 10 de agosto de 2020 la Jutep, con la firma de sus
  tres integrantes, archivó la denuncia al concluir que la contratación no contraviene el artículo
  36 de la ley 19.823 y que se ajusta al artículo 32 de la ley 15.851, que autoriza a la
  vicepresidenta a solicitar pases en comisión. Argimón explicó que su hermana "tiene muchísima
  experiencia" en administración y que la eligió para "organizar" su secretaría "en base a
  resultados". El expresidente de la Jutep, Ricardo Gil Iribarne, expresó después "dudas" sobre ese
  archivo.
