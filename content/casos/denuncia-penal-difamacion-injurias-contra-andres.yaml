nombre: Denuncia penal por difamación e injurias contra Andrés Ojeda (caso Ibarra-Antel)
tipo: otro
temas:
  - transparencia-corrupcion
involucrados:
  - politico: ojeda
    rol: denunciado
resumen: El convencional colorado Esequiel Ibarra denunció penalmente al senador y secretario
  general del Partido Colorado Andrés Ojeda por declaraciones hechas en diciembre de 2025 en el
  programa Arriba Gente (Canal 10) y en Radio Sarandí, en las que Ojeda dijo que Ibarra había sido
  sumariado por denuncias falsas contra el entonces presidente de Antel, Gabriel Gurméndez, y por
  casos de acoso contra compañeros y apertura de correspondencia. Ibarra había denunciado
  previamente esas mismas prácticas de Antel; según la diaria, tras esas denuncias fue sumariado
  cuatro veces. La denuncia contra Ojeda, presentada en diciembre de 2025 en Florida, fue derivada
  en mayo de 2026 al fiscal especializado en Delitos Económicos de primer turno, Alejandro Machado
  (la Fiscalía de Delitos Complejos, según otra fuente), que también investiga en el mismo
  expediente denuncias de abuso de funciones contra el diputado Gabriel Gurméndez y el exsenador
  Pablo Lanz por su gestión al frente de Antel. No se encontró información pública sobre el estado
  de la causa después de mayo de 2026 ni sobre el traslado del fiscal Machado a la Fiscalía de
  Cibercrimen, ocurrido también en mayo de 2026.
