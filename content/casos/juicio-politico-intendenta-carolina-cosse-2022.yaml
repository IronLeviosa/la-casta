resumen: La Junta Departamental de Montevideo, mediante su resolución N° 14.247, comunicada al
  Senado por nota N° 04278 del 26 de octubre de 2022, solicitó el juicio político a la intendenta
  Carolina Cosse (artículos 93, 102, 103 y 296 de la Constitución). La acusación se basó en la
  violación del artículo 285 de la Constitución (referido al 284), por reiterados pedidos de
  informes de la oposición que no fueron contestados. La Cámara de Senadores, actuando como
  corresponde en un juicio político, trató el asunto en sesión del 11 de julio de 2023. El único
  informe jurídico incorporado al expediente, del doctor Álvaro Richino, concluyó que no hubo
  inconstitucionalidad en la actuación de Cosse. La comisión asesora votó por unanimidad la
  resolución que propuso al plenario; en sala, el senador Gandini dijo no coincidir con los
  fundamentos del informe de comisión, aunque respaldó la actuación de la Junta Departamental. El
  Senado resolvió, por 22 votos en 23, declarar que no se había encontrado mérito para separarla del
  cargo.
