      nivel: textual
      fuentes:
        - url: https://biblioteca.parlamento.gub.uy/Publicaciones/sesionescss/2023-06-07%20-%20DIARIO%20DE%20SESIONES%20DE%20LA%20CAMARA%20DE%20SENADORES%20(0017).pdf
          medio: parlamento
          fecha: 2023-06-07
          tipo: diario_de_sesiones
          titulo: Diario de Sesiones de la Cámara de Senadores, 17.ª sesión ordinaria, 7 de junio de 2023
          cita: ARTÍCULO ÚNICO.- Ante la solicitud del Juzgado Letrado de Primera Instancia en lo Penal de 36
            Turno, comunicada por la Suprema Corte de Justicia a través del mensaje N° 11/2023, de
            fecha 31 de mayo de 2023, la Cámara de Senadores resuelve declarar que hay lugar a la
            formación de causa al señor Senador Gustavo Penadés y suspenderlo en el ejercicio de sus
            funciones, quedando a disposición del tribunal competente, de conformidad con lo
            previsto por el artículo 114 de la Constitución de la República. Sala de la comisión,
            seis de junio de dos mil veintitrés. (Firman las señoras senadoras Carmen Asiaín y
            Liliam Kechichian y los señores senadores Carlos Camy, Armando Castaingdebat, Charles
            Carrera, Guillermo Domenech, José Carlos Mahía, Adrián Peña y Enrique Rubio)». En
            consideración. Si no se hace uso de la palabra, se va a votar. (Se vota). ‒31 en 31.
            Afirmativa. UNANIMIDAD.
          retrieved_at: 2026-09-09
