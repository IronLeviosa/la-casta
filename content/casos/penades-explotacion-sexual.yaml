resumen: >-
  Gustavo Penadés, exsenador del Partido Nacional, está en prisión preventiva desde octubre de 2023,
  imputado por 22 delitos de índole sexual contra menores de edad y de corrupción pública. La
  Fiscalía presentó la acusación formal en octubre de 2025 y solicitó 16 años de penitenciaría; al 9
  de setiembre de 2026 la causa está en control de acusación y no hay sentencia.


  El caso se originó en marzo de 2023: una militante del propio partido, ya adulta al declarar,
  denunció públicamente que Penadés le había pagado por sexo cuando ella era menor de edad. Penadés
  negó los hechos ese mismo día. La Fiscalía actuó de oficio; el Senado le suspendió los fueros por
  unanimidad el 7 de junio y lo destituyó, también por unanimidad, el 11 de octubre, tras la
  formalización.


  El 10 de octubre de 2023 la jueza Marcela Vargas formalizó a Penadés con prisión preventiva, junto
  con el profesor Sebastián Mauvezín, señalado como nexo con las víctimas. La investigación sumó
  hechos después: una ampliación en mayo de 2025 por cuatro víctimas más y otra en agosto de 2025
  por un hecho de violencia privada de 2014. La preventiva se prorrogó varias veces; en febrero de
  2025 rigió brevemente una domiciliaria con tobillera, revocada una semana después.


  Penadés se declaró inocente en la formalización y sostuvo esa posición después. Ninguna víctima
  menor de edad se identifica en este registro: la mayoría mantiene identidad reservada por decisión
  judicial.
