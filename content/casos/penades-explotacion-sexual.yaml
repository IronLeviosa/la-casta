    descripcion: A pedido del Juzgado Letrado de Primera Instancia en lo Penal de 36.º Turno, comunicado
      por la Suprema Corte de Justicia, el Senado vota por unanimidad (31 en 31) declarar que hay
      lugar a la formación de causa contra Penadés y suspenderlo en el ejercicio de sus funciones,
      de conformidad con el artículo 114 de la Constitución.
