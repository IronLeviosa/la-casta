nombre: Caso Manini Ríos (omisión de denuncia de la confesión de Gavazzo sobre Gomensoro)
tipo: delito_grave
temas:
  - derechos-humanos
involucrados:
  - politico: manini-rios
    rol: denunciado
resumen: "Guido Manini Ríos, comandante en jefe del Ejército, recibió el expediente del Tribunal de
  Honor Militar en el que José Nino Gavazzo confesó haber arrojado al río Negro el cuerpo del
  militante tupamaro Roberto Gomensoro, desaparecido en 1973. Según su versión, informó verbalmente
  de la confesión al entonces ministro de Defensa Jorge Menéndez; según entendió la Fiscalía, no
  presentó la denuncia ante la Justicia, aunque sostuvo que informar a su superior era lo
  correspondiente. La Fiscalía archivó la investigación contra el resto de los generales del
  Tribunal de Honor, pero entendió que Manini Ríos sí era responsable de ese delito y pidió su
  desafuero para formalizarlo. En el debate del Senado se recordó que Menéndez fue destituido por
  otra causa (una nota en la que criticó a la Justicia), no por la confesión de Gavazzo, y que ese
  delito ya había sido juzgado y sobreseído en Paso de los Toros, por lo que regía la cosa juzgada.
  El Senado, con Manini Ríos ya en ejercicio de su banca por Cabildo Abierto, rechazó el desafuero
  (16 en contra, 15 a favor; se necesitaban 21). Tras perder la banca, la Fiscalía reabrió el caso
  sin autorización parlamentaria, pero lo archivó por prescripción: el delito de omisión prescribe a
  los cuatro años y el plazo se había cumplido en 2023. Manini Ríos nunca fue formalizado ni
  imputado formalmente."
