    descripcion: Tras resolver archivar la investigación sobre el resto de los generales del Tribunal de
      Honor y de Alzada por prescripción o falta de mérito, el fiscal Rodrigo Morosoli concluye que
      Manini Ríos sí incurrió en el delito de omisión de denuncia y, en una audiencia del 1 de
      noviembre de 2019, solicita su desafuero para poder formalizarlo. Manini Ríos, consultado,
      respondió que había hecho lo que correspondía y que no discutiría con el fiscal por los
      medios.
