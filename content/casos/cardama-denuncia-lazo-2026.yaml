revision:
  tier: probable
  que_falta: 'Falta una nota que confirme si el escrito contra la ministra Lazo ya llegó a la Fiscalía
    o si sigue sin presentarse: todo lo publicado hasta el 30 de agosto de 2026 habla en futuro
    ("presentará", "debe decidir si investiga"), y nadie encontró todavía la noticia de que el
    escrito haya sido efectivamente recibido.'
  notas_internas: 'Requiere aprobación humana (toda la colección casos la requiere). Cumple el umbral
    del proyecto por la vía de "acusación pública hecha por persona identificable en un medio"
    (Abdala, Sotelo, Schipani, Gianoli, todos nombrados y con cargo, en medios distintos), no por
    "denuncia formal presentada": ninguna fuente de este lote confirma que la Fiscalía haya recibido
    la denuncia a la fecha de esta corrida (2026-09-04); las citas usan lenguaje de decisión e
    intención. Se usa etapa "denuncia" en el sentido del acto público de denunciar/acusar (que el
    umbral sí reconoce como suficiente por esa tercera vía), no como afirmación de que el expediente
    ya esté en Fiscalía; si eso se confirma o se desmiente en una corrida futura, corregir esta
    etapa. Resuelto por el resolvedor de 2026-09-05 (ver
    inbox/resoluciones/2026-09-05/casos-cardama-denuncia-lazo-2026.yaml): "no". Se rastreó la
    cobertura hasta el 30/08/2026 (riotimesonline) y ninguna nota confirma la presentación efectiva
    ante la Fiscalía; todas siguen en lenguaje de futuro. No se fuerza la etapa "denuncia" como
    hecho consumado: se mantiene con el mismo sentido de acto público de denunciar ya explicado
    arriba. Falta, además: (1) verificar con pnpm fuente el estado de la denuncia después del
    30/8/2026; (2) Sandra Lazo no existe hoy como `politico` ni como `referente` en content/
    (verificado en content/politicos/ y content/referentes/); el rol "mencionado" se aplicó solo a
    Orsi (que respalda a su ministra, no está indagado), siguiendo el mismo criterio que el
    precedente de Lacalle Pou/Jutep (content/casos/jutep-declaraciones-juradas-2026.yaml, rol
    mencionado). Lazo, que es el centro real de esta denuncia, no puede listarse en `involucrados`
    hasta que se cree su registro correspondiente (semilla, fuera del alcance de este editor);
    cuando exista, este caso debería actualizarse para incluirla con el rol que corresponda
    (probablemente "indagada" o el equivalente del enum, no "imputada", porque no hay imputación
    formal documentada). Sin desenlace: no se publica en tier publicado (mismo criterio aplicado al
    caso Lacalle Pou/Jutep, que también está en probable sin desenlace). El contrato original con
    Cardama (2023, gestión de Lacalle Pou) y la denuncia del propio gobierno de Orsi contra la
    empresa (octubre de 2025) se describen en el resumen solo como contexto: no son objeto de este
    caso, que es la denuncia de la oposición contra Lazo. La responsabilidad de la gestión de
    Lacalle Pou en el contrato original es materia de la corrida de Lacalle Pou (ya anotada como
    pista en la-casta-corpus/pistas/lacalle-pou.yaml).'
