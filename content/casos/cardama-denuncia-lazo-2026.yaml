    descripcion: La Coalición Republicana (Partido Nacional, Partido Colorado, Partido Independiente)
      resolvió presentar una denuncia penal contra la ministra de Defensa Nacional, Sandra Lazo, y
      sus asesores Daniel Marsiglia y Damián Rojas. El diputado nacionalista Pablo Abdala la
      calificó como "delito de abuso de funciones"; los diputados Gerardo Sotelo (Partido
      Independiente), Felipe Schipani (Partido Colorado) y Gabriel Gianoli (Partido Nacional) venían
      planteando, desde mayo de 2026, caratularla como "pesquisa" (artículo 287 del Código Penal) y
      "usurpación de funciones" (artículo 166), por considerar que los asesores actuaron antes de su
      designación formal en los cargos. Ni la nota de mayo de 2026 ("la decisión ya está tomada y el
      texto está siendo redactado... los legisladores esperarán algunos días más para presentarla")
      ni las de agosto confirman que la denuncia haya sido efectivamente recibida por la Fiscalía a
      la fecha de esta corrida.
