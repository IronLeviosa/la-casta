nombre: Denuncia penal de la oposición contra la ministra de Defensa Nacional, Sandra Lazo, por el
  caso Cardama
tipo: otro
temas:
  - transparencia-corrupcion
involucrados:
  - politico: orsi
    rol: mencionado
resumen: 'El contrato entre el Ministerio de Defensa Nacional y el astillero español Cardama para
  dos patrullas oceánicas de la Armada, firmado a mediados de 2023 por el entonces ministro Javier
  García (gestión de Lacalle Pou) por 82,2 millones de euros, fue revisado desde marzo de 2025 por
  el Ministerio de Defensa ya bajo la ministra Sandra Lazo, con los asesores Daniel Marsiglia y
  Damián Rojas. Esa revisión derivó en cuatro sanciones disciplinarias a militares (el excomandante
  en jefe de la Armada Jorge Wilson, los contralmirantes Miguel de Souza y José Ruiz, y el capitán
  de navío Marcelo da Silva) y, en octubre de 2025, en el anuncio del gobierno de Orsi de rescindir
  el contrato con Cardama y denunciar penalmente a la empresa por "fuertes indicios de fraude o
  estafa contra el Estado uruguayo", a partir de una garantía de cumplimiento de una empresa
  británica sin actividad real. Por separado, desde mayo de 2026 legisladores de la oposición (el
  colorado Felipe Schipani, el independiente Gerardo Sotelo y el nacionalista Gabriel Gianoli)
  cuestionaron que Marsiglia y Rojas hubieran ejercido funciones (entrevistas a militares, revisión
  de expedientes, reunión con el titular de Cardama) antes de su designación formal, y resolvieron
  denunciarlos penalmente por "pesquisa" (artículo 287 del Código Penal) y "usurpación de funciones"
  (artículo 166); a esa fecha la decisión ya estaba tomada y el texto en redacción, pero la
  presentación se demoraba a la espera de más información pedida a Defensa. El 24 de agosto de 2026
  la Coalición Republicana (Partido Nacional, Partido Colorado, Partido Independiente) resolvió
  presentar una denuncia penal contra Lazo, que el diputado nacionalista Pablo Abdala calificó como
  "delito de abuso de funciones". Las fuentes consultadas en este lote no confirman que esa denuncia
  haya sido efectivamente recibida por la Fiscalía a la fecha de esta corrida (2026-09-04): usan
  lenguaje de decisión y de intención ("resolvieron presentar", "el texto está siendo redactado"),
  no de presentación consumada. Lazo, de licencia médica, respondió por redes sociales sin referirse
  al contenido de la denuncia. Orsi respaldó públicamente a la ministra ("el respaldo a la ministra
  es absoluto, es 100%", 25/8/2026, registrado en declaraciones.yaml), aclarando que no había leído
  la denuncia; no está indagado ni imputado en esta causa, y su intervención es de respaldo político
  a una subordinada, no de responsabilidad jerárquica sobre un hecho propio.'
estado_judicial:
  - fecha: 2026-08-24
