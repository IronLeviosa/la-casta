resumen: 'Alejandro Astesiano, jefe de la custodia del presidente Luis Lacalle Pou, fue detenido el
  25 de setiembre de 2022 en el marco de una investigación de la Fiscalía de Flagrancia por una red
  que falsificaba partidas de nacimiento para obtener pasaportes uruguayos para ciudadanos rusos.
  Fue imputado el 27 de setiembre de 2022 y condenado el 15 de febrero de 2023, en proceso
  abreviado, a cuatro años y seis meses de prisión, multa e inhabilitación para cargos públicos por
  asociación para delinquir, tráfico de influencias, conjunción del interés público con el privado y
  revelación de secreto; la Fiscalía le retiró el cargo de suposición de estado civil (falsificación
  de documento). Lacalle Pou nunca fue imputado ni indagado en esta causa: su única intervención
  procesal fue declarar como testigo ante la fiscal Gabriela Fossati el 26 de diciembre de 2022, en
  la residencia presidencial. Su vínculo con el caso es de responsabilidad jerárquica (Astesiano era
  funcionario bajo su mando) y político: el 26 de setiembre de 2022 dijo que Astesiano "no tiene
  antecedentes penales", afirmación contradicha días después por la prensa (ver chequeo), y asumió
  la responsabilidad de la contratación.'
