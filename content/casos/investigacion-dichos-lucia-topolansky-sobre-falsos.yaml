nombre: Investigación por los dichos de Lucía Topolansky sobre falsos testimonios en juicios de lesa
  humanidad
tipo: otro
temas:
  - derechos-humanos
  - transparencia-corrupcion
involucrados:
  - politico: topolansky
    rol: denunciado
resumen: "En una entrevista para el libro \"Los indomables\", del periodista Pablo Cohen, publicada
  en diciembre de 2024, la exvicepresidenta Lucía Topolansky dijo: \"La gente miente en las
  declaraciones. A un compañero nuestro le dijeron: 'Mentí, decí esto y aquello, metamos preso a
  fulano'. Él contestó: 'No lo voy a decir'. Ahí te acusan de traidor y dicen que los tupamaros no
  dijeron nada\", sobre los juicios por crímenes de lesa humanidad de la dictadura. Las
  declaraciones, ratificadas después por José Mujica, generaron rechazo de Madres y Familiares de
  Uruguayos Detenidos Desaparecidos y del Frente Amplio. El fiscal de Lesa Humanidad Ricardo
  Perciballe pidió citarla, con \"absoluta convicción\" de que las víctimas \"han expresado la
  verdad\"; la jueza Verónica Pena rechazó el pedido y lo remitió a una fiscalía de Flagrancia, que
  debía decidir si la citaba como indagada o como testigo. Un Tribunal de Apelaciones revocó esa
  decisión y habilitó a citarla como testigo en la causa original. Topolansky respondió con una
  carta de puño y letra, reconociendo el error y diciendo hacerse cargo de las consecuencias, aunque
  sin retractarse de lo dicho. Declaró durante dos horas ante la Fiscalía; según la Fiscalía General
  de la Nación, \"no aportó ningún nombre concreto ni ningún dato útil para la investigación\".
  Nunca fue citada como indagada."
