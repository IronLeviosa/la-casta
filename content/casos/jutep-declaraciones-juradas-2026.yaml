    rol: mencionado
resumen: El 7 de junio de 2026 el convencional nacional del Partido Colorado Esequiel Ibarra
  presentó ante la Junta de Transparencia y Ética Pública una denuncia, aceptada tras revisión
  técnica e ingresada el 8 de junio, que pide evaluar la consistencia y trazabilidad de la evolución
  patrimonial declarada por el expresidente Luis Lacalle Pou desde su ingreso a la Cámara de
  Diputados en 2000 hasta el fin de su presidencia en 2025. El denunciante señala como "indicadores"
  un vehículo Suzuki modelo 2020 cuya valuación aumentó entre declaraciones y una camioneta Toyota
  que dejó de figurar sin explicación en los documentos, y aclara que la presentación "no tiene como
  fin formular imputaciones ni atribuir conductas irregulares". Es una denuncia administrativa, no
  penal. Al 12 de junio de 2026 el expediente estaba creado pero el directorio de la JUTEP aún no lo
  había estudiado; no hay resolución ni pronunciamiento, y no se halló respuesta pública de Lacalle
  Pou.
