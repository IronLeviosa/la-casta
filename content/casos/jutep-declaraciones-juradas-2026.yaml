revision:
  tier: probable
  notas_internas: 'Requiere aprobación humana. Fuente única (Montevideo Portal, grupo montevideo-comm;
    la primicia es de Info Capital/TV Ciudad y LR21 publicó lo mismo, ninguno leído con pnpm
    fuente). El rol "mencionado" es el único del enum que no afirma más de lo que hay: no está
    imputado (no es una causa penal ni hay pronunciamiento) y no es un hecho de subordinados.
    Pendiente: estado del expediente a la fecha de publicación, descargo de Lacalle Pou, segunda
    fuente. Es una denuncia administrativa sobre la consistencia de dos vehículos entre
    declaraciones, aún no estudiada: no debe presentarse con el mismo peso que un caso con condena.
    El patrimonio declarado en sí se trata en la corrida de patrimonio, aparte.'
