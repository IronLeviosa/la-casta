nombre: Investigación penal por la construcción del Antel Arena
tipo: corrupcion
temas:
  - transparencia-corrupcion
  - empresas-publicas
involucrados:
  - politico: cosse
    rol: denunciado
resumen: El directorio de ANTEL denunció penalmente irregularidades en la construcción del complejo
  Antel Arena, a partir de una auditoría de la consultora Ecovis que cuestionó el uso de compra
  directa por excepción, contra la gestión anterior de la empresa, presidida entonces por Carolina
  Cosse. La denuncia no fue unánime, ya que se presentó con el rechazo del director en
  representación del Frente Amplio. Montevideo Portal atribuyó a Cosse haber comunicado un costo de
  40 a 45 millones de dólares, frente a los 120 millones que señaló la auditoría. Cosse declaró como
  indagada ante la Fiscalía de Delitos Económicos. El fiscal Alejandro Machado archivó primero la
  causa por falta de ilicitud penal, aunque constató "desprolijidades" y un "manejo dispendioso de
  los recursos públicos"; a pedido de ANTEL, la Justicia habilitó un reexamen y el fiscal Enrique
  Rodríguez confirmó después el archivo definitivo. Concluyó que hubo "amplia coincidencia" en que
  era "muy difícil" estimar de antemano el costo final, que el costo real (US$ 85.995.517 sin
  equipamiento, según el Tribunal de Cuentas al Parlamento en 2019) estaba en línea con esos
  testimonios, y que no había desviación penalmente sancionable ni actos de corrupción. Cosse, ya
  vicepresidenta electa, calificó el proceso de "operación política" que "intentó aleccionar a los
  funcionarios públicos y a la población de las cosas que pasan cuando se hacen cosas nuevas".
