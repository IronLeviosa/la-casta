revision:
  tier: probable
  notas_internas: "Requiere aprobación humana. Tier probable porque: (1) el estado de la investigación
    por destrucción de documento a setiembre de 2026 no está verificado (ver
    hipotesis/lacalle-pou/marset-destruccion-documento-estado.yaml); (2) la expedición del pasaporte
    (30/11/2021), la interpelación (22/08/2022) y la renuncia de Ache (diciembre 2022) están en el
    lote solo con Wikipedia y por eso no figuran como hitos propios; (3) no se verificó si la
    citación de Lacalle Pou por Fiscalía mencionada a fines de 2023 se concretó. Versiones
    contrapuestas que el registro no zanja: si en la reunión se pidió borrar mensajes (solo lo
    sostiene Ache; no hay resolución que lo declare probado), quién lo pidió (El Observador: Lafluf;
    la diaria: Bustillo y Lafluf), y la fecha de la reunión (25/10 según Lacalle Pou, 25/11 según
    Ache y el chat difundido por Búsqueda). Se armó como un solo caso con última etapa
    investigacion, según lo pedido por el editor, y no como dos (pasaporte archivado / documento en
    investigación) como prefería el crítico: publicar cerrado_sin_condena sería publicar un cierre
    que no ocurrió."
