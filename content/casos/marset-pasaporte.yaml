resumen: Investigación de la Fiscalía, iniciada de oficio en agosto de 2022 a partir de la
  interpelación en el Senado a los ministros Bustillo (Relaciones Exteriores) y Heber (Interior),
  sobre la expedición en noviembre de 2021 de un pasaporte uruguayo al narcotraficante Sebastián
  Marset, entonces detenido en Emiratos Árabes Unidos, y sobre las actuaciones posteriores de
  jerarcas del gobierno respecto de los chats en los que el subsecretario Maciel advertía a la
  subsecretaria Ache que Marset era "muy peligroso". En noviembre de 2023 Ache declaró ante la
  Fiscalía que, en una reunión en Torre Ejecutiva convocada por el asesor presidencial Roberto
  Lafluf a pedido del presidente, Lafluf pidió a ella y a Maciel borrar esos mensajes y luego
  rehacer un protocolo notarial sin ellos; según Ache, tras su negativa y una consulta de Lafluf al
  presidente, la instrucción fue presentar todo, y los documentos se presentaron en el juzgado.
  Lacalle Pou sostuvo que pidió la reunión "a los efectos de tener una línea única de trabajo y
  acción", que solo pasó a saludar y que cuando lo llamaron dijo que "se presente todo"; el 4 de
  noviembre de 2023 aceptó las renuncias de Heber, Maciel y Lafluf (Bustillo había renunciado días
  antes). Ninguna fuente sostiene que Lacalle Pou haya pedido borrar mensajes; nunca fue imputado ni
  indagado en esta causa. El 2 de setiembre de 2024 el fiscal Alejandro Machado archivó la causa por
  la entrega del pasaporte al no hallar conductas con reproche penal, aunque concluyó que los
  jerarcas interpelados "faltaron a la verdad y ocultaron información" al Senado; ese archivo no
  alcanzó a la investigación sobre la posible destrucción del documento protocolizado por Ache, que
  quedó abierta. El estado de esa investigación a setiembre de 2026 no está verificado en este
  registro.
