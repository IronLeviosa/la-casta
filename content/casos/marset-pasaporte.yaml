revision:
  tier: probable
  que_falta: Falta una nota periodística, posterior a junio de 2026, que diga si la Fiscalía ya asignó
    un fiscal titular a la causa por la destrucción del documento y en qué terminó esa indagatoria,
    y si el expresidente Lacalle Pou llegó a ser citado a declarar.
  notas_internas: "Requiere aprobación humana: el último hito de la línea de tiempo es investigacion
    (causa sin resolución judicial), y la regla vigente de la compuerta exige firma humana para todo
    caso sin resolución (Astesiano, que sí tiene condena, ya no la necesita). Resuelto por el
    resolvedor de 2026-09-05 (ver inbox/resoluciones/2026-09-05/casos-marset-pasaporte.yaml): los
    tres hitos que antes solo tenían Wikipedia (expedición del pasaporte, 30/11/2021; interpelación,
    22/08/2022; renuncia de Ache, 19/12/2022) ahora tienen dos fuentes de grupos distintos cada uno
    y se agregaron como hitos propios. También se sumaron dos hitos verificados por el editor: (a)
    02/10/2025, la investigación administrativa de Cancillería/Presidencia sobre la destrucción del
    documento concluyó y se remitió a la Fiscalía sin que Lacalle Pou hubiera sido citado (fuente
    única, El Observador; falta segunda fuente); (b) hasta el 03/06/2026 la Fiscalía seguía sin
    fiscal titular para esa causa, con tres fuentes de tres grupos distintos (Subrayado, El
    Observador, VTV). Sigue sin verificarse con una fuente catalogada el estado de la causa entre
    junio y setiembre de 2026: una nota de Prensa Mercosur (26/08/2026) agrega detalle sobre lo que
    Ache le ocultó a la instructora administrativa, pero cita como origen a El Observador (mismo
    día) y no cuenta como segunda fuente independiente de ese hecho puntual; tampoco se verificó si
    la citación de Lacalle Pou por Fiscalía mencionada a fines de 2023 se concretó, ni el estado del
    sumario administrativo contra Bustillo y Mata más allá de octubre de 2025 (hay una nota de La
    Mañana, 22/06/2026, sobre una sanción a Bustillo por esa causa, pero ese medio no está dado de
    alta en content/medios/ y queda como pista para una corrida futura, no como fuente_nueva).
    Versiones contrapuestas que el registro no zanja: si en la reunión se pidió borrar mensajes
    (solo lo sostiene Ache; no hay resolución que lo declare probado), quién lo pidió (El
    Observador: Lafluf; la diaria: Bustillo y Lafluf), y la fecha de la reunión (25/10 según Lacalle
    Pou, 25/11 según Ache y el chat difundido por Búsqueda). Se armó como un solo caso con última
    etapa investigacion, según lo pedido por el editor, y no como dos (pasaporte archivado /
    documento en investigación) como prefería el crítico: publicar cerrado_sin_condena sería
    publicar un cierre que no ocurrió."
