nombre: Denuncia por posible violación del artículo 124 de la Constitución (Andrés Ojeda, ejercicio
  de la abogacía como senador)
tipo: otro
temas:
  - transparencia-corrupcion
involucrados:
  - politico: ojeda
    rol: denunciado
resumen: 'El senador colorado Andrés Ojeda, además de legislador, ejerce como abogado penalista. La
  fiscal de Flagrancia Sylvia Lovesio planteó que, al presentar un escrito ante la Fiscalía para
  reexaminar una causa de un cliente (70 páginas, según El Observador; 75, según Caras y Caretas),
  Ojeda podría haber violado el artículo 124 de la Constitución, que prohíbe a los legisladores
  tramitar asuntos de terceros ante servicios descentralizados (la Fiscalía lo es desde 2017) y
  sanciona el incumplimiento con la pérdida inmediata de la banca. El convencional colorado Juan
  Esequiel Ibarra lo denunció por el mismo hecho. Ojeda defendió su actuación con un informe del
  constitucionalista Correa Fleitas; un informe posterior de la División Jurídica del Poder
  Legislativo, pedido por el propio Ojeda, concluyó que su actuación "no encuadraría" en las
  prohibiciones del artículo. Lovesio formalizó después su propia posición: dio por "no presentado"
  el escrito de Ojeda, archivó la causa en la que había intervenido y concluyó que su actuación sí
  contravino el artículo 124. El Frente Amplio retomó el planteo en el Senado y logró convocar a
  tres constitucionalistas para que opinen sobre el caso. No se inició juicio político y no hay una
  resolución final posterior de la comisión ni del plenario del Senado.'
estado_judicial:
  - fecha: 2025-11-20
    etapa: denuncia
    descripcion: En una audiencia judicial, la fiscal Sylvia Lovesio plantea que el senador Andrés Ojeda
      podría haber incurrido en una violación del artículo 124 de la Constitución al presentar, como
      abogado, un escrito ante la Fiscalía para reexaminar una causa penal; eleva la consulta a la
      Fiscalía de Corte, cuya subrogante Mónica Ferrero responde que, por haber una investigación en
      curso, no le corresponde pronunciarse y deja la decisión a criterio de Lovesio. El
      convencional colorado Juan Esequiel Ibarra denuncia a Ojeda por el mismo hecho ante la
      Secretaría General y el Comité de Ética del Partido Colorado.
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.carasycaretas.com.uy/politica/andres-ojeda-fue-denunciado-la-fiscal-lovesio-puede-ser-destituido-n90301
