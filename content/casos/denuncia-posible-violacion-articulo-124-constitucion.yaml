          fecha: 2025-11-25
          tipo: nota
          titulo: "Andrés Ojeda fue denunciado por la fiscal Lovesio: ¿Puede ser destituido?"
          cita: La fiscal planteó la posibilidad de que Ojeda haya incurrido en la violación del artículo 124
            de la Constitución de la República al presentar un escrito ante la Fiscalía para
            reimpulsar una causa de un cliente.
          retrieved_at: 2026-09-09
