          retrieved_at: 2026-09-09
        - url: https://www.busqueda.com.uy/politica/informe-la-division-juridica-del-legislativo-concluye-que-no-corresponderia-remover-ojeda-del-senado-ejercer-como-abogado-n5407782
          medio: busqueda
          fecha: 2025-12-11
          tipo: nota
          titulo: Informe de la División Jurídica del Legislativo concluye que "no correspondería" remover a
            Ojeda del Senado por ejercer como abogado
          cita: En una audiencia judicial del 20 de noviembre, según informó el periodista Eduardo Preve, la
            fiscal Sylvia Lovesio planteó que el artículo 124 de la Constitución impide a los
            parlamentarios en ejercicio "tramitar o dirigir asuntos de terceros ante la
            administración central, gobiernos departamentales, entes autónomos y servicios
            descentralizados", como lo es la Fiscalía General de la Nación (FGN) desde 2017.
          retrieved_at: 2026-09-09
  - fecha: 2025-12-11
    etapa: investigacion
    descripcion: A pedido de Ojeda, un informe de la División Jurídica del Poder Legislativo concluye
      que su intervención como abogado defensor penal "no encuadraría" en las prohibiciones del
      artículo 124 y que no correspondería hacerlo cesar de forma inmediata como senador; el Frente
      Amplio mantiene el planteo abierto en la Comisión de Constitución y Legislación del Senado.
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.elobservador.com.uy/nacional/informe-juridico-del-parlamento-asegura-que-caso-ojeda-no-encuadraria-dentro-las-prohibiciones-disputas-el-articulo-124-n6027802
          medio: el-observador
          fecha: 2025-12-11
          tipo: nota
          titulo: Informe jurídico del Parlamento dice que caso de Ojeda "no encuadraría" en las prohibiciones
            constitucionales
          cita: El informe jurídico solicitado por el senador Andrés Ojeda a finales de noviembre a la
            Comisión Administrativa del Poder Legislativo concluyó que su intervención como
            "profesional abogado ejerciendo una defensa letrada penal no encuadraría dentro de las
            prohibiciones dispuestas por el artículo 124 de la Constitución".
          retrieved_at: 2026-09-09
        - url: https://www.busqueda.com.uy/politica/informe-la-division-juridica-del-legislativo-concluye-que-no-corresponderia-remover-ojeda-del-senado-ejercer-como-abogado-n5407782
          medio: busqueda
          fecha: 2025-12-11
          tipo: nota
          titulo: Informe de la División Jurídica del Legislativo concluye que "no correspondería" remover a
            Ojeda del Senado por ejercer como abogado
          cita: tomando en cuenta la finalidad de la disposición constitucional y el concepto de
            proporcionalidad, en aplicación del principio de razonabilidad, y conforme a los
            principios de la democracia representativa, no correspondería hacer cesar de forma
            inmediata al señor Andrés Ojeda, en su calidad de Senador de la República
          retrieved_at: 2026-09-09
  - fecha: 2026-03-12
    etapa: investigacion
    descripcion: 'La fiscal Sylvia Lovesio formaliza su decisión sobre el escrito presentado por Ojeda
      como abogado, lo da por "no presentado", archiva el expediente de la causa penal en la que el
      senador había intervenido, y concluye que el artículo 124 de la Constitución "debe
      interpretarse de forma amplia" y que la actuación del legislador contravino esa norma. No
      dispone ninguna sanción contra Ojeda: la eventual pérdida de la banca es materia del Senado,
      no de la Fiscalía.'
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.montevideo.com.uy/Noticias/Fiscal-concluyo-que-Ojeda-violo-Constitucion--El-124-no-es-una-simple-regla-de-conducta--uc955670
          medio: montevideo-portal
          fecha: 2026-03-12
          tipo: nota
          titulo: Fiscal concluyó que Ojeda violó Constitución - El 124 no es una simple regla de conducta
          cita: Sylvia Lovesio resolvió tomar como "no presentado" el documento elevado por el senador y no
            hará el reexamen solicitado de una causa penal.
          retrieved_at: 2026-09-09
        - url: https://www.elobservador.com.uy/nacional/frente-amplio-descarta-archivar-denuncia-contra-ojeda-violar-la-constitucion-y-pidio-citar-constitucionalistas-al-parlamento-n6037665
          medio: el-observador
          fecha: 2026-03-17
          tipo: nota
          titulo: Frente Amplio descarta archivar denuncia contra Ojeda por violar la Constitución y pidió
            citar a constitucionalistas al Parlamento
          cita: la fiscal Sylvia Lovesio formalizó su decisión la semana pasada en la que concluye que la
            Constitución le prohíbe al senador colorado ejercer la abogacía y por eso rechazo un
            escrito presentado por Ojeda en el que pedía el desarchivo de un caso.
          retrieved_at: 2026-09-09
  - fecha: 2026-03-17
    etapa: investigacion
    descripcion: En la Comisión de Constitución y Legislación del Senado, una moción del senador
      colorado Javier García para archivar el caso no prospera; por 5 votos en 9 el Frente Amplio
      aprueba convocar a los constitucionalistas Martín Risso, José Korzeniak y Daniel Ochs para que
      opinen sobre la situación de Ojeda y sobre la reglamentación del artículo 124. No se promueve
      un juicio político.
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.carasycaretas.com.uy/politica/ojeda-el-ojo-la-tormenta-juicio-politico-persecucion-ilegal-n93724
          medio: caras-y-caretas
          fecha: 2026-03-19
          tipo: nota
          titulo: Ojeda en el ojo de la tormenta - de juicio político a persecución ilegal
          cita: Luego de un cuarto intermedio, el senador Javier García propuso archivar el caso, pero su
            moción no prosperó. Por cinco votos de nueve, el FA aprobó su moción y se citará a
            Risso, Korzeniak y Ochs.
          retrieved_at: 2026-09-09
        - url: https://www.elobservador.com.uy/nacional/frente-amplio-descarta-archivar-denuncia-contra-ojeda-violar-la-constitucion-y-pidio-citar-constitucionalistas-al-parlamento-n6037665
          medio: el-observador
          fecha: 2026-03-17
          tipo: nota
          titulo: Frente Amplio descarta archivar denuncia contra Ojeda por violar la Constitución y pidió
            citar a constitucionalistas al Parlamento
          cita: En la moción presentada este martes, y leída por el senador Nicolás Viera en comisión, el
            oficialismo pidió la comparecencia de Martín Risso, José Korzeniak y Daniel Ochs para
            que opinen sobre la posible "reglamentación del artículo 124 de la Constitución" y sobre
            la situación del senador Ojeda.
          retrieved_at: 2026-09-09
