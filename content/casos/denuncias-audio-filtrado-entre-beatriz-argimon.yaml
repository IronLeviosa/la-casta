nombre: Denuncias por el audio filtrado entre Beatriz Argimón y Fernando Cristino (2020)
tipo: otro
temas:
  - transparencia-corrupcion
involucrados:
  - politico: argimon
    rol: denunciado
resumen: A mediados de junio de 2020 se difundió el audio de una conversación privada entre la
  vicepresidenta Beatriz Argimón y el relacionista público Fernando Cristino, en la que se mencionan
  escuchas telefónicas y un pedido de dinero. El 22 de junio Cristino ratificó ante la Fiscalía de
  Flagrancia de 15º turno una denuncia por amenazas que, según información de Subrayado, incluye a
  Argimón. El 24 de junio la bancada de senadores del Frente Amplio presentó una denuncia separada
  en la Fiscalía General de la Nación, sosteniendo que de la conversación podrían desprenderse
  "diferentes delitos" que involucrarían a la vicepresidenta, y pidió el inicio de una
  investigación; según la diaria, el abogado Gustavo Salle presentó otra denuncia penal por el mismo
  episodio en esos días. La decisión del Frente Amplio de acudir a la Fiscalía se tomó después de
  una reunión entre Argimón y los senadores de todos los partidos; los legisladores oficialistas
  dieron el tema por laudado tras escuchar sus argumentos, mientras que el exministro Eduardo Bonomi
  sostuvo que la explicación "no quiere decir que la vicepresidenta sea culpable de nada, pero hay
  que investigar y aclarar el hecho, porque su declaración no lo hace". Argimón respondió
  públicamente que no quiso decir que hubiera "escuchas oficiales". No hay resolución pública
  conocida de ninguna de las dos denuncias; Argimón no fue indagada ni formalizada.
