alias:
  - Tribunal de Cuentas
  - TCR
propiedad:
  descripcion: >-
    Órgano de contralor de la Constitución uruguaya, con autonomía técnica, orgánica y funcional,
    que ejerce el control de la Hacienda Pública, incluida la ejecución presupuestal y financiera
    de los organismos públicos y de los proyectos con financiamiento de organismos multilaterales
    como el Banco Mundial y el BID.
  fuentes:
    - url: https://www.tcr.gub.uy/
      medio: tribunal-de-cuentas
      fecha: 2026-09-09
      tipo: documento_oficial
      titulo: Presentación Institucional - Tribunal de Cuentas
      cita: El Tribunal de Cuentas es la Entidad Fiscalizadora Superior que, con autonomía técnica,
        orgánica y funcional y en cumplimiento de la Constitución y las leyes de la República,
        ejerce el contralor de la Hacienda Pública en beneficio directo de la Sociedad.
      retrieved_at: 2026-09-09
