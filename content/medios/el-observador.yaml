      tipo: nota
      titulo: El Observador cambia de accionistas
      cita: >-
        Los adquirentes manifiestan tener "un enorme compromiso con la libertad de expresión y al acceso a la información tanto en Uruguay, como en el resto de la región”.
      retrieved_at: 2026-09-03
