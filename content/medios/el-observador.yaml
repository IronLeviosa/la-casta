propiedad:
  descripcion: >-
    Fundado el 22 de octubre de 1991 como El Observador Económico. Ricardo Peirano quería un diario
    sin identificación partidaria y propuso fundarlo en lugar de comprar La Mañana, como le había
    planteado el abogado Héctor Viana Martorell. A la idea se sumaron otros siete empresarios:
    Roberto Acle, Julio Blanco, Horacio Fernández Ameglio, Roberto Fossati, Lionel Hudson, Alfredo
    Iraola y Alfonso Pablo Varela.


    Entre 1991 y el 4 de mayo de 2022 figura con dueño desconocido. No se encontró fuente que diga
    qué participación tenía cada socio ni quién tuvo la mayoría en esos años; que Peirano haya
    impulsado la fundación no prueba que controlara la sociedad.


    Sí hay un cambio de socios documentado. En junio de 2011, según el portal brasileño Coletiva, El
    Observador desmintió que se hubiera vendido y confirmó que el empresario Ernesto Correa había
    invertido en el diario, sin decir montos. No se encontró fuente sobre la fecha ni el porcentaje
    de esa inversión, ni sobre si cambió quién controlaba el diario.


    Peirano cuenta en una entrevista de 2024 que vendió la empresa en 2022. Desde el 5 de mayo de
    ese año el control accionario es de un grupo de inversores encabezado por Gerardo Werthein y
    Gabriel Hochbaum; el anuncio dice que Pablo Tarantino asumirá la presidencia del grupo y que
    Peirano seguirá como director periodístico.
  fuentes:
    - url: https://www.elobservador.com.uy/nota/como-se-gesto-la-creacion-de-el-observador-2021102210250
      medio: el-observador
      fecha: 2021-10-23
      tipo: nota
      titulo: Cómo se gestó la creación de El Observador
      cita: "El tiempo pasó y en 1990 el abogado Héctor Viana Martorell, al que ya conocía, le propuso
        unirse para comprar La Mañana. Pero ese periódico tenía una gran asociación con el Partido
        Colorado, más específicamente con el riverismo, y Peirano quería que el nuevo medio no
        tuviera identificación partidaria alguna. Por eso, le hizo una contrapropuesta: fundar un
        nuevo medio. A la idea se sumaron otros siete empresarios –Roberto Acle, Julio Blanco,
        Horacio Fernández Ameglio, Roberto Fossati, Lionel Hudson, Alfredo Iraola y Alfonso Pablo
        Varela."
      retrieved_at: 2026-10-29
