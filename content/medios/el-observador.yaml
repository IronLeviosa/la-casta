propiedad:
  descripcion: Fundado en 1991 por Ricardo Peirano. Desde el 5 de mayo de 2022 el control accionario pertenece a un grupo de inversores argentinos encabezado por Gerardo Werthein y Gabriel Hochbaum; Pablo Tarantino preside el grupo y Peirano quedó como director periodístico.
  fuentes:
