      medio: el-observador
      fecha: 2022-05-11
      tipo: nota
      titulo: El Observador cambia de accionistas
      cita: Con fecha 5 de mayo de 2022, un grupo de inversores encabezado por Gerardo Werthein y Gabriel Hochbaum adquirió el control accionario del grupo periodístico uruguayo El Observador. Como resultado de este cambio en el control, Pablo Tarantino asumirá la presidencia del grupo.
      retrieved_at: 2026-09-03
    - url: https://es.wikipedia.org/wiki/El_Observador_(Uruguay)
      medio: wikipedia
      fecha: 2026-09-03
      tipo: nota
      titulo: El Observador (Uruguay)
      cita: El Observador es un periódico y portal de noticias uruguayo fundado el 22 de octubre de 1991. Se lo considera uno de los principales periódicos del país.
      retrieved_at: 2026-09-03
alineamiento:
  etiqueta: sin_datos
  justificacion: No se encontró una fuente de terceros que documente un vínculo partidario ni una orientación editorial; el comunicado de los nuevos accionistas solo declara compromiso con la libertad de expresión. Se buscó en Wikipedia y en la nota de cambio de accionistas.
  fuentes:
