alineamiento:
  etiqueta: sin_datos
  justificacion: No se encontró una fuente de terceros que documente un vínculo partidario ni una
    orientación editorial; el comunicado de los nuevos accionistas solo declara compromiso con la
    libertad de expresión. Se buscó en Wikipedia y en la nota de cambio de accionistas.
