alias: [AEBU, Asociación de Bancarios del Uruguay]
propiedad:
  descripcion: Sindicato que nuclea a los trabajadores de la banca uruguaya, pública y privada,
    incluidos los del Banco Hipotecario del Uruguay a través del Consejo del Sector Financiero
    Oficial. Publica en su sitio comunicados, informes de su Consejo Central hacia sus asambleas y
    posiciones gremiales sobre la banca oficial.
  fuentes:
    - url: https://www.aebu.org.uy/noticias/40032
      medio: aebu
      fecha: 2023-11-08
      tipo: nota
      titulo: ANV y BHU esenciales para garantizar derecho a la vivienda
      cita: En medio de debates políticos y propuestas que han cuestionado la relevancia del Banco
        Hipotecario del Uruguay (BHU), AEBU se ha pronunciado en defensa de la importancia de
        fortalecer las instituciones públicas encargadas de garantizar este derecho.
      retrieved_at: 2026-09-09
alineamiento:
  etiqueta: sin_datos
  justificacion: Es un sindicato de trabajadores bancarios, con interés directo en la continuidad y
    fortaleza de los bancos públicos donde se emplean sus afiliados (BROU, BHU, BCU, BSE). No se
    encontró en esta corrida una fuente que documente un vínculo partidario formal; se deja
    sin_datos con el mismo criterio aplicado a otros gremios sin alineamiento documentado.
  fuentes:
    - url: https://www.aebu.org.uy/noticias/40032
      medio: aebu
      fecha: 2023-11-08
      tipo: nota
      titulo: ANV y BHU esenciales para garantizar derecho a la vivienda
      cita: El informe del Consejo Central destaca como un logro haber podido evitar que se
        debatiera la fusión del BROU y el BHU, una iniciativa que habría debilitado la capacidad
        de este último para cumplir con su misión de facilitar el acceso a la vivienda para todos
        los uruguayos.
      retrieved_at: 2026-09-09
