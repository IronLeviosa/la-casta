propiedad:
  descripcion: Organismo financiero multilateral formado en la Conferencia de Bretton Woods de 1944;
    no integra el Estado uruguayo. Publica, entre otros documentos, las evaluaciones del Programa de
    Evaluación del Sector Financiero (FSAP) sobre países miembros, incluido Uruguay, que este sitio
    usa como fuente sobre el sistema financiero.
  fuentes:
