      titulo: 'Uruguay: Financial System Stability Assessment (IMF Country Report No. 13/152)'
      cita: This paper was prepared by a staff team of the International Monetary Fund as background
        documentation for the periodic consultation with the member country.
      retrieved_at: 2026-09-09
alineamiento:
  etiqueta: estatal
  justificacion: Organismo financiero multilateral de 191 países miembros, sin línea editorial ni
    vínculo con un partido uruguayo; sus informes técnicos (como el FSAP) son documentos
    institucionales, igual que los de un ente público, aunque no es un organismo del Estado
    uruguayo (por eso lleva un grupo propio y no estado-uruguayo, el mismo criterio que usan `bid` y
    `banco-mundial`).
