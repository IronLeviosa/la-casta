propiedad:
  descripcion: >-
    Ente autónomo del Estado uruguayo, creado por la Ley 11.859 de 1952 y
    regido desde 1975 por su carta orgánica (Decreto-Ley 14.396); publica en
    su propio sitio sus estados financieros auditados, memorias y
    licitaciones. No debe confundirse con un medio de prensa: su sitio es la
    fuente documental primaria de la propia empresa, no una cobertura
    independiente.
  fuentes:
