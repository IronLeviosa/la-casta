      cita: >-
        Créase el Ente Autónomo dtnominado Administración de Ferrocarriles del
        Estado, persona de derecho público. Podrá ser designado por la sigla
        A.F.E.
      archived_url: https://web.archive.org/web/20260909032844/https://impo.com.uy/bases/leyes-originales/11859-1952
      retrieved_at: 2026-09-09
