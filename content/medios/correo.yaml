propiedad:
  descripcion: Servicio descentralizado comercial del Estado uruguayo, creado por la Ley N.º 16.736
    (artículo 747, 1996), que presta el servicio postal en todo el territorio nacional y es el
    operador designado por la Ley 19.009 (2012) para el Servicio Postal Universal. Sus estados
    financieros auditados, notas de prensa y comunicados son documentos de una empresa pública, no
    de un medio independiente.
  fuentes:
    - url: https://www.impo.com.uy/bases/leyes-originales/16736-1996/747
      medio: impo
      fecha: 1996-01-12
      tipo: documento_oficial
      titulo: Ley N° 16736, artículo 747
      cita: Créase la Administración Nacional de Correos como Servicio Descentralizado Comercial, de
        acuerdo a lo establecido en la Sección XI de la Constitución de la República, con la
        competencia y organización que por esta ley se determinan en sustitución de la Dirección
        Nacional de Correos.
      retrieved_at: 2026-09-09
