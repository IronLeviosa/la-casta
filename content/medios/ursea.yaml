nombre: Unidad Reguladora de Servicios de Energía y Agua (URSEA)
tipo: estatal
grupo: estado-uruguayo
url: https://www.gub.uy/unidad-reguladora-servicios-energia-agua/
alias: [URSEA, Unidad Reguladora de Servicios de Energía y Agua]
propiedad:
  descripcion: >-
    Organismo regulador del Estado uruguayo, creado por la Ley N° 17.598 (2002), con cometidos
    actualizados por el artículo 239 de la Ley N° 19.889 (2020, LUC). Regula los sectores de
    energía, combustibles y agua; entre otras tareas, calcula los Precios de Paridad de
    Importación (PPI) de los combustibles y publica las series que los comparan con los precios
    que fija el Poder Ejecutivo. No es un medio de prensa: es la fuente primaria de estos datos
    regulatorios, en el mismo sentido que ya lo son impo, bcu, miem o ancap en content/medios/.
  fuentes:
    - url: https://www.gub.uy/unidad-reguladora-servicios-energia-agua/institucional/cometidos
      medio: ursea
      fecha: 2026-09-07
      tipo: documento_oficial
      titulo: Cometidos
      cita: >-
        La Unidad Reguladora de Servicios de Energía y Agua tiene como cometido principal regular
        los sectores de energía, combustible y agua en todo el país.
      retrieved_at: 2026-09-07
    - url: https://www.gub.uy/unidad-reguladora-servicios-energia-agua/politicas-y-gestion/paridad-precios-importacion
      medio: ursea
      fecha: 2026-09-07
      tipo: documento_oficial
      titulo: Precios de Paridad de Importación
      cita: >-
        Ursea calcula los Precios de Paridad de Importación (PPI) de productos derivados del
        petróleo (Gasolinas, Gas oil, Fuel oil, Supergás y Propano) y publica los resultados.
      retrieved_at: 2026-09-07
alineamiento:
  etiqueta: estatal
  justificacion: >-
    Organismo técnico regulador sin línea editorial: controla el cumplimiento de su ley de
    creación y de la normativa del sector, y publica series y metodologías de cálculo por mandato
    legal, igual que impo, bcu o miem.
  fuentes:
    - url: https://www.gub.uy/unidad-reguladora-servicios-energia-agua/institucional/cometidos
      medio: ursea
      fecha: 2026-09-07
      tipo: documento_oficial
      titulo: Cometidos
      cita: >-
        Controlar el cumplimiento de la ley que crea la Unidad (Ley 17.598, Competencias de la
        Unidad Reguladora de Servicios de Energía y Agua), todas sus reglamentaciones,
        disposiciones y actos jurídicos habilitantes de la prestación de servicios que comprende.
      retrieved_at: 2026-09-07
