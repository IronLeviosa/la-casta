nombre: Cooperativa.cl (Radio Cooperativa)
tipo: radio
grupo: compania-chilena-de-comunicaciones
url: https://cooperativa.cl
alias: [Cooperativa.cl, Radio Cooperativa, Cooperativa]
propiedad:
  descripcion: >-
    Radio chilena que emite desde 1935; desde el 8 de agosto de 1939 es propiedad de la
    Compañía Chilena de Comunicaciones, creada por la Sociedad de Rentas Cooperativa
    Vitalicia S.A. para operarla. Medio chileno, sin relación societaria con ningún
    medio uruguayo.
  fuentes:
    - url: https://es.wikipedia.org/wiki/Radio_Cooperativa_(Chile)
      medio: wikipedia
      fecha: 2026-09-05
      tipo: nota
      titulo: Radio Cooperativa (Chile)
      cita: >-
        El 8 de agosto de 1939, la Sociedad de Rentas Cooperativa Vitalicia S.A. creó la
        Compañía Chilena de Comunicaciones para que se hiciera cargo de la emisora.
      retrieved_at: 2026-09-05
alineamiento:
  etiqueta: sin_datos
  justificacion: >-
    La misma nota de Wikipedia documenta que, desde 1958 y con más fuerza tras ser
    adquirida a principios de los 70 por una sociedad de la Democracia Cristiana chilena,
    la línea editorial de la radio estuvo asociada a ese partido. Ese vínculo es con un
    partido chileno, sin equivalente en las etiquetas de este sitio (`oficialista_tradicional`
    se refiere a los partidos tradicionales uruguayos, Nacional y Colorado; `progresista`,
    al Frente Amplio). Forzar la cita a una de esas dos etiquetas atribuiría a este medio
    un alineamiento partidario uruguayo que ninguna fuente sostiene, así que se deja
    `sin_datos`: no hay, en lo relevado, un vínculo documentado con un partido político
    uruguayo ni con un grupo económico uruguayo.
  fuentes:
    - url: https://es.wikipedia.org/wiki/Radio_Cooperativa_(Chile)
      medio: wikipedia
      fecha: 2026-09-05
      tipo: nota
      titulo: Radio Cooperativa (Chile)
      cita: >-
        Desde 1958 la línea editorial de Radio Cooperativa posee una marcada orientación
        asociada al Partido Demócrata Cristiano, apoyando en 1964 al gobierno de Eduardo
        Frei Montalva.
      retrieved_at: 2026-09-05
revision:
  tier: publicado
