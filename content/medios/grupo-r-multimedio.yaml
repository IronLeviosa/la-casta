nombre: Grupo R Multimedio (Diario La R)
tipo: diario
grupo: r-multimedio
url: https://www.grupormultimedio.com
alias: [Grupo R Multimedio, Diario La R, La R]
propiedad:
  descripcion: >-
    En agosto de 2021 cerró definitivamente Reg S.A., la razón social del diario La República;
    parte de sus trabajadores fueron contratados por un nuevo emprendimiento, R-Multimedio
    S.A.S., con Juan Carlos Blanco Sommaruga, exgerente digital de la empresa anterior, como
    administrador, y el proyecto periodístico pasó a llamarse Diario La R. Bajo el mismo grupo
    empresarial funciona también el diario 5 Dedos, de Maldonado.
  fuentes:
    - url: https://www.busqueda.com.uy/politica/organismos-publicos-continuan-contratando-publicidad-y-suscripciones-empresas-embargadas-identificadas-como-diario-la-republica-n5412415
      medio: busqueda
      fecha: 2026-04-23
      tipo: nota
      titulo: Organismos públicos continúan contratando publicidad y suscripciones a empresas embargadas identificadas como "diario La República"
      cita: >-
        En agosto de 2021, la empresa Reg S.A., razón social de La República, cerró
        definitivamente y algunos de sus trabajadores fueron contratados por un nuevo
        emprendimiento, R-Multimedio S.A.S., con el exgerente digital de la anterior empresa,
        Juan Carlos Blanco Sommaruga, como administrador. El nombre del proyecto periodístico
        pasó a ser Diario La R, y la dirección, Cerrito 673.
      retrieved_at: 2026-09-05
alineamiento:
  etiqueta: sin_datos
  justificacion: >-
    El diario La República (Reg S.A.), su antecesor hasta 2021, está documentado como
    progresista en su propia ficha (content/medios/la-republica.yaml); no se encontró fuente que
    documente la orientación editorial de la empresa sucesora, R-Multimedio S.A.S., ya bajo otra
    administración desde 2021, por lo que no se traslada esa etiqueta sin verificarla de nuevo.
