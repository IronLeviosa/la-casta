propiedad:
  descripcion: >-
    Organismo oficial de estadística del Estado uruguayo, con autonomía técnica, que depende de
    la Oficina de Planeamiento y Presupuesto de la Presidencia de la República. Publica series
    estadísticas (índice de precios, salarios, censos) y no produce contenido periodístico.
