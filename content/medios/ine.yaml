      retrieved_at: 2026-09-09
alineamiento:
  etiqueta: estatal
  justificacion: >-
    Organismo estatal con autonomía técnica que produce y difunde estadísticas oficiales por
    mandato de la ley 16.616, como órgano rector del Sistema Estadístico Nacional, sin línea
    editorial.
  fuentes:
    - url: https://es.wikipedia.org/wiki/Instituto_Nacional_de_Estad%C3%ADstica_(Uruguay)
      medio: wikipedia
      fecha: 2026-09-09
      tipo: nota
      titulo: Instituto Nacional de Estadística (Uruguay)
      cita: >-
        La Ley n.º 16.616 estableció que el Sistema Estadístico Nacional (SEN) estuviera formado
        por el Instituto Nacional de Estadística como órgano rector
      retrieved_at: 2026-09-09
