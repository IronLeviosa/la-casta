propiedad:
  descripcion: "Sitio oficial del Frente Amplio, la coalición de izquierda fundada el 5 de febrero de
    1971. Publica noticias y comunicados del partido, de su presidencia y de sus dirigentes,
    discursos y documentos institucionales (declaración constitutiva, planes políticos). No es un
    medio periodístico: es fuente primaria de lo que el partido y sus dirigentes dijeron, y nunca
    cuenta como segunda fuente independiente."
