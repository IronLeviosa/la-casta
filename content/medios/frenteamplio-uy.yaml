alineamiento:
  etiqueta: progresista
  justificacion: "Es el sitio oficial del Frente Amplio y su contenido es partidario por definición.
    La etiqueta no se infiere de una línea editorial sino de la propia autodefinición del sitio: un
    discurso de su presidente publicado ahí dice textualmente que el Frente Amplio es «una fuerza
    diversa y progresista», y la página de historia institucional describe a sus fundadores como
    parte de «los sectores progresistas del país». Es el mismo tratamiento que reciben mpp
    (progresista, por autodefinición de su documento de campaña, sector del Frente Amplio) y
    lacallepou-uy (oficialista_tradicional, por ser el sitio de campaña del candidato del Partido
    Nacional): el mismo caso en los dos partidos, etiquetado por cómo cada sitio se define a sí
    mismo, no por su línea editorial."
