nombre: Unión Ferroviaria
tipo: portal
grupo: union-ferroviaria
url: https://www.unionferroviaria.uy/
alias: [Unión Ferroviaria, Union Ferroviaria, unionferroviaria.uy]
propiedad:
  descripcion: >-
    Sitio institucional del sindicato que nuclea a los trabajadores de AFE y
    SELF, con origen en la primera organización de ferroviarios del país
    (1905); publica comunicados, posiciones gremiales y registra sus
    comparecencias ante el Parlamento.
  fuentes:
    - url: https://www.unionferroviaria.uy/nosotros/
      medio: union-ferroviaria
      fecha: 2016-08-10
      tipo: nota
      titulo: Historia - Union Ferroviaria
      cita: >-
        En ese contexto encontramos a la primera organización de los
        ferroviarios de la historia del país, se trata de la Unión
        Ferrocarrilera organizada bajo el formato de Sociedad de Resistencia.
      archived_url: https://web.archive.org/web/20260616052746/https://www.unionferroviaria.uy/nosotros/
      retrieved_at: 2026-09-09
alineamiento:
  etiqueta: sin_datos
  justificacion: >-
    No se encontró en su sitio una declaración de alineamiento partidario.
    Es un sindicato de trabajadores de una empresa pública, con origen
    histórico en el movimiento obrero de tradición anarquista y socialista
    de comienzos del siglo XX; sus críticas más recientes (desmantelamiento
    de AFE, apertura del sistema ferroviario) alcanzan a gobiernos de más de
    un partido, según describió su propio presidente ante el Parlamento en
    2026 (ver ficha de la empresa AFE).
  fuentes:
    - url: https://infolegislativa.parlamento.gub.uy/temporales/0566.PDF
      medio: parlamento
      fecha: 2026-06-17
      tipo: diario_de_sesiones
      titulo: >-
        Versión taquigráfica, Comisión de Transporte, Comunicaciones y Obras
        Públicas (Cámara de Representantes) - recepción a la Unión
        Ferroviaria
      cita: >-
        Luego de varias reformas del modo ferroviario, que incluyeron la
        creación de la Dirección Nacional de Transporte Ferroviario durante
        el primer período frenteamplista y la posterior elevación al rango
        de unidad ejecutora dentro del Ministerio de Transporte y Obras
        Públicas en el último gobierno de coalición
      archived_url: https://web.archive.org/web/20260909052915/https://infolegislativa.parlamento.gub.uy/temporales/0566.PDF
      retrieved_at: 2026-09-09
revision:
  tier: publicado
