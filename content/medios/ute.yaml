propiedad:
  descripcion: Ente autónomo del Estado uruguayo, creado por la Ley N.º 4.273 de 1912, que se
    autodefine como "empresa pública del Sector Energía". Sus estados financieros auditados
    (portal.ute.com.uy) y su sitio institucional se usan como fuente documental primaria de esta
    ficha.
  fuentes:
    - url: https://www.ute.com.uy/institucional/ute/quienes-somos
      medio: ute
      fecha: 2018-04-20
      tipo: documento_oficial
      titulo: "¿Quiénes somos?"
      cita: >-
        La Administración Nacional de Usinas y Trasmisiones Eléctricas (UTE) es una empresa pública
        del Sector Energía que, a través del desarrollo de las actividades de generación, trasmisión,
        distribución y comercialización de energía eléctrica, así como prestar servicios de
        asesoramiento y asistencia técnica en las áreas de su especialidad y anexas, trabaja para
        hacer asequible la energía eléctrica en el país.
      retrieved_at: 2026-09-08
alineamiento:
  etiqueta: estatal
  justificacion: Ente autónomo del Estado que presta el servicio eléctrico como monopolio parcial
    (trasmisión y distribución); sus balances, presentaciones de resultados y publicaciones
    institucionales son documentos de una empresa pública, no de un medio independiente.
