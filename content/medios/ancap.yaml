propiedad:
  descripcion: Ente autónomo del Estado uruguayo, del dominio comercial e industrial, creado por la Ley
    N.º 8.764 de 1931, que administra y explota el monopolio de importación y refinación de petróleo
    y combustibles y la producción de alcohol carburante y cemento pórtland. Sus estados financieros
    auditados y sus comunicados de resultados se usan como fuente documental primaria.
  fuentes:
    - url: https://www.ancap.com.uy/8563/1/eecc-individuales-2019.html
      medio: ancap
      fecha: 2019-12-31
      tipo: documento_oficial
      titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2019
      cita: >-
        La Administración Nacional de Combustibles, Alcohol y Pórtland (en adelante "ANCAP" o "la
        compañía") es una persona jurídica de derecho público del dominio comercial e industrial del
        Estado, organizada bajo la forma de ente autónomo, que se rige por su Ley de creación Nº
        8.764, del 15 de octubre de 1931 y sus posteriores modificaciones.
      retrieved_at: 2026-09-07
alineamiento:
  etiqueta: estatal
  justificacion: Ente autónomo del Estado que administra un monopolio público; sus balances,
    presentaciones de resultados y comunicados son documentos de una empresa pública, no de un medio
    independiente.
  fuentes:
    - url: https://www.ancap.com.uy/8563/1/eecc-individuales-2019.html
      medio: ancap
      fecha: 2019-12-31
      tipo: documento_oficial
      titulo: Estados Financieros Individuales de Ancap al 31 de diciembre de 2019
      cita: >-
        ANCAP administra y explota el monopolio de la importación y refinación de petróleo, de la
        importación y exportación de combustibles líquidos, semilíquidos y gaseosos cualquiera fuera
        su estado, con excepción de la importación de gas natural, y la producción y exportación de
        alcohol carburante y biodiesel.
      retrieved_at: 2026-09-07
