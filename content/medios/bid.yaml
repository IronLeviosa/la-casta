propiedad:
  descripcion: Organismo financiero multilateral de desarrollo, creado en 1959, con 26 países miembros
    prestatarios de América Latina y el Caribe y 22 países miembros no prestatarios; no integra el
    Estado uruguayo. Publica notas técnicas y diagnósticos sectoriales por país, entre ellos el que
    este sitio usa como fuente de comparaciones internacionales de OSE.
