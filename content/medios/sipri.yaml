  descripcion: Instituto de investigación independiente sobre conflicto, armamento, control de armas y desarme, creado en 1966 por decisión del Parlamento sueco; recibe buena parte de su financiamiento de una donación anual del Gobierno de Suecia. No integra el Estado uruguayo; publica la base de datos de gasto militar por país y año que este sitio usa para comparaciones internacionales de defensa.
