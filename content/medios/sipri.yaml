  etiqueta: estatal
  justificacion: Instituto creado por el Parlamento sueco y financiado en buena parte por el Gobierno de Suecia, sin línea editorial ni vínculo con un partido uruguayo; su base de datos de gasto militar es un documento institucional, igual que los de un ente público, aunque no es un organismo del Estado uruguayo (por eso lleva un grupo propio y no estado-uruguayo, el mismo criterio que ya usa `banco-mundial`).
