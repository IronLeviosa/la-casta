      cita: A partir de 2011, Teledoce pasa a ser dirigido por un grupo de varios accionistas, entre ellos, el Grupo Cardoso - Pombo, que son los que se hacen con la mayoría de las acciones del canal dejando al propietario original, el Grupo Scheck - Aguirre, como accionista minoritario.
