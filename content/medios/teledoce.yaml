  descripcion: Canal 12 (Sociedad Televisora Larrañaga) fue fundado en 1962 por accionistas de El País (grupo Scheck-Aguirre). Desde 2011 la mayoría accionaria pertenece al Grupo Cardoso - Pombo (familia Cardoso, también accionista de los supermercados Disco, Devoto y Géant), y el grupo Scheck-Aguirre quedó como minoritario. Telemundo es su noticiero desde 1968.
