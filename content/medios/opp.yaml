alias:
  - OPP
  - Oficina de Planeamiento y Presupuesto
propiedad:
  descripcion: >-
    Organismo que depende directamente de la Presidencia de la República, creado por la reforma
    constitucional de 1967 (artículo 230 de la Constitución) para asistir al Poder Ejecutivo en la
    planificación de programas y políticas nacionales. Coordina, junto con Presidencia, la
    elaboración de los Informes Nacionales Voluntarios sobre los Objetivos de Desarrollo Sostenible.
  fuentes:
