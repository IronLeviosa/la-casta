alineamiento:
  etiqueta: independiente
  justificacion: Su ley orgánica le prohíbe estar bajo control de cualquier agrupación ideológica, política o económica y no tiene accionistas; no tiene vínculo con partidos uruguayos. Sus despachos reproducidos por varios diarios cuentan como una sola fuente.
  fuentes:
    - url: https://es.wikipedia.org/wiki/Agencia_France_Press
      medio: wikipedia
      fecha: 2026-09-03
      tipo: nota
      titulo: Agence France-Presse
      cita: >-
        y que le prohíbe asimismo "estar bajo el control de hecho o de derecho de cualquier agrupación ideológica, política o económica".
