    al que pertenece Yamandú Orsi. Publica documentos de campaña del sector y de la fórmula presidencial; el texto de
    las 48 prioridades presentadas por Orsi en setiembre de 2024 habla en primera persona del plural como parte del
    Frente Amplio. No es un medio periodístico: es fuente primaria de lo que el candidato y su sector prometieron,
    y nunca cuenta como segunda fuente independiente.
