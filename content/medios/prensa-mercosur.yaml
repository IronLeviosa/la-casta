nombre: Prensa Mercosur
tipo: portal
grupo: prensa-mercosur
url: https://prensamercosur.org
alias: [Prensa Mercosur, Imprensa Mercosul]
propiedad:
  descripcion: >-
    Medio digital fundado en 2001 y formalizado institucionalmente desde 2016 como iniciativa de
    la Organización de Periodistas y Comunicadores del Mercosur; no se encontró fuente que
    identifique a una persona o empresa propietaria: se presenta a sí mismo como un medio
    independiente, registrado como Prensa Mercosur Internacional en Brasil (CNPJ) y como Prensa
    Mercosur - Imprensa Mercosul en Paraguay (RUC).
  fuentes:
    - url: https://prensamercosur.org/sobre/
      medio: prensa-mercosur
      fecha: 2025-04-10
      tipo: nota
      titulo: Sobre Prensa Mercosur | Diario Independiente del MERCOSUR
      cita: >-
        Fundado en 2001 y formalizado institucionalmente desde 2016, Prensa Mercosur es un medio
        de comunicación digital independiente dedicado a la producción y difusión de contenidos
        periodísticos sobre integración regional, política, economía, relaciones
        internacionales, derechos humanos, cultura, turismo, ciencia y sociedad.
      retrieved_at: 2026-09-05
alineamiento:
  etiqueta: sin_datos
  justificacion: >-
    El propio medio se declara de "independencia editorial" pero no hay fuente de terceros que
    documente un vínculo partidario o una orientación; no se encontró nada más allá de su propia
    autodescripción institucional.
  fuentes:
    - url: https://prensamercosur.org/sobre/
      medio: prensa-mercosur
      fecha: 2025-04-10
      tipo: nota
      titulo: Sobre Prensa Mercosur | Diario Independiente del MERCOSUR
      cita: >-
        Nuestra labor se desarrolla bajo los principios de independencia editorial, libertad de
        expresión, pluralidad informativa y compromiso con la ética periodística.
      retrieved_at: 2026-09-05
revision:
  tier: publicado
