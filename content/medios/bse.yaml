propiedad:
  descripcion: >-
    Ente autónomo del Estado uruguayo, del dominio comercial del Estado, creado por la Ley N.º
    3.935 de 1911 y reorganizado por su actual Carta Orgánica (Ley N.º 18.243 de 2007). bse.com.uy
    e institucional.bse.com.uy son el mismo publicador, el primero el sitio comercial y el segundo
    la sección institucional y de transparencia, con los estados contables auditados y los
    Informes Anuales de Gobierno Corporativo que se usan como fuente documental primaria de esta
    ficha.
  fuentes:
    - url: https://www.impo.com.uy/bases/leyes/18243-2007
      medio: impo
      fecha: 2007-12-27
      tipo: documento_oficial
      titulo: Ley N° 18243, artículo 1
      cita: >-
        El Banco de Seguros del Estado, creado por la Ley N° 3.935, de 27 de diciembre de 1911, es un
        ente autónomo que integra el dominio comercial del Estado y realizará las actividades
        indicadas en su objeto con fines comerciales y sociales
      retrieved_at: 2026-09-09
