propiedad:
  descripcion: >-
    Autarquía federal brasileña creada por la Ley N° 4.595/1964, sin vínculo jerárquico a un
    ministerio y con autonomía técnica, operativa, administrativa y financiera (LC 179/2021).
    Publica la cotización oficial del dólar (PTAX) y series monetarias; no produce contenido
    periodístico.
