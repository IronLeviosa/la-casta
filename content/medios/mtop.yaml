propiedad:
  descripcion: >-
    Cartera del Poder Ejecutivo uruguayo a cargo de la política de
    transporte y obras públicas del país; desde 2022 (Ley 20.075, artículo
    243) su Dirección Nacional de Transporte Ferroviario (DNTF, creada por
    la Ley 18.834 de 2011) administra la infraestructura ferroviaria
    nacional y publica noticias, declaraciones de red y normativa del
    sector.
