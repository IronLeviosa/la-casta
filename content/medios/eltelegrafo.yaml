      fecha: 2024-10-22
      tipo: nota
      titulo: Generadores privados consideran "abusivo" el precio que cobra UTE por redes de transmisión
      cita: indicó a EL TELEGRAFO el Ing. Miguel Fraschini, director gerente de Azucarlito e integrante de
        la Asociación Uruguaya de Generadores Privados de Energía Eléctrica (Augpee).
      retrieved_at: 2026-09-08
