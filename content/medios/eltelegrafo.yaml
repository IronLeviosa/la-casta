propiedad:
  descripcion: Medio de prensa uruguayo que publica bajo el nombre "El Telégrafo" y es identificado
    así por sus entrevistados ("indicó a EL TELEGRAFO"). No hay, en el sitio del medio, una fuente
    que documente su año de fundación, su ubicación o su estructura de propiedad; se intentó una
    página de "quiénes somos" (HTTP 404) y la portada del sitio, sin resultado. Se deja constancia
    de que en el corpus hay además una nota de eltelegrafo.com firmada "(La Diaria-Telemundo)", es
    decir que el sitio también republica contenido de terceros junto con notas propias.
  fuentes:
