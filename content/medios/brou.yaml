nombre: Banco de la República Oriental del Uruguay (BROU)
tipo: estatal
grupo: estado-uruguayo
url: https://www.brou.com.uy/
empresa: brou
alias: [BROU, Banco República, Banco de la República]
propiedad:
  descripcion: Banco estatal uruguayo, organizado como ente autónomo, creado por la Ley 2.480 de
    1896 y regido actualmente por la Ley 18.716 (Carta Orgánica de 2010). Sus estados financieros
    auditados, memorias anuales y comunicaciones institucionales son la fuente documental primaria
    de la ficha de la empresa; no debe confundirse con un medio de prensa independiente.
  fuentes:
    - url: https://impo.com.uy/bases/leyes/18716-2010
      medio: impo
      fecha: 2010-12-24
      tipo: documento_oficial
      titulo: Ley N° 18716, artículo 1
      cita: El Banco de la República Oriental del Uruguay, creado por la Ley Nº 2.480, de 4 de agosto
        de 1896, es un servicio del dominio comercial del Estado, organizado bajo la forma de ente
        autónomo, que se regirá por las disposiciones de las Secciones XI, XIII y XIV de la
        Constitución de la República y las que por esta ley se establecen, así como por las leyes
        que regulan la actividad bancaria.
      retrieved_at: 2026-09-09
alineamiento:
  etiqueta: estatal
  justificacion: Ente autónomo del Estado uruguayo que presta servicios bancarios y compite con la
    banca privada; sus estados contables, memorias y comunicados son documentos de una empresa
    pública, no de un medio independiente, y describen su propia gestión.
  fuentes:
    - url: https://impo.com.uy/bases/leyes/18716-2010
      medio: impo
      fecha: 2010-12-24
      tipo: documento_oficial
      titulo: Ley N° 18716, artículo 12 (Cometidos)
      cita: 'Artículo 12(Cometidos). El Banco tendrá como principales cometidos, procurar que los
        servicios financieros resulten accesibles a la población, estimular el ahorro como
        instrumento de desarrollo personal y fomentar la producción de bienes y servicios de forma de
        contribuir al crecimiento económico y social del país.'
      retrieved_at: 2026-09-09
