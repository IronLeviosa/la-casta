      medio: cronicas
      fecha: 2026-05-29
      tipo: nota
      titulo: "\"Uruguay entiende los seguros de accidentes de trabajo no como un negocio, sino como una política social\""
      cita: >-
        Cuando en la década del 90 se desmonopolizaron los seguros en el país, se mantuvo el
        monopolio de los seguros de accidentes de trabajo y enfermedades profesionales en manos
        del BSE.
      retrieved_at: 2026-09-09
