        A Agência Nacional do Petróleo, Gás Natural e Biocombustíveis (ANP) tem a finalidade de
        promover a regulação, a contratação e a fiscalização das atividades econômicas
        integrantes da indústria do petróleo, do gás natural, dos biocombustíveis e do
        hidrogênio.
