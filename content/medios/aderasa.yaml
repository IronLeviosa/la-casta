      cita: En el año 2013, se constituyó ADERASA como persona jurídica que consta de 17 miembros
        asociados, en la ciudad de Asunción, Paraguay. Su objeto es promover, a través de
        mecanismos de coordinación, intercambio e integración, el fortalecimiento, la
        interrelación y el mejoramiento institucional de los organismos asociados.
