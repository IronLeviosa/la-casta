motivo: >-
  Un lector señaló que una declaración que llama inconstitucional a un llamado del MTSS no decía en
  qué quedó. Cuando alguien acusa que se rompe una ley, hay que averiguar si se salieron con la
  suya, con el mismo rigor que la acusación. Se buscó el desenlace de esa declaración y de las
  demás de la misma persona que denuncian una irregularidad o piden una acción concreta, en los
  diarios de sesiones posteriores, los pedidos de informes, IMPO y la prensa, y se registra en el
  campo `seguimiento` con su documento, o la ausencia de registro público, sin verbos de intención.
