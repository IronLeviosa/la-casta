fecha: 2026-09-05
tipo: error_factual
afecta:
  - politicos/lacalle-pou
  - politicos/manini-rios
  - politicos/mieres
motivo: >-
  Al cargar los candidatos a presidente de 2019, tres de ellos ya tenían ficha en el sitio y les
  faltaba esa candidatura. Sin ella, el cuadro de la elección de 2019 quedaba incompleto: aparecían
  los candidatos nuevos y no los que el sitio ya conocía, que es la misma distorsión que tuvo el
  cuadro de 2024 hasta que se le agregó la candidatura de Orsi.

  A Lacalle Pou se le agregan además tres mandatos que faltaban: diputado por Canelones entre 2000
  y 2015, presidente de la Cámara de Representantes entre 2011 y 2012, y senador entre 2015 y 2019.
  Su ficha cubría solo la presidencia.

  A Manini Ríos y a Mieres se les habían escrito fichas nuevas por error, porque el lote de 2024 se
  promovió mientras el investigador de 2019 trabajaba y él no las vio en content/. Las dos versiones
  no se contradecían: eran complementarias. Se fusionaron sobre la versión publicada, campo por
  campo, quedándose en cada uno con la fuente más fuerte.

  En esa fusión se corrigió una cita que no probaba lo que se le hacía probar: el mandato de Manini
  Ríos como senador se apoyaba en un Diario de Sesiones del 1 de marzo de 2022 que lo lista ausente
  con aviso, no presente. Se reemplazó por el del 15 de mayo de 2024, donde pide la palabra y la
  presidencia se la concede. Y la salida de Mieres del Ministerio de Trabajo pasa de una nota de
  prensa a la resolución oficial.
solicitante: detección interna, crítica de la corrida 2026-09-05-candidatos-2019
# Sin bloque `fuentes`: la evidencia de cada cambio vive en el registro que cambió, con su cita y su
# URL. La primera versión de esta corrección citaba acá el Diario de Sesiones que reemplazó a la
# cita mal leída, pero esa URL del Parlamento es temporal y lleva `verificacion: manual`, lo que
# habría hecho que la corrección misma esperara una firma humana para publicarse. Una corrección que
# no se puede publicar no corrige nada.
revision:
  tier: publicado
