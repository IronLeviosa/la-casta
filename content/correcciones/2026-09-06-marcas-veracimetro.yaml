motivo: >-
  El Veracímetro era una tarjeta al pie de la declaración, y el lector que leía la frase chequeada
  en la cita no se enteraba de que había un chequeo. Desde hoy cada chequeo declara `fragmento`, el
  tramo exacto de la cita o del resumen donde está el dato, y la página lo subraya con el color de
  la calificación y un globo con el veredicto, el dato real y su fuente.

  Este es el único chequeo publicado que existía antes del cambio; se le agrega el fragmento para
  que la marca aparezca. No cambia la calificación (discutible), el análisis ni las fuentes.
