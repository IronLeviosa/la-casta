motivo: >-
  Una segunda revisión del sitio, con el mismo alcance que la primera pasada del 2026-09-16 pero con
  una búsqueda más amplia sobre todos los campos de texto de toda la publicación, encontró diez
  frases más que contaban cómo se había producido la verificación en lugar de decir qué se sabe y
  qué falta: menciones a una corrida de trabajo, a un lote, a una sesión, o a la primera persona de
  quien redactó el texto. Aparecieron en un análisis sobre ALUR, otro sobre ANCAP, un chequeo sobre
  combustibles, la ficha de ANTEL, tres fichas de medios, la ficha de un político y dos promesas de
  gobierno, de dos gobiernos distintos.


  En cada caso se reemplazó la mención al proceso por el límite concreto de la evidencia: qué parte
  de un informe no describe su metodología, de qué documento oficial sale una serie, hasta dónde
  llega un archivo publicado, o que una fuente no está documentada, sin decir en qué lote o corrida
  se buscó.


  Una tercera pasada, sobre los mismos diez registros, encontró cinco frases más que la segunda
  pasada había dejado pasar por tocar solo la frase buscada en cada uno: dos en el mismo chequeo
  sobre combustibles (una atribuía a esta investigación un cambio de metodología que es de la ANP;
  otra remitía al crudo de una corrida para el detalle de un gráfico), una en el mismo análisis
  sobre ALUR (el anexo del informe que no se leyó por separado), y una en cada una de dos fichas más
  (la ficha de un medio, sobre el aviso de copyright de la nota citada; una promesa de gobierno,
  sobre la falta de una fuente). Se corrigieron con el mismo criterio.


  Ninguna cifra, calificación, fuente, nivel de verificación, estado de promesa o tier cambió: solo
  la forma en que se explica qué se sabe y qué falta. Quedan, si las hay, menciones al proceso con
  otra forma que ninguna de las tres pasadas buscó todavía.
solicitante: barrido simétrico de narración de proceso en todo el sitio, segunda pasada, 2026-09-16
