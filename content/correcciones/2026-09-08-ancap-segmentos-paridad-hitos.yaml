    a: precio de venta y paridad de importación por producto, 2015 a mayo de 2019 (la planilla oficial de URSEA termina ahí), más las diferencias agregadas que publicaron el CED (2010-2014, 2015-2019) y ANCAP (2024), anualizadas y con el acumulado original en la nota de cada punto
  - registro: empresas/ancap
