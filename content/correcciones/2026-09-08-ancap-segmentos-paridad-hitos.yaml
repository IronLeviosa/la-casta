motivo: >-
  Un lector pidió, con la ficha a la vista, saber qué parte de ANCAP gana y cuál pierde, y ver el
  precio de venta contra la paridad de importación en el tiempo. La ficha publicada no tenía ni el
  desglose por segmento de negocio ni la serie de paridad, aunque ANCAP publica lo primero en sus
  presentaciones de resultados (no en los estados contables, como suponía el brief) y URSEA lo
  segundo en su planilla oficial. Al completarla, el crítico encontró además que la descripción
  de la paridad había perdido la salvedad de que el cálculo del PPI está discutido, incluida la
  propia ANCAP, y el ajuste del factor X; se repone con fuente primaria. Se agrega la línea de
  tiempo de la empresa, con fuentes que la ficha ya citaba, y las cifras del CED pasan a citarse
  del boletín del CED en lugar de la nota de prensa que las repetía. Ninguna cifra publicada antes
  cambia; se agrega lo que faltaba. La serie de paridad termina en mayo de 2019 porque el
  documento oficial termina ahí; la ficha lo dice.
