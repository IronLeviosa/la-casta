tipo: error_factual
afecta:
  - politicos/vazquez
  - politicos/lacalle-pou
  - politicos/mieres
motivo: >-
  Tres de los candidatos a presidente de 2014 ya tenían ficha y les faltaba esa candidatura. Sin
  ella, el cuadro de la elección de 2014 mostraba solo a los candidatos nuevos y no a los que el
  sitio ya conocía, que es la misma distorsión que tuvieron los cuadros de 2024 y 2019 hasta que se
  completaron.

  A Tabaré Vázquez se le agrega además un cargo que el sitio no tenía en absoluto: intendente de
  Montevideo. Y al buscarle una fuente que no fuera Wikipedia aparecieron fechas distintas de las
  que Wikipedia daba. Se corrigieron a las que sostienen El Observador, Montevideo Portal y Nueva
  Sociedad, y se sacó la cita de Wikipedia, que ya no las respaldaba. La fecha de fin queda con
  precisión de año porque ninguna de las tres fuentes da el día.

  Este lote se investigó cuando los de 2019 y 2024 todavía no estaban promovidos, así que había
  tomado como base fichas del inbox. Se rebasó sobre los registros publicados antes de aplicarlo.
  El riesgo que eso evita es concreto: dos correcciones independientes sobre la misma persona, cada
  una escrita contra una base distinta, se pisan las candidaturas entre sí. Lacalle Pou queda con
  2014 y 2019; Mieres con 2014, 2019 y 2024.
solicitante: detección interna, crítica de la corrida 2026-09-05-candidatos-2014
