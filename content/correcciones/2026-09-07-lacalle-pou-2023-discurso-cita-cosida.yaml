motivo: >-
  Esta corrección sale de la vuelta simétrica del Veracímetro. El crítico de la corrida
  2026-09-06-lacalle-pou-economia-combustibles señaló que, con los chequeos de esa corrida, el
  Veracímetro tendría tres registros y los tres de la misma persona, y listó las otras
  declaraciones publicadas con una cifra adentro: dos de Lacalle Pou (esta corrida) y cuatro de
  Orsi (la corrida gemela 2026-09-07-orsi-veracimetro). El criterio es uno solo: si hay un dato
  concreto dentro de una cita publicada, se chequea.

  **Los chequeos.** Tres, sobre dos declaraciones. "Ahorró más de US$ 600 millones durante la
  pandemia" (28 de julio de 2021): queda "discutible", porque el dato oficial mide otra cosa que lo
  afirmado y no hay un documento que sostenga el monto tal como se dijo. "75 % de los contribuyentes
  de IRPF" alcanzados por la rebaja (2 de marzo de 2023): "discutible". "US$ 150 millones" de
  renuncia fiscal (misma fecha): "verdadero" según los documentos del Ministerio de Economía, que
  desglosan 80 de IRPF, 30 de IASS y 40 de mipymes. Dos de los tres quedan en estado probable
  porque una de sus fuentes oficiales, alojada en el sitio de Diputados, no se pudo verificar por
  máquina en esta corrida y espera la firma del mantenedor.

  **La primaria y la cita cosida.** Al buscar el dato oficial apareció el audio completo del
  discurso ante la Asamblea General, que Presidencia publica pero no enlaza desde su gacetilla. Eso
  permitió dos cosas. Primero, comprobar que Lacalle Pou sí dijo "150 millones de dólares" en el
  discurso (minuto 1:01:29): una primera lectura, hecha sobre una transcripción de prensa que
  resultó estar truncada justo ahí, había concluido lo contrario, y el crítico lo detectó antes de
  que llegara a publicarse. Segundo, cotejar la cita publicada: la gacetilla de Presidencia junta en
  una sola frase entre comillas dos oraciones que en el audio están separadas por aplausos, y
  escribe «los mayores esfuerzos» donde el discurso dice «grandes esfuerzos». El registro había
  copiado esa versión. La cita pasa a ser el tramo contiguo del audio, la gacetilla queda marcada
  como "difiere" con el audio al lado, y el resumen y el título no cambian: lo afirmado era lo
  mismo.

  Modelos: investigador y editor en Sonnet, crítico en Opus, por decisión del mantenedor.
