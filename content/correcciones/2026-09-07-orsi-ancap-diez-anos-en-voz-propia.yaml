    a: Orsi dijo que Ancap volvió a tener resultados negativos "después de 10 años" y que la deuda total de la empresa asciende a 255 millones de dólares.
motivo: >-
  Esta corrección sale de la vuelta simétrica del Veracímetro. El crítico de la corrida
  2026-09-06-lacalle-pou-economia-combustibles señaló que, con los chequeos de esa corrida, el
  Veracímetro tendría tres registros y los tres de la misma persona, y listó las otras
  declaraciones publicadas con una cifra adentro: cuatro de Orsi (esta corrida) y dos de Lacalle
  Pou (la corrida gemela 2026-09-07-lacalle-pou-veracimetro). El criterio es uno solo: si hay un
  dato concreto dentro de una cita publicada, se chequea.

  **El error del sitio.** En la conferencia del 25 de abril de 2025 Orsi dijo que Ancap "vuelve
  después de 10 años a tener números negativos". Los estados financieros auditados de la propia
  Ancap muestran un resultado negativo en 2020: el último ejercicio con pérdida antes de 2024 fue
  cuatro años antes, no diez. El chequeo lo califica "falso". Pero el título y el resumen del
  registro repetían "tras diez años" en voz propia del sitio, como si fuera un hecho y no una
  afirmación de él. Pasan a atribuirle el dato, entre comillas, y el Veracímetro lo marca sobre esas
  palabras. El brief de la corrida traía una lista cerrada de cifras a chequear que dejó afuera
  justo esta; lo detectó el crítico, y la regla del brief cambió para todos: la lista es punto de
  partida, no límite.

  **Los otros chequeos.** "41 millones de ganancia en 2019 y 118 millones de pérdida en 2024":
  "verdadero" según los mismos estados financieros; los 39 millones que publicó Presidencia en 2020
  para el mismo año no son otra cifra sino el mismo resultado auditado convertido al tipo de cambio
  de cierre en vez del promedio, y las dos cotizaciones están en el mismo documento. "Un préstamo
  de 160 millones que deja la deuda total en 255 millones": "discutible", porque el dato oficial
  no permite reconstruir el agregado tal como se dijo. "Ese 2 % que aumentaron de IVA" (18 de
  noviembre de 2024): "discutible", y en estado probable porque tiene una sola fuente de prensa.
  El dato del descuento de USD 25.000 en la compra de su camioneta no se chequea: Orsi no afirmó
  ninguna cifra, remitió a la factura; las cifras son de la prensa, y lo que consta queda en una
  hipótesis privada hasta que haya documento.

  **Discrepancias.** Tres, contra fuente primaria y sin verbos de intención, en estado probable: la
  gacetilla de Presidencia de 2020 publica como "resultado operativo" cifras que en el balance son
  el resultado del ejercicio; Montevideo Portal y Caras y Caretas atribuyen a la declaración jurada
  ante la JUTEP un precio de compra de US$ 54.000 que ese documento no contiene.

  Modelos: investigador y editor en Sonnet, crítico en Opus, por decisión del mantenedor.
