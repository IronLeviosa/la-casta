    a: difiere, cotejada con el audio en 1:24:21 y 1:28:49
motivo: >-
  La corrección anterior (2026-09-06-lacalle-pou-2019-plazo-luc-audio-primario) incorporó el audio
  completo del coloquio y dejó la nota-resumen del medio marcada como "aproximada", que en el sitio
  se leía como "cita sin verificar". Un lector señaló lo obvio: si la nota y el audio son la misma
  entrevista, la cita de la nota tiene que poder cotejarse. Se cotejó.

  Resultado, sin verbos de intención: la nota escribe «liberar la importación de incombustibles» y
  «estaría aprobada en 90 días». En el audio, en el minuto 1:24:21, la frase es «liberalizar la
  importación de combustible»; y consultado por el plazo, en 1:28:49, la respuesta es «a los 100
  días está implementado». La nota además junta en un solo párrafo dos pasajes que en el audio
  están separados por cuatro minutos. La cita queda marcada como "difiere del original", con el
  audio desde cada uno de esos segundos al lado, para que cualquiera compare.

  Lo afirmado por el registro no cambia: ya estaba verificado contra el audio. Cambia cómo se
  presenta la fuente de prensa: de "sin verificar" a "cotejada, y en esto difiere".
