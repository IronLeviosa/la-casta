motivo: >-
  El Veracímetro incorporó una cuarta calificación, «impreciso», para el caso que antes caía en
  «discutible» sin serlo: la cifra está dentro de un margen de alrededor del 10 % o de una unidad
  cuando la unidad es chica, y el sentido de lo dicho se mantiene. Orsi dijo que ANCAP volvía a
  números negativos «después de 10 años»; con la cifra de 2020 que la propia ANCAP tiene vigente
  (reexpresada en los estados de 2021 tras corregir un error de impuesto a la renta), el último
  ejercicio negativo antes de 2024 fue 2015, nueve años antes. Un año de diferencia sobre un
  conteo de años, con documento oficial y sin dos lecturas posibles, no es «discutible»: es la
  definición de «impreciso». Con la cifra original de 2020 la distancia habría sido de cuatro
  años, pero esa cifra fue reemplazada por ANCAP tres años antes de la declaración, y el sitio
  usa la cifra vigente y muestra la anterior, para todos los gobiernos por igual. Ningún dato ni
  fuente cambia; cambia la calificación y el texto que la explica.
