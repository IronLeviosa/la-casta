motivo: >-
  Los tres casos siguen abiertos y el sitio no decía qué les falta para cerrarse ni por qué siguen
  en tier probable. Ahora cada uno lleva ese dato escrito, y con eso aparecen en la página de
  investigaciones en curso, que ordena los casos abiertos por tiempo desde el último movimiento
  judicial registrado.

  En el caso Marset se corrigió además una cita: tenía un punto final que no está en el original.
  Se agregaron cinco etapas que antes no figuraban o dependían solo de Wikipedia: la expedición del
  pasaporte el 30 de noviembre de 2021, la interpelación del 22 de agosto de 2022, la renuncia de
  la subsecretaria del Interior el 19 de diciembre de 2022, la investigación administrativa de
  Cancillería y Presidencia que concluyó el 2 de octubre de 2025 y se remitió a Fiscalía, y la
  confirmación de que al 3 de junio de 2026 la Fiscalía seguía sin fiscal titular asignado a la
  causa. Cada una con al menos dos fuentes de grupos de medios distintos, salvo la investigación
  administrativa, que tiene una sola.

  En el caso de la denuncia ante la JUTEP no cambió ninguna etapa. Se revisaron cuatro coberturas
  adicionales para romper la dependencia de un solo grupo de medios y ninguna sirve: una devuelve
  error de acceso, otra es copia casi textual de la primera, una tercera no cubre el hecho con ese
  detalle y la cuarta no tiene nota propia. Que el caso siga apoyado en un solo grupo queda dicho
  en el registro.

  Los tres siguen en tier probable. Ninguno cambia de calificación: lo que cambia es que ahora se
  ve qué falta.
