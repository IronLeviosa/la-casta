motivo: >-
  El registro citaba entre comillas un pasaje tomado de la nota-resumen que En Perspectiva publicó
  sobre el coloquio "Presidenciables 2019" de Deloitte, no de lo que Lacalle Pou dijo. Dos señales lo
  delataban: la cita mezcla primera persona ("Estamos dispuestos") con tercera persona descriptiva
  ("El Poder Ejecutivo determinará una reglamentación paulatina"), que no es como habla alguien de sí
  mismo en una entrevista, y contenía la errata "importación de incombustibles", que es un error de
  tipeo y no algo que se pronuncie.

  Las dos transcripciones que el propio medio publica de esa jornada —la parte que salió al aire y
  la que no— no contienen el pasaje. Se bajó entonces el audio completo que En Perspectiva tiene
  publicado (1 hora 45 minutos) y se transcribió con Whisper.

  Resultado: **la sustancia de la cita se corrobora**. En el minuto 84:21 dice, textualmente,
  "nosotros estamos dispuestos a liberalizar la importación de combustible; esto obviamente trae
  aparejado una incomodidad para ANCAP". La cita publicada decía "liberar" donde dijo "liberalizar",
  y arrastraba la errata del medio.

  Lo que sí estaba mal es un dato, y estaba adentro de las comillas: el registro afirmaba que la ley
  "estaría aprobada en 90 días". Consultado justamente por el plazo, en el minuto 88:53 la respuesta
  fue "a los 100 días está implementado". No son 90 días, son 100.

  Se corrige la cita contra el audio, se agrega la fuente primaria con su marca de tiempo, y el
  registro pasa de nivel `reportado` a `textual`: con el audio del propio orador no hace falta una
  segunda fuente de prensa, que es lo que lo tenía retenido en `probable`.

  Nota de método: este es el primer registro del sitio verificado contra un audio transcrito. El
  pipeline no reconocía SoundCloud como fuente descargable, así que el audio que el medio tenía
  publicado quedaba fuera de alcance; se corrigió `esVideo()` en el mismo cambio.
