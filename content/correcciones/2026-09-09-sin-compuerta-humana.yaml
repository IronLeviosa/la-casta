motivo: >-
  Se quitó la compuerta humana, y con ella cambia el tier de este caso.

  Hasta hoy, un caso judicial sin resolución (etiqueta legal «denuncia» o «formalizado») exigía la
  firma del mantenedor antes de publicarse, aunque cumpliera todas las demás reglas. El mantenedor
  decidió quitar esa compuerta, y el motivo se publica: una decisión por registro, tomada por una
  persona que no tenía que explicar en público por qué no firmaba, era un canal de asimetría contrario
  a la regla central del sitio, y en la práctica no se había firmado ningún registro. Lo que decide si
  un caso se publica es el mismo proceso que decide todo lo demás: cada etapa con documento oficial o
  dos grupos de medios, citas literales cotejadas contra la fuente, un crítico que busca explicaciones
  alternativas y riesgo legal, un editor con razones escritas y un validador que no construye el sitio
  si algo falta.

  Este caso estaba en probable únicamente por esa compuerta: el editor de su corrida dejó anotado que
  las tres objeciones bloqueantes de la crítica quedaron resueltas y que lo único que faltaba era la
  firma. Pasa a publicado sin cambiar una palabra de su contenido, de sus fuentes ni de su línea de
  tiempo judicial. La etiqueta legal sigue siendo «formalizado»: no hay condena, y la ficha lo dice
  en primer lugar.

  Los otros tres casos sin resolución que estaban en probable (Cardama, JUTEP, Marset) siguen ahí,
  porque a cada uno le falta algo distinto de la firma, escrito en su propia ficha.

  La regla escrita está en la página de metodología y en las reglas del proyecto.
solicitante: decisión del mantenedor, 2026-09-09
revision:
