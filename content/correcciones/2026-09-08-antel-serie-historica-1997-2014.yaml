motivo: >-
  Un lector señaló que el botón que muestra «todos» los años terminaba en 2015, cuando ANTEL existe
  desde 1974 y publica sus balances. Se cargaron todos los años con documento, 1997 a 2014, en el
  sitio de ANTEL y en Wayback. El crítico encontró en la primera carga dos años declarados cargados
  y no escritos, un año (2003) que ANTEL publica en su propio índice, una edición en pesos de
  1997-2001 que no se había usado, y un problema de medición que también era de simetría: hasta
  2011 los balances reexpresaban por inflación y cada año estaba en la moneda de cierre de otro
  año, lo que invertía el signo de una variación justo en el cambio de gobierno de 2002. Se cargó
  la cifra en la moneda del propio ejercicio, se usó el dólar que cada resumen declara y la
  comparación entre años se lee en dólares. Ninguna cifra ya publicada cambia; nueve citas del
  crudo original que no eran tramos contiguos del documento se completaron. Para 1974-1996 no hay
  documento público en las vías probadas, y la ficha lo dice.
