motivo: >-
  El reproductor de cada cita arrancaba en el segundo donde empieza la cita, porque así estaba
  definida la marca de tiempo del registro. La página muestra justo arriba el contexto y la
  pregunta que la persona respondía, pero el audio se los saltaba: en el coloquio de 2019
  arrancaba en «dispuestos a liberalizar la importación de combustibles», sin el «que todo el
  Uruguay haya tenido que pagar los berretines de empresarios…» que le da sentido. Un lector lo
  señaló.

  Cada fuente de audio lleva ahora una segunda marca, dónde empieza el contexto o la pregunta,
  medida sobre la transcripción con marcas de tiempo, unos segundos antes del primer tramo. El
  reproductor arranca ahí; el botón sigue diciendo dónde empieza la cita. No cambia ninguna cita,
  ninguna fuente ni nada de lo afirmado.
