cambios:
  - registro: chequeos/lacalle-pou/2022-03-27-combustibles-mas-baratos-brasil
    campo: gráficos
    de: cuatro colores, uno por serie; años pegados en el eje; un bloque de texto de método bajo cada gráfico
    a: un color por producto (nafta, gasoil) y trazo por país (Uruguay continuo, Brasil punteado); un año rotulado de cada dos; nota de dos oraciones y el método plegado bajo «Cómo se calculó»
motivo: >-
  Un lector señaló, con el gráfico a la vista, que cuatro colores no se siguen cuando la idea es
  comparar nafta con nafta y gasoil con gasoil, que los años del eje estaban pegados, y que el
  bloque de texto bajo el gráfico no lo iba a leer nadie. Las tres cosas eran de forma y las tres
  se arreglaron en el sitio para todos los gráficos: mismo color por producto y distinto trazo por
  país, un rótulo de cada tantos años cuando son muchos, y la nota corta arriba con el método
  entero plegado debajo. Este registro es el que tenía los dos gráficos largos; el texto del método
  no se perdió, se plegó. Ningún dato, fuente ni calificación cambia.
