afecta:
  - promesas/lacalle-pou/no-aumentar-combustibles
motivo: >-
  La calificación publicada (`incumplida`) es correcta y no cambia. El problema era el expediente
  que la sostiene: de las 9 evidencias publicadas, 5 eran `a_favor` (acciones de gobierno: no
  subir, mantener, bajar), 2 `neutral` y 2 `en_contra`, y las dos `en_contra` eran declaraciones
  del propio Lacalle Pou reconociendo el incumplimiento en general, sin que ninguna evidencia
  registrara un aumento de precio real y cuantificado, pese a que hubo al menos seis durante el
  mandato. La asimetría corría en contra de la lectura que el sitio publica: reforzarla con
  evidencia dura de los aumentos reales no cambia el veredicto, lo sostiene mejor.

  Se agregaron seis evidencias `en_contra` con aumentos concretos, cada una verificada con
  `pnpm fuente` en esta sesión: 2021-06-07 (12%, nafta +$7,10 y gasoil +$4,90 por litro, primer
  aumento del mandato), 2021-06-30 (segundo aumento consecutivo tras dos postergaciones), 2021-07-31
  (nafta +7,6%, gasoil +11%, primera aplicación del componente de sobrecostos de Ancap), 2022-03-30
  (Mercedes: nafta +$3, gasoil +$5, con cita textual del propio Lacalle Pou comparando el monto con
  la recomendación de Ursea), 2024-02-29 (nafta y gasoil +$1 por litro, supergás +$4 por kilo) y
  2025-01-30 (gasoil +$1 por litro tras cuatro meses de estabilidad, con nafta y supergás sin
  cambios).

  Para no introducir la asimetría inversa, se agregaron también cuatro evidencias `a_favor` que
  estaban documentadas en el material de la misma corrida pero no incorporadas: 2021-04-12 (no
  aumentó pese a una suba de 30% del petróleo, primera de dos postergaciones consecutivas;
  corrige además un error heredado de esa corrida, que atribuía a esta fecha una suba de "30,8%"
  cuando El País, su única fuente, dice "30%"), 2021-05-07 (segunda postergación, a pedido expreso
  de Lacalle Pou), 2024-11-29 y 2025-02-28 (precios mantenidos sin cambios, esta última la última
  decisión de precios del mandato). Estas cuatro además cierran el salto que tenía el registro
  entre 2023-06 y 2024-09 y extienden su cobertura hasta el final de la gestión.

  La `fundamentacion` se reescribió para nombrar estos hechos con sus montos; el `estado` no
  cambia. El registro se mantiene en tier `probable`: persisten cinco evidencias con fuente única
  que ya estaban señaladas antes de esta corrección, y sigue faltando una serie oficial completa de
  precios de venta al público (Ursea, Ancap, decretos en IMPO) que permita cuantificar cada suba
  con una sola fuente metodológica en vez de depender de qué medio cubrió qué mes.
