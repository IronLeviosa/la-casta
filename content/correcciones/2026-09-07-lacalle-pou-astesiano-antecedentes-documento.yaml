motivo: >-
  Un lector preguntó por qué el chequeo de «Astesiano no tiene antecedentes penales» estaba en
  «discutible» si la prensa documentaba procesamientos y una condena. La respuesta honesta era que
  faltaba el documento oficial, y que había uno previsible. Se lo buscó. Apareció, y dice más de lo
  que el sitio afirmaba, en las dos direcciones.

  **El documento.** La versión taquigráfica de la sesión extraordinaria del Senado del 12 de
  octubre de 2022, con la comparecencia del ministro del Interior por el caso. Un senador lee el
  prontuario: procesamiento con prisión en 2013 y condena en setiembre de 2014 a dieciocho meses por
  estafa. Dos turnos después, el subsecretario del ministerio confirma esa condena, niega el
  procesamiento de 2002 (no hay registro de esa causa; la que existe con ese delito y esa fecha es
  de otra persona), y sostiene que la causa se extinguió en 2015 por suspensión condicional de la
  pena (artículo 126 del Código Penal), comunicada por oficio judicial, por lo que «desde el punto
  de vista jurídico y técnico esta persona no tiene antecedentes»; la fiscal del caso lo había
  llamado «primario legal». Nadie rebatió la extinción en la sesión. El decreto 382/999 dice qué
  puede figurar en un certificado de antecedentes judiciales.

  **Lo que cambia.** El sitio afirmaba en voz propia un procesamiento de 2002 que el Estado dice
  que no es de esta persona: se retira del chequeo y del resumen de la declaración. La calificación
  sigue siendo «discutible», pero por el fondo y no por falta de documento: «no tiene antecedentes
  penales» es falso en el sentido corriente (hubo prisión preventiva en 2013 y condena en 2014) y
  cierto en el sentido jurídico (causa extinguida en 2015, certificado limpio), y el análisis dice
  las dos cosas con el documento al lado. Se agregan dos discrepancias contra ese mismo registro
  oficial (una fecha de condena mal atribuida; una cita alterada) y nueve registros de cobertura.

  **Método.** El brief de esta búsqueda pedía buscar solo en los lugares donde podía haber
  documentos que confirmaran antecedentes; el crítico lo objetó, con razón, y la versión simétrica
  (buscar también el documento que sostenga la lectura contraria) es la que produjo el hallazgo.
  Además el código exigía literalmente «documento oficial» para calificar verde o rojo y dejaba
  afuera la versión taquigráfica del Parlamento, que la regla escrita sí contaba; se corrigió.

  Modelos: resolvedor y editor en Sonnet, crítico en Opus, por decisión del mantenedor.
