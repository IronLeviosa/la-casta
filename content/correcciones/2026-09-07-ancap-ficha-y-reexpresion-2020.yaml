motivo: >-
  Un lector pidió una página por empresa pública, «como si fuera su propia empresa, que de hecho lo
  es», al ver que ANCAP enlazaba a una página de medio. Esta corrección abre la colección de
  empresas con la ficha de ANCAP y aplica lo que apareció al armarla sobre dos registros ya
  publicados.

  **La ficha.** Qué hace, con qué ley tiene reservada la importación y refinación de crudo, los
  argumentos a favor y en contra del monopolio en palabras de quienes los sostienen (el mismo
  esfuerzo para cada lado, y el esquema no admite un solo lado), y los balances auditados 2014-2024:
  resultado del ejercicio, impuestos pagados, transferencias a Rentas Generales, la capitalización
  de 2016 y la deuda financiera, cada número con su documento. Lo que la empresa le pasa al Estado
  es sobre todo lo que paga de impuestos (entre 600 y 1.021 millones de dólares por año); las
  transferencias a Rentas Generales existieron solo en 2020, 2023 y 2024 y son mucho menores.

  **La reexpresión de 2020.** Los estados contables de 2021 corrigen el ejercicio 2020: de una
  pérdida de 510,7 millones de pesos a una ganancia de 385,1 millones, por un error de cálculo del
  IRAE. El chequeo publicado calificaba «falso» el «después de 10 años» de Orsi apoyándose en que
  2020 había sido negativo. Con la cifra vigente, el último ejercicio negativo antes de 2024 fue
  2015, y 2014 también lo fue: nueve años, no diez. Se equivocó por un año. La calificación pasa a
  discutible, con la serie completa a la vista y la nota de la reexpresión en el punto de 2020.

  **La discrepancia de Presidencia.** Estaba en probable a la espera de los balances de 2015 a
  2017. Leídos: el resultado operativo fue negativo en 2015 y 2016, contra lo que la gacetilla
  publicaba; 2016 a 2019 encajan en el mismo patrón (resultado del ejercicio rotulado como
  operativo), 2015 no, y la ficha lo dice sin explicarlo. Pasa a publicado con el alcance ampliado.

  **Lo que no entra.** No hay ninguna comparación empresa a empresa con Petrobras, ENAP, Petropar
  o YPF publicada por una fuente identificable; las cuatro comparaciones de precio son de precio al
  público entre países y así se rotulan. El sitio no calcula comparaciones.

  Modelos: investigador y editor en Sonnet, crítico en Opus, por decisión del mantenedor.
