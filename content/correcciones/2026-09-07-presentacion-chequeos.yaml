motivo: >-
  Un lector revisó las páginas del Veracímetro y encontró tres cosas: el título no decía qué se
  discutía (era la afirmación recortada: "En marzo de 2022, Lacalle Pou dijo que, por primera vez
  desde 2001 o 2002 según su propio…"), el análisis y el dato real venían en un solo bloque de
  texto, y las cifras comparadas se contaban en prosa cuando un gráfico las muestra de un vistazo
  (los resultados de ANCAP año por año, los precios de Uruguay y Brasil).


  Ningún rol tenía el trabajo de ordenar la información para el lector. Desde hoy lo tiene el
  editor, con instrucciones escritas, y esta corrección lo aplica a los 10 chequeos publicados:
  título con qué se chequea y, si cabe, el veredicto; análisis en párrafos cortos con el veredicto
  en el primero; el dato real en uno o dos párrafos; y gráfico, con la fuente de cada serie y la
  tabla de valores debajo, donde el chequeo compara cifras. Lo que sobraba del análisis (pruebas de
  sensibilidad, notas de método) pasó a las notas internas del registro, que no se publican pero
  quedan. No cambia ninguna calificación, afirmación, fragmento, fuente ni tier. Editor en Sonnet,
  por decisión del mantenedor.
