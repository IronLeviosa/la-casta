motivo: >-
  Cinco chequeos de Batlle sobre datos económicos seguían sin el documento oficial que los
  respaldara. Con los documentos que se encontraron, uno queda respaldado por el documento decisivo,
  tres por documentos parciales y uno sigue sin ninguno.


  El principal es el déficit fiscal de 2003 y de 2012. Batlle dijo que fueron ambos 2,8% del PIB. El
  Ministerio de Economía confirma 2,8% para 2012, pero para 2003 los documentos oficiales dan 3,0%
  (Banco Central), 3,2% (Rendición de Cuentas 2003, enviada por el gobierno de Batlle) y 3,1%
  (Presupuesto 2005-2009, la versión más reciente); ninguno da 2,8%. La calificación pasa de
  discutible a impreciso: con el 3,1% la diferencia es de 9,7%, dentro del margen de 10%, y con el
  3,2% sería falso. La publicación anterior decía que el informe del Banco Central de 2003 no tenía
  texto legible y que los comunicados de 2012-2013 no estaban disponibles; ambas cosas dejaron de
  ser ciertas y se retiran.


  En los otros cuatro la calificación sigue siendo discutible. Para la licitación desierta de 2013
  no se encontró el resultado de ninguna licitación de junio ni de julio, y se retira una frase sin
  fuente sobre lo que el gobierno colocaba habitualmente. Para el IRPF y el IASS se suman el decreto
  de la base de prestaciones de 2013 y el gasto de la Rendición de Cuentas de 2011 (unos US$ 143
  millones, cerca de los 140 que dijo Batlle), pero los $ 2.500 millones de recaudación extra no
  figuran en ningún documento oficial. En los dos de la reforma tributaria de 2005 se corrige una
  cita del Banco Mundial que era el nombre del indicador y no el tipo de cambio, se retiran frases
  sin fuente ("plausible", "techo", lo que diría una exposición de motivos que nadie había leído) y
  el de los bancos pasa a decir las dos lecturas posibles de los USD 15 millones.


  No se incorpora una frase del ministro Astori sobre un cálculo de recaudación en curso: respondía
  a una pregunta sobre el impuesto a la renta de las personas físicas, no sobre la rebaja a las
  empresas ni a los bancos. Los cinco siguen como probables: de lo que dijo Batlle hay una sola nota
  de prensa en cada caso.
solicitante: revisión de los cinco chequeos de Batlle que seguían sin documento oficial, 2026-10-29
