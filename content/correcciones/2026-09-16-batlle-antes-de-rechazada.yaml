motivo: >-
  Un pedido interno señaló que los diez registros que citan la última entrevista de Jorge Batlle a
  El Observador llevan como fecha el 24 de octubre de 2016 (día de su fallecimiento) porque la nota
  no dice cuándo se hizo la entrevista, y pidió agregar `fecha_precision: antes_de` sobre esa fecha
  para marcarla como una cota y no como un día cierto.

  Al releer la nota completa (no solo el fragmento con las citas) apareció la bajada, que sí lo
  dice: "Aquí un resumen de la entrevista con Leandro Gómez, realizada el 21 de setiembre de 2016".
  La premisa del pedido —que la fuente no documenta la fecha— es falsa, así que no corresponde
  agregar una marca de incertidumbre sobre una fecha que la propia fuente desmiente. Se rechaza este
  pedido y se abre por separado una corrección que fija la fecha real, 21 de setiembre de 2016, en
  los diez registros.
solicitante: revisión interna de la corrida 2026-09-16-batlle-economia-impuestos
quien:
