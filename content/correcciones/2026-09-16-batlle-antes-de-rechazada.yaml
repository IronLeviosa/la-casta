motivo_rechazo: la_evidencia_no_prueba_lo_que_afirma
que_cambiaria_la_decision: "Una fuente que mostrara que la entrevista no se hizo el 21 de setiembre
  de 2016 —por ejemplo, que esa fecha en la bajada de la nota fuera un error del medio, o que
  existiera otra entrevista posterior con las mismas citas— dejaría de nuevo la fecha exacta sin
  documentar y volvería a habilitar `fecha_precision: antes_de` sobre la cota que corresponda."
