motivo: >-
  El título de la página de cada declaración era el resumen entero (siete líneas en pantalla) y,
  desde el rediseño del 6 de setiembre de 2026, la primera oración del resumen recortada, que suele
  ser contexto ("En el coloquio Presidenciables 2019 de Deloitte y En Perspectiva, junto a sus
  asesores…") y no dice qué se afirmó. Un lector lo señaló: el título tiene que dar una idea de lo
  que se va a leer.


  Se escribe `titulo` en las 84 declaraciones publicadas que no lo tenían, con un solo criterio para
  todos los políticos: lo sustancial (qué afirma, promete o niega la persona), sin el nombre de la
  persona, sin dónde ni ante quién, sin adjetivos, sin erratas del medio. Ningún otro campo cambia:
  ni la cita, ni el resumen, ni las fuentes, ni el nivel de evidencia, ni el tier. El título lo
  escribió el editor a partir de la cita y el resumen de cada registro: los de Orsi y Mujica en
  Fable, los de Lacalle Pou en Sonnet, por decisión del mantenedor de no gastar el modelo caro en un
  trabajo de redacción; la línea por registro está en
  `data/corridas/2026-09-06-titulos-declaraciones/razones.md`.
