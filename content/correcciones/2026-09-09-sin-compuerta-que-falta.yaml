motivo: >-
  El aviso de «qué le falta» de este chequeo decía que sus fuentes de verificación manual exigían la
  firma del mantenedor antes de publicarse. Esa firma ya no existe: el mantenedor quitó la compuerta
  humana el 9 de setiembre de 2026 (ver la corrección «sin compuerta humana» de la misma fecha).

  El aviso pasa a decir lo que de verdad falta: que las ocho fuentes marcadas como verificación manual
  (planillas, un csv, un zip y dos respuestas de API) se lean con la herramienta de lectura del sitio,
  que hoy sí lee esos formatos, y que sus citas se cotejen. Ninguna cifra, calificación ni fuente
  cambia; el registro sigue en probable hasta que eso ocurra.
solicitante: decisión del mantenedor, 2026-09-09
