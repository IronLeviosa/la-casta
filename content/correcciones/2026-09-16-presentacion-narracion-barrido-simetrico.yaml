motivo: >-
  Una revisión del sitio buscó, en todos los registros de todas las personas, medios y empresas por
  igual, oraciones que contaban cómo se hizo la verificación en lugar de decir qué encontró:
  menciones a la sesión de trabajo, a la investigación, a los roles que participan en la edición o a
  la primera persona de quien escribió el texto. Aparecieron nueve casos, en fichas de Barandiarán,
  Batlle, un análisis sobre ANTEL, una discrepancia sobre UTE, otra sobre ANTEL, un veto de Batlle y
  la descripción de un medio.


  En cada uno se reemplazó esa oración por el límite concreto de la evidencia: qué documento no está
  publicado, qué palabra no aparece en un texto legal, o de qué sesión parlamentaria se trata, con
  su fecha. En el análisis sobre la renta monopólica de ANTEL, además, dos párrafos largos se
  separaron en oraciones más cortas para que se lean con más comodidad.


  Ninguna cifra, calificación, fuente, nivel de verificación o calificación de tier cambió: solo la
  forma en que se explica lo que falta o no se pudo confirmar. Dos oraciones parecidas, en el
  detalle de un veto y en una discrepancia sobre UTE, habían quedado fuera del primer alcance por un
  recorte de campos; una segunda pasada sobre los mismos dos registros las reescribió con el mismo
  criterio.
