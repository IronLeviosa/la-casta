motivo: >-
  Un lector señaló que la declaración salía de una conferencia de prensa, que el registro citaba dos
  crónicas en vez del original, y que las dos cifras que el presidente da en la misma respuesta
  ("más de USD 1.700 millones de sobrecostos", "combustibles más baratos que Brasil") estaban sin
  chequear. Las tres cosas eran ciertas.

  **La primaria.** Presidencia publicó la gacetilla de esa noche con un enlace al audio completo
  (18 minutos), pero el archivo ya no está en su servidor: da 404. La Wayback Machine conserva una
  copia de 2024 con la fecha de modificación original (madrugada del 28 de marzo de 2022). Se la
  transcribió con Whisper y se cotejaron las dos notas contra ella. El País coincide palabra por
  palabra. Subrayado publica entre comillas «Hoy por primera vez tenemos combustibles más baratos
  que Brasil», y el audio dice «hoy por primera vez creo que del 2001 2002 tenemos combustibles más
  baratos que Brasil»: la reserva del hablante quedó afuera de las comillas, sin marca de recorte.
  Eso se registra como discrepancia de Subrayado, sin verbos de intención. La cita de cabecera y el
  resumen del registro seguían la versión de Subrayado; pasan a seguir el audio, con la reserva
  incluida, y el registro sube a nivel textual.

  **Los chequeos.** Nacen de los datos que aparecen dentro de la respuesta y quedan marcados sobre
  el texto de la declaración. (1) "Más de USD 1.700 millones de sobrecostos en el quinquenio
  pasado": ningún organismo publica ese agregado; lo que existe es la serie oficial de precios de
  paridad de importación de URSEA y un cálculo de un centro de estudios privado sobre esa serie, que
  da una cifra del mismo orden. Con prensa y un cálculo privado, la regla del Veracímetro da
  "discutible". (2) "Combustibles más baratos que Brasil, por primera vez desde 2001 o 2002": con
  los precios oficiales de los dos países y el tipo de cambio de los dos bancos centrales, en la
  semana de la declaración la nafta uruguaya era más cara y el gasoil más barato o más caro según
  qué especificación se compare; "por primera vez" no se puede confirmar ni negar sin una serie
  histórica pareada. Queda "discutible", y en estado probable hasta que el mantenedor firme las dos
  cotizaciones consultadas por API, que la máquina no puede verificar sola.

  **Simetría.** El crítico de esta corrida señaló que, con estos dos, el Veracímetro tendría tres
  chequeos y los tres de la misma persona, y listó las otras seis declaraciones publicadas con una
  cifra adentro (dos de Lacalle Pou, cuatro de Orsi). Esa vuelta se lanzó en la misma tanda, con el
  mismo criterio; sus registros llegan por sus propias corridas.

  Modelos: investigador y editor en Sonnet, crítico en Opus, por decisión del mantenedor.
