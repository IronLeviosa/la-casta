motivo: >-
  La corrección del 16 de septiembre de 2026 sobre una declaración y un chequeo de Danilo Astori
  anunció dos discrepancias entre una nota de El Observador del 27 de mayo de 2016 y el comunicado
  que Presidencia publicó el 23 de mayo: la franja del IRPF (la nota la ubica entre $33.041 y
  $50.110; el comunicado, entre $33.400 y $50.100) y el plazo para que la Rendición de Cuentas
  llegue al Parlamento (la nota dice «31 de junio»; el comunicado, el 30 de junio). Las nombró con
  una dirección que no era la de esos registros, por un error en cómo se las nombró, y por eso no
  llegaron a publicarse. Ahora se publican con la dirección que les corresponde.


  El análisis de la primera dice también que la misma nota cita a Astori, en otro párrafo, con la
  franja «entre $ 33.401 y $ 50.100», que es la del comunicado. El de la segunda dice que la fecha
  publicada no existe y no coincide con la del documento, sin sugerir que la nota haya dado otro
  plazo.


  Las dos diferencias son chicas. Se registran porque el criterio es el mismo para cualquier medio y
  cualquier persona: toda cifra o fecha publicada que no coincide con el documento primario entra,
  sin piso de magnitud.
