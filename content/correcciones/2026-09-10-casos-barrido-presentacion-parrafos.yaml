motivo: >-
  La revisión automática de las páginas construidas rechaza un párrafo de más de 1.500 caracteres
  sin plegar y cualquier texto para el lector que cuente el proceso de elaboración. Tres casos del
  barrido publicado el 10 de setiembre de 2026 traían el resumen en un solo párrafo largo, y uno
  decía «en esta corrida» en la descripción de un hito. Se separan los párrafos en los límites de
  oración y se reemplaza esa frase por «no consta». No cambia ninguna palabra sustantiva, ninguna
  fecha, ninguna fuente ni ninguna calificación.
