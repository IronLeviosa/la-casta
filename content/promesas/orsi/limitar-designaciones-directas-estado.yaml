estado: en_proceso_adelantada
fundamentacion: 'La promesa se formuló el 17/9/2024, sin acotarla a un nivel de gobierno. El mandato
  no terminó, por lo que corresponde un estado en_proceso. A favor, con solidez alta: la Ley 20.451
  (promulgada 16/12/2025, publicada 23/12/2025) limita el ingreso de funcionarios a las intendencias
  por designación directa a un 4% del total de cargos presupuestales y prohíbe designaciones en los
  últimos 12 meses de mandato -evidencia de nivel textual, con documento oficial de Presidencia y
  una nota periodística que corrobora el mismo contenido-. Es una acción de gobierno concreta y
  verificada, aunque acota "el estado" (la formulación de la promesa) a un universo más chico: las
  intendencias, no la administración central ni los entes autónomos. Con efecto neutral, sin poder
  pesarse a favor ni en contra por sí sola: según el informe "Vínculos laborales con el Estado,
  altas y bajas" de la ONSC, en 2024 el 38,8% de los ingresos a intendencias fue por designación
  directa; a seis meses de la ley no había reportes de cumplimiento y en Soriano ediles
  frenteamplistas denunciaron más de 60 designaciones directas entre julio y diciembre de 2025 y 149
  entre diciembre de 2025 y abril de 2026, frente a lo cual la intendencia respondió que están
  dentro del límite legal del 4% -evidencia de fuente única, con el descargo de la intendencia
  incluido en la misma nota, no solo la denuncia de los ediles-. No hay, en este lote, una fuente
  que confirme o refute si esas 149 designaciones exceden o no el 4% legal. Con ese balance -una ley
  aprobada con un límite verificable pero acotada a un nivel de gobierno, y una disputa sobre su
  cumplimiento en al menos un departamento que ninguna fuente de este lote resuelve- se clasifica
  como en_proceso_adelantada: hay una acción legislativa concreta a favor de la promesa dentro del
  primer año de gobierno, con implementación todavía en disputa y sin verificar.'
