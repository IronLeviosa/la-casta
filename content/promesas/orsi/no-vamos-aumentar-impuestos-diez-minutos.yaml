  - fecha: 2026-01-21
    tipo: dato_oficial
    efecto: neutral
    descripcion: El Poder Ejecutivo aumentó el valor de la Base de Prestaciones y Contribuciones (BPC) a
      $6.864 desde el 1/1/2026, lo que modifica las franjas del IRPF y el IASS. La BPC puede
      ajustarse por el Índice de Precios al Consumo (IPC) o por el Índice Medio de Salarios (IMS), a
      elección del Poder Ejecutivo dentro de lo que habilita la Ley 17.856; el gobierno de Orsi
      volvió al criterio IPC (vigente hasta 2020), después de que el gobierno de Lacalle Pou lo
      hubiera cambiado a IMS en 2020-2021 (una decisión que en su momento criticó el Frente Amplio,
      entonces oposición). Como los salarios crecieron más que los precios en 2025 (IMS +5,94%
      frente a IPC +3,65%), el criterio elegido ahora recauda más de lo que hubiera recaudado si se
      mantenía el ajuste por IMS. Economistas consultados por la diaria coincidieron en que el
      cambio no constituye un "ajuste fiscal" porque no modifica alícuotas ni la estructura del
      IRPF, solo actualiza un parámetro previsto por la ley vigente.
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.montevideo.com.uy/Noticias/De-mazazo-a-es-lo-que-corresponde--cruces-y-criticas-varias-por-ajustes-en-IRPF-e-IASS-uc950445
