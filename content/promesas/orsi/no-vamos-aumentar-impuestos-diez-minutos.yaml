estado: en_proceso_demorada
fundamentacion: 'La promesa se formuló el 17 de noviembre de 2024 sin condicionamiento explícito en
  su propio texto ("no vamos a aumentar los impuestos... no voy a subir los impuestos"), aunque en
  el mismo debate Orsi matizó que esa planificación regía "en términos de normalidad" y podía
  cambiar si "el contexto lo imponía" (ver declaraciones[7] y el giro asociado en giros.yaml). El
  mandato no terminó (asumió el 1/3/2025; el período corre hasta 2030), por lo que corresponde un
  estado en_proceso, no cumplida/incumplida. Dos evidencias que estaban en una primera versión de
  este registro se retiraron antes de publicar (ver razones.md): la reafirmación del propio Orsi en
  mayo de 2026 (autoevaluación del promitente, no un hecho de gobierno, y sin segunda fuente) y la
  declaración de Andrés Ojeda de setiembre de 2025 (juicio político de un opositor sin segunda
  fuente, a diferencia de la evidencia equivalente de "Construir sin Destruir", que sí la
  consiguió). El registro queda entonces con cuatro evidencias, las cuatro con dos o más fuentes de
  grupos distintos o con documento oficial, y las cuatro de efecto en_contra o neutral: no hay
  ninguna evidencia "a favor" en sentido estricto en este registro, más allá de que ninguna de las
  cuatro implica una suba de las tasas generales de IRPF, IRAE o IVA. (1) En agosto de 2025 el
  gobierno extendió el IVA a las compras minoristas por internet en plataformas extranjeras, antes
  exoneradas bajo el régimen de franquicias hasta US$ 800 anuales — un hecho de gobierno verificado
  con dos fuentes de distinto grupo, que el propio Orsi defendió invocando "equidad" frente al
  comercio local, no la contingencia de contexto internacional que había planteado como condición en
  noviembre de 2024; es una ampliación de la base imponible de un impuesto ya existente sobre una
  categoría antes exenta, no una suba de la tasa general de IVA. Son sostenibles dos lecturas: que
  sí es un aumento de impuestos, porque una transacción antes exonerada pasa a pagar la tasa general
  del 22%; o que no lo es, porque la tasa general no cambia y lo que se modifica es el alcance de
  una exención puntual. Orsi había calificado un caso distinto —el recargo de IVA a compras con
  tarjeta del gobierno de Lacalle Pou— como "una muestra clara de aumento de tributos"
  (declaraciones[9], 18/11/2024), sin formular en este lote un criterio general que distinga ese
  caso del suyo propio. (2) La Ley de Presupuesto (Ley 20.446, enero 2026) creó el Impuesto Mínimo
  Complementario Doméstico, que alcanza únicamente a multinacionales con facturación superior a US$
  750 millones bajo el marco del Pilar Dos de la OCDE; es sostenible tanto la lectura de que crea,
  con ese nombre, un impuesto nuevo, como la de que no constituye una carga nueva sobre
  contribuyentes uruguayos porque capta, vía ese marco internacional, una recaudación que esas
  multinacionales ya pagan en otra jurisdicción. (3) El ajuste de las franjas de IRPF e IASS por la
  actualización de la BPC (enero de 2026) es una elección discrecional de índice (IPC en vez de IMS,
  dentro de lo que habilita la Ley 17.856) que recauda más que la alternativa, pero no cambia
  alícuotas ni la estructura del IRPF; economistas consultados por la diaria coinciden en que no
  equivale a un "ajuste fiscal". Es, además, el mismo mecanismo que usó el propio gobierno de
  Lacalle Pou en sentido inverso en 2020-2021 (cambió de IPC a IMS cuando eso recaudaba más),
  decisión que entonces criticó el Frente Amplio como oposición: es una herramienta que ambos
  partidos usaron de forma simétrica según convenía. Se pondera con efecto neutral. (4) El documento
  "Construir sin Destruir" del Partido Nacional (marzo de 2026) acusa, en términos generales, una
  "brecha entre promesa y gestión" por incrementos tributarios; esa caracterización general tiene
  dos fuentes de grupos distintos (Ámbito, Telenoche). El desglose específico que da Ámbito
  (incrementos puntuales en IRPF, IRAE, IRNR y zonas francas, más allá de lo ya documentado en (1) y
  (2)) no está corroborado de forma independiente y queda como hipótesis abierta, no como evidencia
  de esta promesa. Con ese balance —dos medidas de gobierno verificadas que amplían qué se grava, de
  alcance acotado; un ajuste de índice que recauda más pero no cambia tasas ni estructura, con el
  mismo mecanismo usado en sentido inverso por el gobierno anterior; y una acusación opositora
  general ya doblemente sourceada pero con desglose sin verificar— se clasifica como
  en_proceso_demorada: hay indicios verificados de apartamiento parcial de la promesa leída
  literalmente, sin que equivalga, con el período aún en curso, a un incumplimiento general, y sin
  que se hayan modificado las tasas generales de IRPF, IRAE o IVA.'
revision:
  tier: publicado
  notas_internas: "El origen de la promesa tiene dos fuentes de grupos distintos (El
    Observador/werthein-hochbaum, Infobae/grupo-infobae). El campo `texto` se corrigió para marcar
    el salto de diez minutos entre las dos frases del debate (ver razones.md). Las cuatro evidencias
    que quedan tienen todas dos o más fuentes de grupos distintos, o nivel textual con documento
    oficial (Ley 20.446); ninguna bloquea el nivel reportado. Se retiraron dos evidencias de una
    primera versión de este registro por no conseguir segunda fuente (ver razones.md, adenda del
    2026-09-04): la reafirmación de Orsi de mayo de 2026 y la declaración de Ojeda de setiembre de
    2025. El video del debate del 17/11/2024, si se consigue en una futura revisión, permitiría
    subir el origen de la promesa a nivel textual."
