          titulo: "De “mazazo” a “es lo que corresponde”: cruces y críticas varias por ajustes en IRPF e IASS"
          cita: El aumento en el valor de la base de prestaciones y contribuciones (BPC) decretado por el
            Poder Ejecutivo, que modifica las franjas del impuesto a la renta de las personas
            físicas (IRPF) y en el impuesto a la asistencia de la seguridad social (IASS), causó
            polémica y repercusión en el sistema político uruguayo.
          retrieved_at: 2026-09-04
        - url: https://www.elobservador.com.uy/cuales-son-las-nuevas-franjas-aportes-irpf-2026-y-el-nuevo-valor-la-bpc-n6030375
          medio: el-observador
          fecha: 2026-01-20
          tipo: nota
          titulo: Cuáles son las nuevas franjas de aportes de IRPF e IASS en 2026 y el nuevo valor de la BPC
          cita: Mediante un comunicado, el Ministerio de Economía (MEF) señaló que se retomó el criterio de
            ajuste de la BPC en función de la variación del Índice de Precios al Consumo (IPC), tal
            como había sucedido hasta el 2020.
          retrieved_at: 2026-09-04
        - url: https://www.ambito.com/uruguay/franjas-del-irpf-y-el-iass-el-gobierno-cambia-criterio-y-recaudara-mas-n6236890
          medio: ambito
          fecha: 2026-01-21
          tipo: nota
          titulo: "Franjas del IRPF y el IASS: el gobierno cambia de criterio y recaudará más"
          cita: El gobierno anterior cambió el criterio y ajustó la BPC (por lo tanto las franjas) por IMS. En
            aquel momento (2020-2021), en plena pandemia, el salario aumentó menos que el IPC (caída
            real), por lo tanto el cambio de criterio implicó una mayor recaudación que si se
            hubiera seguido ajustando por IPC. El Frente Amplio (FA), la oposición de aquel momento,
            criticó duramente al oficialismo por esa decisión. Luego, el salario comenzó a
            evolucionar por encima del IPC, revirtiendo -en parte- el efecto. Ahora, el nuevo
            gobierno volvió a cambiar el criterio y regresó el ajuste de la BPC por IPC. Esto
            implicará una mayor recaudación que si se hubiera mantenido el ajuste por IMS.
          retrieved_at: 2026-09-04
        - url: https://ladiaria.com.uy/economia/articulo/2026/1/economistas-coinciden-en-que-los-cambios-en-el-irpf-realizados-por-el-gobierno-no-constituyen-un-ajuste-fiscal/
          medio: la-diaria
          fecha: 2026-01-29
          tipo: nota
          titulo: Economistas coinciden en que los cambios en el IRPF realizados por el gobierno no
            constituyen un ajuste fiscal
          cita: los tres especialistas consultados por la diaria coincidieron en que los cambios introducidos
            no constituyen un ajuste fiscal, ya que no modifican ni las alícuotas ni la estructura
            del IRPF, sino que actualizan parámetros previstos por la normativa vigente.
          retrieved_at: 2026-09-04
