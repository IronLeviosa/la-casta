    efecto: en_contra
    descripcion: La Ley de Presupuesto Nacional 2025-2029 (Ley 20.446, publicada en el Diario Oficial el
      08/01/2026) crea el Impuesto Mínimo Complementario Doméstico a multinacionales; la exposición
      de motivos de ese componente del proyecto sostiene que el objetivo no es "aumentar los
      impuestos" sino "localizar" en Uruguay recaudación que ya se paga en el exterior. El mismo
      proyecto, por separado, eleva a US$ 800 anuales, gravada con IVA, la franquicia de compras en
      plataformas extranjeras (antes exonerada); para este segundo cambio la exposición de motivos
      usa una justificación distinta, de "ajustes técnicos" orientados a "mayor equidad horizontal",
      no la de "localización" que aplica al primero.
