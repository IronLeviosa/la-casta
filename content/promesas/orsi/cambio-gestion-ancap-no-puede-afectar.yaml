texto: El cambio de gestión en Ancap no puede afectar el bolsillo de los uruguayos.
fecha_promesa: 2025-04-25
origen:
  nivel: textual
  fuentes:
    - url: https://www.youtube.com/watch?v=8_HQMDpzEYA
      medio: youtube
      fecha: 2025-04-25
      tipo: video
      titulo: Conferencia de prensa del presidente de la República, Yamandú Orsi
      marca_tiempo: 3:49
      cita: lo primero, lo que tenemos que hacer es cambiar la gestión y procurar y lograr que ese cambio
        de gestión no afecte el bolsillo de los uruguayos. No puede afectar.
      retrieved_at: 2026-09-04
estado: en_proceso_adelantada
fundamentacion: La promesa ("el cambio de gestión no puede afectar el bolsillo de los uruguayos") no
  fija una métrica ni un plazo, por lo que su evaluación se apoya en el balance de las acciones de
  precios documentadas entre abril de 2025 y setiembre de 2026, no en un único mes. En ese período
  el gobierno subió los combustibles en abril y mayo de 2026 por el alza internacional del petróleo
  derivada de la guerra en Medio Oriente (en_contra); en las dos decisiones de precios posteriores
  mejor documentadas, julio y setiembre de 2026, fijó valores por debajo de lo que recomendaba la
  fórmula PPI de Ursea, absorbiendo parte del ajuste (a_favor). El Partido Nacional acusó al
  gobierno de generar sobreprecios de 90 millones de dólares entre marzo y diciembre de 2025 por
  apartarse de esa misma metodología PPI (en_contra), pero la cifra proviene de una única fuente de
  prensa que reproduce un informe de un centro de estudios privado citado en un documento
  partidario, sin documento oficial que la confirme o la refute; se le da menos peso que a las dos
  acciones de gobierno documentadas por dos fuentes cada una. Con la evidencia disponible, el
  balance es favorable al cumplimiento de la promesa, con la salvedad de que el período cubierto es
  corto (18 meses de un mandato de 5 años) y de que la promesa, al no ser cuantificable, admite
  revisión si se documentan más meses o si se verifica de forma independiente la denuncia del
  Partido Nacional.
revision:
  tier: probable
  notas_internas: >-
    evidencias[3] (denuncia del PN de 90 millones de dólares, 2026-03-01) es de un solo grupo de
    medios (ambito) y tiene la cadena de atribución más larga y débil del lote (PN cita a un centro
    de estudios privado, Ámbito reporta el documento del PN). No hay documento oficial (PPI de
    Ursea, decretos IMPO) que confirme o refute la cifra; Telenoche y Caras y Caretas cubrieron la
    difusión del mismo documento el mismo día pero no reproducen ese monto específico (verificado
    por el crítico). Se mantiene en el lote porque está correctamente atribuida como denuncia de un
    tercero, no como hecho propio, y porque "falta una segunda fuente" es exactamente lo que define
    el tier probable; se la excluiría de un lote publicado recién si además hubiera dudas sobre la
    buena fe de la atribución, que no las hay. Falta para publicado: segunda fuente independiente de
    otro grupo, o verificación contra los informes mensuales de PPI de Ursea y los decretos de
    precios en IMPO de marzo a diciembre de 2025. Ver
    hipotesis/orsi/verificacion-sobreprecio-90m-pn-2026.yaml.

    evidencias[2] (congelamiento de setiembre): tipo bajado de dato_oficial a declaracion porque no
    hay documento publicado (informe de Ursea, comunicado de MIEM) citado en ninguna de las dos
    notas, solo declaraciones orales de la ministra Cardona reportadas por prensa; una de las dos
    fuentes (infobae) es un despacho de agencia EFE republicado, no cobertura propia, así que aunque
    cumple la letra de "dos grupos" no hay verificación totalmente independiente del cálculo de los
    75 millones. No baja el tier de la promesa por sí sola porque formalmente cumple la regla de dos
    grupos, pero se deja constando la salvedad.

    evidencias[1] (baja de julio): resuelto — se sumó una segunda fuente (subrayado, grupo
    fontaina-de-feo) con las mismas cifras que el-observador, cumple dos grupos.

    evidencias[0] (suba de mayo): tipo corregido de dato_oficial a accion_de_gobierno, para ser
    consistente con evidencias[1] (misma categoría de hecho: el gobierno fija el precio mensual, en
    un caso sube y en el otro baja).
