estado: en_proceso_adelantada
fundamentacion: 'La promesa se formuló el 17/9/2024, sin plazo propio. El mandato no terminó (asume
  el 1/3/2025, período hasta 2030), por lo que corresponde un estado en_proceso, no
  cumplida/incumplida. La evidencia es mixta y se pesó por su solidez, no por cuál lado pesa más. En
  contra: la propia Jutep reconoció en abril de 2026, a propósito de un error detectado en la
  declaración jurada del propio Orsi, que "hasta ahora la Jutep no tiene forma reglamentaria ni
  personal especializado para evaluar la consistencia de todas las declaraciones presentadas para su
  publicación" -evidencia de fuente única, dato oficial citado por un medio-. A favor, con solidez
  mayor: el artículo 566 de la Ley 20.446 (presupuesto nacional, promulgada 16/12/2025) y la
  Resolución 405/2025 del Directorio de la Jutep establecieron que desde el 1/1/2026 las
  declaraciones juradas de bienes e ingresos se presentan exclusivamente en formato electrónico,
  cerrando precisamente la vía en papel que había impedido detectar automáticamente el error en la
  propia declaración de Orsi -evidencia de nivel textual, con documento oficial de la propia Jutep-.
  Es una acción de gobierno verificada, cronológicamente posterior al diagnóstico de abril (que
  describe una declaración presentada antes de la reforma, bajo el régimen anterior), que resuelve
  un problema puntual y concreto de control. No resuelve la carencia de "personal especializado" que
  la propia Ferraris señaló y que ninguna fuente de este lote documenta como atendida. Con ese
  balance -una reforma legal concreta que cierra una falla de control ya identificada, sin evidencia
  de que se haya reforzado la dotación de personal ni otras dimensiones del organismo- se clasifica
  como en_proceso_adelantada: hay una acción de gobierno verificable y a favor de la promesa dentro
  del primer año de un mandato de cinco, sin que eso agote lo que "fortalecer la Jutep" puede
  implicar.'
revision:
  tier: probable
  notas_internas: 'El origen de la promesa tiene mpp.org.uy (grupo frente-amplio) y subrayado (grupo
    fontaina-de-feo) como fuentes de grupos mecánicamente distintos, pero mpp.org.uy es el sitio de
    campaña del propio sector de Orsi: según su propio registro en content/medios/mpp.yaml, "no es
    un medio periodístico: es fuente primaria de lo que el candidato y su sector prometieron, y
    nunca cuenta como segunda fuente independiente". Subrayado sí es cobertura periodística propia y
    genuina (no reproduce a mpp), pero es la única. La promesa queda corroborada por una sola fuente
    periodística real, no dos; se marca _faltante: segunda_fuente y baja a probable por esto,
    independientemente de la calidad de las evidencias de seguimiento. Falta: una segunda nota
    periodística distinta de subrayado sobre el mismo acto de campaña (16-17/9/2024).'
