      medio: el-pais
      fecha: 2009-11-16
      tipo: nota
      titulo: José Mujica promueve plebiscito por aborto
      cita: '"No vamos a tener la más mínima iniciativa, pero respetaremos la decisión que tome el
        Parlamento; no la vamos a vetar. Tenemos que ser coherentes porque cuando éramos
        legisladores la votamos"'
      retrieved_at: 2026-09-05
estado: cumplida
fundamentacion: Mujica prometió, en campaña, que si el Parlamento aprobaba una ley que despenalizara
  o legalizara el aborto, su gobierno no la iba a vetar. El Parlamento aprobó la Ley Nº 18.987
  (interrupción voluntaria del embarazo) y, según la ficha de trámite del Parlamento, el Poder
  Ejecutivo la promulgó el 22-10-2012 sin observaciones (el registro de sanciones dice "Poder
  Ejecutivo promulga.", sin veto total ni parcial). El barrido de vetos de esta misma corrida
  (vetos.yaml) no encontró ningún veto de Mujica en todo el mandato, incluida esta ley. La promesa
  se cumplió tal como fue formulada.
