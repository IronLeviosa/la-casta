politico: astori
tema: economia/impuestos
texto: Si el Frente Amplio ganaba un tercer gobierno consecutivo, se buscaría disminuir la carga
  tributaria media de la población, con la salvedad de que quienes tienen mayor capacidad de pago
  pagarían más y quienes tienen menor capacidad pagarían menos.
fecha_promesa: 2014-05-24
origen:
  nivel: reportado
  fuentes:
    - url: https://www.elobservador.com.uy/nota/-no-habra-un-ajuste-fiscal-y-se-reducira-la-carga-tributaria-media--201452419460
      medio: el-observador
      fecha: 2014-05-24
      tipo: nota
      titulo: '"No habrá un ajuste fiscal" y "se reducirá la carga tributaria media"'
      cita: Respecto a la otra hoja del tema fiscal que son los ingresos y el sistema tributario nuestro
        objetivo es exactamente el inverso, es ir disminuyendo la carga tributaria. Estoy hablando
        en términos generales porque hay quienes deben pagar más porque tienen mayor capacidad y
        quienes tienen que pagar menos porque tienen menor capacidad. Nosotros queremos disminuir la
        carga tributaria media que tiene la población beneficiando especialmente a los que más lo
        necesitan.
      retrieved_at: 2026-09-15
fundamentacion: >-
  Astori prometió disminuir la carga tributaria media de la población, aclarando que quienes tienen
  mayor capacidad de pago pagarían más y quienes tienen menor capacidad pagarían menos.


  No se encontró, dentro de esta investigación, una serie oficial de presión tributaria sobre el PIB
  u otra medida agregada para comparar 2014 contra 2019-2020. La única acción impositiva documentada
  en el período, la suba de IRPF e IASS de 2016, recayó sobre los tramos de ingresos más altos, lo
  que es consistente con la propia salvedad de la promesa y no prueba por sí sola un aumento de la
  carga media.


  No se encontró evidencia de una baja efectiva de la carga tributaria media en el período. Ante la
  ausencia de una medida oficial que muestre esa baja, y con el mandato ya terminado, se la califica
  como incumplida; una serie de presión tributaria del MEF o de recaudación de la DGI sobre el PIB
  permitiría confirmarlo con más precisión.
estado: incumplida
