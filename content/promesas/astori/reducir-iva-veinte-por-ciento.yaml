          medio: bcu
          fecha: 2006-12-27
          tipo: documento_oficial
          titulo: Texto Ordenado 1996, Título 10 (IVA), artículo 16 - Tasas
          cita: El Poder Ejecutivo reducirá gradualmente la tasa básica del tributo hasta alcanzar el 20%
            (veinte por ciento) cuando los resultados de la aplicación de la presente ley aseguren
            el cumplimiento de los compromisos presupuestales asumidos en relación al resultado
            fiscal.
          retrieved_at: 2026-09-15
estado: incumplida
fundamentacion: "La promesa era condicional: la Ley 18.083 ató la baja a 20% a que los resultados de
  la reforma aseguraran el cumplimiento de los compromisos presupuestales. No hay una evaluación
  oficial disponible sobre si esa condición llegó a cumplirse en algún momento entre 2007 y 2026. Lo
  que sí está confirmado es el hecho simple: en ningún gobierno posterior -incluidos los de Astori
  como ministro hasta 2019- el Poder Ejecutivo bajó la tasa al 20%, y el Texto Ordenado vigente la
  sigue fijando en 22%. Se clasifica como incumplida por el resultado (la baja nunca se aplicó), no
  por una determinación sobre si la condición se cumplió o no."
