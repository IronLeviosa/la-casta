politico: astori
tema: economia/impuestos
texto: Si el Frente Amplio ganaba un tercer gobierno consecutivo, no iba a haber un ajuste fiscal,
  entendido como una contención generalizada del gasto público y una carga impositiva creciente.
fecha_promesa: 2014-05-24
origen:
  nivel: reportado
  fuentes:
    - url: https://www.elobservador.com.uy/nota/-no-habra-un-ajuste-fiscal-y-se-reducira-la-carga-tributaria-media--201452419460
      medio: el-observador
      fecha: 2014-05-24
      tipo: nota
      titulo: '"No habrá un ajuste fiscal" y "se reducirá la carga tributaria media"'
      cita: Si ese es el concepto de ajuste fiscal niego enfáticamente que vaya a haber ajuste fiscal. ¡No
        va a haber ajuste fiscal en el país, no va a haber ajuste fiscal! No va a haber ajuste
        porque la situación fiscal es sostenible. Esto no quiere decir que no haya que tener cautela
        con el gasto y sin duda que la vamos a tener porque el orden y la estabilidad macroeconómica
        lo requiere. Lo hemos tenido en cuenta hasta ahora y lo vamos a seguir teniendo en cuenta en
        el futuro.
      retrieved_at: 2026-09-15
fundamentacion: >-
  Astori definió «ajuste fiscal» como una contención generalizada del gasto público y una carga
  impositiva creciente, y dijo que ese ajuste no iba a ocurrir.


  El paquete de la Rendición de Cuentas de 2016 subió el IRPF y el IASS para los tramos de ingresos
  más altos. Interpelado en el Senado, el propio Astori llamó a ese paquete «corrección fiscal» y
  «ajuste», y reconoció: «el anuncio no se cumplió».
