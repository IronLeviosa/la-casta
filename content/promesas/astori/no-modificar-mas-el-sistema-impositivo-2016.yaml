estado: cumplida
fundamentacion: >-
  Entre agosto de 2016 y junio de 2019 -el resto de su mandato como ministro- Astori reafirmó cinco
  veces, en contextos distintos (radio, rueda de prensa, un comité de base del Frente Amplio, un
  semanario y un foro empresarial), que no se iba a volver a subir la carga tributaria ni a
  modificar el sistema impositivo. No hay, entre esas cinco reafirmaciones, ninguna declaración ni
  acción de gobierno en sentido contrario.


  No se revisó de forma exhaustiva cada ley de Rendición de Cuentas ni cada decreto tributario de
  2016 a 2020; la evidencia a favor es mayormente declarativa (la propia palabra de Astori
  reafirmada varias veces) y no un repaso documento por documento de que ninguna norma tributaria
  haya subido impuestos en el período. Con la evidencia disponible, y sin ningún caso en contra pese
  a que el tema se buscó en profundidad para todo 2016-2019, se clasifica como cumplida.
revision:
  tier: probable
  notas_internas: >-
    Origen movido de la cronica a la version taquigrafica (nivel textual). Estado cambiado de la
    lectura original: se encontraron 5 reafirmaciones a favor entre 2016 y 2019 sin ningun hallazgo
    en contra en ese tramo, por lo que se paso de un unico dato a_favor debil (un trascendido) a
    cumplida; queda documentado que no se reviso cada norma tributaria del periodo por falta de
    herramientas de busqueda documental en el rol de editor.


    Baja a probable (2026-09-16, corrector de citas): las 4 evidencias en nivel reportado
    (2017-02-21 caras-y-caretas, grupo editora-caras-y-caretas; 2017-03-23 el-observador, grupo
    werthein-hochbaum; 2018-05-24 el-pais, grupo scheck-aguirre; 2019-05-30 el-pais, grupo
    scheck-aguirre) tienen una sola fuente y un solo grupo de medios cada una. Se buscaron segundas
    fuentes de otro grupo para cada evento (corpus:buscar y web) y no aparecio cobertura verificable
    de la misma declaracion en esa fecha: los hallazgos eran declaraciones distintas en fechas
    distintas (p. ej. Subrayado 2018-05-28 tras Consejo de Ministros, Presidencia 2018-08-28 tras
    comparecencia en Comision de Hacienda) que no corroboran el mismo hecho y no se usaron como
    cita. Falta esa segunda fuente en cada evidencia para volver a publicado; queda para el
    resolvedor.
