            tarjetas de débito y crédito, que redundarán en una recaudación de unos US$ 40 millones.
            Los uruguayos que abonan con tarjeta de débito hoy pagan 18% de IVA, pero pasarán a
            pagar 20% por ese impuesto. Para las tarjetas de crédito en restaurantes existe una
