politico: lacalle-pou
tema: economia/impuestos
texto: No aumentar los impuestos si es electo presidente. Es el componente tributario de la promesa
  compuesta del 30 de marzo de 2019 ("Si gana el Partido Nacional se terminó el aumento de
  impuestos, las tarifas y los combustibles"); los componentes de tarifas públicas y de combustibles
  se califican por separado (promesas no-aumentar-tarifas-publicas y no-aumentar-combustibles).
fecha_promesa: 2019-03-30
