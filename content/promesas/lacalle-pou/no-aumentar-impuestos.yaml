      titulo: "Promesas de campaña: lo que decía Lacalle y cómo argumenta que no las incumple"
      cita: Si gana el Partido Nacional se terminó el aumento de tarifas, impuestos y combustibles
      retrieved_at: 2026-09-04
estado: incumplida
fundamentacion: 'El mandato terminó el 1 de marzo de 2025, así que solo caben cumplida o incumplida.
  La promesa se formuló en términos absolutos ("se terminó el aumento de impuestos. Se terminó") y
  en el quinquenio hubo dos hechos que la contradicen en su letra: (1) a once días de asumir se
  redujo a la mitad la exoneración de IVA por pago con tarjeta (débito: de 18% a 20% de IVA
  efectivo; crédito en restaurantes: de 9 a 5 puntos de exoneración), con una recaudación adicional
  estimada por el propio gobierno en US$ 40 millones; la tasa legal del IVA no se tocó, y el
  gobierno lo defendió como recorte de un beneficio, no como suba de un impuesto; (2) la ley 19.874
  (promulgada el 8 de abril de 2020) creó el "Impuesto Emergencia Sanitaria COVID-19" y un adicional
  al IASS, sobre remuneraciones y pasividades del sector público superiores a $120.000 (incluidos
  los cargos políticos), limitados por el artículo 10 a los ingresos de abril y mayo de 2020; la
  prórroga de dos meses que la ley habilitaba no se usó y la recaudación fue de unos US$ 8 millones
  según la ministra Arbeleche. En el otro platillo hay actos de gobierno de peso: la ley 20.124
  (marzo de 2023) rebajó el IRPF y el IASS con una renuncia fiscal anunciada de US$ 150 millones y
  unos 80.000 contribuyentes que dejarían de pagar, y el decreto 65/023 bajó la carga del régimen
  ficto de IRAE para pequeñas empresas; no se creó ningún tributo permanente ni se subió ninguna
  tasa general. El saldo neto del quinquenio sobre el contribuyente privado es plausiblemente de
  menos impuestos, no de más; pero la promesa no fue "bajar la carga neta" sino que no habría más
  aumentos, y hubo dos, uno de ellos permanente. Por eso el estado es incumplida, con las rebajas de
  2023 y la transitoriedad del tributo covid publicadas en el mismo bloque. Las autoevaluaciones del
  propio gobierno (2021: "ahorramos sin poner impuestos"; 2025, Arbeleche: "sin aumentar la carga
  tributaria") se registran como neutrales: no prueban cumplimiento. El dato que cerraría la
  discusión sin depender de titulares es la presión fiscal (recaudación DGI / PIB) 2019 contra 2024,
  que no está en este lote.'
revision:
  tier: publicado
  notas_internas: "Se retiró la evidencia del 2025-02-13 (balance de Arbeleche, Infobae, fuente única,
    tipo mal declarado como dato_oficial): es una autoevaluación de un tercero sin segunda fuente.
    Pendiente para una corrida futura: presión fiscal DGI/PIB 2019 vs 2024; decreto de la
    exoneración de IVA (IMPO) y recaudación DGI; verificar si el impuesto mínimo complementario
    (Pilar 2 OCDE) se creó en este período (ver
    hipotesis/lacalle-pou/impuesto-minimo-global-origen.yaml)."
evidencias:
  - fecha: 2020-03-11
    tipo: accion_de_gobierno
    efecto: en_contra
    descripcion: "A once días de asumir, el gobierno anunció la reducción a la mitad de la exoneración
      de IVA en compras con tarjeta de débito y crédito creada por la ley de inclusión financiera:
      con débito se pasa de pagar 18% a 20% de IVA; en crédito en restaurantes la exoneración baja
      de 9 a 5 puntos; recaudación adicional estimada de US$ 40 millones. Lectura en contra: el
      contribuyente paga más IVA por la misma compra y el Estado recauda más, por decisión
      discrecional de política tributaria. Lectura a favor: la tasa legal del IVA (22%) no cambió;
      se recortó un beneficio, no se creó ni subió un tributo. La oposición lo calificó de
      incumplimiento; Lacalle Pou lo atribuyó al déficit heredado. El ajuste de tarifas públicas
      anunciado el mismo día se computa en la promesa no-aumentar-tarifas-publicas."
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://www.elobservador.com.uy/nota/promesas-de-lacalle-lo-que-decia-y-como-argumenta-que-no-las-incumple-202031120430
