  - fecha: 2023-03-02
    tipo: accion_de_gobierno
    efecto: a_favor
    descripcion: Anunció ante la Asamblea General, y envió al Parlamento, un proyecto de rebaja del IRPF
      (aumento de las deducciones para los contribuyentes de menores ingresos, de 10% a 14%) y del
      IASS, que según el gobierno alcanzaría al 75% de los contribuyentes de IRPF (63 mil dejarían
      de pagarlo) y a 20 mil pasivos que dejarían de pagar IASS, con una renuncia fiscal estimada de
      US$150 millones. Es el anuncio del proyecto; la ley sancionada es la evidencia siguiente.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.gub.uy/presidencia/comunicacion/noticias/lacalle-pou-80000-uruguayos-dejaran-pagar-irpf-iass
          medio: presidencia
          fecha: 2023-03-02
          tipo: documento_oficial
          titulo: "Lacalle Pou: Unos 80.000 uruguayos dejarán de pagar IRPF e IASS"
          cita: Estamos en condiciones de proceder a una baja de impuestos para quienes hacen los mayores
            esfuerzos
          retrieved_at: 2026-09-04
  - fecha: 2023-03-02
    tipo: decreto
    efecto: a_favor
    descripcion: El Poder Ejecutivo firmó el Decreto 65/023, que modificó el régimen de estimación ficta
      del IRAE (aplicable a pequeñas empresas que combinan capital y trabajo) introduciendo una
      escala progresional de tasas -12% para el primer tramo de ingresos, en lugar de una tasa única
      más alta- "a los efectos de dotarlo de mayor progresionalidad", para ejercicios iniciados a
      partir del 1° de enero de 2023. Es el acto de gobierno concreto detrás de los "beneficios para
      micro y pequeñas empresas" anunciados el mismo día y de la baja de impuestos a pymes que
      Lacalle Pou reivindicó en junio de 2024 (ver declaraciones.yaml, 2024-06-21). El Decreto
      71/023 (8/3/2023) introdujo un ajuste adicional a la misma escala.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/decretos-originales/65-2023
          medio: impo
          fecha: 2023-03-02
          tipo: documento_oficial
          titulo: Decreto N° 65/023 - Modifícanse los Decretos 150/007 y 419/022 (régimen de estimación ficta
            del IRAE)
          cita: "CONSIDERANDO: I) que es conveniente realizar ajustes en el régimen de estimación ficta en el
            IRAE, correspondiente a las rentas obtenidas por combinación de capital y trabajo, a los
            efectos de dotarlo de mayor progresionalidad"
          retrieved_at: 2026-09-04
  - fecha: 2023-03-24
    tipo: ley
    efecto: a_favor
    descripcion: El Poder Ejecutivo promulgó la Ley 20.124, que sustituyó el artículo 38 del Título 7
      (deducciones del IRPF) y el artículo 8° de la Ley 18.314 (tasas del IASS), estableciendo una
      escala progresional para el IASS que exonera del tributo los ingresos anuales por jubilaciones
      y pensiones de hasta 108 BPC. Es la norma legal, ya sancionada y con firma de Lacalle Pou, que
      dio forma jurídica al anuncio del 2 de marzo de 2023.
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes-originales/20124-2023
          medio: impo
          fecha: 2023-03-24
          tipo: documento_oficial
          titulo: Ley N° 20.124 - Modifícanse el Impuesto a la Renta de las Personas Físicas y el Impuesto de
            Asistencia a la Seguridad Social
          cita: ARTÍCULO 8°. (Tasas progresionales).- Las alícuotas del tributo se aplicarán de forma
            progresional. A tal fin el total de ingresos gravados se incluirá en la escala a que
            refiere este artículo, aplicándose a la porción de ingreso en cada tramo la tasa que
            corresponda
          retrieved_at: 2026-09-04
