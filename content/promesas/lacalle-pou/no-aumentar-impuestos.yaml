  - fecha: 2020-04-08
    tipo: ley
    efecto: en_contra
    descripcion: 'La ley 19.874, promulgada el 8 de abril de 2020, creó el Fondo Solidario COVID-19 y,
      para financiarlo, el "Impuesto Emergencia Sanitaria COVID-19" (artículo 3) sobre las
      remuneraciones nominales por servicios personales prestados al Estado superiores a $120.000,
      con tasas de 5% a 20%, más un adicional al IASS sobre pasividades (artículo 7). El artículo 10
      limitó los tributos a los ingresos de abril y mayo de 2020 y autorizó una prórroga máxima de
      dos meses. Lectura en contra: es un tributo nuevo, con la palabra "impuesto" en su nombre
      legal, creado por iniciativa del Poder Ejecutivo durante su gobierno. Lectura a favor:
      transitorio por ley, acotado a sueldos y pasividades públicas altas (incluidos los cargos
      políticos y el propio presidente), ante una emergencia sanitaria imprevisible; el marco
      declarado de la promesa era no "meterle la mano en el bolsillo a los uruguayos".'
    evidencia:
      nivel: textual
      fuentes:
        - url: https://www.impo.com.uy/bases/leyes/19874-2020
          medio: impo
          fecha: 2020-04-08
          tipo: documento_oficial
          titulo: Ley N° 19.874 - Creación del Fondo Solidario COVID-19
          cita: Créase un impuesto, de carácter mensual, denominado "Impuesto Emergencia Sanitaria COVID-19",
            que gravará, en su totalidad, las remuneraciones y prestaciones nominales, en efectivo o
            en especie, derivadas de servicios personales prestados al Estado, Gobiernos
            Departamentales, Entes Autónomos y Servicios Descentralizados
          retrieved_at: 2026-09-04
        - url: https://www.impo.com.uy/bases/leyes/19874-2020
          medio: impo
          fecha: 2020-04-08
          tipo: documento_oficial
          titulo: Ley N° 19.874 - Creación del Fondo Solidario COVID-19
          cita: Los tributos establecidos en la presente ley se aplicarán a los ingresos devengados
            correspondientes a los meses de abril y mayo de 2020. Autorízase al Poder Ejecutivo a
            prorrogar su aplicación hasta por un período máximo de dos meses, dando cuenta a la
            Asamblea General.
          retrieved_at: 2026-09-04
        - url: https://www.montevideo.com.uy/Noticias/Lacalle-confirmo-que-deja-de-cobrarse-el-impuesto-coronavirus-a-funcionarios-publicos-uc755946
          medio: montevideo-portal
          fecha: 2020-06-17
          tipo: nota
          titulo: Lacalle confirmó que deja de cobrarse el "impuesto coronavirus" a funcionarios públicos
          cita: La ley 19.874, promulgada en abril, creó el "Fondo Solidario COVID-19", cuyos recursos son
            destinados al tratamiento de la emergencia sanitaria. Por esta ley se creó el denominado
            "Impuesto Emergencia Sanitaria COVID-19", que grava las remuneraciones y prestaciones
            nominales del personal del Estado mayores a 120.000 pesos.
          retrieved_at: 2026-09-04
  - fecha: 2020-06-17
    tipo: accion_de_gobierno
    efecto: a_favor
    descripcion: El gobierno, a través de la ministra de Economía y Finanzas, Azucena Arbeleche,
      confirmó que no extendería la aplicación del "Impuesto Emergencia Sanitaria COVID-19" ni del
      adicional al IASS más allá de junio de 2020, pese a que la ley habilitaba prorrogarlos hasta
      dos meses más; Arbeleche informó una recaudación de ocho millones de dólares. Por separado,
      Montevideo Portal reportó, citando en condicional al dirigente de Cofe Joselo López, que
      Lacalle Pou le había confirmado la decisión por mensaje privado; esa versión no es una
      declaración pública del político y no se registra como tal.
    evidencia:
      nivel: reportado
      fuentes:
        - url: https://ladiaria.com.uy/coronavirus/articulo/2020/6/gobierno-deja-de-cobrar-el-tributo-covid-19-a-los-funcionarios-publicos-y-cargos-politicos-con-sueldos-mas-altos/
          medio: la-diaria
          fecha: 2020-06-18
          tipo: nota
          titulo: Gobierno deja de cobrar el "tributo covid-19" a los funcionarios públicos y cargos políticos
            con sueldos más altos
          cita: La ministra de Economía y Finanzas, Azucena Arbeleche, anunció este miércoles, tras reunirse
            con el presidente Luis Lacalle Pou, que no se extenderá la aplicación del impuesto a los
            sueldos y jubilaciones más altas del sector público y a los cargos políticos, que sirvió
            para financiar el Fondo Coronavirus. Junio será el último mes en que se recaude el
            denominado "tributo covid-19".
          retrieved_at: 2026-09-04
        - url: https://www.montevideo.com.uy/Noticias/Lacalle-confirmo-que-deja-de-cobrarse-el-impuesto-coronavirus-a-funcionarios-publicos-uc755946
          medio: montevideo-portal
          fecha: 2020-06-17
          tipo: nota
          titulo: Lacalle confirmó que deja de cobrarse el "impuesto coronavirus" a funcionarios públicos
          cita: Así lo habría confirmado el presidente de la República, Luis Lacalle Pou, al secretario
            general de la Confederación de Organizaciones de Funcionarios del Estado (Cofe), Joselo
            López.
          retrieved_at: 2026-09-04
