revision:
  tier: probable
  que_falta: Falta la serie oficial completa de precios de venta al público (Ursea, Ancap, decretos en
    IMPO) entre 2020 y 2025 para cuantificar con precisión cuánto subió cada combustible en cada
    ajuste, y una segunda fuente de otro grupo de medios para diez de las diecinueve evidencias; el
    incumplimiento en sí ya está documentado con aumentos concretos y con reconocimientos del propio
    promitente.
  notas_internas: "Promesa creada por el editor al partir la promesa compuesta del 30/03/2019; se
    retiró la evidencia de UTE/OSE/Antel (01/04/2020), que era de tarifas y no de combustibles, y
    con ella el doble conteo [0]/[1] señalado por la crítica. Corrección
    2026-09-06-promesa-combustibles-evidencia-aumentos: no había ni un solo aumento de precio real
    documentado con montos pese a que la fundamentación ya decía que los hubo; se agregaron seis
    evidencias en_contra (2021-06-07, 2021-06-30, 2021-07-31, 2022-03-30, 2024-02-29, 2025-01-30) y,
    para no introducir la asimetría inversa, cuatro evidencias a_favor que estaban verificadas pero
    no incorporadas (2021-04-12, 2021-05-07, 2024-11-29, 2025-02-28), que además cierran el salto
    que había entre 2023-06 y 2024-09 y extienden la cobertura hasta el último decreto de precios
    del mandato. De las diez nuevas, cuatro (2022-03-30, 2024-02-29, 2024-11-29, 2025-01-30)
    quedaron con dos fuentes de distinto grupo o con nivel `textual` sobre un documento oficial; las
    otras seis (2021-04-12, 2021-05-07, 2021-06-07, 2021-06-30, 2021-07-31, 2025-02-28) quedaron con
    una sola fuente porque no se encontró, en el material disponible en esta sesión, una segunda
    nota que cubriera la misma afirmación desde otro grupo de medios: heredan la misma debilidad que
    ya tenían cinco evidencias previas (2020-03-11, 2021-11-16, 2023-01-31, 2023-06-01, 2024-09-30).
    En total, diez de las diecinueve evidencias tienen fuente única. El otro hueco que mantiene el
    registro en `probable` es la falta de una serie oficial completa de precios de venta al público
    (URSEA, ANCAP, decretos en IMPO) para 2020-2025, que permitiría cuantificar cada suba con una
    sola fuente metodológica en vez de depender de qué medio cubrió qué mes."
