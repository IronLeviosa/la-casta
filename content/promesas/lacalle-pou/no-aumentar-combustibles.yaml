estado: incumplida
fundamentacion: 'El mandato terminó el 1 de marzo de 2025. La promesa fue absoluta ("se terminó el
  aumento de... los combustibles") y el propio Lacalle Pou reconoció el 3 de marzo de 2022 que "es
  cierto" que no se pudo cumplir, atribuyéndolo a la pandemia y a la guerra en Ucrania; el 28 de
  mayo de 2022 anunció que "la espalda de Ancap se terminó" y que habría que aumentar lo que se
  debía aumentar. Del lado del cumplimiento: en marzo de 2020 los combustibles no subieron cuando sí
  subieron las demás tarifas; en noviembre de 2021 el precio se mantuvo pese a la duplicación del
  refinado, absorbido con ganancias de ANCAP; en mayo de 2022 los precios estaban $10,75 (gasoil) y
  $6,41 (nafta) por litro por debajo de la paridad de importación, es decir que las subas se
  contuvieron por debajo de la referencia; en febrero de 2023 se mantuvo el precio pese a la
  recomendación de suba de URSEA, en junio de 2023 se aplicó una rebaja y en octubre de 2024 otra.
  El balance es que hubo aumentos reales, reconocidos por el promitente, y también contención y
  rebajas: la promesa de que no habría aumentos no se cumplió, aunque el traslado de la referencia
  internacional fue parcial. Lo que falta, y por eso el registro queda en tier probable, es la serie
  oficial de precios de venta al público (ANCAP, URSEA, decretos en IMPO) entre marzo de 2020 y
  marzo de 2025 para cuantificar cuánto subieron; el estado no depende de ese dato, la magnitud sí.
  Las declaraciones de voluntad del propio gobierno ("compromiso de tener los combustibles lo más
  baratos posible") se registran como neutrales.'
revision:
  tier: probable
  notas_internas: "Promesa creada por el editor al partir la promesa compuesta del 30/03/2019; se
    retiró la evidencia de UTE/OSE/Antel (01/04/2020), que era de tarifas y no de combustibles, y
    con ella el doble conteo [0]/[1] señalado por la crítica. Tier probable por: cinco evidencias
    con fuente única (2020-03-11, 2021-11-16, 2023-01-31, 2023-06-01, 2024-09-30) y falta de la
    serie oficial de precios 2020-2025 (URSEA, ANCAP, decretos en IMPO). Con esa serie la promesa se
    cuantifica sin depender de qué medio cubrió qué mes."
