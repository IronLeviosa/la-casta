      de UTE, OSE y Antel pero mantuvo sin cambios los precios de los combustibles de Ancap, en un
      contexto de caída del precio internacional del petróleo, y anticipó una "adecuación" futura
      menor a la planificada. Las subas de UTE, OSE y Antel se computan en la promesa
      no-aumentar-tarifas-publicas, no acá.
