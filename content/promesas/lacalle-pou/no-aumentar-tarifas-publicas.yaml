politico: lacalle-pou
tema: economia/tarifas-publicas
texto: No aumentar las tarifas públicas si es electo presidente. Es el componente de tarifas de la
  promesa compuesta del 30 de marzo de 2019 ("Si gana el Partido Nacional se terminó el aumento de
  impuestos, las tarifas y los combustibles"); los componentes de impuestos y de combustibles se
  califican por separado (promesas no-aumentar-impuestos y no-aumentar-combustibles).
