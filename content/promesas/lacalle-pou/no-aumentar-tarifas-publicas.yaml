estado: incumplida
fundamentacion: 'El mandato terminó el 1 de marzo de 2025. La promesa dijo que "se terminó el
  aumento de las tarifas", sin condicionarlo a los costos de las empresas públicas. A once días de
  asumir, el 11 de marzo de 2020, el gobierno anunció subas de UTE (10,5%), OSE (10,7%) y Antel
  (9,78%) vigentes desde el 1° de abril de 2020. La defensa del gobierno está documentada y se
  publica completa: Lacalle Pou sostuvo que era una "adecuación" por debajo de los costos, motivada
  por la omisión del gobierno anterior de ajustar en enero de 2020, y ya en diciembre de 2019, antes
  de asumir, había fijado el criterio de que "acompañar los costos no es un aumento de tarifas para
  recaudar". Esa defensa explica el porqué del ajuste, pero no cancela el hecho de que hubo un
  aumento de tarifas de alrededor del 10% en el primer mes de gobierno, que es lo que la promesa
  excluía. Nadie verificó con los estados contables de UTE, OSE y Antel si el ajuste quedó
  efectivamente por debajo de la evolución de costos; ese dato distinguiría "adecuación" de "aumento
  para recaudar", pero no cambia el estado de una promesa formulada sin esa condición. El lote no
  documenta la trayectoria tarifaria 2021-2025; el estado se apoya en el ajuste de abril de 2020.'
revision:
  tier: publicado
  notas_internas: 'Promesa creada por el editor al partir la promesa compuesta del 30/03/2019
    (objeción promesas[0] de la crítica de impuestos y de combustibles). Tema
    economia/tarifas-publicas, creado por el editor en esta corrida para que los tres componentes de
    la promesa cuelguen del mismo padre (economia). Pendiente: serie de tarifas 2020-2025 (URSEA,
    URSEC, decretos en IMPO) y costos de UTE/OSE/Antel para verificar la tesis de "adecuación por
    debajo de costos".'
