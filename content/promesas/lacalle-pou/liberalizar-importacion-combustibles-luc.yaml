      medio: en-perspectiva
      fecha: 2019-09-04
      tipo: nota
      titulo: Si Lacalle Pou llega al Gobierno, libre importación de combustibles se aprobará en 90 días,
        reglamentada en forma paulatina «para que Ancap se prepare para la competencia»
      cita: La liberalización de la importación de combustible estará en la Ley de Urgente consideración,
        y esta estaría aprobada en 90 días. El Poder Ejecutivo determinará una reglamentación
        paulatina para que Ancap se prepare para la competencia.
      retrieved_at: 2026-09-04
estado: incumplida
fundamentacion: "La promesa tenía dos partes: contenido (liberalizar la importación de combustibles
  por la Ley de Urgente Consideración) y plazo (90 días). El contenido no se cumplió: el proyecto de
  LUC presentado en enero de 2020 proponía derogar el monopolio de ANCAP para importar, exportar y
  refinar, pero ese artículo fue retirado en mayo de 2020 antes de la votación por falta de acuerdo
  en la coalición (Cabildo Abierto y parte del Partido Colorado se opusieron), y la ley 19.889
  promulgada el 9 de julio de 2020 no derogó el monopolio: sus artículos 235 a 237 instauraron la
  fijación de precios por el Poder Ejecutivo con informe preceptivo de URSEA y precio de paridad de
  importación. Con el mandato terminado el 1 de marzo de 2025 sin liberalización general de la
  importación, el desenlace no está en disputa. La única liberalización aprobada fue la de
  combustible para buques en puertos, en octubre de 2020 y por la ley de Presupuesto, no por la LUC:
  un alcance distinto y marginal respecto de lo prometido, que se registra como neutral. Sobre el
  plazo, la LUC se promulgó unos 130 días después de la asunción, con la emergencia sanitaria
  decretada el 13 de marzo de 2020 en el medio; el cronograma real del proyecto está en el Diario de
  Sesiones y no se verificó, pero el incumplimiento del contenido hace irrelevante el del plazo."
revision:
  tier: probable
  notas_internas: "Tier probable porque el origen tiene una sola fuente (En Perspectiva, grupo
    lecueder-cotelo) y dos evidencias tienen fuente única. El desenlace está resuelto con documento
    oficial (ley 19.889 en IMPO). Pendiente: transcripción o audio del coloquio de En Perspectiva
    (04/09/2019) para el origen; ficha del proyecto y Diario de Sesiones para el cronograma del
    plazo de 90 días."
