politico: lacalle-pou
tema: economia/combustibles
texto: La liberalización de la importación de combustible estará en la Ley de Urgente consideración,
  y esta estaría aprobada en 90 días. El Poder Ejecutivo determinará una reglamentación paulatina
  para que Ancap se prepare para la competencia.
fecha_promesa: 2019-09-04
