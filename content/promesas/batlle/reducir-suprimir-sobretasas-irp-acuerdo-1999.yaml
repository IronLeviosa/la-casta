politico: batlle
tema: economia/impuestos
texto: Reducir hasta suprimir las sobretasas (el adicional) del Impuesto a las Retribuciones
  Personales (IRP), compromiso del acuerdo programático entre el Partido Colorado y el Partido
  Nacional de noviembre de 1999 que respaldó la candidatura de Batlle en el balotaje.
fecha_promesa: 1999-11-10
origen:
  nivel: reportado
  fuentes:
    - url: https://www.elobservador.com.uy/nota/analogias-de-una-coalicion-20-anos-despues-20191135019
      medio: el-observador
      fecha: 2019-11-03
      tipo: nota
      titulo: Analogías de una coalición, 20 años después
      cita: reducción hasta la supresión de las sobretasas del Impuesto a las Retribuciones Personales
      retrieved_at: 2026-09-16
estado: incumplida
fundamentacion: >-
  Incumplida, con una reducción parcial al final del mandato. El adicional del Impuesto a las
  Retribuciones Personales que la promesa comprometía reducir no bajó durante la mayor parte del
  gobierno: la Ley 17.453 (28/2/2002) lo creó y la Ley 17.502 (29/5/2002) lo reformuló en una nueva
  escala del mismo impuesto, sin suprimirlo.


  Recién en abril de 2004, a menos de un año de terminar el mandato, el Poder Ejecutivo anunció la
  eliminación total del adicional para ingresos de hasta 15 salarios mínimos nacionales y una rebaja
  de tres puntos porcentuales por encima de ese nivel. Para los ingresos más altos eso es una
  reducción, no la supresión completa que prometía el acuerdo de 1999.


  La reducción llegó al final del mandato y no alcanzó a todos los contribuyentes con el adicional.
