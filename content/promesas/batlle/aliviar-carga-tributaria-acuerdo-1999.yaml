politico: batlle
tema: economia/impuestos
texto: Aliviar la carga tributaria generando ahorros en el gasto estatal, compromiso del acuerdo
  programático entre el Partido Colorado y el Partido Nacional de noviembre de 1999 que respaldó la
  candidatura de Batlle en el balotaje.
