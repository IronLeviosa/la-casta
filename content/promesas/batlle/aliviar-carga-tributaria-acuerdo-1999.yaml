estado: incumplida
fundamentacion: >-
  Incumplida. Durante la mayor parte del gobierno de Batlle la carga tributaria no bajó: la crisis
  financiera regional de 2002 llevó a dos ajustes fiscales sucesivos que subieron impuestos
  existentes en vez de aliviarlos.


  La Ley 17.453 (28/2/2002) creó un adicional al Impuesto a las Retribuciones y Prestaciones, y la
  Ley 17.502 (29/5/2002) llevó al 35% las tasas del Impuesto a las Rentas de la Industria y Comercio
  y del Impuesto a las Rentas Agropecuarias, subió el IVA a los honorarios de salud y fijó una nueva
  escala para ese adicional.


  En abril de 2004, a menos de un año de dejar el gobierno, el Poder Ejecutivo redujo esos mismos
  adicionales. Durante todo el mandato no se creó el Impuesto a la Renta de las Personas Físicas,
  que sí impulsó el gobierno siguiente en diciembre de 2006.


  El alivio de 2004 y la no creación del IRPF pesan menos que las dos subas de impuestos de 2002,
  que rigieron durante más tiempo y sobre una base de contribuyentes más amplia.
