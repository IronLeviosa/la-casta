revision:
  tier: publicado
  notas_internas: "Decisión de umbral, expuesta por el crítico: la cifra que publicó El País sí figura
    en un documento primario (los estados de 2020 tal como se emitieron), y lo que la contradice es
    un documento primario posterior del mismo emisor (Nota 30.2 de los estados de 2021, que
    reexpresa el ejercicio en aplicación de la NIC 8). Se publica con el mismo criterio que la
    corrección del chequeo de Orsi en esta misma corrida: una reexpresión posterior del mismo emisor
    es la fuente primaria vigente del hecho, y el documento superado deja de serlo. La reexpresión
    estaba pública desde 2022, casi tres años antes de la nota de El País (abril de 2025)."
