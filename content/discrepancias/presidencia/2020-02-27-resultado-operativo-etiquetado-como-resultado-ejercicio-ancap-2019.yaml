evidencia:
  nivel: inferencia
  cadena:
    - La nota de Presidencia del 27/02/2020 publica, bajo la etiqueta "resultado operativo", "27
      millones de dólares" para 2015, "15 millones" para 2016, "39 millones" para 2017 y "88
      millones" para 2018 (fuente 1 de evidencia).
    - Los estados financieros individuales de Ancap 2019 reportan Resultado operativo 4.043.681.908
      (2019) y 5.294.854.562 (2018), y Resultado del ejercicio 1.464.281.136 (2019) y 2.854.322.969
      (2018), en pesos (fuentes de fuente_primaria).
    - "El mismo documento publica los tipos de cambio del dólar: promedio 35,15 (2019) y 30,67
      (2018); cierre 37,31 (2019) y 32,41 (2018) (fuente de fuente_primaria)."
    - "Dividiendo cada línea por el tipo de cambio de cierre del año correspondiente: el resultado
      del ejercicio da 39,2 (2019) y 88,1 (2018), que son las cifras publicadas; el resultado
      operativo da 108,4 (2019) y 163,4 (2018), que no lo son."
    - "Los estados financieros individuales de 2016 y 2017 reportan Resultado del ejercicio
      435.536.149 (2016) y 1.124.635.133 (2017), y tipos de cambio de cierre de 29,34 (2016) y 28,81
      (2017); divididos, dan 14,8 y 39,0 millones de dólares, que son las cifras que publica la nota
      para esos años. El resultado operativo de esos años fue (536.666.041) en 2016 (negativo) y
      2.059.659.016 en 2017 (equivalente a 71,5 millones de dólares): ninguno de los dos coincide
      con lo publicado."
    - Los estados financieros individuales de 2015 reportan Resultado operativo (3.223.398.507) y
      Resultado del ejercicio (5.944.013.417), los dos negativos al tipo de cambio de cierre de ese
      año (29,95); ninguna de las dos líneas coincide con "27 millones de dólares" publicados por la
      nota para 2015, ni en signo ni en magnitud.
