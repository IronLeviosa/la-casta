revision:
  tier: publicado
  notas_internas: "Corrección de tipo cambio_de_rating: se amplía el alcance del registro de 2018-2019
    a 2015-2019 con los estados financieros de esos años, que era la condición que mantenía este
    registro en `probable`. El patrón (resultado del ejercicio rotulado como resultado operativo) se
    confirma con documento oficial en 2016 y 2017, igual que en 2018 y 2019. 2015 es la excepción:
    ni el resultado operativo ni el resultado del ejercicio de los estados individuales coinciden
    con la cifra publicada por Presidencia para ese año, y el análisis lo deja explícito como una
    diferencia sin explicación verificada (no se consultaron los estados consolidados). Esto no
    debilita el hallazgo de 2016-2019, que queda documentado con el mismo rigor en las dos
    direcciones (aplica a una nota de Presidencia de un gobierno del Frente Amplio, con el mismo
    umbral que a cualquier otro caso de esta corrida)."
