analisis: "La nota nombra a José Bayardi como el ministro de Defensa Nacional al que Manini Ríos
  dice haber informado verbalmente sobre la confesión de Gavazzo. El diario de sesiones del Senado
  del 30 de setiembre de 2020, en el que la propia cámara trató el pedido de desafuero por ese
  hecho, registra dos veces que en el momento de los hechos (febrero y marzo de 2019, cuando el
  Poder Ejecutivo homologa los fallos de los tribunales de honor) el ministro de Defensa Nacional
  era Jorge Menéndez, y que su renuncia se produce en ese mismo tramo. Montevideo Portal
  (2025-07-21) publica el mismo hecho con el nombre de Menéndez. Qué cambia la diferencia: el nombre
  del superior jerárquico es el núcleo de la defensa de Manini Ríos (informar al ministro en lugar
  de denunciar ante la Justicia), y con el nombre cambiado el lector no puede verificar la
  cronología ni la renuncia de ese ministro, que es parte del mismo episodio. Se registra qué
  publicó el medio y qué dice el diario de sesiones, sin afirmar nada sobre por qué difieren."
