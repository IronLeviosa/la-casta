  cita: El valor de lista para la Santa Fe, el último modelo y más completo, es de US$ 78.990, pero
    Orsi —según su declaración jurada— la compró en US$ 54.000, de acuerdo con el informe divulgado
    esta semana por Así nos va (Radio Carve). De acuerdo con el documento que presentó, Orsi declaró
    que el vehículo vale $ 3.396.500.
