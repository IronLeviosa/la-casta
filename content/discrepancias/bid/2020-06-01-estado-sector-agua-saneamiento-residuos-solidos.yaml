analisis: >-
  La Nota Técnica del BID de 2020 presenta tres estadísticos de la muestra del estudio de Lentini
  (2015) —promedio 1,22 USD/m3, mínimo 0,39 USD/m3, máximo 2,06 USD/m3— y los atribuye a «los
  operadores analizados». El Cuadro 4 del propio estudio de Lentini, que es una publicación del
  mismo BID (con CAF y ADERASA), da para los operadores un promedio de US$ 1,40, un mínimo de US$
  0,17 y un máximo de US$ 2,35, sobre 57 operadores con dato de tarifa dentro de una muestra total
  de 66 operadores de 11 países.

  Dos de los tres valores que publica la nota de 2020 corresponden al nivel de país y no al de
  operador: el promedio simple de los once promedios por país del Cuadro 4 (0,39; 1,85; 1,73; 1,66;
  1,66; 0,69; 0,59; 1,71; 0,33; 0,74; 2,06) es 1,22, y 2,06 es el mayor de esos once promedios, el
  del único operador uruguayo. El tercer valor, 0,39 USD/m3, presentado como mínimo, es el promedio
  de los cuatro operadores argentinos y no es el mínimo en ninguno de los dos niveles: el mínimo por
  operador que da el Cuadro 4 es 0,17 USD/m3 y el menor promedio por país es el de Panamá, 0,33
  USD/m3. La figura II-7 de la nota, que es la que ilustra el pasaje, tiene once barras rotuladas
  con nombres de países.

  La diferencia cambia lo que el lector entiende por «la tarifa más cara de la región»: contra el
  promedio y el máximo de operadores que publica Lentini (1,40 y 2,35 USD/m3), el valor uruguayo de
  2,06 USD/m3 no es el máximo de la muestra de operadores: es el máximo entre los once promedios por
  país. El Cuadro 4 registra al menos un operador con una tarifa media mayor, en Colombia (2,35
  USD/m3). Este registro consigna qué publicó cada documento y no atribuye causa.
