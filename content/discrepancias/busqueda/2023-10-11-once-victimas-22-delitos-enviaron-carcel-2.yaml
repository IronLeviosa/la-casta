      retrieved_at: 2026-09-09
analisis: "La nota fecha la formalización el «martes 9». El diario de sesiones del Senado del 11 de
  octubre de 2023 la ubica un día después, por dos vías. La primera es el calendario: el texto de la
  citación, fechado el 10 de octubre, convoca a la sesión de «mañana miércoles 11 de octubre», de
  modo que en esa semana el 11 fue miércoles, el 10 martes y el 9 lunes, y «martes 9» no corresponde
  a ningún día de ese calendario. La segunda son las intervenciones de la propia sesión: al
  fundamentar el voto de remoción, un senador dice «En el día de ayer, un exsenador de la república
  recibió veintidós imputaciones», y otro, de distinta bancada, dice «En el día de ayer la jueza
  recibió la imputación de la fiscala donde solicita a la justicia la prisión preventiva del senador
  por once delitos de retribución a la explotación sexual de menores de edad». La diferencia es de
  un día en la fecha; el resto de lo que la nota enumera (22 delitos, sus categorías, la jueza y la
  fiscal actuantes) coincide con las demás fuentes leídas, y otras tres notas de tres grupos
  distintos fechan la formalización el 10 de octubre de 2023. El registro del lote fija el 10 de
  octubre en el campo `fecha` del hito y deja la cita del medio sin editar, como corresponde."
