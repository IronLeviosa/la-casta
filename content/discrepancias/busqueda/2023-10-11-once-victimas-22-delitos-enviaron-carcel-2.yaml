      titulo: Diario de Sesiones de la Cámara de Senadores, 40.ª sesión ordinaria, 11 de octubre de 2023
      cita: «Montevideo, 10 de octubre de 2023 La CÁMARA DE SENADORES se reunirá en sesión ordinaria,
        mañana miércoles 11 de octubre, a las 09:30, a fin de informarse de los asuntos entrados y
