analisis: 'La nota publica que el cuerpo legislativo no votó el pedido de desafuero. El diario de
  sesiones de la Cámara de Senadores del 30 de setiembre de 2020 registra que sí lo votó, y que lo
  votó de forma nominal: el acta recoge el voto de cada senador uno por uno y el resultado, quince
  por la afirmativa y dieciséis por la negativa sobre treinta y un sufragantes. La misma nota fecha
  el pedido del fiscal en marzo de 2020, mientras que el mismo diario de sesiones recoge que "el 24
  de setiembre de 2019 […] el fiscal Morosoli Díaz actúa […] y solicita la formalización" y la
  agencia EFE (2025-08-29) fecha el pedido de desafuero el 1 de noviembre de 2019; esa segunda
  diferencia no se registra acá porque el diario de sesiones prueba lo que se dijo en sala sobre la
  fecha, no el acto del fiscal. Qué cambia la diferencia: "no lo votó" y "lo votó y no alcanzó los
  dos tercios" describen dos hechos institucionales distintos, y solo el segundo permite ver quién
  votó qué, que es lo que el acta nominal registra. Se registra qué publicó el medio y qué dice el
  diario de sesiones, sin afirmar nada sobre por qué difieren.'
