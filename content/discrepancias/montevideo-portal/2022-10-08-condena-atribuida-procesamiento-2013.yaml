analisis: 'Lo publicado sitúa la condena en 2013 y la describe como cumplida ese año ("la condena
  que cumplió en 2013 en la cárcel de Las Rosas"). La versión taquigráfica de la sesión del Senado
  del 12 de octubre de 2022 registra otra secuencia, y la registran de forma concordante las dos
  partes del debate: el subsecretario del Interior dice que el procesamiento fue el 17 de marzo de
  2013 y la condena el 5 de setiembre de 2014, y que la privación de libertad de 2013 "no es pena,
  es medida cautelar"; el senador de la oposición que convocó la sesión dice que la condena es de
  setiembre de 2014 y que no la cumplió en prisión. La diferencia no es de matiz en este asunto: la
  distinción entre procesamiento con prisión preventiva y condena es la que define si una persona
  tiene o no un antecedente penal, que es el hecho en discusión en toda la nota. No se evalúa acá si
  la nota usa "condena" en el sentido corriente de "estuvo preso por una causa penal", ni si la
  frase reproduce el modo en que la fuente ministerial se lo explicó al medio; la nota se publicó
  cuatro días antes de la sesión y se registra la distancia contra el documento, no lo que el medio
  podía saber ese día.'
