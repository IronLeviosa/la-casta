  titulo: El oficio de la Justicia con el que Interior argumenta que Astesiano no posee antecedentes
  cita: Según explicaron desde el Ministerio del Interior a Montevideo Portal, la investigación
    interna hasta ahora ha podido arrojar que en 2015 “alguien” entró al SGSP y dejó solamente las
    indagaciones, quitando la condena que cumplió en 2013 en la cárcel de Las Rosas (Maldonado).
  retrieved_at: 2026-09-07
