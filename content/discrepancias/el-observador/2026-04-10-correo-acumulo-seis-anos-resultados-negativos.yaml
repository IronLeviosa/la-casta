analisis: >-
  La nota dice que con los estados financieros de 2025 el Correo "completó seis años consecutivos de
  déficit" y enumera 2020 a 2025 como esa racha. Los estados financieros auditados de los ejercicios
  anteriores muestran resultado negativo también en 2019 ($ 1.227.135.000) y en 2018 ($
  1.097.351.549), y lo mismo en 2017, 2016, 2015 y 2014 según cada balance propio. El informe de
  auditoría de 2019, del mismo estudio que la nota cita para 2025, ya usaba la fórmula "pérdidas
  operativas recurrentes que podrian generar incertidumbre". Las seis cifras que la nota enumera
  coinciden con los balances; lo que los documentos no respaldan es que la racha empiece en 2020,
  porque en 2019 y antes también hubo pérdida. Queda dicho sin suponer por qué: una lectura posible
  es que el conteo arranque en el quinquenio 2020-2024 (la nota anterior del mismo medio, del
  2025-04-22, hablaba de "cinco años" y comparaba "con el comienzo del quinquenio (2020)"), y en ese
  caso el número describiría el período revisado y no la racha.

  Editor: se publica. "Completó seis años consecutivos de déficit" es, en el uso corriente, una
  afirmación sobre la duración de la racha, no sobre una ventana de análisis arbitraria; el propio
  balance de 2019 -del mismo estudio de auditoría que la nota cita para 2025- ya documentaba
  pérdidas operativas recurrentes antes de 2020, y los balances propios de 2013 a 2019 (ver
  empresas.yaml de esta misma corrida) muestran resultado negativo todos esos años. Un lector que
  lea "seis años" se lleva la idea de una racha más corta que la real.
