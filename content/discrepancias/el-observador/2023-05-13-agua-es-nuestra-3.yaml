  titulo: El agua es nuestra
  cita: A consecuencia de ese plebiscito el artículo 47, establece que “el agua es un recurso natural
    esencial para la vida, que su acceso así como al saneamiento constituyen derechos humanos
    fundamentales y que es competencia del Estado garantizar a la población dichos servicios”.
  retrieved_at: 2026-09-08
