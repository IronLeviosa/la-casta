      medio: impo
      fecha: 1967-02-02
      tipo: documento_oficial
      titulo: Constitución de la República Oriental del Uruguay, artículo 47
      cita: 3) El servicio público de saneamiento y el servicio público de abastecimiento de agua para el
        consumo humano serán prestados exclusiva y directamente por personas jurídicas estatales.
      retrieved_at: 2026-09-08
analisis: 'Lo publicado presenta entre comillas, atribuido al artículo 47, un texto que no figura en
  el artículo. Las dos primeras oraciones de la cita publicada sí están en el artículo, con otra
  puntuación ("El agua es un recurso natural esencial para la vida. El acceso al agua potable y el
  acceso al saneamiento, constituyen derechos humanos fundamentales."). La tercera no: donde lo
  publicado dice que "es competencia del Estado garantizar a la población dichos servicios", el
  numeral 3) del artículo dice que los servicios "serán prestados exclusiva y directamente por
  personas jurídicas estatales". La diferencia entre garantizar la prestación y prestar en forma
  exclusiva y directa es la regla que decide si un prestador no estatal puede intervenir, que es el
  asunto sobre el que trata la nota.'
