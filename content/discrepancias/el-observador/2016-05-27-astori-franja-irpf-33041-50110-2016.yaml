analisis: >-
  Presidencia, al informar el anuncio del ministro de Economía del 23 de mayo de 2016, ubica la
  tercera franja del IRPF entre 33.400 y 50.100 pesos. La nota, publicada cuatro días después, la
  ubica en un párrafo entre $33.041 y $50.110. Esos dos límites no coinciden con el documento.


  En otro párrafo, la misma nota cita a Astori con la franja «entre $ 33.401 y $ 50.100», que
  corresponde a la del documento (desde el peso siguiente a los 33.400 hasta los 50.100).
