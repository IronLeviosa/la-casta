analisis: 'Los dos documentos oficiales del Parlamento sobre la sesión extraordinaria n.° 13 de la
  Asamblea General que resolvió no levantar el veto a la ley de salud sexual y reproductiva —la
  ficha de trámite del asunto y el índice de diarios de sesión de la legislatura XLVI— fechan esa
  sesión el jueves 20 de noviembre de 2008 (Diario N.° 54, Tomo 88). La nota de 180.com.uy sobre la
  misma sesión (mismo contenido: los legisladores Semproni, Roballo, Heber y Sauval que cita también
  aparecen en el trámite oficial), actualizada el 21 de noviembre de 2008, describe la sesión como
  ocurrida "este miércoles", es decir el 19 de noviembre. El día de la semana que da la nota no
  coincide con la fecha calendario que consta en los documentos oficiales. No se evalúa acá si la
  sesión pudo haber comenzado la noche del miércoles 19 y extendido su cierre formal al jueves 20
  (lo que sería compatible con ambos relatos sin que hubiera un error de fondo sobre qué ocurrió);
  solo se registra que el día de la semana mencionado por la nota no coincide con la fecha del
  documento oficial.'
