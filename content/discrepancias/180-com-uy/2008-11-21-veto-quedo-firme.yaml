  titulo: El veto quedó firme
  cita: Los votos en la Asamblea General no fueron suficientes para levantar el veto que el presidente
    Tabaré Vázquez impuso a los artículos de la ley de Salud Sexual que despenalizaban el aborto. La
    sesión, que se desarrolló este miércoles, duró tres horas.
